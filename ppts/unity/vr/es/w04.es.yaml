        - head: Hacer el trabajo por cuadro en el lugar correcto
          sub: ProcessInteractable y su fase de actualización, en vez del Update de un MonoBehaviour
        - head: Leer los argumentos del evento sin riesgo
          sub: Valen durante la llamada y no un cuadro después, cosa que la documentación dice con todas sus letras

