      unit: Sesión 04 · Desarrollo de VR intermedio · Interacciones propias
      title: Desarrollo de VR
      subtitle: >-
        El inspector se acaba cuando el objeto tiene una regla propia. Hoy el paro de
        emergencia recibe un componente y un estado.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, UNITY · Principiante]
        - [Sesión, 4 de 5]
        - [Basado en, Unity Learn · VR Development]
      notes: |
        Sesión acompañante de la ruta de Unity Learn VR Development,
        learn.unity.com/pathway/vr-development. Los nombres de clase, las firmas de los
        métodos y el atributo salen de la referencia de API del XR Interaction Toolkit 3.5.
        El paro de emergencia, el arranque del motor y cada línea de los scripts de aquí se
        escribieron para este curso. Nada reproduce los ejemplos de Unity.

        La regla de enclavamiento es la del curso de algoritmos, semana 8. La máquina solo
        se arma con la puerta de guarda cerrada, el paro liberado y el eje por debajo de 50
        rpm. Aquí es la misma regla, cableada a un botón que sí se puede presionar.

  - agenda:
