          sub: Uno es cableado para un solo objeto, el otro es comportamiento que hereda cada copia
        - head: Escribir un interactable propio
          sub: Heredando de XRBaseInteractable, con la llamada a base que mantiene vivos los eventos
        - head: Sostener estado a lo largo de una interacción
