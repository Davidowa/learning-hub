slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Sesión 03 · Desarrollo de VR para principiantes · El toolkit de interacción
      title: Desarrollo de VR
      subtitle: >-
        Tres componentes hacen que una escena se pueda alcanzar. Esta sesión es qué son,
        cómo se encuentran, y el piso sobre el que están parados los tres.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, UNITY · Principiante]
        - [Sesión, 3 de 5]
        - [Basado en, Unity Learn · VR Development]
      notes: |
        Sesión acompañante de la ruta de Unity Learn VR Development,
        learn.unity.com/pathway/vr-development. Los nombres de componentes, los namespaces
        y los modos de tracking origin salen del manual y la referencia de API del XR
        Interaction Toolkit 3.5. La escena, los scripts y las fallas se escribieron para
        este curso, y nada de aquí reproduce los ejemplos de Unity.

        La escena del banco a esta altura tiene piso, mesa de trabajo, un motor con puerta
        de guarda, un paro de emergencia, un torquímetro y una carátula de tacómetro. Hoy
        solo el torquímetro se puede agarrar. El botón de paro recibe su propio componente
        en la sesión 4.

