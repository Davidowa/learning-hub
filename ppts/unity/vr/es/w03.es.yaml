  - pitfalls:
      eyebrow: Bloque 02 · Errores comunes
      title: Cuatro razones por las que un objeto no contesta
      items:
        - label: Error 01
          title: El interactable sin collider
          desc: >-
            El componente está y el objeto está registrado, y la mano lo sigue atravesando.
            Nada puede seleccionar lo que no tiene collider con el que ser encontrado.
        - label: Error 02
          title: Las acciones nunca se habilitaron
          desc: >-
            No hay Input Action Manager en la escena, así que los controles rastrean y ningún
            botón reporta nada. Todo se ve correcto y nada responde.
        - label: Error 03
          title: Un segundo interaction manager
          desc: >-
            Una escena aditiva trae el suyo, medio banco se registra ahí, y los objetos dejan
            de contestarle a la mano que claramente está dentro de ellos.
        - label: Error 04
          title: Suscrito dos veces, nunca quitado
          desc: >-
            El objeto se deshabilitó y se volvió a habilitar. La lista de listeners creció y
            el sonido ahora suena tres veces en un solo agarre.

  - divider:
      eyebrow: Bloque 03
      title: El piso donde estás parado
      lede: Antes de poder alcanzar cualquier cosa, la escena tiene que ponerse de acuerdo con el cuarto sobre dónde está el piso.
      block: 3

  - concept:
      eyebrow: Concepto clave
      title: El origin se mueve, la cámara nunca
      lead: >-
        El XR Origin es el objeto que se teletransporta, gira y sube. La cámara que cuelga de
        él la maneja la cabeza y nada más. Dónde queda el piso dentro de ese rig es asunto
        del tracking origin mode.
      panel:
        label: Qué decide el modo
        title: Si tecleas a mano la altura de los ojos
        note: >-
          En modo Floor el runtime sabe dónde está el piso real y deja el offset en cero. En
          modo Device no lo sabe, así que el offset es un número que eliges y pruebas.
      steps:
        - text: Modo Floor, el runtime pone el piso
        - text: Modo Device, tú pones la altura
        - text: Not Specified, decide el runtime
        - text: La locomoción siempre mueve el origin
          loop: ↺ y un usuario sentado en modo Floor sigue quedando debajo del banco

  - table:
      eyebrow: Bloque 03 · Los tres modos
      title: Tres tracking origin modes, y qué asume cada uno
      headers: [Modo, Dónde está el cero, Qué tienes que hacer]
      rows:
        - ["Floor", "En el piso real", "Nada, el offset queda en cero"]
        - ["Device", "Donde empezó la cabeza", "Teclear el offset Y de la cámara"]
        - ["Not Specified", "Lo que escoja el runtime", "Probar en cada dispositivo"]

  - stat:
      eyebrow: Medido en la escena del banco
      value: 1.36 m
      text: El offset Y de la cámara que usa esta escena cuando corre en modo Device
      note: >-
        No es un estándar, es el valor que dejó el tacómetro a la altura de los ojos de las
        tres personas que probaron la escena. Quien arme una versión sentada del banco va a
        medir otro, y esa medición es el trabajo.

  - steps:
      eyebrow: Bloque 03 · Locomoción
      title: Cinco paradas hacia una escena que se puede cruzar
      items:
        - label: '01'
          title: Importa los samples
          desc: Los starter assets traen un rig con los interactores ya puestos.
        - label: '02'
          title: Agrega los proveedores
          desc: Teletransporte y snap turn, en el objeto de locomoción.
        - label: '03'
          title: Marca el piso
          desc: Un área de teletransporte en la parte caminable, y en ningún otro lado.
        - label: '04'
          title: Ancla las estaciones
          desc: Un teleport anchor en el extremo del motor, viendo al banco.
        - label: '05'
          title: Ajusta el giro
          desc: Un paso fijo por presión, con un retardo corto antes de que ocurra.

  - quiz:
      eyebrow: Verificación rápida
      question: El objeto del banco se deshabilita y se habilita dos veces. ¿Qué registra el siguiente agarre?
      filename: WrenchLog.cs
      lang: csharp
      source: |
        void OnEnable()
        {
            grab.selectEntered.AddListener(Held);
        }
      options:
        - Un renglón, un UnityEvent guarda cada listener una sola vez
        - Tres renglones, uno por cada habilitación que no devolvió su listener
        - Nada, porque deshabilitar el objeto soltó el listener
        - Un error, porque el mismo método no se puede agregar dos veces

  - trace:
      eyebrow: Respuesta
      title: La lista de listeners, contada en cada paso
      headers: [Paso, Listeners después, Renglones en un agarre]
      rows:
        - ["Habilita, primera vez", "1", "1"]
        - ["Deshabilita", "1, sigue puesto", "0, el objeto está apagado"]
        - ["Habilita, segunda vez", "2", "2"]
        - ["Habilita, tercera vez", "3", "3"]
      verdict: >-
        AddListener agrega, no revisa. El deshabilitar nunca quitó nada porque nadie se lo
        pidió, así que la cuenta solo sube. Un RemoveListener en OnDisable deja esto en un
        renglón por el resto de la vida del proyecto.

  - lab:
      eyebrow: Laboratorio
      title: El torquímetro, y llegar al otro extremo
      brief: >-
        Partiendo de tu build de la sesión 2, haz que el torquímetro se pueda agarrar con
        cualquier mano, registra qué mano lo tomó, marca el piso caminable y pon un teleport
        anchor en el extremo del motor del banco. Después póntelo y haz la pasada de revisión
        de la sesión 1.
      blocks:
        - label: Restricción
          text: Solo snap turn. Nada de locomoción con palanca en esta escena, por lo dicho en la sesión 1.
        - label: Entregable
          text: La escena, el log del dispositivo y cuatro renglones de la pasada de revisión.
        - label: Criterio
          text: Que el torquímetro se levante desde un teleport anchor sin inclinarse ni estirarse.

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: El manager está entre todo
          desc: Interactores e interactables solo conocen el registro al que entraron cuando se habilitaron.
        - title: Cada suscripción se quita
          desc: La lista de listeners es el bug más callado del toolkit, y nunca deja de crecer.
        - title: El modo decide quién mide
          desc: Floor le pregunta al runtime, Device te pregunta a ti, y Not Specified le pregunta al dispositivo.

  - homework:
      eyebrow: Para la próxima sesión
      title: El botón de paro, cableado sin una línea de código
      brief: >-
        Agrega un poke interactor a una mano y haz que el paro de emergencia le responda solo
        con cableado del inspector, un sonido y un cambio de color. Escribe media página
        sobre lo que ese arreglo no puede hacer, porque la sesión 4 trata justo de ese hueco.
      meta:
        - [Entrega, Antes de la sesión 4]
        - [Formato, Blackboard · escena y PDF]
        - [Peso, Parte del promedio de tareas]
      rubric:
        - ["Responde", "40 %", "El paro contesta un poke en el dispositivo, no solo en Play mode"]
        - ["Cableado limpio", "30 %", "Un interactable, un collider, sin listeners duplicados"]
        - ["El hueco", "30 %", "Media página sobre lo que el inspector solo no pudo expresar"]

