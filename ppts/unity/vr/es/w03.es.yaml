      rows:
        - ["Near-Far", "De cerca y a distancia", "El torquímetro y el estante"]
        - ["Poke", "Una yema del dedo", "El botón de paro y el panel"]
        - ["Gaze", "Lo que se está mirando", "Manos ocupadas, o sin controles"]
        - ["Teleport", "Un pedazo de piso marcado", "Llegar al otro extremo"]

  - code:
      eyebrow: Bloque 02 · Tu método
      title: El método que llama el torquímetro
      filename: WrenchLog.cs
      lang: csharp
      source: |
        using UnityEngine;
        using UnityEngine.XR.Interaction.Toolkit;
        using UnityEngine.XR.Interaction.Toolkit.Interactables;

        public class WrenchLog : MonoBehaviour
        {
            [SerializeField] Renderer dial;
            public void Held(SelectEnterEventArgs a)
            {
                var by = a.interactorObject.transform.name;
                Debug.Log($"torquímetro en {by}");
                dial.material.color = Color.green;
            }
        }
      annotations:
        - label: public, un argumento
          text: >-
            El inspector solo lista métodos públicos que reciben un argumento del tipo del
            propio evento.
        - label: El argumento
          text: >-
            Trae qué mano lo hizo. Lee lo que necesites dentro de la llamada y no te quedes
            con el objeto después.
        - label: Dos usings
          text: >-
            Los args viven en el namespace del Toolkit, y los componentes un nivel abajo,
            en Interactables.
        - label: Riesgo
          text: >-
            Tocar .material clona el material de este objeto. La sesión 5 mide lo que eso
            cuesta.
          accent: true

  - code_output:
      eyebrow: Bloque 02 · Medido
      title: El mismo torquímetro, con una mano o la otra
      filename: WrenchLog.cs
      lang: csharp
      output_label: Consola, en el dispositivo
      source: |
        public void Held(SelectEnterEventArgs a)
        {
            var by = a.interactorObject.transform.name;
            Debug.Log($"torquímetro en {by}");
        }
      output: |
        torquímetro en HandR
        torquímetro en HandL
        torquímetro en HandR

