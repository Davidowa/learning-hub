  - divider:
      eyebrow: Bloque 01
      title: Las tres partes de una escena que alcanza
      lede: Un origin que carga la cabeza y las manos, objetos que se pueden alcanzar, y algo en medio que mantiene separados a los dos.
      block: 1

  - diagram:
      eyebrow: Bloque 01 · El intermediario
      title: Aquí nadie le habla a nadie de forma directa
      blocks:
        - label: Interactor
          title: La mano
          desc: Near-Far, poke, gaze o teleport, uno o más por control
        - label: Manager
          title: XR Interaction Manager
          desc: Tiene el registro, empareja manos con objetos y levanta los eventos
          dark: true
        - label: Interactable
          title: El torquímetro
          desc: Un collider, un componente y una lista de métodos por llamar
      note: >-
        Las flechas van en los dos sentidos y pasan por el medio. Esa indirección es lo que
        te deja cambiar un rayo por un poke sin editar un solo objeto del banco.

  - concept:
      eyebrow: Concepto clave
      title: El registro ocurre en OnEnable, no en el inspector
      lead: >-
        Un interactor y un interactable nunca guardan una referencia el uno del otro. Cada
        quien se registra con el manager cuando se habilita y se da de baja cuando se
        deshabilita. De ahí en adelante el manager hace el emparejamiento.
      panel:
        label: Dónde muerde el orden de carga
        title: El manager se puede crear solo, sin avisar
        note: >-
          Si un componente no encuentra manager, puede crear uno por omisión, cosa cómoda
          hasta que una escena aditiva trae un segundo manager y medio banco se registra en
          el equivocado.
      steps:
        - text: Habilita el objeto y entra al registro
        - text: Deshabilítalo y se sale otra vez
        - text: El manager empareja cada cuadro
        - text: Tu código cuelga de los eventos
          loop: ↺ y un objeto deshabilitado en la carga nunca se anuncia

  - table:
      eyebrow: Bloque 01 · La lista de partes
      title: Cinco componentes, y para qué sirve cada uno
      headers: [Componente, Qué hace, Dónde vive]
      rows:
        - ["XR Interaction Manager", "Tiene el registro", "Un objeto vacío"]
        - ["XR Origin", "Carga cabeza y manos", "La raíz del rig"]
        - ["Near-Far Interactor", "Alcanza cerca y lejos", "Uno por mano"]
        - ["XR Grab Interactable", "Hace que un objeto se levante", "En el torquímetro"]
        - ["Input Action Manager", "Habilita las acciones", "Junto al origin"]

  - code:
      eyebrow: Bloque 01 · El registro, impreso
      title: Ver al banco anunciarse solo
      filename: BenchRegistry.cs
      lang: csharp
      source: |
        [SerializeField] XRInteractionManager manager;

        void OnEnable()
        {
            manager.interactableRegistered += Added;
        }

        void OnDisable()
        {
            manager.interactableRegistered -= Added;
        }
      annotations:
        - label: Dónde va
          text: >-
            En un MonoBehaviour en la raíz del banco. Asignado en el inspector, para que no
            tome el manager de otra escena.
        - label: El evento
          text: >-
            Lo levanta el manager cuando un interactable se habilita. Es un evento de C#
            común, no un UnityEvent.
        - label: Simetría
          text: >-
            Cada += tiene su -= en el OnDisable. En eso consiste la disciplina de
            suscribirse a algo.
        - label: Riesgo
          text: >-
            Sin el OnDisable, el manejador corre una vez por cada habilitación que no lo
            devolvió.
          accent: true

  - code_output:
      eyebrow: Bloque 01 · Medido
      title: Qué imprime el banco al cargar
      filename: BenchRegistry.cs
      lang: csharp
      output_label: Consola, al entrar a Play mode
      source: |
        void Added(InteractableRegisteredEventArgs a)
        {
            var t = a.interactableObject.transform;
            Debug.Log($"registrado {t.name}");
        }
      output: |
        registrado Wrench
        registrado EStop
        registrado GuardDoor
        registrado Tachometer

