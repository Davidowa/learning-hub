slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Session 04 · Intermediate VR development · Custom interactions
      title: VR Development
      subtitle: >-
        The inspector runs out when the object has a rule of its own. Today the emergency
        stop gets a component and a state.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, UNITY · Beginner]
        - [Session, 4 of 5]
        - [Based on, Unity Learn · VR Development]
      notes: |
        Companion session to the Unity Learn pathway VR Development,
        learn.unity.com/pathway/vr-development. Class names, method signatures and the
        attribute come from the XR Interaction Toolkit 3.5 API reference. The emergency
        stop, the motor drive and every line of the scripts here were written for this
        course. Nothing reproduces Unity's own examples.

        The interlock rule is the one from the algorithms course, week 8: the machine only
        arms when the guard door is closed, the stop is released and the shaft is below
        50 rpm. Here it is the same rule, wired to a button you can actually press.

  - agenda:
      eyebrow: Agenda
      title: Three working blocks
      cards:
        - title: Two doors into the toolkit
          desc: A method the inspector calls, or a component that inherits the behaviour
        - title: A stop that latches
          desc: State that survives the release, and a reset that is not the button
        - title: Work that happens every frame
          desc: The update phase, and the one rule about what you may allocate in it

  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Choose between an event and an override
          sub: One is wiring for a single object, the other is behaviour every copy inherits
        - head: Write an interactable of your own
          sub: Inheriting from XRBaseInteractable, with the base call that keeps the events alive
        - head: Hold state across an interaction
          sub: A latch that stays closed after the finger leaves, and a reset that is deliberate
        - head: Do per-frame work in the right place
          sub: ProcessInteractable and its update phase, rather than a MonoBehaviour Update
        - head: Read the event arguments safely
          sub: They are valid during the call and not one frame after it, which the docs say plainly

