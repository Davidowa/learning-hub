slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Session 03 · Beginner VR development · The interaction toolkit
      title: VR Development
      subtitle: >-
        Three components make a scene reachable. This session is what they are, how they
        find each other, and the floor they all stand on.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, UNITY · Beginner]
        - [Session, 3 of 5]
        - [Based on, Unity Learn · VR Development]
      notes: |
        Companion session to the Unity Learn pathway VR Development,
        learn.unity.com/pathway/vr-development. Component names, namespaces and the
        tracking origin modes are taken from the XR Interaction Toolkit 3.5 manual and
        API reference. The scene, the scripts and the failures are written for this
        course, and nothing here reproduces Unity's own examples.

        The bench scene at this point: a floor, a workbench, a motor with a guard door,
        an emergency stop, a torque wrench and a tachometer dial. Only the wrench is
        grabbable today. The stop button gets its own component in session 4.

  - agenda:
      eyebrow: Agenda
      title: Three working blocks
      cards:
        - title: The three parts
          desc: An origin, a manager and an interactor, and how they find each other
        - title: What answers a hand
          desc: Interactables, the events they raise, and where your method goes
        - title: The floor you stand on
          desc: Tracking origin mode, teleporting, and turning without the nausea

  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Build a scene that reaches
          sub: An XR Interaction Manager, an XR Origin and one interactor per hand, and no more
        - head: Explain how registration works
          sub: Components find their manager in OnEnable, which is why load order shows up as bugs
        - head: Bind a method to a select event
          sub: In the inspector or in code, and say what each way costs you later
        - head: Choose the tracking origin mode
          sub: Floor when the runtime knows the floor, Device when you have to type the height in
        - head: Set up teleporting and snap turning
          sub: The two locomotion providers this course allows in the bench scene, and why those two

