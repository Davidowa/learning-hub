meta:
  course: VR Development
  code: UNITY
  lang: en
  language: unity
  week: 1
  footer: VR DEVELOPMENT · UNITY LEARN
  blocks: 3

slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Session 01 · Beginner VR design · Judging a build
      title: VR Development
      subtitle: >-
        A build is judged from inside the headset. This session is the pass you make while
        wearing it, and the note that comes out of it.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, UNITY · Beginner]
        - [Session, 1 of 5]
        - [Based on, Unity Learn · VR Development]
      notes: |
        These five sessions are a companion to the Unity Learn pathway VR Development,
        at learn.unity.com/pathway/vr-development. The pathway supplies the skill list
        and the order. Nothing on these slides reproduces Unity's wording, exercises or
        assets: the scene, the numbers and the code are written for this course.
        Students are expected to work through the official pathway themselves.

        The running example for all five sessions is the belt drive bench, the same rig
        the algorithms course uses on paper, rebuilt as a VR training scene: a motor, a
        guard door, an emergency stop, a torque wrench and a tachometer dial.

  - agenda:
      eyebrow: Agenda
      title: Three working blocks
      cards:
        - title: What a build is judged on
          desc: Four things a headset shows and a play-mode window cannot
        - title: Where the discomfort starts
          desc: The mismatch that causes it, and the three answers that remove it
        - title: The review pass
          desc: Five steps worn, and one page written afterwards
        - title: Your turn
          desc: Two pairs, one bench scene, one page of findings each

  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Review a build from inside it
          sub: With a pass that has an order, so two people reviewing the same scene write comparable notes
        - head: Name the mechanism behind the nausea
          sub: Eyes reporting motion the inner ear never felt, and the three design answers to it
        - head: Separate an opinion from an instruction
          sub: A note says where you stood, what you did, what happened and what you would change
        - head: Measure one thing per pass
          sub: Reach, eye height or reading distance, because a number survives the walk to the desk
        - head: Say what the hardware decides
          sub: And carry that into session 2, where the headset stops being an abstraction

  - roadmap:
      eyebrow: Course map
      title: Five sessions beside a six week pathway
      phases:
        - label: '01 · Session 1'
          title: Judging a build
          desc: Presence, comfort and the note you write
          state: now
        - label: '02 · Session 2'
          title: Headset and build
          desc: Choosing hardware, and Android settings
          state: todo
        - label: '03 · Session 3'
          title: Interaction toolkit
          desc: Origin, interactors and interactables
          state: todo
        - label: '04 · Session 4'
          title: Your own code
          desc: Custom interactables and select events
          state: todo
        - label: '05 · Session 5'
          title: The frame budget
          desc: Measuring milliseconds on the device
          state: todo

  - divider:
      eyebrow: Block 01
      title: What a build is judged on
      lede: Four things a headset shows you at once, and none of them survive the trip to a monitor.
      block: 1

  - concept:
      eyebrow: Key concept
      title: The monitor shows the scene, not the experience
      lead: >-
        Play mode tells you the objects sit where you put them. It does not tell you the wrench is
        40 cm above a seated reach, that the guard door swings through the user's face, or that
        the motor label is a smear at arm's length.
      panel:
        label: The question that starts a review
        title: What did the headset show that the Editor hid?
        note: >-
          If the answer is nothing, the review has not happened. Wear the build before you
          write a word about it.
      steps:
        - text: Put the build on the device and wear it
        - text: Do the task the scene was built for
        - text: Write what broke, in the order it broke
        - text: Change one thing, then wear it again
          loop: ↺ one thing means one, or you cannot say which change worked

  - table:
      eyebrow: Block 01 · The gap
      title: Five checks, and what each surface reports
      headers: [Check, On the monitor, In the headset]
      rows:
        - ["Scale", "The bench looks right", "It sits at knee height"]
        - ["Reach", "All of it is in frame", "The wrench is behind the shoulder"]
        - ["Text", "Legible at 100 percent", "A smear at arm's length"]
        - ["Turning", "Smooth", "People reach for the wall"]
        - ["Feedback", "The log prints", "Nothing answers the hand"]

  - diagram:
      eyebrow: Block 01 · The loop
      title: A review is a loop, not a verdict
      blocks:
        - label: '01'
          title: Wear the build
          desc: On the device the class uses, with the task in mind
        - label: '02'
          title: Write the failures
          desc: In the order they happened, with where you were standing
        - label: '03'
          title: Change one thing
          desc: Then wear it again and see whether the note still holds
          dark: true
      note: >-
        The loop is what makes a review worth the hour. A verdict, however well argued,
        ends the conversation and changes nothing in the scene.

  - tiers:
      eyebrow: Block 01 · The four criteria
      title: What you are actually looking for in there
      items:
        - key: Presence
          title: Does the space hold
          desc: Floor at the right height, hands where you expect them, scale that matches the body
        - key: Comfort
          title: Can it be worn twice
          desc: Turning, moving and starting. A scene that costs a lie-down has failed already
        - key: Legible
          title: Can it be read
          desc: Labels, dials and menus at the distance the task actually puts them
        - key: Agency
          title: Does it answer you
          desc: Every reach, press and grab gives something back within the same frame

  - stat:
      eyebrow: The pathway this course sits beside
      value: 6 weeks
      text: What Unity states its VR Development pathway takes to complete
      note: >-
        These five sessions do not replace it. They are what happens in the room while you
        work through it, and the pathway is where the tutorials and the projects live. Its
        address is on the last slide of every deck.

  - divider:
      eyebrow: Block 02
      title: Where the discomfort starts
      lede: It is not a matter of getting used to it. It is a disagreement between two senses, and the scene causes it.
      block: 2

  - concept:
      eyebrow: Key concept
      title: Eyes reporting motion the inner ear never felt
      lead: >-
        Push the stick forward and the view slides across the room. The inner ear, which settles
        arguments about motion, reports that nothing moved. Every comfort option is an attempt to
        remove that disagreement.
      panel:
        label: The rule the bench scene follows
        title: The camera is never moved by a script
        note: >-
          Move the XR Origin and the camera follows, still driven by the head. Move the
          camera and you have taken the user's head off them.
      steps:
        - text: The head drives the camera, always
        - text: Locomotion moves the origin under it
        - text: Turning happens in fixed steps
        - text: Nothing accelerates the view
          loop: ↺ and every one of these is a setting, not an opinion

  - table:
      eyebrow: Block 02 · Cause and answer
      title: Five sources, and what the scene does instead
      headers: [Source, What the user feels, What the scene does]
      rows:
        - ["Stick locomotion", "The floor slides, the body does not", "Teleport to a marked spot"]
        - ["Free turning", "The room swings past", "Snap turn, one step a press"]
        - ["Acceleration", "A lurch at the start", "Constant speed, no ramp"]
        - ["Camera in script", "The head is not their own", "Move the XR Origin"]
        - ["UI on the face", "It cannot be looked away from", "A panel parked in the world"]

  - pitfalls:
      eyebrow: Block 02 · Common errors
      title: Four design mistakes that come back as complaints
      items:
        - label: Error 01
          title: Moving the camera from a script
          desc: >-
            The head keeps driving the camera pose, so your translation fights the tracking
            and the view jitters. Locomotion belongs on the XR Origin.
        - label: Error 02
          title: A menu welded to the head
          desc: >-
            Anything parented to the camera cannot be looked away from, and the eyes never
            get to converge on it. Park the panel in the world and let the user turn to it.
        - label: Error 03
          title: Text sized for a monitor
          desc: >-
            A label that reads at 100 percent on a 27 inch screen is a smear at 60 cm in a
            headset. Size text by the distance the task puts it at, and then wear it.
        - label: Error 04
          title: A grab with nothing coming back
          desc: >-
            If the wrench does not move, click, highlight or resist, the hand has no way of
            knowing it worked. The user grabs again, and now there are two problems.

  - divider:
      eyebrow: Block 03
      title: The pass, and the note
      lede: A review that changes a build is written to a shape. Here is the shape.
      block: 3

  - method:
      eyebrow: The method
      title: One pass, five steps, one page
      statement: >-
        A note that changes a build says where you were standing, what you did, what
        happened and what you would change. Anything missing one of the four is a
        feeling with a timestamp.
      points:
        - label: Where
          text: The place in the scene, not the name of the level. Standing at the motor end.
        - label: What happened
          text: The observable thing. The hand closed on nothing, the panel clipped the wall.
        - label: The change
          text: One edit, small enough that the next pass can tell whether it worked.

  - steps:
      eyebrow: Block 03 · The pass
      title: Five steps, in this order
      items:
        - label: '01'
          title: Wear it cold
          desc: No notes, no pen. One run of the task from start to end.
        - label: '02'
          title: Run it again
          desc: Stop at every place the first run went wrong.
        - label: '03'
          title: Measure one thing
          desc: Reach, eye height or reading distance. A number travels.
        - label: '04'
          title: Write the note
          desc: Where, what you did, what happened, what you would change.
        - label: '05'
          title: Change one thing
          desc: One. Then the pass starts again at step one.

  - table:
      eyebrow: Block 03 · The rubric
      title: Four criteria, and what each one asks you to write
      headers: [Criterion, What you look at, What you write down]
      rows:
        - ["Presence", "Scale and floor height", "Where the illusion broke"]
        - ["Comfort", "Turning and moving", "The minute it started"]
        - ["Legibility", "Text and dials", "The distance you read it at"]
        - ["Agency", "What answers the hand", "The action with no reply"]
        - ["Task", "Can the job be done", "The step that stalled"]

  - concept:
      eyebrow: Block 03 · The note
      title: Two notes about the same wrench
      lead: >-
        The first note is true and useless. The second one sends someone to a transform and
        a number. Both were written by people who wore the same build, and only one of them
        will be in the next version of the scene.
      panel:
        label: Written on the same afternoon
        title: One is an opinion, the other is an instruction
        note: >-
          The grabbing felt awkward, against, standing at the motor end the wrench sat above
          my shoulder and I had to stand up to reach it.
      steps:
        - text: 'Where: standing at the motor end'
        - text: 'What: reached for the torque wrench'
        - text: 'Happened: the hand closed on nothing'
        - text: 'Change: drop the socket 12 cm'
          loop: ↺ four lines, and the next build can act on all four

  - quiz:
      eyebrow: Quick check
      question: A tester says the scene made them dizzy. Which note is worth acting on?
      options:
        - Dizzy after two minutes, the scene needs work on comfort
        - Dizzy at the motor end, standing still, after four stick turns
        - The scene is uncomfortable and should use teleport instead
        - Three of the five testers reported some discomfort

  - trace:
      eyebrow: Answer
      title: Only one of the four sends anyone to a setting
      headers: [Note, Where, What was done, Actionable]
      rows:
        - ["A", "not said", "not said", "No"]
        - ["B", "motor end", "4 stick turns", "Yes"]
        - ["C", "not said", "a fix, not a fact", "No"]
        - ["D", "not said", "a count", "Keep the count"]
      verdict: >-
        B names a place, an action and a number, so the next pass can change the turn
        provider and repeat it. C skips straight to a remedy and hides what went wrong,
        which is the most expensive kind of note: it can be implemented and still miss.

  - lab:
      eyebrow: Lab
      title: Two pairs, one bench scene
      brief: >-
        Take the bench build on the classroom headset. One of you wears it and narrates out
        loud, the other writes down what is said. Swap after the first pass, then run the
        pass again. You hand in one page each, not one page between the two of you.
      blocks:
        - label: Constraint
          text: The person writing does not suggest anything during the pass. They write what they hear.
        - label: Deliverable
          text: One page, four criteria, and at least one measured number with its unit.
        - label: Criterion
          text: That someone who never wore the build could open the scene and find the object you mean.

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: The headset is the instrument
          desc: Play mode reports positions. Reach, scale, comfort and legibility only exist on a head.
        - title: Discomfort has a mechanism
          desc: A disagreement between vision and the inner ear, caused by the scene and fixed in it.
        - title: A note without a place is a feeling
          desc: Where, what you did, what happened, what you would change. Four lines, and the build moves.

  - homework:
      eyebrow: For the next session
      title: One page on a VR experience you did not build
      brief: >-
        Wear any VR title you have access to for one task, and review it with this session's
        four criteria. Bring the page to session 2, because the hardware decisions there are
        easier to argue once you have felt something fail.
      meta:
        - [Due, Before session 2]
        - [Format, Blackboard · one page PDF]
        - [Weight, Part of the assignment average]
      rubric:
        - ["Four criteria", "40 %", "Each one has a line, including the ones that were fine"]
        - ["One measurement", "30 %", "A number with a unit and where it was taken"]
        - ["One change", "30 %", "A single edit, small enough to test in one pass"]

  - closing:
      title: Questions
      subtitle: >-
        These sessions accompany the Unity Learn pathway VR Development, at
        learn.unity.com/pathway/vr-development. Work through it yourself.
      meta:
        - [Pathway, Unity Learn · VR Development]
        - [Email, descobarc@up.edu.mx]
        - [Chat, Institutional Google Chat]
