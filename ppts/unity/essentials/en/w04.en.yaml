slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Session 04 · Reading and writing C# in Unity
      title: Unity Essentials
      subtitle: >-
        Nothing in your code calls Update. The engine does, by name, and once that is clear
        the rest of the file stops looking like magic.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, UNITY · Foundational]
        - [Session, 4 of 6]
        - [Based on, Unity Learn · Unity Essentials]
      notes: |
        Companion session to the Unity Learn pathway Unity Essentials, level Foundational,
        at learn.unity.com/pathway/unity-essentials. It covers the pathway areas Level 1
        Code Comprehension and Level 1 Application Scripting, and closes the scripting part
        of the area GameObjects that session 3 left open.

        The scripts belong to the StoreRoom project. Spinner.cs turns a sign over the bay,
