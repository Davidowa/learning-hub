  - agenda:
      eyebrow: Agenda
      title: Three working blocks
      cards:
        - title: Reading somebody's script
          desc: >-
            Pathway area · Level 1 Code Comprehension. Who calls these methods, when each one
            runs, and how to answer what a file does without running it.
        - title: Writing the logic
          desc: >-
            Pathway area · Level 1 Application Scripting, the logic and API parts. Fields the
            Inspector can see, conditions, counters and the engine calls you actually use.
        - title: Style and the console
          desc: >-
            Pathway area · Level 1 Application Scripting, the code style part. Naming, one
            job per file, and reading the three errors that will meet you this week.
        - title: The bay door decides
          desc: >-
            Pathway area · GameObjects, the scripting part. The trigger from session 3 gets a
            capacity, a state and a reason to stop counting.

  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Say who calls Start and Update
          sub: And why nothing in your own code ever names either of them
        - head: Choose between Update and FixedUpdate
          sub: By whether the line touches a Rigidbody or touches the frame
        - head: Multiply by Time.deltaTime and say why
          sub: So the same script moves the same distance at 30 and at 60 frames
        - head: Expose a value to the Inspector on purpose
          sub: With SerializeField on a private field rather than making it public
        - head: Read a compiler error to its line
          sub: CS1002, CS0103 and CS0246, each with a different fix
        - head: Explain a NullReferenceException in one line
          sub: A reference that was never assigned, named by the method that used it

  - roadmap:
      eyebrow: Course map
