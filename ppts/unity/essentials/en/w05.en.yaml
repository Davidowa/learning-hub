slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Session 05 · Cameras, 3D audio and sprites
      title: Unity Essentials
      subtitle: >-
        What the player sees, what the player hears, and what a flat image is doing in a
        scene measured in metres.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, UNITY · Foundational]
        - [Session, 5 of 6]
        - [Based on, Unity Learn · Unity Essentials]
      notes: |
        Companion session to the Unity Learn pathway Unity Essentials, level Foundational,
        at learn.unity.com/pathway/unity-essentials. It covers three pathway areas at once:
        Beginner Unity Cameras, Audio Essentials and Level 2 2D Art, which is the Sprite
