        - title: La puerta decide
          desc: >-
            Área de la ruta · GameObjects, la parte de scripting. El trigger de la sesión 3
            recibe una capacidad, un estado y una razón para dejar de contar.

  - objectives:
      eyebrow: Objetivos de aprendizaje
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Decir quién llama a Start y a Update
          sub: Y por qué nada de tu propio código nombra a ninguno de los dos
        - head: Elegir entre Update y FixedUpdate
          sub: Según si la línea toca un Rigidbody o toca el cuadro
        - head: Multiplicar por Time.deltaTime y decir por qué
          sub: Para que el mismo script mueva lo mismo a 30 y a 60 cuadros
        - head: Exponer un valor al Inspector a propósito
          sub: Con SerializeField sobre un campo privado en vez de hacerlo público
        - head: Leer un error de compilación hasta su línea
          sub: CS1002, CS0103 y CS0246, cada uno con un arreglo distinto
        - head: Explicar una NullReferenceException en un renglón
          sub: Una referencia que nunca se asignó, nombrada por el método que la usó

  - roadmap:
      eyebrow: Mapa del curso
      title: Dónde queda esta sesión dentro de las seis
      phases:
        - label: 01 · Sesión 1
          title: El editor
          desc: Instalar, el proyecto en disco, las ventanas y cómo moverse
          state: done
        - label: 02 · Sesiones 2 y 3
          title: La escena
          desc: Objetos, transformaciones, materiales, física, componentes y prefabs
          state: done
        - label: 03 · Sesiones 4 y 5
          title: Conducta y sentidos
          desc: Leer y escribir scripts, cámaras, audio y sprites
          state: now
        - label: 04 · Sesión 6
          title: Publicación
          desc: Convertir el proyecto en algo que corre sin el editor
