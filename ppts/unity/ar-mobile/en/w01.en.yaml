  - divider:
      eyebrow: Block 01
      title: What the phone is actually doing
      lede: An estimate of where the device is, and a guess about the surfaces around it. Everything else is drawing.
      block: 1

  - concept:
      eyebrow: Key concept
      title: A phone does not see a room, it estimates one
      lead: >-
        The camera hands the tracking system a stream of images. The system picks out points
        that look the same from one frame to the next, watches how they move, and folds in
        the accelerometer and gyroscope. Out of that comes one answer per frame, where the
        device is and which way it points. Surfaces come afterwards, and they are inferred
        from those points rather than measured.
      panel:
        label: What this buys, and what it costs
        title: Tracking is an estimate, not a measurement
        note: >-
          A blank white wall gives the tracker nothing to lock onto, so the estimate drifts.
          Weak light does the same. Neither one is a bug you can fix in code.
      steps:
        - text: The camera delivers a frame
        - text: Feature points are matched across frames
        - text: The motion sensors fill the gaps
        - text: A pose comes out, six numbers
        - text: Planes are inferred from the points
          loop: ↺ and all five can be wrong at the same time

  - diagram:
      eyebrow: The loop
      title: From a camera frame to a surface you can place an object on
      blocks:
        - label: '01'
          title: Camera and sensors
          desc: Images at thirty or sixty a second, plus accelerometer and gyroscope readings
        - label: '02'
          title: Pose per frame
          desc: Position and rotation of the device in a session space that starts where you did
        - label: '03'
          title: Trackables
          desc: Planes, feature points and images the session found, and keeps correcting as it looks
          dark: true
      note: >-
        The arrows only run one way. Your content reads the trackables, and nothing your
        content does improves the pose. That is why a scene that looks wrong is usually a
        room problem rather than a code problem.

  - table:
      eyebrow: Block 01 · The inventory
      title: What a session gives you, and what each one needs
      headers: [Trackable, What it is, What it needs from the room]
      rows:
        - ["Device pose", "Position and rotation, per frame", "Texture and light"]
        - ["Feature points", "Sparse points the tracker matched", "Detail to lock onto"]
        - ["Planes", "Flat regions grown from points", "A surface with a pattern"]
        - ["Images", "A 2D target from your library", "Contrast, and no repeats"]
        - ["Anchors", "A pose the session keeps fixing", "Nothing extra"]
        - ["Light estimate", "Ambient intensity and colour", "Nothing extra"]

  - stat:
      eyebrow: Recomputed every frame
      value: 6 DoF
      text: Three numbers for position, three for rotation, and the whole session rests on them
      note: >-
        Lose the six and the content slides off the table while the user watches. No editor
        setting restores them, and no amount of code makes a blank wall trackable. This is
        the one number worth memorising this week.

  - divider:
      eyebrow: Block 02
      title: Choosing a use case
      lede: The camera costs battery, attention, and a room the user has to stand up in. The idea has to pay for all three.
      block: 2

  - method:
      eyebrow: The test
      title: Three questions an AR idea has to answer
      statement: >-
        If the same job is done better by a photo, a list or a video, then the answer is a
        photo, a list or a video.
      points:
        - label: Question 01
          text: Does the content have to sit in the room? If its position carries no meaning, the idea does not need AR.
        - label: Question 02
          text: Does the user have space to move? A seat on a bus is not a place where anyone scans a floor.
        - label: Question 03
          text: What happens when tracking fails? An answer of nothing is not an answer, it is a bug waiting for a user.

  - tiers:
      eyebrow: Block 02 · Shapes
      title: Four shapes an AR idea usually takes
      items:
        - key: PLACE
          title: Put an object in the room
          desc: Furniture, machinery, a scale model. Position carries the meaning, so the camera earns its place.
        - key: LABEL
          title: Annotate a real thing
          desc: A part number over a valve, a name over an exhibit. Needs a target the app can recognise first.
        - key: MEASURE
          title: Read the room back
          desc: Distances, areas, clearances. Accuracy claims are where these fail, so state your tolerance.
        - key: PLAY
          title: Bring the room into a game
          desc: The floor becomes the board. Cheap to prototype, and the hardest of the four to keep interesting.

  - pitfalls:
      eyebrow: Block 02 · Design errors
      title: Four ways a good idea turns into a bad app
      items:
        - label: Mistake 01
          title: Designing for a phone nobody has
          desc: >-
            The demonstration ran on a flagship with a depth sensor. Your students carry
            what they carry. Name the target device on page one of the brief.
        - label: Mistake 02
          title: Assuming a feature a video showed
          desc: >-
            Room meshing, body tracking and object tracking all look alike in a clip. One
            platform provides them, and it is not the one this course builds for.
        - label: Mistake 03
          title: No failure state at all
          desc: >-
            Tracking will be lost. If the design has no screen for that moment, the app sits
            there with a floating chair and the user closes it.
        - label: Mistake 04
          title: Content that could have been a photo
          desc: >-
            If the object never touches the room, the room was never needed. Ship the photo,
            and spend the term on something that requires a camera.

  - divider:
      eyebrow: Block 03
      title: What the platform will not do
      lede: Two providers, two feature sets, and a table worth reading before anybody promises anything.
      block: 3

  - table:
      eyebrow: Block 03 · Providers
      title: Where ARCore and ARKit part company
      headers: [Feature, ARCore on Android, ARKit on iOS]
      rows:
        - ["Plane detection", "Supported", "Supported"]
        - ["Image tracking", "Supported", "Supported"]
        - ["Occlusion", "Supported", "Supported"]
        - ["Meshing", "Not supported", "Supported"]
        - ["Object tracking", "Not supported", "Supported"]
        - ["Body tracking", "Not supported", "Supported"]

  - concept:
      eyebrow: The habit
      title: Ask the subsystem, do not trust the table
      lead: >-
        A table like the one before this one goes stale. Package versions move, providers
        gain features, and two phones on the same platform differ. The subsystem that loaded
        at runtime knows what it can do, and it will say so if you ask. Every trackable
        manager in AR Foundation exposes a descriptor carrying the capability flags of the
        provider that actually started.
      panel:
        label: Where the answer lives
        title: ARPlaneManager.descriptor
        note: >-
          XRPlaneSubsystemDescriptor carries five flags. Horizontal planes, vertical planes,
          arbitrary planes, boundary vertices and classification.
      steps:
        - text: Get the manager from the scene
        - text: Read the descriptor once AR runs
        - text: Branch on the flag, not the platform
        - text: Tell the user what will not work
          loop: ↺ and log it, so the next bug report already has the answer

  - code:
      eyebrow: Block 03 · Capability
      title: Asking the provider what it supports
      filename: PlaneSupport.cs
      lang: csharp
      source: |
        using UnityEngine;
        using UnityEngine.XR.ARFoundation;

        public class PlaneSupport : MonoBehaviour
        {
            [SerializeField] ARPlaneManager planes;
            public void ReportOnce()
            {
                var d = planes.descriptor;
                bool h = d.supportsHorizontalPlaneDetection;
                bool v = d.supportsVerticalPlaneDetection;
                Debug.Log($"h={h} v={v}");
            }
        }
      annotations:
        - label: descriptor
          text: >-
            It describes the provider that loaded on this device, not the platform you
            built for.
        - label: Five flags
          text: >-
            The same descriptor reports arbitrary planes, boundary vertices and plane
            classification.
        - label: When to call it
          text: >-
            Not from Awake. There is nothing to describe until the session starts.
        - label: Risk
          text: >-
            Read it too early and you get a null reference, so a working device looks
            unsupported.
          accent: true

  - code_output:
      eyebrow: Block 03 · Measured
      title: The same build on two different devices
      filename: Availability.cs
      lang: csharp
      output_label: Two devices
      source: |
        using System.Collections;
        using UnityEngine;
        using UnityEngine.XR.ARFoundation;

        public class Availability : MonoBehaviour
        {
            IEnumerator Start()
            {
                yield return ARSession.CheckAvailability();
                Debug.Log($"state {ARSession.state}");
            }
        }
      output: |
        phone with ARCore
        state Ready

        tablet without it
        state Unsupported

  - quiz:
      eyebrow: Quick check
      question: An idea needs a triangle mesh of the room, on Android. What does that mean?
      options:
        - ARCore provides no meshing, so that part of the idea does not ship on Android
        - Meshing is a Unity feature, so AR Foundation supplies it on every platform
        - Any phone with a depth sensor gets meshing through AR Foundation
        - It works once meshing is enabled in XR Plug-in Management

  - trace:
      eyebrow: Answer
      title: Depth and meshing are two different features
      headers: [Claim, Where to check, Verdict]
      rows:
        - ["Meshing on ARCore", "ARCore plug-in manual", "Not supported"]
        - ["Meshing on ARKit", "ARKit plug-in manual", "Supported"]
        - ["Occlusion on ARCore", "ARCore occlusion page", "Supported"]
        - ["Mesh from occlusion", "AR Foundation features", "Another feature"]
      verdict: >-
        ARCore gives you a depth image, which is enough to hide a virtual chair behind a real
        one. It does not hand you a triangle mesh of the room. An idea that needs the mesh
        needs iOS, or it needs to become a different idea before anybody writes code.

  - lab:
      eyebrow: Lab
      title: One page for one idea, in pairs
      brief: >-
        Pick a use case from your own department. A lab bench, a workshop machine, a campus
        sign. Write one page naming the trackable it depends on, the device it will run on,
        and what the user sees at the moment tracking is lost.
      blocks:
        - label: Constraint
          text: No Unity yet. Paper or a document. If the idea only works in a video, write that down.
        - label: Deliverable
          text: One page under three headings. The trackable, the device, the failure state.
        - label: Criterion
          text: That a classmate can name the AR feature your idea needs without asking you.

  - takeaways:
      eyebrow: Summary
      title: Four ideas to take away
      items:
        - title: Tracking is an estimate
          desc: Six numbers per frame, computed from images and motion sensors, and every one of them can drift
        - title: The room decides
          desc: Texture, light and a surface with a pattern. No setting in the editor replaces any of the three
        - title: Capability is a runtime question
          desc: The descriptor on each manager reports what the provider that loaded can actually do
        - title: A use case earns the camera
          desc: If the position of the content carries no meaning, a photo does the job for less

  - homework:
      eyebrow: For the next session
      title: Install the toolchain before we build
      brief: >-
        Install Unity 6 with Android Build Support and its two child modules, the SDK and NDK
        tools and OpenJDK. Bring an Android phone that runs ARCore, and a cable that carries
        data rather than only power.
      meta:
        - [Due, Before session 2]
        - [Format, A screenshot of the installed modules]
        - [Bring, A charged phone and a data cable]
      rubric:
        - ["Editor", "Required", "Unity 6 with Android Build Support installed"]
        - ["Device", "Required", "An ARCore capable phone with USB debugging turned on"]
        - ["Pathway", "Ongoing", "This week's units on Unity Learn, done in your own time"]

  - closing:
      title: Questions
      subtitle: >-
        Mobile AR Development on Unity Learn is the pathway these decks accompany, at
        learn.unity.com/pathway/mobile-ar-development. You are expected to work through it.
      meta:
        - [Pathway, Unity Learn · Mobile AR Development]
        - [Email, descobarc@up.edu.mx]
        - [Chat, Institutional Google Chat]
