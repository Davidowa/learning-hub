slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Session 01 · AR design · Use cases and platform limits
      title: Mobile AR Development
      subtitle: >-
        Before any code, two questions. What can the phone actually track, and does the idea
        need a camera at all.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, UNITY · Foundational]
        - [Session, 1 of 5]
        - [Based on, Unity Learn · Mobile AR Development]
      notes: |
        These five sessions are a companion to the Unity Learn pathway Mobile AR Development,
        learn.unity.com/pathway/mobile-ar-development. Students do the pathway on their
        own time. These decks are the classroom hour beside it, in our own examples.

        Facts on these slides were checked against the AR Foundation 6.0 manual, the
        Google ARCore XR Plug-in 6.0 manual and the Apple ARKit XR Plug-in 6.0 manual.
        Nothing is copied from Unity Learn.

  - agenda:
      eyebrow: Agenda
      title: Three working blocks
      cards:
        - title: What the phone tracks
          desc: A pose per frame from the camera and the motion sensors, and what is built on it
        - title: Judging an idea
          desc: The test a use case passes before it earns the camera and the battery
        - title: Two providers
          desc: What ARCore has, what ARKit has, and what neither of them has
        - title: Asking, not assuming
          desc: Reading capability off the running subsystem instead of off a forum post

  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Describe what an AR session tracks
          sub: The device pose in six degrees of freedom, and the trackables built on top of it
        - head: Judge an AR idea in one page
          sub: Against three questions that separate a use case from a demonstration
        - head: Read a platform capability table
          sub: And say which features ARCore has, which ARKit has, and which neither has
        - head: Query support at runtime
          sub: Through the subsystem descriptor, rather than trusting what a video showed
        - head: Write a one page use case brief
          sub: Naming the trackable it needs, the device it runs on, and the failure it accepts

  - roadmap:
