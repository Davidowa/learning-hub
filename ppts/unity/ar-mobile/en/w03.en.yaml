  - table:
      eyebrow: Block 03 · Targets
      title: What separates a target that works from one that does not
      headers: [Property, What works, Why]
      rows:
        - ["Contrast", "High, even in grey", "The tracker sees no colour"]
        - ["Detail", "Busy, non repeating", "Repeats match the wrong place"]
        - ["Shape", "Flat and rigid", "A curled poster stops matching"]
        - ["Physical size", "Measured, in metres", "Distance is derived from it"]
        - ["Finish", "Matte paper", "Gloss returns the room instead"]

  - stat:
      eyebrow: The number nobody measures
      value: 0.210 m
      text: The width of an A4 sheet, and the number the Specify Size field is asking for
      note: >-
        Type what the paper is, not what the image file suggests. Get it wrong by a factor
        and the estimated distance is wrong by the same factor, so content that belongs on
        the page floats above the table or sinks through it.

  - code:
      eyebrow: Block 03 · Image tracking
      title: Reacting to a target the session recognised
      filename: ImageLog.cs
      lang: csharp
      source: |
        using UnityEngine;
        using UnityEngine.XR.ARFoundation;

        public class ImageLog : MonoBehaviour
        {
            // wired to trackablesChanged in the Inspector
            public void OnChanged(
                ARTrackablesChangedEventArgs<ARTrackedImage> e)
            {
                foreach (var img in e.added)
                    Debug.Log($"found {img.referenceImage.name}");
            }
        }
      annotations:
        - label: Same event
          text: >-
            Only the type argument changed from the plane example.
        - label: referenceImage
          text: >-
            The tracked image knows which library entry it matched.
        - label: Prefab field
          text: >-
            The manager can instantiate one prefab per image, which suits a demo.
        - label: Risk
          text: >-
            The GameObject survives when the target leaves the frame. Check trackingState.
          accent: true

  - quiz:
      eyebrow: Quick check
      question: The library says the target is 0.210 m wide. It was printed at 0.105 m. What happens?
      options:
        - Content lands at about twice the distance it should, and at twice the size
        - The image is not recognised, because the size has to match the print
        - Nothing, the size field is only a hint used inside the editor
        - Tracking works, but the rotation of the target comes back mirrored

  - trace:
      eyebrow: Answer
      title: One wrong number, and everything downstream of it
      headers: [Quantity, Entered, Real, Result]
      rows:
        - ["Target width", "0.210 m", "0.105 m", "Two to one"]
        - ["Distance", "Derived", "Half of it", "Twice as far"]
        - ["Content scale", "Authored", "Unchanged", "Looks twice as big"]
        - ["Rotation", "Correct", "Correct", "Unaffected"]
      verdict: >-
        The tracker cannot measure your paper. It believes the library and derives distance
        from apparent width, so halving the print doubles the estimated distance. Measure the
        sheet with a ruler once it leaves the printer.

  - lab:
      eyebrow: Lab
      title: Two ways to place one object, in pairs
      brief: >-
        Add plane detection and tap to place to the project from session two, then print one
        target image and place the same prefab on it. Measure the printed width with a ruler
        before you type it into the library.
      blocks:
        - label: Constraint
          text: One prefab, placed both ways. No second scene and no second project.
        - label: Deliverable
          text: A short video of the phone screen showing both placements, one after the other.
        - label: Criterion
          text: That the object on the printed target is the size you intended, measured against the page.

  - takeaways:
      eyebrow: Summary
      title: Four ideas to take away
      items:
        - title: One event, every manager
          desc: trackablesChanged carries added, updated and removed for planes, images and point clouds alike
        - title: A merge looks like a removal
          desc: Two floor patches that turn out to be one floor leave one trackable and one missing reference
        - title: The ray cast asks the session
          desc: No collider is generated, so a plane is a valid target the moment the provider reports it
        - title: The printed size sets the scale
          desc: Distance is derived from apparent width, so a mismeasured target moves everything with it

  - homework:
      eyebrow: For the next session
      title: The same interaction, without the script
      brief: >-
        Keep the tap to place scene. Session four rebuilds exactly this interaction as a visual
        graph, so bring the project working and bring the script, because the two will sit
        side by side on the screen.
      meta:
        - [Due, Before session 4]
        - [Format, The updated repository]
        - [Bring, The phone and one printed target]
      rubric:
        - ["Placement", "Required", "Tapping a detected plane places the prefab on it"]
        - ["Image target", "Required", "The printed target is recognised and its size is measured"]
        - ["Pathway", "Ongoing", "This week's units on Unity Learn, done in your own time"]

