  - divider:
      eyebrow: Block 01
      title: Everything it finds is a trackable
      lede: One shape of object, one event, and the same code for planes, images and point clouds.
      block: 1

  - concept:
      eyebrow: Key concept
      title: A trackable is an id, a pose and a state
      lead: >-
        Every plane, image and point cloud a session finds carries a TrackableId that stays
        the same for as long as the session recognises it. That identifier is what lets a
        manager tell you three different things. This one is new, this one moved or grew,
        this one is gone. AR Foundation turns each of them into a GameObject and keeps its
        transform in step with the provider.
      panel:
        label: One event for every manager
        title: trackablesChanged, since AR Foundation 6
        note: >-
          It replaced the per manager events, planesChanged and trackedImagesChanged among
          them, and it can be wired in the Inspector like any UnityEvent.
      steps:
        - text: added, the session just found it
        - text: updated, its pose or shape moved
        - text: removed, it is not there any more
        - text: and a merged plane arrives as removed
          loop: ↺ so never cache a plane, ask the manager

  - diagram:
      eyebrow: Block 01 · Lifecycle
      title: The three things that happen to a trackable
      blocks:
        - label: '01'
          title: added
          desc: The provider found something new, and AR Foundation creates a GameObject for it.
        - label: '02'
          title: updated
          desc: Same identifier, new pose or new boundary. The transform moves and the mesh is rebuilt.
        - label: '03'
          title: removed
          desc: Gone, or merged into a larger plane. Anything you parented to it goes with it.
          dark: true
      note: >-
        The merge is the one that surprises people. Two small floor patches that turn out to
        be one floor become one plane, and the smaller of the two is removed while the
        content standing on it disappears.

  - table:
      eyebrow: Block 01 · Managers
      title: Five managers, and what each one produces
      headers: [Manager, Produces, Needs from the room]
      rows:
        - ["AR Plane Manager", "ARPlane trackables", "A textured surface"]
        - ["AR Point Cloud Manager", "Feature points", "Detail anywhere"]
        - ["AR Raycast Manager", "ARRaycastHit results", "A trackable to hit"]
        - ["AR Tracked Image Manager", "ARTrackedImage", "A reference library"]
        - ["AR Anchor Manager", "ARAnchor trackables", "A pose worth holding"]

  - code:
      eyebrow: Block 01 · The event
      title: Listening once, for every plane
      filename: PlaneLog.cs
      lang: csharp
      source: |
        using UnityEngine;
        using UnityEngine.XR.ARFoundation;

        public class PlaneLog : MonoBehaviour
        {
            [SerializeField] ARPlaneManager planes;

            void OnEnable() =>
                planes.trackablesChanged.AddListener(OnChanged);

            void OnChanged(ARTrackablesChangedEventArgs<ARPlane> e)
            {
                Debug.Log($"+{e.added.Count} ~{e.updated.Count}");
            }
        }
      annotations:
        - label: One event
          text: >-
            The same signature works for images and point clouds. Only the type argument
            changes.
        - label: Three lists
          text: >-
            added, updated and removed arrive together in one call, so one handler covers
            the whole lifecycle.
        - label: In the Inspector
          text: >-
            trackablesChanged is a UnityEvent, so a public handler can be wired without
            writing AddListener at all.
        - label: Risk
          text: >-
            Add the listener in OnEnable and remove it in OnDisable, or a reloaded scene
            gets two handlers.
          accent: true

  - code_output:
      eyebrow: Block 01 · Measured
      title: What the log looks like while a floor is scanned
      filename: PlaneLog.cs
      lang: csharp
      output_label: Scanning a floor
      source: |
        void OnChanged(ARTrackablesChangedEventArgs<ARPlane> e)
        {
            Debug.Log($"+{e.added.Count} ~{e.updated.Count}");
        }
      output: |
        +1 ~0
        +0 ~1
        +0 ~1
        +1 ~1
        +0 ~2
        +0 ~2

  - divider:
      eyebrow: Block 02
      title: Putting an object on a real floor
      lede: A ray cast that asks the session rather than the physics engine, and needs no collider to answer.
      block: 2

  - concept:
      eyebrow: Key concept
      title: This ray cast does not need a collider
      lead: >-
        Physics.Raycast needs a collider in the scene. ARRaycastManager.Raycast does not. It
        asks the provider to intersect a ray with what the session is tracking, so a plane
        becomes a target the moment it is reported, with nobody generating a mesh collider
        for it. You pass a screen point, a list for the results, and a mask naming which
        kinds of trackable are allowed to answer.
      panel:
        label: The mask that matters most
        title: TrackableType.PlaneWithinPolygon
        note: >-
          Within the polygon means the detected boundary. The other choice lets a tap land
          past the edge of the floor, on the infinite plane behind it.
      steps:
        - text: Take the screen point of the tap
        - text: Ask the manager to fill a list
        - text: Use the first hit in the list
        - text: Read its pose, position and rotation
          loop: ↺ and reuse the same list on every tap

  - code:
      eyebrow: Block 02 · Placement, part 1
      title: The fields the placement needs
      filename: TapToPlace.cs
      lang: csharp
      source: |
        using System.Collections.Generic;
        using UnityEngine;
        using UnityEngine.InputSystem;
        using UnityEngine.XR.ARFoundation;
        using UnityEngine.XR.ARSubsystems;

        public class TapToPlace : MonoBehaviour
        {
            [SerializeField] ARRaycastManager raycasts;
            [SerializeField] GameObject marker;

            static readonly List<ARRaycastHit> hits = new();
      annotations:
        - label: Two namespaces
          text: >-
            ARFoundation holds the managers, ARSubsystems holds TrackableType.
        - label: One list, reused
          text: >-
            Raycast fills the list you hand it. A new one per tap is work for nothing.
        - label: Serialized, not found
          text: >-
            Drag the manager in from the XR Origin, rather than searching for it.
        - label: Risk
          text: >-
            An empty marker field fails silently on the phone, where you cannot see the
            null.
          accent: true

  - code:
      eyebrow: Block 02 · Placement, part 2
      title: The tap, the ray cast and the object
      filename: TapToPlace.cs
      lang: csharp
      source: |
        // inside TapToPlace
        void Update()
        {
            var touch = Touchscreen.current?.primaryTouch;
            if (touch == null) return;
            if (!touch.press.wasPressedThisFrame) return;

            Vector2 p = touch.position.ReadValue();
            var mask = TrackableType.PlaneWithinPolygon;
            if (!raycasts.Raycast(p, hits, mask)) return;

            Pose pose = hits[0].pose;
            Instantiate(marker, pose.position, pose.rotation);
        }
      annotations:
        - label: The null check
          text: >-
            Touchscreen.current is null in the editor with no device attached.
        - label: Screen point
          text: >-
            Pixels, not world units. The manager builds the ray from the AR camera.
        - label: The pose
          text: >-
            Position and rotation arrive together, so the object lands lying on the surface.
        - label: Risk
          text: >-
            On a false the list keeps its old contents, so read it only after a true.
          accent: true

  - pitfalls:
      eyebrow: Block 02 · Common errors
      title: Four reasons a plane never turns up
      items:
        - label: Mistake 01
          title: A bare white floor
          desc: >-
            Nothing to match between frames, so no feature points and no plane. Throw a
            sheet of newspaper on the floor and it appears in seconds.
        - label: Mistake 02
          title: Panning the phone too fast
          desc: >-
            Motion blur destroys the features the tracker was following. Move slowly, and
            sideways rather than in a rotation on the spot.
        - label: Mistake 03
          title: Caching an ARPlane reference
          desc: >-
            Planes merge and disappear. A field holding one becomes a missing reference,
            and the content standing on it goes with it.
        - label: Mistake 04
          title: Placing content with no anchor
          desc: >-
            Without an anchor the object keeps the coordinates it was given while the
            session quietly corrects the world around it, and it drifts.

  - divider:
      eyebrow: Block 03
      title: Printed targets
      lede: An image the app already knows, a library it lives in, and one measurement that decides the scale of everything.
      block: 3

