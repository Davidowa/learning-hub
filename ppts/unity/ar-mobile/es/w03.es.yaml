      title: Desarrollo de AR móvil
      subtitle: >-
        Planos, imágenes impresas y raycasts. Las tres formas en que una sesión te entrega un
        lugar real donde poner algo que no lo es.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, UNITY · Fundamentos]
