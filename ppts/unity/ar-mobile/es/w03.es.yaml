      notes: |
        Todo lo de hoy funciona igual en ARCore y en ARKit, así que la sesión se queda
        neutral. Lo específico de Android fue la sesión dos.

        Tomado del manual de AR Foundation 6.0, de sus páginas de plane detection, image
