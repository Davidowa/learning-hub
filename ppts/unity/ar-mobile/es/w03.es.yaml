        Nada está copiado de Unity Learn, que el alumno trabaja aparte.

  - agenda:
      eyebrow: Agenda
      title: Tres bloques de trabajo
      cards:
        - title: Qué es un trackable
          desc: Un identificador, una pose y un estado, y un solo evento que reporta los tres
        - title: Colocar sobre un plano
          desc: Un raycast que no necesita collider, y un tap que se vuelve posición en el mundo
        - title: Blancos impresos
          desc: Una biblioteca de imágenes, y la medida que todo el mundo captura mal
        - title: Cuando no funciona
          desc: Pisos vacíos, teléfonos rápidos y referencias guardadas, con su síntoma cada uno

  - objectives:
      eyebrow: Objetivos de aprendizaje
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Explicar el ciclo de vida de un trackable
          sub: added, updated y removed, y por qué un plano fusionado llega como removed
        - head: Suscribirse a trackablesChanged
          sub: El evento que levanta todo manager de AR Foundation 6, en código o en el Inspector
        - head: Colocar un objeto con un raycast
          sub: Desde un punto de pantalla, contra PlaneWithinPolygon, sin un solo collider
        - head: Armar una biblioteca de imágenes
          sub: Y capturar el tamaño físico con que el papel salió de la impresora
        - head: Leer una falla de regreso a su causa
