- code:
    eyebrow: SwiftUI
    title: Example 1 · 1/2
    filename: w13-sample-1.swift
    lang: swift
    source: |
      @Environment(\.horizontalSizeClass) private var size

      var body: some View {
          if size == .regular {
              NavigationSplitView {
                  ReportList()
              } detail: {
                  ReportDetailPlaceholder()
              }
          } else {
              NavigationStack { ReportList() }
          }
    annotations:
    - label: Context
      text: Fragment of the sample file. Keep the types and imports supplied by its context.
    - label: Check
      text: Explain inputs, state and the expected result.
    notes: |-
      Sample source: SwiftUI realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://developer.apple.com/documentation/swiftui
