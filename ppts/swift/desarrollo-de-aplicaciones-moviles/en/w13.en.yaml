- quiz:
    eyebrow: Quick check
    question: An icon-only delete button has no accessible name. What fixes the missing information?
    options:
    - Add a larger shadow
    - Provide a meaningful accessible name and role
    - Change the icon color alone
    - Remove it from the screen-reader flow
    notes: Answer B. the same app must work for every user and every screen. That takes semantics for assistive technology, text that scales, strings that translate and layouts that adapt.
