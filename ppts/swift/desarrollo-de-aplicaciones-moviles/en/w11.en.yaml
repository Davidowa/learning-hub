- code:
    eyebrow: SwiftUI
    title: Example 1
    filename: w11-sample-1.swift
    lang: swift
    source: |
      .task {
          do {
              let updates = CLLocationUpdate.liveUpdates()
              for try await update in updates {
                  guard let loc = update.location else { continue }
                  draft.coordinate = loc.coordinate
                  break        // una lectura basta para el reporte
              }
          } catch {
              draft.locationError = error
          }
      }
    annotations:
    - label: Context
      text: Fragment of the sample file. Keep the types and imports supplied by its context.
    - label: Check
      text: Explain inputs, state and the expected result.
    notes: |-
      Sample source: SwiftUI realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://developer.apple.com/documentation/swiftui
- quiz:
    eyebrow: Quick check
    question: A sensor value fluctuates around a reference. What should be checked?
    options:
    - Only the dependency popularity
    - Whether the title is short
    - Only the color of the number
    - Units, sampling, noise and comparison with the reference
    notes: Answer D. a sensor is a stream of noisy, timestamped samples. You trade sampling rate and accuracy against battery and privacy, filter the noise, and always unsubscribe.
