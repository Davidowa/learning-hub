- code:
    eyebrow: SwiftUI
    title: Example 1
    filename: w14-sample-1.swift
    lang: swift
    source: |+
      @Test(arguments: ["", "   ", "ab"])
      func shortTitlesAreInvalid(title: String) {
          #expect(isValidTitle(title) == false)
      }

    annotations:
    - label: Context
      text: Fragment of the sample file. Keep the types and imports supplied by its context.
    - label: Check
      text: Explain inputs, state and the expected result.
    notes: |-
      Sample source: SwiftUI realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://developer.apple.com/documentation/swiftui
- code:
    eyebrow: SwiftUI
    title: Example 2
    filename: w14-sample-2.swift
    lang: swift
    source: |
      func testCreateReport() throws {
          let app = XCUIApplication()
          app.launch()
          app.buttons["Nuevo reporte"].tap()
          let field = app.textFields["¿Qué observaste?"]
          field.tap()
          field.typeText("Fuga")
          app.buttons["Guardar"].tap()
          XCTAssertTrue(app.staticTexts["Fuga"].exists)
      }
    annotations:
    - label: Context
      text: Fragment of the sample file. Keep the types and imports supplied by its context.
    - label: Check
      text: Explain inputs, state and the expected result.
    notes: |-
      Sample source: SwiftUI realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://developer.apple.com/documentation/swiftui
- quiz:
    eyebrow: Quick check
    question: Which test demonstrates that a defect was fixed?
    options:
    - One that fails on the defect and passes on the corrected behavior
    - A screenshot with no acceptance criterion
    - A count of source files
    - One that passes before and after without checking the defect
    notes: 'Answer A. tests are executable specifications at different costs: many fast unit tests, fewer component tests, a handful of end-to-end flows, and checks on a real device. CI makes "it works on my machine" irrelevant.'
