- code:
    eyebrow: SwiftUI
    title: Example 1 · 1/2
    filename: w02-sample-1.swift
    lang: swift
    source: |+
      import Foundation

      enum Status: Hashable { case draft, pending, synced }

      struct Report: Identifiable, Hashable {
          let id = UUID()
          var title: String
          var status: Status
          var note: String?
          var createdAt = Date()
      }

    annotations:
    - label: Context
      text: Fragment of the sample file. Keep the types and imports supplied by its context.
    - label: Check
      text: Explain inputs, state and the expected result.
    notes: |-
      Sample source: SwiftUI realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://developer.apple.com/documentation/swiftui
- code:
    eyebrow: SwiftUI
    title: Example 1 · 2/2
    filename: w02-sample-1.swift
    lang: swift
    source: |
      let a = Report(title: "Fuga", status: .draft)
      var b = a                 // copia: struct es valor
      b.title = "Lámpara"
      print(a.title)            // Fuga
    annotations:
    - label: Context
      text: Fragment of the sample file. Keep the types and imports supplied by its context.
