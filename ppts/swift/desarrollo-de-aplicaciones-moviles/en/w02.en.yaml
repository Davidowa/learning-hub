- quiz:
    eyebrow: Quick check
    question: A second variable is assigned the same record. What happens when it modifies the record?
    options:
    - TypeScript objects share references; Swift structs copy values
    - Swift structs always share references
    - The title cannot change
    - Both languages always make independent copies
    notes: Answer A. a type system is a contract the compiler checks for you. Null safety and value semantics remove whole classes of bugs before the app runs.
