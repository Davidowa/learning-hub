- quiz:
    eyebrow: Quick check
    question: The user leaves while a request is running. What protects the new screen state?
    options:
    - Treat every error as success
    - Force success immediately
    - Cancel the request and ignore late results
    - Block navigation until it finishes
    notes: Answer C. the network is slow, fallible and asynchronous. Every remote call has four outcomes (loading, success, empty, error) and must never block the UI thread. The API contract is a type that you validate at the boundary.
