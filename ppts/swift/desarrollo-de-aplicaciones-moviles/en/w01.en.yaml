- quiz:
    eyebrow: Quick check
    question: A report must work with intermittent connectivity. What belongs in the initial design?
    options:
    - Assume a permanent connection
    - Define offline behavior and recovery
    - Hide every network error
    - Require the newest phone
    notes: Answer B. a mobile app is a guest on a personal, constrained, sensor-rich device, and the OS is the landlord.
