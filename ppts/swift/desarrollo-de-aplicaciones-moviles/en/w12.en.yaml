- code:
    eyebrow: SwiftUI
    title: Example 1
    filename: w12-sample-1.swift
    lang: swift
    source: |
      .onOpenURL { url in
          // bitacora://report/<uuid>
          guard url.scheme == "bitacora",
                url.host() == "report",
                let id = UUID(uuidString: url.lastPathComponent)
          else { return }
          path.append(id)
      }
    annotations:
    - label: Context
      text: Fragment of the sample file. Keep the types and imports supplied by its context.
    - label: Check
      text: Explain inputs, state and the expected result.
    notes: |-
      Sample source: SwiftUI realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://developer.apple.com/documentation/swiftui
- quiz:
    eyebrow: Quick check
    question: A link uses an unexpected scheme but a familiar host. What should the app do?
    options:
    - Disable all navigation permanently
    - Accept the host alone
    - Validate scheme and arguments before navigating
    - Execute every argument
    notes: 'Answer C. an app talks to the rest of the system through a few doors: notifications and links come in, the share sheet goes out, system events come in, and background time is granted by the OS, never taken.'
