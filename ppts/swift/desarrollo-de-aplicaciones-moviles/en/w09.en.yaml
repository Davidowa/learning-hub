- code:
    eyebrow: SwiftUI
    title: Example 1
    filename: w09-sample-1.swift
    lang: swift
    source: |
      @Model
      final class Report {
          var title: String
          var status: String = "pending"
          var createdAt: Date = Date.now
          var photoPath: String?

          init(title: String) { self.title = title }
      }

      @Query(sort: \Report.createdAt, order: .reverse)
      private var reports: [Report]
    annotations:
    - label: Context
      text: Fragment of the sample file. Keep the types and imports supplied by its context.
    - label: Check
      text: Explain inputs, state and the expected result.
    notes: |-
      Sample source: SwiftUI realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://developer.apple.com/documentation/swiftui
- quiz:
    eyebrow: Quick check
    question: A schema update fails halfway through. Which design preserves the old database?
    options:
    - Delete the database on startup
    - Apply schema changes and version update in one transaction
    - Raise the version before changing tables
    - Ignore the failure
    notes: Answer B. the device is the first source of truth. Persist locally and sync opportunistically. Pick storage by the data's shape and sensitivity, and treat every schema change as a migration of real users' data.
