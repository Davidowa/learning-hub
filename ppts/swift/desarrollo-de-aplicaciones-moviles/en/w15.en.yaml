- quiz:
    eyebrow: Quick check
    question: A secret API key is embedded in the app bundle. What should be assumed?
    options:
    - Minification is encryption
    - The app store hides it permanently
    - The filename keeps it private
    - A recipient can extract it; use server authorization
    notes: Answer D. shipping is a pipeline of identity and signing, build variants, versioning, privacy disclosures, testers, staged release and updates. Security starts from assuming an attacker will read the binary.
