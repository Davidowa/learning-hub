- quiz:
    eyebrow: Quick check
    question: Two views show conflicting copies of the same field. What should change?
    options:
    - Add another copy
    - Give the field one owner and pass updates through a contract
    - Refresh at random
    - Remove validation
    notes: Answer B. state has exactly one owner. Data flows down, events flow up, and the UI re-renders from state, never from mutations it can't see.
