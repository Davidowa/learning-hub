- quiz:
    eyebrow: Comprobación
    question: ¿Qué describe una vista declarativa?
    options:
    - Una tabla de base de datos
    - Una captura fija
    - Una descripción derivada de entradas y estado actuales
    - Solo una secuencia de dibujo manual
    notes: Respuesta C. La interfaz declarativa describe lo que aparece a partir de los datos disponibles.
