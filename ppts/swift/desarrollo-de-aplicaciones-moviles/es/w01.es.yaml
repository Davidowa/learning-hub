- quiz:
    eyebrow: Comprobación
    question: Un reporte debe funcionar con conexión intermitente. ¿Qué corresponde al diseño inicial?
    options:
    - Suponer conexión permanente
    - Definir operación sin conexión y recuperación
    - Ocultar todo error de red
    - Exigir el teléfono más reciente
    notes: Respuesta B. Una app funciona dentro de los límites del dispositivo y de las reglas del sistema operativo.
