- code:
    eyebrow: SwiftUI
    title: Ejemplo 1 · 1/2
    filename: w01-sample-1.swift
    lang: swift
    source: |
      import SwiftUI

      @main
      struct BitacoraApp: App {
          var body: some Scene {
              WindowGroup { ContentView() }
          }
      }

      struct ContentView: View {
          var body: some View { Text("Hola, Bitácora") }
      }
    annotations:
    - label: Contexto
      text: Fragmento del archivo de ejemplo. Conserva los tipos e imports de su contexto.
    - label: Comprobación
      text: Explica entradas, estado y resultado esperado.
