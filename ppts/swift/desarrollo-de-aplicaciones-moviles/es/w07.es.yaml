- code:
    eyebrow: SwiftUI
    title: Ejemplo 1
    filename: w07-sample-1.swift
    lang: swift
    source: |
      @Observable
      final class ReportStore {
          private(set) var reports: [Report] = []
          private let repo: ReportRepository

          init(repo: ReportRepository) { self.repo = repo }

          func add(_ report: Report) {
              reports.append(report)
              repo.save(report)
          }
      }
    annotations:
    - label: Contexto
      text: Fragmento del archivo de ejemplo. Conserva los tipos e imports de su contexto.
    - label: Comprobación
      text: Explica entradas, estado y resultado esperado.
    notes: |-
      Sample source: SwiftUI realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://developer.apple.com/documentation/swiftui
- quiz:
    eyebrow: Comprobación
    question: ¿Cómo puedes probar reglas de dominio sin conexión de red?
    options:
    - Eliminar todas las comprobaciones
    - Poner cada regla en la vista
    - Esperar al servidor de producción
    - Inyectar un repositorio en memoria con el mismo contrato
    notes: Respuesta D. La vista coordina interacción. El dominio decide reglas y el repositorio abstrae los datos.
