- quiz:
    eyebrow: Comprobación
    question: El usuario sale mientras corre una solicitud. ¿Qué protege el estado de la nueva pantalla?
    options:
    - Tratar todo error como éxito
    - Forzar éxito inmediato
    - Cancelar la solicitud e ignorar resultados tardíos
    - Bloquear navegación hasta terminar
    notes: Respuesta C. Una solicitud remota puede tardar o fallar. La interfaz necesita estados de carga, éxito, vacío y error.
