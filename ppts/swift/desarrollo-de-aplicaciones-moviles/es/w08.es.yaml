- code:
    eyebrow: SwiftUI
    title: Ejemplo 1 · 1/2
    filename: w08-sample-1.swift
    lang: swift
    source: |
      struct Category: Decodable, Identifiable {
          let id: String
          let label: String
      }

      func fetchCategories() async throws -> [Category] {
          let url = API.base.appending(path: "categories")
          let (data, resp) = try await URLSession.shared
              .data(from: url)
          guard (resp as? HTTPURLResponse)?.statusCode == 200
          else { throw URLError(.badServerResponse) }
          return try JSONDecoder()
    annotations:
    - label: Contexto
      text: Fragmento del archivo de ejemplo. Conserva los tipos e imports de su contexto.
    - label: Comprobación
      text: Explica entradas, estado y resultado esperado.
    notes: |-
      Sample source: SwiftUI realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://developer.apple.com/documentation/swiftui
