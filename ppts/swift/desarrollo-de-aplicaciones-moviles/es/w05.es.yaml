- quiz:
    eyebrow: Comprobación
    question: Dos vistas muestran copias contradictorias del mismo campo. ¿Qué debe cambiar?
    options:
    - Agregar otra copia
    - Asignar un dueño al campo y comunicar cambios mediante un contrato
    - Actualizar al azar
    - Quitar la validación
    notes: Respuesta B. El estado tiene un dueño. Los eventos modifican ese estado y la interfaz refleja el cambio.
