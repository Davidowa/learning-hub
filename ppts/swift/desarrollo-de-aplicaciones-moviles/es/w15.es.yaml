      Sample source: SwiftUI realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://developer.apple.com/documentation/swiftui
- quiz:
    eyebrow: Comprobación
    question: Una clave secreta está incluida en el paquete de la app. ¿Qué debes asumir?
    options:
    - La minificación es cifrado
    - La tienda la oculta permanentemente
    - El nombre del archivo la mantiene privada
    - El receptor puede extraerla; usa autorización en el servidor
    notes: Respuesta D. La publicación distribuye software y también compromisos de privacidad, seguridad y mantenimiento.
