- code:
    eyebrow: SwiftUI
    title: Ejemplo 1
    filename: w11-sample-1.swift
    lang: swift
    source: |
      .task {
          do {
              let updates = CLLocationUpdate.liveUpdates()
              for try await update in updates {
                  guard let loc = update.location else { continue }
                  draft.coordinate = loc.coordinate
                  break        // una lectura basta para el reporte
              }
          } catch {
              draft.locationError = error
          }
      }
    annotations:
    - label: Contexto
      text: Fragmento del archivo de ejemplo. Conserva los tipos e imports de su contexto.
    - label: Comprobación
      text: Explica entradas, estado y resultado esperado.
    notes: |-
      Sample source: SwiftUI realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://developer.apple.com/documentation/swiftui
- quiz:
    eyebrow: Comprobación
    question: Un sensor fluctúa alrededor de una referencia. ¿Qué debes comprobar?
    options:
    - Solo la popularidad de la dependencia
    - Si el título es corto
    - Solo el color del número
    - Unidades, muestreo, ruido y comparación con la referencia
    notes: Respuesta D. Un sensor produce muestras con unidades, ruido y costo de energía. La precisión debe comprobarse.
