- code:
    eyebrow: SwiftUI
    title: Ejemplo 1
    filename: w09-sample-1.swift
    lang: swift
    source: |
      @Model
      final class Report {
          var title: String
          var status: String = "pending"
          var createdAt: Date = Date.now
          var photoPath: String?

          init(title: String) { self.title = title }
      }

      @Query(sort: \Report.createdAt, order: .reverse)
      private var reports: [Report]
    annotations:
    - label: Contexto
      text: Fragmento del archivo de ejemplo. Conserva los tipos e imports de su contexto.
    - label: Comprobación
      text: Explica entradas, estado y resultado esperado.
    notes: |-
      Sample source: SwiftUI realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://developer.apple.com/documentation/swiftui
- quiz:
    eyebrow: Comprobación
    question: Una actualización del esquema falla a la mitad. ¿Qué diseño conserva la base anterior?
    options:
    - Borrar la base al iniciar
    - Aplicar cambios de esquema y versión en una transacción
    - Aumentar la versión antes de cambiar tablas
    - Ignorar la falla
    notes: Respuesta B. La copia local y el servidor pueden divergir. Sincronizar requiere identificar cambios y resolver conflictos.
