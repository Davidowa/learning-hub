slides:
  - cover:
      kicker: Facultad de Empresariales · 2026
      unit: Semana 12 · Sesiones 23 y 24 · Parcial, simulacro y BUSCARV
      title: Manejo y Análisis de la Información
      subtitle: >-
        El segundo examen parcial, el simulacro de certificación en condiciones de examen,
        y la media sesión que sobra abre la función con la que corre el resto del periodo.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, TIA501 · Empresariales]
        - [Sesiones, 23 y 24 de 34]
      notes: |
        Sesiones 23 y 24 del programa, CLO08. La sesión 23 es el segundo examen parcial;
        la sesión 24 es el simulacro de certificación INNOVATIQ y la apertura de BUSCARV.
        COBERTURA.md no asigna objetivos nuevos a esta semana. BUSCARV es la mitad
        delantera del Expert 3.2.1, que la semana 13 cubre junto con BUSCARH, ÍNDICE y
        COINCIDIR.
        Esta es también la semana en que abre el componente autogestivo de INNOVATIQ.
        Vale 5 por ciento del curso y es donde quedan anclados los objetivos Expert 1.3.1
        y 1.3.2, los dos de idioma, porque ninguna sesión los cubre.
        Los pesos de evaluación salen del programa. El ejercicio 19, BUSCARV dentro de un
        modelo de nómina, se deja aquí y se recoge en la semana 13.

  - agenda:
      eyebrow: Agenda
      title: Tres bloques de trabajo
      cards:
        - title: El segundo parcial
          desc: Qué pregunta la sesión 23, de dónde sale cada pregunta y cómo se arma el treinta por ciento
        - title: El simulacro de certificación
          desc: Qué es en realidad un examen MOS, para cuáles dos exámenes prepara este curso y qué deja fuera
        - title: Abre BUSCARV
          desc: Cuatro argumentos, uno que se fija con F4 y otro que no es lo que sugiere su valor de fábrica
        - title: Tu turno
          desc: Un modelo de nómina con tres tablas de referencia y diez vendedores, para la próxima semana

  - objectives:
      eyebrow: Objetivos de la sesión
      title: Al terminar las dos sesiones el alumno podrá…
      items:
        - head: Presentar el segundo parcial sabiendo qué se lee
          sub: El archivo final, y la ruta que lo produjo, que son dos cosas distintas
        - head: Presentar el simulacro en condiciones de examen
          sub: Un Excel real, un libro que se le entrega y una lista de tareas que se califica sobre el archivo que deja
        - head: Decir para qué lo certifica este curso
          sub: Dos exámenes, los objetivos que alcanza en clase y los seis que deliberadamente no
        - head: Escribir un BUSCARV que sobrevive al llenado
          sub: El rango de la tabla fijado con F4, y el número de columna contado dentro de la tabla
        - head: Distinguir una coincidencia exacta de una aproximada
          sub: FALSO contra VERDADERO, y por qué dejar vacío el cuarto argumento es una decisión y no un hueco

  - roadmap:
      eyebrow: Mapa del curso
      title: Dónde cae esta semana en el periodo
      phases:
        - label: A · Semanas 1–2
          title: Word, y después la cinta
          desc: Documentos largos, y la primera pasada por la cuadrícula de Excel
          state: done
        - label: B · Semanas 3–4
          title: Hojas y funciones
          desc: Nombres, referencias, precedencia, estadística, texto y fechas
          state: done
        - label: C · Semanas 5–8
          title: Lógica condicional
          desc: Formato por regla, SI, comodines, anidamiento y la familia .CONJUNTO
          state: done
        - label: D · Semanas 9–13
          title: Datos, tablas y búsqueda
          desc: Importación, filtros, tablas, gráficos y las funciones de búsqueda
          state: now
        - label: E · Semanas 14–17
          title: Resumir y entregar
          desc: Tablas dinámicas, filtros avanzados, análisis de hipótesis e impresión
          state: todo

