  - method:
      eyebrow: Bloque 01 · Cómo se arma el treinta por ciento
      title: Setenta puntos de examen, treinta de trabajo ya hecho
      statement: El parcial 2 vale treinta por ciento del curso. Setenta de esos puntos son el examen de la sesión 23, y los otros treinta son las tareas y actividades de las semanas 7 a 11.
      points:
        - label: El examen
          text: En el laboratorio, sobre un libro que se te entrega. Lo que se califica es el archivo que dejas y la manera en que llegaste ahí.
        - label: Las tareas
          text: En el parcial 1 ese treinta por ciento se acreditó solo a quienes tenían cubierto el pago de la certificación. En el parcial 2 esa condición no aplica.
        - label: El hábito
          text: Cada ruta practicada desde la semana 9 es la que vigila la certificación. Úsala también en el parcial, para no cargar con dos hábitos distintos.

  - pitfalls:
      eyebrow: Bloque 01 · Errores comunes
      title: Cuatro maneras de perder puntos ya ganados
      items:
        - label: Error 01
          title: Dar formato desde la cinta
          desc: >-
            El relleno y el color de letra en dos clics de la pestaña Inicio dan la misma
            imagen que Ctrl+1. Cuando la tarea nombra el cuadro Formato de celdas, solo
            uno de los dos cuenta.
        - label: Error 02
          title: Ordenar dos veces en vez de agregar nivel
          desc: >-
            Dos pasadas de [Sort A to Z] llegan al mismo acomodo con datos sencillos y no
            dejan ningún nivel en el cuadro de diálogo para que alguien lo lea después.
        - label: Error 03
          title: Armar el gráfico desde la galería
          desc: >-
            Un clic y una miniatura. Nunca abre la vista previa donde se elige el subtipo
            que la tarea nombró y se compara contra sus vecinos.
        - label: Error 04
          title: Una SUMA tecleada bajo la tabla
          desc: >-
            El número está bien, la tabla no lo posee, y se queda quieto cuando la lista
            se filtra. La casilla Fila de totales es la respuesta.

  - divider:
      eyebrow: Bloque 02
      title: El simulacro de certificación
      lede: >-
        La sesión 24 corre el simulacro en condiciones de examen. Conviene saber de
        antemano qué tipo de examen imita, porque no es el que estás acostumbrado a
        presentar.
      block: 2

  - concept:
      eyebrow: Concepto clave
      title: Un examen MOS es un proyecto, no un cuestionario
      lead: >-
        No hay reactivos de opción múltiple sobre cómo se llama un cuadro de diálogo. Se
        te entrega un libro y una lista de tareas escritas como las pide una oficina, y lo
        que se lee es el archivo que dejas. Quien califica no puede verte trabajar, solo
        lo que el trabajo dejó en el archivo.
      panel:
        label: La consecuencia
        title: La ruta equivocada puede valer cero
        note: >-
          Dos clics en la cinta y una visita a Formato de celdas producen la misma celda
          de color. Solo uno de los dos deja la evidencia que la tarea fue escrita para
          buscar.
      steps:
        - text: Lees la tarea, en lenguaje de oficina
        - text: La haces en un Excel real, con la cinta real
        - text: Después se lee el archivo, no a ti
          loop: ↺ y la siguiente tarea arranca del archivo que acabas de dejar

  - table:
      eyebrow: Bloque 02 · Lo que cubre este curso
      title: Dos exámenes, y los seis objetivos que deja fuera
      headers: [Examen o grupo, Contenido, Objetivos]
      rows:
        - ["MO-200 Associate", "Cinco dominios, de libros a gráficos", "59"]
        - ["MO-201 Expert", "Cuatro dominios, de opciones a dinámicas", "48"]
        - ["En las 34 sesiones", "Los dos exámenes, edición 2019", "100"]
        - ["Dejado de tarea", "DIASEM y DIA.LAB", "1"]
        - ["Fuera de alcance", "Grabar macros, idiomas", "6"]

  - tiers:
      eyebrow: Bloque 02 · Qué esperar, y qué sigue abierto
      title: La forma, el simulacro, la versión y la revisión
      items:
        - key: Forma
          title: Un Excel real, no un cuestionario en el navegador
          desc: Un libro, una lista de tareas y el estado del archivo al final. Nada da crédito por casi haberlo hecho.
        - key: Simulacro
          title: Sesión 24, en condiciones de examen
          desc: Las mismas reglas que el examen real. El punto no es la calificación, es descubrir cuáles rutas solo crees que sabes.
        - key: Versión
          title: Cuál examen vas a presentar de verdad
          desc: MO-210 para el Associate y MO-201 para el Expert mientras el grupo trabaje en español. El MO-211 solo se ofrece en inglés.
        - key: Revisión
          title: Si el laboratorio corre 2019 o 365
          desc: Ocho funciones de los exámenes de 365 no existen en Office 2019. Contesta esto antes de comprar cualquier voucher.

  - method:
      eyebrow: Bloque 02 · El componente autogestivo
      title: Cinco por ciento que no cuesta tiempo de sesión
      statement: El curso autogestivo de INNOVATIQ abre esta semana, corre todo el periodo y hay que terminarlo antes de la semana 16. Es la única parte del curso que no ocupa nada de tiempo de clase.
      points:
        - label: Por qué está aquí
          text: La semana 12 es donde abre, porque el simulacro es donde descubres cuáles partes de la lista de objetivos no has tocado todavía.
        - label: Qué carga
          text: Dos objetivos del Expert viven ahí y en ningún otro lado. El 1.3.1, configurar los idiomas de edición y de presentación, y el 1.3.2, usar funciones específicas de idioma.
        - label: El detalle
          text: El MO-211, el Expert de Microsoft 365, borra el dominio de idiomas por completo. Si el grupo termina presentando ese examen, esos dos dejan de existir.

  - divider:
      eyebrow: Bloque 03
      title: Abre BUSCARV
      lede: >-
        Media sesión, una función, y el principio de todo lo que hacen las semanas 13 a
        16. Dos tablas dejan de ser dos tablas en cuanto una puede leer a la otra.
      block: 3

  - concept:
      eyebrow: Concepto clave
      title: Qué sustituye una búsqueda
      lead: >-
        El ejercicio 19 tiene diez vendedores y una tabla de cuatro tipos de vendedor. Sin
        una búsqueda, alguien teclea el sueldo base diez veces. Cambia el sueldo del tipo
        B y nada del reporte se entera. Una búsqueda hace que el reporte le pregunte a la
        tabla, y la tabla queda como el único lugar donde vive el número.
      panel:
        label: La condición que BUSCARV te impone
        title: La llave va en la primera columna de la tabla
        note: >-
          No la primera columna de la hoja. La primera columna del rango que le entregas.
          Cuando la llave no está ahí, BUSCARV no puede ver a su izquierda, y ese es justo
          el muro contra el que choca la semana 13 y que responde con ÍNDICE y COINCIDIR.
      steps:
        - text: El reporte tiene la llave, aquí el tipo de vendedor
        - text: La tabla tiene la llave y las respuestas
        - text: BUSCARV recorre la primera columna
          loop: ↺ y devuelve la celda N columnas a la derecha del acierto

  - code:
      eyebrow: Bloque 03 · Los cuatro argumentos
      title: Tres de ellos son obvios y el cuarto no
      filename: buscarv.xlsx
      lang: excel
      source: |
        =BUSCARV([lookup_value],[table_array],
                 [col_index_num],[range_lookup])

        1  La llave. Relativa, para que baje al llenar.
        2  Toda la tabla de referencia, con su primera columna.
           Presiona F4 para fijarla en $A$15:$C$18.
        3  Se cuenta desde la primera columna de [table_array],
           no desde la columna A de la hoja de cálculo.
        4  FALSO es coincidencia exacta, VERDADERO la aproximada.
           Vacío no es FALSO. Vacío quiere decir VERDADERO.
      annotations:
        - label: Por qué importa F4
          text: Un rango de tabla relativo baja por la hoja conforme se llena la fórmula, un renglón por renglón.
        - label: Contar la columna
          text: Si le entregas A15 a C18, el sueldo base es la columna 2, con la letra que traiga.
        - label: El valor de fábrica
          text: VERDADERO necesita la primera columna ordenada de menor a mayor. Con datos sin ordenar devuelve una respuesta equivocada.
        - label: Si falla
          text: "#N/D quiere decir que nada coincidió. Léelo antes de envolverlo en cualquier cosa."
          accent: true

  - steps:
      eyebrow: Bloque 03 · La ruta que se califica
      title: Por el cuadro [Function Arguments]
      items:
        - label: '01'
          title: Selecciona la celda
          desc: La que va a tener la búsqueda, en el reporte, no en la tabla de referencia.
        - label: '02'
          title: Fórmulas, [Lookup & Reference]
          desc: Pestaña Fórmulas, grupo [Function Library], [Lookup & Reference], y luego BUSCARV. Shift+F3 abre [Insert Function] sobre la misma lista.
        - label: '03'
          title: '[Lookup_value]'
          desc: Haz clic en la celda que tiene la llave. Déjala relativa si la fórmula se va a llenar hacia abajo, que siempre va a pasar.
        - label: '04'
          title: '[Table_array], y luego F4'
          desc: Selecciona toda la tabla de referencia con su primera columna, y presiona F4. Aquí es donde los candidatos pierden puntos.
        - label: '05'
          title: Las dos últimas casillas
          desc: '[Col_index_num] contado dentro del rango de la tabla. [Range_lookup] escrito como FALSO, con todas sus letras, no vacío.'

  - code_output:
      eyebrow: Medido · Ejercicio 19, la hoja Report
      title: Las mismas dos fórmulas, diez renglones aparte
      filename: report.xlsx
      lang: excel
      output_label: Lo que regresa
      source: |
        =BUSCARV($D3,Table!$A$15:$C$18,2,FALSO)
        =BUSCARV($D3,Table!$A$15:$C$18,3,FALSO)

        D3 tiene el tipo de vendedor. La tabla de
        referencia tiene A, B, C y D en su primera
        columna, el sueldo base mensual en la
        segunda y la meta de ventas en la tercera.

        Llenada hasta el renglón 12, ese
        $A$15:$C$18 fijo es la única razón por la
        que el renglón 12 sigue leyendo las mismas
        cuatro filas.
      output: |
        Javier Lopez      A     50,000
        Meta de ventas      20,000,000
        Monto vendido       22,000,000
        Diferencia           2,000,000
        Diferencia %             10.0 %
        Andrea Legarreta  D     20,000
        Meta de ventas       5,000,000
        Monto vendido        2,000,000
        Diferencia          -3,000,000
        Diferencia %            -60.0 %

  - compare:
      eyebrow: Bloque 03 · Las dos rutas
      title: La misma fórmula, escrita de dos maneras
      before:
        label: Se califica · el cuadro de diálogo
        file: ruta.txt
        lang: text
        code: |
          Fórmulas, [Lookup & Reference], BUSCARV
          [Lookup_value]  clic en D3
          [Table_array]   arrastra y presiona F4
          [Col_index_num] teclea 2
          [Range_lookup]  teclea FALSO
          [OK]
      after:
        label: No se califica · tecleado a mano
        file: ruta.txt
        lang: text
        code: |
          Teclea =BUSCARV( y arrastra la tabla
          Presiona F4 si te acuerdas
          Teclea ,2, y cierra el paréntesis
          Deja fuera el cuarto argumento

          Correcta hoy, equivocada en la primera
          tabla de referencia sin ordenar
      note: >-
        Teclearla es más rápido y todos lo hacemos. La razón para aprender el cuadro de
        diálogo es que muestra las cuatro casillas con su nombre, y la tarea del día del
        examen está escrita con esos nombres. [Range_lookup] no es una palabra que alguien
        diga en voz alta.

  - table:
      eyebrow: Bloque 03 · Un argumento, un error clásico
      title: A dónde se van los puntos en realidad
      headers: [Argumento, Qué recibe, El error]
      rows:
        - ["[Lookup_value]", "La celda que tiene la llave", "Fijarla por costumbre"]
        - ["[Table_array]", "La tabla, con su primera columna", "Sin F4, y se recorre"]
        - ["[Col_index_num]", "Contado dentro del rango dado", "Contado desde la columna A"]
        - ["[Range_lookup]", "FALSO para coincidencia exacta", "Vacío, que es VERDADERO"]
        - ["El resultado", "El valor N columnas a la derecha", "Envolver el error sin leerlo"]

  - pitfalls:
      eyebrow: Bloque 03 · Errores comunes
      title: Cuatro maneras en que BUSCARV responde mal
      items:
        - label: Error 01
          title: La llave no está en la primera columna
          desc: >-
            BUSCARV no puede ver a su izquierda. El ejercicio 21 está construido justo
            sobre esto, y la próxima semana lo responde con ÍNDICE y COINCIDIR en vez de
            mover la columna.
        - label: Error 02
          title: El rango de la tabla quedó relativo
          desc: >-
            El renglón 3 lee la tabla correcta y el renglón 12 lee nueve filas más abajo.
            Algunos todavía devuelven un número, y por eso nadie se da cuenta.
        - label: Error 03
          title: VERDADERO sobre una tabla sin ordenar
          desc: >-
            La coincidencia aproximada supone que la primera columna sube. Con datos sin
            ordenar devuelve lo último donde se detuvo, en silencio, sin ningún valor de
            error.
        - label: Error 04
          title: Texto que no es el mismo texto
          desc: >-
            Un espacio al final, o un número guardado como texto contra un número real.
            Los dos dan #N/D, y los dos se ven idénticos en la celda.

  - quiz:
      eyebrow: Comprobación rápida
      question: Le entregas a BUSCARV el rango A15 a C18 y quieres la meta de ventas, que está en la columna C. ¿Cuál es [Col_index_num]?
      options:
        - 3, contado desde la primera columna del rango de la tabla
        - 1, porque C es la primera columna que trae la respuesta
        - 3, pero solo si la tabla empieza en la columna A de la hoja
        - Depende de si [Range_lookup] es VERDADERO o FALSO

  - lab:
      eyebrow: Laboratorio · la media sesión
      title: Las primeras dos búsquedas del modelo de nómina
      brief: >-
        En la hoja Report del ejercicio 19, llenen el sueldo base mensual y la meta de
        ventas de los primeros tres vendedores con BUSCARV, construido desde el cuadro
        [Function Arguments]. Luego llenen la fórmula hasta el renglón 12 y comprueben que
        Andrea Legarreta, de tipo D, sigue leyendo veinte mil y cinco millones.
      blocks:
        - label: Entregable
          text: Las dos columnas llenas, y la barra de fórmulas visible para el renglón 3 y para el renglón 12
        - label: Restricción
          text: '[Range_lookup] escrito como FALSO en las dos. No vacío, no tecleado como 0.'
        - label: La prueba
          text: Cambien el sueldo base del tipo B en la tabla de referencia. Dos renglones del reporte tienen que moverse.

  - takeaways:
      eyebrow: Resumen
      title: Tres cosas para llevarse
      items:
        - title: Lo que se lee es el archivo
          desc: >-
            En el parcial, en el simulacro y en la certificación, nadie te ve trabajar. La
            ruta cuenta solo en la medida en que deja algo dentro del archivo
        - title: El simulacro sirve para hallar huecos
          desc: >-
            Una calificación baja en la sesión 24 no cuesta nada y te dice cuáles rutas
            solo creías saber, cuando todavía quedan cinco semanas para arreglarlas
        - title: La búsqueda deja un lugar con autoridad
          desc: >-
            El número se escribe una vez, en la tabla de referencia, y cada renglón que lo
            necesita pregunta. Teclearlo diez veces son diez lugares que se te olvidan

  - homework:
      eyebrow: Tarea
      title: Ejercicio 19, entrega y calificación
      brief: >-
        El modelo de nómina. Tres tablas de referencia, diez vendedores y diecinueve
        columnas por llenar. BUSCARV exacto para el sueldo base y la comisión, BUSCARV
        aproximado para el rango del bono, aritmética de fechas para la antigüedad,
        formato condicional sobre la diferencia, y dos decisiones armadas con SI combinado
        con Y y con O.
      meta:
        - [Entrega, "Semana 13, sesión 25"]
        - [Formato, Blackboard · un .xlsx]
        - [Peso, Parte de la calificación de tareas]
      rubric:
        - ["Búsquedas exactas", "30 %", "Rango de la tabla fijado, columna contada dentro, FALSO escrito"]
        - ["Búsqueda aproximada", "25 %", "Una escalera numérica, de menor a mayor, con los límites revisados"]
        - ["Fechas y formatos", "20 %", "Antigüedad en años, y el formato condicional sobre la diferencia"]
        - ["Las dos decisiones", "25 %", "SI con Y para el premio, SI con O para la letra"]

  - closing:
      title: Preguntas
      subtitle: >-
        La próxima sesión, BUSCARV a fondo, luego BUSCARH, y el par que responde el caso
        donde la llave no está en la primera columna. Traigan terminado el ejercicio 19.
      meta:
        - [Correo, descobarc@up.edu.mx]
        - [Mensajería, Google Chat institucional]
        - [Repositorio, github.com/davidowa/learning-hub]
