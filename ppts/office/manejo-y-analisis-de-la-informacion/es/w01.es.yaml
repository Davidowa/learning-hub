meta:
  course: Manejo y Análisis de la Información
  code: TIA501
  lang: es
  language: excel
  week: 1
  footer: MANEJO Y ANÁLISIS DE LA INFORMACIÓN · TIA501 · EXCEL
  blocks: 3

slides:
  - cover:
      kicker: Facultad de Empresariales · 2026
      unit: Semana 01 · Encuadre del curso y la regla que califica cada tarea
      title: Manejo y Análisis de la Información
      subtitle: >-
        Las sesiones 1 y 2 son de Word. Esta presentación encuadra el resto del semestre,
        qué mide la certificación y cómo se califica el periodo.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, TIA501 · Empresariales]
        - [Sesiones, 1 y 2 de 34]
      notes: >-
        Fuentes de esta presentación. La tabla de evaluación, las reglas de operación y la
        redacción de los objetivos vienen del programa de TIA501 de diciembre. El conteo de
        objetivos y la comparación de versiones salen de COBERTURA.md. Las rutas que se citan
        en las diapositivas del bloque 3 vienen de procedures.en.md, objetivo 2.2.6.

  - agenda:
      eyebrow: Agenda
      title: Tres bloques de trabajo
      cards:
        - title: Qué mide el examen
          desc: Dos certificaciones, ciento siete objetivos, y por qué la ruta cuenta más que el resultado
        - title: Cómo se califica el semestre
          desc: Dos parciales, un proyecto, el curso autogestivo y el examen final
        - title: La regla del curso
          desc: La ruta que califica y la ruta rápida, en la primera tarea de formato del semestre
        - title: Dónde entra Word
          desc: Las sesiones 1 a 4 son en parte procesador de texto, y estas presentaciones llevan la mitad de Excel

  - objectives:
      eyebrow: Objetivos de la sesión
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Decir qué pide cada una de las dos certificaciones
          sub: MO-200 Associate con 59 objetivos, MO-201 Expert con 48
        - head: Ubicar cada evaluación en el semestre
          sub: Qué cubre cada una, cuándo cae y cuánto pesa
        - head: Distinguir la ruta que califica de la ruta rápida
          sub: La misma imagen en pantalla, distinta calificación, y cómo comprobar cuál usaste
        - head: Explicar por qué el material está escrito para 2019
          sub: El temario más completo, y sin depender de funciones que el laboratorio quizá no tenga
        - head: Trabajar con las reglas de operación desde hoy
          sub: Asistencia, entregas, condiciones de examen y uso de inteligencia artificial
        - head: Decir qué no enseña este curso
          sub: Grabar macros le toca a TIA503, y el procesador de texto tiene sus cuatro sesiones

  - roadmap:
      eyebrow: Mapa del curso
      title: Dónde cae esta semana en el semestre
      phases:
        - label: A · Semanas 1–2
          title: Word, y luego la cinta
          desc: Documentos largos, y la primera pasada por la cuadrícula de Excel
          state: now
        - label: B · Semanas 3–4
          title: Hojas y funciones
          desc: Nombres, referencias, precedencia, estadística, texto y fechas
          state: todo
        - label: C · Semanas 5–8
          title: Lógica condicional
          desc: Formato por regla, SI, comodines, anidamiento y la familia *.SI.CONJUNTO
          state: todo
        - label: D · Semanas 9–13
          title: Datos, tablas y búsqueda
          desc: Importar, filtros, tablas, gráficos y las funciones de búsqueda
          state: todo
        - label: E · Semanas 14–17
          title: Resumen y entrega
          desc: Tablas dinámicas, filtro avanzado, análisis de hipótesis e impresión
          state: todo

  - divider:
      eyebrow: Bloque 01
      title: Qué mide en realidad el examen
      lede: >-
        No la hoja que entregas. La secuencia de clics que la produjo, que es otra cosa y
        vale la pena aprenderla a propósito.
      block: 1

  - stat:
      eyebrow: Los dos dominios de objetivos
      value: '107'
      text: >-
        objetivos entre los dos exámenes Microsoft Office Specialist para los que prepara
        este curso.
      note: >-
        Cincuenta y nueve en MO-200 Associate, cuarenta y ocho en MO-201 Expert. El programa
        tal como está escrito cubre cuarenta y cuatro. Los otros sesenta y tres se agregan
        semana con semana, sin mover una sola sesión.

  - table:
      eyebrow: Bloque 01 · Los cuatro exámenes de la familia
      title: Contra qué temario está escrito este curso
      headers: [Examen, Temario, Objetivos, Dónde queda]
      rows:
        - ["MO-200", "Excel Associate 2019", "59", "La base de este curso"]
        - ["MO-201", "Excel Expert 2019", "48", "La base, y existe en español"]
        - ["MO-210", "Excel Associate 365", "Agrega 5", "Lo que nombra el programa"]
        - ["MO-211", "Excel Expert 365", "Agrega 6", "Solo en inglés. Quita un dominio"]

  - concept:
      eyebrow: Decisión clave
      title: Por qué el material está escrito para 2019
      lead: >-
        Los dominios de 2019 son el temario más completo de los cuatro. MO-211 elimina el
        dominio de idioma completo y quita el gráfico de mapa, y las ocho funciones que
        agrega 365 no existen en Office 2019. Enseñar la lista de 2019 cubre más terreno y
        no se rompe en una máquina del laboratorio.
      panel:
        label: La consecuencia
        title: Nada de aquí pide una función que 2019 no tenga
        note: >-
          BUSCARX, FILTRAR, ORDENAR, UNICOS, SECUENCIA, ORDENARPOR, MATRIZALEAT y LET existen
          solo en Microsoft 365. Ninguna diapositiva, ningún ejercicio y ninguna pregunta de
          examen de este curso se apoya en alguna de ellas.
      steps:
        - text: La lista de 2019 es la más larga
        - text: Todas las sesiones enseñan desde ahí
        - text: Lo que agrega 365 se menciona, no se exige
          loop: ↺ así la misma presentación corre en cualquier versión del laboratorio

  - steps:
      eyebrow: Bloque 01 · MO-200 Associate
      title: Cinco dominios, cincuenta y nueve objetivos
      items:
        - label: '01'
          title: Hojas de cálculo y libros
          desc: 18 objetivos. Importar, navegación, configurar página, vistas e impresión. Semanas 3, 9 y 17.
        - label: '02'
          title: Celdas y rangos de datos
          desc: 17 objetivos. Formato, relleno, nombres definidos y formato condicional. Semanas 2, 3 y 5.
        - label: '03'
          title: Tablas y datos de tabla
          desc: 8 objetivos. Tablas, estilos, fila de totales, filtros y ordenamiento. Semanas 9 y 10.
        - label: '04'
          title: Fórmulas y funciones
          desc: 8 objetivos. Tipos de referencia y funciones estadísticas, de texto y lógicas. Semanas 3 a 8.
        - label: '05'
          title: Gráficos
          desc: 8 objetivos. Gráficos, hojas de gráfico, elementos, diseños y texto alternativo. Semanas 10 y 11.

  - divider:
      eyebrow: Bloque 02
      title: Cómo se califica el semestre
      lede: >-
        Cinco componentes, dos de ellos de treinta por ciento cada uno, y una regla sobre el
        primer parcial que conviene leer dos veces.
      block: 2

  - table:
      eyebrow: Evaluación del curso
      title: Cinco componentes, cien por ciento
      headers: [Rubro, Qué cubre, Cuándo, Peso]
      rows:
        - ["Parcial 1", "Word y el primer bloque de Excel", "Semana 6", "30 %"]
        - ["Parcial 2", "Lógica, datos, tablas y gráficos", "Semana 12", "30 %"]
        - ["Proyecto", "Datos reales, analizados", "Semana 16", "15 %"]
        - ["INNOVATIQ", "Curso autogestivo de certificación", "Antes de la semana 16", "5 %"]
        - ["Examen final", "Todas las unidades", "Semana 17", "20 %"]

  - concept:
      eyebrow: Bloque 02 · Los parciales
      title: Cada parcial son dos calificaciones, no una
      lead: >-
        El setenta por ciento del parcial es el examen en el salón. El otro treinta son las
        tareas y actividades de las semanas que cubre. En el parcial 1 ese treinta se
        acredita solo a quien haya cubierto el pago de la certificación. La parte del examen
        se califica para todos.
      panel:
        label: Qué cubre cada uno
        title: La semana 6 es Word y el primer bloque de Excel
        note: >-
          Formato, manejo de hojas de cálculo, referencias, funciones estadísticas, de texto
          y de fecha, formato condicional y SI. La semana 12 toma comodines, Y y O, SI
          anidado, la familia *.SI.CONJUNTO, [Get & Transform], filtros, tablas y gráficos.
      steps:
        - text: El examen es el 70 % del parcial
        - text: Tareas y actividades son el otro 30 %
        - text: El parcial 1 condiciona ese 30 % al pago
          loop: ↺ así una tarea sin entregar cuesta dos veces, ahora y en la semana 6

  - steps:
      eyebrow: Reglas de operación
      title: Lo que aplica desde hoy
      items:
        - label: '01'
          title: Asistencia
          desc: Se toma en los primeros cinco minutos. Del minuto cinco al quince cuenta como retardo, y dos retardos son una falta.
        - label: '02'
          title: Del minuto dieciséis
          desc: No hay entrada al salón y se registra falta. La sesión termina diez minutos antes de la hora publicada.
        - label: '03'
          title: Dispositivos
          desc: Celulares, audífonos y lentes con inteligencia artificial van al frente del salón antes de empezar.
        - label: '04'
          title: Entregas
          desc: Solo por Blackboard, en la fecha marcada. El correo no es canal de entrega y las tareas no se reponen.
        - label: '05'
          title: Exámenes
          desc: En las máquinas del salón. Se permiten apuntes, tus propias entregas, la web y una memoria USB. La mensajería no.

  - method:
      eyebrow: Código de honor
      title: Qué cuenta como trabajo propio
      statement: Puedes usar inteligencia artificial para entender. No puedes entregar un libro que no sepas explicar.
      points:
        - label: Permitido
          text: Pedirle a una herramienta que te explique un valor de error, un argumento o un cuadro de diálogo que no reconoces, fuera de condiciones de examen
        - label: No permitido
          text: Entregar una fórmula que no podrías recorrer celda por celda si me paro en tu lugar y te pregunto
        - label: Cómo se revisa
          text: Las entregas pasan por Copyleaks y Turnitin. Arriba del treinta por ciento el trabajo se califica en cero, y puedo pedirte que defiendas cualquier parte en voz alta.

  - divider:
      eyebrow: Bloque 03
      title: La regla que rige cada ejercicio
      lede: >-
        La certificación no califica la hoja que produjiste. Califica cómo la produjiste, y
        las dos no son la misma habilidad.
      block: 3

  - concept:
      eyebrow: Concepto clave
      title: Dos rutas, una imagen, dos calificaciones
      lead: >-
        Cambiar el color de letra y el relleno de un rango son dos clics en la pestaña
        Inicio. Cualquiera puede. El examen busca al candidato que entra al menú extendido y
        aplica los dos desde ahí, en una sola operación. Solo una de las dos responde el
        reactivo.
      panel:
        label: Por qué el dominio está armado así
        title: La lista misma separa las dos rutas
        note: >-
          MO-200 enlista el 2.2.5, aplicar formatos de número, y el 2.2.6, aplicar formatos
          de celda desde el cuadro de diálogo Formato de celdas, como dos objetivos
          distintos. Los dos llegan a la misma imagen y solo uno es lo que pide el 2.2.6.
      steps:
        - text: Aprende la ruta rápida, la vas a usar en el trabajo
        - text: Aprende la ruta que califica, es la que puntúa
        - text: Distingue cuál es cuál antes de que corra el reloj
          loop: ↺ cada diapositiva de procedimiento del semestre nombra las dos

  - compare:
      eyebrow: Bloque 03 · El mismo rango, con formato dos veces
      title: Tres operaciones contra una
      before:
        label: La ruta rápida, no califica
        file: cinta.txt
        lang: text
        code: |
          Inicio > Fuente > [Font Color] > Rojo
          Inicio > Fuente > [Fill Color] > Amarillo claro
          Inicio > Fuente > Bordes > Todos los bordes
      after:
        label: La ruta que califica
        file: formato-celdas.txt
        lang: text
        code: |
          Ctrl+1
            Pestaña Fuente > Color > Rojo
            Pestaña Relleno > [Background Color] > amarillo
            Pestaña Borde > Estilo, Color, luego Esquema
          Aceptar
      note: >-
        La misma imagen en pantalla. Ahora presiona Ctrl+Z una sola vez. Después del cuadro
        de diálogo, el color de letra y el relleno se van juntos, porque fueron una sola
        operación. Después de la cinta solo se van los bordes. Ese único deshacer es la
        manera más rápida de comprobarte durante el examen.

  - quiz:
      eyebrow: Comprobación rápida
      question: La tarea pide dar formato desde el cuadro de diálogo Formato de celdas. ¿Cuál respuesta gana el punto?
      options:
        - "[Font Color] y [Fill Color] desde la pestaña Inicio, dos clics"
        - "Ctrl+1, luego la pestaña Fuente y la pestaña Relleno, y Aceptar una vez"
        - "Copiar una celda que ya se ve bien y pegarla sobre el rango"
        - "Aplicar el estilo de celda Incorrecto, que es letra roja sobre relleno rosa"

  - takeaways:
      eyebrow: Resumen
      title: Tres cosas para llevarse
      items:
        - title: El examen califica la ruta
          desc: >-
            Dos clics en la cinta y un paso por el cuadro de diálogo dejan la misma hoja, y
            el reactivo solo acepta uno de los dos
        - title: Dos exámenes, 107 objetivos
          desc: >-
            Cincuenta y nueve del Associate y cuarenta y ocho del Expert, escritos contra los
            dominios de 2019 porque es la lista más larga y corre en cualquier versión del
            laboratorio
        - title: Word tiene sus propias sesiones
          desc: >-
            Las sesiones 1, 2 y 3 son procesador de texto y se evalúan en el parcial 1. Estas
            presentaciones empiezan en la sesión 4, donde abre Excel

  - homework:
      eyebrow: Tarea
      title: Entrega y criterios de calificación
      brief: >-
        La sesión 2 deja la evidencia de la semana 1 y es un documento de Word, no un libro.
        Toma un documento largo tuyo y dale formato con estilos, sangría e interlineado,
        secciones en vertical y en horizontal, y un encabezado y pie de página que lleven el
        número de página. También sirve como diagnóstico inicial del semestre.
      meta:
        - [Entrega, Antes de la semana 2]
        - [Formato, Blackboard · .pdf o .docx]
        - [Peso, Parte del 30 % dentro del parcial 1]
      rubric:
        - ["Estilos", "40 %", "Los títulos llevan estilos, no formato hecho a mano"]
        - ["Secciones", "30 %", "Al menos un salto de sección con cambio de orientación"]
        - ["Encabezados", "20 %", "Encabezado y pie con número de página automático"]
        - ["Entrega", "10 %", "Subido a Blackboard, en la fecha marcada, en .pdf o .docx"]

  - closing:
      title: Preguntas
      subtitle: >-
        La próxima sesión abre Excel, en la cinta de opciones, en el cuadro de diálogo
        Formato de celdas detrás de Ctrl+1, y en el relleno que no es arrastrar.
      meta:
        - [Correo, descobarc@up.edu.mx]
        - [Mensajería, Google Chat institucional]
        - [Repositorio, github.com/davidowa/learning-hub]
