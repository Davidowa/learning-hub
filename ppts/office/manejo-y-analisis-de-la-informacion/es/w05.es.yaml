meta:
  course: Manejo y Análisis de la Información
  code: TIA501
  lang: es
  language: excel
  week: 5
  footer: MANEJO Y ANÁLISIS DE LA INFORMACIÓN · TIA501 · EXCEL
  blocks: 3

slides:
  - cover:
      kicker: Facultad de Empresariales · 2026
      unit: Semana 05 · Sesiones 9 y 10 · Reglas, minigráficos y SI
      title: Manejo y Análisis de la Información
      subtitle: >-
        Formato que lee la celda en lugar de aplicarse sobre ella, una gráfica que cabe
        dentro de una celda, y la primera decisión que la hoja toma sola.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, TIA501 · Empresariales]
        - [Sesiones, 9 y 10 de 34]
      notes: |
        Sesiones 9 y 10 del programa. La sesión 9 es formato condicional, conjuntos de
        iconos, minigráficos e hipervínculos; la sesión 10 abre SI. COBERTURA.md suma
        cinco objetivos a esta semana y cuatro de ellos salen del mismo menú: 2.4.3,
        Expert 2.3.1, Expert 2.3.2, Expert 2.3.4 y Associate 2.1.1.
        Los ejercicios 3 y 7 practican casi todo. El único hueco que el paquete no
        cubre es Expert 2.3.2, las reglas escritas como fórmula, y por eso el bloque 1
        le dedica tiempo real.

  - agenda:
      eyebrow: Agenda
      title: Tres bloques de trabajo
      cards:
        - title: Reglas que repintan
          desc: El menú de predefinidos, luego los seis tipos de regla, luego una regla escrita como fórmula
        - title: El resto de la sesión 9
          desc: El administrador de reglas, el borrado, los minigráficos, los hipervínculos y Pegado especial
        - title: El primer SI
          desc: Una condición, dos respuestas, y la fila que queda justo en el límite
        - title: Te toca
          desc: El ejercicio 3 y el ejercicio 7, con una regla que el paquete no te da

  - objectives:
      eyebrow: Objetivos de la sesión
      title: Al terminar las dos sesiones el alumno podrá…
      items:
        - head: Aplicar un formato condicional predefinido
          sub: Seleccionando solo los datos, y apuntando el umbral a una celda en vez de teclearlo
        - head: Escribir su propia regla desde Nueva regla
          sub: Incluido el tipo de fórmula, que es lo que aquí separa Expert de Associate
        - head: Administrar las reglas que la hoja ya tiene
          sub: Prioridad, Detener si es verdad, el rango [Applies to] y el borrado por alcance
        - head: Insertar minigráficos que se puedan comparar
          sub: Una sola escala común para todas las filas, no una escala por fila
        - head: Pegar eligiendo una opción
          sub: Valores, transponer, [Skip blanks] y la aritmética a la que solo llega el cuadro de diálogo
        - head: Escribir un SI y defender su límite
          sub: Mayor que y mayor o igual que difieren en exactamente una fila

  - roadmap:
      eyebrow: Mapa del curso
      title: Dónde cae esta semana en el semestre
      phases:
        - label: A · Semanas 1–2
          title: Word, y luego la cinta
          desc: Documentos largos, y la primera pasada por la cuadrícula de Excel
          state: done
        - label: B · Semanas 3–4
          title: Hojas y funciones
          desc: Nombres, referencias, precedencia, estadística, texto y fechas
          state: done
        - label: C · Semanas 5–8
          title: Lógica condicional
          desc: Formato por regla, SI, comodines, anidamiento y la familia SI.CONJUNTO
          state: now
        - label: D · Semanas 9–13
          title: Datos, tablas y búsqueda
          desc: Importación, filtros, tablas, gráficos y las funciones de búsqueda
          state: todo
        - label: E · Semanas 14–17
          title: Resumen y entrega
          desc: Tablas dinámicas, filtros avanzados, análisis de hipótesis e impresión
          state: todo

  - divider:
      eyebrow: Bloque 01
      title: Formato que lee la celda
      lede: >-
        Pintar una celda a mano y pintarla con una regla se ven igual en el momento en que
        terminas. Una de las dos sobrevive al siguiente cambio en los datos.
      block: 1

  - concept:
      eyebrow: Concepto clave
      title: La regla se guarda en el rango, no en la celda
      lead: >-
        El formato directo es de la celda. El formato condicional es del rango, y Excel lo
        evalúa una vez por celda en cada recálculo. Por eso el rango que estaba
        seleccionado cuando escribiste la regla decide qué pinta, y la única vuelta atrás
        es el cuadro [Applies to].
      panel:
        label: La consecuencia
        title: Selecciona solo los datos, nunca el encabezado
        note: >-
          Un encabezado de texto cuenta como mayor que cualquier número, así que una regla
          de [Top 10] que lo incluya le da color al título y esconde una fila real. Esta es
          la forma más común de que una regla correcta pinte las celdas equivocadas.
      steps:
        - text: Seleccionas el rango y escribes la regla
        - text: Excel la guarda contra ese rango
        - text: Un valor cambia y la celda se repinta
          loop: ↺ y nadie tuvo que acordarse de qué significaba el color

  - steps:
      eyebrow: Bloque 01 · La ruta calificada
      title: Una regla de umbral predefinida, en cinco movimientos
      items:
        - label: '01'
          title: Selecciona los datos
          desc: La regla se guarda contra esta selección. Los encabezados y los totales se quedan fuera.
        - label: '02'
          title: Inicio, Estilos, Formato condicional
          desc: El menú trae los predefinidos arriba y Nueva regla, Borrar reglas y Administrar reglas abajo
        - label: '03'
          title: Resaltar reglas de celdas
          desc: "Es mayor que, Es menor que, Entre, Es igual a, Texto que contiene, Una fecha, Duplicar valores"
        - label: '04'
          title: Apunta al umbral
          desc: Haz clic en la flecha de contraer y elige la celda que tiene el número en vez de teclearlo
        - label: '05'
          title: Elige en la lista con
          desc: "Relleno rojo claro con texto rojo oscuro y cinco más, o Formato personalizado para cualquier otra cosa"

  - method:
      eyebrow: Cómo se califica este curso
      title: Dos rutas al mismo color
      statement: La certificación no califica la hoja que entregas. Califica la ruta que seguiste para que se viera así.
      points:
        - label: La ruta calificada
          text: >-
            Formato condicional, un predefinido o Nueva regla, el umbral apuntando a una
            celda, el formato elegido en la lista con. Sobrevive al siguiente cambio en
            los datos y aparece en el administrador de reglas.
        - label: La ruta rápida
          text: >-
            Lees los números, seleccionas las celdas que califican, aplicas un relleno
            desde la pestaña Inicio. Idéntico en pantalla, casi igual de rápido en una
            lista corta, y no vale nada el día del examen.
        - label: Qué mira quien califica
          text: >-
            Cambia un valor para que cruce el umbral, y luego regrésalo. Una regla se
            repinta sola. El formato hecho a mano no se mueve.

  - table:
      eyebrow: Bloque 01 · El menú, entrada por entrada
      title: Para qué sirve cada renglón del menú
      headers: [Entrada del menú, Qué produce, Objetivo de quién]
      rows:
        - ["Resaltar reglas de celdas", "Siete reglas de umbral predefinidas", "Associate 2.4.2"]
        - ["Reglas superiores e inferiores", "Seis reglas de posición predefinidas", "Associate 2.4.2"]
        - ["Las tres galerías", "Barras de datos, escalas e iconos", "Associate 2.4.2"]
        - ["Nueva regla...", "Seis tipos de regla, llenados por ti", "Expert 2.3.1 y 2.3.2"]
        - ["Borrar reglas", "Borrado, por el alcance que nombres", "Associate 2.4.3"]
        - ["Administrar reglas...", "Orden, rangos, Detener si es verdad", "Expert 2.3.4"]

  - steps:
      eyebrow: Bloque 01 · Nueva regla
      title: Una regla escrita como fórmula
      items:
        - label: '01'
          title: Selecciona desde la esquina superior izquierda
          desc: La fórmula se escribe una vez, para la celda activa, y Excel la recorre por el resto
        - label: '02'
          title: Nueva regla
          desc: "Sexta entrada de la lista de tipos, [Use a formula to determine which cells to format]"
        - label: '03'
          title: Presiona F2 primero
          desc: El cuadro de la fórmula abre en modo [Point], donde una flecha inserta una referencia en lugar de mover el cursor
        - label: '04'
          title: Devuelve VERDADERO o FALSO
          desc: Fija la columna con un signo de pesos cuando una sola columna decide toda la fila
        - label: '05'
          title: Formato, y un solo Aceptar
          desc: Pestaña Fuente, luego pestaña Relleno sin cerrar. Solo cuatro pestañas, porque una regla no puede alinear ni proteger.

  - figure:
      eyebrow: Bloque 01 · Objetivos Expert 2.3.1 y 2.3.2
      title: Seis tipos de regla, y el sexto es el de Expert
      image: img/en/new-formatting-rule.png
      caption: >-
        Seleccionar un tipo de regla arriba, Editar una descripción de regla abajo, y la mitad
        de abajo se redibuja por completo cada vez que cambia el tipo de arriba. La captura
        es de la interfaz en inglés.
      alt: >-
        El cuadro de diálogo Nueva regla de formato, con los seis tipos de regla en lista y
        el primero seleccionado, mostrando [Format Style], [Minimum] y [Maximum], Tipo,
        Valor, Color y Vista previa.
      side:
        label: Lee la lista, no los cuadros
        text: >-
          Los primeros cinco son el menú de predefinidos con sus números a la vista.
          [Use a formula to determine which cells to format], hasta abajo, es el único que
          no tiene predefinido en ningún lado, y es lo que separa Expert de Associate en
          este objetivo.

  - code:
      eyebrow: Bloque 01 · Patrones que vale la pena guardar
      title: Siete reglas, escritas para la fila 2
      filename: reglas.xlsx
      lang: excel
      source: |
        =$E2="Atrasado"
        =[MOD]([ROW](),2)=0
        =DIASEM(B$1,2)>5
        =Y($C2>$B2,$B2<>"")
        =Y($A2<>"",$D2="")
        =CONTAR.SI($A:$A,$A2)>1
        =Y($F2>=HOY(),$F2<=HOY()+30)
      annotations:
        - label: Línea 1
          text: Una sola columna decide toda la fila. El signo de pesos detiene la columna mientras la fila baja.
        - label: Línea 2
          text: Filas con bandas sin tabla. [MOD] y [ROW] hacen aritmética sobre la dirección, no sobre los datos.
        - label: Líneas 4 a 7
          text: La función Y llega en la semana 7 y CONTAR.SI en la 8. Regresa a esta lámina cuando ya las tengas.
        - label: Si falla
          text: >-
            VERDADERO en todas las filas quiere decir que falta un signo de pesos, o que
            la celda activa no era la correcta.
          accent: true

  - divider:
      eyebrow: Bloque 02
      title: Las reglas que ya tienes
      lede: >-
        Tres reglas sobre un rango y un solo color a la vista. Nada está descompuesto, y el
        cuadro de diálogo que lo explica abre en la opción equivocada por omisión.
      block: 2

  - steps:
      eyebrow: Bloque 02 · El administrador de reglas
      title: Cinco cosas que solo hace este cuadro de diálogo
      items:
        - label: '01'
          title: "[Show formatting rules for]"
          desc: Abre en [Current Selection], que esconde toda regla en la que no estés parado. Cámbialo a [This Worksheet].
        - label: '02'
          title: "[Move Up] y [Move Down]"
          desc: Dos reglas que fijan la misma propiedad, gana la de arriba. Dos reglas que fijan propiedades distintas, se aplican las dos.
        - label: '03'
          title: Detener si es verdad
          desc: Nada de lo que está abajo se evalúa para las celdas que coincidieron. Así una excepción de prioridad alta sobrevive a una regla amplia.
        - label: '04'
          title: "[Applies to]"
          desc: Vuelve a teclear el rango o arrástralo en la hoja detrás del cuadro de diálogo, y la regla sigue trabajando sobre menos celdas
        - label: '05'
          title: "[Apply], y luego Aceptar"
          desc: "[Apply] confirma sin cerrar, así que puedes ver cambiar la hoja y seguir editando"

  - figure:
      eyebrow: Bloque 02 · Objetivo Expert 2.3.4
      title: Abre en la opción que esconde tus reglas
      image: img/en/cf-rules-manager.png
      caption: >-
        [Show formatting rules for] dice [Current Selection], así que una hoja que carga
        tres reglas puede abrir exactamente igual que esta y verse vacía. La captura es de
        la interfaz en inglés.
      alt: >-
        El Administrador de reglas de formato condicionales, con [Show formatting rules
        for] puesto en [Current Selection], la lista de reglas vacía, y las columnas
        [Rule], Formato, [Applies to] y Detener si es verdad.
      side:
        label: Las cuatro columnas
        text: >-
          [Rule] en orden de prioridad, la vista previa de Formato, el rango [Applies to]
          que puedes volver a teclear, y la casilla Detener si es verdad. [Edit Rule],
          [Delete Rule] y las dos flechas se quedan en gris hasta que hay una regla
          seleccionada, y [Apply] confirma sin cerrar.

  - table:
      eyebrow: Bloque 02 · Borrado
      title: Cuatro maneras de quitar el formato
      headers: [Ruta, Dónde vive, Qué se lleva]
      rows:
        - ["Borrar reglas", "Menú Formato condicional", "Toda regla del alcance que nombres"]
        - ["[Delete Rule]", "Administrar reglas...", "Una regla, las demás siguen en orden"]
        - ["[Applies to]", "Administrar reglas...", "Salen celdas, la regla sobrevive"]
        - ["Borrar formatos", "Inicio, Edición, Borrar", "Todo formato, de regla o a mano"]

  - pitfalls:
      eyebrow: Bloque 02 · Errores comunes
      title: Cuatro maneras de perder una regla que ya tenías
      items:
        - label: Error 01
          title: El encabezado dentro del rango
          desc: >-
            El texto se ordena arriba de cualquier número, así que una regla de [Top 10]
            pinta el título y deja fuera una fila real. Selecciona solo datos, siempre.
        - label: Error 02
          title: Creerle a [Current Selection]
          desc: >-
            El administrador de reglas abre ahí y no muestra nada. Las reglas siguen
            estando. Pon la lista en [This Worksheet] antes de decidir que algo se perdió.
        - label: Error 03
          title: "Borrar formatos en vez de Borrar reglas"
          desc: >-
            Sí quita la regla. También quita toda fuente, relleno, borde y formato de
            número de la selección, y suele romper un paso posterior de la misma tarea.
        - label: Error 04
          title: Pintar las celdas a mano
          desc: >-
            Lo más rápido del salón y no vale nada. Ctrl+1 sobre una celda con formato de
            regla no muestra relleno, y así distingue las dos quien califica.

  - concept:
      eyebrow: Concepto clave
      title: Un minigráfico es fondo de celda
      lead: >-
        Un gráfico es un objeto que flota sobre la cuadrícula. Un minigráfico se dibuja
        dentro de la celda, detrás del texto que la celda tenga, así que se mueve, se
        ordena, se filtra y se imprime junto con la fila que describe. Esa es toda la razón
        de que el objetivo exista aparte del dominio de gráficos.
      panel:
        label: La comprobación que lo resuelve
        title: La barra de fórmulas queda vacía
        note: >-
          Haz clic en la celda. Nada en la barra de fórmulas, y una pestaña contextual
          [Sparkline] en la cinta de opciones. Un gráfico de líneas encogido mostraría
          controladores de selección y te daría Diseño de gráfico en su lugar.
      steps:
        - text: Selecciona las celdas que los van a alojar
        - text: Insertar, Minigráficos, Línea o Columna
        - text: "Rango de datos a la izquierda, Ubicación a la derecha"
          loop: ↺ el mismo número de filas de los dos lados, o el cuadro de diálogo se niega

  - steps:
      eyebrow: Bloque 02 · Minigráficos
      title: La escala es la parte que se califica
      items:
        - label: '01'
          title: Selecciona primero el destino
          desc: Una celda por fila de datos, casi siempre la columna vacía a la derecha de los números
        - label: '02'
          title: Insertar, Minigráficos
          desc: "Línea, Columna o Pérdidas y ganancias. Se abre el cuadro Crear Minigráficos con dos campos."
        - label: '03'
          title: "Rango de datos, solo números"
          desc: Los encabezados y los totales rompen la escala. El Ubicación ya viene lleno desde el paso 1.
        - label: '04'
          title: Grupo Mostrar
          desc: "Punto alto, Punto bajo, Puntos negativos, Primer punto, Último punto, y Marcadores solo para Línea"
        - label: '05'
          title: "[Axis], [Same for All Sparklines]"
          desc: Sin eso cada fila se escala contra sí misma y las filas no se pueden comparar, que es lo que la tarea está pidiendo de verdad

  - table:
      eyebrow: Bloque 02 · Objetivo 1.2.3
      title: Ctrl+K lo abre, cuatro botones le cambian la cara
      headers: ["A dónde va", "El botón en la barra Vincular a", "Qué llenas"]
      rows:
        - ["Un archivo o URL", "Archivo o página web existente", "Dirección, y Carpeta actual"]
        - ["Otra hoja de aquí", "Lugar de este documento", "Referencia de la celda o Nombres definidos"]
        - ["Un archivo por crear", "Crear nuevo documento", "Nombre y ruta del archivo nuevo"]
        - ["Un correo nuevo", "Dirección de correo electrónico", "Dirección de correo electrónico y Asunto"]
        - ["La prueba al pasar", "[ScreenTip...]", "El texto que se muestra al pasar"]
        - ["El vínculo quitado", "Clic derecho, [Remove Hyperlink]", "Borrar hipervínculos deja el azul"]

  - steps:
      eyebrow: Bloque 02 · Pegado especial
      title: Elegir una opción, no pegar
      items:
        - label: '01'
          title: Copiar, nunca Cortar
          desc: Ctrl+X apaga casi todas las opciones de Pegado especial, así que una tarea que pide pegar valores empieza con Copiar
        - label: '02'
          title: La flecha debajo de Pegar
          desc: No la cara del botón. Hasta abajo de la galería, Pegado especial. O Ctrl+Alt+V.
        - label: '03'
          title: La sección Pegar
          desc: "[All], Fórmulas, [Values], [Formats], [Validation], [Column widths], [Values and number formats], y cinco más"
        - label: '04'
          title: "[Operation], [Skip blanks], Transponer"
          desc: "[Add], [Subtract], [Multiply] y [Divide] contra lo que ya está ahí. Nada fuera de este cuadro de diálogo llega hasta ellas."
        - label: '05'
          title: "Aceptar, o [Paste Link]"
          desc: "[Paste Link] deja una referencia viva en lugar de una constante. Luego Esc, para quitar el marco parpadeante."

  - divider:
      eyebrow: Bloque 03
      title: La primera decisión que toma la hoja
      lede: >-
        Todo lo anterior ha descrito los datos. SI es la primera fórmula que elige entre
        dos respuestas, y la elección ocurre una vez por fila sin ti.
      block: 3

  - concept:
      eyebrow: Concepto clave
      title: Una prueba lógica responde VERDADERO o FALSO
      lead: >-
        SI toma tres argumentos y solo el primero es una pregunta. [Logical_test] es una
        comparación, y toda comparación se resuelve en VERDADERO o FALSO antes que nada.
        [Value_if_true] y [Value_if_false] son las dos respuestas que ya escribiste, y Excel
        pone una en la celda.
      panel:
        label: Dónde están los puntos
        title: La fila del límite es todo el reactivo
        note: >-
          Mayor que y mayor o igual que dan el mismo resultado en todas las filas menos en
          una. Ahí es donde el examen revisa, y es la fila que pruebas antes de rellenar.
      steps:
        - text: Excel lee la comparación de esta fila
        - text: Se resuelve en VERDADERO o FALSO, nada más
        - text: La respuesta que corresponde cae en la celda
          loop: ↺ y la fila de abajo recibe su propia lectura

  - steps:
      eyebrow: Bloque 03 · La ruta calificada
      title: SI desde [Function Arguments]
      items:
        - label: '01'
          title: Fórmulas, Lógicas, SI
          desc: Se abre el cuadro [Function Arguments] con los tres campos nombrados y descritos
        - label: '02'
          title: Arma la comparación
          desc: Haz clic en [Logical_test], haz clic en la celda B2 de la hoja, teclea el resto de la prueba
        - label: '03'
          title: Teclea las respuestas en limpio
          desc: Sin comillas. El cuadro de diálogo las agrega y muestra el valor terminado a la derecha del campo.
        - label: '04'
          title: Lee [Formula result]
          desc: Abajo a la izquierda del cuadro de diálogo, antes de confirmar. Es la única vista previa que hay.
        - label: '05'
          title: F4, y luego rellena hacia abajo
          desc: Fija cualquier referencia que no deba moverse, y luego revisa una fila de cada lado del límite

  - code:
      eyebrow: Bloque 03 · Cinco formas de la misma función
      title: Qué está haciendo cada argumento
      filename: si.xlsx
      lang: excel
      source: |
        =SI(B2>=70,"Aprobado","Reprobado")
        =SI(B2>=$F$1,"Aprobado","Reprobado")
        =SI(B2>=70,"Aprobado")
        =SI(C2="","",C2*0.16)
        =SI(B2>=70,B2*1.1,B2)
      annotations:
        - label: Línea 2
          text: El umbral apunta a una celda, así que cambiar F1 mueve todas las filas. F4 la fija antes de rellenar.
        - label: Línea 3
          text: Dejar fuera el tercer argumento devuelve FALSO en pantalla. Ningún reporte quiere esa palabra adentro.
        - label: Línea 4
          text: Dos comillas sin nada en medio se ven vacías y no están vacías.
        - label: Si falla
          text: >-
            Teclea Aprobado sin comillas. El cuadro de diálogo las agrega, y si pones las
            tuyas quedan dobles.
          accent: true

  - trace:
      eyebrow: Bloque 03 · El límite, medido
      title: Tres filas, y solo una se mueve
      headers: ["Puntaje en B", ">= 70", "> 70", "Mismo resultado"]
      rows:
        - ["71", "Aprobado", "Aprobado", "sí"]
        - ["70", "Aprobado", "Reprobado", "no"]
        - ["69", "Reprobado", "Reprobado", "sí"]
      verdict: Una sola fila de toda la columna separa las dos fórmulas, y esa es la fila en la que se va a revisar la tarea.

  - lab:
      eyebrow: Laboratorio
      title: Ejercicio 3 y ejercicio 7, más una regla
      brief: >-
        Trabajen el ejercicio 3 de principio a fin, y luego agreguen la regla que el
        paquete no les da. Sobre la misma tabla, escriban una regla de fórmula que pinte la
        fila completa cuando una columna diga que el registro va atrasado, y demuestren en
        el administrador de reglas que es una sola regla sobre todo el rango y no una regla
        por columna.
      blocks:
        - label: Entregable
          text: El libro del ejercicio 3 con la regla extra, y el ejercicio 7 con su columna de SI
        - label: Restricción
          text: >-
            Todo umbral apunta a una celda. Ningún número tecleado dentro de una regla,
            para que la hoja se pueda volver a correr contra un límite nuevo sin abrir un
            cuadro de diálogo.
        - label: La comprobación
          text: >-
            Cambien un valor para que cruce el límite y regrésenlo. Lo que no se repinte
            fue pintado a mano y no cuenta.

  - takeaways:
      eyebrow: Resumen
      title: Tres cosas para llevarse
      items:
        - title: La regla es del rango
          desc: >-
            Qué celdas estaban seleccionadas cuando la escribiste decide qué celdas pinta,
            y la única vuelta atrás es el cuadro [Applies to]
        - title: El minigráfico vive en la celda
          desc: >-
            Barra de fórmulas vacía, pestaña [Sparkline] en la cinta de opciones, y una
            sola escala común, o las filas de la hoja no se pueden comparar entre sí
        - title: SI se califica en una fila
          desc: >-
            Mayor que y mayor o igual que coinciden en todo menos en el límite, así que esa
            es la fila que pruebas antes de rellenar hacia abajo

  - homework:
      eyebrow: Tarea
      title: Entrega y criterios de calificación
      brief: >-
        Tomen su propio conjunto de datos de la semana 4 y pónganle tres reglas que
        signifiquen algo, una de ellas escrita como fórmula. Agreguen una columna de
        minigráficos en una escala común, y un SI que clasifique cada fila. Escriban un
        renglón debajo de la hoja diciendo qué debería concluir un lector a partir de los
        colores.
      meta:
        - [Entrega, Antes de la semana 6]
        - [Formato, Blackboard · un archivo .xlsx]
        - [Peso, Parte del 30 % del primer parcial]
      rubric:
        - ["Reglas", "40 %", "Tres reglas, una de ellas de fórmula, todas visibles en el administrador"]
        - ["Minigráficos", "20 %", "Una escala común, para que las filas se puedan leer una contra otra"]
        - ["SI", "25 %", "La fila del límite es correcta y el umbral apunta a una celda"]
        - ["El renglón", "15 %", "Un renglón que diga qué le están contando los colores al lector"]

  - closing:
