meta:
  course: Manejo y Análisis de la Información
  code: TIA501
  lang: es
  language: excel
  week: 2
  footer: MANEJO Y ANÁLISIS DE LA INFORMACIÓN · TIA501 · EXCEL
  blocks: 3

slides:
  - cover:
      kicker: Facultad de Empresariales · 2026
      unit: Semana 02 · Sesión 4 · Primer contacto con Excel
      title: Manejo y Análisis de la Información
      subtitle: >-
        La sesión 3 sigue siendo Word. La sesión 4 abre Excel sobre el único cuadro de
        diálogo por el que pasan cuatro objetivos, y esta presentación cubre esa mitad
        de la semana.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, TIA501 · Empresariales]
        - [Sesión, 4 de 34]
      notes: >-
        Fuentes. El texto de la sesión 4 sale del temario de diciembre. La asignación de
        objetivos y las cinco adiciones vienen de COBERTURA.md, semana 2. Todas las rutas
        de estas diapositivas están en procedures.en.md, objetivos 1.4.1, 2.1.2, 2.1.4 y
        2.2.1 a 2.2.8. Calcula quince minutos para el bloque de Formato de celdas y deja
        fuera primero la Barra de herramientas de acceso rápido si la sesión se acorta.

  - agenda:
      eyebrow: Agenda
      title: Tres bloques de trabajo
      cards:
        - title: La ventana, una vez
          desc: La única sesión del semestre donde la interfaz es el tema, y la barra que armas tú mismo
        - title: Formato de celdas
          desc: Ctrl+1, seis pestañas, una operación y los cuatro objetivos que viven detrás
        - title: Celdas y relleno
          desc: Insertar y eliminar celdas con el desplazamiento que elegiste, y llenar una serie desde el cuadro
        - title: Tu turno
          desc: El ejercicio 1, el libro de formato, con el formato que pide el examen

  - objectives:
      eyebrow: Objetivos de la sesión
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Dar formato a un rango en un solo paso por Ctrl+1
          sub: Fuente, relleno, borde y formato de número aplicados como una sola operación
        - head: Fijar alineación, Orientación e Sangría
          sub: Las tres subhabilidades que Certiport junta en el objetivo 2.2.2, todas en la misma pestaña
        - head: Ajustar texto sin presionar Alt+Enter
          sub: Y decir qué hace Reducir hasta ajustar en su lugar, ya que los dos se anulan entre sí
        - head: Copiar un formato sobre varios rangos
          sub: Copiar formato, fijado con un doble clic y soltado con Esc
        - head: Aplicar, modificar y quitar un estilo de celda
          sub: Y distinguir Borrar formatos de Borrar contenido antes de hacer clic en cualquiera
        - head: Llenar una serie desde el cuadro Serie
          sub: Con un paso y un valor final, que es lo que el controlador de relleno no te puede dar

  - roadmap:
      eyebrow: Mapa del curso
      title: Dónde cae esta semana en el semestre
      phases:
        - label: A · Semanas 1–2
          title: Word, y luego la cinta
          desc: Documentos largos, y la primera pasada por la cuadrícula de Excel
          state: now
        - label: B · Semanas 3–4
          title: Hojas y funciones
          desc: Nombres, referencias, precedencia, estadística, texto y fechas
          state: todo
        - label: C · Semanas 5–8
          title: Lógica condicional
          desc: Formato por regla, SI, comodines, anidamiento y la familia SI.CONJUNTO
          state: todo
        - label: D · Semanas 9–13
          title: Datos, tablas y búsqueda
          desc: Importar, filtros, tablas, gráficos y las funciones de búsqueda
          state: todo
        - label: E · Semanas 14–17
          title: Resumen y entrega
          desc: Tablas dinámicas, filtros avanzados, análisis de hipótesis e impresión
          state: todo

  - divider:
      eyebrow: Bloque 01
      title: La interfaz, una vez
      lede: >-
        Después de hoy el curso mira los datos y la cinta de opciones es nada más el lugar
        donde viven los comandos. Así que la barra se lleva sus cinco minutos ahora.
      block: 1

  - concept:
      eyebrow: Bloque 01 · Dónde cae esta semana
      title: La mitad de la semana 2 sigue siendo Word
      lead: >-
        La sesión 3 cierra el documento largo con tabla de contenido, tablas insertadas,
        vínculos, bibliografía y plantillas. La sesión 4 es el primer contacto con Excel y
        es la que cubre esta presentación. Las dos entran en el primer parcial. Solo una
        aparece en la certificación.
      panel:
        label: Lo que tiene que caber en la sesión 4
        title: Once objetivos en noventa minutos
        note: >-
          Seis los programa el temario y cinco los agrega COBERTURA encima. Si algo tiene
          que salir es la Barra de herramientas de acceso rápido, y la semana 17 la retoma
          junto con la configuración de página.
      steps:
        - text: Sesión 3, Word, referencias y plantillas
        - text: Sesión 4, Excel, formato y relleno
        - text: Las dos entran en el primer parcial, semana 6
          loop: ↺ y la mitad de Excel es donde arrancan los objetivos

  - steps:
      eyebrow: Bloque 01 · Objetivo 1.4.1
      title: La barra que armas tú mismo
      items:
        - label: '01'
          title: Archivo, y luego Opciones
          desc: En el cuadro Opciones de Excel, selecciona el panel Barra de herramientas de acceso rápido de la izquierda.
        - label: '02'
          title: Elige el alcance
          desc: La lista Personalizar la barra de herramientas de acceso rápido ofrece [For all documents (default)] o el archivo abierto por su nombre.
        - label: '03'
          title: Elige la fuente de comandos
          desc: La lista [Choose commands from] tiene [Popular Commands], [Commands Not in the Ribbon], [All Commands] y Macros.
        - label: '04'
          title: Agrega y ordena
          desc: Selecciona el comando, haz clic en [Add] y colócalo con [Move Up] y [Move Down]. [Modify] cambia su icono y su nombre.
        - label: '05'
          title: Después responde a un número
          desc: Un botón de la barra se ejecuta con Alt más su posición, así que ordenarlos no es adorno.

  - method:
      eyebrow: Bloque 01 · Las dos rutas cortas
      title: Dónde se detienen las rutas rápidas de la barra
      statement: Haz clic derecho en cualquier botón de la cinta, [Add to Quick Access Toolbar]. Es el mejor movimiento que vas a hacer fuera del examen.
      points:
        - label: Hasta dónde llega
          text: Cualquier cosa que ya esté visible en una pestaña de la cinta, en un clic, sin cuadro de diálogo y sin esperar
        - label: A dónde no llega
          text: A la lista [Commands Not in the Ribbon], que es justo donde un reactivo del examen esconde su petición incómoda
        - label: Lo que no puede hacer
          text: Limitar un botón a un solo libro, o reordenar lo que ya está. Las dos cosas piden Archivo, Opciones.

  - divider:
      eyebrow: Bloque 02
      title: Formato de celdas
      lede: >-
        Un cuadro de diálogo, seis pestañas, una operación. Por ahí pasan cuatro objetivos,
        y es el caso más claro de todo el curso en el que la ruta vale más que el resultado.
      block: 2

  - stat:
      eyebrow: El atajo del semestre
      value: Ctrl+1
      text: >-
        abre Formato de celdas en la última pestaña que usaste, desde cualquier parte del libro.
      note: >-
        Ctrl+Shift+F lo abre en la pestaña Fuente. Dentro del cuadro, Ctrl+Tab pasa a la
        pestaña siguiente y Ctrl+Shift+Tab a la anterior, así que la ruta entera corre sin
        ratón. Enter es Aceptar. Esc es Cancelar, y tira todas las pestañas que tocaste.

  - concept:
      eyebrow: Concepto clave
      title: Una sola operación repartida en seis pestañas
      lead: >-
        El cuadro de diálogo no es una cinta lenta. Es una operación que carga a la vez un
        color de letra, un relleno, un borde y un formato de número, donde la cinta cobra
        una operación por botón. Por eso Certiport lista el 2.2.6 aparte del 2.2.5.
      panel:
        label: Cómo te revisas solo
        title: Presiona Ctrl+Z una sola vez
        note: >-
          Si el color de letra y el relleno desaparecen juntos, lo hizo el cuadro de diálogo
          y la ruta fue la que califica. Si se va uno nada más, lo hizo la cinta. Vuelve a
          aplicarlo e inténtalo otra vez.
      steps:
        - text: Selecciona el rango
        - text: Ctrl+1, y pon todo lo que pidió la tarea
        - text: Un solo Aceptar al final
          loop: ↺ una operación, un deshacer, un punto

  - steps:
      eyebrow: Bloque 02 · Objetivo 2.2.6
      title: La ruta que califica, en cinco pasos
      items:
        - label: '01'
          title: Selecciona, y luego Ctrl+1
          desc: Con el ratón, el [dialog box launcher] de los grupos Fuente, Alineación o Número. Los tres abren el mismo cuadro.
        - label: '02'
          title: Pestaña Fuente
          desc: Fuente, Estilo, Tamaño, la lista Subrayado, la lista Color y las casillas Tachado, Superíndice y Subíndice.
        - label: '03'
          title: Pestaña Relleno, sin dar Aceptar
          desc: Un color bajo [Background Color]. Sin color quita el relleno. [Fill Effects] arma un degradado y [Pattern Style] agrega una trama.
        - label: '04'
          title: Pestaña Borde, en orden
          desc: Primero Estilo de línea y Color, después un botón de [Presets] o los bordes en el cuadro de vista previa. Ese orden es el objetivo entero.
        - label: '05'
          title: Un solo Aceptar
          desc: Todo lo que tocaste entra como una sola operación, y un solo Ctrl+Z se lo lleva completo.

  - figure:
      eyebrow: Bloque 02 · Objetivo 2.2.6
      title: Seis pestañas, y un solo Aceptar hasta abajo
      image: img/en/format-cells-font.png
      caption: >-
        La pestaña Fuente tal como abre en las máquinas del laboratorio. Aquí viven Estilo,
        Tamaño, la lista Subrayado y la lista Color. La captura es de la interfaz en inglés.
      alt: >-
        El cuadro Formato de celdas abierto en la pestaña Fuente, con las seis pestañas
        arriba, las listas Fuente, Estilo y Tamaño, Subrayado, Color, las casillas
        de Efectos y el cuadro de vista previa.
      side:
        label: Qué hay que mirar
        text: >-
          La fila de pestañas de arriba es el objetivo. Número, Alineación, Fuente, Borde,
          Relleno y Protección son seis páginas de una sola operación, y el Aceptar de abajo a
          la derecha confirma cada página que tocaste. Cancelar las tira todas.

  - table:
      eyebrow: Bloque 02 · Las seis pestañas
      title: Lo que solo existe dentro del cuadro
      headers: [Pestaña, Qué se fija ahí, En ningún otro lado]
      rows:
        - ["Número", "Categoría, decimales, separador", "[Special] y Personalizada"]
        - ["Alineación", "Horizontal, Vertical, Sangría", "Reducir hasta ajustar, cualquier ángulo"]
        - ["Fuente", "Fuente, estilo, tamaño, color", "Subrayados de Contabilidad"]
        - ["Borde", "Estilo y color, luego los bordes", "Bordes diagonales"]
        - ["Relleno", "Color de fondo", "Tramas y degradados"]
        - ["Protección", "Bloqueada y Oculta", "La pestaña entera"]

  - figure:
      eyebrow: Bloque 02 · Lo que la cinta no alcanza
      title: La pestaña Relleno, más allá de los colores
      image: img/en/format-cells-fill.png
      caption: >-
        Sin color quita el relleno, y el cuadro [Sample] de abajo enseña el resultado antes
        de que lo confirmes. La captura es de la interfaz en inglés.
      alt: >-
        El cuadro Formato de celdas en la pestaña Relleno, con la paleta de [Background
        Color], el botón Sin color, [Fill Effects], Más colores y las listas [Pattern
        Color] y [Pattern Style].
      side:
        label: Tres controles sin botón
        text: >-
          [Fill Effects] arma un degradado de dos colores. [Pattern Color] y [Pattern Style]
          ponen una trama sobre el fondo. Más colores abre el selector de [Standard] y
          Personalizada. Ninguno de los tres tiene equivalente en la cinta, así que una tarea que
          nombre alguno no tiene ruta corta.

  - compare:
      eyebrow: Bloque 02 · El mismo rango, dos veces
      title: Tres operaciones contra una
      before:
        label: La ruta corta, no califica
        file: cinta.txt
        lang: text
        code: |
          Inicio > Fuente > [Font Color]  > Rojo
          Inicio > Fuente > [Fill Color]  > Amarillo claro
          Inicio > Fuente > Bordes        > Todos los bordes
          Inicio > Número > Formato de número > Moneda
      after:
        label: La ruta que califica
        file: formato-de-celdas.txt
        lang: text
        code: |
          Ctrl+1
            Pestaña Fuente  > Color > Rojo
            Pestaña Relleno > [Background Color] > amarillo
            Pestaña Borde   > estilo, color, luego Esquema
            Pestaña Número  > Moneda, 2 decimales
          Aceptar
      note: >-
        Cuatro operaciones a la izquierda, una a la derecha, y la misma hoja al final. La
        columna de la izquierda tampoco alcanza un borde diagonal, un relleno con trama,
        Reducir hasta ajustar ni la categoría [Special], porque esos no tienen botón.

  - pitfalls:
      eyebrow: Bloque 02 · Errores comunes
      title: Cuatro maneras de perder el reactivo
      items:
        - label: Error 01
          title: Dibujar el borde primero
          desc: >-
            En la pestaña Borde, Estilo de línea y Color van antes que los bordes. Un borde
            dibujado primero se queda con el estilo anterior, y hacer clic en el estilo
            después no le hace nada a lo que ya está dibujado.
        - label: Error 02
          title: Dar Aceptar entre pestañas
          desc: >-
            Tres Aceptar son tres operaciones. Esa es la ruta de la cinta con pasos de más, y
            la prueba del deshacer único lo va a enseñar. Un solo Aceptar al final es lo que
            la vuelve una.
        - label: Error 03
          title: Salirse con Esc
          desc: >-
            Esc es Cancelar y tira todas las pestañas que tocaste, no solo la que tienes
            enfrente. Enter es Aceptar, y confirma todas.
        - label: Error 04
          title: Buscar estos en la cinta de opciones
          desc: >-
            El subrayado [Single Accounting], Reducir hasta ajustar, los bordes diagonales, los
            rellenos con trama y con degradado, [Special], Personalizada y la pestaña
            Protección no tienen ningún botón.

  - method:
      eyebrow: Bloque 02 · Objetivos 2.2.5 y 2.2.6
      title: Dos objetivos sobre la misma imagen
      statement: Los formatos de número son el objetivo de la cinta a propósito. No contestes el 2.2.5 desde Formato de celdas a menos que la tarea lo diga.
      points:
        - label: El de la cinta
          text: Pestaña Inicio, grupo Número. La lista Formato de número, y luego [Accounting Number Format], [Percent Style], [Comma Style], Aumentar decimales y [Decrease Decimal].
        - label: Moneda no es Contabilidad
          text: Moneda pega el símbolo a los dígitos. Contabilidad alinea los símbolos y los puntos decimales, enseña el cero como un guion y pone los negativos entre paréntesis.
        - label: La costumbre que corrompe los datos
          text: Escribir 50% en una celda que ya tiene 50 convierte el valor en 0.5. La imagen queda bien y todas las fórmulas de abajo quedan mal.

  - table:
      eyebrow: Bloque 02 · Objetivo 2.2.2
      title: La pestaña Alineación, control por control
      headers: [Control, Qué fija, El detalle]
      rows:
        - ["Horizontal", "[Left, Center, Right, Fill, Justify]", "Aquí está [Center Across Selection]"]
        - ["Vertical", "[Top, Center, Bottom, Justify]", "En [Top] el texto ajustado sube"]
        - ["Sangría", "Pasos de un carácter de ancho", "Muerto si Horizontal no lo permite"]
        - ["Orientación", "Gira el dial o teclea de -90 a 90", "La cinta ofrece cinco ángulos"]
        - ["Control del texto", "Ajustar texto, Reducir hasta ajustar, Combinar celdas", "Ajustar texto y Reducir hasta ajustar se anulan"]

  - table:
      eyebrow: Bloque 02 · Objetivos 2.2.1 y 2.2.4
      title: Cuatro cosas que parecen la misma cosa
      headers: [Qué haces, Qué guarda Excel, Cuándo lo pide la tarea]
      rows:
        - ["Ajustar texto", "Una cadena, fila más alta", "Etiquetas largas en columna angosta"]
        - ["Alt+Enter", "Un salto de línea en el texto", "Nunca, si el reactivo dice ajustar"]
        - ["Combinar y centrar", "Una celda, lo demás se tira", "Un letrero sobre un bloque"]
        - ["[Center Across Selection]", "Nada queda combinado", "Centrar un título y poder ordenar"]

  - table:
      eyebrow: Bloque 02 · Objetivo 2.2.1
      title: El menú de combinar, entrada por entrada
      headers: [Entrada del menú, Qué hace, La señal]
      rows:
        - ["Combinar y centrar", "Una celda, contenido centrado", "El Cuadro de nombres dice A1, no A1:D1"]
        - ["[Merge Across]", "Una celda combinada por fila", "Cinco filas dan cinco celdas"]
        - ["Combinar celdas", "Una celda, alineación intacta", "Nada se recentra"]
        - ["[Unmerge Cells]", "La vuelve a separar", "Solo la de arriba a la izquierda guardó valor"]

  - steps:
      eyebrow: Bloque 02 · Objetivo 2.2.3
      title: La brocha, y el doble clic
      items:
        - label: '01'
          title: Selecciona el origen
          desc: Con una celda basta cuando el formato es parejo. Los valores, las fórmulas y los comentarios no viajan.
        - label: '02'
          title: Inicio, Portapapeles, Copiar formato
          desc: Un clic la arma para un solo uso. Arrastra sobre el destino, o haz clic en su celda de arriba a la izquierda.
        - label: '03'
          title: Doble clic para dejarla fija
          desc: La brocha se queda armada entre destinos. Esta es la parte que busca el reactivo cuando nombra más de un área.
        - label: '04'
          title: Esc para soltarla
          desc: O vuelve a hacer clic en Copiar formato. Mira el puntero, la brocha es la prueba de que quedó fija.

  - steps:
      eyebrow: Bloque 02 · Objetivos 2.2.7 y 2.2.8
      title: Los estilos, y las dos formas de borrar
      items:
        - label: '01'
          title: Aplicar
          desc: Inicio, Estilos, Estilos de celda. La tarea nombra el estilo, Encabez, Total, Entrada, [Currency [0]].
        - label: '02'
          title: Modificar
          desc: Clic derecho en el estilo de la galería, [Modify], y luego Formato, que abre Formato de celdas. Cada celda que lo usa se actualiza.
        - label: '03'
          title: Crear uno
          desc: 'Nuevo estilo de celda hasta abajo de la galería. Ponle nombre y quita las casillas de [Style Includes] que no debe cargar.'
        - label: '04'
          title: Comprueba que sea un estilo
          desc: Diseño de página, Temas, Colores. Las celdas con un estilo del tema se mueven. Las pintadas a mano no.

  - table:
      eyebrow: Bloque 02 · Objetivo 2.2.8
      title: El menú de borrar, y la tecla Supr
      headers: [En qué haces clic, Qué se va, Qué sobrevive]
      rows:
        - ["Borrar formatos", "Fuente, relleno, bordes, formatos", "Los valores y las fórmulas"]
        - ["Borrar contenido", "Valores y fórmulas", "Todo el formato"]
        - ["Borrar todo", "Todo, incluidas las reglas", "Una celda vacía de fábrica"]
        - ["Borrar comentarios y notas", "Comentarios y notas", "Valores y formato"]
        - ["La tecla Supr", "Solo el contenido", "El formato, y el 2.2.8 se cae"]

  - divider:
      eyebrow: Bloque 03
      title: Las celdas, y el relleno que no es arrastrar
      lede: >-
        Dos objetivos donde la ruta rápida da la imagen correcta con datos fáciles y la
        equivocada en cuanto la tarea se pone específica.
      block: 3

  - table:
      eyebrow: Bloque 03 · Objetivo 2.1.4
      title: Insertar, y qué se mueve cuando lo haces
      headers: [Qué seleccionaste, En qué haces clic, Qué se mueve]
      rows:
        - ["Un bloque de celdas", "Flecha de Insertar, Insertar celdas", "Solo lo que diga el cuadro"]
        - ["El cuadro de diálogo", "[Shift right, down, row, column]", "Una dirección, la que elegiste"]
        - ["La cara del botón", "Insertar, sin cuadro de diálogo", "Baja todo y nunca pregunta"]
        - ["Filas o columnas enteras", "Insertar filas de hoja o de columnas", "Ese es el 2.1.3, y es la semana 3"]

  - steps:
      eyebrow: Bloque 03 · Objetivo 2.1.2
      title: Llenar una serie sin tocar el controlador
      items:
        - label: '01'
          title: Escribe la semilla
          desc: Con un valor basta para un paso de 1. Para cualquier otro paso, escribe el segundo valor y selecciona los dos.
        - label: '02'
          title: Selecciona también el destino
          desc: La selección define hasta dónde llega la serie, así que tiene que incluir las celdas que quieres llenar.
        - label: '03'
          title: Inicio, Edición, Rellenar
          desc: '[Down], [Right], [Up] y [Left] copian. Serie abre el cuadro donde vive el patrón.'
        - label: '04'
          title: Fija la serie
          desc: '[Series in Rows] o [Series in Columns]. Tipo [Linear], [Growth], [Date] o [AutoFill]. [Step value], y un [Stop value] si la tarea da un final.'
        - label: '05'
          title: Un solo Aceptar
          desc: Ctrl+D llena hacia abajo y Ctrl+R hacia la derecha. Ninguno abre el cuadro, así que ninguno alcanza [Growth] ni un [Stop value].

  - concept:
      eyebrow: Bloque 03 · Cómo lo nota quien califica
      title: El botón que aparece, y el que no
      lead: >-
        Arrastra el controlador de relleno y aparece un botón pequeño de [Auto Fill Options]
        abajo a la derecha del bloque llenado. Llena desde la cinta y no aparece nada. Ese
        botón es el registro visible más rápido de qué ruta se tomó, y no cuesta nada
        buscarlo en tu propio trabajo antes de entregarlo.
      panel:
        label: Lo que el arrastre no puede hacer
        title: Sin valor final, sin crecimiento ni tendencia
        note: >-
          El controlador deduce un paso lineal y ahí se queda. Una serie que se duplica, una
          que se salta los fines de semana, o una que tiene que terminar en 500 y no al
          final de la selección, todas piden el cuadro Serie.
      steps:
        - text: Arrastra el controlador, aparece el botón
        - text: Llena desde la cinta, no aparece nada
        - text: Revisa tu propia hoja antes de entregar
          loop: ↺ la misma señal sirve en el examen y en el ejercicio

  - quiz:
      eyebrow: Comprobación rápida
      question: Centra un título en A1:F1 sin combinar. ¿Cuál de estas lo hace?
      options:
        - "Combinar y centrar en la pestaña Inicio, y luego ensanchar las columnas"
        - "[Merge Across] desde la flecha junto a Combinar y centrar"
        - "Ctrl+1, pestaña Alineación, Horizontal puesto en [Center Across Selection]"
        - "[Increase Indent] hasta que el título se vea centrado"

  - lab:
      eyebrow: Laboratorio
      title: El ejercicio 1, con el formato que pide el examen
      brief: >-
        Abran el libro del ejercicio 1 y denle formato con las reglas de la ruta que
        califica. El bloque de encabezado lleva su fuente, su relleno, su borde y su formato
        de número en un solo paso por Ctrl+1. La fila 8 le presta su formato a las filas 9 a
        12 con la brocha fija. La columna de fechas se llena desde el cuadro Serie, no desde
        el controlador.
      blocks:
        - label: Entregable
          text: El .xlsx terminado en Blackboard, con el bloque de encabezado, las filas 9 a 12 y la columna llena
        - label: Restricción
          text: Nada de formato aplicado desde la pestaña Inicio salvo el formato de número, que es el objetivo 2.2.5 y ahí le toca
        - label: La prueba
          text: Seleccionen el bloque de encabezado y presionen Ctrl+Z una vez. Si desaparece más de una cosa, la ruta estuvo bien

  - takeaways:
      eyebrow: Resumen
      title: Tres cosas para llevarse
      items:
        - title: Un cuadro, una operación
          desc: >-
            Ctrl+1 carga fuente, relleno, borde y formato de número juntos, y un solo Ctrl+Z
            es la prueba de que así fue
        - title: En la pestaña Borde importa el orden
          desc: >-
            Primero Estilo de línea y Color, después los bordes. Las demás pestañas perdonan
            el orden y esa no
        - title: Al controlador no se le dice dónde parar
          desc: >-
            Un arrastre da un paso lineal y nada más. [Growth], los días hábiles, una
            tendencia y un valor final viven todos dentro de Rellenar, Serie

