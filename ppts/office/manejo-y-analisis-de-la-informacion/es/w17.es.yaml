meta:
  course: Manejo y Análisis de la Información
  code: TIA501
  lang: es
  language: excel
  week: 17
  footer: MANEJO Y ANÁLISIS DE LA INFORMACIÓN · TIA501 · EXCEL
  blocks: 3

slides:
  - cover:
      kicker: Facultad de Empresariales · 2026
      unit: Semana 17 · Sesiones 33 y 34 · Impresión, vistas y el examen final
      title: Manejo y Análisis de la Información
      subtitle: >-
        Lo último que hace un libro es salir de tu pantalla. Configurar página, vistas y
        las tres revisiones antes de que llegue a manos de alguien más.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, TIA501 · Empresariales]
        - [Sesiones, 33 y 34 de 34]
      notes: |
        Sesiones 33 y 34 del programa, CLO09. La sesión 33 es configurar página,
        impresión y vistas; la sesión 34 es el examen final. Cubierto de frente:
        Associate 1.3.1, 1.4.2, 1.4.3, 1.4.4, 1.5.1 y 1.5.3.
        COBERTURA.md agrega 1.3.3 encabezados y pies de página de Excel, 1.5.2 guardar
        en otros formatos, y el Comprobador de compatibilidad, que es la tercera pata de
        1.5.4 después de la semana 9 y la semana 11.
        Las rutas salen de procedures.en.md. El ejercicio 4 es el archivo, y el
        laboratorio también recupera el objetivo 1.4.1 si la sesión 4 se quedó corta.

  - agenda:
      eyebrow: Agenda
      title: Tres bloques de trabajo
      cards:
        - title: Configurar página e imprimir
          desc: Un cuadro de diálogo con cuatro pestañas, y las galerías que no son él
        - title: Vistas y ventanas
          desc: Inmovilizar en el ancla correcta, dividir, la vista previa de salto de página, dos ventanas sobre un archivo
        - title: Entregarlo
          desc: Encabezados y pies, exportar, y la tercera de las herramientas de Comprobar si hay problemas
        - title: El examen final
          desc: De qué se alimenta la sesión 34, y en qué se va la hora

  - objectives:
      eyebrow: Objetivos de la sesión
      title: Al terminar las dos sesiones el alumno podrá…
      items:
        - head: Configurar una página en una sola operación
          sub: El [dialog box launcher], cuatro pestañas, y todo aplicado antes de dar Aceptar
        - head: Fijar un área de impresión y comprobarlo
          sub: La Vista previa de salto de página deja en gris lo de afuera, y el Administrador de nombres guarda Sheet1!Print_Area
        - head: Repetir títulos y armar un pie de página
          sub: Repetir filas en extremo superior, luego [Custom Footer] y los botones que escriben los códigos
        - head: Inmovilizar en la celda ancla correcta
          sub: Todo lo de arriba y todo lo de la izquierda de la celda donde diste clic, y nada más
        - head: Exportar el libro completo, no una hoja
          sub: Archivo, Exportar, [Create PDF/XPS], y el botón Opciones que decide qué entra
        - head: Correr la tercera herramienta de revisión
          sub: Comprobador de compatibilidad, y [Copy to New Sheet], la única que deja registro

  - roadmap:
      eyebrow: Mapa del curso
      title: Dónde cae esta semana en el semestre
      phases:
        - label: A · Semanas 1–2
          title: Word, luego la cinta
          desc: Documentos largos, y la primera pasada por la cuadrícula de Excel
          state: done
        - label: B · Semanas 3–4
          title: Hojas y funciones
          desc: Nombres, referencias, precedencia, estadística, texto y fechas
          state: done
        - label: C · Semanas 5–8
          title: Lógica condicional
          desc: Formato por regla, SI, comodines, anidado y la familia SI.CONJUNTO
          state: done
        - label: D · Semanas 9–13
          title: Datos, tablas y búsqueda
          desc: Importar, filtros, tablas, gráficos y las funciones de búsqueda
          state: done
        - label: E · Semanas 14–17
          title: Resumir y entregar
          desc: Tablas dinámicas, filtros avanzados, hipótesis e impresión
          state: now

  - divider:
      eyebrow: Bloque 01
      title: Configurar página es una cosa, no seis
      lede: >-
        La cinta ofrece cinco galerías, cada una un comando aparte con su propio paso de
        deshacer. El examen pide una configuración de página, en singular, y eso vive en
        un cuadro de diálogo.
      block: 1

  - concept:
      eyebrow: Concepto clave
      title: Cinco galerías contra un cuadro de diálogo
      lead: >-
        Márgenes, Orientación, Tamaño, Saltos y Ajustar área de impresión funcionan, y cada una
        es una operación distinta. El cuadro Configurar página guarda esos mismos ajustes
        en cuatro pestañas, y todo lo que toques ahí se aplica junto cuando das Aceptar. Esa
        es la diferencia que el objetivo está escrito para atrapar.
      panel:
        label: La ruta que califica
        title: El [dialog box launcher], abajo a la derecha del grupo
        note: >-
          Pestaña Diseño de página, grupo Configurar página, la flechita de abajo a la
          derecha. No el vínculo Configurar página del fondo de Ctrl+P, que abre el mismo
          cuadro con algunas opciones de la pestaña Hoja en gris, el área de impresión
          entre ellas.
      steps:
        - text: Selecciona la hoja, o Ctrl-clic en varias pestañas para un grupo
        - text: Abre el cuadro y llena las cuatro pestañas
        - text: "Vista preliminar dentro del cuadro antes de aplicar"
          loop: ↺ y un solo Aceptar aplica todo

  - figure:
      eyebrow: Bloque 01 · El cuadro de diálogo
      title: Cuatro pestañas, y un Aceptar al final
      image: img/en/page-setup-dialog.png
      caption: >-
        Captura de la interfaz en inglés. Orientación, Ajuste de escala, Tamaño del papel,
        Calidad de impresión y Primer número de página, todo en la pestaña Página, con Imprimir,
        Vista preliminar y Opciones a lo largo del borde inferior.
      alt: >-
        El cuadro de diálogo Configurar página de Excel en su pestaña Página, con
        Vertical seleccionado, Ajustar al en 100 por ciento, papel Carta y calidad
        de impresión de 600 ppp.
      side:
        label: "Ajustar al contra Ajustar a"
        text: >-
          Los dos botones de escala son excluyentes. Fijar Ancho o Alto en la cinta
          cambia el cuadro a Ajustar a y regresa Ajustar al a 100 por ciento sin decirlo,
          y por eso los dos se pelean.

  - table:
      eyebrow: Bloque 01 · Las cuatro pestañas
      title: Qué vive dónde, y qué es lo que preguntan
      headers: [Pestaña, Qué vive ahí, La favorita del examen]
      rows:
        - ["Página", "Orientación, Ajuste de escala, Tamaño del papel", "Ajustar a 1 página de ancho"]
        - ["Márgenes", "Cuatro márgenes, encabezado, pie", "[Center on page]"]
        - ["Encabezado y pie de página", "Las dos listas, botones Personalizada", "[Different first page]"]
        - ["Hoja", "Imprimir títulos, área de impresión", "Repetir filas en extremo superior"]

  - steps:
      eyebrow: Bloque 01 · La ruta que califica
      title: Área de impresión, y la prueba de que quedó
      items:
        - label: '01'
          title: Selecciona el rango
          desc: Ctrl-clic para sumar bloques a la misma selección. Cada uno se imprime en su propia página.
        - label: '02'
          title: Fija el área de impresión
          desc: Pestaña Diseño de página, grupo Configurar página, Área de impresión, Establecer área de impresión
        - label: '03'
          title: Amplía o borra
          desc: "[Add to Print Area] para otro bloque, Borrar área de impresión para quitarla toda"
        - label: '04'
          title: Imprimir títulos
          desc: La pestaña Hoja del cuadro, Repetir filas en extremo superior y Repetir columnas a la izquierda
        - label: '05'
          title: Compruébalo
          desc: El Administrador de nombres ya guarda Sheet1!Print_Area. Sin nombre no hubo área, imprima lo que imprima.

  - steps:
      eyebrow: Bloque 01 · La ruta que califica
      title: Un pie de página armado con campos, no con palabras
      items:
        - label: '01'
          title: El mismo cuadro
          desc: Diseño de página, el [dialog box launcher] de Configurar página, y la pestaña Encabezado y pie de página
        - label: '02'
          title: Las listas vienen hechas
          desc: Úsalas solo cuando la tarea no dicte el texto que quiere
        - label: '03'
          title: "[Custom Header]"
          desc: Se abren tres cajas, [Left section], [Center section] y [Right section]
        - label: '04'
          title: Inserta los campos
          desc: Usa los botones de arriba de las cajas. Ellos escriben los códigos; teclear las palabras no.
        - label: '05'
          title: Las cuatro casillas
          desc: "[Different odd and even pages], [Different first page], [Scale with Document], [Align with page margins]"

  - table:
      eyebrow: Bloque 01 · Objetivo 1.5.3
      title: Ctrl+P, y la mitad que no se queda
      headers: [Ajuste, Dónde está, Se escribe de vuelta en la hoja]
      rows:
        - ["Copias", "El contador de hasta arriba", "Solo este panel"]
        - ["Qué imprimir", "[Active Sheets], [Workbook], [Selection]", "Solo este panel"]
        - ["[Ignore Print Area]", "Al fondo de esa lista", "Solo este panel"]
        - ["Intercaladas", "Debajo de una o dos caras", "Solo este panel"]
        - ["Orientación, márgenes", "Los valores del propio cuadro", "Sí se escribe"]
        - ["Escala", "[Fit Sheet], [Columns], [Rows]", "Sí se escribe"]

  - table:
      eyebrow: Bloque 01 · Lo que escriben los botones
      title: Seis códigos que conviene reconocer en una caja
      headers: [Botón, Código que escribe, Qué imprime]
      rows:
        - ["[Insert Page Number]", "&P", "3"]
        - ["[Number of Pages]", "&N", "8"]
        - ["[Insert Date]", "&D", "18/08/2026"]
        - ["[Insert Time]", "&T", "14:20"]
        - ["[Insert File Name]", "&F", "Exercise 4 Excel.xlsx"]
        - ["[Insert Sheet Name]", "&A", "World Data 2023"]

  - pitfalls:
      eyebrow: Bloque 01 · Errores comunes
      title: Cuatro maneras de que la impresión no coincida
      items:
        - label: Error 01
          title: Escala fijada desde la cinta
          desc: >-
            Ancho y Alto en Ajustar área de impresión cambian el ajuste a Ajustar a, y la caja
            de por ciento de Ajustar al regresa a 100 sin decir nada. Fija los dos en el
            cuadro.
        - label: Error 02
          title: Imprimir la selección en vez del área
          desc: >-
            Imprime las celdas correctas una vez y no guarda nada. La siguiente impresión
            es otra vez la hoja completa, y el Administrador de nombres no tiene ningún
            Print_Area que mostrar.
        - label: Error 03
          title: Un encabezado tecleado como texto literal
          desc: >-
            Una fecha escrita con palabras imprime bien hoy y nunca se actualiza.
            [Insert Date] escribe el código, y el código es lo que lee quien califica.
        - label: Error 04
          title: Repetir los títulos a mano
          desc: >-
            Pegar la fila de encabezados cada veinte renglones sobrevive una impresión y
            rompe todo orden, filtro y tabla dinámica que se arme después sobre la hoja.

  - divider:
      eyebrow: Bloque 02
      title: Ver una hoja demasiado grande para verla
      lede: >-
        Doscientos renglones y treinta y cinco columnas no caben en una pantalla.
        Inmovilizar, dividir y una segunda ventana son tres respuestas distintas a eso.
      block: 2

  - steps:
      eyebrow: Bloque 02 · La ruta que califica
      title: Tres vistas, y una que se guarda
      items:
        - label: '01'
          title: "Normal"
          desc: Pestaña Vista, grupo Vistas de libro. Donde de verdad se trabaja.
        - label: '02'
          title: Vista previa de salto de página
          desc: Arrastra una línea azul y se vuelve un salto manual, sólido donde el automático era punteado.
        - label: '03'
          title: Diseño de página
          desc: Los encabezados y pies se ven como van a imprimirse, y las reglas fijan los márgenes.
        - label: '04'
          title: "Vistas personalizadas"
          desc: Configura la hoja primero, luego [Add], ponle nombre, marca [Print settings] y [Hidden rows].
        - label: '05'
          title: El detalle
          desc: Un libro con una tabla de Excel no puede guardar vistas personalizadas. El botón se pone gris.

  - concept:
      eyebrow: Bloque 02 · Todo el objetivo en una frase
      title: Excel inmoviliza arriba y a la izquierda
      lead: >-
        Todo lo que está arriba de la celda seleccionada y todo lo que está a su izquierda
        se queda fijo. Esa sola regla es el objetivo entero, y por eso la respuesta a
        "inmoviliza las dos filas de encabezado y la columna de etiquetas" es dar clic en
        B3 y nada más. Las dos entradas de conveniencia que van debajo ignoran tu
        selección por completo.
      panel:
        label: Cómo comprobarlo
        title: La entrada del menú ahora dice Movilizar paneles
        note: >-
          Inmovilizar dibuja una línea delgada y oscura donde dividir dibuja dos barras
          grises gruesas, y una división se desplaza en las dos mitades mientras que una
          inmovilización no. La prueba más barata es volver a abrir el menú y leer la
          primera entrada.
      steps:
        - text: Saca cuál es la celda de abajo y a la derecha de lo que se queda
        - text: Da clic en esa sola celda, no en un encabezado de fila o columna
        - text: Vista, Ventana, Inmovilizar paneles, Inmovilizar paneles
          loop: ↺ y la misma primera entrada lo suelta

  - trace:
      eyebrow: Bloque 02 · De la celda ancla al resultado
      title: Qué inmoviliza en realidad cada clic
      headers: [Das clic en, Filas que quedan, Columnas que quedan, Se lee como]
      rows:
        - ["A2", "1", "0", "SplitRow 1"]
        - ["B1", "0", "1", "SplitColumn 1"]
        - ["B3", "2", "1", "Filas 1 y 2, col A"]
        - ["A1", "0", "0", "Nada en absoluto"]
      verdict: "Inmovilizar fila superior ignora la selección e inmoviliza exactamente una fila, que es lo correcto como la mitad de las veces y se calla cuando no lo es."

  - steps:
      eyebrow: Bloque 02 · La ruta que califica
      title: El grupo Ventana, cinco comandos
      items:
        - label: '01'
          title: "Nueva ventana"
          desc: Una segunda ventana sobre el mismo archivo. Los títulos se vuelven nombre.xlsx - 1 y - 2.
        - label: '02'
          title: "Organizar todo"
          desc: "[Tiled], Horizontal, Vertical, [Cascade], y la casilla [Windows of active workbook]"
        - label: '03'
          title: Dividir
          desc: Da clic en la celda donde cae la división, luego Dividir. Cada mitad se desplaza sola.
        - label: '04'
          title: "Ver en paralelo"
          desc: Dos archivos, luego Desplazamiento sincrónico y Restablecer posición de la ventana
        - label: '05'
          title: Zoom
          desc: El cuadro Zoom acepta un porcentaje exacto. El deslizador de la esquina no.

  - divider:
      eyebrow: Bloque 03
      title: Entregarlo
      lede: >-
        Exportar es distribuir. Y también lo es mandarle un .xlsm a alguien cuyo Excel lo
        abre con las macros apagadas y una barra cruzada arriba.
      block: 3

  - steps:
      eyebrow: Bloque 03 · La ruta que califica
      title: Exportar, y el botón que decide
      items:
        - label: '01'
          title: Archivo, Exportar
          desc: No F12. El panel Exportar es la ruta que nombra el objetivo.
        - label: '02'
          title: "[Create PDF/XPS]"
          desc: Luego el botón [Create PDF/XPS], que abre [Publish as PDF or XPS]
        - label: '03'
          title: "Opciones"
          desc: "[Publish what]: [Selection], [Active sheet(s)], [Entire workbook], Tabla. Este es el paso."
        - label: '04'
          title: Otros formatos
          desc: Archivo, Exportar, [Change File Type], elige de las dos listas, y luego el botón Guardar como
        - label: '05'
          title: Confirma el tipo
          desc: Revisa [Save as type] en el cuadro Guardar como, da clic en Guardar, y lee cualquier aviso.

  - table:
      eyebrow: Bloque 03 · Lo que cede cada formato
      title: Cinco entradas de la lista [Save as type]
      headers: [Formato, Para qué sirve, Qué pierde]
      rows:
        - [".xlsx", "El libro normal", "Cualquier macro del archivo"]
        - [".xlsm", "Un libro que guarda código", "Nada"]
        - [".xltx", "Una plantilla de la cual partir", "Cae en la carpeta de plantillas"]
        - [".csv", "Una hoja de texto plano", "Las demás hojas, y los formatos"]
        - [".pdf", "Leer e imprimir", "Las fórmulas detrás de los números"]

  - steps:
      eyebrow: Bloque 03 · El archivo que te mandan
      title: Abrir un libro que ya trae macros
      items:
        - label: '01'
          title: El formato
          desc: El código solo sobrevive en .xlsm. Guarda uno como .xlsx y el código desaparece.
        - label: '02'
          title: La barra amarilla
          desc: "[SECURITY WARNING], macros desactivadas, y un botón [Enable Content]. La decisión se recuerda."
        - label: '03'
          title: La barra roja
          desc: Si viene del correo o de la web no hay botón. Ciérralo, clic derecho en el archivo, Propiedades, [Unblock].
        - label: '04'
          title: El ajuste que hay detrás
          desc: Esto es de la semana 11. Programador, [Code], [Macro Security], y las versiones nuevas lo llaman [Disable VBA macros].
        - label: '05'
          title: Una carpeta de confianza
          desc: Archivo, Opciones de Excel, [Trust Center], [Trust Center Settings], [Trusted Locations], [Add new location]

  - tiers:
      eyebrow: Bloque 03 · Comprobar si hay problemas, un solo menú
      title: Tres herramientas, tres semanas distintas
      items:
        - key: '01'
          title: Inspector de documento
          desc: Filas, hojas y comentarios ocultos, más todo lo que hay bajo [Document Properties]. Es permanente, así que guarda antes. Semana 9.
        - key: '02'
          title: Comprobador de accesibilidad
          desc: "Errores, [Warnings] y [Tips] en un panel lateral, con Información adicional cargando el arreglo. También está en la pestaña Revisar. Semana 11."
        - key: '03'
          title: Comprobador de compatibilidad
          desc: "[Select versions to show], y luego qué perdería de 97-2003 a 2013. [Copy to New Sheet] es el registro. Semana 17."

  - quiz:
      eyebrow: Comprobación rápida
      question: La tarea dice exportar el libro completo a PDF y el archivo sale con una sola hoja. ¿Qué se saltó?
      options:
        - "Opciones, y el ajuste [Publish what] que está adentro"
        - "[Optimize for] se quedó en [Minimum size]"
        - "Todavía había un área de impresión fijada en la primera hoja"
        - "Quedó marcada [Ignore print areas] en el cuadro"

  - table:
      eyebrow: Bloque 03 · Sesión 34
      title: De qué se alimenta el examen final
      headers: [Bloque, Semanas, Qué se te pide]
      rows:
        - ["Formatos", "2 y 3", "Formato de celdas, hojas, rangos con nombre"]
        - ["Fórmulas", "4 a 8", "Referencias, texto, fechas, la familia *.SI.CONJUNTO"]
        - ["Datos", "9 a 11", "Importar, limpiar, tabla, gráfico, proteger"]
        - ["Búsqueda", "12 y 13", "BUSCARV, BUSCARH, ÍNDICE y COINCIDIR"]
        - ["Reportes", "14 a 16", "Subtotales, tablas dinámicas, filtros, hipótesis"]

  - lab:
      eyebrow: Laboratorio
      title: De veinte páginas a ocho
      brief: >-
        Ejercicio 4, sobre la base de 196 países que sin tocarla se imprime en veinte
        páginas. Fijen el área de impresión a las primeras diez columnas y vean el conteo
        caer a ocho. Repitan la fila de encabezados en todas las páginas, pongan la hoja
        horizontal y escálenla a cuatro páginas de ancho por cinco de alto. Luego tres
        copias de la hoja: inmovilicen la primera columna en una, inmovilicen en B4 en la
        siguiente, dividan la tercera y arrastren la barra vertical más allá de la
        columna C.
      blocks:
        - label: Entregable
          text: El libro y un PDF del archivo completo, los dos en Blackboard
        - label: Agreguen lo que el archivo deja fuera
          text: Un pie de página personalizado con el número de página y el nombre de la hoja, un zoom exacto de 85 por ciento, y una segunda ventana acomodada en vertical
        - label: Si la semana 2 se quedó corta
          text: "Aquí se recupera la Barra de herramientas de acceso rápido: Archivo, Opciones de Excel, Barra de herramientas de acceso rápido, [Commands Not in the Ribbon]"

  - takeaways:
      eyebrow: Resumen
      title: Tres cosas para llevarse
      items:
        - title: Un cuadro de diálogo, no cinco galerías
          desc: >-
            Todo lo que hacen las galerías vive en cuatro pestañas de Configurar página, y
            aplicarlo ahí es una sola operación. Eso es todo el objetivo 1.3.1
        - title: Un área de impresión deja un nombre
          desc: >-
            Fijar una escribe Sheet1!Print_Area en el Administrador de nombres. Si el
            nombre no está, no se fijó nada, sin importar qué salió de la impresora
        - title: Inmoviliza desde la celda, no desde el menú
          desc: >-
            Excel se queda con todo lo de arriba y lo de la izquierda de la celda donde
            diste clic. Inmovilizar fila superior es una apuesta que atina como la mitad de las
            veces

  - homework:
      eyebrow: Preparación
      title: Qué hacer antes de la sesión 34
      brief: >-
        Reconstruyan tres cosas de memoria en vez de volver a leerlas, porque el examen
        califica la ruta y no el resultado: una pasada de Formato de celdas que ponga
        borde y relleno juntos, una búsqueda con la matriz de la tabla bloqueada, y una
        tabla dinámica cuyo formato de número sobreviva una actualización.
      meta:
        - [Cuándo, Sesión 34]
        - [Formato, "En el laboratorio, en la máquina"]
        - [Traer, Nada. Los archivos se proporcionan]
        - [Peso, El componente de examen final]

  - closing:
      title: Gracias
      subtitle: >-
        Diecisiete semanas, treinta y cuatro sesiones y veinticinco ejercicios. La
        certificación es el siguiente paso, y ya está al alcance.
      meta:
        - [Correo, descobarc@up.edu.mx]
        - [Mensajería, Google Chat institucional]
        - [Repositorio, github.com/davidowa/learning-hub]
