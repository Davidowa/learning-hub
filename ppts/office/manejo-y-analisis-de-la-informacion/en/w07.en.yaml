slides:
  - cover:
      kicker: Facultad de Empresariales · 2026
      unit: Week 07 · Sessions 13 and 14 · Compound conditions
      title: Information Management and Analysis
      subtitle: >-
        Operators and wildcards, then the three functions that combine tests, then one IF
        living inside another and the two tools that read a nest back to you.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, TIA501 · Empresariales]
