  - agenda:
      eyebrow: Agenda
      title: Three blocks of work
      cards:
        - title: Operators and wildcards
          desc: What runs before what, and the three symbols that only some arguments read
        - title: AND, OR and NOT
          desc: A truth table with four rows, and how a function goes inside another one
        - title: Nesting
          desc: Nested IF, then IFS and SWITCH, then the two tools that debug them
        - title: Your turn
          desc: Exercises 8, 10 and 12, and the same case written three different ways

  - objectives:
      eyebrow: Session objectives
      title: By the end of the two sessions you will be able to…
      items:
        - head: Predict the order a formula runs in
          sub: Eight precedence levels, with comparison always last and reference always first
        - head: Write a criterion that uses wildcards
          sub: And name the places that read them, which is not the places you would guess
        - head: Combine tests with AND, OR and NOT
          sub: All four rows of the truth table, not only the two that feel obvious
        - head: Nest a function from inside the dialog
          sub: Using the Name Box, which becomes a function list while a dialog is open
        - head: Build a band with nested IF, IFS or SWITCH
          sub: And say which of the three the case in front of you actually calls for
        - head: Debug a nest instead of rewriting it
          sub: Evaluate Formula step by step, and the error checking rules behind the triangles

  - roadmap:
      eyebrow: Course map
      title: Where this week sits in the term
      phases:
