      notes: |
        Session 13 is operators and wildcards plus AND and OR. Session 14 is nested IF.
        COBERTURA.md adds five objectives here, all from Expert domain 3: NOT, IFS and
        SWITCH under 3.1.1, Evaluate Formula under 3.5.4, and error checking rules
