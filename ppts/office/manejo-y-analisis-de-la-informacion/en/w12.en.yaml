  - pitfalls:
      eyebrow: Block 01 · Common errors
      title: Four ways to lose marks you already earned
      items:
        - label: Error 01
          title: Formatting from the ribbon
          desc: >-
            Fill and font colour in two clicks on the Home tab give the same picture as
            Ctrl+1. When the task names the Format Cells dialog, only one of them counts.
        - label: Error 02
          title: Sorting twice instead of adding a level
          desc: >-
            Two passes of Sort A to Z reach the same arrangement on simple data and leave
            no levels in the dialog for anyone to read afterwards.
        - label: Error 03
          title: Building the chart from the gallery
          desc: >-
            One click and a thumbnail. It never opens the preview where the subtype the
            task named is chosen and compared against its neighbours.
        - label: Error 04
          title: A typed SUM under the table
          desc: >-
            The number is right, the table does not own it, and it stands still when the
            list is filtered. The total row check box is the answer.

