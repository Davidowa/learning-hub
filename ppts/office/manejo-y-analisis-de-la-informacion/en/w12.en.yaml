  - concept:
      eyebrow: Key concept
      title: A MOS exam is a project, not a questionnaire
      lead: >-
        There are no multiple choice items about what a dialog is called. You are given a
        workbook and a list of tasks written the way an office asks for things, and the
        file you leave behind is what gets read. The grader cannot see you work, only what
        the work left in the file.
      panel:
        label: The consequence
        title: A right answer through the wrong route can score nothing
        note: >-
          Two clicks on the ribbon and one visit to Format Cells produce the same coloured
          cell. Only one of them leaves the evidence the task was written to look for.
      steps:
        - text: You read the task, in plain office language
        - text: You do it in a real Excel, with the real ribbon
        - text: The file is read afterwards, not you
          loop: ↺ and the next task starts from the file you just left

