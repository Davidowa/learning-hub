  - divider:
      eyebrow: Block 03
      title: VLOOKUP opens
      lede: >-
        Half a session, one function, and the beginning of everything weeks 13 to 16 do.
        Two tables stop being two tables the moment one of them can read the other.
      block: 3

  - concept:
      eyebrow: Key concept
      title: What a lookup replaces
      lead: >-
        Exercise 19 has ten salespeople and a table of four vendor types. Without a lookup,
        somebody types the base salary ten times. Change the salary for type B and nothing
        on the report knows. A lookup makes the report ask the table, and the table becomes
        the only place the number lives.
      panel:
        label: The condition VLOOKUP puts on you
        title: The key has to sit in the first column of the table
        note: >-
          Not the first column of the sheet. The first column of the range you hand it.
          When the key is not there, VLOOKUP cannot look to its left, and that is exactly
          the wall week 13 walks into and answers with INDEX and MATCH.
      steps:
        - text: The report holds the key, here the vendor type
        - text: The table holds the key and the answers
        - text: VLOOKUP walks down the first column
          loop: ↺ and returns the cell N columns to the right of the hit

  - code:
      eyebrow: Block 03 · The four arguments
      title: Three of them are obvious and the fourth is not
      filename: vlookup.xlsx
      lang: excel
      source: |
        =VLOOKUP(lookup_value,table_array,col_index_num,range_lookup)

        1  The key. Left relative, so it moves as you fill down.
        2  The whole reference table, first column included.
           Press F4 to lock it to $A$15:$C$18.
        3  Counted from the first column of table_array,
           not from column A of the worksheet.
        4  FALSE is an exact match, TRUE is the banded one.
           Empty is not FALSE. Empty means TRUE.
      annotations:
        - label: Why F4 matters
          text: A relative table array walks down the sheet as the formula is filled, one row per row.
        - label: Counting the column
          text: Hand it A15 to C18 and the base salary is column 2, whatever letter it wears.
        - label: The default
          text: TRUE needs the first column sorted ascending. On unsorted data it returns a wrong answer.
        - label: If it fails
          text: "#N/A means nothing matched. Read it before you wrap it in anything."
          accent: true

  - steps:
      eyebrow: Block 03 · The graded route
      title: Through the Function Arguments dialog
      items:
        - label: '01'
          title: Select the cell
          desc: The one that will hold the lookup, on the report, not on the reference table.
        - label: '02'
          title: Formulas, Lookup & Reference
          desc: Formulas tab, Function Library group, Lookup & Reference, then VLOOKUP. Shift+F3 opens Insert Function on the same list.
        - label: '03'
          title: Lookup_value
          desc: Click the cell holding the key. Leave it relative if the formula will be filled down, which it always will be.
        - label: '04'
          title: Table_array, then F4
          desc: Select the whole reference table including its first column, then press F4. This is the step candidates lose marks on.
        - label: '05'
          title: The last two boxes
          desc: Col_index_num counted inside the table array. Range_lookup typed as FALSE, written out, not left empty.

  - code_output:
      eyebrow: Measured · Exercise 19, the Report sheet
      title: The same two formulas, ten rows apart
      filename: report.xlsx
      lang: excel
      output_label: What comes back
      source: |
        =VLOOKUP($D3,Table!$A$15:$C$18,2,FALSE)
        =VLOOKUP($D3,Table!$A$15:$C$18,3,FALSE)

        D3 holds the vendor type. The reference
        table holds A, B, C and D down its first
        column, the monthly base salary in the
        second and the sales goal in the third.

        Filled down to row 12, that locked
        $A$15:$C$18 is the only reason row 12
        still reads the same four rows.
      output: |
        Javier Lopez      A     50,000
        Sales goal          20,000,000
        Amount sold         22,000,000
        Difference           2,000,000
        Difference %             10.0 %
        Andrea Legarreta  D     20,000
        Sales goal           5,000,000
        Amount sold          2,000,000
        Difference          -3,000,000
        Difference %            -60.0 %

  - compare:
      eyebrow: Block 03 · The two routes
      title: The same formula, written two ways
      before:
        label: Graded · the dialog
        file: route.txt
        lang: text
        code: |
          Formulas, Lookup & Reference, VLOOKUP
          Lookup_value  click D3
          Table_array   drag, then press F4
          Col_index_num type 2
          Range_lookup  type FALSE
          OK
      after:
        label: Not graded · typed by hand
        file: route.txt
        lang: text
        code: |
          Type =VLOOKUP( and drag the table
          Hit F4 if you remember
          Type ,2, and close the bracket
          Leave the fourth argument out

          Right answer today, wrong one on
          the first unsorted reference table
      note: >-
        Typing it is faster and every one of us does it. The reason to learn the dialog is
        that it shows the four boxes with their names, and the task on exam day is written
        in those names. Range_lookup is not a word anybody says out loud.

  - table:
      eyebrow: Block 03 · One argument, one classic mistake
      title: Where the marks actually go
      headers: [Argument, What it takes, The mistake]
      rows:
        - ["Lookup_value", "The cell holding the key", "Locking it out of habit"]
        - ["Table_array", "The table, first column included", "No F4, so it walks"]
        - ["Col_index_num", "Counted inside the table array", "Counted from column A"]
        - ["Range_lookup", "FALSE for an exact match", "Left empty, which means TRUE"]
        - ["The result", "The value N columns right", "Wrapping the error unread"]

  - pitfalls:
      eyebrow: Block 03 · Common errors
      title: Four ways VLOOKUP gives a wrong answer
      items:
        - label: Error 01
          title: The key is not in the first column
          desc: >-
            VLOOKUP cannot look to its left. Exercise 21 is built on exactly this, and
            next week answers it with INDEX and MATCH rather than by moving the column.
        - label: Error 02
          title: The table array left relative
          desc: >-
            Row 3 reads the right table and row 12 reads nine rows lower. Some of them
            still return a number, which is why nobody notices.
        - label: Error 03
          title: TRUE on an unsorted table
          desc: >-
            The approximate match assumes the first column climbs. On unsorted data it
            returns whatever it stopped at, silently, with no error value.
        - label: Error 04
          title: Text that is not the same text
          desc: >-
            A trailing space, or a number stored as text against a real number. Both give
            #N/A, and both look identical in the cell.

  - quiz:
      eyebrow: Quick check
      question: You hand VLOOKUP the range A15 to C18 and want the sales goal, which is in column C. What is Col_index_num?
      options:
        - 3, counted from the first column of the table array
        - 1, because C is the first column with the answer in it
        - 3, but only if the table starts in column A of the sheet
        - It depends on whether Range_lookup is TRUE or FALSE

  - lab:
      eyebrow: Lab · the half session
      title: The first two lookups of the payroll model
      brief: >-
        On the Report sheet of Exercise 19, fill the monthly base salary and the sales goal
        for the first three salespeople with VLOOKUP, built through the Function Arguments
        dialog. Then fill the formula down to row 12 and check that Andrea Legarreta, a
        type D, still reads twenty thousand and five million.
      blocks:
        - label: Deliverable
          text: The two columns filled, and the formula bar shown for row 3 and for row 12
        - label: Constraint
          text: Range_lookup written out as FALSE in both. Not left empty, not typed as 0.
        - label: The test
          text: Change the base salary for type B on the reference table. Two rows of the report have to move.

  - takeaways:
      eyebrow: Summary
      title: Three things to take away
      items:
        - title: The file is what is read
          desc: >-
            In the midterm, in the mock and in the certification, nobody watches you work.
            The route only counts to the extent it leaves something behind in the file
        - title: The mock is for finding gaps
          desc: >-
            A low score in session 24 costs nothing and tells you which routes you only
            thought you knew, while there are still five weeks to fix them
        - title: A lookup makes one place authoritative
          desc: >-
            The number is written once, in the reference table, and every row that needs
            it asks. Typing it ten times is ten places to forget to update

  - homework:
      eyebrow: Assignment
      title: Exercise 19, submission and grading
      brief: >-
        The payroll model. Three reference tables, ten salespeople and nineteen columns to
        fill. Exact VLOOKUP for the base salary and the commission, approximate VLOOKUP for
        the bonus band, date arithmetic for seniority, conditional formatting on the
        difference, and two decisions built with IF combined with AND and with OR.
      meta:
        - [Due, "Week 13, session 25"]
        - [Format, Blackboard · one .xlsx]
        - [Weight, Part of the mark for assignments]
      rubric:
        - ["Exact lookups", "30 %", "Table array locked, column counted inside it, FALSE written out"]
        - ["Approximate lookup", "25 %", "A numeric ladder, sorted ascending, and the band edges checked"]
        - ["Dates and formats", "20 %", "Seniority in years, and the conditional formatting on the difference"]
        - ["The two decisions", "25 %", "IF with AND for the award, IF with OR for the letter"]

  - closing:
      title: Questions
      subtitle: >-
        Next session, VLOOKUP in depth, then HLOOKUP, and the pair that answers the case
        where the key is not in the first column. Bring Exercise 19 finished.
      meta:
        - [Email, descobarc@up.edu.mx]
        - [Chat, Institutional Google Chat]
        - [Repository, github.com/davidowa/learning-hub]
