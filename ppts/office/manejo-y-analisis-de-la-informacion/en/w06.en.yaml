          desc: The six comparisons, both branches as formulas, and where the function stops
        - title: The sweep back
          desc: Weeks 2 to 5, the dialogs they live in, and the references that broke
        - title: The exam session
          desc: What session 12 is grading, and how to spend the time it gives you
