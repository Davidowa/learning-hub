slides:
  - cover:
      kicker: Facultad de Empresariales · 2026
      unit: Week 06 · Sessions 11 and 12 · IF in depth, then the midterm
      title: Information Management and Analysis
      subtitle: >-
        One class session and one exam session. IF as far as it goes on its own, and then
        a sweep back over everything the first block asked you to be able to do.
      meta:
        - [Instructor, David Escobar-Castillejos]
