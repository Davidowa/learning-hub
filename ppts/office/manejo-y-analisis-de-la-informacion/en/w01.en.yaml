meta:
  course: Information Management and Analysis
  code: TIA501
  lang: en
  language: excel
  week: 1
  footer: INFORMATION MANAGEMENT AND ANALYSIS · TIA501 · EXCEL
  blocks: 3

slides:
  - cover:
      kicker: Facultad de Empresariales · 2026
      unit: Week 01 · Course framing and the rule that grades every task
      title: Information Management and Analysis
      subtitle: >-
        Sessions 1 and 2 are Word. This deck sets up the rest of the term, what the
        certification measures and how the term is graded.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, TIA501 · Empresariales]
        - [Sessions, 1 and 2 of 34]
      notes: >-
        Sources for this deck. Assessment table, operating rules and CLO wording from the
        December syllabus of TIA501. Objective counts and version comparison from
        COBERTURA.md. The routes quoted on the block 3 slides come from procedures.en.md,
        objective 2.2.6.

  - agenda:
      eyebrow: Agenda
      title: Three blocks of work
      cards:
        - title: What the exam measures
          desc: Two certifications, one hundred and seven objectives, and why the route counts more than the result
        - title: How the term is graded
          desc: Two midterms, a project, the self-paced course and the final exam
        - title: The rule of the course
          desc: The graded route and the fast route, on the first formatting task of the term
        - title: Where Word sits
          desc: Sessions 1 to 4 are partly word processing, and these decks carry the Excel half

  - objectives:
      eyebrow: Session objectives
      title: By the end of the session you will be able to…
      items:
        - head: Say what the two certifications ask for
          sub: MO-200 Associate with 59 objectives, MO-201 Expert with 48
        - head: Place every assessment in the term
          sub: What each one covers, when it falls and how much it weighs
        - head: Tell the graded route from the fast one
          sub: Same picture on the screen, different score, and how to check which one you took
        - head: Explain why the material is written for 2019
          sub: The fullest topic set, and no dependency on functions the lab may not have
        - head: Work under the operating rules from today
          sub: Attendance, submissions, exam conditions and the use of AI
        - head: Say what this course does not teach
          sub: Recording macros belongs to TIA503, and word processing has its own four sessions

  - roadmap:
      eyebrow: Course map
      title: Where this week sits in the term
      phases:
        - label: A · Weeks 1–2
          title: Word, then the ribbon
          desc: Long documents, and the first pass over the Excel grid
          state: now
        - label: B · Weeks 3–4
          title: Sheets and functions
          desc: Names, references, precedence, statistics, text and dates
          state: todo
        - label: C · Weeks 5–8
          title: Conditional logic
          desc: Formatting by rule, IF, wildcards, nesting and the IFS family
          state: todo
        - label: D · Weeks 9–13
          title: Data, tables and lookup
          desc: Import, filters, tables, charts and the lookup functions
          state: todo
        - label: E · Weeks 14–17
          title: Summarising and delivery
          desc: PivotTables, advanced filters, what-if and printing
          state: todo

  - divider:
      eyebrow: Block 01
      title: What the exam actually measures
      lede: >-
        Not the spreadsheet you hand in. The sequence of clicks that produced it, which is
        a different thing and is worth learning on purpose.
      block: 1

  - stat:
      eyebrow: The two objective domains
      value: '107'
      text: >-
        objectives across the two Microsoft Office Specialist exams this course prepares
        you for.
      note: >-
        Fifty-nine in MO-200 Associate, forty-eight in MO-201 Expert. The syllabus as
        written covers forty-four. The other sixty-three are added week by week, without
        moving a single session.

  - table:
      eyebrow: Block 01 · The four exams in the family
      title: Which skill set this course is written against
      headers: [Exam, Skill set, Objectives, Where it stands]
      rows:
        - ["MO-200", "Excel Associate 2019", "59", "The spine of this course"]
        - ["MO-201", "Excel Expert 2019", "48", "The spine, and it exists in Spanish"]
        - ["MO-210", "Excel Associate 365", "Adds 5", "What the syllabus names"]
        - ["MO-211", "Excel Expert 365", "Adds 6", "English only. Drops a whole domain"]

  - concept:
      eyebrow: Key decision
      title: Why the material is written for 2019
      lead: >-
        The 2019 domains are the fullest topic set of the four. MO-211 deletes the whole
        language domain and drops the Map chart, and the eight functions 365 adds do not
        exist in Office 2019. Teaching the 2019 list covers more ground and cannot break
        on a lab machine.
      panel:
        label: The consequence
        title: Nothing here needs a function 2019 lacks
        note: >-
          XLOOKUP, FILTER, SORT, UNIQUE, SEQUENCE, SORTBY, RANDARRAY and LET are Microsoft
          365 only. No slide, no exercise and no exam question in this course is built on
          any of them.
      steps:
        - text: The 2019 list is the longer one
        - text: Every session teaches from it
        - text: The 365 additions are named, not required
          loop: ↺ so the same deck runs on either build in the lab

  - steps:
      eyebrow: Block 01 · MO-200 Associate
      title: Five domains, fifty-nine objectives
      items:
        - label: '01'
          title: Worksheets and workbooks
          desc: 18 objectives. Import, navigation, page setup, views, printing. Weeks 3, 9 and 17.
        - label: '02'
          title: Data cells and ranges
          desc: 17 objectives. Formatting, fill, named ranges, conditional formatting. Weeks 2, 3 and 5.
        - label: '03'
          title: Tables and table data
          desc: 8 objectives. Tables, styles, total rows, filtering and sorting. Weeks 9 and 10.
        - label: '04'
          title: Formulas and functions
          desc: 8 objectives. Reference types, statistical, text and logical functions. Weeks 3 to 8.
        - label: '05'
          title: Charts
          desc: 8 objectives. Charts, chart sheets, elements, layouts and alt text. Weeks 10 and 11.

  - divider:
      eyebrow: Block 02
      title: How the term is graded
      lede: >-
        Five components, two of them worth thirty per cent each, and a rule about the
        first midterm that is worth reading twice.
      block: 2

  - table:
      eyebrow: Course assessment
      title: Five components, one hundred per cent
      headers: [Item, What it covers, When, Weight]
      rows:
        - ["Midterm 1", "Word and the first Excel block", "Week 6", "30 %"]
        - ["Midterm 2", "Logic, data, tables and charts", "Week 12", "30 %"]
        - ["Project", "A real data set, analysed", "Week 16", "15 %"]
        - ["INNOVATIQ", "Self-paced certification prep", "Before week 16", "5 %"]
        - ["Final exam", "All course units", "Week 17", "20 %"]

  - concept:
      eyebrow: Block 02 · The midterms
      title: Each midterm is two grades, not one
      lead: >-
        Seventy per cent of a midterm is the exam in the classroom. The other thirty is
        the assignments and activities of the weeks it covers. On midterm 1 that thirty
        is credited only to students who have covered the certification payment. The
        exam half is graded for everyone.
      panel:
        label: What each one covers
        title: Week 6 is Word plus the first Excel block
        note: >-
          Formatting, worksheet management, references, statistical, text and date
          functions, conditional formatting and IF. Week 12 takes wildcards, AND and OR,
          nested IF, the *IFS family, get and transform, filters, tables and charts.
      steps:
        - text: The exam is 70 % of the midterm
        - text: Assignments and activities are the other 30 %
        - text: Midterm 1 conditions that 30 % on the payment
          loop: ↺ so an unsubmitted assignment costs twice, once now and once in week 6

  - steps:
      eyebrow: Operating rules
      title: What applies from today
      items:
        - label: '01'
          title: Attendance
          desc: Recorded in the first five minutes. From minute five to fifteen it is a late mark, and two late marks are one absence.
        - label: '02'
          title: From minute sixteen
          desc: No entry to the classroom and an absence is recorded. The session ends ten minutes before the posted time.
        - label: '03'
          title: Devices
          desc: Phones, headphones and AI glasses go at the front of the room before we start.
        - label: '04'
          title: Submissions
          desc: Blackboard only, on the set date. Email is not a submission channel and assignments cannot be made up.
        - label: '05'
          title: Exams
          desc: On the classroom machines. Notes, your own submissions, the web and a USB drive are allowed. Messaging is not.

  - method:
      eyebrow: Honour Code
      title: What counts as your own work
      statement: You may use artificial intelligence to understand. You may not hand in a workbook you cannot explain.
      points:
        - label: Allowed
          text: Asking a tool to explain an error value, an argument or a dialog you do not recognise, outside exam conditions
        - label: Not allowed
          text: Submitting a formula you could not walk through cell by cell if I stopped at your desk and asked
        - label: How it is checked
          text: Submissions run through Copyleaks and Turnitin. Above thirty per cent the work is graded zero, and I may ask you to defend any part out loud.

  - divider:
      eyebrow: Block 03
      title: The rule that governs every exercise
      lede: >-
        The certification does not grade the sheet you produced. It grades how you
        produced it, and the two are not the same skill.
      block: 3

  - concept:
      eyebrow: Key concept
      title: Two routes, one picture, two scores
      lead: >-
        Change the font colour and the fill of a range and it is two clicks on the Home
        tab. Anyone can. The exam is watching for the candidate who opens the extended
        menu and applies both from inside it, in one operation. Only one of the two
        answers the item.
      panel:
        label: Why the domain is built this way
        title: The list itself splits the two routes
        note: >-
          MO-200 lists 2.2.5, apply number formats, and 2.2.6, apply cell formats from the
          Format Cells dialog box, as two separate objectives. They reach the same picture
          and only one of them is what 2.2.6 asks for.
      steps:
        - text: Learn the fast route, you will use it at work
        - text: Learn the graded route, it is the one that scores
        - text: Know which is which before the item is timed
          loop: ↺ every procedural slide this term names both

  - compare:
      eyebrow: Block 03 · The same range, formatted twice
      title: Three operations against one
      before:
        label: The fast route, not graded
        file: ribbon.txt
        lang: text
        code: |
          Home > Font > Font Color > Red
          Home > Font > Fill Color > Light yellow
          Home > Font > Borders > All Borders
      after:
        label: The graded route
        file: format-cells.txt
        lang: text
        code: |
          Ctrl+1
            Font tab   > Color > Red
            Fill tab   > Background Color > yellow
            Border tab > Style, Color, then Outline
          OK
      note: >-
        Same picture on the screen. Now press Ctrl+Z exactly once. After the dialog the
        font colour and the fill go together, because they were one operation. After the
        ribbon only the borders go. That single undo is the fastest way to check yourself
        during the exam.

  - quiz:
      eyebrow: Quick check
      question: The task says to format from the Format Cells dialog. Which answer earns the mark?
      options:
        - "Font Color and Fill Color from the Home tab, two clicks"
        - "Ctrl+1, then the Font tab and the Fill tab, then OK once"
        - "Copy a cell that already looks right and paste it over the range"
        - "Apply the Bad cell style, which is red text on a pink fill"

  - takeaways:
      eyebrow: Summary
      title: Three things to take away
      items:
        - title: The exam grades the route
          desc: >-
            Two clicks on the ribbon and one trip through a dialog leave the same sheet
            behind, and the item only accepts one of them
        - title: Two exams, 107 objectives
          desc: >-
            Fifty-nine Associate and forty-eight Expert, written against the 2019 domains
            because that is the longer list and it runs on any build in the lab
        - title: Word has its own sessions
          desc: >-
            Sessions 1, 2 and 3 are word processing and are assessed in midterm 1. These
            decks start at session 4, where Excel opens

  - homework:
      eyebrow: Assignment
      title: Submission and grading criteria
      brief: >-
        Session 2 sets the week 1 evidence and it is a Word document, not a workbook. Take
        a long document of your own and format it with styles, indentation and line
        spacing, portrait and landscape sections, and a header and footer that carry the
        page number. It doubles as the initial diagnostic for the term.
      meta:
        - [Due, Before week 2]
        - [Format, Blackboard · .pdf or .docx]
        - [Weight, Part of the 30 % inside midterm 1]
      rubric:
        - ["Styles", "40 %", "Headings carry styles, not hand-applied formatting"]
        - ["Sections", "30 %", "At least one section break with a change of orientation"]
        - ["Headers", "20 %", "Header and footer with an automatic page number"]
        - ["Delivery", "10 %", "Uploaded on Blackboard, on the set date, as .pdf or .docx"]

  - closing:
      title: Questions
      subtitle: >-
        Next session Excel opens, on the ribbon, on the Format Cells dialog behind Ctrl+1,
        and on the fill that is not a drag.
      meta:
        - [Email, descobarc@up.edu.mx]
        - [Chat, Institutional Google Chat]
        - [Repository, github.com/davidowa/learning-hub]
