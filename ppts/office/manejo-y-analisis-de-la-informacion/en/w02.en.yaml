  footer: INFORMATION MANAGEMENT AND ANALYSIS · TIA501 · EXCEL
  blocks: 3

slides:
  - cover:
      kicker: Facultad de Empresariales · 2026
      unit: Week 02 · Session 4 · First contact with Excel
      title: Information Management and Analysis
      subtitle: >-
        Session 3 is still Word. Session 4 opens Excel on the one dialog four objectives
        run through, and this deck covers that half of the week.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, TIA501 · Empresariales]
        - [Session, 4 of 34]
      notes: >-
        Sources. Session 4 wording from the December syllabus. Objective assignment and
        the five additions from COBERTURA.md, week 2. Every route on these slides is
        procedures.en.md, objectives 1.4.1, 2.1.2, 2.1.4, 2.2.1 through 2.2.8. Budget
        fifteen minutes for the Format Cells block and drop the Quick Access Toolbar
        first if the session runs short.

  - agenda:
      eyebrow: Agenda
      title: Three blocks of work
      cards:
        - title: The window, once
          desc: The only session of the term where the interface itself is the topic, and the toolbar you build yourself
        - title: Format Cells
          desc: Ctrl+1, six tabs, one operation, and the four objectives that live behind it
        - title: Cells and the fill
          desc: Inserting and deleting cells with a shift you chose, and filling a series from the dialog
        - title: Your turn
          desc: Exercise 1, the formatting workbook, formatted the way the exam wants it

  - objectives:
      eyebrow: Session objectives
      title: By the end of the session you will be able to…
      items:
        - head: Format a range from one trip through Ctrl+1
          sub: Font, fill, border and number format applied as a single operation
        - head: Set alignment, orientation and indentation
          sub: The three sub-skills Certiport bundles into objective 2.2.2, all on one tab
        - head: Wrap text without pressing Alt+Enter
          sub: And say what Shrink to fit does instead, since the two cancel each other
        - head: Copy a format onto several ranges
          sub: The Format Painter locked with a double-click, released with Esc
        - head: Apply, modify and clear a cell style
          sub: And tell Clear Formats from Clear Contents before you click either one
        - head: Fill a series from the Series dialog
          sub: With a step and a stop value, which the fill handle cannot give you

  - roadmap:
      eyebrow: Course map
      title: Where this week sits in the term
      phases:
        - label: A · Weeks 1–2
          title: Word, then the ribbon
          desc: Long documents, and the first pass over the Excel grid
          state: now
        - label: B · Weeks 3–4
          title: Sheets and functions
          desc: Names, references, precedence, statistics, text and dates
          state: todo
        - label: C · Weeks 5–8
          title: Conditional logic
          desc: Formatting by rule, IF, wildcards, nesting and the IFS family
          state: todo
        - label: D · Weeks 9–13
          title: Data, tables and lookup
          desc: Import, filters, tables, charts and the lookup functions
          state: todo
        - label: E · Weeks 14–17
          title: Summarising and delivery
          desc: PivotTables, advanced filters, what-if and printing
          state: todo

  - divider:
      eyebrow: Block 01
      title: The interface, once
      lede: >-
        After today the course looks at data and the ribbon is only where the commands
        happen to live. So the toolbar gets its five minutes now.
      block: 1

  - concept:
      eyebrow: Block 01 · Where this week sits
      title: Half of week 2 is still Word
      lead: >-
        Session 3 closes the long document with a table of contents, inserted tables,
        links, bibliography and templates. Session 4 is the first contact with Excel and
        it is the one this deck covers. Both are examined in midterm 1. Only one of them
        appears on the certification.
      panel:
        label: What session 4 has to fit
        title: Eleven objectives in ninety minutes
        note: >-
          Six the syllabus schedules, five COBERTURA adds on top. If one has to go it is
          the Quick Access Toolbar, and week 17 picks it up alongside page setup.
      steps:
        - text: Session 3, Word, references and templates
        - text: Session 4, Excel, formatting and fill
        - text: Both sit inside midterm 1, week 6
          loop: ↺ and the Excel half is where the objectives start

  - steps:
      eyebrow: Block 01 · Objective 1.4.1
      title: The toolbar you build yourself
      items:
        - label: '01'
          title: File, then Options
          desc: In the Excel Options dialog, select the Quick Access Toolbar pane on the left.
        - label: '02'
          title: Choose the scope
          desc: The Customize Quick Access Toolbar list offers For all documents (default) or the open file by name.
        - label: '03'
          title: Choose the source
          desc: The Choose commands from list holds Popular Commands, Commands Not in the Ribbon, All Commands and Macros.
        - label: '04'
          title: Add and order
          desc: Select the command, click Add, then place it with Move Up and Move Down. Modify changes its icon and name.
        - label: '05'
          title: Then it answers to a number
          desc: A button on the toolbar runs from Alt plus its position, so the ordering step is not decoration.

  - method:
      eyebrow: Block 01 · The two short routes
      title: Where the fast toolbar routes stop
      statement: Right-click any ribbon button, Add to Quick Access Toolbar. It is the best move you will ever make outside the exam.
      points:
        - label: What it reaches
          text: Anything already visible on a ribbon tab, in one click, with no dialog and no waiting
        - label: What it cannot reach
          text: The Commands Not in the Ribbon list, which is exactly where an exam item hides its awkward request
        - label: What it cannot do
          text: Scope a button to one workbook, or reorder what is already there. Both need File, Options.

  - divider:
      eyebrow: Block 02
      title: Format Cells
      lede: >-
        One dialog, six tabs, one operation. Four objectives run through it, and it is the
        clearest case in the whole course of a route being worth more than a result.
      block: 2

  - stat:
      eyebrow: The shortcut of the term
      value: Ctrl+1
      text: >-
        opens Format Cells on whichever tab you used last, from anywhere in the workbook.
      note: >-
        Ctrl+Shift+F opens it on the Font tab. Inside the dialog, Ctrl+Tab moves to the
        next tab and Ctrl+Shift+Tab to the previous one, so the whole route runs without
        the mouse. Enter is OK. Esc is Cancel, and it throws away every tab you touched.

  - concept:
      eyebrow: Key concept
      title: One operation across six tabs
      lead: >-
        The dialog is not a slower ribbon. It is one operation that carries a font
        colour, a fill, a border and a number format at once, where the ribbon charges
        one operation per button. That is why Certiport lists 2.2.6 separately from
        2.2.5.
      panel:
        label: How to check yourself
        title: Press Ctrl+Z exactly once
        note: >-
          If the font colour and the fill disappear together, the dialog did it and the
          route was the graded one. If only one of them goes, the ribbon did it. Reapply
          and try again.
      steps:
        - text: Select the range
        - text: Ctrl+1, and set everything the task named
        - text: One OK at the end
          loop: ↺ one operation, one undo, one mark

  - steps:
      eyebrow: Block 02 · Objective 2.2.6
      title: The graded route, five steps
      items:
        - label: '01'
          title: Select, then Ctrl+1
          desc: With the mouse, the dialog box launcher of the Font, Alignment or Number group. All three open the same dialog.
        - label: '02'
          title: Font tab
          desc: Font, Font style, Size, the Underline list, the Color list, and the Strikethrough, Superscript and Subscript boxes.
        - label: '03'
          title: Fill tab, no OK yet
          desc: A swatch under Background Color. No Color removes a fill. Fill Effects builds a gradient, Pattern Style adds a hatch.
        - label: '04'
          title: Border tab, in order
          desc: Line Style and Color first, then a Presets button or the edges in the preview box. This order is the whole objective.
        - label: '05'
          title: One OK
          desc: Everything you touched lands as a single operation, and a single Ctrl+Z takes all of it back.

  - figure:
      eyebrow: Block 02 · Objective 2.2.6
      title: Six tabs, and one OK at the bottom
      image: img/en/format-cells-font.png
      caption: >-
        The Font tab as it opens on the lab build. Font style, Size, the Underline list and
        the Color list all live here.
      alt: >-
        The Format Cells dialog open on the Font tab, showing the six tabs across the top,
        the Font, Font style and Size lists, Underline, Color, the Effects check boxes and
        the Preview box.
      side:
        label: What to look at
        text: >-
          The tab row across the top is the objective. Number, Alignment, Font, Border,
          Fill and Protection are six pages of one operation, and the OK at the bottom
          right commits every page you touched. Cancel throws away all of them.

  - table:
      eyebrow: Block 02 · The six tabs
      title: What only exists inside the dialog
      headers: [Tab, What you set there, Nowhere else]
      rows:
        - ["Number", "Category, decimals, separator", "Special and Custom"]
        - ["Alignment", "Horizontal, Vertical, Indent", "Shrink to fit, any angle"]
        - ["Font", "Font, style, size, colour", "Accounting underlines"]
        - ["Border", "Style and colour, then edges", "Diagonal borders"]
        - ["Fill", "Background colour", "Patterns and gradients"]
        - ["Protection", "Locked and Hidden", "The whole tab"]

  - figure:
      eyebrow: Block 02 · What the ribbon cannot reach
      title: The Fill tab, past the colour swatches
      image: img/en/format-cells-fill.png
      caption: >-
        No Color removes a fill, and the Sample box at the bottom shows the result before
        you commit it.
      alt: >-
        The Format Cells dialog on the Fill tab, with the Background Color palette, the No
        Color button, Fill Effects, More Colors, and the Pattern Color and Pattern Style
        lists.
      side:
        label: Three controls with no button
        text: >-
          Fill Effects builds a two-colour gradient. Pattern Color and Pattern Style lay a
          hatch over the background. More Colors opens the Standard and Custom picker. None
          of the three has a ribbon equivalent, so a task naming one has no short route.

  - compare:
      eyebrow: Block 02 · The same range, twice
      title: Three operations against one
      before:
        label: The short route, not graded
        file: ribbon.txt
        lang: text
        code: |
          Home > Font > Font Color   > Red
          Home > Font > Fill Color   > Light yellow
          Home > Font > Borders      > All Borders
          Home > Number > Number Format > Currency
      after:
        label: The graded route
        file: format-cells.txt
        lang: text
        code: |
          Ctrl+1
            Font tab   > Color > Red
            Fill tab   > Background Color > yellow
            Border tab > Style, Color, then Outline
            Number tab > Currency, 2 decimals
          OK
      note: >-
        Four operations on the left, one on the right, and the same sheet at the end. The
        left column also cannot reach a diagonal border, a pattern fill, Shrink to fit or
        the Special category, because those have no button.

  - pitfalls:
      eyebrow: Block 02 · Common errors
      title: Four ways to lose the item
      items:
        - label: Error 01
          title: Drawing the border first
          desc: >-
            On the Border tab, Style and Color come before the edges. A border drawn first
            keeps the previous style, and clicking the style afterwards does nothing to
            what is already drawn.
        - label: Error 02
          title: Clicking OK between tabs
          desc: >-
            Three OKs are three operations. That is the ribbon route with extra steps, and
            the single-undo check will show it. One OK at the end is what makes it one.
        - label: Error 03
          title: Leaving with Esc
          desc: >-
            Esc is Cancel and it throws away every tab you touched, not only the one in
            front of you. Enter is OK, and it commits all of them.
        - label: Error 04
          title: Hunting for these on the ribbon
          desc: >-
            Single Accounting underline, Shrink to fit, diagonal borders, pattern and
            gradient fills, Special, Custom and the Protection tab have no button at all.

  - method:
      eyebrow: Block 02 · Objectives 2.2.5 and 2.2.6
      title: Two objectives on the same picture
      statement: Number formats are the ribbon objective on purpose. Do not answer 2.2.5 from Format Cells unless the task says so.
      points:
        - label: The ribbon one
          text: Home tab, Number group. The Number Format list, then Accounting Number Format, Percent Style, Comma Style, Increase and Decrease Decimal.
        - label: Currency is not Accounting
          text: Currency puts the symbol against the digits. Accounting lines the symbols and the decimal points up, shows zero as a dash, and brackets negatives.
        - label: The habit that corrupts data
          text: Typing 50% into a cell that already holds 50 turns the value into 0.5. The picture is right and every formula downstream is wrong.

  - table:
      eyebrow: Block 02 · Objective 2.2.2
      title: The Alignment tab, control by control
      headers: [Control, What it sets, The catch]
      rows:
        - ["Horizontal", "Left, Center, Right, Fill, Justify", "Center Across Selection is here"]
        - ["Vertical", "Top, Center, Bottom, Justify", "Set Top so wrapped lines start high"]
        - ["Indent", "Steps of one character width", "Dead unless Horizontal is an Indent one"]
        - ["Orientation", "Drag the dial or type -90 to 90", "The ribbon menu offers five angles"]
        - ["Text control", "Wrap, Shrink to fit, Merge cells", "Wrap and Shrink cancel each other"]

  - table:
      eyebrow: Block 02 · Objectives 2.2.1 and 2.2.4
      title: Four things that look like the same thing
      headers: [What you do, What Excel stores, When the task wants it]
      rows:
        - ["Wrap text", "One string, taller row", "Long labels in a narrow column"]
        - ["Alt+Enter", "A line break inside the text", "Never, if the item says wrap"]
        - ["Merge & Center", "One cell, the rest discarded", "A banner over a block"]
        - ["Center Across Selection", "Nothing merged at all", "Centre a title and keep sorting"]

  - table:
      eyebrow: Block 02 · Objective 2.2.1
      title: The Merge menu, entry by entry
      headers: [Menu entry, What it does, The tell]
      rows:
        - ["Merge & Center", "One cell, content centred", "Name Box reads A1, not A1:D1"]
        - ["Merge Across", "One merged cell per row", "Five rows give five cells"]
        - ["Merge Cells", "One cell, alignment untouched", "Nothing recentres"]
        - ["Unmerge Cells", "Splits it back", "Only the top left kept a value"]

  - steps:
      eyebrow: Block 02 · Objective 2.2.3
      title: The brush, and the double-click
      items:
        - label: '01'
          title: Select the source
          desc: One cell is enough when the formatting is uniform. Values, formulas and comments do not travel.
        - label: '02'
          title: Home, Clipboard, Format Painter
          desc: One click arms it for a single use. Drag across the destination, or click its top left cell.
        - label: '03'
          title: Double-click to lock it
          desc: The brush stays armed between targets. This is the part the item is looking for whenever it names more than one area.
        - label: '04'
          title: Esc to release
          desc: Or click Format Painter again. Watch the pointer, the brush is the proof the lock was on.

  - steps:
      eyebrow: Block 02 · Objectives 2.2.7 and 2.2.8
      title: Styles, and the two ways to clear
      items:
        - label: '01'
          title: Apply
          desc: Home, Styles, Cell Styles. The task names the style, Heading 1, Total, Input, Currency [0].
        - label: '02'
          title: Modify
          desc: Right-click the style in the gallery, Modify, then Format, which opens Format Cells. Every cell using it updates.
        - label: '03'
          title: Build one
          desc: New Cell Style at the bottom of the gallery. Name it, then clear the Style Includes boxes it must not carry.
        - label: '04'
          title: Prove it is a style
          desc: Page Layout, Themes, Colors. Cells carrying a themed style move. Cells painted by hand do not.

  - table:
      eyebrow: Block 02 · Objective 2.2.8
      title: The Clear menu, and the Delete key
      headers: [What you click, What goes, What survives]
      rows:
        - ["Clear Formats", "Font, fill, borders, formats", "Values and formulas"]
        - ["Clear Contents", "Values and formulas", "Every bit of formatting"]
        - ["Clear All", "Everything, rules included", "An empty default cell"]
        - ["Clear Comments and Notes", "Comments and notes", "Values and formatting"]
        - ["The Delete key", "Contents only", "The formatting, so 2.2.8 fails"]

  - divider:
      eyebrow: Block 03
      title: Cells, and the fill that is not a drag
      lede: >-
        Two objectives where the fast route produces the right picture on easy data and
        the wrong one the moment the task gets specific.
      block: 3

  - table:
      eyebrow: Block 03 · Objective 2.1.4
      title: Insert, and what moves when you do
      headers: [What you selected, What to click, What moves]
      rows:
        - ["A block of cells", "Insert arrow, Insert Cells", "Only what the dialog says"]
        - ["The dialog", "Shift right, down, row, column", "One direction, chosen by you"]
        - ["The button face", "Insert, with no dialog", "It shifts down and never asks"]
        - ["Whole rows or columns", "Insert Sheet Rows or Columns", "That is 2.1.3, and it is week 3"]

  - steps:
      eyebrow: Block 03 · Objective 2.1.2
      title: Fill a series without touching the handle
      items:
        - label: '01'
          title: Type the seed
          desc: One value is enough for a step of 1. For any other step, type the second value and select both.
        - label: '02'
          title: Select the destination too
          desc: The selection defines how far the series runs, so it has to include the cells you want filled.
        - label: '03'
          title: Home, Editing, Fill
          desc: Down, Right, Up and Left copy. Series opens the dialog where the pattern lives.
        - label: '04'
          title: Set the series
          desc: Series in Rows or Columns. Type Linear, Growth, Date or AutoFill. Step value, and a Stop value if the task gives an end.
        - label: '05'
          title: OK
          desc: Ctrl+D fills down and Ctrl+R fills right. Neither opens the dialog, so neither reaches Growth or a stop value.

  - concept:
      eyebrow: Block 03 · How a grader tells
      title: The button that appears, and the one that does not
      lead: >-
        Drag the fill handle and a small Auto Fill Options button appears at the bottom
        right of the filled block. Fill from the ribbon and it does not appear at all.
        That button is the quickest visible record of which route was taken, and it costs
        nothing to look for it on your own work before you hand it in.
      panel:
        label: What the drag cannot do
        title: No stop value, no growth, no trend
        note: >-
          The handle infers a linear step and stops there. A series that doubles, one that
          skips weekends, or one that must end at 500 rather than at the end of the
          selection, all need the Series dialog.
      steps:
        - text: Drag the handle, the options button appears
        - text: Fill from the ribbon, nothing appears
        - text: Check your own sheet before submitting
          loop: ↺ the same tell works on the exam and on the exercise

  - quiz:
      eyebrow: Quick check
      question: Centre a title across A1:F1 without merging. Which one does that?
      options:
        - "Merge & Center on the Home tab, then widen the columns"
        - "Merge Across from the arrow beside Merge & Center"
        - "Ctrl+1, Alignment tab, Horizontal set to Center Across Selection"
        - "Increase Indent until the title looks centred"

  - lab:
      eyebrow: Lab
      title: Exercise 1, formatted the way the exam wants it
      brief: >-
        Open the Exercise 1 workbook and format it under the rules of the graded route.
        The header block gets its font, fill, border and number format in one trip through
        Ctrl+1. Row 8 lends its format to rows 9 to 12 with a locked brush. The date
        column is filled from the Series dialog, not from the handle.
      blocks:
        - label: Deliverable
          text: The finished .xlsx on Blackboard, with the header block, rows 9 to 12 and the filled column done
        - label: Constraint
          text: No formatting applied from the Home tab except the number format, which is objective 2.2.5 and belongs there
        - label: The test
          text: Select the header block and press Ctrl+Z once. If more than one thing disappears, the route was right

  - takeaways:
      eyebrow: Summary
      title: Three things to take away
      items:
        - title: One dialog, one operation
          desc: >-
            Ctrl+1 carries font, fill, border and number format together, and a single
            Ctrl+Z is the proof that it did
        - title: Order matters on the Border tab
          desc: >-
            Style and Color first, edges second. Every other tab forgives the order and
            that one does not
        - title: The handle cannot be told to stop
          desc: >-
            A drag gives a linear step and nothing else. Growth, weekdays, a trend and a
            stop value are all inside Fill, Series

  - homework:
      eyebrow: Assignment
      title: Submission and grading criteria
      brief: >-
        Finish Exercise 1 and hand in the workbook. Somewhere in it, leave one cell
        formatted with something the ribbon cannot reach, a diagonal border, a pattern
        fill or a Shrink to fit, and say in a comment which one you used.
      meta:
        - [Due, Before week 3]
        - [Format, Blackboard · .xlsx file]
        - [Weight, Part of the 30 % inside midterm 1]
      rubric:
        - ["Format Cells", "40 %", "Font, fill, border and number format on the named ranges"]
        - ["Format Painter", "20 %", "Row 8 copied onto rows 9 to 12 in one locked pass"]
        - ["Styles and clearing", "20 %", "A named cell style applied, and Clear Formats used once"]
        - ["Fill", "20 %", "The series comes from the dialog, with a step that is not 1"]

  - closing:
      title: Questions
      subtitle: >-
        Next week the workbook grows, sheets, rows and columns, named ranges, and the
        reference types that decide whether a formula survives being filled.
      meta:
        - [Email, descobarc@up.edu.mx]
        - [Chat, Institutional Google Chat]
        - [Repository, github.com/davidowa/learning-hub]
