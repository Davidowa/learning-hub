- quiz:
    eyebrow: Comprobación
    question: Caja de 40 × 30 × 20 cm que pesa 3 kg, divisor volumétrico 5,000. ¿Peso facturable?
    options:
    - 3 kg.
    - 4.8 kg.
    - 24 kg.
    - 7.8 kg.
    notes: |-
      Caja de 40 × 30 × 20 cm que pesa 3 kg, divisor volumétrico 5,000. ¿Peso facturable? A) 3 kg. B) 4.8 kg (correcta). C) 24 kg. D) 7.8 kg. C olvida el divisor; D suma los dos pesos.
      Respuesta: B
