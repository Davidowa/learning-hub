    block: 3
- lab:
    eyebrow: Laboratorio
    title: 'Molienda · Pedido #1001'
    brief: 'Para Molienda: elige el modelo de fulfillment a tres volúmenes, calcula el peso facturable de tres cajas, escribe promesas de entrega desde Coatepec para CDMX, Guadalajara, Monterrey y Mérida, lleva el envío al estado de resultados del pedido #1001 y completa la ficha de evaluación de un proveedor logístico.'
    blocks:
    - label: Entrega
      text: Resultado y registro de evidencia.
    - label: Restricción
      text: Usa solo conceptos de esta sesión y anteriores.
    - label: Comprobación
      text: Otra persona debe poder reproducir el resultado.
    notes: 'Para Molienda: elige el modelo de fulfillment a tres volúmenes, calcula el peso facturable de tres cajas, escribe promesas de entrega desde Coatepec para CDMX, Guadalajara, Monterrey y Mérida, lleva el envío al estado de resultados del pedido #1001 y completa la ficha de evaluación de un proveedor logístico.'
