    statement: Declara unidad, periodo y supuestos antes de comparar resultados.
    points:
    - label: Dato
      text: Distingue registros de estimaciones.
    - label: Cálculo
      text: Conserva denominadores y unidades.
    - label: Decisión
      text: Indica qué acción cambia con la evidencia.
- quiz:
    eyebrow: Comprobación
    question: Se confirma un reembolso completo. ¿Qué registros debes conciliar?
    options:
    - Solo la foto del producto.
    - Pedido, pago, reembolso y documentos fiscales aplicables.
    - Solo clics de campaña.
    - Solo inventario actual.
    notes: |-
      Se confirma un reembolso completo. ¿Qué registros debes conciliar? A) Solo la foto del producto. B) Pedido, pago, reembolso y documentos fiscales aplicables (correcta). C) Solo clics de campaña. D) Solo inventario actual.
      Respuesta: B
