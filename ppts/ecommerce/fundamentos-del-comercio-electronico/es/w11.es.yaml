    block: 3
- lab:
    eyebrow: Laboratorio
    title: 'Molienda · Pedido #1001'
    brief: 'El escritorio de posventa de Molienda resuelve seis casos: un molino dañado, una molienda equivocada, un arrepentimiento al día 3, una factura pedida un mes después, el reembolso de un pedido facturado y una reseña que se queja de entrega tardía. Para cada uno: derecho del cliente, acción, costo y documento CFDI.'
    blocks:
    - label: Entrega
      text: Resultado y registro de evidencia.
    - label: Restricción
      text: Usa solo conceptos de esta sesión y anteriores.
    - label: Comprobación
      text: Otra persona debe poder reproducir el resultado.
    notes: 'El escritorio de posventa de Molienda resuelve seis casos: un molino dañado, una molienda equivocada, un arrepentimiento al día 3, una factura pedida un mes después, el reembolso de un pedido facturado y una reseña que se queja de entrega tardía. Para cada uno: derecho del cliente, acción, costo y documento CFDI.'
