- code:
    eyebrow: Caso Molienda
    title: Registro estructurado del caso
    filename: case-w13.json
    lang: json
    source: |
      {
        "event": "purchase",
        "transaction_id": "1001",
        "value": 2068,
        "currency": "MXN"
      }
    annotations:
    - label: Identidad
      text: Conserva identificadores estables.
    - label: Contrato
      text: Define campos, unidades y responsable.
    notes: Synthetic teaching record. This is a generic contract, not a vendor API implementation.
- quiz:
    eyebrow: Comprobación
    question: El evento purchase llega sin transaction_id. ¿Cuál es el riesgo?
    options:
    - Ninguno.
    - Recargar la página de agradecimiento cuenta la compra dos veces e infla los ingresos.
    - GA4 rechaza todos los eventos.
    - Al cliente no se le cobra.
    notes: |-
      El evento purchase llega sin transaction_id. ¿Cuál es el riesgo? A) Ninguno. B) Recargar la página de agradecimiento cuenta la compra dos veces e infla los ingresos (correcta). C) GA4 rechaza todos los eventos. D) Al cliente no se le cobra.
      Respuesta: B
