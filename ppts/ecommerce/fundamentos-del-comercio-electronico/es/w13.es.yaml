- lab:
    eyebrow: Laboratorio
    title: 'Molienda · Pedido #1001'
    brief: Explora la cuenta demo de GA4 (embudo y adquisición de tráfico por UTM). Escribe el plan de medición de Molienda y construye la tabla de conciliación que resuelve el acertijo de w12, incluido un evento de compra duplicado sembrado en los datos. Lab corto por la semana de examen.
    blocks:
    - label: Entrega
      text: Resultado y registro de evidencia.
    - label: Restricción
      text: Usa solo conceptos de esta sesión y anteriores.
    - label: Comprobación
      text: Otra persona debe poder reproducir el resultado.
    notes: Explora la cuenta demo de GA4 (embudo y adquisición de tráfico por UTM). Escribe el plan de medición de Molienda y construye la tabla de conciliación que resuelve el acertijo de w12, incluido un evento de compra duplicado sembrado en los datos. Lab corto por la semana de examen.
