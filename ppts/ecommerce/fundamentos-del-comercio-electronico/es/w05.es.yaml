- code:
    eyebrow: Caso Molienda
    title: Registro estructurado del caso
    filename: case-w05.json
    lang: json
    source: |
      {
        "sku": "CAF-MED-250-GRANO",
        "size_g": 250,
        "grind": "whole",
        "price": 289,
        "currency": "MXN",
        "taxes_included": true
      }
    annotations:
    - label: Identidad
      text: Conserva identificadores estables.
    - label: Contrato
      text: Define campos, unidades y responsable.
    notes: Synthetic teaching record. This is a generic contract, not a vendor API implementation.
- quiz:
    eyebrow: Comprobación
    question: Café en grano o molido, en 250 g o 1 kg. ¿Cuántos SKU por tueste?
    options:
    - '1.'
    - '2.'
    - '4.'
    - '6.'
    notes: |-
      Café en grano o molido, en 250 g o 1 kg. ¿Cuántos SKU por tueste? A) 1. B) 2. C) 4 (correcta). D) 6. B cuenta opciones en lugar de combinaciones; A confunde producto con SKU.
      Respuesta: C
- divider:
    eyebrow: Bloque 03
    title: Aplicación y evidencia
    lede: El caso termina en una decisión que puedes comprobar.
    block: 3
- lab:
    eyebrow: Laboratorio
    title: 'Molienda · Pedido #1001'
    brief: Construye el catálogo de Molienda (tres tuestes en grano o molido y en 250 g o 1 kg, más el molino y la suscripción) en una tabla de SKU con convención de nombres y GTIN de ejemplo; mapea un producto a dos taxonomías de canal y verifica línea por línea una descripción escrita con IA que trae tres errores sembrados.
    blocks:
    - label: Entrega
      text: Resultado y registro de evidencia.
    - label: Restricción
      text: Usa solo conceptos de esta sesión y anteriores.
    - label: Comprobación
      text: Otra persona debe poder reproducir el resultado.
    notes: Construye el catálogo de Molienda (tres tuestes en grano o molido y en 250 g o 1 kg, más el molino y la suscripción) en una tabla de SKU con convención de nombres y GTIN de ejemplo; mapea un producto a dos taxonomías de canal y verifica línea por línea una descripción escrita con IA que trae tres errores sembrados.
- homework:
    eyebrow: Tarea
    title: Aplicación al proyecto
    brief: Catálogo de 10 SKU del negocio del proyecto con convención de nombres y atributos, más un JSON de producto llenado desde la plantilla.
    meta:
    - - Entrega
      - Antes de la siguiente sesión
    - - Formato
      - Evidencia y explicación
    rubric:
    - - Concepto
      - 40 %
      - Uso correcto y supuestos claros
    - - Evidencia
      - 40 %
      - Resultado reproducible
    - - Decisión
      - 20 %
      - Justificación y límite
    notes: Catálogo de 10 SKU del negocio del proyecto con convención de nombres y atributos, más un JSON de producto llenado desde la plantilla.
