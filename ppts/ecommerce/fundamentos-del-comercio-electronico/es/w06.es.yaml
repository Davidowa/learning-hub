- table:
    eyebrow: Caso ilustrativo
    title: Datos para tomar una decisión
    headers:
    - Etapa
    - Entradas
    rows:
    - - Sesiones
      - 10,000
    - - Vistas de producto
      - 4,000
    - - Agregar al carrito
      - '600'
    - - Inicio de checkout
      - '300'
    - - Compras
      - '150'
    notes: 'All numbers are synthetic teaching inputs. No vendor fees or product tax classifications are asserted. Step losses: 60%, 85%, 50%, 50%. Overall conversion is 150/10000 = 1.5%. The largest relative leak is product view to cart.'
- method:
    eyebrow: Comprobación
    title: La decisión necesita una base explícita
    statement: Declara unidad, periodo y supuestos antes de comparar resultados.
    points:
    - label: Dato
      text: Distingue registros de estimaciones.
    - label: Cálculo
      text: Conserva denominadores y unidades.
    - label: Decisión
      text: Indica qué acción cambia con la evidencia.
- quiz:
    eyebrow: Comprobación
    question: 'Embudo: 10,000 sesiones, 4,000 vistas de producto, 600 carritos, 300 checkouts y 150 compras. ¿Dónde está la mayor fuga relativa?'
    options:
    - De sesión a vista de producto.
    - De vista de producto a carrito, con 85 % perdido.
    - De carrito a checkout.
    - De checkout a compra.
    notes: |-
      Embudo: 10,000 sesiones, 4,000 vistas de producto, 600 carritos, 300 checkouts y 150 compras. ¿Dónde está la mayor fuga relativa? A) De sesión a vista de producto. B) De vista de producto a carrito, con 85 % perdido (correcta). C) De carrito a checkout. D) De checkout a compra. A tiene la mayor caída absoluta, justo la confusión que mide la pregunta.
      Respuesta: B
- divider:
    eyebrow: Bloque 03
    title: Aplicación y evidencia
    lede: El caso termina en una decisión que puedes comprobar.
    block: 3
- lab:
    eyebrow: Laboratorio
    title: 'Molienda · Pedido #1001'
    brief: 'Desarma la página de producto para celular de Molienda (maqueta con defectos sembrados) con los datos de embudo dados: evaluación heurística, recorrido de accesibilidad con verificador y teclado, y una decisión escrita sobre qué paso arreglar primero y por qué.'
    blocks:
    - label: Entrega
      text: Resultado y registro de evidencia.
    - label: Restricción
      text: Usa solo conceptos de esta sesión y anteriores.
    - label: Comprobación
      text: Otra persona debe poder reproducir el resultado.
    notes: 'Desarma la página de producto para celular de Molienda (maqueta con defectos sembrados) con los datos de embudo dados: evaluación heurística, recorrido de accesibilidad con verificador y teclado, y una decisión escrita sobre qué paso arreglar primero y por qué.'
