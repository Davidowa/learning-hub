    lede: El caso termina en una decisión que puedes comprobar.
    block: 3
- lab:
    eyebrow: Laboratorio
    title: 'Molienda · Pedido #1001'
    brief: 'Clínica de entrevistas en parejas: convierte preguntas malas en buenas e intercambia con otra pareja para marcar las inductivas. Después, diseña la prueba de una semana para la suscripción de Molienda con el umbral fijado de antemano, por ejemplo al menos 20 depósitos reembolsables de 400 visitas, y escribe qué harías si no se alcanza.'
    blocks:
    - label: Entrega
      text: Resultado y registro de evidencia.
    - label: Restricción
      text: Usa solo conceptos de esta sesión y anteriores.
    - label: Comprobación
      text: Otra persona debe poder reproducir el resultado.
    notes: 'Clínica de entrevistas en parejas: convierte preguntas malas en buenas e intercambia con otra pareja para marcar las inductivas. Después, diseña la prueba de una semana para la suscripción de Molienda con el umbral fijado de antemano, por ejemplo al menos 20 depósitos reembolsables de 400 visitas, y escribe qué harías si no se alcanza.'
- homework:
    eyebrow: Tarea
    title: Aplicación al proyecto
    brief: Tres entrevistas reales para el negocio del proyecto, hallazgos ubicados en la escalera de evidencia y una propuesta de prueba con métrica, umbral y fecha de cierre.
    meta:
