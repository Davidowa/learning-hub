- quiz:
    eyebrow: Comprobación
    question: ¿Qué evidencia es más fuerte de que la gente pagará una suscripción de café?
    options:
    - El 80 % de 200 encuestados dice que se suscribiría.
    - 300 me gusta en la publicación del anuncio.
    - 25 personas pagan un depósito reembolsable de $100 MXN.
    - Tres dueños de cafeterías dicen que es gran idea.
    notes: |-
      ¿Qué evidencia es más fuerte de que la gente pagará una suscripción de café? A) El 80 % de 200 encuestados dice que se suscribiría. B) 300 me gusta en la publicación del anuncio. C) 25 personas pagan un depósito reembolsable de $100 MXN (correcta). D) Tres dueños de cafeterías dicen que es gran idea. A y D son lo que se dice; B es conducta, pero barata; solo C es compromiso.
      Respuesta: C
- divider:
