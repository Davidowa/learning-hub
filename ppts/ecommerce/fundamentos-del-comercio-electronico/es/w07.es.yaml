- quiz:
    eyebrow: Comprobación
    question: Una comisión hipotética es 3.5% más $4 sobre un pago de $2,068 MXN. ¿Cuánto cobra?
    options:
    - '4.'
    - 72.38.
    - 76.38.
    - 206.80.
    notes: |-
      Una comisión hipotética es 3.5% más $4 sobre un pago de $2,068 MXN. ¿Cuánto cobra? A) 4. B) 72.38. C) 76.38 (correcta). D) 206.80.
      Respuesta: C
