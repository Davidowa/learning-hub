- lab:
    eyebrow: Laboratorio
    title: 'Molienda · Pedido #1001'
    brief: La mezcla de pagos de Molienda
    blocks:
    - label: Entrega
      text: Resultado y registro de evidencia.
    - label: Restricción
      text: Usa solo conceptos de esta sesión y anteriores.
    - label: Comprobación
      text: Otra persona debe poder reproducir el resultado.
    notes: 'La mezcla de pagos de Molienda: con una tabla de segmentos (joven sin tarjeta de crédito, comprador de oficina que pide factura, cliente de molino) y una tabla de tarifas ilustrativa, elige métodos, calcula el costo de pago ponderado por pedido, llena la línea de pago del pedido #1001, decide si ofrecer MSI solo en molinos y completa la ficha de evaluación de un proveedor de pagos.'
