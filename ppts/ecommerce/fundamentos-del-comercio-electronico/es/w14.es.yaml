    points:
    - label: Dato
      text: Distingue registros de estimaciones.
    - label: Cálculo
      text: Conserva denominadores y unidades.
    - label: Decisión
      text: Indica qué acción cambia con la evidencia.
- quiz:
    eyebrow: Comprobación
    question: La suscripción se renueva sola cada mes. Con la reforma de diciembre de 2025, ¿qué debe hacer el proveedor?
    options:
    - Solo publicar los términos y condiciones.
    - Informar cargos, obtener consentimiento y permitir cancelación
    - Enviar un recibo después de cada cargo.
    - Pedir permiso a PROFECO.
    notes: |-
      La suscripción se renueva sola cada mes. Con la reforma de diciembre de 2025, ¿qué debe hacer el proveedor? A) Solo publicar los términos y condiciones. B) Informar con claridad el cargo recurrente, obtener consentimiento expreso, avisar antes de la renovación automática y permitir cancelar sin penalización (correcta). C) Enviar un recibo después de cada cargo. D) Pedir permiso a PROFECO.
      Respuesta: B
- divider:
    eyebrow: Bloque 03
    title: Aplicación y evidencia
    lede: El caso termina en una decisión que puedes comprobar.
    block: 3
- lab:
    eyebrow: Laboratorio
    title: 'Molienda · Pedido #1001'
    brief: Con una exportación de 12 meses de pedidos de Molienda (unas 500 filas) construye la tabla de cohortes, los segmentos RFM y el LTV. Después diseña en papel un flujo de suscripción que cumpla la ley.
    blocks:
    - label: Entrega
      text: Resultado y registro de evidencia.
    - label: Restricción
      text: Usa solo conceptos de esta sesión y anteriores.
    - label: Comprobación
      text: Otra persona debe poder reproducir el resultado.
    notes: Con una exportación de 12 meses de pedidos de Molienda (unas 500 filas) construye la tabla de cohortes, los segmentos RFM y el LTV. Después diseña en papel un flujo de suscripción que cumpla la ley.
