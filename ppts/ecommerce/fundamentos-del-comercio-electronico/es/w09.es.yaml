- code:
    eyebrow: Caso Molienda
    title: Registro estructurado del caso
    filename: case-w09.json
    lang: json
    source: |
      {
        "event_id": "evt-1001-paid",
        "type": "order.paid",
        "order_id": "1001",
        "amount": 2068,
        "currency": "MXN"
      }
    annotations:
    - label: Identidad
      text: Conserva identificadores estables.
    - label: Contrato
      text: Define campos, unidades y responsable.
    notes: Synthetic teaching record. This is a generic contract, not a vendor API implementation.
- quiz:
    eyebrow: Comprobación
    question: El webhook order.paid del pedido 1001 llega dos veces con el mismo event_id. ¿Qué debe pasar?
    options:
    - Dos envíos.
    - El sistema reconoce el evento y descarta la repetición.
    - Se cancela el pedido.
    - Se reembolsa un pago.
    notes: |-
      El webhook order.paid del pedido 1001 llega dos veces con el mismo event_id. ¿Qué debe pasar? A) Dos envíos. B) El sistema reconoce el evento y descarta la repetición (correcta). C) Se cancela el pedido. D) Se reembolsa un pago.
      Respuesta: B
- divider:
