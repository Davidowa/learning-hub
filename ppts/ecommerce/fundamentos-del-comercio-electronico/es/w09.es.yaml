    lede: El caso termina en una decisión que puedes comprobar.
    block: 3
- lab:
    eyebrow: Laboratorio
    title: 'Molienda · Pedido #1001'
    brief: 'El viaje del pedido #1001: una bitácora de eventos revuelta con un webhook duplicado y un conflicto de inventario entre la tienda y Mercado Libre. Reconstruye la historia del pedido en una tabla de traza, encuentra la sobreventa y decide qué hacer con tres pedidos sospechosos.'
    blocks:
    - label: Entrega
      text: Resultado y registro de evidencia.
    - label: Restricción
      text: Usa solo conceptos de esta sesión y anteriores.
    - label: Comprobación
      text: Otra persona debe poder reproducir el resultado.
    notes: 'El viaje del pedido #1001: una bitácora de eventos revuelta con un webhook duplicado y un conflicto de inventario entre la tienda y Mercado Libre. Reconstruye la historia del pedido en una tabla de traza, encuentra la sobreventa y decide qué hacer con tres pedidos sospechosos.'
