- divider:
    eyebrow: Bloque 02
    title: Caso Molienda
    lede: Datos ficticios para practicar una decisión verificable.
    block: 2
- table:
    eyebrow: Caso ilustrativo
    title: Datos para tomar una decisión
    headers:
    - Métrica
    - Valor ilustrativo
    rows:
    - - Gasto publicitario
      - 10,000
    - - Clientes adquiridos
      - '100'
    - - Ingreso atribuido
      - 40,000
    - - CAC
      - '100'
    - - ROAS
      - '4'
    notes: All numbers are synthetic teaching inputs. No vendor fees or product tax classifications are asserted. All amounts use the same net revenue basis. With a 25% contribution ratio before advertising, 40000*0.25 - 10000 = 0. This is the simple break-even model, not a lifetime-value model.
- method:
    eyebrow: Comprobación
    title: La decisión necesita una base explícita
    statement: Declara unidad, periodo y supuestos antes de comparar resultados.
    points:
    - label: Dato
      text: Distingue registros de estimaciones.
    - label: Cálculo
      text: Conserva denominadores y unidades.
    - label: Decisión
      text: Indica qué acción cambia con la evidencia.
- code:
    eyebrow: Caso Molienda
    title: Registro estructurado del caso
    filename: case-w12.json
    lang: json
    source: |
      {
        "utm_source": "newsletter",
        "utm_medium": "email",
        "utm_campaign": "coffee_october",
        "landing_path": "/coffee"
      }
    annotations:
    - label: Identidad
      text: Conserva identificadores estables.
    - label: Contrato
      text: Define campos, unidades y responsable.
    notes: Synthetic teaching record. This is a generic contract, not a vendor API implementation.
- quiz:
    eyebrow: Comprobación
    question: Margen de contribución de 25 %. ¿ROAS mínimo para no perder dinero en la campaña?
    options:
    - 1.25.
    - 2.5.
    - '4.'
    - '25.'
    notes: |-
      Margen de contribución de 25 %. ¿ROAS mínimo para no perder dinero en la campaña? A) 1.25. B) 2.5. C) 4 (correcta). D) 25.
      Respuesta: C
- divider:
    eyebrow: Bloque 03
    title: Aplicación y evidencia
    lede: El caso termina en una decisión que puedes comprobar.
    block: 3
- lab:
    eyebrow: Laboratorio
    title: 'Molienda · Pedido #1001'
    brief: 'La tabla de campañas de Molienda (Meta, Google, Mercado Ads y un creador): calcula CAC, ROAS y ROAS de equilibrio, reasigna el presupuesto, etiqueta tres enlaces y completa la ficha de evaluación de un canal de anuncios. Cierra con un acertijo abierto a propósito: Meta reporta 40 compras, la analítica 25 y la tienda 32. ¿Por qué? Se responde en w13.'
    blocks:
    - label: Entrega
      text: Resultado y registro de evidencia.
    - label: Restricción
      text: Usa solo conceptos de esta sesión y anteriores.
    - label: Comprobación
      text: Otra persona debe poder reproducir el resultado.
    notes: 'La tabla de campañas de Molienda (Meta, Google, Mercado Ads y un creador): calcula CAC, ROAS y ROAS de equilibrio, reasigna el presupuesto, etiqueta tres enlaces y completa la ficha de evaluación de un canal de anuncios. Cierra con un acertijo abierto a propósito: Meta reporta 40 compras, la analítica 25 y la tienda 32. ¿Por qué? Se responde en w13.'
