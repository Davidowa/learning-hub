- method:
    eyebrow: Comprobación
    title: La decisión necesita una base explícita
    statement: Declara unidad, periodo y supuestos antes de comparar resultados.
    points:
    - label: Dato
      text: Distingue registros de estimaciones.
    - label: Cálculo
      text: Conserva denominadores y unidades.
    - label: Decisión
      text: Indica qué acción cambia con la evidencia.
- quiz:
    eyebrow: Comprobación
    question: ¿Qué debe definirse antes de una prueba A/B?
    options:
    - Solo el color del botón.
    - Métrica principal, asignación y regla de cierre.
    - El ganador.
    - Terminar con el primer resultado favorable.
    notes: |-
      ¿Qué debe definirse antes de una prueba A/B? A) Solo el color del botón. B) Métrica principal, asignación y regla de cierre (correcta). C) El ganador. D) Terminar con el primer resultado favorable.
      Respuesta: B
- divider:
    eyebrow: Bloque 03
    title: Aplicación y evidencia
    lede: El caso termina en una decisión que puedes comprobar.
    block: 3
- lab:
    eyebrow: Laboratorio
    title: 'Molienda · Pedido #1001'
    brief: 'El checkout de siete pasos de Molienda, con unas 6,000 sesiones al mes: rediséñalo, escribe dos hipótesis y comprueba con la tabla de tamaños de muestra si una prueba A/B es factible. El hallazgo esperado es que solo los efectos grandes se detectan, así que primero va una prueba de usabilidad. Lab corto por la semana de examen.'
    blocks:
    - label: Entrega
      text: Resultado y registro de evidencia.
    - label: Restricción
      text: Usa solo conceptos de esta sesión y anteriores.
    - label: Comprobación
      text: Otra persona debe poder reproducir el resultado.
    notes: 'El checkout de siete pasos de Molienda, con unas 6,000 sesiones al mes: rediséñalo, escribe dos hipótesis y comprueba con la tabla de tamaños de muestra si una prueba A/B es factible. El hallazgo esperado es que solo los efectos grandes se detectan, así que primero va una prueba de usabilidad. Lab corto por la semana de examen.'
