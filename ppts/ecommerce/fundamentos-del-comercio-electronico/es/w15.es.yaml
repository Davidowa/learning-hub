- method:
    eyebrow: Comprobación
    title: La decisión necesita una base explícita
    statement: Declara unidad, periodo y supuestos antes de comparar resultados.
    points:
    - label: Dato
      text: Distingue registros de estimaciones.
    - label: Cálculo
      text: Conserva denominadores y unidades.
    - label: Decisión
      text: Indica qué acción cambia con la evidencia.
- quiz:
    eyebrow: Comprobación
    question: La tienda muestra 'Solo quedan 2' en todos los productos, sin importar el inventario. ¿Qué es?
    options:
    - Prueba social.
    - Marketing de escasez legítimo.
    - 'Escasez falsa: un patrón engañoso y publicidad engañosa.'
    - Personalización.
    notes: |-
      La tienda muestra 'Solo quedan 2' en todos los productos, sin importar el inventario. ¿Qué es? A) Prueba social. B) Marketing de escasez legítimo. C) Escasez falsa: un patrón engañoso y publicidad engañosa (correcta). D) Personalización.
      Respuesta: C
- divider:
    eyebrow: Bloque 03
    title: Aplicación y evidencia
    lede: El caso termina en una decisión que puedes comprobar.
    block: 3
- lab:
    eyebrow: Laboratorio
    title: 'Molienda · Pedido #1001'
    brief: 'Auditoría legal de Molienda: quince capturas (checkout, banner de cookies, flujo de suscripción, página de producto, aviso de privacidad). Encuentra las violaciones y los patrones engañosos, reescribe cada uno y redacta los elementos del aviso de privacidad.'
    blocks:
    - label: Entrega
      text: Resultado y registro de evidencia.
    - label: Restricción
      text: Usa solo conceptos de esta sesión y anteriores.
    - label: Comprobación
      text: Otra persona debe poder reproducir el resultado.
    notes: 'Auditoría legal de Molienda: quince capturas (checkout, banner de cookies, flujo de suscripción, página de producto, aviso de privacidad). Encuentra las violaciones y los patrones engañosos, reescribe cada uno y redacta los elementos del aviso de privacidad.'
- homework:
    eyebrow: Tarea
    title: Aplicación al proyecto
    brief: 'Para el reporte final del proyecto: lista de verificación de cumplimiento, borrador de aviso de privacidad y autoauditoría de patrones engañosos. Es un ejercicio académico, no asesoría legal.'
    meta:
    - - Entrega
      - Antes de la siguiente sesión
    - - Formato
      - Evidencia y explicación
    rubric:
    - - Concepto
      - 40 %
      - Uso correcto y supuestos claros
    - - Evidencia
      - 40 %
      - Resultado reproducible
    - - Decisión
      - 20 %
      - Justificación y límite
    notes: 'Para el reporte final del proyecto: lista de verificación de cumplimiento, borrador de aviso de privacidad y autoauditoría de patrones engañosos. Es un ejercicio académico, no asesoría legal.'
