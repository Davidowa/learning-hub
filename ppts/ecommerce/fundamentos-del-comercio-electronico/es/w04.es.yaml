- table:
    eyebrow: Caso ilustrativo
    title: Datos para tomar una decisión
    headers:
    - Pedidos
    - Marketplace
    - Tienda propia
    rows:
    - - '10'
      - '750'
      - 1,650
    - - '25'
      - 1,875
      - 1,875
    - - '50'
      - 3,750
      - 2,250
    notes: 'All numbers are synthetic teaching inputs. No vendor fees or product tax classifications are asserted. Illustrative fees: marketplace 15% of a 500 order; own store 1500 fixed monthly plus 3% of each 500 order. Equality is at 25 orders. Acquisition costs are omitted from this fee-only comparison.'
- method:
    eyebrow: Comprobación
    title: La decisión necesita una base explícita
    statement: Declara unidad, periodo y supuestos antes de comparar resultados.
    points:
    - label: Dato
      text: Distingue registros de estimaciones.
    - label: Cálculo
      text: Conserva denominadores y unidades.
    - label: Decisión
      text: Indica qué acción cambia con la evidencia.
- quiz:
    eyebrow: Comprobación
    question: 'Marketplace: 15 % de comisión con ticket de $500. Tienda SaaS: $1,500 al mes más 3 % por pago. ¿Desde cuántos pedidos al mes conviene la tienda?'
    options:
    - '10.'
    - '25.'
    - '60.'
    - '100.'
    notes: |-
      Marketplace: 15 % de comisión con ticket de $500. Tienda SaaS: $1,500 al mes más 3 % por pago. ¿Desde cuántos pedidos al mes conviene la tienda? A) 10. B) 25 (correcta: 75n = 1,500 + 15n). C) 60. D) 100. Pregunta abierta de seguimiento: ¿por qué el vendedor podría quedarse en el marketplace de todos modos? Porque le da tráfico que la tienda tendría que comprar; prepara el CAC de w12.
      Respuesta: B
- divider:
    eyebrow: Bloque 03
    title: Aplicación y evidencia
    lede: El caso termina en una decisión que puedes comprobar.
    block: 3
- lab:
    eyebrow: Laboratorio
    title: 'Molienda · Pedido #1001'
    brief: 'Tres caminos para Molienda: con una tabla de tarifas ilustrativa, calcula el costo mensual a 50, 300 y 2,000 pedidos para solo marketplace, tienda SaaS y código abierto. Grafica el punto de cruce, llena la línea de comisión del estado de resultados del pedido #1001 y completa la ficha de evaluación de la opción elegida, con plan de salida a 90 días.'
    blocks:
    - label: Entrega
      text: Resultado y registro de evidencia.
    - label: Restricción
      text: Usa solo conceptos de esta sesión y anteriores.
    - label: Comprobación
      text: Otra persona debe poder reproducir el resultado.
    notes: 'Tres caminos para Molienda: con una tabla de tarifas ilustrativa, calcula el costo mensual a 50, 300 y 2,000 pedidos para solo marketplace, tienda SaaS y código abierto. Grafica el punto de cruce, llena la línea de comisión del estado de resultados del pedido #1001 y completa la ficha de evaluación de la opción elegida, con plan de salida a 90 días.'
