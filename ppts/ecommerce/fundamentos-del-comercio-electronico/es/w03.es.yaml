- table:
    eyebrow: Caso ilustrativo
    title: Datos para tomar una decisión
    headers:
    - Concepto
    - MXN ilustrativos
    rows:
    - - Ingreso neto
      - 1,862.48
    - - Costo de producto
      - 1,140.00
    - - Costo de pago
      - '76.38'
    - - Otros costos variables
      - '148.00'
    - - Contribución
      - '498.10'
    notes: All numbers are synthetic teaching inputs. No vendor fees or product tax classifications are asserted. The supplied tax assumptions are 0% on two bags at 289 and 16% included in a grinder at 1490. Net revenue = 578 + 1490/1.16. Payment cost = 2068*0.035+4. Other variable costs = 28+90+30. Round the final contribution to 2 decimals.
- method:
    eyebrow: Comprobación
    title: La decisión necesita una base explícita
    statement: Declara unidad, periodo y supuestos antes de comparar resultados.
    points:
    - label: Dato
      text: Distingue registros de estimaciones.
    - label: Cálculo
      text: Conserva denominadores y unidades.
    - label: Decisión
      text: Indica qué acción cambia con la evidencia.
- quiz:
    eyebrow: Comprobación
    question: Compras en $100 y vendes en $150, sin impuestos. ¿Margen bruto y markup?
    options:
    - 50 % y 50 %.
    - 33 % y 50 %.
    - 50 % y 33 %.
    - 33 % y 33 %.
    notes: |-
      Compras en $100 y vendes en $150, sin impuestos. ¿Margen bruto y markup? A) 50 % y 50 %. B) 33 % y 50 % (correcta). C) 50 % y 33 %. D) 33 % y 33 %. Confundir margen con markup es el error clásico.
      Respuesta: B
- divider:
    eyebrow: Bloque 03
    title: Aplicación y evidencia
    lede: El caso termina en una decisión que puedes comprobar.
    block: 3
- lab:
    eyebrow: Laboratorio
    title: 'Molienda · Pedido #1001'
    brief: 'En hoja de cálculo, el estado de resultados de tres canastas de Molienda: una bolsa de 250 g, el pedido #1001 (dos bolsas de 250 g a $289 y un molino de $1,490, total $2,068 MXN) y un mes de suscripción'
    blocks:
    - label: Entrega
      text: Resultado y registro de evidencia.
    - label: Restricción
      text: Usa solo conceptos de esta sesión y anteriores.
    - label: Comprobación
      text: Otra persona debe poder reproducir el resultado.
    notes: 'En hoja de cálculo, el estado de resultados de tres canastas de Molienda: una bolsa de 250 g, el pedido #1001 (dos bolsas de 250 g a $289 y un molino de $1,490, total $2,068 MXN) y un mes de suscripción. Las líneas de comisión, pago y envío quedan marcadas para llenarse en w04, w07 y w10 con valores ilustrativos de hoy. Encuentra la canasta que pierde dinero, propón un ajuste (umbral, paquete o precio) y pruébalo con números.'
