    lede: El caso termina en una decisión que puedes comprobar.
    block: 3
- lab:
    eyebrow: Laboratorio
    title: 'Molienda · Pedido #1001'
    brief: 'Mapa de 10 negocios: los equipos colocan diez tarjetas de negocios en una cuadrícula de modelo por canal y responden las cinco preguntas de control de cada uno. Cierran proponiendo dos posiciones de canal para Molienda y escribiendo, en una línea cada una, qué control les cuesta.'
    blocks:
    - label: Entrega
      text: Resultado y registro de evidencia.
    - label: Restricción
      text: Usa solo conceptos de esta sesión y anteriores.
    - label: Comprobación
      text: Otra persona debe poder reproducir el resultado.
    notes: 'Mapa de 10 negocios: los equipos colocan diez tarjetas de negocios en una cuadrícula de modelo por canal y responden las cinco preguntas de control de cada uno. Cierran proponiendo dos posiciones de canal para Molienda y escribiendo, en una línea cada una, qué control les cuesta.'
- homework:
    eyebrow: Tarea
    title: Aplicación al proyecto
    brief: 'Forma tu equipo y elige el negocio del proyecto (micro o pequeño negocio real cuyo dueño acepte responder preguntas, producto propio o uno de los tres casos de respaldo). Entrega una página: sus canales actuales, las cinco preguntas de control de cada uno y una compra tuya rastreada por los cinco trabajos.'
    meta:
    - - Entrega
      - Antes de la siguiente sesión
    - - Formato
      - Evidencia y explicación
    rubric:
    - - Concepto
      - 40 %
      - Uso correcto y supuestos claros
    - - Evidencia
      - 40 %
      - Resultado reproducible
    - - Decisión
      - 20 %
      - Justificación y límite
    notes: 'Forma tu equipo y elige el negocio del proyecto (micro o pequeño negocio real cuyo dueño acepte responder preguntas, producto propio o uno de los tres casos de respaldo). Entrega una página: sus canales actuales, las cinco preguntas de control de cada uno y una compra tuya rastreada por los cinco trabajos.'
