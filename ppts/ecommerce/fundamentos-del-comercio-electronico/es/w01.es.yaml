    - label: Dato
      text: Distingue registros de estimaciones.
    - label: Cálculo
      text: Conserva denominadores y unidades.
    - label: Decisión
      text: Indica qué acción cambia con la evidencia.
- quiz:
    eyebrow: Comprobación
    question: Una marca de tenis vende en su tienda propia y en Mercado Libre. ¿Qué cambia entre los dos?
    options:
    - El modelo pasa de B2C a C2C.
    - El canal y el control asignado a sus participantes
    - Nada, es el mismo cliente.
    - En Mercado Libre la marca ya no responde por la garantía.
    notes: |-
      Una marca de tenis vende en su tienda propia y en Mercado Libre. ¿Qué cambia entre los dos? A) El modelo pasa de B2C a C2C. B) El canal: en el marketplace la plataforma controla el ranking, el cobro y parte de los datos del cliente (correcta). C) Nada, es el mismo cliente. D) En Mercado Libre la marca ya no responde por la garantía. A confunde modelo con canal; D es un error legal que se corrige en w11.
      Respuesta: B
- divider:
