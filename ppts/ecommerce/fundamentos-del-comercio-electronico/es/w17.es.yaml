- quiz:
    eyebrow: Comprobación
    question: En Buen Fin la conversión de Molienda subió, el ticket bajó y la contribución por pedido cayó. ¿Qué revisas primero?
    options:
    - El diseño de la página de inicio.
    - Contribución por pedido y método de pago
    - El número de sesiones.
    - El posicionamiento en buscadores.
    notes: |-
      En Buen Fin la conversión de Molienda subió, el ticket bajó y la contribución por pedido cayó. ¿Qué revisas primero? A) El diseño de la página de inicio. B) La contribución por pedido y por método de pago, porque los descuentos y los MSI pudieron atraer pedidos de bajo margen (correcta). C) El número de sesiones. D) El posicionamiento en buscadores.
      Respuesta: B
