- method:
    eyebrow: Comprobación
    title: La decisión necesita una base explícita
    statement: Declara unidad, periodo y supuestos antes de comparar resultados.
    points:
    - label: Dato
      text: Distingue registros de estimaciones.
    - label: Cálculo
      text: Conserva denominadores y unidades.
    - label: Decisión
      text: Indica qué acción cambia con la evidencia.
- quiz:
    eyebrow: Comprobación
    question: Un proveedor asegura que su agente de IA 'sube las ventas 40 %'. ¿Qué evidencia basta para adoptarlo?
    options:
    - El caso de estudio del proveedor.
    - Tres testimonios.
    - Una prueba con nuestro propio tráfico, con métrica y regla de paro fijadas antes.
    - El número de empresas que lo usan.
    notes: |-
      Un proveedor asegura que su agente de IA 'sube las ventas 40 %'. ¿Qué evidencia basta para adoptarlo? A) El caso de estudio del proveedor. B) Tres testimonios. C) Una prueba con nuestro propio tráfico, con métrica y regla de paro fijadas antes (correcta). D) El número de empresas que lo usan.
      Respuesta: C
- divider:
    eyebrow: Bloque 03
    title: Aplicación y evidencia
    lede: El caso termina en una decisión que puedes comprobar.
    block: 3
- lab:
    eyebrow: Laboratorio
    title: 'Molienda · Pedido #1001'
    brief: 'Lab corto: cada equipo saca una tarjeta de tendencia (checkout dentro de un asistente, transmisiones en vivo, publicidad de marketplaces, llaves de acceso, marketplaces sociales) y produce para Molienda una ficha de evaluación y un plan piloto. Después vienen las presentaciones del proyecto.'
    blocks:
    - label: Entrega
      text: Resultado y registro de evidencia.
    - label: Restricción
      text: Usa solo conceptos de esta sesión y anteriores.
    - label: Comprobación
      text: Otra persona debe poder reproducir el resultado.
    notes: 'Lab corto: cada equipo saca una tarjeta de tendencia (checkout dentro de un asistente, transmisiones en vivo, publicidad de marketplaces, llaves de acceso, marketplaces sociales) y produce para Molienda una ficha de evaluación y un plan piloto. Después vienen las presentaciones del proyecto.'
