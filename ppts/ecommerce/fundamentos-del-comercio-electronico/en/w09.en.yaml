- method:
    eyebrow: Check
    title: The decision needs an explicit basis
    statement: State the unit, period and assumptions before comparing results.
    points:
    - label: Data
      text: Distinguish records from estimates.
    - label: Calculation
      text: Keep denominators and units.
    - label: Decision
      text: State which action changes with the evidence.
- code:
    eyebrow: Molienda case
    title: Structured case record
    filename: case-w09.json
    lang: json
    source: |
      {
        "event_id": "evt-1001-paid",
        "type": "order.paid",
        "order_id": "1001",
        "amount": 2068,
        "currency": "MXN"
      }
    annotations:
    - label: Identity
      text: Keep identifiers stable.
    - label: Contract
      text: Define fields, units and owner.
    notes: Synthetic teaching record. This is a generic contract, not a vendor API implementation.
- quiz:
    eyebrow: Quick check
    question: The order.paid webhook for order 1001 arrives twice with the same event_id. What should happen?
    options:
    - Two shipments.
    - The system recognizes the event and ignores the repeat.
    - The order is canceled.
    - One payment is refunded.
    notes: |-
      The order.paid webhook for order 1001 arrives twice with the same event_id. What should happen? A) Two shipments. B) The system recognizes the event and ignores the repeat (correct). C) The order is canceled. D) One payment is refunded.
      Answer: B
- divider:
    eyebrow: Block 03
    title: Application and evidence
    lede: The case ends in a decision that can be checked.
    block: 3
- lab:
    eyebrow: Lab
    title: 'Molienda · Order #1001'
    brief: 'The history of order #1001: a shuffled event log with a duplicate webhook and a stock conflict between the store and Mercado Libre. Rebuild the order''s history in a trace table, find the oversell and decide what to do with three suspicious orders.'
    blocks:
    - label: Submission
      text: Result and evidence record.
    - label: Constraint
      text: Use only this session and earlier concepts.
    - label: Check
      text: Another person must be able to reproduce the result.
    notes: 'The history of order #1001: a shuffled event log with a duplicate webhook and a stock conflict between the store and Mercado Libre. Rebuild the order''s history in a trace table, find the oversell and decide what to do with three suspicious orders.'
- homework:
    eyebrow: Homework
    title: Apply to the project
    brief: The project's order lifecycle diagram, inventory policy and five fraud rules with the estimated cost of their false positives (part of Checkpoint 2).
    meta:
