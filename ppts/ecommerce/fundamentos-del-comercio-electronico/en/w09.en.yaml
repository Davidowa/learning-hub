      - Before the next session
    - - Format
      - Evidence and explanation
    rubric:
    - - Concept
      - 40 %
      - Correct use and clear assumptions
    - - Evidence
      - 40 %
      - Reproducible result
    - - Decision
      - 20 %
      - Rationale and limit
    notes: The project's order lifecycle diagram, inventory policy and five fraud rules with the estimated cost of their false positives (part of Checkpoint 2).
