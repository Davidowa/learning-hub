- objectives:
    eyebrow: Objectives
    title: By the end of the session you will be able to…
    items:
    - head: Explain order states
      sub: Track payment and fulfillment separately. A refunded payment and a returned parcel describe different parts of the same order.
    - head: Explain available inventory
      sub: Available stock equals on-hand stock minus reservations and safety stock
    - head: Explain duplicate events
      sub: Store a stable event identifier and handle a repeated notification without repeating its business effect
    - head: Justify a decision with evidence
      sub: Apply the case and state its assumptions.
