- table:
    eyebrow: Illustrative case
    title: Data for a decision
    headers:
    - Process
    - Data
    - Check
    rows:
    - - Order delivery
      - Address
      - Delivery purpose
    - - Promotional contact
      - Email
      - Separate purpose
    - - Access control
      - Staff account
      - Role permissions
    notes: 'All numbers are synthetic teaching inputs. No vendor fees or product tax classifications are asserted. '
- method:
    eyebrow: Check
    title: The decision needs an explicit basis
    statement: State the unit, period and assumptions before comparing results.
    points:
    - label: Data
      text: Distinguish records from estimates.
    - label: Calculation
      text: Keep denominators and units.
    - label: Decision
      text: State which action changes with the evidence.
- quiz:
    eyebrow: Quick check
    question: The store shows 'Only 2 left' on every product regardless of stock. What is it?
    options:
    - Social proof.
    - Legitimate scarcity marketing.
    - 'Fake scarcity: a deceptive pattern and misleading advertising.'
    - Personalization.
    notes: |-
      The store shows 'Only 2 left' on every product regardless of stock. What is it? A) Social proof. B) Legitimate scarcity marketing. C) Fake scarcity: a deceptive pattern and misleading advertising (correct). D) Personalization.
      Answer: C
- divider:
    eyebrow: Block 03
    title: Application and evidence
    lede: The case ends in a decision that can be checked.
    block: 3
- lab:
    eyebrow: Lab
    title: 'Molienda · Order #1001'
    brief: 'Molienda legal audit: fifteen screenshots (checkout, cookie banner, subscription flow, product page, privacy notice). Find the violations and deceptive patterns, rewrite each one and draft the elements of the privacy notice.'
    blocks:
    - label: Submission
      text: Result and evidence record.
    - label: Constraint
      text: Use only this session and earlier concepts.
    - label: Check
      text: Another person must be able to reproduce the result.
    notes: 'Molienda legal audit: fifteen screenshots (checkout, cookie banner, subscription flow, product page, privacy notice). Find the violations and deceptive patterns, rewrite each one and draft the elements of the privacy notice.'
- homework:
    eyebrow: Homework
    title: Apply to the project
    brief: 'For the final project report: compliance checklist, draft privacy notice and a deceptive-design self-audit. This is an academic exercise, not legal advice.'
    meta:
