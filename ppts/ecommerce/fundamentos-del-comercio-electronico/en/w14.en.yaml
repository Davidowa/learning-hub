- lab:
    eyebrow: Lab
    title: 'Molienda · Order #1001'
    brief: From a 12-month export of Molienda orders (about 500 rows), build the cohort table, RFM segments and LTV. Then design, on paper, a subscription flow that complies with the law.
    blocks:
    - label: Submission
      text: Result and evidence record.
    - label: Constraint
      text: Use only this session and earlier concepts.
    - label: Check
      text: Another person must be able to reproduce the result.
    notes: From a 12-month export of Molienda orders (about 500 rows), build the cohort table, RFM segments and LTV. Then design, on paper, a subscription flow that complies with the law.
