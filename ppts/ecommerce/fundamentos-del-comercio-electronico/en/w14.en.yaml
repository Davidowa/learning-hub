- quiz:
    eyebrow: Quick check
    question: The subscription renews itself every month. Under the December 2025 reform, what must the provider do?
    options:
    - Nothing beyond the terms and conditions.
    - Disclose charges, obtain consent and enable timely cancellation
    - Email a receipt after each charge.
    - Ask PROFECO for permission.
    notes: |-
      The subscription renews itself every month. Under the December 2025 reform, what must the provider do? A) Nothing beyond the terms and conditions. B) Disclose the recurring charge clearly, obtain express consent, give notice before automatic renewal and allow cancellation without penalty (correct). C) Email a receipt after each charge. D) Ask PROFECO for permission.
      Answer: B
