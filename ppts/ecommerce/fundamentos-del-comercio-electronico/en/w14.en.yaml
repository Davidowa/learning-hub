    eyebrow: Objectives
    title: By the end of the session you will be able to…
    items:
    - head: Explain cohort retention
      sub: Compare customers who began in the same period and have equal opportunity to return. A young cohort has less observation time.
    - head: Explain customer contribution
      sub: Estimate value from contribution over observed or modeled purchases
    - head: Explain lifecycle messages
      sub: Match each message to a customer need and an allowed contact purpose. Provide a working way to stop promotional messages.
    - head: Justify a decision with evidence
      sub: Apply the case and state its assumptions.
