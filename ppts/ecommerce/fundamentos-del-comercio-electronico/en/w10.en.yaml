- objectives:
    eyebrow: Objectives
    title: By the end of the session you will be able to…
    items:
    - head: Explain fulfillment flow
      sub: Receive, store, pick, pack and ship with a check at each handoff. A delivery promise depends on capacity and cutoff times.
    - head: Explain billable weight
      sub: Compare physical weight with dimensional weight under the carrier agreement. The exercise supplies dimensions, divisor and rounding rules.
    - head: Explain delivery recovery
      sub: Define who handles a failed delivery, damaged parcel and missing tracking update. Include these costs in the order calculation.
    - head: Justify a decision with evidence
      sub: Apply the case and state its assumptions.
