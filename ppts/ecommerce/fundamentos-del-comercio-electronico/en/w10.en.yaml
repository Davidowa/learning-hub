- lab:
    eyebrow: Lab
    title: 'Molienda · Order #1001'
    brief: 'For Molienda: choose a fulfillment model at three volumes, compute the billable weight of three boxes, write delivery promises from Coatepec to Mexico City, Guadalajara, Monterrey and Mérida, carry shipping into order #1001''s P&L and complete a tool card for one logistics provider.'
    blocks:
    - label: Submission
      text: Result and evidence record.
    - label: Constraint
      text: Use only this session and earlier concepts.
    - label: Check
      text: Another person must be able to reproduce the result.
    notes: 'For Molienda: choose a fulfillment model at three volumes, compute the billable weight of three boxes, write delivery promises from Coatepec to Mexico City, Guadalajara, Monterrey and Mérida, carry shipping into order #1001''s P&L and complete a tool card for one logistics provider.'
