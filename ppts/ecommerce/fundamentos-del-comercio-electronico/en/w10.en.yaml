- quiz:
    eyebrow: Quick check
    question: A 40 × 30 × 20 cm box weighs 3 kg, with a dimensional divisor of 5,000. Billable weight?
    options:
    - 3 kg.
    - 4.8 kg.
    - 24 kg.
    - 7.8 kg.
    notes: |-
      A 40 × 30 × 20 cm box weighs 3 kg, with a dimensional divisor of 5,000. Billable weight? A) 3 kg. B) 4.8 kg (correct). C) 24 kg. D) 7.8 kg. C forgets the divisor; D adds the two weights.
      Answer: B
