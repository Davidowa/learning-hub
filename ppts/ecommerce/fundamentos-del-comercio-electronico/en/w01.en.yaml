- quiz:
    eyebrow: Quick check
    question: A sneaker brand sells in its own store and on Mercado Libre. What changes between the two?
    options:
    - The model goes from B2C to C2C.
    - The channel and the control assigned to its participants
    - Nothing, it is the same customer.
    - On Mercado Libre the brand no longer answers for the warranty.
    notes: |-
      A sneaker brand sells in its own store and on Mercado Libre. What changes between the two? A) The model goes from B2C to C2C. B) The channel: on the marketplace the platform controls ranking, payment and part of the customer data (correct). C) Nothing, it is the same customer. D) On Mercado Libre the brand no longer answers for the warranty. A confuses model with channel; D is a legal misconception corrected in w11.
      Answer: B
