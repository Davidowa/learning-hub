    - label: Check
      text: Another person must be able to reproduce the result.
    notes: 'Ten-business map: teams place ten business cards on a model-by-channel grid and answer the five control questions for each. They close by proposing two channel positions for Molienda and writing, in one line each, what control each one costs.'
