- lab:
    eyebrow: Lab
    title: 'Molienda · Order #1001'
    brief: 'In a spreadsheet, the P&L of three Molienda baskets: one 250 g bag, order #1001 (two 250 g bags at $289 and one grinder at $1,490, total $2,068 MXN) and one subscription month'
    blocks:
    - label: Submission
      text: Result and evidence record.
    - label: Constraint
      text: Use only this session and earlier concepts.
    - label: Check
      text: Another person must be able to reproduce the result.
    notes: 'In a spreadsheet, the P&L of three Molienda baskets: one 250 g bag, order #1001 (two 250 g bags at $289 and one grinder at $1,490, total $2,068 MXN) and one subscription month. The commission, payment and shipping lines are flagged to be filled in w04, w07 and w10, using today''s illustrative values for now. Find the basket that loses money, propose one fix (threshold, bundle or price) and test it with numbers.'
