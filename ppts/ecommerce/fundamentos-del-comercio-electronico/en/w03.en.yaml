- objectives:
    eyebrow: Objectives
    title: By the end of the session you will be able to…
    items:
    - head: Explain revenue basis
      sub: Separate the customer total from revenue net of taxes. The exercise supplies tax assumptions for each product.
    - head: Explain margin and markup
      sub: Gross margin divides gross profit by revenue. Markup divides the same gross profit by cost. Their denominators differ.
    - head: Explain order contribution
      sub: Subtract product cost and all variable order costs from net revenue. A positive gross margin can coexist with a negative order contribution.
    - head: Justify a decision with evidence
      sub: Apply the case and state its assumptions.
