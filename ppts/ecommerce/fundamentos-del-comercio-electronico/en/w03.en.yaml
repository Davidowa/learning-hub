    lede: Fictional data for practicing a verifiable decision.
    block: 2
- table:
    eyebrow: Illustrative case
    title: Data for a decision
    headers:
    - Item
    - Illustrative MXN
    rows:
    - - Net revenue
      - 1,862.48
    - - Product cost
      - 1,140.00
    - - Payment cost
      - '76.38'
    - - Other variable costs
      - '148.00'
    - - Contribution
      - '498.10'
    notes: All numbers are synthetic teaching inputs. No vendor fees or product tax classifications are asserted. The supplied tax assumptions are 0% on two bags at 289 and 16% included in a grinder at 1490. Net revenue = 578 + 1490/1.16. Payment cost = 2068*0.035+4. Other variable costs = 28+90+30. Round the final contribution to 2 decimals.
- method:
    eyebrow: Check
    title: The decision needs an explicit basis
    statement: State the unit, period and assumptions before comparing results.
    points:
    - label: Data
      text: Distinguish records from estimates.
    - label: Calculation
      text: Keep denominators and units.
    - label: Decision
      text: State which action changes with the evidence.
- quiz:
    eyebrow: Quick check
    question: You buy at $100 and sell at $150, with no taxes. Gross margin and markup?
    options:
    - 50 % and 50 %.
    - 33 % and 50 %.
    - 50 % and 33 %.
    - 33 % and 33 %.
    notes: |-
      You buy at $100 and sell at $150, with no taxes. Gross margin and markup? A) 50 % and 50 %. B) 33 % and 50 % (correct). C) 50 % and 33 %. D) 33 % and 33 %. Swapping margin and markup is the classic error.
      Answer: B
