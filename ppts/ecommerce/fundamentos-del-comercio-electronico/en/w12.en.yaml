- lab:
    eyebrow: Lab
    title: 'Molienda · Order #1001'
    brief: 'Molienda''s campaign table (Meta, Google, Mercado Ads and one creator): compute CAC, ROAS and break-even ROAS, reallocate the budget, tag three links and complete a tool card for one ad channel. It closes with a puzzle left open on purpose: Meta reports 40 purchases, analytics 25 and the store 32. Why? Answered in w13.'
    blocks:
    - label: Submission
      text: Result and evidence record.
    - label: Constraint
      text: Use only this session and earlier concepts.
    - label: Check
      text: Another person must be able to reproduce the result.
    notes: 'Molienda''s campaign table (Meta, Google, Mercado Ads and one creator): compute CAC, ROAS and break-even ROAS, reallocate the budget, tag three links and complete a tool card for one ad channel. It closes with a puzzle left open on purpose: Meta reports 40 purchases, analytics 25 and the store 32. Why? Answered in w13.'
- homework:
