- divider:
    eyebrow: Block 02
    title: The Molienda case
    lede: Fictional data for practicing a verifiable decision.
    block: 2
- table:
    eyebrow: Illustrative case
    title: Data for a decision
    headers:
    - Metric
    - Illustrative value
    rows:
    - - Advertising spend
      - 10,000
    - - Acquired customers
      - '100'
    - - Attributed revenue
      - 40,000
    - - CAC
      - '100'
    - - ROAS
      - '4'
    notes: All numbers are synthetic teaching inputs. No vendor fees or product tax classifications are asserted. All amounts use the same net revenue basis. With a 25% contribution ratio before advertising, 40000*0.25 - 10000 = 0. This is the simple break-even model, not a lifetime-value model.
- method:
    eyebrow: Check
    title: The decision needs an explicit basis
    statement: State the unit, period and assumptions before comparing results.
    points:
    - label: Data
      text: Distinguish records from estimates.
    - label: Calculation
      text: Keep denominators and units.
    - label: Decision
      text: State which action changes with the evidence.
- code:
    eyebrow: Molienda case
    title: Structured case record
    filename: case-w12.json
    lang: json
    source: |
      {
        "utm_source": "newsletter",
        "utm_medium": "email",
        "utm_campaign": "coffee_october",
        "landing_path": "/coffee"
      }
    annotations:
    - label: Identity
      text: Keep identifiers stable.
    - label: Contract
      text: Define fields, units and owner.
    notes: Synthetic teaching record. This is a generic contract, not a vendor API implementation.
- quiz:
    eyebrow: Quick check
    question: Contribution margin of 25 %. Minimum ROAS for the campaign not to lose money?
    options:
    - 1.25.
    - 2.5.
    - '4.'
    - '25.'
    notes: |-
      Contribution margin of 25 %. Minimum ROAS for the campaign not to lose money? A) 1.25. B) 2.5. C) 4 (correct). D) 25.
      Answer: C
