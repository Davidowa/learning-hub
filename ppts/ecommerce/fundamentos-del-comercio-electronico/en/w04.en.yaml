    - head: Explain total ownership cost
      sub: Include subscription, hosting, integration, support, updates and exit costs over a defined period. A low entry price can hide later work.
    - head: Explain platform control
      sub: Compare control over data, prices, policies and customer relationships. Renting software and renting an audience solve different needs.
    - head: Explain integration and exit
      sub: Define how product, order and customer records enter and leave the platform. Test an export before depending on a vendor.
    - head: Justify a decision with evidence
      sub: Apply the case and state its assumptions.
