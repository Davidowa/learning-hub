    lede: The case ends in a decision that can be checked.
    block: 3
- lab:
    eyebrow: Lab
    title: 'Molienda · Order #1001'
    brief: 'Three paths for Molienda: with an illustrative fee table, compute the monthly cost at 50, 300 and 2,000 orders for marketplace only, a SaaS store and open source. Chart the crossover, fill in the commission line of order #1001''s P&L and complete the tool card for the chosen option, with a 90-day exit plan.'
    blocks:
    - label: Submission
      text: Result and evidence record.
    - label: Constraint
      text: Use only this session and earlier concepts.
    - label: Check
      text: Another person must be able to reproduce the result.
    notes: 'Three paths for Molienda: with an illustrative fee table, compute the monthly cost at 50, 300 and 2,000 orders for marketplace only, a SaaS store and open source. Chart the crossover, fill in the commission line of order #1001''s P&L and complete the tool card for the chosen option, with a 90-day exit plan.'
