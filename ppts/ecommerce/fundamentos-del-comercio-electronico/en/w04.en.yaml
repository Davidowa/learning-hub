- table:
    eyebrow: Illustrative case
    title: Data for a decision
    headers:
    - Orders
    - Marketplace
    - Own store
    rows:
    - - '10'
      - '750'
      - 1,650
    - - '25'
      - 1,875
      - 1,875
    - - '50'
      - 3,750
      - 2,250
    notes: 'All numbers are synthetic teaching inputs. No vendor fees or product tax classifications are asserted. Illustrative fees: marketplace 15% of a 500 order; own store 1500 fixed monthly plus 3% of each 500 order. Equality is at 25 orders. Acquisition costs are omitted from this fee-only comparison.'
- method:
    eyebrow: Check
    title: The decision needs an explicit basis
    statement: State the unit, period and assumptions before comparing results.
    points:
    - label: Data
      text: Distinguish records from estimates.
    - label: Calculation
      text: Keep denominators and units.
    - label: Decision
      text: State which action changes with the evidence.
- quiz:
    eyebrow: Quick check
    question: 'Marketplace: 15 % commission on a $500 order. SaaS store: $1,500 a month plus 3 % per payment. At how many monthly orders are these stated fees equal?'
    options:
    - '10.'
    - '25.'
    - '60.'
    - '100.'
    notes: |-
      Marketplace: 15 % commission on a $500 order. SaaS store: $1,500 a month plus 3 % per payment. At how many monthly orders are these stated fees equal? A) 10. B) 25 (correct: 75n = 1,500 + 15n). C) 60. D) 100. Open follow-up: why might the seller stay on the marketplace anyway? Because it supplies traffic the store would have to buy; this sets up CAC in w12.
      Answer: B
- divider:
    eyebrow: Block 03
