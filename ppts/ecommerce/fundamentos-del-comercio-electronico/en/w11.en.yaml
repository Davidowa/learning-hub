    lede: Fictional data for practicing a verifiable decision.
    block: 2
- table:
    eyebrow: Illustrative case
    title: Data for a decision
    headers:
    - Record
    - Result
    rows:
    - - Original payment
      - 2,068.00
    - - Confirmed refund
      - 2,068.00
    - - Unreconciled balance
      - '0.00'
    - - Invoice treatment
      - Review applicable rules
    notes: 'All numbers are synthetic teaching inputs. No vendor fees or product tax classifications are asserted. '
- method:
    eyebrow: Check
    title: The decision needs an explicit basis
    statement: State the unit, period and assumptions before comparing results.
    points:
    - label: Data
      text: Distinguish records from estimates.
    - label: Calculation
      text: Keep denominators and units.
    - label: Decision
      text: State which action changes with the evidence.
- quiz:
    eyebrow: Quick check
    question: A full refund is confirmed. Which records must be reconciled?
    options:
    - Only the product photo.
    - Original order, payment, refund and applicable invoice documents.
    - Only campaign clicks.
    - Only the current stock.
    notes: |-
      A full refund is confirmed. Which records must be reconciled? A) Only the product photo. B) Original order, payment, refund and applicable invoice documents (correct). C) Only campaign clicks. D) Only the current stock.
      Answer: B
- divider:
    eyebrow: Block 03
    title: Application and evidence
    lede: The case ends in a decision that can be checked.
    block: 3
- lab:
    eyebrow: Lab
    title: 'Molienda · Order #1001'
    brief: 'Molienda''s after-sales desk handles six cases: a damaged grinder, the wrong grind, a change of mind on day 3, an invoice requested a month later, a refund of an invoiced order and a review complaining of late delivery. For each: the customer''s right, the action, the cost and the CFDI document.'
    blocks:
    - label: Submission
      text: Result and evidence record.
    - label: Constraint
      text: Use only this session and earlier concepts.
    - label: Check
      text: Another person must be able to reproduce the result.
    notes: 'Molienda''s after-sales desk handles six cases: a damaged grinder, the wrong grind, a change of mind on day 3, an invoice requested a month later, a refund of an invoiced order and a review complaining of late delivery. For each: the customer''s right, the action, the cost and the CFDI document.'
