- lab:
    eyebrow: Lab
    title: 'Molienda · Order #1001'
    brief: 'Take apart Molienda''s mobile product page (a mock with planted defects) using the given funnel data: heuristic evaluation, an accessibility pass with a checker and the keyboard, and a written decision on which step to fix first and why.'
    blocks:
    - label: Submission
      text: Result and evidence record.
    - label: Constraint
      text: Use only this session and earlier concepts.
    - label: Check
      text: Another person must be able to reproduce the result.
    notes: 'Take apart Molienda''s mobile product page (a mock with planted defects) using the given funnel data: heuristic evaluation, an accessibility pass with a checker and the keyboard, and a written decision on which step to fix first and why.'
