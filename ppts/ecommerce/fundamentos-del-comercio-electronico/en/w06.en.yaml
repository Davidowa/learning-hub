- table:
    eyebrow: Illustrative case
    title: Data for a decision
    headers:
    - Stage
    - Entrants
    rows:
    - - Sessions
      - 10,000
    - - Product views
      - 4,000
    - - Add to cart
      - '600'
    - - Begin checkout
      - '300'
    - - Purchases
      - '150'
    notes: 'All numbers are synthetic teaching inputs. No vendor fees or product tax classifications are asserted. Step losses: 60%, 85%, 50%, 50%. Overall conversion is 150/10000 = 1.5%. The largest relative leak is product view to cart.'
- method:
    eyebrow: Check
    title: The decision needs an explicit basis
    statement: State the unit, period and assumptions before comparing results.
    points:
    - label: Data
      text: Distinguish records from estimates.
    - label: Calculation
      text: Keep denominators and units.
    - label: Decision
      text: State which action changes with the evidence.
- quiz:
    eyebrow: Quick check
    question: 'Funnel: 10,000 sessions, 4,000 product views, 600 add-to-carts, 300 checkouts and 150 purchases. Where is the largest relative leak?'
    options:
    - From session to product view.
    - From product view to cart, with 85 % lost.
    - From cart to checkout.
    - From checkout to purchase.
    notes: |-
      Funnel: 10,000 sessions, 4,000 product views, 600 add-to-carts, 300 checkouts and 150 purchases. Where is the largest relative leak? A) From session to product view. B) From product view to cart, with 85 % lost (correct). C) From cart to checkout. D) From checkout to purchase. A has the largest absolute drop, which is exactly the confusion the question targets.
      Answer: B
