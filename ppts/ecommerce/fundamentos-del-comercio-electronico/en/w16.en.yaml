- lab:
    eyebrow: Lab
    title: 'Molienda · Order #1001'
    brief: 'Short lab: each team draws a trend card (checkout inside an assistant, live shopping, marketplace advertising, passkeys, social marketplaces) and produces a tool card and a pilot plan for Molienda. Project presentations follow.'
    blocks:
    - label: Submission
      text: Result and evidence record.
    - label: Constraint
      text: Use only this session and earlier concepts.
    - label: Check
      text: Another person must be able to reproduce the result.
    notes: 'Short lab: each team draws a trend card (checkout inside an assistant, live shopping, marketplace advertising, passkeys, social marketplaces) and produces a tool card and a pilot plan for Molienda. Project presentations follow.'
