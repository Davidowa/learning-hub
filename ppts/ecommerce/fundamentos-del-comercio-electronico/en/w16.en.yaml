- method:
    eyebrow: Check
    title: The decision needs an explicit basis
    statement: State the unit, period and assumptions before comparing results.
    points:
    - label: Data
      text: Distinguish records from estimates.
    - label: Calculation
      text: Keep denominators and units.
    - label: Decision
      text: State which action changes with the evidence.
- quiz:
    eyebrow: Quick check
    question: A vendor claims its AI agent 'lifts sales 40 %'. What evidence is enough to adopt it?
    options:
    - The vendor's case study.
    - Three testimonials.
    - A test on the business’s traffic, with a metric and a stop rule set beforehand.
    - The number of companies using it.
    notes: |-
      A vendor claims its AI agent 'lifts sales 40 %'. What evidence is enough to adopt it? A) The vendor's case study. B) Three testimonials. C) A test on the business’s traffic, with a metric and a stop rule set beforehand (correct). D) The number of companies using it.
      Answer: C
