    lede: The case ends in a decision that can be checked.
    block: 3
- lab:
    eyebrow: Lab
    title: 'Molienda · Order #1001'
    brief: 'Interview clinic in pairs: turn bad questions into good ones and swap with another pair to flag the leading ones. Then design a one-week test of the Molienda subscription with the threshold set in advance, for example at least 20 refundable deposits from 400 visits, and write what you would do if it is not met.'
    blocks:
    - label: Submission
      text: Result and evidence record.
    - label: Constraint
      text: Use only this session and earlier concepts.
    - label: Check
      text: Another person must be able to reproduce the result.
    notes: 'Interview clinic in pairs: turn bad questions into good ones and swap with another pair to flag the leading ones. Then design a one-week test of the Molienda subscription with the threshold set in advance, for example at least 20 refundable deposits from 400 visits, and write what you would do if it is not met.'
