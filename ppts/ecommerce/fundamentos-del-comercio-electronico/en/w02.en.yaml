    - label: Decision
      text: State which action changes with the evidence.
- quiz:
    eyebrow: Quick check
    question: Which is the strongest evidence that people will pay for a coffee subscription?
    options:
    - 80 % of 200 survey respondents say they would subscribe.
    - 300 likes on the announcement post.
    - 25 people pay a refundable $100 MXN deposit.
    - Three café owners say it is a great idea.
    notes: |-
      Which is the strongest evidence that people will pay for a coffee subscription? A) 80 % of 200 survey respondents say they would subscribe. B) 300 likes on the announcement post. C) 25 people pay a refundable $100 MXN deposit (correct). D) Three café owners say it is a great idea. A and D are what people say; B is behavior, but cheap; only C is a commitment.
      Answer: C
- divider:
    eyebrow: Block 03
