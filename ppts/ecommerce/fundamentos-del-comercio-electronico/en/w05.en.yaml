- objectives:
    eyebrow: Objectives
    title: By the end of the session you will be able to…
    items:
    - head: Explain product and sku
      sub: A product can have several sellable variants. Each SKU identifies a stockkeeping unit, while a bundle combines units.
    - head: Explain attributes and taxonomy
      sub: Attributes describe the item. Categories organize discovery. Use consistent values so filters and comparisons work.
    - head: Explain publishing product data
      sub: Keep one reviewed specification as the source for descriptions, images and feeds. Check every generated claim against that specification.
    - head: Justify a decision with evidence
      sub: Apply the case and state its assumptions.
