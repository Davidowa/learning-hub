- code:
    eyebrow: Molienda case
    title: Structured case record
    filename: case-w05.json
    lang: json
    source: |
      {
        "sku": "CAF-MED-250-GRANO",
        "size_g": 250,
        "grind": "whole",
        "price": 289,
        "currency": "MXN",
        "taxes_included": true
      }
    annotations:
    - label: Identity
      text: Keep identifiers stable.
    - label: Contract
      text: Define fields, units and owner.
    notes: Synthetic teaching record. This is a generic contract, not a vendor API implementation.
- quiz:
    eyebrow: Quick check
    question: Coffee, whole bean or ground, in 250 g or 1 kg. How many SKUs per roast?
    options:
    - '1.'
    - '2.'
    - '4.'
    - '6.'
    notes: |-
      Coffee, whole bean or ground, in 250 g or 1 kg. How many SKUs per roast? A) 1. B) 2. C) 4 (correct). D) 6. B counts options instead of combinations; A confuses a product with a SKU.
      Answer: C
- divider:
    eyebrow: Block 03
    title: Application and evidence
    lede: The case ends in a decision that can be checked.
    block: 3
- lab:
    eyebrow: Lab
    title: 'Molienda · Order #1001'
    brief: Build Molienda's catalog (three roasts, whole bean or ground, in 250 g or 1 kg, plus the grinder and the subscription) as a SKU table with a naming convention and sample GTINs; map one product to two channel taxonomies and fact-check, line by line, an AI-written description with three planted errors.
    blocks:
    - label: Submission
      text: Result and evidence record.
    - label: Constraint
      text: Use only this session and earlier concepts.
    - label: Check
      text: Another person must be able to reproduce the result.
    notes: Build Molienda's catalog (three roasts, whole bean or ground, in 250 g or 1 kg, plus the grinder and the subscription) as a SKU table with a naming convention and sample GTINs; map one product to two channel taxonomies and fact-check, line by line, an AI-written description with three planted errors.
- homework:
    eyebrow: Homework
    title: Apply to the project
    brief: A 10-SKU catalog for the project business with a naming convention and attributes, plus one product JSON filled in from the template.
    meta:
    - - Due
      - Before the next session
    - - Format
      - Evidence and explanation
    rubric:
    - - Concept
      - 40 %
      - Correct use and clear assumptions
    - - Evidence
      - 40 %
      - Reproducible result
    - - Decision
      - 20 %
      - Rationale and limit
    notes: A 10-SKU catalog for the project business with a naming convention and attributes, plus one product JSON filled in from the template.
