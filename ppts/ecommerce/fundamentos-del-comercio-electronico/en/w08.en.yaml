- method:
    eyebrow: Check
    title: The decision needs an explicit basis
    statement: State the unit, period and assumptions before comparing results.
    points:
    - label: Data
      text: Distinguish records from estimates.
    - label: Calculation
      text: Keep denominators and units.
    - label: Decision
      text: State which action changes with the evidence.
- quiz:
    eyebrow: Quick check
    question: What must be specified before an A/B test begins?
    options:
    - Only the button color.
    - Primary metric, assignment and stopping rule.
    - The winner.
    - A rule to stop at the first favorable result.
    notes: |-
      What must be specified before an A/B test begins? A) Only the button color. B) Primary metric, assignment and stopping rule (correct). C) The winner. D) A rule to stop at the first favorable result.
      Answer: B
- divider:
    eyebrow: Block 03
    title: Application and evidence
    lede: The case ends in a decision that can be checked.
    block: 3
- lab:
    eyebrow: Lab
    title: 'Molienda · Order #1001'
    brief: 'Molienda''s seven-step checkout, with about 6,000 sessions a month: redesign it, write two hypotheses and check with the sample-size table whether an A/B test is feasible. The expected finding is that only large effects are detectable, so a usability test comes first. A short lab because of the exam week.'
    blocks:
    - label: Submission
      text: Result and evidence record.
    - label: Constraint
      text: Use only this session and earlier concepts.
    - label: Check
      text: Another person must be able to reproduce the result.
    notes: 'Molienda''s seven-step checkout, with about 6,000 sessions a month: redesign it, write two hypotheses and check with the sample-size table whether an A/B test is feasible. The expected finding is that only large effects are detectable, so a usability test comes first. A short lab because of the exam week.'
