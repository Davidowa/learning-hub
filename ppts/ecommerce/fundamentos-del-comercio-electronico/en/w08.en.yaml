- objectives:
    eyebrow: Objectives
    title: By the end of the session you will be able to…
    items:
    - head: Explain checkout disclosure
      sub: Show the complete charge, delivery conditions and seller contact before the customer confirms
    - head: Explain experiment design
      sub: Define random assignment, the primary metric and stopping rule before an A/B test. Estimate the data needed for the effect of interest.
    - head: Explain trust and persuasion
      sub: Use truthful reviews, inventory and offers. A measured conversion gain must also preserve margin and customer outcomes.
    - head: Justify a decision with evidence
      sub: Apply the case and state its assumptions.
