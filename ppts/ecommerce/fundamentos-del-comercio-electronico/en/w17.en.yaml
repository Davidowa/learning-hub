- method:
    eyebrow: Check
    title: The decision needs an explicit basis
    statement: State the unit, period and assumptions before comparing results.
    points:
    - label: Data
      text: Distinguish records from estimates.
    - label: Calculation
      text: Keep denominators and units.
    - label: Decision
      text: State which action changes with the evidence.
- quiz:
    eyebrow: Quick check
    question: During Buen Fin, Molienda's conversion rate rose, AOV fell and contribution per order dropped. What do you check first?
    options:
    - The home page design.
    - Contribution per order and payment method
    - The number of sessions.
    - Search rankings.
    notes: |-
      During Buen Fin, Molienda's conversion rate rose, AOV fell and contribution per order dropped. What do you check first? A) The home page design. B) Contribution by order and by payment method, because discounts and MSI may have pulled in low-margin orders (correct). C) The number of sessions. D) Search rankings.
      Answer: B
