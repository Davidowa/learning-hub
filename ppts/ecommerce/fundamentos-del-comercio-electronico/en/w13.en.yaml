    block: 3
- lab:
    eyebrow: Lab
    title: 'Molienda · Order #1001'
    brief: Explore the GA4 demo account (funnel and traffic acquisition by UTM). Write Molienda's measurement plan and build the reconciliation table that solves the w12 puzzle, including a duplicate purchase event planted in the data. A short lab because of the exam week.
    blocks:
    - label: Submission
      text: Result and evidence record.
    - label: Constraint
      text: Use only this session and earlier concepts.
    - label: Check
      text: Another person must be able to reproduce the result.
    notes: Explore the GA4 demo account (funnel and traffic acquisition by UTM). Write Molienda's measurement plan and build the reconciliation table that solves the w12 puzzle, including a duplicate purchase event planted in the data. A short lab because of the exam week.
