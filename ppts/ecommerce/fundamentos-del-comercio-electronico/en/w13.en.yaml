- method:
    eyebrow: Check
    title: The decision needs an explicit basis
    statement: State the unit, period and assumptions before comparing results.
    points:
    - label: Data
      text: Distinguish records from estimates.
    - label: Calculation
      text: Keep denominators and units.
    - label: Decision
      text: State which action changes with the evidence.
- code:
    eyebrow: Molienda case
    title: Structured case record
    filename: case-w13.json
    lang: json
    source: |
      {
        "event": "purchase",
        "transaction_id": "1001",
        "value": 2068,
        "currency": "MXN"
      }
    annotations:
    - label: Identity
      text: Keep identifiers stable.
    - label: Contract
      text: Define fields, units and owner.
    notes: Synthetic teaching record. This is a generic contract, not a vendor API implementation.
- quiz:
    eyebrow: Quick check
    question: The purchase event arrives without a transaction_id. What is the risk?
    options:
    - None.
    - Reloading the thank-you page counts the purchase twice and inflates revenue.
    - GA4 rejects every event.
    - The customer is not charged.
    notes: |-
      The purchase event arrives without a transaction_id. What is the risk? A) None. B) Reloading the thank-you page counts the purchase twice and inflates revenue (correct). C) GA4 rejects every event. D) The customer is not charged.
      Answer: B
- divider:
