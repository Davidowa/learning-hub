    - label: Calculation
      text: Keep denominators and units.
    - label: Decision
      text: State which action changes with the evidence.
- quiz:
    eyebrow: Quick check
    question: A hypothetical fee is 3.5% plus MXN 4 on a payment of MXN 2,068. What is the fee?
    options:
    - '4.'
    - 72.38.
    - 76.38.
    - 206.80.
    notes: |-
      A hypothetical fee is 3.5% plus MXN 4 on a payment of MXN 2,068. What is the fee? A) 4. B) 72.38. C) 76.38 (correct). D) 206.80.
      Answer: C
