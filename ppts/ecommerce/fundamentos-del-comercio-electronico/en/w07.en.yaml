- objectives:
    eyebrow: Objectives
    title: By the end of the session you will be able to…
    items:
    - head: Explain payment lifecycle
      sub: Authorization, capture, settlement and merchant payout are distinct events. Fulfillment should depend on the required confirmation state.
    - head: Explain fees and timing
      sub: Compare a percentage fee, a fixed fee and the payout delay. Use the provider agreement and the exercise fee sheet.
    - head: Explain payment evidence
      sub: A screenshot is a claim of payment. Reconcile the provider notification and the credited movement before releasing an order.
    - head: Justify a decision with evidence
      sub: Apply the case and state its assumptions.
