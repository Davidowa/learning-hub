- lab:
    eyebrow: Lab
    title: 'Molienda · Order #1001'
    brief: Molienda's payment mix
    blocks:
    - label: Submission
      text: Result and evidence record.
    - label: Constraint
      text: Use only this session and earlier concepts.
    - label: Check
      text: Another person must be able to reproduce the result.
    notes: 'Molienda''s payment mix: from a segment table (a young buyer without a credit card, an office buyer who needs an invoice, a grinder customer) and an illustrative fee table, choose methods, compute the weighted payment cost per order, fill in the payment line of order #1001, decide whether to offer MSI only on grinders and complete a tool card for one payment provider.'
