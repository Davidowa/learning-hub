  - steps:
      eyebrow: Bloque 03 · Cómo funciona
      title: Cinco cosas antes de sentarte
      items:
        - label: '01'
          title: En la máquina del salón
          desc: Se resuelve en Excel, no en papel. Puedes traer una USB con lo que quieras.
        - label: '02'
          title: Con tu propio material
          desc: Apuntes, tareas entregadas, los libros, la web y lo que hayas generado antes con IA.
        - label: '03'
          title: Sin canal de comunicación
          desc: Hay web, pero no correo ni mensajería. La red es para subir, nada más.
        - label: '04'
          title: Dispositivos al frente
          desc: Celular, audífonos y lentes con IA se dejan al frente del salón antes de empezar.
        - label: '05'
          title: Se sube comprimido
          desc: Un .zip con tu nombre completo, por ejemplo PedroPerezGonzalez.zip, a Blackboard.

  - method:
      eyebrow: Bloque 03 · Qué se pregunta
      title: Puedes consultar todo, y aun así tienes que saber
      statement: El parcial te va a dar una base sucia y desordenada. Lo que se mide es si la dejas usable con una macro, no si te acordabas de la sintaxis.
      points:
        - label: Qué se evalúa
          text: Que la macro corra sobre datos que no habías visto y que use un rango variable en vez de una dirección fija
        - label: La defensa
          text: Te puedo pedir que expliques uno de tus procedimientos en voz alta. Leerlo no es explicarlo.
        - label: Cómo prepararte
          text: Rehaciendo las tareas de las semanas 9 a 12 sin ver tu solución. Consultar es rápido cuando ya sabes qué buscar.

  - lab:
      eyebrow: Laboratorio
      title: La base de tu proyecto, limpia desde una macro
      brief: Toma la base de tu proyecto y escribe una macro que la deje usable. Que quite espacios de sobra y espacios duros, empareje las mayúsculas, borre las filas en blanco y la ordene por dos criterios.
      blocks:
        - label: Restricción
          text: El rango se calcula, no se escribe. La macro tiene que servir si mañana llegan mil filas más.
        - label: Entregable
          text: El .xlsm y los módulos exportados, con la base antes y después en dos hojas
        - label: Criterio
          text: Que después de ordenar, cada renglón siga diciendo lo mismo que antes de ordenar

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarte
      items:
        - title: Lo que ensucia no se ve
          desc: Un espacio duro sobrevive a Trim y hace que dos celdas idénticas no sean iguales
        - title: Ordenar mueve filas
          desc: Si el rango no abarca la base completa, los datos se desparejan sin un solo error
        - title: Borrar es de abajo hacia arriba
          desc: Al quitar una fila, la siguiente sube al lugar por el que el ciclo ya pasó

  - homework:
      eyebrow: Tarea
      title: Entrega y criterios de evaluación
      brief: Termina la macro del laboratorio y agrégale un reporte, en una hoja aparte, que diga cuántas filas se limpiaron, cuántas se borraron por vacías y cuántas por duplicadas.
      meta:
        - [Entrega, Antes de la sesión 14]
        - [Formato, Blackboard · .xlsm + módulos .bas]
        - [Peso, Parte del 20 % de tareas]
      rubric:
        - ["Limpieza", "40 %", "Espacios, espacios duros y mayúsculas, sobre el rango completo"]
        - ["Ordenación", "30 %", "Dos criterios, encabezado declarado y la base entera en el rango"]
        - ["El reporte", "30 %", "Los tres conteos salen de la corrida, no están escritos a mano"]

  - closing:
      title: Preguntas
      subtitle: >-
        La próxima sesión, filtros avanzados y subtotales desde macros, y el manejo de tablas.
      meta:
