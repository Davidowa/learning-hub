  - divider:
      eyebrow: Bloque 01
      title: Comparar
      lede: Una comparación no devuelve un número ni un texto. Devuelve verdadero o falso, y con eso se decide todo lo demás.
      block: 1

  - table:
      eyebrow: Bloque 01 · Los seis, completos
      title: Todos los operadores de comparación de VBA
      headers: [Operador, Qué pregunta, Ejemplo, Resultado]
      rows:
        - ["=", "¿Son iguales?", "5 = 5", "True"]
        - ["<>", "¿Son distintos?", "5 <> 10", "True"]
        - [">", "¿El primero es mayor?", "5 > 10", "False"]
        - ["<", "¿El primero es menor?", "5 < 10", "True"]
        - [">=", "¿Mayor o igual?", "5 >= 5", "True"]
        - ["<=", "¿Menor o igual?", "5 <= 10", "True"]

  - code:
      eyebrow: Bloque 01 · El igual hace dos cosas
      title: El mismo signo, dos trabajos distintos
      filename: ComparissonOperators.bas
      lang: vba
      source: |
        Sub Comparar()
            Dim a As Integer
            Dim b As Integer
            Dim sonIguales As Boolean

            a = 5
            b = 5
            sonIguales = a = b

            MsgBox "¿a es igual a b? " & sonIguales
        End Sub
      annotations:
        - label: El primer igual
          text: Asigna. Guarda en sonIguales lo que salga del lado derecho.
        - label: El segundo igual
          text: Compara. Devuelve True o False, y ese es el valor que se guarda.
        - label: Cómo se lee
          text: De derecha a izquierda. Primero se resuelve a = b, después se guarda el resultado.
        - label: Riesgo
          text: En VBA no hay dos signos distintos como en otros lenguajes. El contexto decide cuál de los dos es.
          accent: true

  - table:
      eyebrow: Bloque 01 · Verificado
      title: Comparar texto no es comparar números
      headers: [Comparación, Devuelve, Por qué]
      rows:
        - ["10 < 9", "False", "Como números, nueve es menor"]
        - ["\"10\" < \"9\"", "True", "Como texto, el 1 va antes que el 9"]
        - ["\"Norte\" = \"norte\"", "False", "VBA respeta mayúsculas por omisión"]
        - ["\"abc\" < \"abd\"", "True", "Letra por letra, hasta la primera que difiere"]

  - divider:
      eyebrow: Bloque 02
      title: Combinar y decidir
      lede: Tres palabras para juntar condiciones, y dos formas de escribir la decisión que sale de ellas.
      block: 2

  - table:
      eyebrow: Bloque 02 · Los tres, completos
      title: And, Or y Not, con su tabla de verdad
      headers: [Combinación, And, Or]
      rows:
        - ["True con True", "True", "True"]
        - ["True con False", "False", "True"]
        - ["False con True", "False", "True"]
        - ["False con False", "False", "False"]
        - ["Not True", "False", "Not invierte lo que tenga"]
        - ["Not False", "True", "y solo toma una condición"]

  - code:
      eyebrow: Bloque 02 · La cadena
      title: If, ElseIf y Else, en el orden que importa
      filename: ConditionalStatements.bas
      lang: vba
      source: |
        Sub Clasificar()
            Dim calificacion As Double
            calificacion = 7.5

            If calificacion >= 9 Then
                MsgBox "A"
            ElseIf calificacion >= 8 Then
                MsgBox "B"
            ElseIf calificacion >= 7 Then
                MsgBox "C"
            Else
                MsgBox "Reprobado"
            End If
        End Sub
      annotations:
        - label: El orden manda
          text: Se revisa de arriba hacia abajo y se detiene en la primera que sea verdadera. Verificado, 7.5 da C.
        - label: Por qué de mayor a menor
          text: Si el primero fuera mayor o igual a siete, un nueve entraría ahí y nunca llegaría a la A.
        - label: Else
          text: Atrapa todo lo que no entró antes. Sin él, una calificación de cinco no produce nada.
        - label: Riesgo
          text: ElseIf junto es una palabra. Else If separado abre un If nuevo que pide su propio End If.
          accent: true

  - compare:
      eyebrow: Bloque 02 · La otra forma
      title: La misma decisión, escrita con Select Case
      before:
        label: Con ElseIf en cadena
        file: Modulo1.bas
        lang: vba
        code: |
          If calificacion >= 9 Then
              nivel = "A"
          ElseIf calificacion >= 8 Then
              nivel = "B"
          End If
      after:
        label: Con Select Case
        file: Modulo1.bas
        lang: vba
        code: |
          Select Case calificacion
              Case Is >= 9:   nivel = "A"
              Case 8 To 8.99: nivel = "B"
          End Select
      note: >-
        Las dos dan C con 7.5, verificado. Select Case gana cuando todas las condiciones
        preguntan por la misma variable, y acepta rangos con To y comparaciones con Is. If
        gana cuando cada rama pregunta por cosas distintas.

  - pitfalls:
      eyebrow: Bloque 02 · Errores comunes
      title: Cuatro comparaciones que dan lo contrario
      items:
        - label: Error 01
          title: True no vale uno, vale menos uno
          desc: "CInt(True) es -1. Por eso (5 > 1) * 3 da -3, y sumar dos condiciones verdaderas da -2."
        - label: Error 02
          title: Norte no es igual a norte
          desc: VBA compara texto respetando mayúsculas. Una base con capturas mixtas nunca cuadra al agrupar.
        - label: Error 03
          title: Una celda vacía es igual a cero
          desc: También es igual a cadena vacía, las dos ciertas. Preguntar si vale cero no distingue el dato ausente.
        - label: Error 04
          title: And evalúa los dos lados
          desc: No corta al primer False. La condición de la derecha corre aunque la de la izquierda ya haya fallado.

