  - method:
      eyebrow: Bloque 03 · Lo que sí se pregunta
      title: Puedes consultar todo, y aun así hay que saber
      statement: El examen no mide qué tanto memorizaste. Mide si puedes leer un requerimiento, escribir la macro y defenderla.
      points:
        - label: Lo que se evalúa
          text: Que el código corra, que haga lo que el enunciado pide, y que uses el rango variable en vez de una dirección fija
        - label: La defensa
          text: Puedo pedirte que expliques en voz alta un procedimiento tuyo. Leerlo no es explicarlo.
        - label: Cómo se prepara
          text: Volviendo a hacer las tareas sin ver la solución. Consultar es rápido cuando ya sabes qué buscar.

  - quiz:
      eyebrow: Verificación rápida
      question: La celda A1 está vacía. ¿Qué escribe en B1?
      filename: Decisiones.bas
      lang: vba
      source: |
        If Range("A1").Value = 0 Then
            Range("B1").Value = "Sin venta"
        Else
            Range("B1").Value = "Con venta"
        End If
      options:
        - "Con venta, porque la celda está vacía y no vale cero"
        - "Sin venta, porque una celda vacía sí es igual a cero"
        - "Nada, porque comparar una celda vacía marca error"
        - "Depende del formato que tenga la celda"

  - lab:
      eyebrow: Laboratorio
      title: Clasifica una cartera de clientes
      brief: Toma una base de clientes de tu área y escribe una macro que clasifique cada renglón en tres niveles según su saldo. Escríbela dos veces, una con ElseIf en cadena y otra con Select Case, y decide cuál queda mejor para este caso.
      blocks:
        - label: Entrega
          text: El módulo con los dos procedimientos y una nota de cuál elegiste, en Blackboard
        - label: Restricción
          text: Ningún cliente puede quedar sin clasificar. Si no entra en ninguno, va al Else.
        - label: La prueba
          text: Mete un renglón con el saldo vacío. Si lo clasifica como cero, ya sabes qué falta.

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: Comparar texto no es comparar números
          desc: Como texto, 10 es menor que 9, y Norte no es norte. Una clave capturada como texto se ordena distinto
        - title: Una celda vacía es igual a cero
          desc: Y también a cadena vacía. Preguntar por cero no distingue el dato ausente del que sí llegó valiendo cero
        - title: El orden de los ElseIf decide
          desc: Se detiene en la primera condición verdadera, así que va de la más exigente a la más floja

  - homework:
      eyebrow: Tarea
      title: Entrega y criterios de evaluación
      brief: >-
        Sobre la tabla de amortización, escribe una macro que revise cada periodo y marque
        los que ya pagaron más de la mitad del capital. Usa el rango variable de la semana
        6 y clasifica en tres niveles.
      meta:
        - [Entrega, Antes de la semana 9]
        - [Formato, Blackboard · .bas y .xlsm]
        - [Peso, Parte del 20 % de tareas]
      rubric:
        - ["Condiciones", "40 %", "Las tres ramas están y ninguna fila queda sin clasificar"]
        - ["Rango variable", "30 %", "Recorre lo que haya, no una dirección escrita a mano"]
        - ["Vacíos", "30 %", "Un periodo sin dato no se cuenta como cero"]

  - closing:
      title: Preguntas
      subtitle: >-
        La siguiente sesión, la repetición. For y For Each, que es donde la macro por fin
        recorre las mil filas sin que tú escribas mil renglones.
      meta:
        - [Correo, descobarc@up.edu.mx]
        - [Mensajería, Google Chat institucional]
        - [Repositorio, github.com/davidowa/learning-hub]
