  code: TIA503
  lang: es
  language: vba
  week: 17
  footer: ANÁLISIS Y PROCESAMIENTO DE LA INFORMACIÓN · TIA503 · VBA
  blocks: 3

slides:
  - cover:
      kicker: Escuela de Empresariales · 2026
      unit: Semana 17 · Cierre · Examen final
      title: Análisis y Procesamiento de la Información
      subtitle: >-
        El examen abarca las seis unidades. Antes de presentarlo, un repaso de lo que
        medimos y de lo que falla sin avisar.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, TIA503 · Empresariales]
        - [Sesión, 17 de 17]

  - agenda:
      eyebrow: Agenda
      title: Tres bloques de trabajo
      cards:
        - title: El examen final
          desc: Qué abarca, cómo se presenta y qué puedes traer contigo
        - title: Repaso de lo medido
          desc: Los errores que ya viste y las trampas que no dan ningún aviso
        - title: Cierre
          desc: Cómo queda la calificación y qué te llevas del semestre
        - title: Preguntas
          desc: Lo que haga falta antes de sentarse a resolverlo

  - objectives:
      eyebrow: Objetivos de la sesión
      title: Al terminar la sesión vas a poder…
      items:
        - head: Presentar el examen final
          sub: Sobre las seis unidades, con tu material y en la máquina del salón
        - head: Reconocer un error por su número
          sub: Los cinco que salieron este semestre y qué provoca cada uno
        - head: Detectar una falla silenciosa
          sub: Las que dan un resultado equivocado sin lanzar nada, que son las caras
        - head: Cerrar el curso
          sub: Sabiendo qué automatizaste, cómo se calificó y hacia dónde sigue

  - roadmap:
      eyebrow: Mapa del curso
      title: Dónde vamos en el semestre
      phases:
        - label: 01 · Semanas 1–5
          title: Programar en VBA
          desc: Editor, tipos, variables, operaciones y formularios de captura
          state: done
        - label: 02 · Semanas 6–7
          title: Editar macros grabadas
          desc: Rangos variables, buscar objetivo y automatización acotada
          state: done
        - label: 03 · Semanas 8–12
          title: Decisiones, ciclos y eventos
          desc: If, For, For Each, procedimientos, funciones y clases propias
          state: done
        - label: 04 · Semanas 13–17
          title: Excel desde macros
          desc: Limpieza, filtros, tablas dinámicas, fórmula R1C1 y seguridad
          state: now

  - concept:
      eyebrow: Dónde empezó y dónde acabó
      title: De grabar un botón a entregar un libro que se maneja solo
      lead: >-
        En la semana 1 grabaste una macro y no sabías qué decía. Hoy entregas un libro que
        limpia su base, la ordena, la resume, arma su reporte con gráfica, atiende sus
        errores y se protege al abrir. Todo eso es el mismo lenguaje.
      panel:
        label: Lo que de verdad cambió
        title: Dejaste de repetir el trabajo
        note: >-
          La diferencia no es que sepas más instrucciones. Es que el trabajo que hacías cada
          mes ahora lo hace el libro, y tú revisas el resultado.
      steps:
        - text: Grabaste una macro sin entenderla
        - text: La abriste y la editaste
        - text: Escribiste una que la grabadora no podía
          loop: ↺ y de ahí en adelante fue decidir qué automatizar

  - divider:
      eyebrow: Bloque 01
      title: El examen final
      lede: Abarca las seis unidades. Se presenta en la máquina, con tus apuntes al lado, igual que los dos parciales.
      block: 1

  - table:
      eyebrow: Bloque 01 · Qué abarca
      title: Las seis unidades, y en qué semanas se vieron
      headers: [Unidad, Semanas, Tema]
      rows:
        - ["1", "2 a 5", "Editor, tipos, variables y captura"]
        - ["2", "1, 6 y 7", "Grabar, editar y rangos variables"]
        - ["3", "8 a 12", "If, ciclos, eventos y clases"]
        - ["4", "13 a 16", "Limpiar, filtrar, resumir y graficar"]
        - ["5", "15", "Fórmula R1C1"]
        - ["6", "16", "Protección del libro y del proyecto"]

  - steps:
      eyebrow: Bloque 01 · Cómo funciona
      title: Cinco cosas antes de sentarte
      items:
        - label: '01'
          title: En la máquina del salón
          desc: Se resuelve en Excel, no en papel. Puedes traer una USB con lo que quieras.
        - label: '02'
          title: Con tu propio material
          desc: Apuntes, tareas entregadas, los libros, la web y lo que hayas generado antes con IA.
        - label: '03'
          title: Sin canal de comunicación
          desc: Hay web, pero no correo ni mensajería. La red es para subir, nada más.
        - label: '04'
          title: Dispositivos al frente
          desc: Celular, audífonos y lentes con IA se dejan al frente del salón antes de empezar.
        - label: '05'
          title: Se sube comprimido
          desc: Un .zip con tu nombre completo, por ejemplo PedroPerezGonzalez.zip, a Blackboard.

  - method:
      eyebrow: Bloque 01 · Qué se pregunta
      title: Una base que no habías visto, y una macro que la deje usable
      statement: El examen no mide lo que memorizaste. Te da datos sucios y un requerimiento, y mide si escribes la macro, si corre y si puedes defenderla.
      points:
        - label: Qué se evalúa
          text: Que corra sobre datos nuevos, que use un rango calculado y no una dirección fija, y que atienda lo que puede fallar
        - label: La defensa
          text: Te puedo pedir que expliques uno de tus procedimientos en voz alta. Leerlo no es explicarlo.
        - label: Cómo prepararte
          text: Rehaciendo una tarea de cada unidad sin ver tu solución. Consultar es rápido cuando ya sabes qué buscar.

  - divider:
      eyebrow: Bloque 02
      title: Repaso de lo medido
      lede: Todo lo que sigue se corrió en Excel antes de ponerlo en una lámina. No es teoría, son salidas.
      block: 2

  - table:
      eyebrow: Bloque 02 · Los que sí avisan
      title: Los cinco errores del semestre, por número
      headers: ["Err", "Qué dice", "Qué lo provoca"]
      rows:
        - ["11", "Division by zero", "Dividir entre una celda vacía"]
        - ["13", "Type mismatch", "Convertir a número lo que es texto"]
        - ["91", "Object variable not set", "Faltó el New, o la propiedad es Nothing"]
        - ["438", "Object doesn't support…", "Pedirle a WorksheetFunction algo de VBA"]
        - ["1004", "Varias redacciones", "Hoja protegida, BuscarV sin dato, rango malo"]

  - concept:
      eyebrow: El más útil de los cinco
      title: El 91 salió dos veces por dos razones distintas
      lead: >-
        En la semana 12 fue declarar sin crear, olvidar el New. En la semana 14 fue pedirle
        el cuerpo a una tabla vacía, donde DataBodyRange devuelve Nothing. Mismo número,
        misma redacción, causas que no se parecen.
      panel:
        label: Qué hacer con eso
        title: El número te dice qué, no por qué
        note: >-
          Un error de VBA nombra el síntoma. Encontrar la causa es leer qué objeto estabas
          usando en esa línea y preguntarte si de verdad existía.
      steps:
        - text: Lee el número y la línea
        - text: Pregúntate qué objeto tocaste ahí
        - text: Revisa si alguien lo creó de verdad
          loop: ↺ y esa pregunta resuelve casi todos los 91

  - table:
      eyebrow: Bloque 02 · Las que no avisan
      title: Seis fallas que dan un resultado equivocado y ningún error
      headers: ["Semana", "Qué hiciste", "Qué salió"]
      rows:
        - ["13", "Ordenar una sola columna", "Filas desparejadas"]
        - ["14", "Recorrer un rango filtrado", "Suma lo oculto también"]
        - ["14", "Encabezado mal escrito", "Cero filas, sin error"]
        - ["13", "Subtotal sin ordenar", "Cortes que no cierran"]
        - ["16", "Dinámica sin refrescar", "El total de ayer"]
        - ["16", "Revisar Err tarde", "Culpa a otra línea"]

  - quiz:
      eyebrow: Pregunta rápida
      question: El libro tiene una gráfica y una dinámica sobre A1:B100. Llegan 20 filas y refrescas todo. ¿Qué muestran?
      filename: Modulo1
      lang: vba
      source: |
        ' la grafica se creo sobre A1:B100
        ' el cache de la dinamica, tambien

        ' llegan datos en A101:B120

        pt.RefreshTable
      options:
        - 'Ninguna de las dos incluye las filas nuevas.'
        - 'Las dos las incluyen, porque refrescaste.'
        - 'La dinámica sí, la gráfica no.'
        - 'La gráfica sí, la dinámica no.'

  - trace:
      eyebrow: Respuesta
      title: Refrescar relee el rango de siempre, no busca datos nuevos
      headers: ["Paso", "Qué pasa", "Qué muestra"]
      rows:
        - ["1", "Llegan 20 filas en A101:B120", "Están en la hoja"]
        - ["2", "La gráfica guarda $A$2:$B$100", "Las de antes"]
        - ["3", "El caché se creó sobre A1:B100", "Relee ese rango"]
        - ["4", "Ninguna sabe de las nuevas", "Dos reportes que mienten"]
      verdict: >-
        Es el mismo problema de las semanas 14, 15 y 16, y tiene la misma respuesta. Si el
        origen es una tabla en vez de un rango, las dos crecen solas y no hay que acordarse
        de nada.

  - divider:
      eyebrow: Bloque 03
      title: Cierre
      lede: Cómo queda la calificación, y qué te llevas de aquí que sirva fuera de la clase.
      block: 3

  - table:
      eyebrow: Bloque 03 · La calificación
      title: Los cinco rubros, veinte por ciento cada uno
      headers: ["Rubro", "Peso", "Cuándo"]
      rows:
        - ["Primer parcial", "20 %", "Semana 8"]
        - ["Segundo parcial", "20 %", "Semana 13"]
        - ["Proyecto", "20 %", "Semana 16"]
        - ["Examen final", "20 %", "Semana 17"]
        - ["Tareas", "20 %", "Todo el semestre"]

  - pitfalls:
      eyebrow: Diagnóstico
      title: Cuatro maneras de perder puntos con el código funcionando
      items:
        - label: Error 01
          title: Dirección fija en vez de rango
          desc: Corre perfecto con tus datos y se cae con los del examen, que son otros
        - label: Error 02
          title: Sin nada que atienda el error
          desc: Un dato raro detiene la macro a la mitad y deja el trabajo partido
        - label: Error 03
          title: No poder explicar tu propio código
          desc: La defensa cuenta. Leer una línea en voz alta no es explicar qué hace.
        - label: Error 04
          title: Entregar sin correrlo una última vez
          desc: Un libro que no abre tiene techo de 30 %, por bien escrito que esté

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarte
      items:
        - title: Lo que no avisa es lo caro
          desc: Un error te detiene y lo arreglas. Un resultado equivocado se va al reporte.
        - title: El rango se calcula
          desc: Fue la lección de tres semanas seguidas, y es la que el examen va a cobrar
        - title: Automatizar es decidir
          desc: Lo difícil no fue la sintaxis, fue elegir qué valía la pena que se hiciera solo

  - closing:
      title: Gracias
      subtitle: >-
        Fue un buen semestre. Si algo de esto te sirve el año que entra, el repositorio se queda arriba.
      meta:
        - [Correo, descobarc@up.edu.mx]
        - [Chat, Google Chat institucional]
        - [Repositorio, github.com/davidowa/learning-hub]
