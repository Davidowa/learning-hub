slides:
  - cover:
      kicker: Facultad de Empresariales · 2026
      unit: Semana 02 · Unidad 1 · El editor de VBA
      title: Análisis y Procesamiento de la Información
      subtitle: Dónde vive el código que grabaste. Proyecto, módulo y procedimiento, y cómo correr un renglón a la vez.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, TIA503 · Empresariales]
        - [Sesión, 2 de 17]
      notes: |
        Noventa minutos. Veinte para el recorrido del editor, treinta para procedimientos,
        y el resto ejecutando con F8 sobre la macro que grabaron la semana pasada.

        La sesión pasada abrieron el editor y vieron código sin saber dónde estaba parado.
        Hoy se ordena ese mapa: un libro tiene un proyecto, un proyecto tiene módulos, un
        módulo tiene procedimientos, y un procedimiento tiene renglones. Todo lo que sigue
        en el semestre se cuelga de esas cuatro palabras.

        El código sale de
        docs/en/courses/vba-course/01 - Basic Concepts/BasicConcepts.bas,
        módulo BasicMacros, procedimiento MessageAndSubs.

        F8 es lo que más rinde hoy. Que cada quien corra su propia macro grabada renglón
        por renglón y vea la celda cambiar en la hoja mientras el editor avanza. Es la
        primera vez que el código deja de ser texto.

  - agenda:
      eyebrow: Agenda
      title: Tres bloques de trabajo
      cards:
        - title: El editor por dentro
          desc: Las cuatro ventanas que se usan y las que no hace falta abrir todavía
        - title: Dónde vive el código
          desc: Proyecto, módulo y procedimiento, y por qué importa en cuál lo pones
        - title: Correr y ver correr
          desc: F5 corre todo, F8 corre un renglón, y el segundo es el que enseña
        - title: Tu turno
          desc: Tu macro de la semana pasada, ejecutada paso a paso

  - objectives:
      eyebrow: Objetivos de la sesión
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Ubicar las ventanas del editor
          sub: Explorador de proyectos, ventana de código, Inmediato y Propiedades
        - head: Distinguir proyecto, módulo y procedimiento
          sub: Qué contiene cada uno y qué se exporta cuando entregas una tarea
        - head: Escribir un procedimiento desde cero
          sub: De Sub a End Sub, con nombre propio y sin la grabadora de por medio
        - head: Ejecutar un renglón a la vez
          sub: F8, el resaltado amarillo, y ver la hoja cambiar mientras avanza
        - head: Elegir dónde poner una macro
          sub: Módulo estándar, módulo de hoja o ThisWorkbook, y qué cambia entre ellos

  - roadmap:
      eyebrow: Mapa del curso
      title: Dónde estamos en el semestre
      phases:
        - label: 01 · Semanas 1–5
          title: Programación en VBA
          desc: Editor, tipos, variables, operaciones y formularios de captura
          state: now
        - label: 02 · Semanas 6–7
          title: Edición de macros grabadas
          desc: Rangos variables, búsqueda de objetivo y automatización acotada
          state: todo
        - label: 03 · Semanas 8–12
          title: Decisiones, ciclos y eventos
          desc: If, For, For Each, procedimientos, funciones y clases propias
          state: todo
        - label: 04 · Semanas 13–17
          title: Excel desde macros
          desc: Limpieza, filtros, tablas dinámicas, fórmula R1C1 y seguridad
          state: todo

  - divider:
      eyebrow: Bloque 01
      title: El editor por dentro
      lede: Es una ventana aparte, con su propio menú y sus propios archivos. Excel y el editor son dos programas que comparten un libro.
      block: 1

  - concept:
      eyebrow: Concepto clave
      title: El editor no está dentro de la hoja
      lead: >-
        Alt + F11 abre una ventana distinta, con su propia barra de menús. La hoja sigue
        abierta atrás, y las dos ventanas ven el mismo libro al mismo tiempo. Por eso
        puedes acomodarlas lado a lado, correr un renglón en el editor y ver la celda
        cambiar en la hoja sin cambiar de ventana.
      panel:
        label: Lo que conviene hacer hoy
        title: Acomoda las dos ventanas lado a lado
        note: >-
          Media pantalla el editor, media pantalla la hoja. Todo lo que se enseña con F8
          depende de que puedas ver las dos cosas a la vez.
      steps:
        - text: Alt + F11 abre el editor
        - text: Alt + F11 otra vez regresa a la hoja
        - text: Las dos ventanas siguen vivas
          loop: ↺ y las dos miran el mismo libro, al mismo tiempo

  - steps:
      eyebrow: Bloque 01 · El recorrido
      title: Las cuatro ventanas que sí vas a usar
      items:
        - label: '01'
          title: Explorador de proyectos
          desc: El árbol de la izquierda. Un nodo por libro abierto, y adentro sus hojas y sus módulos.
        - label: '02'
          title: Ventana de código
          desc: La grande, a la derecha. Ahí se escribe, y arriba trae dos listas para saltar entre procedimientos.
        - label: '03'
          title: Inmediato
          desc: Ctrl + G. Una consola donde puedes preguntar cuánto vale algo sin correr toda la macro.
        - label: '04'
          title: Propiedades
          desc: F4. Sirve poco hoy y mucho en la semana 5, cuando aparezcan los formularios.

  - divider:
      eyebrow: Bloque 02
      title: Dónde vive el código
      lede: Un libro, un proyecto. Un proyecto, varios módulos. Un módulo, varios procedimientos. Un procedimiento, varios renglones.
      block: 2

  - diagram:
      eyebrow: Bloque 02 · El árbol
      title: Cuatro palabras, de afuera hacia adentro
      blocks:
        - label: Proyecto
          title: Un libro
          desc: Todo el código del archivo
        - label: Módulo
          title: Un archivo .bas
          desc: Ahí escribes. Se exporta como .bas.
        - label: Procedimiento
          title: Una macro
          desc: De Sub a End Sub
          dark: true
        - label: Instrucción
          title: Un renglón
          desc: Objeto, propiedad y valor
      note: >-
        El cuadro de macros de Excel solo lista procedimientos, y solo los de los módulos
        estándar. Si tu macro no aparece ahí, casi siempre es porque la escribiste dentro
        del módulo de una hoja.

  - code:
      eyebrow: Bloque 02 · El procedimiento mínimo
      title: Lo más chico que ya es una macro
      filename: BasicConcepts.bas
      lang: vba
      source: |
        Sub MessageAndSubs()

            ' En este procedimiento mostramos un mensaje
            MsgBox "Hello, World!"

        End Sub
      annotations:
        - label: Sub
          text: Abre el procedimiento y le pone nombre. Sin espacios, y no puede empezar con número.
        - label: MsgBox
          text: Muestra un cuadro de mensaje y detiene la macro hasta que le das Aceptar.
        - label: End Sub
          text: Cierra el procedimiento. El editor lo escribe solo en cuanto tecleas la primera línea.
        - label: Riesgo
          text: Dos procedimientos con el mismo nombre en el mismo módulo no compilan. Es el error que ya trae el módulo 04 del repositorio.
          accent: true

  - code_output:
      eyebrow: Bloque 02 · Lo que se ve
      title: El cuadro que sale al correrlo
      filename: BasicConcepts.bas
      lang: vba
      output_label: Cuadro de mensaje
      source: |
        MsgBox "Hello, World!"
      output: |
        Hello, World!

  - table:
      eyebrow: Bloque 02 · Vocabulario
      title: Tres palabras que se usan como si fueran una
      headers: [Palabra, Qué es exactamente, Dónde la ves]
      rows:
        - ["Sub", "Un procedimiento que hace algo y no devuelve nada", "De Sub a End Sub"]
        - ["Function", "Un procedimiento que devuelve un valor", "De Function a End Function"]
        - ["Macro", "El nombre que Excel le da a un Sub sin parámetros", "En el cuadro de macros"]
        - ["Módulo", "El archivo de código donde viven los procedimientos", "En el explorador de proyectos"]
        - ["Proyecto", "Todo el código de un libro", "El nodo de hasta arriba del árbol"]

  - tiers:
      eyebrow: Bloque 02 · Dónde ponerlo
      title: Tres lugares distintos, y no dan lo mismo
      items:
        - key: '01'
          title: Módulo estándar
          desc: El de siempre. Insertar, Módulo. Sus procedimientos salen en el cuadro de macros y se pueden llamar desde cualquier hoja.
        - key: '02'
          title: Módulo de hoja
          desc: Uno por hoja, ya viene creado. Ahí van los eventos de esa hoja, y llegan en la semana 11.
        - key: '03'
          title: ThisWorkbook
          desc: El módulo del libro entero. Ahí vive lo que corre al abrir o al guardar, también en la semana 11.

  - divider:
      eyebrow: Bloque 03
      title: Correr y ver correr
      lede: F5 corre la macro completa y solo ves el resultado. F8 la corre un renglón a la vez, y ahí es donde se aprende.
      block: 3

  - concept:
      eyebrow: Concepto clave
      title: El resaltado amarillo va un renglón adelantado
      lead: >-
        Cuando presionas F8, el editor pinta de amarillo el renglón que está a punto de
        correr, no el que acaba de correr. Es la confusión más común de la primera clase:
        lo que ves resaltado todavía no pasó. Vuelve a presionar F8 y entonces sí ocurre,
        y el amarillo se mueve al siguiente.
      panel:
        label: Cómo se comprueba
        title: Acomoda la hoja al lado y no le quites la vista
        note: >-
          Presiona F8 sobre un renglón que escribe en una celda. La celda no cambia hasta
          el siguiente F8. Eso deja clarísimo cuál es el renglón pendiente.
      steps:
        - text: F8 resalta el renglón pendiente
        - text: F8 otra vez lo ejecuta
        - text: El amarillo pasa al siguiente
          loop: ↺ y Ctrl + Break detiene una macro que se fue de más

  - table:
      eyebrow: Bloque 03 · Teclas
      title: Las cinco teclas de esta sesión
      headers: [Tecla, Qué hace, Cuándo la usas]
      rows:
        - ["Alt + F11", "Cambia entre la hoja y el editor", "Todo el tiempo"]
        - ["F5", "Corre el procedimiento completo", "Cuando ya confías en él"]
        - ["F8", "Corre un renglón y se detiene", "Cuando algo no hace lo que esperabas"]
        - ["Ctrl + G", "Abre la ventana Inmediato", "Para preguntar cuánto vale algo"]
        - ["Ctrl + Break", "Detiene la macro que está corriendo", "Cuando se fue en un ciclo sin fin"]

  - trace:
      eyebrow: Bloque 03 · Traza
      title: La macro de la semana pasada, renglón por renglón
      headers: [F8, Renglón resaltado, Qué pasó al presionarlo, La columna D]
      rows:
        - ["1", "Sub HideColumn()", "Entra al procedimiento", "Visible"]
        - ["2", "Columns(\"D:D\")… = True", "Todavía nada", "Visible"]
        - ["3", "Columns(\"D:D\")… = False", "Se ocultó", "Oculta"]
        - ["4", "End Sub", "Se volvió a mostrar", "Visible"]
      verdict: El renglón resaltado es el pendiente, no el ejecutado. Por eso la columna se oculta en el paso 3 y no en el 2.

  - pitfalls:
      eyebrow: Bloque 03 · Errores comunes
      title: Cuatro tropiezos de la primera clase en el editor
      items:
        - label: Error 01
          title: Escribir fuera de un procedimiento
          desc: Una instrucción suelta arriba del primer Sub no corre nunca. Todo lo que se ejecuta vive entre Sub y End Sub.
        - label: Error 02
          title: Buscar la macro en el cuadro equivocado
          desc: El cuadro de macros solo lista los módulos estándar. Si la escribiste en la hoja, ahí no aparece.
        - label: Error 03
          title: Correr con el cursor en otro procedimiento
          desc: F5 corre el procedimiento donde está parado el cursor, no el que estabas leyendo.
        - label: Error 04
          title: Cerrar el editor creyendo que guardó
          desc: Cerrar la ventana no guarda nada. El código se guarda cuando guardas el libro, y tiene que ser .xlsm.

  - quiz:
      eyebrow: Verificación rápida
      question: Presionas F8 dos veces desde el inicio. ¿Qué está resaltado?
      filename: BasicConcepts.bas
      lang: vba
      source: |
        Sub Ejemplo()
            Range("A1").Value = 10
            Range("A2").Value = 20
        End Sub
      options:
        - "Range(\"A1\") y A1 todavía está vacía"
        - "Range(\"A2\"), A1 ya vale 10 y A2 sigue vacía"
        - "Range(\"A2\") y las dos celdas ya tienen valor"
        - "End Sub, porque F8 corre de dos en dos"

  - lab:
      eyebrow: Laboratorio
      title: Escribe tu primer procedimiento a mano
      brief: Inserta un módulo estándar, escribe un procedimiento llamado SaludoNomina que muestre un mensaje con tu nombre y el área de la que vienes, y córrelo con F8 hasta el final. Después corre con F8 la macro que grabaste la semana pasada, con la hoja visible al lado.
      blocks:
        - label: Entrega
          text: El módulo exportado como .bas, más una captura del editor con el resaltado amarillo a media macro
        - label: Restricción
          text: Escrito a mano. Si lo grabas, la grabadora te va a dar Range y Select en vez de MsgBox.
        - label: Pista
          text: Botón derecho sobre el módulo, Exportar archivo, y sale el .bas que se entrega

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: Cuatro palabras, de afuera hacia adentro
          desc: Proyecto, módulo, procedimiento e instrucción. Todo lo que sigue en el semestre se cuelga de ese árbol
        - title: El amarillo es el renglón pendiente
          desc: Lo que está resaltado todavía no ocurrió, y confundir eso hace que un error parezca estar un renglón antes
        - title: Dónde lo pones cambia si aparece
          desc: El cuadro de macros solo lista módulos estándar, y la hoja y ThisWorkbook se usan para eventos

  - homework:
      eyebrow: Tarea
      title: Entrega y criterios de evaluación
      brief: >-
        Entrega un módulo con tres procedimientos escritos a mano: uno que muestre un
        mensaje, uno que escriba tu nombre en A1, y uno que llame a los dos anteriores
        con Call.
      meta:
        - [Entrega, Antes de la semana 3]
        - [Formato, Blackboard · .bas y .xlsm]
        - [Peso, Parte del 20 % de tareas]
      rubric:
        - ["Estructura", "30 %", "Tres procedimientos con nombre propio, cada uno cerrado con End Sub"]
        - ["Ejecución", "40 %", "Los tres corren desde el cuadro de macros sin marcar error"]
        - ["El tercero", "30 %", "Llama a los otros dos y no repite su código"]

  - closing:
      title: Preguntas
      subtitle: >-
        La siguiente sesión, los tipos de dato y las variables: cómo se guarda un valor y
        por qué Option Explicit ahorra tardes enteras.
      meta:
        - [Correo, descobarc@up.edu.mx]
        - [Mensajería, Google Chat institucional]
        - [Repositorio, github.com/davidowa/learning-hub]
