        - ["Código", "20 %", "Procedimientos, ciclos y condiciones"]
        - ["Errores", "20 %", "Manejo de errores y protección"]
        - ["Narrativa", "15 %", "Que el reporte se entienda solo"]
        - ["Diseño", "10 %", "Por qué lo hiciste así"]
        - ["Evidencia", "5 %", "Capturas dentro del texto"]

  - steps:
      eyebrow: Bloque 03 · La entrega
      title: Cinco cosas sobre cómo se entrega
      items:
        - label: '01'
          title: El libro y el código
          desc: El .xlsm más los módulos exportados, para poder leerlos sin abrir Excel.
        - label: '02'
          title: Un reporte escrito
          desc: Qué automatizaste, por qué así, y qué decidiste dejar fuera.
        - label: '03'
          title: Se presenta en clase
          desc: Con revisión de pares. Vas a ver el proyecto de otro equipo y ellos el tuyo.
        - label: '04'
          title: Si no corre, el techo es 30 %
          desc: Un libro que no abre o que truena a la primera no llega a la mitad.
        - label: '05'
          title: Se califica individual
          desc: Aunque el trabajo sea en equipo, cada quien responde por lo que entregó.

  - lab:
      eyebrow: Laboratorio
      title: Cerrar el proyecto
      brief: Agrégale a tu proyecto una hoja de resumen con una tabla dinámica creada desde macro, un manejador de errores en el procedimiento principal, y la protección con UserInterfaceOnly repuesta al abrir.
      blocks:
        - label: Restricción
          text: El origen de la dinámica tiene que ser una tabla, para que crezca con los datos
        - label: Entregable
          text: El .xlsm y los módulos exportados, con el resumen, el manejador y la protección
        - label: Criterio
          text: Que al agregar renglones y volver a correr, el resumen los incluya sin tocar nada

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarte
      items:
        - title: La dinámica lee una copia
          desc: Refrescar arregla los datos que cambiaron, pero no los renglones que llegaron
        - title: Resume Next no maneja
          desc: Deja Err puesto, y tres líneas después le echa la culpa a quien no fue
        - title: UserInterfaceOnly no se guarda
          desc: Hay que reponerla al abrir el libro, y eso vive en ThisWorkbook

  - homework:
      eyebrow: Tarea
      title: Entrega y criterios de evaluación
      brief: Termina el proyecto y prepárate para presentarlo. En el reporte escrito explica una decisión de diseño que tomaste y qué alternativa descartaste.
      meta:
        - [Entrega, Antes de la sesión 17]
        - [Formato, Blackboard · .xlsm + módulos + reporte]
        - [Peso, 20 % de la calificación final]
      rubric:
        - ["El libro", "70 %", "Corre con datos nuevos, con errores y protección atendidos"]
        - ["El reporte", "25 %", "Narrativa clara y las decisiones justificadas"]
        - ["La evidencia", "5 %", "Capturas y salidas integradas al texto, no pegadas al final"]

