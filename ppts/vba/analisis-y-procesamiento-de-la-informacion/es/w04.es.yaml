slides:
  - cover:
      kicker: Facultad de Empresariales · 2026
      unit: Semana 04 · Unidad 1 · Operaciones y nombres de rango
      title: Análisis y Procesamiento de la Información
      subtitle: Los siete operadores, el orden en que VBA los resuelve, y por qué la misma cuenta da distinto en la celda.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, TIA503 · Empresariales]
        - [Sesión, 4 de 17]
      notes: |
        Noventa minutos. Veinte en operadores, veinticinco en las diferencias con la hoja,
        y el resto poniendo nombres a los rangos de la tabla de amortización.

        La sesión tiene un hallazgo que conviene no adelantar. La misma expresión escrita
        en una celda y escrita en VBA da resultados distintos, y no en un caso raro:
        pasa con la potencia de un negativo, con el residuo de un negativo y con la suma
        de dos textos. Las tres están verificadas en Excel 16.0, las dos versiones, y
        salen en la tabla del bloque 2. Deja que el grupo apueste antes de mostrarla.

        Un detalle de esa tabla: la verificación se corrió en un Excel en inglés, donde la
        función se llama MOD y el separador es la coma. La diapositiva la escribe como
        RESIDUO con punto y coma, que es lo que va a ver el grupo. El valor es el mismo.

        El otro golpe es la tasa mensual. Todos esperan 0.0094 y VBA imprime
        9.48879293458305E-03. No es un error, es notación científica, y Format lo arregla.

        El código sale de
        docs/en/courses/vba-course/03 - Arithmetic Operators/ (los dos módulos) y de
        04 - Name Cells/DefineNameCells.bas.

        Cuidado con ese último archivo: trae Sub DefineNameCells declarado dos veces en
        el mismo módulo, así que no compila tal como está. Las diapositivas citan la
        segunda versión, que es la que tiene el código.

