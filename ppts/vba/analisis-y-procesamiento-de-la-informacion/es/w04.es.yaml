  - table:
      eyebrow: Bloque 01 · Aritméticos · 2 de 2
      title: Y los tres que la hoja no escribe así
      headers: [Operador, Qué hace, Ejemplo, Resultado]
      rows:
        - ["\\", "División entera", "5 \\ 3", "1"]
        - ["Mod", "Residuo", "5 Mod 3", "2"]
        - ["^", "Potencia", "5 ^ 3", "125"]

  - code:
      eyebrow: Bloque 01 · Precedencia
      title: El orden en que VBA resuelve una expresión
      filename: Operadores.bas
      lang: vba
      source: |
        Sub Precedencia()
            ' 1. Paréntesis  2. ^  3. * /  4. \  5. Mod  6. + -
            Dim sinParentesis As Double
            Dim conParentesis As Double

            sinParentesis = 5 + 3 * 2
            conParentesis = (5 + 3) * 2

            Range("A1").Value = sinParentesis
            Range("A2").Value = conParentesis
        End Sub
      annotations:
        - label: El resultado
          text: 11 y 16. El producto se resuelve antes que la suma, igual que en la hoja.
        - label: Las dos divisiones
          text: La entera y el residuo tienen su propio escalón, debajo de la división normal.
        - label: Los paréntesis
          text: Cuestan cero y quitan toda duda. Ponlos aunque no hagan falta.
        - label: Riesgo
          text: Las dos líneas corren y devuelven un número. Solo una contesta la pregunta que hiciste.
          accent: true

  - divider:
      eyebrow: Bloque 02
      title: La celda contra VBA
      lede: Son dos motores distintos dentro del mismo programa. Casi siempre coinciden, y donde no coinciden nadie lo avisa.
      block: 2

  - table:
      eyebrow: Bloque 02 · Verificado en Excel 16.0
      title: Tres expresiones que dan distinto según dónde las escribas
      headers: [En la celda, En VBA, Qué devuelve cada uno]
      rows:
        - ["=-3^2", "-3 ^ 2", "9 contra -9"]
        - ["=\"5\"+\"3\"", "\"5\" + \"3\"", "8 contra 53"]
        - ["=RESIDUO(-5;3)", "-5 Mod 3", "1 contra -2"]
        - ["=2^3^2", "2 ^ 3 ^ 2", "64 y 64, aquí sí coinciden"]

  - method:
      eyebrow: Bloque 02 · Por qué pasa
      title: Tres reglas distintas, no tres errores
      statement: La hoja y VBA son dos motores dentro del mismo programa, y en tres puntos tomaron decisiones opuestas.
      points:
        - label: El signo menos
          text: En la hoja se aplica antes que la potencia, así que -3^2 es 9. En VBA se aplica después, y da -9.
        - label: El signo más
          text: En la hoja convierte los textos a número y suma. En VBA, si los dos lados son texto, los pega.
        - label: El residuo
          text: La función de la hoja devuelve el signo del divisor. Mod devuelve el del dividendo.

  - code_output:
      eyebrow: Bloque 02 · La tasa mensual
      title: El resultado que todos leen como un error
      filename: Tasa.bas
      lang: vba
      output_label: Lo que se ve
      source: |
        Dim tasaAnual As Double
        Dim tasaMensual As Double

        tasaAnual = 0.12
        tasaMensual = ((1 + tasaAnual) ^ (1 / 12)) - 1
      output: |
        9.48879293458305E-03
      notes: |
        Verificado. La misma cuenta en una celda muestra 0.009489, porque la celda trae
        formato. En VBA el número es idéntico, lo que cambia es cómo se escribe.

  - code:
      eyebrow: Bloque 02 · La solución
      title: Format para leerlo, Round para recortarlo
      filename: Tasa.bas
      lang: vba
      source: |
        Sub TasaLegible()
            Dim tasaMensual As Double
            tasaMensual = ((1 + 0.12) ^ (1 / 12)) - 1

            Range("B1").Value = tasaMensual
            Range("B1").NumberFormat = "0.00%"

            Range("B2").Value = Format(tasaMensual, "0.00%")
            Range("B3").Value = Round(tasaMensual, 6)
        End Sub
      annotations:
        - label: NumberFormat
          text: Deja el número completo en la celda y solo cambia cómo se ve. B1 muestra 0.95 %.
        - label: Format
          text: Devuelve texto ya formateado. Sirve para un mensaje, no para seguir calculando.
        - label: Round
          text: Recorta el número de verdad. Round(tasa, 6) deja 0.009489 y ya perdiste lo demás.
        - label: Riesgo
          text: Format convierte a texto. Si después sumas eso, VBA lo pega en vez de sumarlo.
          accent: true

  - pitfalls:
      eyebrow: Bloque 02 · Errores comunes
      title: Cuatro cuentas que dan un número equivocado
      items:
        - label: Error 01
          title: Sumar dos textos con más
          desc: "\"5\" + \"3\" da 53, no 8. Con un número de cada lado sí suma, y esa inconsistencia es la trampa."
        - label: Error 02
          title: Elevar un negativo
          desc: En VBA -3 ^ 2 es -9 porque el signo se aplica al final. Escribe (-3) ^ 2 si querías 9.
        - label: Error 03
          title: Dividir entre cero
          desc: La celda muestra un error y sigue. VBA se detiene con error 11 y la macro no termina.
        - label: Error 04
          title: Dividir enteros con la diagonal
          desc: "7.5 \\ 2 no da 3.75 ni 3. Redondea los dos lados primero, así que da 4."

  - divider:
      eyebrow: Bloque 03
      title: Nombres de rango
      lede: Una fórmula con B3 hay que ir a verificarla. Una con Tasa_Mensual se revisa sin moverse de donde está.
      block: 3

  - code:
      eyebrow: Bloque 03 · Crear un nombre
      title: Names.Add, y el rango deja de ser una coordenada
      filename: DefineNameCells.bas
      lang: vba
      source: |
        Sub DefinirNombres()
            ThisWorkbook.Names.Add _
                Name:="MontoPrestamo", RefersTo:="=Sheet1!$B$1"
            ThisWorkbook.Names.Add _
                Name:="TasaAnual", RefersTo:="=Sheet1!$B$2"

            Range("MontoPrestamo").Value = 500000
            Range("TasaAnual").Value = 0.12
        End Sub
      annotations:
        - label: Name
          text: El nombre que vas a usar. Sin espacios, y no puede parecerse a una dirección de celda.
        - label: RefersTo
          text: Empieza con signo igual y lleva la hoja y la dirección absoluta, con los signos de pesos.
        - label: Después
          text: Range("MontoPrestamo") funciona igual que Range("B1"), en el código y en la hoja.
        - label: Riesgo
          text: Names.Add dos veces no marca error. Redefine el nombre en silencio.
          accent: true

  - table:
      eyebrow: Bloque 03 · Verificado
      title: Lo que devuelve un nombre ya creado
      headers: [Lo que preguntas, Lo que contesta]
      rows:
        - ["Range(\"MontoPrestamo\").Address", "$B$1"]
