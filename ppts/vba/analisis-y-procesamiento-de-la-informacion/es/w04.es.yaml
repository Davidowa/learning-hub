        - ["Range(\"DatosCliente\").Address", "$A$1:$B$5"]
        - ["Range(\"DatosCliente\").Cells.Count", "10"]
        - ["Names(\"MontoPrestamo\").RefersTo", "=Sheet1!$B$1"]

  - compare:
      eyebrow: Bloque 03 · Por qué vale la pena
      title: La misma fórmula, con coordenadas y con nombres
      before:
        label: Con coordenadas
        file: hoja.xlsx
        lang: excel
        code: |
          =B1*B3
          =B1+B12-B13
      after:
        label: Con nombres
        file: hoja.xlsx
        lang: excel
        code: |
          =MontoPrestamo*TasaMensual
          =SaldoInicial+Interes-Capital
      note: >-
        La primera hay que ir a verificarla celda por celda. La segunda se lee de corrido
        y el error salta solo. Es la misma cuenta, y en la revisión del proyecto una se
        defiende en diez segundos y la otra no.

  - quiz:
      eyebrow: Verificación rápida
      question: ¿Qué queda en A1 y en A2 al terminar?
      filename: Operadores.bas
      lang: vba
      source: |
        Sub Cuentas()
            Range("A1").Value = -3 ^ 2
            Range("A2").Value = 7.5 \ 2
        End Sub
      options:
        - "9 y 3.75, como en la hoja"
        - "-9 y 4, porque el signo va al final y la diagonal redondea"
        - "9 y 3, porque la división entera trunca"
        - "Error, porque no se puede elevar un negativo"

  - lab:
      eyebrow: Laboratorio
      title: Ponle nombre a la tabla de amortización
      brief: Abre la tabla de amortización del módulo 00 y escribe un procedimiento que cree nombres para el monto, la tasa anual, la tasa mensual y el pago. Después calcula la tasa mensual con la fórmula de la potencia y déjala en su celda con formato de porcentaje.
      blocks:
        - label: Entrega
          text: El .xlsm con los nombres creados y el módulo exportado, en Blackboard
        - label: Restricción
          text: Ninguna fórmula de la hoja puede quedar con coordenadas. Todas con nombres.
        - label: La prueba
          text: Inserta un renglón arriba de la tabla. Si algo se rompe, el nombre no estaba bien puesto.

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: La hoja y VBA no siempre coinciden
          desc: La potencia de un negativo, la suma de dos textos y el residuo de un negativo dan distinto en cada motor
        - title: Notación científica no es un error
          desc: E-03 significa correr el punto tres lugares. El número es correcto y Format lo vuelve legible
        - title: Un nombre se lee, B3 se verifica
          desc: La fórmula con nombres se entiende de corrido, y esa diferencia es la que se nota en la revisión del proyecto

  - homework:
      eyebrow: Tarea
      title: Entrega y criterios de evaluación
      brief: >-
        Escribe un procedimiento que reciba el monto, la tasa anual y el plazo desde la
        hoja, calcule la tasa mensual y el pago aproximado, y deje los dos en celdas con
        nombre y con formato.
      meta:
        - [Entrega, Antes de la semana 5]
        - [Formato, Blackboard · .bas y .xlsm]
        - [Peso, Parte del 20 % de tareas]
      rubric:
        - ["Operadores", "30 %", "La fórmula usa la precedencia correcta y lleva paréntesis donde hacen falta"]
        - ["Nombres", "40 %", "Los cuatro parámetros tienen nombre y las fórmulas los usan"]
        - ["Formato", "30 %", "La tasa se ve como porcentaje y el importe como moneda"]

