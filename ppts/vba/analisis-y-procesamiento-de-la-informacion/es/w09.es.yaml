slides:
  - cover:
      kicker: Facultad de Empresariales · 2026
      unit: Semana 09 · Unidad 3 · Repetición
      title: Análisis y Procesamiento de la Información
      subtitle: For cuenta, For Each recorre. Y la diferencia entre borrar de arriba hacia abajo o al revés.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, TIA503 · Empresariales]
        - [Sesión, 9 de 17]
      notes: |
        Noventa minutos. Veinticinco en For, veinticinco en For Each, y el resto
        recorriendo una base de verdad.

        Es la sesión donde la macro por fin hace lo que ninguna hoja hace sola. Hasta hoy
        cada instrucción tocaba una celda. A partir de hoy una instrucción toca mil.

        El ciclo del módulo 08 escribe ciento veinte columnas desde B3 y termina en DQ3.
        Verificado. Es exactamente la última columna de la tabla de amortización del
        módulo 00, y vale la pena decirlo en voz alta: la tabla que en la semana 1 se veía
        como seiscientas celdas hechas a mano ahora cabe en cuatro renglones.

        Las dos verificaciones que hay que dejar caer despacio son el borrado y la
        velocidad. Borrar seis filas hacia adelante deja tres, porque al borrar la uno la
        dos se convierte en la uno y el contador ya va en dos. Hacia atrás deja cero. Y
        veinte mil celdas escritas una por una tardan 0.91 segundos, contra 0.02 de un
        solo golpe con un arreglo.

        El código sale de
        docs/en/courses/vba-course/08 - Repetition Statement/RepetitionStatements.bas.

