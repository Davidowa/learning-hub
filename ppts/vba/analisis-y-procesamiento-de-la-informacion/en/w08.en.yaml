  - method:
      eyebrow: Block 03 · What is actually asked
      title: You may consult everything, and you still have to know
      statement: The exam does not measure what you memorised. It measures whether you can read a requirement, write the macro and defend it.
      points:
        - label: What is assessed
          text: That the code runs, that it does what the brief asks, and that it uses a variable range instead of a fixed address
        - label: The defence
          text: I may ask you to talk through one of your own procedures out loud. Reading it is not explaining it.
        - label: How to prepare
          text: By redoing the assignments without looking at your solution. Consulting is fast once you know what to look for.

  - quiz:
      eyebrow: Quick check
      question: Cell A1 is empty. What goes into B1?
      filename: Decisions.bas
      lang: vba
      source: |
        If Range("A1").Value = 0 Then
            Range("B1").Value = "No sale"
        Else
            Range("B1").Value = "Sale"
        End If
      options:
        - "Sale, because the cell is empty and does not equal zero"
        - "No sale, because an empty cell does equal zero"
        - "Nothing, because comparing an empty cell raises an error"
        - "It depends on the cell's format"

  - lab:
      eyebrow: Lab
      title: Classify a customer portfolio
      brief: Take a customer database from your own area and write a macro that sorts every row into three tiers by balance. Write it twice, once with a chain of ElseIf and once with Select Case, and decide which one reads better for this case.
      blocks:
        - label: Submission
          text: The module with both procedures and a note on which you chose, on Blackboard
        - label: Constraint
          text: No customer may go unclassified. Anything matching nothing lands in the Else.
        - label: The test
          text: Add a row with an empty balance. If it classifies as zero, you know what is missing.

  - takeaways:
      eyebrow: Summary
      title: Three things to take away
      items:
        - title: Comparing text is not comparing numbers
          desc: As text 10 is less than 9, and Norte is not norte. A code captured as text sorts differently
        - title: An empty cell equals zero
          desc: And also an empty string. Asking about zero does not separate the missing value from a real zero
        - title: The order of the ElseIf decides
          desc: It stops at the first true condition, so it runs from the strictest test to the loosest

  - homework:
      eyebrow: Assignment
      title: Submission and grading criteria
      brief: >-
        On the amortization table, write a macro that walks every period and marks the
        ones that have already paid off more than half the principal. Use the variable
        range from week 6 and sort them into three tiers.
      meta:
        - [Due, Before week 9]
        - [Format, Blackboard · .bas and .xlsm]
        - [Weight, Part of the 20 % for assignments]
      rubric:
        - ["Conditions", "40 %", "All three branches exist and no row goes unclassified"]
        - ["Variable range", "30 %", "It walks whatever is there, not a hand-typed address"]
        - ["Empties", "30 %", "A period with no value is not counted as zero"]

