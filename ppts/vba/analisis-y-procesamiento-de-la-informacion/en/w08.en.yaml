  - divider:
      eyebrow: Block 01
      title: Comparing
      lede: A comparison returns neither a number nor a string. It returns true or false, and everything else is decided from that.
      block: 1

  - table:
      eyebrow: Block 01 · All six
      title: Every comparison operator VBA has
      headers: [Operator, What it asks, Example, Result]
      rows:
        - ["=", "Are they equal?", "5 = 5", "True"]
        - ["<>", "Are they different?", "5 <> 10", "True"]
        - [">", "Is the first greater?", "5 > 10", "False"]
        - ["<", "Is the first smaller?", "5 < 10", "True"]
        - [">=", "Greater or equal?", "5 >= 5", "True"]
        - ["<=", "Smaller or equal?", "5 <= 10", "True"]

  - code:
      eyebrow: Block 01 · One sign, two jobs
      title: The same symbol doing two different things
      filename: ComparissonOperators.bas
      lang: vba
      source: |
        Sub Compare()
            Dim a As Integer
            Dim b As Integer
            Dim areEqual As Boolean

            a = 5
            b = 5
            areEqual = a = b

            MsgBox "Is a equal to b? " & areEqual
        End Sub
      annotations:
        - label: The first equals
          text: Assigns. It stores whatever comes out of the right-hand side into areEqual.
        - label: The second equals
          text: Compares. It returns True or False, and that is the value being stored.
        - label: How to read it
          text: Right to left. a = b resolves first, then the result is stored.
        - label: Risk
          text: VBA has no two separate symbols the way other languages do. Context decides which one you wrote.
          accent: true

  - table:
      eyebrow: Block 01 · Verified
      title: Comparing text is not comparing numbers
      headers: [Comparison, Returns, Why]
      rows:
        - ["10 < 9", "False", "As numbers, nine is the smaller one"]
        - ["\"10\" < \"9\"", "True", "As text, the 1 sorts before the 9"]
        - ["\"Norte\" = \"norte\"", "False", "VBA respects case by default"]
        - ["\"abc\" < \"abd\"", "True", "Letter by letter, to the first that differs"]

  - divider:
      eyebrow: Block 02
      title: Combining and deciding
      lede: Three words for joining conditions, and two ways of writing the decision that comes out of them.
      block: 2

  - table:
      eyebrow: Block 02 · All three
      title: And, Or and Not, with their truth table
      headers: [Combination, And, Or]
      rows:
        - ["True with True", "True", "True"]
        - ["True with False", "False", "True"]
        - ["False with True", "False", "True"]
        - ["False with False", "False", "False"]
        - ["Not True", "False", "Not flips whatever it gets"]
        - ["Not False", "True", "and it takes one condition only"]

  - code:
      eyebrow: Block 02 · The chain
      title: If, ElseIf and Else, in the order that matters
      filename: ConditionalStatements.bas
      lang: vba
      source: |
        Sub Classify()
            Dim grade As Double
            grade = 7.5

            If grade >= 9 Then
                MsgBox "A"
            ElseIf grade >= 8 Then
                MsgBox "B"
            ElseIf grade >= 7 Then
                MsgBox "C"
            Else
                MsgBox "Fail"
            End If
        End Sub
      annotations:
        - label: Order rules
          text: Checked top to bottom, stopping at the first true one. Verified, 7.5 gives C.
        - label: Why high to low
          text: If the first test were greater or equal to seven, a nine would land there and never reach the A.
        - label: Else
          text: Catches everything that did not match. Without it, a grade of five produces nothing at all.
        - label: Risk
          text: ElseIf is one word. Else If as two opens a fresh If that demands its own End If.
          accent: true

  - compare:
      eyebrow: Block 02 · The other way
      title: The same decision, written with Select Case
      before:
        label: With a chain of ElseIf
        file: Module1.bas
        lang: vba
        code: |
          If grade >= 9 Then
              level = "A"
          ElseIf grade >= 8 Then
              level = "B"
          End If
      after:
        label: With Select Case
        file: Module1.bas
        lang: vba
        code: |
          Select Case grade
              Case Is >= 9:   level = "A"
              Case 8 To 8.99: level = "B"
          End Select
      note: >-
        Both give C for 7.5, verified. Select Case wins when every condition asks about
        the same variable, and it takes ranges with To and comparisons with Is. If wins
        when each branch asks about something different.

  - pitfalls:
      eyebrow: Block 02 · Common errors
      title: Four comparisons that answer the opposite
      items:
        - label: Error 01
          title: True is not one, it is minus one
          desc: "CInt(True) is -1. That is why (5 > 1) * 3 gives -3, and adding two true conditions gives -2."
        - label: Error 02
          title: Norte does not equal norte
          desc: VBA compares text case-sensitively. A database with mixed capture never adds up when grouped.
        - label: Error 03
          title: An empty cell equals zero
          desc: It also equals an empty string, both true. Asking whether it is zero does not find the missing value.
        - label: Error 04
          title: And evaluates both sides
          desc: It does not stop at the first False. The right-hand condition runs even after the left one failed.

