slides:
  - cover:
      kicker: Facultad de Empresariales · 2026
      unit: Week 08 · Unit 3 · Decisions and the first midterm
      title: Information Analysis and Processing
      subtitle: Compare, combine, decide. And the four comparisons that answer the opposite of what they look like.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, TIA503 · Empresariales]
        - [Session, 8 of 17]
      notes: |
        Ninety minutes. Forty on decisions, twenty on the traps, the rest on midterm
        logistics.

        This opens unit 3 and closes the first half of the course. The midterm covers
        units 1, 2 and 3, which is everything so far, and it is worth twenty per cent.

        The four traps in block 2 are verified in Excel 16.0 and the room should bet
        before they are shown. The most useful one for the rest of the term is that VBA
        compares text case-sensitively, so Norte and norte are different. That comes back
        in week 13 cleaning databases.

        The other one worth its weight is that an empty cell equals zero and also equals
        an empty string, both true. Asking whether it is zero does not separate a
        captured zero from a value that never arrived, and that changes an average.

        The code comes from modules 05, 06 and 07 of
        docs/en/courses/vba-course/.

