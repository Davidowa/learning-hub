  - method:
      eyebrow: Honour Code
      title: What counts as your own work
      statement: You may lean on artificial intelligence to understand. You may not hand in code you cannot explain.
      points:
        - label: Allowed
          text: Asking it to explain an error, a property or an object you do not recognise
        - label: Not allowed
          text: Handing in a generated macro you could not read line by line if I asked
        - label: How it is checked
          text: In the review I pick a part and ask you to explain it. Reading it aloud is not explaining it.

  - divider:
      eyebrow: Block 03
      title: The first macro
      lede: Excel ships the recorder hidden behind a tab that comes switched off. Switching it on is the first step of the term.
      block: 3

  - steps:
      eyebrow: Block 03 · Before recording
      title: Four steps to get the environment ready
      items:
        - label: '01'
          title: Switch on the Developer tab
          desc: File, Options, Customize Ribbon, Main Tabs, and tick Developer
        - label: '02'
          title: Save as .xlsm
          desc: An .xlsx cannot hold code. Excel warns you, and saving anyway leaves the file without it.
        - label: '03'
          title: Enable macros on open
          desc: Excel disables them by default and offers to switch them on in a bar above the sheet
        - label: '04'
          title: Open the editor
          desc: Alt + F11, or the Visual Basic button on the Developer tab. That is where the code lives.

  - figure:
      eyebrow: Block 03 · Step 01 done
      title: What the Developer tab looks like once it is on
      image: img/en/excel-developer-tab.png
      caption: >-
        Left to right: Visual Basic and Macros open the editor and the list, Record Macro
        starts the recorder, and Macro Security is where the file refuses to run code.
        Everything this session needs lives in the Code group.
      alt: The Excel ribbon with the Developer tab active, showing the Code, Add-ins, Controls and XML groups.

  - figure:
      eyebrow: Block 03 · The recorder asks four things
      title: The dialog that opens before anything is recorded
      image: img/en/record-macro-dialog.png
      caption: >-
        The name has no spaces and cannot start with a digit. Store macro in decides
        whether the macro travels with this file or follows you into every workbook.
        Description is the only place the recorder will not write for you.
      alt: The Record Macro dialog, with Macro name, Shortcut key, Store macro in, and Description.

  - code:
      eyebrow: Block 03 · What the recorder wrote
      title: A macro nobody typed
      filename: Module2.bas
      lang: vba
      source: |
        Sub HideColumn()
        '
        ' HideColumn Macro
        '

        '
            Columns("D:D").EntireColumn.Hidden = True
            Columns("D:D").EntireColumn.Hidden = False
        End Sub
      annotations:
        - label: The header
          text: Lines that open with an apostrophe are comments. The recorder wrote them on its own and VBA ignores them at run time.
        - label: Sub and End Sub
          text: They delimit a procedure. Everything that executes in VBA lives inside one.
        - label: Two lines
          text: You hid column D and then brought it back. The recorder wrote down both, in order.
        - label: Risk
          text: >-
            The macro runs without error and leaves nothing done. Verified in Excel: when
            it ends, column D is still visible.
          accent: true

  - table:
      eyebrow: Block 03 · How to read one line
      title: Object, property and value
      headers: [Piece, In grammar, In the line above]
      rows:
        - ["Object", "The noun", "Columns(\"D:D\")"]
        - ["Property", "The adjective", "Hidden"]
        - ["Value", "What you assign to it", "True"]
        - ["Method", "The verb, when there is one", "Select, Copy, Delete"]
        - ["The dot", "The possessive, read it as «of»", "Of that column, its EntireColumn"]

  - compare:
      eyebrow: Block 03 · The edit
      title: The recorder starts the work, you finish it
      before:
        label: What it recorded
        file: Module2.bas
        lang: vba
        code: |
          Sub HideColumn()
              Columns("D:D").EntireColumn.Hidden = True
              Columns("D:D").EntireColumn.Hidden = False
          End Sub
      after:
        label: What is left after editing
        file: Module2.bas
        lang: vba
        code: |
          Sub HideColumn()
              Columns("D:D").EntireColumn.Hidden = True
          End Sub
      note: >-
        One line fewer, and the macro finally does what its name promises. This is the
        move that repeats all term: record so you do not type from scratch, and read so
        you can cut what the recorder wrote down by mistake.

  - pitfalls:
      eyebrow: Block 03 · Common errors
      title: Four ways to lose the macro
      items:
        - label: Error 01
          title: Saving as .xlsx
          desc: The plain format holds no code. Excel warns you, and if you accept, the file is saved without it and the macro is gone.
        - label: Error 02
          title: Trusting what you recorded
          desc: The recorder writes down every action, including the one you undid. Read the code before you rely on it.
        - label: Error 03
          title: Recording onto one fixed cell
          desc: It writes down the exact cell you touched. If next month the data starts lower, it writes in the wrong place.
        - label: Error 04
          title: Opening the file without enabling
          desc: The button does nothing and no error appears. The warning was in the bar on top and got dismissed unread.

  - quiz:
      eyebrow: Quick check
      question: What has this macro done once it finishes?
      filename: Module2.bas
      lang: vba
      source: |
        Sub HideColumn()
            Columns("D:D").EntireColumn.Hidden = True
            Columns("D:D").EntireColumn.Hidden = False
        End Sub
      options:
        - "Column D ends up hidden"
        - "Column D ends up visible, just as before running it"
        - "It raises an error, because the property is set twice"
        - "It hides column D and also row 4"

  - lab:
      eyebrow: Lab
      title: Record your first macro
      brief: Open the module 00 amortization table, save it as .xlsm and record a macro that formats the two rate cells as percentages. Stop recording, open the editor and read line by line what ended up written.
      blocks:
        - label: Submission
          text: The .xlsm file with the recorded macro, uploaded to Blackboard
        - label: Constraint
          text: Delete from the code any line that came from a click you undid while recording
        - label: If it fails
          text: If the button does nothing, check that you enabled macros when you opened the file

  - takeaways:
      eyebrow: Summary
      title: Three things to take away
      items:
        - title: The recorder is the bridge
          desc: It writes the code for you, and at first all you have to do is read it and cut what does not belong
        - title: A click leaves no trace, a macro does
          desc: Same result on screen, but only one of the two can be repeated, reviewed and defended next month
        - title: The code lives in an .xlsm
          desc: Saving as .xlsx erases it, and on open Excel disables it until you decide to switch it on

  - homework:
      eyebrow: Assignment
      title: Submission and grading criteria
      brief: Get Excel ready for the term and hand in the amortization workbook with a recorded macro you can run twice in a row and get the same result.
      meta:
        - [Due, Before week 2]
        - [Format, Blackboard · .xlsm file]
        - [Weight, Part of the 20 % for assignments]
      rubric:
        - ["Environment", "30 %", "The Developer tab is visible and the file is an .xlsm"]
        - ["Macro", "40 %", "It runs from the macro dialog and does what its name says"]
        - ["Reading", "30 %", "The code carries no leftover lines from undone clicks"]

