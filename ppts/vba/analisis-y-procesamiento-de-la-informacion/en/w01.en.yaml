  - concept:
      eyebrow: Integrative project
      title: What is handed in on week 16
      lead: >-
        A workbook that automates a real information-processing task from your own area,
        end to end. It takes raw data, cleans and orders it with macros, computes what the
        problem asks for and reports the result. The rule that defines it in one line:
        everything the user touches runs from VBA, not by hand.
      panel:
        label: How it is graded
        title: Seventy per cent the code, thirty the report
        note: >-
          If the workbook does not run, its maximum grade is 30 %. It is graded
          individually even when the work is done in teams, and every member has to be
          able to explain the whole solution.
      steps:
        - text: You pick the task and the data from your area
        - text: You automate it with macros, start to finish
        - text: You present it and defend your decisions
          loop: ↺ and it has to run on data it has never seen

