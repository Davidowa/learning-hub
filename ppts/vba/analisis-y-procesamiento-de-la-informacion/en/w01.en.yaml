  - divider:
      eyebrow: Block 01
      title: Why this course exists
      lede: Not to turn you into programmers. So you stop redoing by hand what the spreadsheet already knows how to do on its own.
      block: 1

  - stat:
      eyebrow: The module 00 amortization table
      value: '600'
      text: >-
        is how many cells that table takes up: a hundred and twenty periods, five rows each.
      note: Not one of the six hundred is hard. The problem is that there are six hundred, that next month they have to be rebuilt with another amount and another rate, and that afterwards nobody can say what moved.

  - concept:
      eyebrow: Key concept
      title: What a click leaves behind
      lead: >-
        Formatting a column with the mouse and formatting it with a macro give exactly the
        same result on screen. The difference shows up a month later. The click left
        nothing behind: you have to remember what you did and do it again. The macro left
        the procedure written down, and running it again costs a second.
      panel:
        label: The consequence
        title: A procedure nobody wrote down cannot be reviewed
        note: >-
          In an audit or in front of a client the question is rarely what the number was.
          It is how it was obtained, and who can repeat it when you are not there.
      steps:
        - text: You do the work once with the mouse
        - text: The recorder writes it down as code
        - text: Next month you run the code
          loop: ↺ and it comes out the same, on new data, without a single click

  - diagram:
      eyebrow: Block 01 · The cycle of the course
      title: Record, read, edit, run
      blocks:
        - label: Record
          title: Excel writes it
          desc: Once with the mouse, and Excel takes notes
        - label: Read
          title: You read the notes
          desc: An object, a property of it, a value
        - label: Edit
          title: You fix it
          desc: The rest of the term lives here
          dark: true
        - label: Run
          title: One button
          desc: Another month, another region, no clicks
      note: >-
        Microsoft describes its own recorder as a stable bridge between what you already
        know as an Office user and what you are about to know as a programmer, and puts a
        warning on the same page: the generated code can be confusing, because the
        recorder has to assume what you meant and those assumptions are not always right.

