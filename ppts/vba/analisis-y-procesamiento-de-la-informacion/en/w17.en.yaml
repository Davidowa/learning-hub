  - agenda:
      eyebrow: Agenda
      title: Three blocks of work
      cards:
        - title: The final exam
          desc: What it covers, how it is sat, and what you may bring with you
        - title: Reviewing what we measured
          desc: The errors you have already met and the traps that give no warning
        - title: Closing
          desc: How the grade adds up and what you take away from the term
        - title: Questions
          desc: Whatever is needed before sitting down to solve it

  - objectives:
      eyebrow: Session objectives
      title: By the end of the session you will be able to…
      items:
        - head: Sit the final exam
          sub: Over all six units, with your own material, on the classroom machine
        - head: Recognise an error by its number
          sub: The five that turned up this term and what causes each one
        - head: Spot a silent failure
          sub: The ones that give a wrong answer and raise nothing, which are the costly ones
        - head: Close the course
          sub: Knowing what you automated, how it was graded, and where it goes next

  - roadmap:
      eyebrow: Course map
      title: Where we are in the term
      phases:
        - label: 01 · Weeks 1–5
          title: Programming in VBA
          desc: Editor, types, variables, operations and input forms
          state: done
        - label: 02 · Weeks 6–7
          title: Editing recorded macros
          desc: Variable ranges, goal seek and bounded automation
          state: done
        - label: 03 · Weeks 8–12
          title: Decisions, loops and events
          desc: If, For, For Each, procedures, functions and custom classes
          state: done
        - label: 04 · Weeks 13–17
          title: Excel from macros
          desc: Cleaning, filters, PivotTables, the R1C1 formula and security
          state: now

  - concept:
      eyebrow: Where it started and where it ended
      title: From recording a button to handing in a workbook that runs itself
      lead: >-
        In week 1 you recorded a macro and could not read it. Today you hand in a workbook
        that cleans its data, sorts it, summarises it, builds its report with a chart,
        handles its errors and locks itself on opening. All of that is the same language.
      panel:
        label: What actually changed
        title: You stopped redoing the work
        note: >-
          The difference is not that you know more statements. It is that the work you used
          to do every month is now done by the workbook, and you check the result.
      steps:
        - text: You recorded a macro without understanding it
        - text: You opened it up and edited it
        - text: You wrote one the recorder could not
          loop: ↺ and from there it was deciding what to automate

  - divider:
      eyebrow: Block 01
      title: The final exam
      lede: It covers all six units. Sat at the machine, with your notes beside you, the same as both midterms.
      block: 1

  - table:
      eyebrow: Block 01 · What it covers
      title: The six units, and the weeks they were taught
      headers: [Unit, Weeks, Topic]
      rows:
        - ["1", "2 to 5", "Editor, types and data entry"]
        - ["2", "1, 6 and 7", "Recording and variable ranges"]
        - ["3", "8 to 12", "If, loops, events and classes"]
        - ["4", "13 to 16", "Cleaning, filtering, reporting"]
        - ["5", "15", "The R1C1 formula"]
        - ["6", "16", "Protecting workbook and project"]

  - steps:
      eyebrow: Block 01 · How it works
      title: Five things to know before sitting down
      items:
        - label: '01'
          title: On the classroom machine
          desc: Solved in Excel, not on paper. You may bring a USB drive with whatever you like.
        - label: '02'
          title: With your own material
          desc: Notes, submitted assignments, the books, the web, and anything you generated with AI beforehand.
        - label: '03'
          title: No communication channel
          desc: There is web access, but no email and no messaging. The network is for uploading, nothing else.
        - label: '04'
          title: Devices at the front
          desc: Phone, headphones and AI glasses go to the front of the room before starting.
        - label: '05'
          title: Uploaded compressed
          desc: A .zip named with your full name, for instance PedroPerezGonzalez.zip, to Blackboard.

  - method:
      eyebrow: Block 01 · What is actually asked
      title: A data set you have not seen, and a macro that leaves it usable
      statement: The exam does not measure what you memorised. It hands you dirty data and a brief, and measures whether you write the macro, whether it runs, and whether you can defend it.
      points:
        - label: What is assessed
          text: That it runs on new data, that it uses a calculated range instead of a fixed address, and that it deals with what can fail
        - label: The defence
          text: I may ask you to talk through one of your own procedures out loud. Reading it is not explaining it.
        - label: How to prepare
          text: By redoing one assignment from each unit without looking at your solution. Consulting is fast once you know what to look for.

  - divider:
      eyebrow: Block 02
      title: Reviewing what we measured
      lede: Everything that follows was run in Excel before it went on a slide. It is not theory, it is output.
      block: 2

  - table:
      eyebrow: Block 02 · The ones that do warn you
      title: The five errors of the term, by number
      headers: ["Err", "What it says", "What causes it"]
      rows:
        - ["11", "Division by zero", "Dividing by an empty cell"]
        - ["13", "Type mismatch", "Converting text to a number"]
        - ["91", "Object variable not set", "A missing New, or a property that is Nothing"]
        - ["438", "Object doesn't support…", "Asking WorksheetFunction for a VBA function"]
        - ["1004", "Several wordings", "Protected sheet, failed lookup, bad range"]

  - concept:
      eyebrow: The most useful of the five
      title: Error 91 turned up twice for two different reasons
      lead: >-
        In week 12 it was declaring without creating, forgetting the New. In week 14 it was
        asking an empty table for its body, where DataBodyRange returns Nothing. Same
        number, same wording, causes with nothing in common.
      panel:
        label: What to do with that
        title: The number tells you what, not why
        note: >-
          A VBA error names the symptom. Finding the cause is reading which object you were
          touching on that line and asking whether it really existed.
      steps:
        - text: Read the number and the line
        - text: Ask which object you touched there
        - text: Check whether anybody really created it
          loop: ↺ and that question settles almost every 91

  - table:
      eyebrow: Block 02 · The ones that do not
      title: Six failures that give a wrong answer and no error at all
      headers: ["Week", "What you did", "What came out"]
      rows:
        - ["13", "Sorted one column alone", "Rows decoupled"]
        - ["14", "Walked a filtered range", "Hidden rows added too"]
        - ["14", "Misspelled a header", "Zero rows, no error"]
        - ["13", "Subtotal without sorting", "Breaks that close nothing"]
        - ["16", "Pivot without refreshing", "Yesterday's total"]
        - ["16", "Checked Err too late", "Blames the wrong line"]

  - quiz:
      eyebrow: Quick question
      question: The workbook has a chart and a pivot over A1:B100. Twenty rows arrive and you refresh. What do they show?
      filename: Module1
      lang: vba
      source: |
        ' the chart was built over A1:B100
        ' so was the pivot cache

        ' data arrives in A101:B120

        pt.RefreshTable
      options:
        - 'Neither of them includes the new rows.'
        - 'Both include them, because you refreshed.'
        - 'The pivot does, the chart does not.'
        - 'The chart does, the pivot does not.'

  - trace:
      eyebrow: Answer
      title: Refreshing rereads the same old range, it does not go looking
      headers: ["Step", "What happens", "What it shows"]
      rows:
        - ["1", "Twenty rows arrive in A101:B120", "They are on the sheet"]
        - ["2", "The chart holds $A$2:$B$100", "The earlier ones"]
        - ["3", "The cache was built over A1:B100", "It rereads that range"]
        - ["4", "Neither knows about the new ones", "Two reports that lie"]
      verdict: >-
        It is the same problem as weeks 14, 15 and 16, and it has the same answer. If the
        source is a table rather than a range, both grow on their own and there is nothing
        to remember.

  - divider:
      eyebrow: Block 03
      title: Closing
      lede: How the grade adds up, and what you take from here that works outside the classroom.
      block: 3

  - table:
      eyebrow: Block 03 · The grade
      title: The five components, twenty per cent each
      headers: ["Component", "Weight", "When"]
      rows:
        - ["First midterm", "20 %", "Week 8"]
        - ["Second midterm", "20 %", "Week 13"]
        - ["Project", "20 %", "Week 16"]
        - ["Final exam", "20 %", "Week 17"]
        - ["Assignments", "20 %", "The whole term"]

  - pitfalls:
      eyebrow: Diagnosis
      title: Four ways to lose marks with the code working
      items:
        - label: Error 01
          title: A fixed address instead of a range
          desc: It runs perfectly on your data and falls over on the exam's, which is other data
        - label: Error 02
          title: Nothing dealing with the errors
          desc: One odd value stops the macro halfway and leaves the work split
        - label: Error 03
          title: Not being able to explain your own code
          desc: The defence counts. Reading a line out loud is not explaining what it does.
        - label: Error 04
          title: Handing in without one last run
          desc: A workbook that will not open is capped at 30 %, however well written

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: What does not warn you is what costs
          desc: An error stops you and you fix it. A wrong answer goes into the report.
        - title: The range is calculated
          desc: It was the lesson of three weeks running, and it is what the exam will charge for
        - title: Automating is deciding
          desc: The hard part was never the syntax, it was choosing what was worth doing itself

  - closing:
      title: Thank you
      subtitle: >-
        It was a good term. If any of this is useful next year, the repository stays up.
      meta:
        - [Email, descobarc@up.edu.mx]
        - [Chat, Institutional Google Chat]
        - [Repository, github.com/davidowa/learning-hub]
