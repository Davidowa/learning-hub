          desc: Automating your own workbook with two events

  - objectives:
      eyebrow: Session objectives
      title: By the end of the session you will be able to…
      items:
        - head: Write an event handler
          sub: In the sheet or workbook module, with the exact signature Excel looks for
        - head: Tell the four syllabus events apart
          sub: Change, SelectionChange, Open and BeforeSave, and what triggers each
        - head: Use the Target parameter
          sub: To find out which cell changed, and decide whether the event applies to it
        - head: Stop an event firing itself
          sub: With an address guard or by switching events off while it writes

