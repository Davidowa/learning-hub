        - title: Who starts the macro
          desc: Until today, you. From today, something that happens in the workbook
        - title: Where the code lives
          desc: Not in a module. In the sheet or in the workbook, and that is not a detail.
        - title: When it bites its tail
          desc: The handler writes, the write fires it again, and Excel goes down
