slides:
  - cover:
      kicker: Facultad de Empresariales · 2026
      unit: Week 03 · Unit 1 · Types, variables and cells
      title: Information Analysis and Processing
      subtitle: Which type each piece of data gets, why Long and not Integer, and the three ways to reach a cell.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, TIA503 · Empresariales]
        - [Session, 3 of 17]
      notes: |
        Ninety minutes. Twenty on types, twenty-five on declaring properly, the rest at
        the machine moving cells around.

        The idea that holds the session together is that Long is not a luxury. A sheet
        has 1,048,576 rows and an Integer stops at 32,767, so a row counter declared as
        Integer breaks. That is not theory: it is verified, and it carries the big-number
        slide and the error slide.

        The code comes from
        docs/en/courses/vba-course/01 - Basic Concepts/BasicConcepts.bas (Variables and
        Constants) and 02 - Access Cells/AccessCells.bas.

        Every result in this session was run in Excel 16.0. The 2.5 rounding down to 2
        surprises the whole room, and it is worth letting them bet on it first.

        The Option Explicit error shows here in English, "Variable not defined". A
        Spanish Excel says "No se ha definido la variable". Same for Overflow, which
        comes out as Desbordamiento.

