        - [Weight, Part of the 20 % for assignments]
      rubric:
        - ["The filter", "35 %", "The criterion lives on the sheet and the macro reads it from there"]
        - ["What is visible", "35 %", "The total comes from the visible rows, not the whole range"]
        - ["Subtotals", "30 %", "Sorted before breaking, and one break per group"]

