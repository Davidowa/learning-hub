          desc: With peer review. You will see another team's project and they will see yours.
        - label: '04'
          title: If it does not run, 30 % is the ceiling
          desc: A workbook that will not open, or fails on the first try, does not reach half marks.
        - label: '05'
          title: Graded individually
          desc: Even though the work is done in teams, each of you answers for what you handed in.

  - lab:
      eyebrow: Lab
      title: Closing the project
      brief: Add to your project a summary sheet with a PivotTable created from a macro, an error handler on the main procedure, and protection with UserInterfaceOnly reapplied on open.
      blocks:
        - label: Constraint
          text: The pivot source has to be a table, so that it grows along with the data
        - label: Deliverable
          text: The .xlsm and the exported modules, with the summary, the handler and the protection
        - label: Criterion
          text: That adding rows and running again includes them in the summary, untouched

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: A pivot reads a copy
          desc: Refreshing settles the values that changed, but not the rows that arrived
        - title: Resume Next does not handle
          desc: It leaves Err set, and three lines later it blames somebody who was not there
        - title: UserInterfaceOnly is not saved
          desc: It has to be reapplied when the workbook opens, and that lives in ThisWorkbook

  - homework:
      eyebrow: Homework
      title: Submission and grading criteria
      brief: Finish the project and get ready to present it. In the written report, explain one design decision you took and which alternative you ruled out.
      meta:
        - [Due, Before session 17]
        - [Format, Blackboard · .xlsm + modules + report]
        - [Weight, 20 % of the final grade]
      rubric:
        - ["The workbook", "70 %", "Runs on new data, with errors and protection dealt with"]
        - ["The report", "25 %", "Clear narrative and the decisions justified"]
        - ["The evidence", "5 %", "Screenshots and output woven into the text, not stapled at the end"]

