slides:
  - cover:
      kicker: Facultad de Empresariales · 2026
      unit: Week 07 · Unit 2 · Goal Seek and chaining
      title: Information Analysis and Processing
      subtitle: Turning the question around from a macro, bounding what the macro touches, and chaining several without collisions.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, TIA503 · Empresariales]
        - [Session, 7 of 17]
      notes: |
        Ninety minutes. Thirty on Goal Seek, twenty on bounding, the rest chaining.

        Everything on the number slides came out of running the model. A 500,000 loan at
        twelve per cent annual, a hundred and twenty periods. Goal Seek leaves the payment
        at 6,997.36 and the closing balance at minus 5.56 times ten to the minus ten,
        which is not zero. That detail is the one to use: Goal Seek does not solve the
        equation, it gropes for the answer, which is why it has a residue and a hundred
        iteration ceiling.

        The big-number slide says 339,683, the interest on that same loan. That is
        sixty-eight per cent of what was borrowed, and for a business school room it
        lands harder than any argument about programming.

        The code comes from
        docs/en/courses/vba-course/00 - Record Macro - Amortization Table/RecordMacroAmortization.bas
        and from 09 - Subs and Functions/SubsFunctions.bas for the chaining.

        A warning about that module 00 file: it uses the range names of the workbook in
        the same folder, the ones with double underscores. Copied into a fresh workbook
        without creating those names, it stops with error 1004.

