  - compare:
      eyebrow: Block 03 · Why it is worth it
      title: The same formula, with coordinates and with names
      before:
        label: With coordinates
        file: sheet.xlsx
        lang: excel
        code: |
          =B1*B3
          =B1+B12-B13
      after:
        label: With names
        file: sheet.xlsx
        lang: excel
        code: |
          =LoanAmount*MonthlyRate
          =OpeningBalance+Interest-Principal
      note: >-
        The first one has to be checked cell by cell. The second reads straight through
        and the error jumps out on its own. Same sum, and in the project review one is
        defended in ten seconds and the other is not.

  - quiz:
      eyebrow: Quick check
      question: What ends up in A1 and A2?
      filename: Operators.bas
      lang: vba
      source: |
        Sub Sums()
            Range("A1").Value = -3 ^ 2
            Range("A2").Value = 7.5 \ 2
        End Sub
      options:
        - "9 and 3.75, same as the sheet"
        - "-9 and 4, because the sign applies last and the backslash rounds"
        - "9 and 3, because integer division truncates"
        - "An error, because you cannot raise a negative"

  - lab:
      eyebrow: Lab
      title: Name the amortization table
      brief: Open the module 00 amortization table and write a procedure that creates names for the amount, the annual rate, the monthly rate and the payment. Then compute the monthly rate with the power formula and leave it in its cell with a percentage format.
      blocks:
        - label: Submission
          text: The .xlsm with the names created and the module exported, on Blackboard
        - label: Constraint
          text: No sheet formula may be left holding coordinates. All of them use names.
        - label: The test
          text: Insert a row above the table. If something breaks, the name was not set up properly.

  - takeaways:
      eyebrow: Summary
      title: Three things to take away
      items:
        - title: The sheet and VBA do not always agree
          desc: A negative raised to a power, the sum of two strings and the remainder of a negative answer differently in each engine
        - title: Scientific notation is not an error
          desc: E-03 means move the point three places. The number is right, and Format makes it readable
        - title: A name reads, B3 has to be checked
          desc: The formula with names is understood straight through, and that difference is what shows in the project review

