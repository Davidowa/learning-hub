  - code:
      eyebrow: Block 01 · Precedence
      title: The order VBA resolves an expression in
      filename: Operators.bas
      lang: vba
      source: |
        Sub Precedence()
            ' 1. Parentheses  2. ^  3. * /  4. \  5. Mod  6. + -
            Dim withoutParens As Double
            Dim withParens As Double

            withoutParens = 5 + 3 * 2
            withParens = (5 + 3) * 2

            Range("A1").Value = withoutParens
            Range("A2").Value = withParens
        End Sub
      annotations:
        - label: The result
          text: 11 and 16. The product resolves before the sum, exactly as in the sheet.
        - label: The two divisions
          text: Integer division and remainder get their own step, below ordinary division.
        - label: The parentheses
          text: They cost nothing and remove all doubt. Add them even when they are not needed.
        - label: Risk
          text: Both lines run and return a number. Only one answers the question you asked.
          accent: true

  - divider:
      eyebrow: Block 02
      title: The cell against VBA
      lede: They are two engines inside the same program. Almost always they agree, and where they do not, nobody warns you.
      block: 2

  - table:
      eyebrow: Block 02 · Verified in Excel 16.0
      title: Three expressions that answer differently by where you type them
      headers: [In the cell, In VBA, What each one returns]
      rows:
        - ["=-3^2", "-3 ^ 2", "9 against -9"]
        - ["=\"5\"+\"3\"", "\"5\" + \"3\"", "8 against 53"]
        - ["=MOD(-5,3)", "-5 Mod 3", "1 against -2"]
        - ["=2^3^2", "2 ^ 3 ^ 2", "64 and 64, these do agree"]

  - method:
      eyebrow: Block 02 · Why it happens
      title: Three different rules, not three bugs
      statement: The sheet and VBA are two engines inside the same program, and on three points they made opposite decisions.
      points:
        - label: The minus sign
          text: In the sheet it applies before the power, so -3^2 is 9. In VBA it applies after, and gives -9.
        - label: The plus sign
          text: In the sheet it converts the strings to numbers and adds. In VBA, if both sides are text, it glues them.
        - label: The remainder
          text: The sheet function returns the sign of the divisor. Mod returns the sign of the dividend.

  - code_output:
      eyebrow: Block 02 · The monthly rate
      title: The result everybody reads as an error
      filename: Rate.bas
      lang: vba
      output_label: What you see
      source: |
        Dim annualRate As Double
        Dim monthlyRate As Double

        annualRate = 0.12
        monthlyRate = ((1 + annualRate) ^ (1 / 12)) - 1
      output: |
        9.48879293458305E-03
      notes: |
        Verified. The same sum in a cell shows 0.009489, because the cell carries a
        format. In VBA the number is identical; what changes is how it is written out.

  - code:
      eyebrow: Block 02 · The fix
      title: Format to read it, Round to cut it
      filename: Rate.bas
      lang: vba
      source: |
        Sub ReadableRate()
            Dim monthlyRate As Double
            monthlyRate = ((1 + 0.12) ^ (1 / 12)) - 1

            Range("B1").Value = monthlyRate
            Range("B1").NumberFormat = "0.00%"

            Range("B2").Value = Format(monthlyRate, "0.00%")
            Range("B3").Value = Round(monthlyRate, 6)
        End Sub
      annotations:
        - label: NumberFormat
          text: Leaves the whole number in the cell and only changes how it looks. B1 shows 0.95 %.
        - label: Format
          text: Returns text, already formatted. Good for a message, not for carrying on calculating.
        - label: Round
          text: Cuts the number for real. Round(rate, 6) leaves 0.009489 and the rest is gone.
        - label: Risk
          text: Format returns text. Add that to something later and VBA glues it instead of adding.
          accent: true

  - pitfalls:
      eyebrow: Block 02 · Common errors
      title: Four sums that return the wrong number
      items:
        - label: Error 01
          title: Adding two strings with plus
          desc: "\"5\" + \"3\" gives 53, not 8. With a number on one side it does add, and that inconsistency is the trap."
        - label: Error 02
          title: Raising a negative
          desc: In VBA -3 ^ 2 is -9, because the sign applies last. Write (-3) ^ 2 if you meant 9.
        - label: Error 03
          title: Dividing by zero
          desc: The cell shows an error value and carries on. VBA stops with error 11 and the macro never finishes.
        - label: Error 04
          title: Integer division with a backslash
          desc: "7.5 \\ 2 is neither 3.75 nor 3. It rounds both sides first, so it gives 4."

  - divider:
      eyebrow: Block 03
      title: Range names
      lede: A formula with B3 has to be gone and checked. One with Monthly_Rate is reviewed without leaving where you are.
      block: 3

  - code:
      eyebrow: Block 03 · Creating a name
      title: Names.Add, and the range stops being a coordinate
      filename: DefineNameCells.bas
      lang: vba
      source: |
        Sub DefineNames()
            ThisWorkbook.Names.Add _
                Name:="LoanAmount", RefersTo:="=Sheet1!$B$1"
            ThisWorkbook.Names.Add _
                Name:="AnnualRate", RefersTo:="=Sheet1!$B$2"

            Range("LoanAmount").Value = 500000
            Range("AnnualRate").Value = 0.12
        End Sub
      annotations:
        - label: Name
          text: The name you will use. No spaces, and it cannot look like a cell address.
        - label: RefersTo
          text: Starts with an equals sign and carries the sheet and the absolute address, dollar signs included.
        - label: Afterwards
          text: Range("LoanAmount") works exactly like Range("B1"), in code and in the sheet.
        - label: Risk
          text: Names.Add twice raises no error. It redefines the name silently.
          accent: true

