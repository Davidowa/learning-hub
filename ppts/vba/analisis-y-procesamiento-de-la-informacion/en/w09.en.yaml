slides:
  - cover:
      kicker: Facultad de Empresariales · 2026
      unit: Week 09 · Unit 3 · Repetition
      title: Information Analysis and Processing
      subtitle: For counts, For Each walks. And the difference between deleting top to bottom or the other way round.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, TIA503 · Empresariales]
        - [Session, 9 of 17]
      notes: |
        Ninety minutes. Twenty-five on For, twenty-five on For Each, the rest walking a
        real database.

        This is the session where the macro finally does what no sheet does on its own.
        Until today every statement touched one cell. From today one statement touches a
        thousand.

        The module 08 loop writes a hundred and twenty columns from B3 and finishes at
        DQ3. Verified. That is exactly the last column of the module 00 amortization
        table, and it is worth saying out loud: the table that in week 1 looked like six
        hundred hand-made cells now fits in four lines.

        The two verifications to drop slowly are the deletion and the speed. Deleting six
        rows forwards leaves three, because deleting row one turns row two into row one
        while the counter has already moved to two. Backwards it leaves none. And twenty
        thousand cells written one at a time take 0.91 seconds, against 0.02 in a single
        write with an array.

        The code comes from
        docs/en/courses/vba-course/08 - Repetition Statement/RepetitionStatements.bas.

