  - method:
      eyebrow: Block 03 · What is actually asked
      title: You may consult everything, and you still have to know
      statement: The midterm will hand you a dirty, unsorted database. What is measured is whether you leave it usable with a macro, not whether you remembered the syntax.
      points:
        - label: What is assessed
          text: That the macro runs on data you had not seen and that it uses a variable range instead of a fixed address
        - label: The defence
          text: I may ask you to talk through one of your own procedures out loud. Reading it is not explaining it.
        - label: How to prepare
          text: By redoing the weeks 9 to 12 assignments without looking at your solution. Consulting is fast once you know what to look for.

  - lab:
      eyebrow: Lab
      title: Your project database, cleaned from a macro
      brief: Take your project database and write a macro that leaves it usable. It should remove spare and hard spaces, even out the case, delete the blank rows and sort by two criteria.
      blocks:
        - label: Constraint
          text: The range is calculated, not typed. The macro has to work if a thousand more rows arrive tomorrow.
        - label: Deliverable
          text: The .xlsm and the exported modules, with the data before and after on two sheets
        - label: Criterion
          text: That after sorting, every row still says what it said before sorting

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: Dirt does not show
          desc: A hard space survives Trim and makes two identical cells compare as different
        - title: Sorting moves rows
          desc: If the range misses part of the data, the rows decouple with no error at all
        - title: Delete from the bottom up
          desc: Remove a row and the next one moves up into a spot the loop has already passed

  - homework:
      eyebrow: Homework
      title: Submission and grading criteria
      brief: Finish the lab macro and add a report, on a separate sheet, saying how many rows were cleaned, how many were deleted as blank and how many as duplicates.
      meta:
