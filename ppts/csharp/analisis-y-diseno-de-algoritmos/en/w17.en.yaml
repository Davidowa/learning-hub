  - concept:
      eyebrow: Key concept
      title: The chain that runs through the whole course
      lead: >-
        A type is a decision about what fits. A condition is a value. A loop is that
        condition repeated until it stops being true. A function is a loop with a name and a
        contract. An array is a whole run held in memory, and a struct is one row of that
        run with the fields you chose.
      panel:
        label: What this means for the exam
        title: There are not seven loose topics to memorise
        note: >-
          If you know what an accumulator inside a for does, you already know what the final
          report of this program does. The syntax changes, the idea does not.
      steps:
        - text: A type decides what fits
        - text: A condition decides which way
        - text: A loop repeats until it holds
          loop: ↺ and the function gives it a name

