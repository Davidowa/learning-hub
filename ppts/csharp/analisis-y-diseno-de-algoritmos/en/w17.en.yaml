  - code_output:
      eyebrow: Mistake 06 · Measured
      title: The program that prints a confident wrong number
      filename: six.cs
      lang: csharp
      output_label: The run
      source: |
        int cycles = int.MaxValue - 2;
        for (int k = 0; k < 5; k++)
        {
            cycles++;
            Console.WriteLine($"+1 cycle   {cycles}");
        }
        long cyclesL = int.MaxValue - 2;
        for (int k = 0; k < 5; k++) cyclesL++;
        Console.WriteLine($"in long    {cyclesL}");
      output: |
        +1 cycle   2147483646
        +1 cycle   2147483647
        +1 cycle   -2147483648
        +1 cycle   -2147483647
        +1 cycle   -2147483646
        in long    2147483650

  - compare:
      eyebrow: Block 02 · The other half
      title: The compiler protects you while it can see the value
      before:
        label: Written as a literal
        file: lit.cs
        lang: csharp
        code: |
          Console.WriteLine(int.MaxValue + 1);
      after:
        label: The same value through a variable
        file: var.cs
        lang: csharp
        code: |
          int cycles = int.MaxValue;
          Console.WriteLine(cycles);
          Console.WriteLine(cycles + 1);
      note: >-
        The left one does not even produce an executable. The compiler evaluates the
        constant and refuses with error CS0220, The operation overflows at compile time in
        checked mode. The right one builds with 0 warnings and 0 errors, and prints
        2147483647 and −2147483648.

  - quiz:
      eyebrow: Quick check
      question: A cycle counter reaches the top of int. What does the program do?
      filename: ceiling.cs
      lang: csharp
      source: |
        int cycles = int.MaxValue;
        cycles++;
        Console.WriteLine(cycles);
      options:
        - 'It throws OverflowException and stops there.'
        - 'It prints -2147483648, with no error and no warning.'
        - 'It stays at 2147483647, because it hit the ceiling.'
        - 'It does not build, because the compiler sees the overflow.'

  - trace:
      eyebrow: Answer
      title: The same addition, four different endings
      headers: [The form, What happens, Where you see it]
      rows:
