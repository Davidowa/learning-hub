        - ["cycles++", "-2147483648", "at run time"]
        - ["in a long", "2147483650", "at run time"]
        - ["checked { }", "OverflowException", "at run time"]
      verdict: >-
        At 25 cycles per second, that ceiling arrives after 994.2 days of continuous
        running. It is a maintenance report somebody would have believed.

