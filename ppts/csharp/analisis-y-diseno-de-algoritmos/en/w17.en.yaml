  - code:
      eyebrow: Block 01 · Validate
      title: The capture line, with one bad reading inside it
      filename: Review.cs
      lang: csharp
      source: |
        string capture = "1480,1502,1495,abc,1533,1471,1509,1488";
        string[] fields = capture.Split(',');
        int[] rpm = new int[fields.Length];
        int n = 0, rejected = 0;
        foreach (string field in fields)
        {
            bool ok = int.TryParse(field, out int value);
            if (ok) { rpm[n] = value; n++; }
            else { rejected++; }
        }
        Console.WriteLine($"read {n}, rejected {rejected}");
      annotations:
        - label: Split
          text: Week 13 turns a line of text into pieces. Here it is eight fields, one of them garbage.
        - label: TryParse
          text: It returns a bool and writes the variable. The bool gets checked first, always.
        - label: Two counters
          text: n says how many got in, rejected how many did not. The array has eight slots and only seven are used.
        - label: Risk
          text: With Convert.ToInt32 instead of TryParse, the program dies on the fourth field.
          accent: true

  - code:
      eyebrow: Block 01 · Classify
      title: The band, the struct and the enum, in one loop
      filename: Review.cs
      lang: csharp
      source: |
        // struct Sample { int Channel; int Rpm; Status State; }
        Sample[] bank = new Sample[n];
        int sum = 0, outside = 0;
        for (int i = 0; i < n; i++)
        {
            bool bad = rpm[i] < 1480 || rpm[i] > 1520;
            bank[i].Channel = i;
            bank[i].Rpm = rpm[i];
            bank[i].State = bad ? Status.Fault : Status.Ok;
            if (bad) outside++;
            sum += rpm[i];
        }
      annotations:
        - label: The band rule
          text: r < 1480 || r > 1520, written on the slide. With the other convention the count changes.
        - label: bank[i].Channel
          text: The array element is the struct, so writing one of its fields writes into the bank.
        - label: The enum
          text: Status.Ok and Status.Fault are names, and underneath they are still 0 and 2.
        - label: One loop
          text: It classifies, accumulates and counts in the same pass. Three accumulators, one walk.

  - code_output:
      eyebrow: Block 01 · Measured
      title: The most repeated mistake of the term, once more
      filename: Review.cs
      lang: csharp
      output_label: The run
      source: |
        Console.WriteLine($"out of band {outside} of {n}");
        Console.WriteLine($"integer mean {sum / n}");
        Console.WriteLine($"real mean {(double)sum / n}");
        Console.WriteLine($"mean :F3 {(double)sum / n:F3}");
      output: |
        read 7, rejected 1
        out of band 2 of 7
        integer mean 1496
        real mean 1496.857142857143
        mean :F3 1496.857

  - code_output:
      eyebrow: Block 01 · Measured
      title: Sort first, then read the negative return
      filename: Review.cs
      lang: csharp
      output_label: The run
      source: |
        int[] sorted = new int[n];
        Array.Copy(rpm, sorted, n);
        Array.Sort(sorted);

        Console.WriteLine("sorted:");
        Console.WriteLine(string.Join(" ", sorted));
        int i1495 = Array.BinarySearch(sorted, 1495);
        int i1500 = Array.BinarySearch(sorted, 1500);
        Console.WriteLine($"binary 1495 -> {i1495}");
        Console.WriteLine($"binary 1500 -> {i1500}");
      output: |
        sorted:
        1471 1480 1488 1495 1502 1509 1533
        binary 1495 -> 3
        binary 1500 -> -5

