  - method:
      eyebrow: Final exam · Scope
      title: Two topics have never been on an exam in this course
      statement: >-
        The syllabus says the final exam covers all units of the course, and that includes
        two topics the midterms never reached. Here they are, said out loud.
      points:
        - label: From the first midterm
          text: >-
            Midterm 1 examined repetition at the week 8 level, with while, do-while and a
            proven exit. for, nesting and break or continue land here.
        - label: From the second midterm
          text: >-
            Midterm 2 covered unit 5 in full and unit 6 through 6.1.3. Two-index arrays and
            sorting and searching land here.
        - label: What does not change
          text: >-
            Nothing outside the syllabus. Saying it out loud is the difference between a
            fair exam and a surprise on exam day.

  - pitfalls:
      eyebrow: Closing · Honesty
      title: What this course did not teach you, said here and not in February
      items:
        - label: Not covered 01
          title: Classes of your own with behaviour
          desc: Classes appeared twice and only as a measured contrast. Writing one is the course that follows.
        - label: Not covered 02
          title: try / catch as a design tool
          desc: Here exceptions were failures to prevent. The rule was guard the input, do not catch the crash.
        - label: Not covered 03
          title: Collections beyond the array
          desc: List of T appeared once and only failing, with CS1612. Files and databases did not appear either.
        - label: Not covered 04
          title: Generics, LINQ and asynchronous work
          desc: One rpm.Sum() on the week 2 paradigms slide, and nothing more. This is not an apology, it is the map.

  - takeaways:
      eyebrow: Summary
      title: Three ideas for the whole term
      items:
        - title: Run the program, then quote it
          desc: What the program printed is data. What you think it prints is an untested hypothesis
        - title: The compiler sees what it can see
          desc: Once the value moves into a variable, the only defence left is the one you wrote
        - title: Keep your project code
          desc: It is your first portfolio piece, and it is proof that you can build something that runs

