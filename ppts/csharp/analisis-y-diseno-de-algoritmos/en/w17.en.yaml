  - code_output:
      eyebrow: Mistake 01 · Measured
      title: Integer division truncates, and the cast goes first
      filename: one.cs
      lang: csharp
      output_label: The run
      source: |
        Console.WriteLine($"7 / 2           = {7 / 2}");
        Console.WriteLine($"7 / 2.0         = {7 / 2.0}");
        int sum = 10478, n = 7;
        Console.WriteLine($"sum / n         = {sum / n}");
        Console.WriteLine($"(double)sum / n = {(double)sum / n}");
        Console.WriteLine($"... :F3         = {(double)sum / n:F3}");
      output: |
        7 / 2           = 3
        7 / 2.0         = 3.5
        sum / n         = 1496
        (double)sum / n = 1496.857142857143
        ... :F3         = 1496.857

  - code_output:
      eyebrow: Mistake 02 · Measured
      title: Two readings are never compared with equals
      filename: two.cs
      lang: csharp
      output_label: The run
      source: |
        double reading = 0.1 + 0.2;
        Console.WriteLine($"0.1 + 0.2    = {reading}");
        Console.WriteLine($"== 0.3       = {reading == 0.3}");
        double diff = Math.Abs(24.97 - 25.0);
        Console.WriteLine($"|24.97-25.0| = {diff}");
        Console.WriteLine($"<= 0.05      = {diff <= 0.05}");
      output: |
        0.1 + 0.2    = 0.30000000000000004
        == 0.3       = False
        |24.97-25.0| = 0.030000000000001137
        <= 0.05      = True

  - code_output:
      eyebrow: Mistake 03 · Measured
      title: Convert without asking, or ask before converting
      filename: three.cs
      lang: csharp
      output_label: The run
      source: |
        try
        {
            Console.WriteLine(Convert.ToInt32("abc"));
        }
        catch (FormatException e)
        {
            Console.WriteLine("Convert -> " + e.GetType().Name);
        }
        bool ok = int.TryParse("abc", out int v);
        Console.WriteLine($"TryParse -> {ok}, v = {v}");
        string? none = null;
        Console.WriteLine($"Convert(null) -> {Convert.ToInt32(none)}");
      output: |
        Convert -> FormatException
        TryParse -> False, v = 0
        Convert(null) -> 0

