  - divider:
      eyebrow: Block 01
      title: for, and the loop with no counter
      lede: Last week's four beats, three of them gathered onto a single line.
      block: 1

  - compare:
      eyebrow: Block 01 · Translation
      title: The same walk, written both ways
      before:
        label: Last week
        file: Program.cs
        lang: csharp
        code: |
          int i = 0;
          while (i < rpm.Length)
          {
              sum += rpm[i];
              i++;
          }
      after:
        label: This week
        file: Program.cs
        lang: csharp
        code: |
          for (int i = 0; i < rpm.Length; i++)
          {
              sum += rpm[i];
          }
      note: >-
        Initialise, check and change all fit in the header, separated by semicolons. The
        body keeps the work and nothing else. There is no new loop here, only a way of
        writing the same one that makes the fourth beat hard to forget.

  - code:
      eyebrow: Block 01 · for
      title: Walking the rpm run, with the index in plain sight
      filename: Program.cs
      lang: csharp
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };

        int sum = 0;

        for (int i = 0; i < rpm.Length; i++)
        {
            sum += rpm[i];
        }

        Console.WriteLine(sum);
      annotations:
        - label: The three beats
          text: Declaration, condition and change, in that order and separated by semicolons inside the header.
        - label: The scope of i
          text: i is born and dies in the header. Outside the loop the compiler does not know it, and says so with CS0103.
        - label: The index earns its keep
          text: With i you can ask where, not only what. That is the reason not to reach for foreach on some walks.
        - label: Risk
          text: Writing i <= rpm.Length instead of strictly less asks for element 7 of an array that stops at 6.
          accent: true

  - code_output:
      eyebrow: Block 01 · Measured
      title: The change slot is yours, it does not have to say i++
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        Console.WriteLine("i = 10; i >= 0; i -= 2");
        for (int i = 10; i >= 0; i -= 2) Console.Write(i + " ");
        Console.WriteLine();

        Console.WriteLine("i = 0; i < 20; i += 5");
        for (int i = 0; i < 20; i += 5) Console.Write(i + " ");
        Console.WriteLine();

        Console.WriteLine("i = 0; i < 3; i++");
        for (int i = 0; i < 3; i++) Console.Write(i + " ");
        Console.WriteLine();
      output: |
        i = 10; i >= 0; i -= 2
        10 8 6 4 2 0
        i = 0; i < 20; i += 5
        0 5 10 15
        i = 0; i < 3; i++
        0 1 2

  - code:
      eyebrow: Block 01 · foreach
      title: The loop that walks with no counter and no bound to get wrong
      filename: Program.cs
      lang: csharp
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };
        int sum = 0, count = 0;
        foreach (int reading in rpm)
        {
            sum += reading;
            count++;
        }
        int maxIdx = 0;
        for (int i = 1; i < rpm.Length; i++)
            if (rpm[i] > rpm[maxIdx]) maxIdx = i;
        Console.WriteLine($"foreach: {count} readings, sum {sum}");
        Console.WriteLine($"for: max {rpm[maxIdx]}, index {maxIdx}");
      annotations:
        - label: No bound
          text: >-
            A foreach has no condition to get wrong, so it cannot walk off the end of the
            array.
        - label: And no index
          text: >-
            It does not hand you one either. Ask where the maximum sits and you are back
            to for.
        - label: Why it matters
          text: >-
            1533 at index 3 is what tells the technician which sample to go and look at on
            the bench.
        - label: Risk
          text: >-
            Assigning the foreach variable does not compile. It is a copy, and the
            compiler blocks it.
          accent: true

