      block: 3

  - code:
      eyebrow: Block 03 · The pattern
      title: The four variables that live outside the loop
      filename: Program.cs
      lang: csharp
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };

        int sum = 0;
        int outOfBand = 0;
        int maxIdx = 0, minIdx = 0;

        for (int i = 0; i < rpm.Length; i++)
        {
            sum += rpm[i];
            if (rpm[i] < 1480 || rpm[i] > 1520) outOfBand++;
            if (rpm[i] > rpm[maxIdx]) maxIdx = i;
            if (rpm[i] < rpm[minIdx]) minIdx = i;
        }
      annotations:
        - label: Outside the loop
          text: >-
            All four are declared before the for. Inside, they reset every pass and nobody
            warns you.
        - label: The band rule
          text: >-
            Written in full because 1480 sits exactly on the lower limit. One character
            decides the count.
        - label: Maximum and minimum
          text: >-
            On these seven readings, max 1533 at index 3, min 1471 at index 4, span 62.
        - label: Risk
          text: >-
            Starting maxIdx at 0 works because the array has elements. On an empty array
            you ask first.
          accent: true

  - code_output:
      eyebrow: Block 03 · Measured
      title: A cast changes the value, a format specifier changes the reading
      filename: Program.cs
      lang: csharp
      output_label: On running
