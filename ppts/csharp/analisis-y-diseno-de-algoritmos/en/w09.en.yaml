        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };
        int sum = 0;
        for (int i = 0; i < rpm.Length; i++) sum += rpm[i];
        int whole = sum / rpm.Length;
        double real = (double)sum / rpm.Length;
        Console.WriteLine($"sum         {sum}");
        Console.WriteLine($"mean int    {whole}");
        Console.WriteLine($"mean real   {real}");
        Console.WriteLine($"mean to F3  {real:F3}");
      output: |
        sum         10478
        mean int    1496
        mean real   1496.857142857143
        mean to F3  1496.857

  - code_output:
      eyebrow: Block 03 · Measured
      title: The same one character, now in a percentage
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };
        int inc = 0, exc = 0;
        for (int i = 0; i < rpm.Length; i++)
        {
            if (rpm[i] < 1480 || rpm[i] > 1520) inc++;
            if (rpm[i] <= 1480 || rpm[i] >= 1520) exc++;
        }
        int pctWhole = inc * 100 / 7; double pct = inc * 100.0 / 7;
        Console.WriteLine($"<  and >   out {inc} of 7");
        Console.WriteLine($"<= and >=  out {exc} of 7");
        Console.WriteLine($"{inc} * 100 / 7   = {pctWhole}");
        Console.WriteLine($"{inc} * 100.0 / 7 = {pct}");
        Console.WriteLine($"to F1         = {pct:F1}");
      output: |
        <  and >   out 2 of 7
        <= and >=  out 3 of 7
        2 * 100 / 7   = 28
        2 * 100.0 / 7 = 28.571428571428573
        to F1         = 28.6

