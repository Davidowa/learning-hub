  - quiz:
      eyebrow: Quick check
      question: The sampling cadence with the ladder in this order. What happens to sample 15?
      filename: Program.cs
      lang: csharp
      source: |
        for (int i = 1; i <= 15; i++)
        {
            if (i % 3 == 0) Console.Write("[LOG] ");
            else if (i % 5 == 0) Console.Write("[CAL] ");
            else if (i % 15 == 0)
                Console.Write("[LOG+CAL] ");
            else Console.Write($"{i} ");
        }
      options:
        - It is logged and calibrated, since 15 satisfies all three
        - It is logged but never calibrated, and it builds with no warning
        - It is calibrated but not logged, because 5 beats 3 here
        - The compiler flags the third arm as unreachable code

  - code_output:
      eyebrow: Answer · Measured
      title: The combined case has to go first, and only the run shows it
      filename: Program.cs
      lang: csharp
      output_label: Both ladders
      source: |
        for (int p = 0; p < 2; p++)
        {
            for (int i = 1; i <= 15; i++)
            {
                if (p == 0 && i % 15 == 0) Console.Write("[LOG+CAL] ");
                else if (i % 3 == 0) Console.Write("[LOG] ");
                else if (i % 5 == 0) Console.Write("[CAL] ");
                else Console.Write($"{i} ");
                if (i == 8 || i == 13) Console.WriteLine();
            }
            Console.WriteLine(p == 0 ? "\ncombined case last:" : "");
        }
      output: |
        1 2 [LOG] 4 [CAL] [LOG] 7 8
        [LOG] [CAL] 11 [LOG] 13
        14 [LOG+CAL]
        combined case last:
        1 2 [LOG] 4 [CAL] [LOG] 7 8
        [LOG] [CAL] 11 [LOG] 13
        14 [LOG]

  - code_output:
      eyebrow: Block 03 · Secondary case
      title: The frame budget at 60 Hz, which is not 16.67
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        double[] ms = { 15.2, 16.9, 14.8, 22.4,
                        15.9, 16.61, 33.1, 15.0 };
        double budget = 1000.0 / 60.0;
        int over = 0, worstIdx = -1; double worst = 0;
        for (int i = 0; i < ms.Length; i++)
        {
            if (ms[i] <= budget) continue;
            over++;
            if (ms[i] > worst) { worst = ms[i]; worstIdx = i; }
        }
        Console.WriteLine($"budget {budget}");
        Console.WriteLine($"to F2 {budget:F2} ms");
        Console.WriteLine($"over {over}, worst {worst} at {worstIdx}");
      output: |
        budget 16.666666666666668
        to F2 16.67 ms
        over 3, worst 33.1 at 6

  - pitfalls:
      eyebrow: Block 03 · Common errors
      title: Four traps in repetition done properly
      items:
        - label: Error 01
          title: Reaching for i after the loop
          desc: >-
            The counter is born and dies in the for header. Using it afterwards is error
            CS0103 The name 'i' does not exist in the current context. No exception, no run.
        - label: Error 02
          title: break inside a switch
          desc: >-
            It ends the switch and not the loop. Measured, all four passes of the for ran
            anyway. A continue in that same spot does go to the next pass.
        - label: Error 03
          title: Trusting an int to hold
          desc: >-
            The same loop inside checked forces it to admit the truth, with OverflowException
            Arithmetic operation resulted in an overflow. Without checked it says nothing.
        - label: Error 04
          title: Writing a List during a foreach
          desc: >-
            On an array you may write by index while you walk. On a List it falls over at
            run time with Collection was modified.

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: for is while, tidied up
          desc: The three beats sit in the header, and the body keeps only the work of the pass
        - title: foreach walks, for knows where
          desc: The moment the question is where and not what, the loop with no index stops helping
        - title: Passes are counted, not guessed
          desc: Four times the input is sixteen times the work, and starting the inner loop at i plus one leaves 21 pairs over seven sensors

