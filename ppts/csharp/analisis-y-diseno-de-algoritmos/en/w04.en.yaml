  - compare:
      eyebrow: Block 02 · Channel A to B
      title: Three ways to say the same thing, one of them legal
      before:
        label: The two that do not compile
        file: Program.cs
        lang: csharp
        code: |
          char channel = 'A';

          channel = channel + 1;   // CS0266
          channel += 1;            // CS0266

          // Cannot implicitly convert
          // type 'int' to 'char'
      after:
        label: The two that do
        file: Program.cs
        lang: csharp
        code: |
          char channel = 'A';
          channel++;
          Console.WriteLine(channel);      // B

          Console.WriteLine('A' + 1);           // 66
          Console.WriteLine((char)('A' + 1));   // B
      note: >-
        The addition does not give back a char. GetType on 'A' + 1 prints System.Int32,
        so the 66 has to be cast back to char. That is why channel++ is the only one of
        the three the compiler takes without help.

  - divider:
      eyebrow: Block 03
      title: Precedence, shortcuts and where arithmetic lies
      lede: >-
        Every line in this block compiles with zero warnings. That is exactly the
        problem.
      block: 3

