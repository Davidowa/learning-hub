  - table:
      eyebrow: Block 01 · Types
      title: The five types you will use all term
      headers: [Type, What it holds, Example off the bench]
      rows:
        - ["string", "Text between double quotes", 'station = "EST-07"']
        - ["char", "A single character, single quotes", "channel = 'A'"]
        - ["int", "32-bit whole numbers, no decimals", "samples = 7"]
        - ["double", "Decimals, double precision", "reading = 1496.857"]
        - ["bool", "true or false, nothing in between", "online = true"]

  - code:
      eyebrow: Block 01 · In context
      title: A sensor identity card
      filename: Program.cs
      lang: csharp
      source: |
        string station = "EST-07";
        char channel = 'A';
        int samples = 7;
        double reading = 1496.857142857143;
        bool online = true;

        Console.WriteLine(station.GetType());
        Console.WriteLine(channel.GetType());
        Console.WriteLine(reading.GetType());
      annotations:
        - label: The type comes first
          text: In C# the type is written before the name, and from that line on the box only accepts that type.
        - label: GetType
          text: It returns the real type of a value. Use it to check what the compiler understood, not in the finished program.
        - label: Quotes
          text: Single quotes for one character, double quotes for text. They are not interchangeable.
        - label: Risk
          text: Writing 1496 with no decimal point makes it an int, and every division after that truncates without a word.
          accent: true

