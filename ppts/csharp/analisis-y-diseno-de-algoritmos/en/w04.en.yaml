  - code_output:
      eyebrow: Block 03 · Measured
      title: The midpoint of the band, with and without brackets
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        int a = 1480, b = 1520;

        Console.WriteLine(a + b / 2);
        Console.WriteLine((a + b) / 2);
        Console.WriteLine((a + b) / 2.0);
        Console.WriteLine((a + b) / 2 == 1500);
      output: |
        2240
        1500
        1500
        True

  - trace:
      eyebrow: Block 03 · Trace
      title: The suffix answers with the old value
      headers: [With i at 5, What it prints, Where i ends]
      rows:
        - ["Console.WriteLine(i++)", "5", "i is now 6"]
        - ["Console.WriteLine(++i)", "7", "i is now 7"]
        - ["Console.WriteLine(j--)", "5", "j is now 4"]
        - ["i++; on its own line", "nothing", "i goes up by one"]
      verdict: >-
        Both add one, and they differ in what the expression hands back. As a counter
        step, alone on its line, they are identical, which is why the for header does
        not care which one you write.

  - code_output:
      eyebrow: Block 03 · Measured
      title: The slash between two ints truncates, and the cast goes first
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        Console.WriteLine(7 / 2);
        Console.WriteLine(7 % 2);
        Console.WriteLine(7.0 / 2);
        Console.WriteLine((double)7 / 2);
        Console.WriteLine((double)(7 / 2));
        Console.WriteLine(-7 / 2);
        Console.WriteLine(Math.Floor(-7 / 2.0));
      output: |
        3
        1
        3.5
        3.5
        3
        -3
        -4

  - code_output:
      eyebrow: Block 03 · Measured
      title: No tolerance is ever checked with an equals sign
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        Console.WriteLine(0.1 + 0.2);
        Console.WriteLine(0.1 + 0.2 == 0.3);

        const double Nominal = 25.0;
        double measured = 25.4;
        double dev = measured - Nominal;

        Console.WriteLine(dev);
        Console.WriteLine(Math.Abs(dev) <= 0.5);
      output: |
        0.30000000000000004
        False
        0.3999999999999986
        True

  - compare:
      eyebrow: Block 03 · Overflow
      title: The same addition, two outcomes
      before:
        label: Written as a literal
        file: Program.cs
        lang: csharp
        code: |
          Console.WriteLine(int.MaxValue + 1);

          // error CS0220
          // The operation overflows at
          // compile time in checked mode
          // Build FAILED.
      after:
        label: Through a variable
        file: Program.cs
        lang: csharp
        code: |
          int cycles = int.MaxValue;
          Console.WriteLine(cycles);
          Console.WriteLine(cycles + 1);

          // 2147483647
          // -2147483648
          // 0 Warning(s), 0 Error(s)
      note: >-
        What decides it is whether the compiler could see the value. Real code keeps the
        count in a variable, which is exactly the case the compiler cannot protect, and
        week 9 cashes this slide with an endurance-rig counter.

  - table:
      eyebrow: Block 03 · Measured
      title: Four values, four ways to drop the decimals
      headers: [Value, "(int)", Math.Round, Convert.ToInt32, Math.Floor]
      rows:
        - ["2.5", "2", "2", "2", "2"]
        - ["3.5", "3", "4", "4", "3"]
        - ["-2.5", "-2", "-2", "-2", "-3"]
        - ["3.9", "3", "4", "4", "3"]

  - code_output:
      eyebrow: Block 03 · Measured
      title: Every midpoint goes to the even neighbour
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        double a = Math.Round(0.5);
        double b = Math.Round(1.5);
        double c = Math.Round(2.5);
        double d = Math.Round(3.5);
        double e = Math.Round(4.5);

        Console.WriteLine($"{a} {b} {c} {d} {e}");
        Console.WriteLine(Math.Round(2.5,
            MidpointRounding.AwayFromZero));
      output: |
        0 2 2 4 4
        3

  - quiz:
      eyebrow: Quick check
      question: Where does this line leave n?
      filename: Program.cs
      lang: csharp
      source: |
        int n = 0;

        n = n++;

        Console.WriteLine(n);
      options:
        - 'At 1, because n++ adds one.'
        - 'At 0, the old value covers the increment.'
        - 'It does not compile, n++ cannot go on the right.'
        - 'At 1, and it warns you at build time.'

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: The type is settled once
          desc: Reassigning changes the value and never the type, and const blocks even the change of value
        - title: A bracket costs nothing
          desc: a + b / 2 over the 1480–1520 band prints 2240, a number no tachometer will ever read
        - title: Rounding is a decision
          desc: A hundred readings landing on an exact half total 5000 half-to-even and 5050 half-away-from-zero

