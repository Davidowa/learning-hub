      title: Precedence and associativity
      headers: [Expression, What wins, Result]
      rows:
        - ["2 + 3 * 4", "The product before the sum", "14"]
        - ["(2 + 3) * 4", "The bracket goes first", "20"]
        - ["10 + 7 % 3", "Remainder binds like the product", "11"]
        - ["true || false && false", "&& binds tighter than ||", "True"]
        - ["100 - 20 - 5", "Grouped from left to right", "75"]
