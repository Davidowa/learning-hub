  - divider:
      eyebrow: Block 02
      title: Declaring, assigning, reassigning
      lede: >-
        Three different statements about the same box, and two writing shortcuts that
        are not as innocent as they look.
      block: 2

  - concept:
      eyebrow: Key concept
      title: The box, the type and the lock
      lead: >-
        Declaring reserves the box and fixes its type. Assigning puts a value in it.
        Reassigning changes the value and never the type, because the type was settled
        at the declaration and stayed there. When a value must not move for the whole
        run, const puts the lock on and the compiler is what guards it.
      panel:
        label: What to know
        title: The type is settled once and is not negotiable
        note: >-
          A box declared int will not take 1500.5 even though the number fits. The build
          stops instead of throwing the decimals away behind your back.
      steps:
        - text: You declare and the type is fixed
        - text: You assign a compatible value
        - text: You reassign as often as you like
          loop: ↺ unless the box is const

  - code_output:
      eyebrow: Block 02 · Measured
      title: A beam cross-section, with the nominal dimension under const
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        const double BaseNom = 120.0;
        double height = 45.0;

        double area = BaseNom * height;
        Console.WriteLine(area);

        height = 60.0;
        area = BaseNom * height;
        Console.WriteLine(area);
        Console.WriteLine(2 * (BaseNom + height));
      output: |
        5400
        7200
        360

