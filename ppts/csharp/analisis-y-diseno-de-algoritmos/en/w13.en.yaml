  - code_output:
      eyebrow: Block 01 · Alias and copy
      title: An array is a reference and Clone is not
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        int[] src = { 1480, 1502, 1495 };
        int[] alias = src;
        alias[0] = 99;
        Console.WriteLine("src[0]  " + src[0]);

        int[] src2 = { 1480, 1502, 1495 };
        int[] copy = (int[])src2.Clone();
        copy[0] = 99;
        Console.WriteLine("src2[0] " + src2[0]);

        Console.WriteLine(ReferenceEquals(src, alias));
        Console.WriteLine(ReferenceEquals(src2, copy));
      output: |
        src[0]  99
        src2[0] 1480
        True
        False

  - divider:
      eyebrow: Block 02
      title: A string is an array you cannot edit
      lede: >-
        It is indexed the same way, walked the same way and it breaks the same way at the
        boundary. The one difference is that nobody gets to write into it.
      block: 2

  - code_output:
      eyebrow: Block 02 · Immutable
      title: ToUpper hands back another string and leaves yours alone
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        string tag = "sensor-07";
        tag.ToUpper();
        Console.WriteLine("tag        " + tag);
        Console.WriteLine("ToUpper()  " + tag.ToUpper());

        string raw = "  SENSOR-07  ";
        raw.Trim();
        Console.WriteLine("raw       [" + raw + "]");
        Console.WriteLine("Trim()    [" + raw.Trim() + "]");
      output: |
        tag        sensor-07
        ToUpper()  SENSOR-07
        raw       [  SENSOR-07  ]
        Trim()    [SENSOR-07]

  - code:
      eyebrow: Block 02 · The real line
      title: One logger line, end to end
      filename: Program.cs
      lang: csharp
      source: |
        using System.Globalization;

        string line = "  SENSOR-07:20.1,21.5,22.9  ";
        string[] parts = line.Trim().Split(':');
        string tag = parts[0];
        string[] nums = parts[1].Split(',');

        double sum = 0;
        foreach (string s in nums)
        {
            sum += double.Parse(s, CultureInfo.InvariantCulture);
        }

        double mean = sum / nums.Length;
        Console.WriteLine($"{tag} mean {mean:F3}");
      annotations:
        - label: Trim before Split
          text: The logger leaves spaces on both sides. Trim removes them once and they never come back.
        - label: Two cuts
          text: First on the colon to split tag from readings, then on the comma to split the readings apart.
        - label: The pinned culture
          text: Without InvariantCulture the 20.1 reads as 201 on a German machine, and TryParse still returns True.
        - label: What it prints
          text: SENSOR-07 mean 21.500, with the F3 specifier doing the presentation work.
          accent: true

