        double mean = (double)sum / rpm.Length;

        Console.WriteLine($"rpm.Length = {rpm.Length}");
        Console.WriteLine($"sum        = {sum}");
        Console.WriteLine($"mean       = {mean:F3}");
        Console.WriteLine($"outside    = {outside} of {rpm.Length}");
        Console.WriteLine($"rpm[0]     = {rpm[0]}");
        Console.WriteLine($"rpm[6]     = {rpm[6]}");
      output: |
        rpm.Length = 7
        sum        = 10478
        mean       = 1496.857
        outside    = 2 of 7
        rpm[0]     = 1480
        rpm[6]     = 1488

