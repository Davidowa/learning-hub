  - trace:
      eyebrow: Block 02 · Subtopic 6.1.3
      title: The string library, measured
      headers: [Call, Returns, What it teaches]
      rows:
        - ["id.StartsWith(\"SNS-\")", "True", "the exact prefix"]
        - ["id.StartsWith(\"sns-\")", "False", "case does matter"]
        - ["id.Contains(\"\")", "True", "empty is inside everything"]
        - ["raw.Replace(';', ',')", "20.1,21.5,22.9", "hands back another string"]
        - ["\"\".Split(';').Length", "1", "an empty line gives one field"]
      verdict: >-
        The empty string is a prefix, a suffix and a substring of everything, so an empty
        entry passes any naive check. That is why IsNullOrWhiteSpace comes before parsing.

  - code:
      eyebrow: Block 02 · The validator
      title: A part identifier, checked one part at a time
      filename: Program.cs
      lang: csharp
      source: |
        static bool ValidPartId(string raw)
        {
            string id = raw.Trim();
            if (id.Length != 10) return false;

            var ci = StringComparison.OrdinalIgnoreCase;
            if (!id.StartsWith("SNS-", ci)) return false;
            if (!id.EndsWith("-A") && !id.EndsWith("-B"))
                return false;

            for (int i = 4; i < 8; i++)
                if (!char.IsDigit(id[i])) return false;
            return true;
        }
      annotations:
        - label: Length first
          text: The cheapest check goes on top. If the length is not 10 there is nothing else worth looking at.
        - label: The caller's Trim
          text: The validator trims whatever it receives, so whoever calls it does not have to remember.
        - label: The digits
          text: char.IsDigit over positions 4 to 7. Four digits in SNS-4471-A, counted by the loop.
        - label: Risk
          text: The prefix was compared case-insensitively and the suffix two lines down was not. That is the bug.
          accent: true

  - trace:
      eyebrow: Block 02 · Five inputs
      title: The validator against five inputs
      headers: [Input, Returns, Why]
      rows:
        - ["SNS-4471-A", "True", "the full pattern"]
        - ["  SNS-4471-A  ", "True", "Trim() handled it"]
        - ["sns-4471-b", "False", "the suffix is case-sensitive"]
        - ["SNS-44X1-A", "False", "the X is not a digit"]
        - ["(empty)", "False", "length zero, like SNS-447-A"]
      verdict: >-
        The third row fails on purpose. Same string, two comparison policies two lines
        apart, one single bug.

  - code_output:
      eyebrow: Block 02 · Comparing for real
      title: The operator you already know fails on typed input
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        string typed = "SORT";
        var ci = StringComparison.OrdinalIgnoreCase;

        bool op = typed == "sort";
        bool eq = typed.Equals("sort");
        bool eqCi = typed.Equals("sort", ci);
        bool upper = typed.ToUpper() == "SORT";
        bool trim = " sort ".Trim() == "sort";
        bool one = "s".Equals("sort", ci);

        Console.WriteLine($"==   {op}   Equals  {eq}");
        Console.WriteLine($"+ci  {eqCi}    ToUpper {upper}");
        Console.WriteLine($"Trim {trim}    short   {one}");
      output: |
        ==   False   Equals  False
        +ci  True    ToUpper True
        Trim True    short   False

  - code_output:
      eyebrow: Block 02 · The boundary
      title: Two library calls and two different boundaries
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        string id = "SNS-4471-A";
        Console.WriteLine(id.Length);
        Console.WriteLine(id[9]);
        Console.WriteLine("[" + id.Substring(10) + "]");

        try { Console.WriteLine(id.Substring(11)); }
        catch (Exception e) { Console.WriteLine(e.GetType().Name); }

        try { Console.WriteLine(id[10]); }
        catch (Exception e) { Console.WriteLine(e.Message); }
      output: |
        10
        A
        []
        ArgumentOutOfRangeException
        Index was outside the bounds
        of the array.

