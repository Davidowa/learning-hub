  - code:
      eyebrow: Block 01 · At last
      title: The seven rpm readings under a single name
      filename: Program.cs
      lang: csharp
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };

        int sum = 0;
        int outside = 0;

        foreach (int r in rpm)
        {
            sum += r;
            if (r < 1480 || r > 1520) outside++;
        }

        Console.WriteLine($"rpm.Length = {rpm.Length}");
        Console.WriteLine($"sum        = {sum}");
      annotations:
        - label: One name
          text: Seven loose variables became one. The loop no longer changes when an eighth sample arrives.
        - label: The band rule
          text: r below 1480 or above 1520. That is the inclusive convention and it is written out wherever the count appears.
        - label: Length
          text: The array counts itself, not you. Change the literal above and the count follows on its own.
        - label: Risk
          text: The first sample is 1480, exactly the lower limit. Under the other convention the count would be 3 of 7.
          accent: true

  - code_output:
      eyebrow: Block 01 · Measured
      title: The same week 9 numbers, from one single loop
      filename: Program.cs
      lang: csharp
      output_label: On running
