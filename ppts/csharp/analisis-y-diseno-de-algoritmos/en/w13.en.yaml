  - code_output:
      eyebrow: Block 02 · Networking case
      title: The mean says 21.15 and the median says 12.25
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        using System.Globalization;

        string line = "  SEQ-0042:12.4,11.9,48.2,12.1  ";
        string[] ms = line.Trim().Split(':')[1].Split(',');

        double[] lat = new double[ms.Length];
        for (int i = 0; i < ms.Length; i++)
            lat[i] = double.Parse(ms[i], CultureInfo.InvariantCulture);

        double s = 0;
        foreach (double x in lat) s += x;
        Array.Sort(lat);
        Console.WriteLine($"mean   = {s / lat.Length}");
        Console.WriteLine($"sorted = [{string.Join(", ", lat)}]");
        Console.WriteLine($"median = {(lat[1] + lat[2]) / 2}");
      output: |
        mean   = 21.15
        sorted = [11.9, 12.1, 12.4, 48.2]
        median = 12.25

