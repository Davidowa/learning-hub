  - quiz:
      eyebrow: Quick check
      question: What does the last line print?
      filename: Program.cs
      lang: csharp
      source: |
        int[] a = { 1480, 1502, 1495 };
        int[] b = a;

        b[0] = 99;

        Console.WriteLine(a[0]);
      options:
        - "1480, because b took a copy of the array"
        - "99, because both names point at the same array"
        - "An error, because a became read only"
        - "0, because assigning an array clears it first"

  - takeaways:
