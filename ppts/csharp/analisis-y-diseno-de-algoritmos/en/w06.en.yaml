  - divider:
      eyebrow: Block 01
      title: The decision that compiles
      lede: >-
        The diamond in week 2 left with two arrows. The braces are the YES arrow, and
        everything outside them runs both ways.
      block: 1

  - concept:
      eyebrow: Key concept
      title: The braces are the diamond's YES arrow
      lead: >-
        On the flowchart the diamond had one exit across the top and another down the
        side. In C# the top one is the braces that follow the if, and the other one is
        everything after the closing brace. The compiler does not read your indentation to
        work that out. It reads the braces, and only the braces.
      panel:
        label: The finger trace
        title: Whatever sits outside the braces always runs
        note: >-
          It is the same trace as week 2, with the same rule. Put your finger on the line
          below and ask whether the diamond can avoid it. If the answer is no, that line
          does not belong to the decision.
      steps:
        - text: The condition is evaluated and answers true or false
        - text: If it answered true, the block inside the braces runs
        - text: If it answered false, the whole block is skipped
          loop: ↺ and the line below runs in both cases

  - code:
      eyebrow: Block 01 · The if
      title: The gearbox coolant interlock
      filename: Program.cs
      lang: csharp
      source: |
        double coolantC = 31.4;

        if (coolantC > 28.0)
        {
            Console.WriteLine("alarm: coolant over limit");
            Console.WriteLine("bypass valve opened");
        }

        Console.WriteLine($"reading {coolantC} C logged");
      annotations:
        - label: The condition
          text: >-
            In the brackets goes something only true or false. Here, the thermocouple
            against 28 degrees.
        - label: The braces
          text: >-
            They mark the block. The two lines inside it run only when the condition
            holds.
        - label: Outside the block
          text: >-
            Outside the braces, so the reading is logged with alarm and without. The
            diamond's other exit.
        - label: Risk
          text: >-
            Drop the braces and only the first line belongs to the if. The second opens
            the bypass every time, and the compiler says nothing.
          accent: true

  - code_output:
      eyebrow: Measured
      title: The same program with the reading under the limit
      filename: Program.cs
      lang: csharp
