  - code_output:
      eyebrow: Measured
      title: A condition is a value you can keep
      filename: Program.cs
      lang: csharp
      output_label: Output
      source: |
        int rpm = 3200;
        bool over = rpm > 3000;

        Console.WriteLine($"overspeed at {rpm} rpm -> {over}");
        Console.WriteLine($"3000 >  3000 -> {3000 > 3000}");
        Console.WriteLine($"3000 >= 3000 -> {3000 >= 3000}");
        Console.WriteLine($"1480 <  1480 -> {1480 < 1480}");
        Console.WriteLine($"1480 <= 1480 -> {1480 <= 1480}");
      output: |
        overspeed at 3200 rpm -> True
        3000 >  3000 -> False
        3000 >= 3000 -> True
        1480 <  1480 -> False
        1480 <= 1480 -> True

  - stat:
      eyebrow: The band rule this course uses
      value: 2 of 7
      text: >-
        samples out of band across the rpm run, under the rule r < 1480 || r > 1520
      note: >-
        Under the other convention, r <= 1480 || r >= 1520, it is 3 of 7. The first sample
        reads exactly 1480, and the only thing deciding which side it falls on is the
        operator you picked.

  - code_output:
      eyebrow: Block 02 · Games case
      title: The bounding box is four comparisons joined by &&
      filename: Program.cs
      lang: csharp
      output_label: Output
      source: |
        static bool Overlap(
            double ax, double ay, double aw, double ah,
            double bx, double by, double bw, double bh)
            => ax < bx + bw && ax + aw > bx
            && ay < by + bh && ay + ah > by;

        bool apart = Overlap(0, 0, 10, 10, 20, 0, 10, 10);
        bool cross = Overlap(0, 0, 10, 10, 5, 5, 10, 10);
        bool edge = Overlap(0, 0, 10, 10, 10, 0, 10, 10);

        Console.WriteLine($"apart     -> {apart}");
        Console.WriteLine($"overlap   -> {cross}");
        Console.WriteLine($"edge only -> {edge}");
      output: |
        apart     -> False
        overlap   -> True
        edge only -> False

  - code_output:
      eyebrow: Block 02 · Strings
      title: On a string the double equals always compares the value
      filename: Program.cs
      lang: csharp
      output_label: Output
      source: |
        string a = "SENSOR-07";
        string c = "SENSOR-" + "07";
        string d = "SENSOR-" + 07.ToString("00");
        bool casing = "Sensor-07" == a;

        Console.WriteLine($"a == c    {a == c}");
        Console.WriteLine($"ref a c   {ReferenceEquals(a, c)}");
        Console.WriteLine($"a == d    {a == d}");
        Console.WriteLine($"ref a d   {ReferenceEquals(a, d)}");
        Console.WriteLine($"lower case {casing}");
      output: |
        a == c    True
        ref a c   True
        a == d    True
        ref a d   False
        lower case False

  - divider:
      eyebrow: Block 03
      title: The ladder
      lede: >-
        Three or more mutually exclusive categories, checked from the top down. The first
        one that holds wins and the ones below are never read.
      block: 3

  - code:
      eyebrow: Block 03 · else if
      title: The tachometer band table, written as a ladder
      filename: Program.cs
      lang: csharp
      source: |
        static string Band(int rpm)
        {
            if (rpm < 0) return "invalid";
            else if (rpm < 800) return "idle";
            else if (rpm < 3000) return "nominal";
            else return "overspeed";
        }

        foreach (int r in new[] { -5, 500, 799, 800, 3000 })
            Console.WriteLine($"Band({r,5}) = {Band(r)}");
      annotations:
        - label: Top down
          text: >-
            The first rung is checked, then the second. The moment one holds, the rest are
            never evaluated.
        - label: The impossible rung
          text: >-
            The first catches the negative reading. No healthy tachometer makes one, so a
            cable is loose.
        - label: The final else
          text: >-
            It picks up whatever fell through every rung. Without it some readings stay
            unclassified.
        - label: Risk
          text: >-
            Order is part of the logic. Move one rung up and the ladder answers something
            else, with no warning.
          accent: true

  - trace:
      eyebrow: Measured
      title: What the ladder answers on five readings
      headers: [Reading, Rung that wins, What it returns]
      rows:
        - ["-5", "rpm < 0", "invalid"]
        - ["500", "rpm < 800", "idle"]
        - ["799", "rpm < 800", "idle"]
        - ["800", "rpm < 3000", "nominal"]
        - ["3000", "else", "overspeed"]
      verdict: >-
        799 is still idle and 800 is already nominal. The rung says strictly less than, so
        the value on the limit always belongs to the band above it.

  - code_output:
      eyebrow: Measured · the reorder
      title: Move one rung and a disconnected tachometer reads as idle
      filename: Program.cs
      lang: csharp
      output_label: Build and run
      source: |
        static string Band(int rpm)
        {
            if (rpm < 800) return "idle";
            else if (rpm < 0) return "invalid";
            else if (rpm < 3000) return "nominal";
            else return "overspeed";
        }

        Console.WriteLine($"Band(-5) = {Band(-5)}");
      output: |
        Build succeeded.
            0 Warning(s)
            0 Error(s)

        Band(-5) = idle

  - pitfalls:
      eyebrow: Common errors
      title: Four ways to lose the decision
      items:
        - label: Error 01
          title: One equals instead of two
          desc: >-
            On an int it is CS0029 and it never builds. On a bool it is warning CS0665, it
            builds, and it leaves the valve open.
        - label: Error 02
          title: Writing the block without braces
          desc: >-
            With no braces only the line right after the if belongs to the decision. The
            next one runs every time, whatever the indentation suggests.
        - label: Error 03
          title: Getting the limit operator wrong
          desc: >-
            Greater than leaves out the value sitting on the line. Greater or equal takes
            it in. On the 1480 sample that changes the count for the whole term.
        - label: Error 04
          title: Ordering the ladder badly
          desc: >-
            The first rung that holds wins. If the widest one ended up on top, the ones
            below are dead code and nothing warns you.

  - quiz:
      eyebrow: Quick check
      question: Under the exclusive rule, how many of the seven readings fall out of band?
      filename: Program.cs
      lang: csharp
      source: |
        int[] rpm = { 1480, 1502, 1495,
                      1533, 1471, 1509, 1488 };

        int outOfBand = 0;
        foreach (int r in rpm)
            if (r <= 1480 || r >= 1520) outOfBand++;

        Console.WriteLine(outOfBand);
      options:
        - "2, the same as under the rule this course uses"
        - "3, because the 1480 sample now falls outside"
        - "0, because no reading touches either limit"
        - "7, because the operator catches the whole array"

  - lab:
      eyebrow: Lab
      title: The coolant interlock, from the sheet to the code
      brief: >-
        Write the ladder that sorts the gearbox temperature into four bands and also
        decides whether the bypass opens. Read the value from the keyboard and test all
        three bands plus the exact value of every boundary.
      blocks:
        - label: Deliverable
          text: The Program.cs and one run per band, each with its output pasted in
        - label: Constraint
          text: >-
            The bands have to be mutually exclusive. No reading may be classified two
            ways.
        - label: The test
          text: >-
            Run the exact value of each boundary. That is where you find out whether you
            wanted greater than or greater or equal.

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: The braces are the structure
          desc: >-
            Indentation is for your eyes. The compiler reads the braces, and whatever sits
            outside them runs whatever happens
        - title: The operator decides the limit
          desc: >-
            The 1480 sample is inside under less than and outside under less or equal. That
            is why the rule is written out on every slide where the count appears
        - title: The ladder runs narrow to wide
          desc: >-
            The first rung that holds wins, and ordering it the other way round compiles
            without a single warning

  - homework:
      eyebrow: Homework
      title: Submission and grading criteria
      brief: >-
        Draw the flowchart for the interlock ladder, mark on it where the 1480 sample
        lands, and write out by hand the branch you predict for five readings. Then run
        the program and compare line by line.
      meta:
        - [Due, Before week 7]
        - [Format, Blackboard · flowchart PDF and Program.cs]
        - [Weight, Part of the 20 % for assignments]
      rubric:
        - ["Flowchart", "40 %", "Every diamond and both of its exits are complete and in order"]
        - ["Prediction", "40 %", "The five predicted branches match the run"]
        - ["The limit", "20 %", "The 1480 sample is marked and the choice justified"]

