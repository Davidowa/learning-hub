  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Combine conditions with the three operators
          sub: And say out loud which one demands both and which one settles for one
        - head: Explain what short-circuiting is
          sub: And why the whole safety of the idiom lives in the second ampersand
        - head: Put braces on every nested decision
          sub: Because the else binds to the inner if and indentation changes nothing
        - head: Write a switch expression
          sub: With its arms in order and its discard arm at the end
        - head: Compare two doubles by tolerance
          sub: Never with a double equals, always as an absolute difference against a margin

