  - divider:
      eyebrow: Block 03
      title: Arrays going in and coming out
      lede: >-
        An array is passed by value like everything else, and the method can still change
        it. That sentence is not a contradiction, and today it gets measured.
      block: 3

  - code_output:
      eyebrow: Measured
      title: An array parameter never needs a count beside it
      filename: Program.cs
      lang: csharp
      output_label: Output
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };
        Console.WriteLine(Sum(rpm));
        Console.WriteLine(Count(rpm));

        static int Sum(int[] v)
        {
            int total = 0;
            foreach (int x in v) total += x;
            return total;
        }

        static int Count(int[] v) => v.Length;
      output: |
        10478
        7

  - code_output:
      eyebrow: Measured
      title: The element stays written, not the replacement
      filename: Program.cs
      lang: csharp
      output_label: Output
      source: |
        int[] src = { 1480, 1502, 1495 };
        ZeroFirst(src);
        Console.WriteLine(src[0]);
        Replace(src);
        Console.WriteLine(src[0]);
        ReplaceRef(ref src);
        Console.WriteLine(src[0]);

        static void ZeroFirst(int[] v) { v[0] = 0; }
        static void Replace(int[] v) { v = new int[] { -1, -1, -1 }; }
        static void ReplaceRef(ref int[] v)
        {
            v = new int[] { -1, -1, -1 };
        }
      output: |
        0
        0
        -1

  - code_output:
      eyebrow: Measured
      title: The return type does not say whether you got a copy or the original
      filename: Program.cs
      lang: csharp
      output_label: Output
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };
        int[] w = Window(rpm, 2, 3);
        w[0] = 0;   Console.WriteLine(rpm[2]);
        int[] s = Same(rpm);
        s[0] = 0;   Console.WriteLine(rpm[0]);

        static int[] Window(int[] v, int start, int count)
        {
            int[] w = new int[count];
            for (int i = 0; i < count; i++) w[i] = v[start + i];
            return w;
        }
        static int[] Same(int[] v) { return v; }
      output: |
        1495
        0

  - code_output:
      eyebrow: Measured
      title: One method for two samples, for seven, or for none at all
      filename: Program.cs
      lang: csharp
      output_label: Output
      source: |
        Console.WriteLine(Mean(1480, 1502));
        int[] run = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };
        Console.WriteLine(Mean(run));
        Console.WriteLine(Mean());

        static double Mean(params int[] samples)
        {
            if (samples.Length == 0) return double.NaN;
            int total = 0;
            foreach (int s in samples) total += s;
            return (double)total / samples.Length;
        }
      output: |
        1491
        1496.857142857143
        NaN

  - quiz:
      eyebrow: Quick check
      question: >-
        The first two lines print 98 and 98.6. What do the last two print?
      filename: Program.cs
      lang: csharp
      source: |
        Console.WriteLine(C2F(37));
        Console.WriteLine(C2F(37.0));
        Console.WriteLine(C2F(25));
        Console.WriteLine(C2F(25.0));

        partial class Program
        {
            static int C2F(int c) => c * 9 / 5 + 32;
            static double C2F(double c)
                => c * 9.0 / 5.0 + 32.0;
        }
      options:
        - '77 both, which is why testing at 25 degrees hides the defect'
        - '77 and 77.0, because the second one keeps the decimal point'
        - '77 and 78.6, because the real division raises the result'
        - 'An error, C2F is already defined with that name'

  - lab:
      eyebrow: Lab
      title: Split the sixty-line Main
      brief: >-
        Take a program of yours from week 8 or week 9 that already works and split it into
        four named methods. The behaviour must not change. Run it before and after with the
        same inputs and keep both outputs.
      blocks:
        - label: Deliverable
          text: >-
            The Program.cs file with the four methods, and both runs pasted into a .txt,
            the before and the after
        - label: Constraint
          text: >-
            Mark all four static. If one of them reads a variable it did not receive as a
            parameter, the compiler will say so with CS8421
        - label: The test
          text: >-
            If the two outputs are not identical line by line, the refactor changed
            something and it is not finished yet

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: Declaring runs nothing
          desc: The file builds, runs, prints nothing and exits 0, and the compiler warns you with CS8321
        - title: static is a wall, not decoration
          desc: Mark the method and the compiler forbids it from reading the outside. That is its whole job
        - title: The array is shared
          desc: Writing an element reaches the caller; replacing the whole array stays inside the method

  - homework:
      eyebrow: Homework
      title: Submission and grading criteria
      brief: >-
        Submit the lab refactor with both runs, and add one more method that takes the
        array of seven rpm readings and returns the highest reading together with its
        index.
      meta:
        - [Due, Before week 11]
        - [Format, Blackboard · .cs]
        - [Weight, Part of the 20 % for assignments]
      rubric:
        - ["Behaviour", "40 %", "The two runs are identical"]
        - ["Isolation", "40 %", "The methods build with static"]
        - ["Naming", "20 %", "Each name says what it returns"]

