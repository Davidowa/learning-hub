  - divider:
      eyebrow: Block 01
      title: The anatomy of a method
      lede: >-
        Declaring, calling, and the keyword every tutorial makes you type without ever
        telling you why.
      block: 1

  - concept:
      eyebrow: Key concept
      title: A calculation with a name of its own
      lead: >-
        A method wraps a calculation, declares what it needs to receive and what it hands
        back, and from that moment the caller no longer has to open the body to trust the
        result. It is the same decomposition as week 2, except the compiler now understands
        it and checks it for you.
      panel:
        label: The real argument
        title: A named piece can be tested alone
        note: >-
          The same calculation pasted into five places cannot be tested. It can only be
          checked by hand, place by place, and nobody does that.
      steps:
        - text: Declared once, with its signature
        - text: Called as many times as needed
        - text: Fixed in a single place
          loop: ↺ and the fix reaches every call

  - code:
      eyebrow: Block 01 · Anatomy
      title: The mean of three thermocouples, packaged
      filename: Program.cs
      lang: csharp
      source: |
        double mean = Mean(21.0, 39.5, 22.4);
        Console.WriteLine(mean);

        static double Mean(double a, double b, double c)
        {
            double total = a + b + c;
            return total / 3.0;
        }
      annotations:
        - label: The return type
          text: >-
            double sits before the name and says what the method hands back. Half of the
            caller's contract.
        - label: The parameters
          text: >-
            Three slots with a name and a type. A call fills them in order and the
            compiler checks types.
        - label: return
          text: >-
            Hands the value back and ends the method there. Anything after the return
            never runs.
        - label: static
          text: >-
            It says the method works from its parameters alone. The next three slides
            measure that.
          accent: true

  - code_output:
      eyebrow: Measured
      title: Declaring a method runs nothing at all
      filename: Program.cs
      lang: csharp
      output_label: On build
      source: |
        static void PrintHeader()
        {
            Console.WriteLine("BATCH 07 - TELEMETRY");
        }
      output: |
        warning CS8321: The local
        function 'PrintHeader' is
        declared but never used

        Build succeeded.
            1 Warning(s)
            0 Error(s)

        dotnet run -> no output

  - code_output:
      eyebrow: Measured
      title: Calling it does run it, and the order of declaration is free
      filename: Program.cs
      lang: csharp
      output_label: Output
      source: |
        PrintHeader();
        Console.WriteLine(Mean(21.0, 39.5));
        Console.WriteLine(Mean(Mean(21.0, 39.5), 22.4));

        static void PrintHeader()
        {
            Console.WriteLine("BATCH 07 - TELEMETRY");
        }

        static double Mean(double a, double b)
        {
            return (a + b) / 2;
        }
      output: |
        BATCH 07 - TELEMETRY
        30.25
        26.325

  - code_output:
      eyebrow: Measured
      title: Drop static from this same method and it prints 9
      filename: Program.cs
      lang: csharp
      output_label: On build
      source: |
        int limitCelsius = 30;
        Console.WriteLine(OverLimit(39));

        static int OverLimit(int reading)
        {
            return reading - limitCelsius;
        }
      output: |
        error CS8421: A static local
        function cannot contain a
        reference to 'limitCelsius'.

        Build FAILED.
            0 Warning(s)
            1 Error(s)

  - pitfalls:
      eyebrow: Block 01 · Placement
      title: Four errors of placing a method
      items:
        - label: Error 01
          title: Writing public in front
          desc: >-
            Every tutorial shows public static. On a top-level method the compiler answers
            error CS0106, The modifier 'public' is not valid for this item, and it points
            at column 1.
        - label: Error 02
          title: Leaving code below a class
          desc: >-
            error CS8803, Top-level statements must precede namespace and type
            declarations. Every class you write goes at the bottom of the file, after the
            last executable line.
        - label: Error 03
          title: Dropping static inside a class
          desc: >-
            There it is compulsory. Without it you get error CS0120, An object reference is
            required. And calling it by its bare name is CS0103, the same one as week 9.
        - label: Error 04
          title: Thinking static makes it callable
          desc: >-
            It does not. Under top-level statements both forms build without a single
            warning and both print 7. What static buys you is the isolation.

  - divider:
      eyebrow: Block 02
      title: Returning, scope and overloading
      lede: >-
        What is born inside the method stays inside. And one name can serve several
        signatures, as long as every call has an obvious winner.
      block: 2

  - compare:
      eyebrow: Block 02 · The distinction
      title: Returning is not printing
      before:
        label: void
        file: prints.cs
        code: |
          static void ShowMean(double a,
                               double b)
          {
              Console.WriteLine((a + b) / 2);
          }

          double m = ShowMean(21.0, 39.5);
      after:
        label: With a return
        file: returns.cs
        code: |
          static double Mean(double a,
                             double b)
          {
              return (a + b) / 2;
          }

          double m = Mean(21.0, 39.5);
      note: >-
        The left one shows the number and does not hand it back, so the last line does not
        even build. The compiler answers error CS0029, Cannot implicitly convert type
        'void' to 'double'. If the method computes a value, return it; if it causes an
        effect, void.

  - code_output:
      eyebrow: Measured
      title: The same CS0103 as week 9, now with another name inside
      filename: Program.cs
      lang: csharp
      output_label: On build
      source: |
        Console.WriteLine(Mean(21.0, 39.5));
        Console.WriteLine(result);

        static double Mean(double a, double b)
        {
            double result = (a + b) / 2;
            return result;
        }
      output: |
        error CS0103: The name 'result'
        does not exist in the current
        context

        Build FAILED.
            0 Warning(s)
            1 Error(s)

  - compare:
      eyebrow: Block 02 · Overloading
      title: One name, two methods, the shape that builds
      before:
        label: Does not build
        file: local.cs
        code: |
          int Mean(int a, int b)
          {
              return (a + b) / 2;
          }
          double Mean(double a, double b)
          {
              return (a + b) / 2;
          }
      after:
        label: Does build
        file: partial.cs
        code: |
          partial class Program
          {
              static int Mean(int a, int b)
                  => (a + b) / 2;
              static double Mean(double a,
                                 double b)
                  => (a + b) / 2;
          }
      note: >-
        The left is not two methods, only one name used twice: error CS0128, A local
        variable or function named 'Mean' is already defined in this scope. Top-level code
        already lives in a class called Program; reopen it below for real methods.

  - code_output:
      eyebrow: Measured
      title: Three Mean methods, and the compiler picks by the types
      filename: Program.cs
      lang: csharp
      output_label: Output
      source: |
        Console.WriteLine(Mean(1480, 1502));
        Console.WriteLine(Mean(21.0, 39.5));
        Console.WriteLine(Mean(1480, 1502, 1495));

        partial class Program
        {
            static int Mean(int a, int b) => (a + b) / 2;
            static double Mean(double a, double b) => (a + b) / 2;
            static int Mean(int a, int b, int c) => (a + b + c) / 3;
        }
      output: |
        1491
        30.25
        1492

  - code_output:
      eyebrow: Measured
      title: A char widens to int before it widens to anything else
      filename: Program.cs
      lang: csharp
      output_label: Output
      source: |
        Console.WriteLine(Which(5));
        Console.WriteLine(Which(5.0));
        Console.WriteLine(Which(5L));
        Console.WriteLine(Which('A'));

        partial class Program
        {
            static string Which(int v) => "int overload";
            static string Which(double v) => "double overload";
            static string Which(long v) => "long overload";
        }
      output: |
        int overload
        double overload
        long overload
        int overload

