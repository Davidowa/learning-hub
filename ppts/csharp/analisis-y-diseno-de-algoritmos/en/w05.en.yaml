  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Classify the kinds of statement
          sub: Declaration, assignment, input and output, selection, repetition and jump
        - head: Write output somebody can read
          sub: With a label, a unit and a fixed number of decimals, not bare figures
        - head: Read a value from the keyboard
          sub: And remember that what arrives is text even when it looks like a number
        - head: Choose a converter on purpose
          sub: Convert.ToInt32, int.Parse and int.TryParse do not fail the same way
        - head: Check a reading before using it
          sub: The bool first, the value second, and never the other way round

