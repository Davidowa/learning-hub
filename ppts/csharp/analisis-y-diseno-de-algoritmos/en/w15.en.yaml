slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Week 15 · Unit 7.1 · Records and enumerations
      title: Analysis and Design of Algorithms
      subtitle: >-
        Seven parallel arrays are a defect waiting to happen. One array of a type you
        invented is not, and that type carries a default value that will lie to you.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, COM101 · Term 1]
