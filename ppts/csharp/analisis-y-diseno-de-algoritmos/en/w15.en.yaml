  - agenda:
      eyebrow: Agenda
      title: Three working blocks
      cards:
        - title: The record
          desc: Choosing the fields is the design, and the compiler will audit that choice
        - title: The enumeration
          desc: A named set that on the inside still knows it is a number
        - title: The sensor bank
          desc: An array of structures and the scans you already know how to write
        - title: Your turn
          desc: The field table for the record behind your final project

  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Declare a record and an enumeration
          sub: With every field named, typed and justified in a single line
        - head: Explain why a struct copies
          sub: And why a class in its place does not, with the measurement beside it
        - head: Fill and walk an array of structures
          sub: With for when you have to write and foreach when you only read
        - head: Recognise the default value that lies
          sub: The first name in the enumeration is 0, and 0 is what an unfilled field holds
        - head: Compile with not one warning
          sub: The three CS0649 in the course's own example, and the line that takes them to zero

