  - trace:
      eyebrow: Block 02 · Two rules stacked
      title: Math.Round with digits, and the decimal that was never stored
      headers: [Call, Prints, What was actually stored]
      rows:
        - ["Math.Round(21.35, 1)", "21.4", "21.350000000000001"]
        - ["Math.Round(21.45, 1)", "21.4", "21.449999999999999"]
        - ["Math.Round(24.985, 2)", "24.98", "24.984999999999999"]
        - ["Math.Round(24.975, 2)", "24.98", "24.975000000000001"]
      verdict: >-
        Predict all four with the half-to-even rule and you get them right, yet not one of
        the four decimals you typed was stored as a midpoint. Underneath sits week 4's
        0.1 + 0.2.

  - divider:
      eyebrow: Block 03
      title: Random and Convert
      lede: >-
        Two more libraries, with signatures and failure modes like any other. One of the
        two decides whether your program can be tested twice.
      block: 3

  - code_output:
      eyebrow: Block 03 · Unseeded
      title: A hundred fresh generators give a hundred distinct numbers
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        int[] first = new int[100];
        for (int k = 0; k < 100; k++)
            first[k] = new Random().Next(1, 1000000);

        Console.WriteLine(first.Distinct().Count() + " of 100");

        Random a1 = new Random();
        Random a2 = new Random();
        Console.WriteLine($"a1 = {a1.Next(1, 7)} {a1.Next(1, 7)}");
        Console.WriteLine($"a2 = {a2.Next(1, 7)} {a2.Next(1, 7)}");
      output: |
        100 of 100
        a1 = 3 5
        a2 = 5 3

  - code_output:
      eyebrow: Block 03 · Seeded
      title: The same simulated run, as many times as you like
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        for (int k = 0; k < 3; k++)
        {
            Random r = new Random(2026);
            int[] sim = new int[5];

            for (int i = 0; i < 5; i++)
                sim[i] = r.Next(1400, 1601);

            Console.WriteLine(string.Join(", ", sim));
        }
      output: |
        1432, 1456, 1584, 1599, 1584
        1432, 1456, 1584, 1599, 1584
        1432, 1456, 1584, 1599, 1584

  - compare:
      eyebrow: Block 03 · Not a matter of style
      title: Where the generator is built decides what comes out
      before:
        label: Inside the loop
        file: bad.cs
        lang: csharp
        code: |
          string bad = "";
          for (int k = 0; k < 8; k++)
              bad += new Random(42).Next(1, 7) + " ";

          Console.WriteLine(bad.Trim());
      after:
        label: Once, outside
        file: good.cs
        lang: csharp
        code: |
          Random r = new Random(42);
          string good = "";
          for (int k = 0; k < 8; k++)
              good += r.Next(1, 7) + " ";

          Console.WriteLine(good.Trim());
      note: >-
        The left one prints 5 5 5 5 5 5 5 5 and the right one prints 5 1 1 4 2 2 5 4. A
        seed is the starting point of a sequence, so re-seeding on every pass reads its
        first number eight times over.

  - code_output:
      eyebrow: Block 03 · The half-open convention
      title: A hundred thousand draws of Next(1, 7) and never a 7
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        Random s = new Random(1);
        int lo = int.MaxValue, hi = int.MinValue;

        for (int k = 0; k < 100000; k++)
        {
            int v = s.Next(1, 7);
            if (v < lo) lo = v;
            if (v > hi) hi = v;
        }
        Console.WriteLine($"{lo}, {hi}");

        try { new Random(1).Next(7, 1); }
        catch (Exception e) { Console.WriteLine(e.GetType().Name); }
      output: |
        1, 6
        ArgumentOutOfRangeException

  - code_output:
      eyebrow: Block 03 · Convert
      title: Base conversion was already written, and so was its failure
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        string? nothing = null;
        Console.WriteLine(Convert.ToInt32(nothing));
        Console.WriteLine(Convert.ToString(255, 2));
        Console.WriteLine(Convert.ToInt32("FF", 16));
        Console.WriteLine(Convert.ToChar(65));

        try { Convert.ToInt32("3.7"); }
        catch (Exception e) { Console.WriteLine(e.Message); }

        try { Convert.ToInt32("2147483648"); }
        catch (Exception e) { Console.WriteLine(e.Message); }
      output: |
        0
        11111111
        255
        A
        The input string '3.7' was not
        in a correct format.
        Value was either too large or
        too small for an Int32.

  - quiz:
      eyebrow: Quick check
      question: What does the last line print?
      filename: Program.cs
      lang: csharp
      source: |
        double reading = 39.5;
        double limit = 30.0;

        Math.Clamp(reading, 0.0, limit);

        Console.WriteLine(reading);
      options:
        - "30, because Clamp trimmed the reading to the limit"
        - "39.5, because Clamp returns and modifies nothing"
        - "An error, because the using for Math is missing"
        - "0, because Clamp starts from the lower bound"

  - lab:
      eyebrow: Lab
      title: Testing the accumulators with no bench in the room
      brief: >-
        Generate twenty simulated rpm samples from a seed of your own choosing and push
        them through the week 9 accumulators. Report the sum, the mean and how many fall
        outside the 1480 to 1520 band.
      blocks:
        - label: Deliverable
          text: The .cs file and the run, with the seed written above the result
        - label: Constraint
          text: The generator is built once, and outside the loop
        - label: The test
          text: Run the program twice. If all twenty numbers change, you did not seed it.

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: Look before you write it
          desc: Math.Clamp was last week's ClampToLimit, already written and already tested
        - title: The signature is the contract
          desc: Math.Pow returns a double even though it prints 1024, and CS0266 stops the build
        - title: The seed goes in the report
          desc: A program with randomness can only be tested twice if the generator is seeded

