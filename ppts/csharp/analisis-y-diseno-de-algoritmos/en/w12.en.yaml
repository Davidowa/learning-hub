  - divider:
      eyebrow: Block 01
      title: Math, and the four times it surprises
      lede: >-
        The standard library already holds what you were about to write. It also holds how
        it fails, and that is the half almost nobody reads.
      block: 1

  - code:
      eyebrow: Block 01 · On the bench
      title: The RMS value of one vibration window
      filename: Program.cs
      lang: csharp
      source: |
        double[] v = { 0.42, -0.31, 0.55, -0.48, 0.12, -0.27, 0.61 };

        double ss = 0;
        foreach (double x in v)
        {
            ss += x * x;
        }

        double rms = Math.Sqrt(ss / v.Length);

        Console.WriteLine($"RMS raw   = {rms}");
        Console.WriteLine($"RMS :F4   = {rms:F4} mm/s");
      annotations:
        - label: What you write
          text: The sum of squares and the division. That part really is yours.
        - label: What you do not write
          text: The square root. Math.Sqrt has been written and tested by more people than you will ever meet.
        - label: The format
          text: The F4 specifier trims the reading to four decimals. It does not change the stored value.
        - label: Risk
          text: Math.Sqrt hands back a double with all of its digits. Print it raw and you get seventeen.
          accent: true

  - code_output:
      eyebrow: Block 01 · Measured
      title: Seventeen raw digits and four on the slide
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        double rms = Math.Sqrt(ss / v.Length);
        double mag = Math.Sqrt(3 * 3 + 4 * 4 + 0 * 0);

        Console.WriteLine($"RMS raw   = {rms}");
        Console.WriteLine($"RMS :F4   = {rms:F4} mm/s");
        Console.WriteLine($"magnitude = {mag}");
      output: |
        RMS raw   = 0.42507142257003616
        RMS :F4   = 0.4251 mm/s
        magnitude = 5

  - code_output:
      eyebrow: Block 01 · Surprise 01
      title: The only value that is not equal to itself
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        Console.WriteLine(Math.Sqrt(2));
        Console.WriteLine(Math.Sqrt(2).ToString("F3"));

        double nan = Math.Sqrt(-1);
        Console.WriteLine(
            $"{nan} {nan == nan} {nan != nan} {double.IsNaN(nan)}");
      output: |
        1.4142135623730951
        1.414
        NaN False True True

  - code_output:
      eyebrow: Block 01 · Surprise 02
      title: The sine of pi is not zero, and there is a reason
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        Console.WriteLine(Math.Sin(Math.PI));
        Console.WriteLine(Math.Sin(Math.PI) == 0);
        Console.WriteLine(Math.Abs(Math.Sin(Math.PI)) < 1e-9);
        Console.WriteLine(Math.Cos(Math.PI));
        Console.WriteLine(Math.Sin(Math.PI / 2));
        Console.WriteLine(Math.PI);
      output: |
        1.2246467991473532E-16
        False
        True
        -1
        1
        3.141592653589793

  - trace:
      eyebrow: Block 01 · Surprise 03
      title: The library works in radians, and the conversion is not exact
      headers: [Expression, Prints, Reading]
      rows:
        - ["Math.Sin(30 * Math.PI / 180)", "0.49999999999999994", "not 0.5"]
        - ["Math.Sin(double.DegreesToRadians(30))", "0.49999999999999994", "the same error"]
        - ["double.RadiansToDegrees(Math.PI)", "180", "exact"]
        - ["Math.Sqrt(3*3 + 4*4 + 0*0)", "5", "exact"]
      verdict: >-
        Which of the two cases you get is not something you can predict by reading the
        formula. That is why the tolerance comparison from week 7 is the rule and exact
        equality is the exception.

  - table:
      eyebrow: Block 01 · Surprise 04
      title: Five ways to drop the decimals and they disagree
      headers: [Value, "(int)", Round, Convert, Floor, Truncate]
      rows:
        - ["2.5", "2", "2", "2", "2", "2"]
        - ["3.5", "3", "4", "4", "3", "3"]
        - ["-2.5", "-2", "-2", "-2", "-3", "-2"]
        - ["3.9", "3", "4", "4", "3", "3"]

  - code_output:
      eyebrow: Block 01 · Metrology
      title: Why round half to even exists at all
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        double[] halves = { 0.5, 1.5, 2.5, 3.5, 4.5 };
        foreach (double m in halves)
            Console.Write(Math.Round(m) + " ");
        Console.WriteLine();

        double even = 0, away = 0, trueSum = 0;
        for (int k = 0; k < 100; k++)
        {
            double v = k + 0.5;
            trueSum += v;
            even += Math.Round(v, MidpointRounding.ToEven);
            away += Math.Round(v, MidpointRounding.AwayFromZero);
        }
        Console.WriteLine($"{trueSum} {even} {away}");
      output: |
        0 2 2 4 4
        5000 5000 5050

