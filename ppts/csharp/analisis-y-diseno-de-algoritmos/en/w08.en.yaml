  - code:
      eyebrow: Block 02 · The bench case
      title: Arming the conveyor, with its interlock
      filename: Program.cs
      lang: csharp
      source: |
        bool door = false, estop = true, armed = false;
        int rpm = 120, attempts = 0;
        do
        {
            attempts++;
            bool ready = door && estop && rpm < 50;
            Console.WriteLine($"attempt {attempts}: ready={ready}");
            if (ready) { armed = true; break; }
            if (attempts == 1) door = true;
            if (attempts == 2) rpm = 20;
        } while (attempts < 3);
        if (armed) Console.WriteLine($"ARMED on {attempts}");
        else Console.WriteLine("LATCHED: manual reset needed");
      annotations:
        - label: Three physical reasons
          text: >-
            Guard door closed, emergency stop released, shaft below 50 rpm. Not one is a
            password.
        - label: The first break of the term
          text: >-
            It ends the do-while as soon as all three conditions hold, without spending
            the third attempt.
        - label: The interlock
          text: >-
            Three failed attempts and the machine latches. Clearing it means the panel,
            not typing again.
        - label: Risk
          text: >-
            If the attempt counter never rises inside the body, the sequence asks for
            permission forever.
          accent: true

  - trace:
      eyebrow: Block 02 · Measured trace
      title: The three attempts, with the state of every sensor
      headers: [Attempt, door, estop, rpm, ready]
      rows:
        - ["1", "False", "True", "120", "False"]
        - ["2", "True", "True", "120", "False"]
        - ["3", "True", "True", "20", "True"]
      verdict: >-
        The operator closes the door between the first and the second, and the shaft
        finishes braking between the second and the third. The run prints ARMED on 3. With
        the same code and the door open all three times, the last line would be the latch.

  - code_output:
      eyebrow: Block 02 · Measured
      title: How many iterations a break ends, exactly
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        int bodies = 0, tests = 0, stop = -1;
        for (int i = 0; i < 10; i++)
        {
            tests++;
            if (i == 4) { stop = i; break; }
            bodies++;
        }
        Console.WriteLine($"condition tests reached  {tests}");
        Console.WriteLine($"bodies completed         {bodies}");
        Console.WriteLine($"index at the break       {stop}");
        Console.WriteLine($"never started            {10 - tests}");
      output: |
        condition tests reached  5
        bodies completed         4
        index at the break       4
        never started            5

  - stat:
      eyebrow: Measured on the rpm run
      value: 4 of 7
      text: Comparisons before the first reading above 1520 turns up
      note: >-
        The value is 1533 and it lives at index 3. The three readings after it were never
        read, because the break ended the loop where it was standing. That is a search, and
        in week 14 it comes back with its name on.

  - code_output:
      eyebrow: Block 02 · Measured
      title: What a continue skips, and what it leaves
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };
        int counted = 0, skipped = 0, sum = 0;
        for (int i = 0; i < rpm.Length; i++)
        {
            bool outOfBand = rpm[i] < 1480 || rpm[i] > 1520;
            if (outOfBand) { skipped++; continue; }
            counted++;
            sum += rpm[i];
        }
        Console.WriteLine($"passes started      {rpm.Length}");
        Console.WriteLine($"skipped by continue {skipped}");
        Console.WriteLine($"bodies completed    {counted}");
        Console.WriteLine($"in-band sum      {sum}");
      output: |
        passes started      7
        skipped by continue 2
        bodies completed    5
        in-band sum      7474

  - quiz:
      eyebrow: Quick check
      question: What is j worth when this program reaches its last line?
      filename: Program.cs
      lang: csharp
      source: |
        int j = 0;
        while (j < 6)
        {
            if (j % 2 == 0) continue;
            j++;
        }
        Console.WriteLine(j);
      options:
        - It reaches 6, because continue only skips one pass
        - It stays at 0 and the program never gets to that line
        - It is 5, because the last pass skips the increment
        - It does not compile, continue needs a for and not a while

  - code_output:
      eyebrow: Answer · Measured
      title: In a for the change slot runs; in a while nothing runs at all
      filename: Program.cs
      lang: csharp
      output_label: With a safety cap
      source: |
        int j = 0, spins = 0;
        while (j < 6)
        {
            spins++;
            if (spins > 1000) break;   // safety cap
            if (j % 2 == 0) continue;  // j never rises here
            j++;
        }
        Console.WriteLine("while + continue before j++");
        Console.WriteLine($"j = {j} after {spins} spins");
        Console.WriteLine("safety cap at 1000");
      output: |
        while + continue before j++
        j = 0 after 1001 spins
        safety cap at 1000

  - code_output:
      eyebrow: Block 02 · Measured
      title: Convergence has a price, counted in steps
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        double[] tols = { 1e-3, 1e-6, 1e-12 };
        for (int t = 0; t < tols.Length; t++)
        {
            double lo = 1.0, hi = 2.0; int steps = 0;
            while (hi - lo > tols[t])
            {
                double mid = (lo + hi) / 2;
                if (mid * mid > 2.0) hi = mid; else lo = mid;
                steps++;
            }
            Console.WriteLine($"tol {tols[t],-6} -> {steps} steps");
        }
        Console.WriteLine($"Math.Sqrt(2) = {Math.Sqrt(2)}");
      output: |
        tol 0.001  -> 10 steps
        tol 1E-06  -> 20 steps
        tol 1E-12  -> 40 steps
        Math.Sqrt(2) = 1.4142135623730951

  - pitfalls:
      eyebrow: Block 02 · Common errors
      title: Four ways a loop goes wrong on you
      items:
        - label: Error 01
          title: The loop that never ends
          desc: >-
            Nothing inside the body moves the control variable. The condition stays true
            and the terminal keeps running until you interrupt it yourself.
        - label: Error 02
          title: continue over your own increment
          desc: >-
            In a for the change slot runs after the continue. In a while nothing runs, and
            j is still 0 after a thousand and one trips through the body.
        - label: Error 03
          title: break where there is no loop
          desc: >-
            The compiler names what is missing, not the word that is spare. error CS0139
            reads No enclosing loop out of which to break or continue, and an if is no loop.
        - label: Error 04
          title: Logging after the break
          desc: >-
            The message you put under the break never prints. The build still succeeds,
            with warning CS0162 Unreachable code detected. Log first, break second.

