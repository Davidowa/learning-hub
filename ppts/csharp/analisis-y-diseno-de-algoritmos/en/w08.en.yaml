  - divider:
      eyebrow: Block 01
      title: while, and the four beats
      lede: Initialise, check, body, change. If you cannot point at the change, do not run the program.
      block: 1

  - concept:
      eyebrow: Key concept
      title: The line that makes the condition false has a line number
      lead: >-
        A loop is not a vague idea about repeating. It is four beats that happen in order
        and that you can point at in the code. The first prepares the control variable, the
        second judges it, the third does the work and the fourth moves the variable towards
        the end. When someone shows you a loop, ask about the fourth.
      panel:
        label: The question to answer before running anything
        title: Which line makes the condition false?
        note: >-
          If nobody in the room can point at it, the program does not get run. This is not
          style advice. It is the difference between a run and a hijacked terminal.
      steps:
        - text: Before the loop, the control variable is born with a value
        - text: In the header, the whole condition is judged
        - text: Inside, the body does the work of the pass
        - text: Also inside, something moves the control variable
          loop: ↺ and the fourth beat is the one that gets forgotten

  - code:
      eyebrow: Block 01 · while
      title: The bench accumulator, with the four beats marked
      filename: Program.cs
      lang: csharp
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };

        int i = 0;                  // 1 · initialise
        int sum = 0;

        while (i < rpm.Length)      // 2 · check
        {
            sum += rpm[i];          // 3 · body
            i++;                    // 4 · change
        }

        Console.WriteLine(sum);
      annotations:
        - label: The rpm run
          text: >-
            Seven tachometer readings from the belt drive bench. The same seven return in
            weeks 9 and 14.
        - label: The accumulator
          text: >-
            sum lives outside the loop. Declared inside, it resets each pass and holds one
            reading.
        - label: rpm.Length
          text: >-
            The array knows how many elements it has, so the loop does not depend on a 7
            typed by hand.
        - label: Risk
          text: >-
            Delete i++ and the condition never changes. The terminal runs until Control C
            stops it.
          accent: true

  - code_output:
      eyebrow: Block 01 · Measured
      title: The loop that terminates on paper and never terminates in practice
      filename: Program.cs
      lang: csharp
      output_label: On running
      source: |
        double x = 0; int steps = 0;
        while (x != 1.0 && steps < 1000) { x += 0.1; steps++; }
        Console.WriteLine($"!=  after {steps} passes");
        Console.WriteLine($"x = {x}");
        Console.WriteLine($"x == 1.0 -> {x == 1.0}");

        double y = 0; int steps2 = 0;
        while (y < 1.0) { y += 0.1; steps2++; }
        Console.WriteLine($"<   stops after {steps2} passes");
        Console.WriteLine($"y = {y}");
      output: |
        !=  after 1000 passes
        x = 99.9999999999986
        x == 1.0 -> False
        <   stops after 11 passes
        y = 1.0999999999999999

  - table:
      eyebrow: Block 01 · The four words
      title: What each one decides, and how many passes it guarantees
      headers: [Word, What it decides, Minimum passes]
      rows:
        - ["while", "Judges before the first pass, so it may never run at all", "0"]
        - ["do-while", "Runs the body and judges what came back afterwards", "1"]
        - ["break", "Ends the loop exactly where it is standing", "—"]
        - ["continue", "Abandons the pass and jumps to the change beat", "—"]

  - divider:
      eyebrow: Block 02
      title: do-while, break and continue
      lede: Three ways to keep the wrong operator from taking the program down, and all three are counted.
      block: 2

  - code_output:
      eyebrow: Block 02 · Measured
      title: One runs once, the other never, and the compiler says so first
      filename: Program.cs
      lang: csharp
      output_label: Build and run
      source: |
        int guard = 0;
        do { guard++; } while (false);

        int guard2 = 0;
        while (false) { guard2++; }

        Console.WriteLine($"do-while (false) -> guard  = {guard}");
        Console.WriteLine($"while (false)    -> guard2 = {guard2}");
      output: |
        Program.cs(5,17): warning CS0162:
        Unreachable code detected

        do-while (false) -> guard  = 1
        while (false)    -> guard2 = 0

  - code:
      eyebrow: Block 02 · do-while
      title: Reading a sample the operator may get wrong
      filename: Program.cs
      lang: csharp
      source: |
        int attempts = 0;
        int rpm;
        bool ok;
        do
        {
            attempts++;
            Console.WriteLine("rpm (1400-1600):");
            string? line = Console.ReadLine();
            bool parsed = int.TryParse(line, out rpm);
            ok = parsed && rpm >= 1400 && rpm <= 1600;
            if (!ok) Console.WriteLine($"  rejected '{line}'");
        } while (!ok);

        Console.WriteLine($"accepted {rpm} on attempt {attempts}");
      annotations:
        - label: Why do-while
          text: >-
            You have to ask for the sample before you can judge it, so the body runs at
            least once.
        - label: Two guards
          text: >-
            First that the text is an integer, then that it falls inside the bench band.
            In that order.
        - label: Short circuit
          text: >-
            The second && never gets evaluated if TryParse failed. Week 7 doing real work
            here.
        - label: Risk
          text: >-
            If the while condition ignores ok, the loop keeps asking even when the first
            sample was fine.
          accent: true

  - code_output:
      eyebrow: Block 02 · Measured
      title: Three keystrokes, two refusals, and a program still alive
      filename: Program.cs
      lang: csharp
      output_label: abc · 999 · 1502
      source: |
        bool parsed = int.TryParse(line, out rpm);
        ok = parsed && rpm >= 1400 && rpm <= 1600;
        if (!ok) Console.WriteLine($"  rejected '{line}'");
      output: |
        rpm (1400-1600):
          rejected 'abc'
        rpm (1400-1600):
          rejected '999'
        rpm (1400-1600):
        accepted 1502 on attempt 3

  - code_output:
      eyebrow: Block 02 · Measured
      title: The same menu with Convert, and the first key kills it
      filename: Program.cs
      lang: csharp
      output_label: abc
      source: |
        Console.WriteLine("rpm (1400-1600):");
        string? line = Console.ReadLine();
        int rpm = Convert.ToInt32(line);
        Console.WriteLine($"accepted {rpm}");
