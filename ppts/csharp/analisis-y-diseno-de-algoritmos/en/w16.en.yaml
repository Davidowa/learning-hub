slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Week 16 · Unit 7 · Integration and final project
      title: Analysis and Design of Algorithms
      subtitle: >-
        A free topic, a fixed checklist, a report that carries a third of the grade, and a
        program that has to run in front of the room.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, COM101 · Term 1]
        - [Session, 16 of 17]

  - agenda:
      eyebrow: Agenda
      title: Three working blocks
      cards:
        - title: The deal
