        - title: The skeleton
          desc: A file that builds with zero warnings before the first feature exists
        - title: The review
          desc: You present your problem and your rejected alternative, and leave with two findings
        - title: Demo day
          desc: The happy path, one deliberately broken input, and two questions

  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Formulate an engineering problem
          sub: And name one alternative you considered and rejected, with the reason
        - head: Audit your code against the checklist
          sub: Thirteen lines, each one citing the week that taught it
        - head: Put a guard ahead of every write
          sub: One if turns an exception into a message and a clean exit
        - head: Write the report
          sub: Narrative, justification, and the evidence the term already produced
        - head: Hold a design review
          sub: Hand a classmate one written risk and one checklist item

  - roadmap:
      eyebrow: Course map
      title: Where we are in the term
      phases:
        - label: 01 · Weeks 1–3
          title: Thinking and the toolchain
          desc: How a problem is solved before a single line is written
          state: done
        - label: 02 · Weeks 4–9
          title: Data, decisions, repetition
          desc: Types, expressions, selection and loops
          state: done
        - label: 03 · Weeks 10–12
          title: Functions
          desc: Yours, by value and by reference, and the ones already written
          state: done
        - label: 04 · Weeks 13–17
          title: Collections, structures, project
          desc: Arrays, strings, sorting, searching, records and the project
          state: now

  - divider:
      eyebrow: Block 01
      title: The deal
      lede: >-
        You pick the problem. The checklist and the rubric are not negotiable, and both have
        been on Blackboard since the first week.
      block: 1

  - table:
      eyebrow: Block 01 · Rubric
      title: How the project's 20 % is split
      headers: [Item, Weight, What is checked]
      rows:
        - ["Execution", "35 %", "It runs and does what it says"]
        - ["Design", "25 %", "The logic and its decisions"]
        - ["Practices", "10 %", "Order, names, zero warnings"]
        - ["Narrative", "15 %", "It reads without you there"]
        - ["Analysis", "10 %", "The rejected alternative"]
        - ["Evidence", "5 %", "Traces, runs and the forms"]

  - method:
      eyebrow: Block 01 · The floor
      title: The 30 % floor is two separate things
      statement: >-
        No C# program measures a rubric. Half of this rule can be run, and the other half is
        a quotation from the syllabus.
      points:
        - label: The measurable half
          text: >-
            That dotnet build succeeds and that dotnet run emits the menu prompt on stdout.
            That check runs on the reference skeleton and it passes.
        - label: The policy half
          text: >-
            «If the project does not run, its maximum grade is 30 %». It is a clause of
            the syllabus, not a measurement, and it is not negotiable.
        - label: Why they stay apart
          text: >-
            A program can print its menu and still exit −532462766, and another can exit 0
            without printing any menu at all.

  - table:
      eyebrow: Block 01 · The checklist, 1 of 2
      title: What the code has to contain
      headers: [Week, What has to appear]
      rows:
        - ["w4", "Three variable types and one const"]
        - ["w4", "An expression where the parentheses change the result"]
        - ["w5", "Reading input and formatted output, with the culture pinned"]
        - ["w6–w7", "if / else if / else, or a switch with a _ or default arm"]
        - ["w8", "while or do-while with a proven exit, and one justified break"]
        - ["w9", "for or foreach with an accumulator"]
        - ["w10", "Four functions, one returning a value and one taking an array"]

  - table:
      eyebrow: Block 01 · The checklist, 2 of 2
      title: And the six lines still missing
      headers: [Week, What has to appear]
      rows:
        - ["w11", "ref or out used meaningfully, and TryParse counts"]
        - ["w12", "One function from Math, Random or Convert"]
        - ["w13", "A one-dimensional array and one string operation"]
        - ["w14", "A 2-D array, or a sort or search with its count reported"]
        - ["w15", "One struct with an array of it, and an enum with Ok, Warning and Fault"]
        - ["w16", "dotnet build with zero warnings"]

  - tiers:
      eyebrow: Block 01 · The report
      title: Four things the PDF has to carry
      items:
        - key: "01"
          title: The problem
          desc: >-
            The engineering problem identified, in your own words. It is the direct measure
            of ABET SO 1 and it is the first page of the report.
        - key: "02"
          title: The alternative
          desc: >-
            At least one solution you considered and rejected, with the reason you rejected
            it. Without this the report is incomplete.
          accent: true
        - key: "03"
          title: The evidence
          desc: >-
            The predicted trace, the run and the diff, including one deliberately broken
            input that the program survives without dying.
        - key: "04"
          title: The appendices
          desc: >-
            Both forms from the design review, and the limitations you find in your own
            program before anyone else does.

  - divider:
      eyebrow: Block 02
      title: The reference skeleton
      lede: >-
        A file that already builds and already runs, with no feature inside it. Arriving at
        the work session with this is half an afternoon saved.
      block: 2

  - code:
      eyebrow: Block 02 · The menu
      title: The week 8 loop, driving the week 10 functions
      filename: Program.cs
      lang: csharp
      source: |
        while (running)
        {
            Console.Write("option: ");
            switch (ReadOption())
            {
                case 1: Register(bank, ref count); break;
                case 2: ListAll(bank, count); break;
                case 3: ShowStats(bank, count); break;
                case 0: running = false; break;
                default: Console.WriteLine("invalid option"); break;
            }
        }
        Console.WriteLine("done");
      annotations:
        - label: Above the loop
          text: Sample[] bank = new Sample[3], int count = 0 and bool running = true.
        - label: ref count
          text: Register has to move the caller's counter, so it takes it by reference.
        - label: The default arm
          text: Anything that is not 0, 1, 2 or 3 lands here and the menu stays alive.
        - label: The proven exit
          text: running changes only in the case 0 arm, and that is why the loop ends.
          accent: true

  - code_output:
      eyebrow: Block 02 · Measured
      title: It builds with zero warnings and exits with zero
      filename: Program.cs
      lang: csharp
      output_label: Build and run
      source: |
        static int ReadOption()
        {
            string? line = Console.ReadLine();
            if (line == null) return 0;
            return int.TryParse(line, out int v) ? v : -1;
        }
      output: |
        Build succeeded.
            0 Warning(s)
            0 Error(s)

        option: done
        exit=0

  - code:
      eyebrow: Block 02 · The guard
      title: One if ahead of the write, and nothing else
      filename: Program.cs
      lang: csharp
      source: |
        static void Register(Sample[] b, ref int count)
        {
            if (count >= b.Length)
            {
                Console.WriteLine("bank full, rejected");
                return;
            }
            b[count].SensorId = count + 1;
            b[count].Celsius = 20.0 + count;
            b[count].State = Status.Ok;
            count++;
            Console.WriteLine($"stored in slot {count - 1}");
        }
      annotations:
        - label: The condition
          text: count reaches b.Length, and that slot does not exist. Which is why it is >= and not >.
        - label: The early return
          text: It leaves the function without writing anything. The menu asks again and the bank stays sane.
        - label: b[count]
          text: The array element is the struct, so writing one of its fields writes into the bank.
        - label: Risk
          text: Without this if, the fourth sample writes past the array in front of the room.
          accent: true

  - code_output:
      eyebrow: Block 02 · Measured
      title: The division by zero that never happens
      filename: Program.cs
      lang: csharp
      output_label: Both runs
      source: |
        static void ShowStats(Sample[] b, int count)
        {
            if (count == 0)
            {
                Console.WriteLine("no samples, no stats");
                return;
            }
            double sum = 0;
            for (int i = 0; i < count; i++) sum += b[i].Celsius;
            double mean = sum / count;
            Console.WriteLine($"n = {count}   mean = {mean:F2} C");
        }
      output: |
        option: no samples, no stats
        option: n = 3   mean = 21.00 C

  - compare:
      eyebrow: Block 02 · One line
      title: The loop body, with and without the guard
      before:
        label: Without the guard
        file: without.cs
        lang: csharp
        code: |
          bank[count].SensorId = i + 1;
          count++;
      after:
        label: With the guard
        file: with.cs
        lang: csharp
        code: |
          if (count >= bank.Length)
          {
              Console.WriteLine("bank full, rejected");
              continue;
          }
          bank[count].SensorId = i + 1;
          count++;
      note: >-
        The same four samples over the same Sample[3]. Without the if, the fourth write
        throws IndexOutOfRangeException. With the if, it prints «bank full, rejected»,
        reaches «done» and exits 0.

  - trace:
      eyebrow: Block 02 · Measured
      title: Four samples into a bank of three, both versions
      headers: [Sample, Without the guard, With the guard]
      rows:
        - ["1", "stored in slot 0", "stored in slot 0"]
        - ["2 and 3", "stored in slots 1, 2", "stored in slots 1, 2"]
        - ["4", "IndexOutOfRangeException", "bank full, rejected"]
        - ["end", "no output", "done"]
        - ["code", "-532462766 in PowerShell 7", "0"]
      verdict: >-
        The exit number belongs to the shell, not to the universe. In PowerShell 7 and in
        cmd it is −532462766; the same binary under Git Bash reports 127.

  - quiz:
      eyebrow: Quick check
      question: The operator types a letter at the prompt. What does this version do?
      filename: Program.cs
      lang: csharp
      source: |
        static int ReadOption()
        {
            string line = Console.ReadLine();
            return Convert.ToInt32(line);
        }
      options:
        - 'It returns −1 and the menu keeps asking.'
        - 'It throws FormatException and that is the end of the demo.'
        - 'It returns 0 and the program closes tidily.'
        - 'It returns the character code of what was typed.'

  - trace:
      eyebrow: Answer
      title: One bad reading, three different behaviours
      headers: [Input, Convert.ToInt32, int.TryParse]
      rows:
        - ["abc", "FormatException", "False, v=0"]
        - ["3.7", "FormatException", "False, v=0"]
        - ["empty string", "FormatException", "False, v=0"]
        - ["null", "0, silently", "False, v=0"]
      verdict: >-
        The dangerous one is not the one that throws. Convert.ToInt32 on null returns 0
        without a word, and that 0 enters your bank as a reading nobody took.

  - divider:
      eyebrow: Block 03
      title: The work session
      lede: >-
        Today you pick the topic, stand up the skeleton, and hold a design review with a
        classmate. The demo is the same work, out loud.
      block: 3

  - table:
      eyebrow: Block 03 · Topics
      title: Seven ideas of the same size
      headers: [Idea, The engineering question, Chosen for]
      rows:
        - ["Energy", "kWh per circuit, worst hour", "Industrial, Mechanical"]
        - ["Line", "Parts, batch, scrap, end of shift", "Industrial"]
        - ["Sensors", "Register, calibrate, out of band", "Mechanical, Mechatronics"]
        - ["Bench", "Runs, load, cycles, peaks", "Mechanical"]
        - ["Frames", "16.666666666666668 ms, drops", "Animation and Games"]
        - ["Control", "Settling, overshoot, error", "Mechatronics, Innovation"]
        - ["Packets", "Latency, median, loss", "Data, Cybersecurity, IT"]

  - method:
      eyebrow: Block 03 · RAA08
      title: The design review, in pairs and in writing
      statement: >-
        Each of you presents your problem and the alternative you rejected. Your pair hands
        back two things in writing, and neither of them is a grade.
      points:
        - label: What the pair returns
          text: >-
            One risk the author had not named, and one checklist line the design does not
            yet satisfy. Nothing more, and both of them written down.
        - label: How it is graded
          text: >-
            Present or absent. Never scored, so that nobody's grade depends on a classmate's
            opinion.
        - label: You have rehearsed it
          text: >-
            It is the same move as the week 2 pair swap, now with a fixed form and with both
            forms appended to the report.

  - table:
      eyebrow: Block 03 · Rehearsal
      title: Five known ways to blow up the demo
      headers: [Risk, What it prints, Week]
      rows:
        - ["CS8524", "SwitchExpressionException", "w15"]
        - ["Convert", "FormatException, or a quiet 0", "w5"]
        - ["No guard", "IndexOutOfRangeException", "w16"]
        - ["Fixed index", "rpm[3] builds, then blows up", "w13"]
        - ["int accumulator", "-2147483648 with no warning", "w9"]

  - lab:
      eyebrow: Lab
      title: Build in checklist order
      brief: >-
        Pick the topic, rename Sample to the noun of your problem, and give the value field
        a unit. Then build one feature per sitting, in checklist order, and run the whole
        program every time you finish one.
      blocks:
        - label: Submission
          text: Full source and a PDF report through Blackboard. Email submissions are not accepted.
        - label: The 15-minute rule
          text: If you have been stuck on the same thing for fifteen minutes, write the question and ask.
        - label: The test
          text: Type letters where numbers go. The program should shrug, not die.

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: Arrive with something that builds
          desc: The reference skeleton runs with zero warnings and not one feature inside it
        - title: A guard beats an apology
          desc: One if ahead of the write is the gap between a message and an exception in public
        - title: The report carries a third
          desc: The problem identified and the alternative rejected are half of what is graded there

  - homework:
      eyebrow: Homework
      title: Work-session log
      brief: >-
        Keep a project log with one feature per sitting, dated, naming the blocker that cost
        the most and what unblocked it. It is handed in with the project, as part of the
        evidence in the report.
      meta:
        - [Due, With the project in week 16]
        - [Format, Blackboard · code and PDF]
        - [Weight, Part of the 20 % homework]
      rubric:
        - ["One per sitting", "40 %", "Every line carries a date and a single feature"]
        - ["The blocker", "40 %", "The problem is named, and so is what unblocked it"]
        - ["The forms", "20 %", "Both design-review forms are appended"]

  - closing:
      title: Questions
      subtitle: >-
        Next session is the review and the final exam. Bring in writing the three questions
        you want settled before it.
      meta:
        - [Email, descobarc@up.edu.mx]
        - [Chat, Institutional Google Chat]
        - [Repository, github.com/davidowa/learning-hub]
