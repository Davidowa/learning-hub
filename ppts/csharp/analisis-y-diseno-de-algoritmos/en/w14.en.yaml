  - trace:
      eyebrow: Block 03 · Measured
      title: What happens to each one when the array doubles
      headers: [n, Sequential, Binary]
      rows:
        - ["500", "500", "9"]
        - ["1000", "1000", "10"]
        - ["2000", "2000", "11"]
        - ["4000", "4000", "12"]
        - ["8000", "8000", "13"]
      verdict: >-
        Every doubling doubles the sequential cost and adds one comparison to the binary.
        Read the columns downwards. One gains a digit, the other a unit.

  - quiz:
      eyebrow: Quick check
      question: The array is not sorted and 7 is in it. What does binary search return?
      filename: Search.cs
      lang: csharp
      source: |
        int[] data = { 5, 1, 9, 3, 7 };

        Console.WriteLine(
            Array.BinarySearch(data, 7));
      options:
        - 'It returns 4, which is where 7 actually lives.'
        - 'It returns -3, a negative that also points at the wrong place.'
        - 'It throws an exception for being handed an unsorted array.'
        - 'It returns -1, the not-found sentinel everybody writes.'

  - trace:
      eyebrow: Answer
      title: On unsorted input binary search does not fail — it lies
      headers: [Value, Real index, BinarySearch]
      rows:
        - ["5", "0", "0"]
        - ["1", "1", "-1"]
        - ["9", "2", "2"]
        - ["7", "4", "-3"]
      verdict: >-
        All five values are in the array, and the 3 behaves like the 1. Only two come back
        right, and by luck. The 7 comes back as -3, which decodes to insertion point 2,
        wrong twice over. No exception was thrown for any of the five.

  - code_output:
      eyebrow: Block 03 · Measured
      title: The bitwise complement, and the clash with your own -1
      filename: Complement.cs
      lang: csharp
      output_label: On running
      source: |
        int[] log = new int[1000];
        for (int i = 0; i < 1000; i++) log[i] = 2 * i;

        Console.WriteLine(Array.BinarySearch(log, 1999));
        Console.WriteLine(Array.BinarySearch(log, 2000));
        Console.WriteLine(Array.BinarySearch(log, -1));
        Console.WriteLine(~(-1001));
        Console.WriteLine(~(-1));
      output: |
        -1001
        -1001
        -1
        1000
        0

  - code_output:
      eyebrow: Block 03 · Networking case
      title: The negative return is the packet-loss detection
      filename: Latency.cs
      lang: csharp
      output_label: On running
      source: |
        double[] lat = { 12.4, 11.9, 48.2, 12.1 };
        double sum = 0;
        foreach (double v in lat) sum += v;
        Array.Sort(lat);

        Console.WriteLine(sum / lat.Length);
        Console.WriteLine((lat[1] + lat[2]) / 2);

        int[] seqs = { 40, 41, 42, 44, 45 };
        Console.WriteLine(Array.BinarySearch(seqs, 43));
        Console.WriteLine(~Array.BinarySearch(seqs, 43));
      output: |
        21.15
        12.25
        -4
        3

  - table:
      eyebrow: Block 03 · Measured
