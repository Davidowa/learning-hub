  - divider:
      eyebrow: Block 01
      title: The grid
      lede: One row per part position, one column per measurement point. A single name and two indices.
      block: 1

  - code:
      eyebrow: Block 01 · The two forms
      title: The inspection fixture map
      filename: Grid.cs
      lang: csharp
      source: |
        int[,] grid = new int[3, 4];
        int[][] jagged = new int[3][];

        grid[0, 0] = -12;
        grid[2, 3] = 47;

        jagged[0] = new int[2];
        jagged[1] = new int[5];
        jagged[2] = new int[1];

        int cells = 0;
        foreach (int[] row in jagged)
        {
            cells += row.Length;
        }
      annotations:
        - label: Two indices
          text: The first picks the row and the second the column. The comma goes inside the same brackets.
        - label: Jagged
          text: Every row is its own array and can be a different length. All three start out as null.
        - label: The cells
          text: The rectangle has 12 cells. The jagged one has 8, and that number is yours to count row by row.
        - label: Risk
          text: jagged[0][0] before the row is assigned throws NullReferenceException, not IndexOutOfRangeException.
          accent: true

