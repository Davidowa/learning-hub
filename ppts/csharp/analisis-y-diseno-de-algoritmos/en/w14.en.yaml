  - trace:
      eyebrow: Block 02 · Measured
      title: Every count moves when the implementation moves
      headers: [Algorithm, Variant, Comparisons, Movements]
      rows:
        - ["bubble", "no flag", "21", "10"]
        - ["bubble", "with flag", "20", "10"]
        - ["selection", "guard / no guard", "21", "4 / 6"]
        - ["Shell", "gaps 3, 1", "12", "4"]
        - ["Shell", "gaps 4, 1", "17", "10"]
      verdict: >-
        Shell nearly doubles its comparison count on the choice of gap sequence alone.
        Comparing alternatives has to include the alternatives that live inside one
        algorithm.

  - trace:
      eyebrow: Block 02 · Measured
      title: A single input is not a comparison
      headers: [Algorithm, The run, Already sorted, Reversed]
      rows:
        - ["bubble, no flag", "21", "21", "21"]
        - ["bubble, with flag", "20", "6", "21"]
        - ["selection", "21", "21", "21"]
        - ["insertion", "15", "6", "21"]
        - ["Shell 3-1", "12", "10", "13"]
      verdict: >-
        The one that won with 12 is third the moment the input arrives sorted, and there the
        early-exit flag buys 15 comparisons out of 21. Selection never changes its count,
        because it looks at everything regardless.

  - divider:
      eyebrow: Block 03
      title: Finding one
      lede: Two algorithms that answer the same question, and a difference you only see once the array grows.
      block: 3

  - compare:
      eyebrow: Block 03 · The two searches
      title: Walk it all, or cut the array in half
      before:
        label: Sequential
        file: Sequential.cs
        lang: csharp
        code: |
          int c = 0;
          for (int i = 0; i < a.Length; i++)
          {
            c++;
            if (a[i] == k) return c;
          }
      after:
        label: Binary
        file: Binary.cs
        lang: csharp
        code: |
          int lo = 0, hi = a.Length - 1, c = 0;
          while (lo <= hi)
          {
            c++;
            int mid = lo + (hi - lo) / 2;
            if (a[mid] == k) return c;
            if (a[mid] < k) lo = mid+1; else hi = mid-1;
          }
      note: >-
        Both bodies live inside the same signature, static int Find(int[] a, int k), and both
        return how many comparisons it took to reach the key. A comparison here is one
        a[i] == k test in the sequential one and one visit to a[mid] in the binary one.

  - code_output:
      eyebrow: Block 03 · Measured
      title: A thousand sample ids, and the last one of all
      filename: Find.cs
      lang: csharp
      output_label: On running
      source: |
        int[] ids = new int[1000];
        for (int i = 0; i < 1000; i++) ids[i] = 2 * i;

        Console.WriteLine(Seq(ids, 1998));
        Console.WriteLine(Bin(ids, 1998));
