  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: Two forms, two types
          desc: The rectangular one has Rank 2 and the jagged one Rank 1, and the compiler lets no assignment pass between them
        - title: Shell wins, and not always
          desc: 12 comparisons on the logged run, 10 on an already sorted one where insertion makes 6. The data decides
        - title: Binary search demands order
          desc: Without a sorted array it does not fail, it answers wrong and keeps going. The precondition is part of the algorithm

  - lab:
      eyebrow: Lab
      title: The fixture deviation map
      brief: Load an array of three rows by four columns with the measured deviation of every part position, print the mean of each row and of each column, and report the worst cell by its two indices.
      blocks:
        - label: Deliverable
          text: The .cs and the output, with the means and the index pair of the worst cell
        - label: Constraint
          text: Loop bounds come from GetLength, not from a 3 and a 4 typed by hand
        - label: The test
          text: Add a column to the array. The program has to keep running without a single loop being touched

  - homework:
      eyebrow: Homework
      title: Submission and grading criteria
      brief: Instrument two of the four sorts with comparison and movement counters, choose a gap sequence for Shell and cite where you got it, and report the counts over the three inputs from today.
      meta:
        - [Due, Before week 15]
        - [Format, Blackboard · .cs and .pdf]
        - [Weight, Part of the 20 % for assignments]
      rubric:
        - ["Instrumentation", "40 %", "The counters live inside the algorithm and are not estimated from outside"]
        - ["The citation", "30 %", "The source of the chosen gap sequence for Shell is named"]
        - ["The counts", "30 %", "They are reported over all three inputs and the differences are discussed"]

