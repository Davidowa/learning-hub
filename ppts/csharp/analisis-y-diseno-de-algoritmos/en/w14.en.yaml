  - divider:
      eyebrow: Block 02
      title: Four ways to sort the same seven numbers
      lede: The syllabus names four algorithms. Today all four run on the same logged run, each one carrying its counter.
      block: 2

  - compare:
      eyebrow: Block 02 · The first two
      title: Bubble and selection, with the counter inside
      before:
        label: Bubble
        file: Bubble.cs
        lang: csharp
        code: |
          for (int i = 0; i < n - 1; i++)
            for (int j = 0; j < n - 1 - i; j++)
            {
              cmp++;
              if (a[j] > a[j + 1])
              { Swap(a, j, j + 1); mov++; }
            }
      after:
        label: Selection
        file: Selection.cs
        lang: csharp
        code: |
          for (int i = 0; i < n - 1; i++)
          {
            int min = i;
            for (int j = i + 1; j < n; j++)
            { cmp++; if (a[j] < a[min]) min = j; }
            if (min != i) { Swap(a, i, min); mov++; }
          }
      note: >-
        Both make 21 comparisons on the same run. Bubble swaps 10 times and selection 4,
        because selection swaps once per pass and only when the minimum was not already
        sitting in its place.

  - compare:
      eyebrow: Block 02 · The other two
      title: Shell is insertion with a gap
      before:
        label: Insertion
        file: Insertion.cs
        lang: csharp
        code: |
          int gap = 1;
          for (int i = gap; i < n; i++)
          {
            int key = a[i], j = i;
            while (j >= gap && a[j - gap] > key)
            { a[j] = a[j - gap]; j -= gap; }
            a[j] = key;
          }
      after:
        label: Shell
        file: Shell.cs
        lang: csharp
        code: |
          for (int gap = n / 2; gap > 0; gap /= 2)
          for (int i = gap; i < n; i++)
          {
            int key = a[i], j = i;
            while (j >= gap && a[j - gap] > key)
            { a[j] = a[j - gap]; j -= gap; }
            a[j] = key;
          }
      note: >-
        Insertion is Shell with a single gap of 1. The comparison being counted is every
        evaluation of a[j - gap] > key, and on that count insertion makes 15 and Shell 12
        over the same seven readings.

  - table:
      eyebrow: Block 02 · Measured
      title: All four, on the same seven readings
      headers: [Algorithm, Comparisons, Movements]
      rows:
        - ["Bubble", "21", "10 swaps"]
        - ["Selection", "21", "4 swaps"]
