  - method:
      eyebrow: Bloque 01 · El piso
      title: El piso del 30 % son dos cosas distintas
      statement: >-
        Ningún programa de C# mide una rúbrica. Una parte de esta regla se puede correr, y
        la otra es una cita del programa de la materia.
      points:
        - label: La mitad medible
          text: >-
            Que dotnet build tenga éxito y que dotnet run emita el prompt del menú en
            stdout. Esa revisión corre sobre el esqueleto de referencia y pasa.
        - label: La mitad de política
          text: >-
            «Si el proyecto no se ejecuta, su calificación máxima es 30 %». Es una cita, no
            una medición, y aparece tal cual en el programa.
        - label: Por qué van separadas
          text: >-
            Un programa puede imprimir su menú y aun así salir con −532462766, y otro puede
            salir con 0 sin imprimir menú alguno.

