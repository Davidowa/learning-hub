        - ["w13", "Un arreglo de una dimensión y una operación de cadena"]
        - ["w14", "Un arreglo 2-D, o un orden o búsqueda con su conteo"]
        - ["w15", "Un struct con arreglo de él, y un enum con Ok, Warning y Fault"]
        - ["w16", "dotnet build con cero advertencias"]

  - tiers:
      eyebrow: Bloque 01 · El reporte
      title: Cuatro cosas que el PDF tiene que traer
      items:
        - key: "01"
          title: El problema
          desc: >-
            El problema de ingeniería identificado, en tus palabras. Es la medida directa de
            ABET SO 1 y es la primera página del reporte.
        - key: "02"
          title: La alternativa
          desc: >-
            Al menos una solución que consideraste y descartaste, con la razón por la que la
            descartaste. Sin esto el reporte está incompleto.
          accent: true
        - key: "03"
          title: La evidencia
          desc: >-
            La traza esperada, la corrida y el diff, incluyendo una entrada rota a propósito
            que el programa aguanta sin morirse.
        - key: "04"
          title: Los anexos
          desc: >-
            Los dos formatos de la revisión de diseño, y las limitaciones que tú mismo le
            encuentras al programa.

  - divider:
      eyebrow: Bloque 02
      title: El esqueleto de referencia
      lede: >-
        Un archivo que ya compila y ya corre, sin una sola funcionalidad adentro. Llegar a
        la sesión de trabajo con esto es media tarde ganada.
      block: 2

  - code:
      eyebrow: Bloque 02 · El menú
      title: El lazo de la semana 8, con funciones de la 10
      filename: Program.cs
      lang: csharp
      source: |
        while (corriendo)
        {
            Console.Write("opcion: ");
            switch (LeerOpcion())
            {
                case 1: Registrar(banco, ref cuenta); break;
                case 2: Listar(banco, cuenta); break;
                case 3: Estadisticas(banco, cuenta); break;
                case 0: corriendo = false; break;
                default: Console.WriteLine("opcion no valida"); break;
            }
        }
        Console.WriteLine("fin");
      annotations:
        - label: Arriba del lazo
          text: Sample[] banco = new Sample[3], int cuenta = 0 y bool corriendo = true.
        - label: ref cuenta
          text: Registrar tiene que mover el contador del llamador, así que lo recibe por referencia.
        - label: El brazo default
          text: Cualquier cosa que no sea 0, 1, 2 o 3 cae aquí y el menú sigue vivo.
        - label: La salida probada
          text: corriendo solo cambia en el brazo case 0, y por eso el lazo termina.
          accent: true

  - code_output:
      eyebrow: Bloque 02 · Medido
      title: Compila con cero advertencias y sale con cero
      filename: Program.cs
      lang: csharp
      output_label: Al compilar y correr
      source: |
        static int LeerOpcion()
        {
            string? linea = Console.ReadLine();
            if (linea == null) return 0;
            return int.TryParse(linea, out int v) ? v : -1;
        }
      output: |
        Build succeeded.
            0 Warning(s)
            0 Error(s)

        opcion: fin
        exit=0

  - code:
      eyebrow: Bloque 02 · La guarda
      title: Un if antes de la escritura, y nada más
      filename: Program.cs
      lang: csharp
      source: |
        static void Registrar(Sample[] b, ref int cuenta)
        {
            if (cuenta >= b.Length)
            {
                Console.WriteLine("banco lleno, rechazada");
                return;
            }
            b[cuenta].SensorId = cuenta + 1;
            b[cuenta].Celsius = 20.0 + cuenta;
            b[cuenta].Estado = Status.Ok;
            cuenta++;
            Console.WriteLine($"registrada en el lugar {cuenta - 1}");
        }
      annotations:
        - label: La condición
          text: cuenta llega hasta b.Length y ese ya es un lugar que no existe. Por eso es >= y no >.
        - label: El return temprano
          text: Sale de la función sin escribir nada. El menú vuelve a preguntar y el banco sigue sano.
        - label: b[cuenta]
          text: El elemento del arreglo es el struct, así que escribirle un campo escribe en el banco.
        - label: Riesgo
          text: Sin este if la cuarta muestra escribe fuera del arreglo delante del salón.
          accent: true

  - code_output:
      eyebrow: Bloque 02 · Medido
      title: La división entre cero que nunca ocurre
      filename: Program.cs
      lang: csharp
      output_label: Las dos corridas
      source: |
        static void Estadisticas(Sample[] b, int cuenta)
        {
            if (cuenta == 0)
            {
                Console.WriteLine("sin muestras, sin datos");
                return;
            }
            double suma = 0;
            for (int i = 0; i < cuenta; i++) suma += b[i].Celsius;
            double media = suma / cuenta;
            Console.WriteLine($"n = {cuenta}   media = {media:F2} C");
        }
      output: |
        opcion: sin muestras, sin datos
        opcion: n = 3   media = 21.00 C

  - compare:
      eyebrow: Bloque 02 · Una línea
      title: El cuerpo del lazo, con y sin la guarda
      before:
        label: Sin la guarda
        file: sin.cs
        lang: csharp
        code: |
          banco[cuenta].SensorId = i + 1;
          cuenta++;
      after:
        label: Con la guarda
        file: con.cs
        lang: csharp
        code: |
          if (cuenta >= banco.Length)
          {
              Console.WriteLine("banco lleno, rechazada");
              continue;
          }
          banco[cuenta].SensorId = i + 1;
          cuenta++;
      note: >-
        Las mismas cuatro muestras sobre el mismo Sample[3]. Sin el if, la cuarta escritura
        lanza IndexOutOfRangeException. Con el if, imprime «banco lleno, rechazada», llega a
        «fin» y sale con 0.

  - trace:
      eyebrow: Bloque 02 · Medido
      title: Cuatro muestras en un banco de tres, las dos versiones
      headers: [Muestra, Sin la guarda, Con la guarda]
      rows:
        - ["1", "registrada en el lugar 0", "registrada en el lugar 0"]
        - ["2 y 3", "registradas en 1 y 2", "registradas en 1 y 2"]
        - ["4", "IndexOutOfRangeException", "banco lleno, rechazada"]
        - ["fin", "sin salida", "fin"]
        - ["código", "-532462766 en PowerShell 7", "0"]
      verdict: >-
        El número de salida es del shell, no del universo. En PowerShell 7 y en cmd es
        −532462766; el mismo binario bajo Git Bash reporta 127.

  - quiz:
      eyebrow: Pregunta rápida
      question: El operador teclea una letra en el prompt. ¿Qué hace esta versión?
      filename: Program.cs
      lang: csharp
      source: |
        static int LeerOpcion()
        {
            string linea = Console.ReadLine();
            return Convert.ToInt32(linea);
        }
      options:
        - 'Devuelve −1 y el menú sigue preguntando.'
        - 'Lanza FormatException y ahí se acaba la demostración.'
        - 'Devuelve 0 y el programa se cierra ordenado.'
        - 'Devuelve el código del carácter tecleado.'

  - trace:
      eyebrow: Respuesta
      title: Una lectura mala, tres conductas distintas
      headers: [Entrada, Convert.ToInt32, int.TryParse]
      rows:
        - ["abc", "FormatException", "False, v=0"]
        - ["3.7", "FormatException", "False, v=0"]
        - ["cadena vacía", "FormatException", "False, v=0"]
        - ["null", "0, en silencio", "False, v=0"]
      verdict: >-
        La peligrosa no es la que truena. Convert.ToInt32 sobre null devuelve 0 sin decir
        nada, y ese 0 entra a tu banco como una lectura que nadie tomó.

  - divider:
      eyebrow: Bloque 03
      title: La sesión de trabajo
      lede: >-
        Hoy se elige el tema, se arma el esqueleto y se sostiene una revisión de diseño con
        un compañero. La demostración es el mismo trabajo, en voz alta.
      block: 3

