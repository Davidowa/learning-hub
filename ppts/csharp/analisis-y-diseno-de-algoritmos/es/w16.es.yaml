  - method:
      eyebrow: Bloque 03 · RAA08
      title: La revisión de diseño, en parejas y por escrito
      statement: >-
        Cada quien presenta su problema y la alternativa que descartó. El par devuelve dos
        cosas por escrito, y ninguna de las dos es una calificación.
      points:
        - label: Lo que devuelve el par
          text: >-
            Un riesgo que el autor no había nombrado, y un renglón de la lista que su diseño
            todavía no cumple. Nada más, y las dos cosas escritas.
        - label: Cómo se califica
          text: >-
            Presente o ausente. Nunca con puntaje, para que la calificación de nadie dependa
            de la opinión de un compañero.
        - label: Ya lo ensayaron
          text: >-
            Es el mismo movimiento del intercambio por parejas de la semana 2, ahora con
            formato fijo y con los dos formatos anexos al reporte.

  - table:
      eyebrow: Bloque 03 · Ensayo
      title: Cinco maneras conocidas de reventar la demostración
      headers: [Riesgo, Lo que imprime, Semana]
      rows:
        - ["CS8524", "SwitchExpressionException", "w15"]
        - ["Convert", "FormatException, o 0 callado", "w5"]
        - ["Sin guarda", "IndexOutOfRangeException", "w16"]
        - ["Índice fijo", "rpm[3] compila y luego revienta", "w13"]
        - ["Acumulador int", "-2147483648 sin aviso", "w9"]

  - lab:
      eyebrow: Laboratorio
      title: Construir en el orden de la lista
      brief: >-
        Elige el tema, renombra Sample al sustantivo de tu problema y ponle unidad al campo
        de valor. Después construye una funcionalidad por sesión, en el orden de la lista, y
        corre el programa completo cada vez que termines una.
      blocks:
        - label: Entrega
          text: Código fuente completo y reporte en PDF por Blackboard. Por correo no se recibe.
        - label: La regla de los 15
          text: Si llevas quince minutos atorado en lo mismo, escribe la pregunta y pídela.
        - label: La prueba
          text: Teclea letras donde van números. El programa debe encogerse de hombros, no morirse.

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: Llega con algo que ya compila
          desc: El esqueleto de referencia corre con cero advertencias y sin una sola funcionalidad adentro
        - title: Una guarda vale más que una disculpa
          desc: Un if antes de la escritura es la diferencia entre un mensaje y una excepción en público
        - title: El reporte carga un tercio
          desc: El problema identificado y la alternativa descartada son la mitad de lo que se califica ahí

  - homework:
      eyebrow: Tarea
      title: Bitácora de la sesión de trabajo
      brief: >-
        Lleva una bitácora del proyecto con una funcionalidad por sesión, fechada, con el
        atorón que más costó y qué lo destrabó. Se entrega junto con el proyecto, como parte
        de las evidencias del reporte.
      meta:
        - [Entrega, Con el proyecto en la semana 16]
        - [Formato, Blackboard · código y PDF]
        - [Peso, Parte del 20 % de tareas]
      rubric:
        - ["Una por sesión", "40 %", "Cada renglón trae fecha y una sola funcionalidad"]
        - ["El atorón", "40 %", "Se nombra el problema y qué lo destrabó"]
        - ["Los formatos", "20 %", "Los dos de la revisión de diseño van anexos"]

  - closing:
      title: Preguntas
      subtitle: >-
        La siguiente sesión es el repaso y el examen final. Trae por escrito las tres dudas
        que quieras resolver antes.
      meta:
        - [Correo, descobarc@up.edu.mx]
        - [Mensajería, Google Chat institucional]
        - [Repositorio, github.com/davidowa/learning-hub]
