        - ["w4", "Una expresión donde el paréntesis cambia el resultado"]
        - ["w5", "Lectura y salida formateada, con la cultura fijada"]
        - ["w6–w7", "if / else if / else, o un switch con brazo _ o default"]
        - ["w8", "while o do-while con salida probada, y un break justificado"]
        - ["w9", "for o foreach con un acumulador"]
        - ["w10", "Cuatro funciones, una que devuelve y una que recibe arreglo"]

