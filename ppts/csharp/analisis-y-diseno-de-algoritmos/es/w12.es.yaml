  - trace:
      eyebrow: Bloque 02 · Dos reglas apiladas
      title: Math.Round con dígitos, y el decimal que nunca se guardó
      headers: [Llamada, Imprime, Lo que quedó guardado]
      rows:
        - ["Math.Round(21.35, 1)", "21.4", "21.350000000000001"]
        - ["Math.Round(21.45, 1)", "21.4", "21.449999999999999"]
        - ["Math.Round(24.985, 2)", "24.98", "24.984999999999999"]
        - ["Math.Round(24.975, 2)", "24.98", "24.975000000000001"]
      verdict: >-
        Predice los cuatro con la regla mitad al par y aciertas, pero ninguno de los cuatro
        decimales que tecleaste se guardó como punto medio. Debajo está el 0.1 + 0.2 de la
        semana 4.

  - divider:
      eyebrow: Bloque 03
      title: Random y Convert
      lede: >-
        Dos bibliotecas más, con firmas y modos de falla como cualquier otra. Una de las dos
        decide si tu programa se puede volver a probar.
      block: 3

  - code_output:
      eyebrow: Bloque 03 · Sin semilla
      title: Cien generadores nuevos dan cien números distintos
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        int[] primeras = new int[100];
        for (int k = 0; k < 100; k++)
            primeras[k] = new Random().Next(1, 1000000);

        Console.WriteLine(primeras.Distinct().Count() + " de 100");

        Random a1 = new Random();
        Random a2 = new Random();
        Console.WriteLine($"a1 = {a1.Next(1, 7)} {a1.Next(1, 7)}");
        Console.WriteLine($"a2 = {a2.Next(1, 7)} {a2.Next(1, 7)}");
      output: |
        100 de 100
        a1 = 3 5
        a2 = 5 3

  - code_output:
      eyebrow: Bloque 03 · Con semilla
      title: La misma corrida simulada, las veces que quieras
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        for (int k = 0; k < 3; k++)
        {
            Random r = new Random(2026);
            int[] sim = new int[5];

            for (int i = 0; i < 5; i++)
                sim[i] = r.Next(1400, 1601);

            Console.WriteLine(string.Join(", ", sim));
        }
      output: |
        1432, 1456, 1584, 1599, 1584
        1432, 1456, 1584, 1599, 1584
        1432, 1456, 1584, 1599, 1584

  - compare:
      eyebrow: Bloque 03 · No es cuestión de estilo
      title: Dónde se construye el generador decide qué sale
      before:
        label: Dentro del lazo
        file: mal.cs
        lang: csharp
        code: |
          string mal = "";
          for (int k = 0; k < 8; k++)
              mal += new Random(42).Next(1, 7) + " ";

          Console.WriteLine(mal.Trim());
      after:
        label: Una sola vez, afuera
        file: bien.cs
        lang: csharp
        code: |
          Random r = new Random(42);
          string bien = "";
          for (int k = 0; k < 8; k++)
              bien += r.Next(1, 7) + " ";

          Console.WriteLine(bien.Trim());
      note: >-
        El de la izquierda imprime 5 5 5 5 5 5 5 5 y el de la derecha 5 1 1 4 2 2 5 4. Una
        semilla es el punto de partida de una secuencia, así que resembrar en cada pasada
        vuelve a leer su primer número ocho veces.

  - code_output:
      eyebrow: Bloque 03 · La convención semiabierta
      title: Cien mil tiros de Next(1, 7) y nunca sale un 7
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        Random s = new Random(1);
        int lo = int.MaxValue, hi = int.MinValue;

        for (int k = 0; k < 100000; k++)
        {
            int v = s.Next(1, 7);
            if (v < lo) lo = v;
            if (v > hi) hi = v;
        }
        Console.WriteLine($"{lo}, {hi}");

        try { new Random(1).Next(7, 1); }
        catch (Exception e) { Console.WriteLine(e.GetType().Name); }
      output: |
        1, 6
        ArgumentOutOfRangeException

  - code_output:
      eyebrow: Bloque 03 · Convert
      title: La conversión de base ya estaba escrita, y también su falla
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        string? nada = null;
        Console.WriteLine(Convert.ToInt32(nada));
        Console.WriteLine(Convert.ToString(255, 2));
        Console.WriteLine(Convert.ToInt32("FF", 16));
        Console.WriteLine(Convert.ToChar(65));

        try { Convert.ToInt32("3.7"); }
        catch (Exception e) { Console.WriteLine(e.Message); }

        try { Convert.ToInt32("2147483648"); }
        catch (Exception e) { Console.WriteLine(e.Message); }
      output: |
        0
        11111111
        255
        A
        The input string '3.7' was not
        in a correct format.
        Value was either too large or
        too small for an Int32.

  - quiz:
      eyebrow: Verificación rápida
      question: ¿Qué imprime la última línea?
      filename: Program.cs
      lang: csharp
      source: |
        double lectura = 39.5;
        double limite = 30.0;

        Math.Clamp(lectura, 0.0, limite);

        Console.WriteLine(lectura);
      options:
        - "30, porque Clamp recortó la lectura al límite"
        - "39.5, porque Clamp devuelve y no modifica nada"
        - "Un error, porque falta el using de Math"
        - "0, porque Clamp arranca desde el límite bajo"

  - lab:
      eyebrow: Laboratorio
      title: Probar los acumuladores sin banco de pruebas
      brief: >-
        Genera veinte muestras de rpm simuladas con una semilla que tú elijas y pásalas por
        los acumuladores de la semana 9. Reporta suma, promedio y cuántas caen fuera de la
        banda 1480 a 1520.
      blocks:
        - label: Entrega
          text: El archivo .cs y la corrida, con la semilla escrita arriba del resultado
        - label: Restricción
          text: El generador se construye una sola vez y fuera del ciclo
        - label: La prueba
          text: Corre el programa dos veces. Si los veinte números cambian, no sembraste.

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: Búscala antes de escribirla
          desc: Math.Clamp era el ClampToLimit de la semana pasada, ya escrito y ya probado
        - title: La firma es el contrato
          desc: Math.Pow devuelve double aunque imprima 1024, y por eso CS0266 detiene la compilación
        - title: La semilla va en el reporte
          desc: Un programa con azar solo se puede volver a probar si el generador se siembra

  - homework:
      eyebrow: Tarea
      title: Entrega y criterios de evaluación
      brief: >-
        Sustituye tres ayudantes escritos a mano por llamadas de Math, y de una de ellas
        lee la firma oficial y reporta en tres renglones qué promete sobre tipo de retorno,
        dominio válido y forma de fallar.
      meta:
        - [Entrega, Antes de la semana 13]
        - [Formato, Blackboard · .cs y .pdf]
        - [Lectura, Deitel & Deitel · biblioteca estándar]
      rubric:
        - ["Sustitución", "40 %", "Las tres llamadas producen el mismo resultado que tu código"]
        - ["Firma leída", "40 %", "Tipo de retorno, dominio y falla, con la fuente citada"]
        - ["Evidencia", "20 %", "La salida real pegada, no descrita con palabras"]

