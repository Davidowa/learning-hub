  - divider:
      eyebrow: Bloque 01
      title: Math, y las cuatro veces que sorprende
      lede: >-
        La biblioteca estándar ya trae escrito lo que ibas a escribir. También trae escrito
        cómo falla, y eso es lo que casi nadie lee.
      block: 1

  - code:
      eyebrow: Bloque 01 · En el banco
      title: El valor RMS de una ventana de vibración
      filename: Program.cs
      lang: csharp
      source: |
        double[] v = { 0.42, -0.31, 0.55, -0.48, 0.12, -0.27, 0.61 };

        double ss = 0;
        foreach (double x in v)
        {
            ss += x * x;
        }

        double rms = Math.Sqrt(ss / v.Length);

        Console.WriteLine($"RMS crudo = {rms}");
        Console.WriteLine($"RMS :F4   = {rms:F4} mm/s");
      annotations:
        - label: Lo que escribes
          text: La suma de cuadrados y la división. Ese pedazo sí es tuyo.
        - label: Lo que no escribes
          text: La raíz cuadrada. Math.Sqrt lleva décadas escrita y probada por más gente de la que vas a conocer.
        - label: El formato
          text: El especificador F4 recorta la lectura a cuatro decimales. No cambia el valor guardado.
        - label: Riesgo
          text: Math.Sqrt devuelve un double con todos sus dígitos. Si lo imprimes crudo verás diecisiete.
          accent: true

  - code_output:
      eyebrow: Bloque 01 · Medido
      title: Diecisiete dígitos crudos y cuatro en la lámina
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        double rms = Math.Sqrt(ss / v.Length);
        double mag = Math.Sqrt(3 * 3 + 4 * 4 + 0 * 0);

        Console.WriteLine($"RMS crudo = {rms}");
        Console.WriteLine($"RMS :F4   = {rms:F4} mm/s");
        Console.WriteLine($"magnitud  = {mag}");
      output: |
        RMS crudo = 0.42507142257003616
        RMS :F4   = 0.4251 mm/s
        magnitud  = 5

  - code_output:
      eyebrow: Bloque 01 · Sorpresa 01
      title: El único valor que no es igual a sí mismo
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        Console.WriteLine(Math.Sqrt(2));
        Console.WriteLine(Math.Sqrt(2).ToString("F3"));

        double nan = Math.Sqrt(-1);
        Console.WriteLine(
            $"{nan} {nan == nan} {nan != nan} {double.IsNaN(nan)}");
      output: |
        1.4142135623730951
        1.414
        NaN False True True

  - code_output:
      eyebrow: Bloque 01 · Sorpresa 02
      title: El seno de pi no da cero, y hay una razón
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        Console.WriteLine(Math.Sin(Math.PI));
        Console.WriteLine(Math.Sin(Math.PI) == 0);
        Console.WriteLine(Math.Abs(Math.Sin(Math.PI)) < 1e-9);
        Console.WriteLine(Math.Cos(Math.PI));
        Console.WriteLine(Math.Sin(Math.PI / 2));
        Console.WriteLine(Math.PI);
      output: |
        1.2246467991473532E-16
        False
        True
        -1
        1
        3.141592653589793

  - trace:
      eyebrow: Bloque 01 · Sorpresa 03
      title: La biblioteca trabaja en radianes, y la conversión no es exacta
      headers: [Expresión, Imprime, Lectura]
      rows:
        - ["Math.Sin(30 * Math.PI / 180)", "0.49999999999999994", "no es 0.5"]
        - ["Math.Sin(double.DegreesToRadians(30))", "0.49999999999999994", "el mismo error"]
        - ["double.RadiansToDegrees(Math.PI)", "180", "exacto"]
        - ["Math.Sqrt(3*3 + 4*4 + 0*0)", "5", "exacto"]
      verdict: >-
        Cuál de los dos casos te toca no se predice mirando la fórmula. Por eso la
        comparación por tolerancia de la semana 7 es la regla y la igualdad exacta es la
        excepción.

  - table:
      eyebrow: Bloque 01 · Sorpresa 04
      title: Cinco formas de quitar los decimales y no coinciden
      headers: [Valor, "(int)", Round, Convert, Floor, Truncate]
      rows:
        - ["2.5", "2", "2", "2", "2", "2"]
        - ["3.5", "3", "4", "4", "3", "3"]
        - ["-2.5", "-2", "-2", "-2", "-3", "-2"]
        - ["3.9", "3", "4", "4", "3", "3"]

  - code_output:
      eyebrow: Bloque 01 · Metrología
      title: Por qué existe el redondeo mitad al par
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        double[] medios = { 0.5, 1.5, 2.5, 3.5, 4.5 };
        foreach (double m in medios)
            Console.Write(Math.Round(m) + " ");
        Console.WriteLine();

        double par = 0, lejos = 0, real = 0;
        for (int k = 0; k < 100; k++)
        {
            double v = k + 0.5;
            real += v;
            par += Math.Round(v, MidpointRounding.ToEven);
            lejos += Math.Round(v, MidpointRounding.AwayFromZero);
        }
        Console.WriteLine($"{real} {par} {lejos}");
      output: |
        0 2 2 4 4
        5000 5000 5050

