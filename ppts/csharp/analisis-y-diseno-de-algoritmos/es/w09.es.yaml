  - code:
      eyebrow: Bloque 03 · El patrón
      title: Las cuatro variables que viven fuera del ciclo
      filename: Program.cs
      lang: csharp
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };

        int suma = 0;
        int fuera = 0;
        int maxIdx = 0, minIdx = 0;

        for (int i = 0; i < rpm.Length; i++)
        {
            suma += rpm[i];
            if (rpm[i] < 1480 || rpm[i] > 1520) fuera++;
            if (rpm[i] > rpm[maxIdx]) maxIdx = i;
            if (rpm[i] < rpm[minIdx]) minIdx = i;
        }
      annotations:
        - label: Fuera del ciclo
          text: Las cuatro se declaran antes del for. Adentro se reinician en cada pasada y nadie te avisa.
        - label: La regla de banda
          text: Va escrita completa porque 1480 cae justo en el límite inferior. Ese carácter decide el conteo.
        - label: Máximo y mínimo
          text: Medidos sobre estas siete lecturas dan max 1533 en el índice 3, min 1471 en el índice 4 y rango 62.
        - label: Riesgo
          text: Arrancar maxIdx en 0 sirve porque el arreglo tiene elementos. En uno vacío hay que preguntar antes.
          accent: true

  - code_output:
      eyebrow: Bloque 03 · Medido
      title: Un cast cambia el valor y un especificador cambia la lectura
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };
        int suma = 0;
        for (int i = 0; i < rpm.Length; i++) suma += rpm[i];
        int entera = suma / rpm.Length;
        double real = (double)suma / rpm.Length;
        Console.WriteLine($"suma        {suma}");
        Console.WriteLine($"media int   {entera}");
        Console.WriteLine($"media real  {real}");
        Console.WriteLine($"media a F3  {real:F3}");
      output: |
        suma        10478
        media int   1496
        media real  1496.857142857143
        media a F3  1496.857

  - code_output:
      eyebrow: Bloque 03 · Medido
      title: El mismo carácter, ahora en un porcentaje
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };
        int inc = 0, exc = 0;
        for (int i = 0; i < rpm.Length; i++)
        {
            if (rpm[i] < 1480 || rpm[i] > 1520) inc++;
            if (rpm[i] <= 1480 || rpm[i] >= 1520) exc++;
        }
        int pctEnt = inc * 100 / 7; double pct = inc * 100.0 / 7;
        Console.WriteLine($"<  y >   fuera {inc} de 7");
        Console.WriteLine($"<= y >=  fuera {exc} de 7");
        Console.WriteLine($"{inc} * 100 / 7   = {pctEnt}");
        Console.WriteLine($"{inc} * 100.0 / 7 = {pct}");
        Console.WriteLine($"a F1          = {pct:F1}");
      output: |
        <  y >   fuera 2 de 7
        <= y >=  fuera 3 de 7
        2 * 100 / 7   = 28
        2 * 100.0 / 7 = 28.571428571428573
        a F1          = 28.6

