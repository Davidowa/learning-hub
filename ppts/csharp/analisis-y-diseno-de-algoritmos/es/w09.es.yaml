  - compare:
      eyebrow: Bloque 01 · Traducción
      title: El mismo recorrido, escrito de las dos maneras
      before:
        label: La semana pasada
        file: Program.cs
        lang: csharp
        code: |
          int i = 0;
          while (i < rpm.Length)
          {
              suma += rpm[i];
              i++;
          }
      after:
        label: Esta semana
        file: Program.cs
        lang: csharp
        code: |
          for (int i = 0; i < rpm.Length; i++)
          {
              suma += rpm[i];
          }
      note: >-
        Inicializa, revisa y cambia caben en el encabezado, separados por punto y coma. El
        cuerpo se queda con el trabajo y con nada más. No hay ciclo nuevo aquí, hay una
        forma de escribir el mismo que evita olvidar el cuarto tiempo.

  - code:
      eyebrow: Bloque 01 · for
      title: El recorrido de la corrida rpm, con el índice a la vista
      filename: Program.cs
      lang: csharp
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };

        int suma = 0;

        for (int i = 0; i < rpm.Length; i++)
        {
            suma += rpm[i];
        }

        Console.WriteLine(suma);
      annotations:
        - label: Los tres tiempos
          text: Declaración, condición y cambio, en ese orden y separados por punto y coma dentro del encabezado.
        - label: El alcance de i
          text: La i nace y muere en el encabezado. Fuera del lazo el compilador no la conoce y lo dice con CS0103.
        - label: El índice sirve
          text: Con i puedes preguntar dónde, no sólo qué. Esa es la razón para no usar foreach en algunos recorridos.
        - label: Riesgo
          text: Escribir i <= rpm.Length en vez de menor estricto pide el elemento 7 de un arreglo que llega al 6.
          accent: true

  - code_output:
      eyebrow: Bloque 01 · Medido
      title: La ranura de cambio es tuya, no tiene que decir i++
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        Console.WriteLine("i = 10; i >= 0; i -= 2");
        for (int i = 10; i >= 0; i -= 2) Console.Write(i + " ");
        Console.WriteLine();

        Console.WriteLine("i = 0; i < 20; i += 5");
        for (int i = 0; i < 20; i += 5) Console.Write(i + " ");
        Console.WriteLine();

        Console.WriteLine("i = 0; i < 3; i++");
        for (int i = 0; i < 3; i++) Console.Write(i + " ");
        Console.WriteLine();
      output: |
        i = 10; i >= 0; i -= 2
        10 8 6 4 2 0
        i = 0; i < 20; i += 5
        0 5 10 15
        i = 0; i < 3; i++
        0 1 2

  - code:
      eyebrow: Bloque 01 · foreach
      title: El ciclo que recorre sin contador y sin cota que equivocar
      filename: Program.cs
      lang: csharp
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };
        int suma = 0, cuenta = 0;
        foreach (int lectura in rpm)
        {
            suma += lectura;
            cuenta++;
        }
        int maxIdx = 0;
        for (int i = 1; i < rpm.Length; i++)
            if (rpm[i] > rpm[maxIdx]) maxIdx = i;
        Console.WriteLine($"foreach: {cuenta} lecturas, suma {suma}");
        Console.WriteLine($"for: max {rpm[maxIdx]}, índice {maxIdx}");
      annotations:
        - label: Sin cota
          text: El foreach no tiene condición que equivocar, así que no puede salirse por el final del arreglo.
        - label: Y sin índice
          text: Tampoco te lo da. En cuanto la pregunta es dónde está el máximo y no cuál es, vuelves al for.
        - label: Por qué importa
          text: 1533 en el índice 3 es lo que le dice al técnico qué muestra ir a revisar en el banco.
        - label: Riesgo
          text: Asignar la variable del foreach no compila. Es una copia y el compilador no te deja editarla.
          accent: true

