      meta:
        - [Entrega, Antes de la semana 10]
        - [Formato, Blackboard · Program.cs y PDF]
        - [Peso, Parte del 20 % de tareas]
      rubric:
        - ["Reescritura", "40 %", "Los que pueden pasar a foreach quedan sin índice"]
        - ["El que no puede", "40 %", "Se identifica y se explica en una línea"]
        - ["Salida", "20 %", "Las cuatro respuestas coinciden con las de la clase"]

