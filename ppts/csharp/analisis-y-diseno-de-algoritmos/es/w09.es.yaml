  - quiz:
      eyebrow: Verificación rápida
      question: La cadencia de muestreo con la escalera así. ¿Qué pasa con la muestra 15?
      filename: Program.cs
      lang: csharp
      source: |
        for (int i = 1; i <= 15; i++)
        {
            if (i % 3 == 0) Console.Write("[REG] ");
            else if (i % 5 == 0) Console.Write("[CAL] ");
            else if (i % 15 == 0)
                Console.Write("[REG+CAL] ");
            else Console.Write($"{i} ");
        }
      options:
        - Se registra y se calibra, porque 15 cumple las tres condiciones
        - Se registra pero nunca se calibra, y compila sin advertencias
        - Se calibra pero no se registra, porque el 5 gana al 3
        - El compilador marca el tercer brazo como inalcanzable

  - code_output:
      eyebrow: Respuesta · Medido
      title: El caso combinado tiene que ir primero, y sólo la corrida lo enseña
      filename: Program.cs
      lang: csharp
      output_label: Las dos escaleras
      source: |
        for (int p = 0; p < 2; p++)
        {
            for (int i = 1; i <= 15; i++)
            {
                if (p == 0 && i % 15 == 0) Console.Write("[REG+CAL] ");
                else if (i % 3 == 0) Console.Write("[REG] ");
                else if (i % 5 == 0) Console.Write("[CAL] ");
                else Console.Write($"{i} ");
                if (i == 8 || i == 13) Console.WriteLine();
            }
            Console.WriteLine(p == 0 ? "\ncombinado al final:" : "");
        }
      output: |
        1 2 [REG] 4 [CAL] [REG] 7 8
        [REG] [CAL] 11 [REG] 13
        14 [REG+CAL]
        combinado al final:
        1 2 [REG] 4 [CAL] [REG] 7 8
        [REG] [CAL] 11 [REG] 13
        14 [REG]

  - code_output:
      eyebrow: Bloque 03 · Caso secundario
      title: El presupuesto de cuadro a 60 Hz, no 16.67
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        double[] ms = { 15.2, 16.9, 14.8, 22.4,
                        15.9, 16.61, 33.1, 15.0 };
        double presu = 1000.0 / 60.0;
        int caidos = 0, peorIdx = -1; double peor = 0;
        for (int i = 0; i < ms.Length; i++)
        {
            if (ms[i] <= presu) continue;
            caidos++;
            if (ms[i] > peor) { peor = ms[i]; peorIdx = i; }
        }
        Console.WriteLine($"presupuesto {presu}");
        Console.WriteLine($"a F2 {presu:F2} ms");
        Console.WriteLine($"fuera {caidos}, peor {peor} en {peorIdx}");
      output: |
        presupuesto 16.666666666666668
        a F2 16.67 ms
        fuera 3, peor 33.1 en 6

  - pitfalls:
      eyebrow: Bloque 03 · Errores comunes
      title: Cuatro trampas de la repetición profunda
      items:
        - label: Error 01
          title: La i fuera del ciclo
          desc: >-
            El contador nace y muere en el encabezado del for. Usarlo después da error
            CS0103 The name 'i' does not exist in the current context, y no hay excepción.
        - label: Error 02
          title: break dentro de un switch
          desc: >-
            Termina el switch y no el lazo. Medido, las cuatro pasadas del for corrieron
            igual. Un continue en esa misma posición sí se va a la siguiente pasada.
        - label: Error 03
          title: Confiar en que el int aguanta
          desc: >-
            El mismo lazo dentro de checked lo obliga a admitirlo con OverflowException
            Arithmetic operation resulted in an overflow. Sin checked no dice nada.
        - label: Error 04
          title: Escribir una List durante el foreach
          desc: >-
            Sobre un arreglo puedes escribir por índice mientras recorres. Sobre una
            List se cae en ejecución con Collection was modified.

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: El for es el while ordenado
          desc: Los tres tiempos en el encabezado, y el cuerpo se queda sólo con el trabajo de la pasada
        - title: foreach recorre, for sabe dónde
          desc: En cuanto la pregunta es dónde y no cuál, el ciclo sin índice deja de servir
        - title: Las pasadas se cuentan, no se estiman
          desc: Cuatro veces la entrada son dieciséis veces el trabajo, y arrancar el interno en i más uno deja 21 pares sobre siete sensores

