  - compare:
      eyebrow: Bloque 02 · La misma regla
      title: Lo que el compilador protege no es el arreglo
      before:
        label: double[]
        file: crudo.cs
        code: |
          double[] raw = { 21.0, 39.5 };

          foreach (double c in raw)
          {
              if (c > 30.0) c = 30.0;
          }
      after:
        label: Channel[]
        file: banco.cs
        code: |
          foreach (Channel ch in bank)
          {
              if (ch.Celsius > 30.0)
                  ch.Celsius = 30.0;
          }

          class Channel
          { public double Celsius; }
      note: >-
        La izquierda no compila: error CS1656, Cannot assign to 'c' because it is a
        'foreach iteration variable'. La derecha compila y recorta 39.5, porque la copia es
        copia de una referencia; al banco le queda 21, 30. Lo prohibido es editar una copia
        que no va a ningún lado, no tocar el arreglo.

  - divider:
      eyebrow: Bloque 03
      title: La palabra out, y la regla de entrada
      lede: >-
        ref dice que el llamador ya llenó la variable. out dice que el método está obligado
        a llenarla. Quién inicializa es toda la diferencia.
      block: 3

  - code_output:
      eyebrow: Medido
      title: El compilador persigue el camino que se olvidó de llenarla
      filename: Program.cs
      lang: csharp
      output_label: Al compilar
      source: |
        double[] empty = new double[0];
        Console.WriteLine(TryMean(empty, out double m));

        static bool TryMean(double[] v, out double mean)
        {
            if (v.Length == 0) return false;
            mean = 0;
            foreach (double x in v) mean += x;
            mean /= v.Length;
            return true;
        }
      output: |
        error CS0177: The out parameter
        'mean' must be assigned to
        before control leaves the
        current method

        Build FAILED.

  - table:
      eyebrow: Bloque 03 · El contrato
      title: Quién inicializa, y qué se lleva el llamador
      headers: [Forma, Quién inicializa, Qué se lleva el llamador]
      rows:
        - ["por valor", "El llamador", "Nada, el método vio una copia"]
        - ["ref", "El llamador", "Lo que el método haya escrito"]
        - ["out", "El método", "Un valor, siempre y sin falta"]
        - ["int[]", "El llamador", "Los elementos, no el reemplazo"]

  - code_output:
      eyebrow: Medido
      title: Un solo descuido, y el compilador contesta cuatro veces
      filename: Program.cs
      lang: csharp
      output_label: Al compilar
      source: |
        double lo, hi;
        double[] probes = { 21.0, 39.5, 22.4 };
        MinMax(probes, lo, hi);

        static void MinMax(double[] v, out double lo, out double hi)
        {
            lo = v[0];
            hi = v[0];
            foreach (double x in v)
            {
                if (x < lo) lo = x;
                if (x > hi) hi = x;
            }
        }
      output: |
        error CS1620: Argument 2 must
        be passed with the 'out' keyword
        error CS1620: Argument 3 must
        be passed with the 'out' keyword
        error CS0165: Use of unassigned
        local variable 'lo'
        error CS0165: Use of unassigned
        local variable 'hi'
        Build FAILED.

  - quiz:
      eyebrow: Verificación rápida
      question: >-
        keep vale 999 y la conversión va a fallar. ¿Qué queda dentro de keep?
      filename: Program.cs
      lang: csharp
      source: |
        int keep = 999;
        bool ok = int.TryParse("abc", out keep);
        Console.WriteLine(ok + ", keep=" + keep);
      options:
        - 'False y keep=999, porque la conversión ni la tocó'
        - 'False y keep=0, porque TryParse la sobrescribe'
        - 'True y keep=0, porque abc se interpreta como cero'
        - 'Lanza FormatException al no poder convertirla'

  - code_output:
      eyebrow: Medido
      title: TryParse no deja la variable en paz cuando falla
      filename: Program.cs
      lang: csharp
      output_label: Salida
      source: |
        int keep = 999;
        bool ok = int.TryParse("abc", out keep);
        Console.WriteLine(ok + ", keep=" + keep);
      output: |
        False, keep=0

  - lab:
      eyebrow: Laboratorio
      title: Mínimo y máximo con dos parámetros de salida
      brief: >-
        Escribe MinMax sobre el trío de termopares con dos parámetros out, y delante de él
        un lector que use int.TryParse para no aceptar basura. Agrega después Drain, que
        vacía el tanque de refrigerante por referencia.
      blocks:
        - label: Entrega
          text: >-
            El archivo Program.cs con MinMax, el lector con TryParse y Drain, más la
            corrida con una entrada válida y una inválida
        - label: Restricción
          text: >-
            Drain rechaza cualquier operación que deje el tanque bajo 5 L, y el mensaje de
            rechazo dice por qué, no solo que no se pudo
        - label: La prueba
          text: >-
            Dale de comer algo que no sea número. Si el programa revienta o si acepta un
            cero disfrazado, la guarda todavía no sirve

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: ref va en los dos lados
          desc: En la firma y en la llamada. Nadie termina compartiendo una variable sin haberlo escrito
        - title: Quién inicializa lo decide todo
          desc: Con out el obligado es el método; con ref, el llamador. Esa es la diferencia entera
        - title: Un arreglo ya viajaba compartido
          desc: La variable lleva una referencia, así que la copia del parámetro apunta al mismo arreglo

  - homework:
      eyebrow: Tarea
      title: Entrega y criterios de evaluación
      brief: >-
        Entrega MinMax con sus dos parámetros out sobre el trío de termopares, con la
        guarda de TryParse delante, y explica en tres renglones por qué aquí conviene out y
        no un valor de retorno.
      meta:
        - [Entrega, Antes de la semana 12]
        - [Formato, Blackboard · .cs]
        - [Peso, Parte del 20 % de tareas]
      rubric:
        - ["Contrato", "40 %", "Los dos out se llenan siempre"]
        - ["Entrada", "40 %", "TryParse antes de usar el valor"]
        - ["Justificación", "20 %", "Dices por qué out y no retorno"]

