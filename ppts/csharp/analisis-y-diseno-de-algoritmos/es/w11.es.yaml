  - divider:
      eyebrow: Bloque 01
      title: El intercambio que no intercambia
      lede: >-
        Predícelo primero en el pizarrón, sin correrlo. El cuerpo del método está bien
        escrito y aun así no hace lo que dice el nombre.
      block: 1

  - concept:
      eyebrow: Concepto clave
      title: La pared existe a propósito
      lead: >-
        La semana pasada marcamos los métodos con static justo para que no pudieran leer
        nada de afuera. Esa pared no es un descuido del lenguaje ni un obstáculo que haya
        que rodear; es lo que permite probar una pieza sola. Hoy la abrimos en dos puntos,
        cada uno con su palabra, y las dos hay que escribirlas dos veces.
      panel:
        label: Lo que hay detrás
        title: Compartir una variable se declara
        note: >-
          Nadie comparte una variable por accidente. La palabra va en la firma y otra vez
          en la llamada, y si falta cualquiera de las dos el compilador se detiene.
      steps:
        - text: El método recibe una copia
        - text: Con ref recibe la variable misma
        - text: Con out se compromete a llenarla
          loop: ↺ y el compilador revisa las tres

  - code:
      eyebrow: Bloque 01 · Predice
      title: Tres líneas de intercambio, escritas como en el libro
      filename: Program.cs
      lang: csharp
      source: |
        int x = 1, y = 2;
        SwapByValue(x, y);
        Console.WriteLine($"{x}, {y}");

        static void SwapByValue(int a, int b)
        {
            int t = a;
            a = b;
            b = t;
        }
      annotations:
        - label: El cuerpo
          text: >-
            Las tres líneas del intercambio son correctas. Con una variable temporal, tal
            como se enseña, y el orden es el bueno.
        - label: a y b
          text: >-
            Son copias de x y de y, hechas en el momento de la llamada. Se intercambian
            entre ellas y luego se destruyen.
        - label: Predice
          text: >-
            Escribe en tu cuaderno qué imprime la tercera línea antes de que la corramos.
            Después compárala con la medición.
        - label: Riesgo
          text: >-
            Compila, corre, sale con 0 y no reporta nada raro. Este es el tipo de defecto
            que llega hasta la demostración.
          accent: true

  - code_output:
      eyebrow: Medido
      title: Cuatro palabras separan un intercambio del otro
      filename: Program.cs
      lang: csharp
      output_label: Salida
      source: |
        int x = 1, y = 2;
        SwapByValue(x, y);
        Console.WriteLine($"{x}, {y}");
        SwapByRef(ref x, ref y);
        Console.WriteLine($"{x}, {y}");

        static void SwapByValue(int a, int b)
        {
            int t = a; a = b; b = t;
        }
        static void SwapByRef(ref int a, ref int b)
        {
            int t = a; a = b; b = t;
        }
      output: |
        1, 2
        2, 1

  - code_output:
      eyebrow: Medido
      title: El ref del sitio de llamada es lo que elige el método
      filename: Program.cs
      lang: csharp
      output_label: Salida
      source: |
        double reading = 39.5;
        Probe.Clamp(reading);      Console.WriteLine(reading);
        Probe.Clamp(ref reading);  Console.WriteLine(reading);

        class Probe
        {
            public static void Clamp(double r)
            { if (r > 30.0) r = 30.0; }
            public static void Clamp(ref double r)
            { if (r > 30.0) r = 30.0; }
        }
      output: |
        39.5
        30

  - code_output:
      eyebrow: Medido
      title: La palabra va en los dos lados o no va en ninguno
      filename: Program.cs
      lang: csharp
      output_label: Al compilar
      source: |
        double reading = 39.5;
        ClampByRef(reading, 30.0);
        Console.WriteLine(reading);

        static void ClampByRef(ref double r, double limit)
        {
            if (r > limit) r = limit;
        }
      output: |
        error CS1620: Argument 1 must
        be passed with the 'ref' keyword

        Build FAILED.
            0 Warning(s)
            1 Error(s)

  - divider:
      eyebrow: Bloque 02
      title: Leer, modificar y escribir de vuelta
      lede: >-
        Con ref el método trabaja sobre la variable del llamador, no sobre una copia. Y hay
        un caso en el que eso ya pasaba sin que nadie escribiera la palabra.
      block: 2

  - code_output:
      eyebrow: Medido
      title: Un elemento de arreglo sí es un destino legal
      filename: Program.cs
      lang: csharp
      output_label: Salida
      source: |
        double[] readings = { 21.0, 39.5, 22.4 };
        ClampByRef(ref readings[1], 30.0);
        Console.WriteLine(string.Join(", ", readings));

        static void ClampByRef(ref double r, double limit)
        {
            if (r > limit) r = limit;
        }
      output: |
        21, 30, 22.4

  - pitfalls:
      eyebrow: Bloque 02 · Cuatro descuidos
      title: Dónde se rompe el contrato
      items:
        - label: Error 01
          title: Pasarle un literal
          desc: >-
            ref necesita dónde escribir de vuelta. Con un número escrito a mano no lo hay,
            y el compilador contesta error CS1510, A ref or out value must be an assignable
            variable. Una variable sirve, y un elemento de arreglo también.
        - label: Error 02
          title: Poner ref donde no lo pidieron
          desc: >-
            Es la misma regla desde el otro lado, y también se detiene. error CS1615,
            Argument 1 may not be passed with the 'ref' keyword. En las dos direcciones hay
            que estar de acuerdo.
        - label: Error 03
          title: Usar ref para pasar un arreglo
          desc: >-
            Casi nunca hace falta. Escribir un elemento ya le llega al llamador sin la
            palabra, como se midió la semana pasada. ref solo entra si vas a reemplazar el
            arreglo entero.
        - label: Error 04
          title: Marcar todo con ref por si acaso
          desc: >-
            Por omisión, parámetros normales y un valor de retorno. Se usa ref cuando el
            llamador es dueño de la muestra y mutarla en su lugar es de verdad la forma
            correcta, como en la calibración de un canal.

  - code_output:
      eyebrow: Medido
      title: El llenado del tanque de refrigerante, con su guarda
      filename: Program.cs
      lang: csharp
      output_label: Salida
      source: |
        double tank = 40.0;
        Fill(ref tank, 15.0);   Console.WriteLine(tank);
        Fill(ref tank, 10.0);   Console.WriteLine(tank);

        static void Fill(ref double litros, double add)
        {
            bool espacio = litros + add <= 60.0;
            if (!espacio)
            {
                Console.WriteLine("  sin espacio sobre 60 L");
                return;
            }
            litros += add;
        }
      output: |
        55
          sin espacio sobre 60 L
        55

  - code_output:
      eyebrow: Medido
      title: El agujero que ya estaba abierto desde la semana pasada
      filename: Program.cs
      lang: csharp
      output_label: Salida
      source: |
