  - table:
      eyebrow: Bloque 01 · Tipos
      title: Los cinco tipos que vas a usar todo el semestre
      headers: [Tipo, Qué guarda, Ejemplo del banco]
      rows:
        - ["string", "Texto entre comillas dobles", 'estacion = "EST-07"']
        - ["char", "Un solo carácter, comilla simple", "canal = 'A'"]
        - ["int", "Enteros de 32 bits, sin decimales", "muestras = 7"]
        - ["double", "Decimales de doble precisión", "lectura = 1496.857"]
        - ["bool", "true o false, nada intermedio", "enLinea = true"]

  - code:
      eyebrow: Bloque 01 · En contexto
      title: La tarjeta de identidad de un sensor
      filename: Program.cs
      lang: csharp
      source: |
        string estacion = "EST-07";
        char canal = 'A';
        int muestras = 7;
        double lectura = 1496.857142857143;
        bool enLinea = true;

        Console.WriteLine(estacion.GetType());
        Console.WriteLine(canal.GetType());
        Console.WriteLine(lectura.GetType());
      annotations:
        - label: El tipo va primero
          text: En C# el tipo se escribe antes del nombre, y a partir de esa línea la caja solo acepta ese tipo.
        - label: GetType
          text: Devuelve el tipo real del valor. Sirve para verificar lo que el compilador entendió, no para el programa final.
        - label: Comillas
          text: Comilla simple para un carácter, comilla doble para texto. No son intercambiables.
        - label: Riesgo
          text: Escribir 1496 sin punto decimal lo vuelve int, y toda división posterior trunca sin avisar.
          accent: true

