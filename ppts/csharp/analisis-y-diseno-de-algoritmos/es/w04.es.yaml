  - divider:
      eyebrow: Bloque 02
      title: Declarar, asignar, reasignar
      lede: >-
        Tres instrucciones distintas sobre la misma caja, y dos atajos de escritura que
        no son tan inocentes como parecen.
      block: 2

  - concept:
      eyebrow: Concepto clave
      title: La caja, el tipo y el candado
      lead: >-
        Declarar reserva la caja y le fija el tipo. Asignar mete un valor. Reasignar
        cambia el valor y nunca el tipo, porque el tipo se decidió en la declaración y
        ahí se quedó. Cuando un valor no debe moverse en toda la corrida, const pone el
        candado y quien lo vigila es el compilador.
      panel:
        label: Lo que hay que saber
        title: El tipo se decide una vez y no se negocia
        note: >-
          Una caja declarada int no acepta 1500.5 aunque el número quepa. La compilación
          se detiene en vez de tirar los decimales a tus espaldas.
      steps:
        - text: Declaras y el tipo queda fijo
        - text: Asignas un valor compatible
        - text: Reasignas cuantas veces quieras
          loop: ↺ salvo que la caja sea const

  - code_output:
      eyebrow: Bloque 02 · Medido
      title: La sección de viga, con la cota nominal bajo const
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        const double BaseNom = 120.0;
        double altura = 45.0;

        double area = BaseNom * altura;
        Console.WriteLine(area);

        altura = 60.0;
        area = BaseNom * altura;
        Console.WriteLine(area);
        Console.WriteLine(2 * (BaseNom + altura));
      output: |
        5400
        7200
        360

