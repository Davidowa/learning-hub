            0 Error(s)

  - compare:
      eyebrow: Bloque 02 · El canal de A a B
      title: Tres formas de decir lo mismo, una sola legal
      before:
        label: Las dos que no compilan
        file: Program.cs
        lang: csharp
        code: |
          char canal = 'A';

          canal = canal + 1;   // CS0266
          canal += 1;          // CS0266

          // Cannot implicitly convert
          // type 'int' to 'char'
      after:
        label: Las dos que sí
        file: Program.cs
        lang: csharp
        code: |
          char canal = 'A';
          canal++;
          Console.WriteLine(canal);        // B

          Console.WriteLine('A' + 1);           // 66
          Console.WriteLine((char)('A' + 1));   // B
      note: >-
        La suma no devuelve un char. GetType sobre 'A' + 1 imprime System.Int32, así que
        el 66 hay que volver a castear a char. Por eso canal++ es la única de las tres
        que el compilador acepta sin ayuda.

  - divider:
      eyebrow: Bloque 03
      title: Precedencia, atajos y dónde miente la aritmética
