  - code_output:
      eyebrow: Bloque 03 · Medido
      title: El punto medio de la banda, con y sin paréntesis
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        int a = 1480, b = 1520;

        Console.WriteLine(a + b / 2);
        Console.WriteLine((a + b) / 2);
        Console.WriteLine((a + b) / 2.0);
        Console.WriteLine((a + b) / 2 == 1500);
      output: |
        2240
        1500
        1500
        True

  - trace:
      eyebrow: Bloque 03 · Traza
      title: El sufijo contesta con el valor viejo
      headers: [Con i en 5, Qué imprime, Cómo queda]
      rows:
        - ["Console.WriteLine(i++)", "5", "i queda en 6"]
        - ["Console.WriteLine(++i)", "7", "i queda en 7"]
        - ["Console.WriteLine(j--)", "5", "j queda en 4"]
        - ["i++; en su propia línea", "nada", "i sube en uno"]
      verdict: >-
        Los dos suman uno y se diferencian en lo que la expresión entrega. Como paso de
        contador, solos en su renglón, son idénticos, y por eso al encabezado del for le
        da igual cuál escribas.

  - code_output:
      eyebrow: Bloque 03 · Medido
      title: La barra entre dos enteros trunca, y el cast va antes
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        Console.WriteLine(7 / 2);
        Console.WriteLine(7 % 2);
        Console.WriteLine(7.0 / 2);
        Console.WriteLine((double)7 / 2);
        Console.WriteLine((double)(7 / 2));
        Console.WriteLine(-7 / 2);
        Console.WriteLine(Math.Floor(-7 / 2.0));
      output: |
        3
        1
        3.5
        3.5
        3
        -3
        -4

  - code_output:
      eyebrow: Bloque 03 · Medido
      title: Ninguna tolerancia se revisa con un signo de igual
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        Console.WriteLine(0.1 + 0.2);
        Console.WriteLine(0.1 + 0.2 == 0.3);

        const double Nominal = 25.0;
        double medida = 25.4;
        double desv = medida - Nominal;

        Console.WriteLine(desv);
        Console.WriteLine(Math.Abs(desv) <= 0.5);
      output: |
        0.30000000000000004
        False
        0.3999999999999986
        True

  - compare:
      eyebrow: Bloque 03 · Desbordamiento
      title: La misma suma, dos desenlaces
      before:
        label: Escrito como literal
        file: Program.cs
        lang: csharp
        code: |
          Console.WriteLine(int.MaxValue + 1);

          // error CS0220
          // The operation overflows at
          // compile time in checked mode
          // Build FAILED.
      after:
        label: A través de una variable
        file: Program.cs
        lang: csharp
        code: |
          int ciclos = int.MaxValue;
          Console.WriteLine(ciclos);
          Console.WriteLine(ciclos + 1);

          // 2147483647
          // -2147483648
          // 0 Warning(s), 0 Error(s)
      note: >-
        Lo decide si el compilador podía ver el valor o no. El código real guarda el
        conteo en una variable, que es justo el caso que el compilador no puede
        proteger, y la semana 9 lo cobra con el contador de un banco de fatiga.

  - table:
      eyebrow: Bloque 03 · Medido
      title: Cuatro valores, cuatro formas de quitar decimales
      headers: [Valor, "(int)", Math.Round, Convert.ToInt32, Math.Floor]
      rows:
        - ["2.5", "2", "2", "2", "2"]
        - ["3.5", "3", "4", "4", "3"]
        - ["-2.5", "-2", "-2", "-2", "-3"]
        - ["3.9", "3", "4", "4", "3"]

  - code_output:
      eyebrow: Bloque 03 · Medido
      title: Cada punto medio se va al vecino par
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        double a = Math.Round(0.5);
        double b = Math.Round(1.5);
        double c = Math.Round(2.5);
        double d = Math.Round(3.5);
        double e = Math.Round(4.5);

        Console.WriteLine($"{a} {b} {c} {d} {e}");
        Console.WriteLine(Math.Round(2.5,
            MidpointRounding.AwayFromZero));
      output: |
        0 2 2 4 4
        3

  - quiz:
      eyebrow: Verificación rápida
      question: ¿En qué deja a n esta línea?
      filename: Program.cs
      lang: csharp
      source: |
        int n = 0;

        n = n++;

        Console.WriteLine(n);
      options:
        - 'Queda en 1, porque n++ suma uno.'
        - 'Queda en 0, el valor viejo tapa el incremento.'
        - 'No compila, n++ no puede ir a la derecha.'
        - 'Queda en 1 y además advierte al compilar.'

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: El tipo se decide una vez
          desc: Reasignar cambia el valor y nunca el tipo, y const impide incluso el cambio de valor
        - title: El paréntesis cuesta cero
          desc: a + b / 2 sobre la banda 1480–1520 imprime 2240, un número que ningún tacómetro va a leer
        - title: Redondear es una decisión
          desc: Cien lecturas que caen en un medio exacto suman 5000 con mitad al par y 5050 con mitad lejos de cero

