  - code_output:
      eyebrow: Medido
      title: Una condición es un valor que puedes guardar
      filename: Program.cs
      lang: csharp
      output_label: Salida
      source: |
        int rpm = 3200;
        bool sobre = rpm > 3000;

        Console.WriteLine($"sobrevelocidad a {rpm} rpm -> {sobre}");
        Console.WriteLine($"3000 >  3000 -> {3000 > 3000}");
        Console.WriteLine($"3000 >= 3000 -> {3000 >= 3000}");
        Console.WriteLine($"1480 <  1480 -> {1480 < 1480}");
        Console.WriteLine($"1480 <= 1480 -> {1480 <= 1480}");
      output: |
        sobrevelocidad a 3200 rpm -> True
        3000 >  3000 -> False
        3000 >= 3000 -> True
        1480 <  1480 -> False
        1480 <= 1480 -> True

  - stat:
      eyebrow: La regla de banda del curso
      value: 2 de 7
      text: >-
        muestras fuera de banda en la corrida rpm, bajo la regla r < 1480 || r > 1520
      note: >-
        Con la otra convención, r <= 1480 || r >= 1520, son 3 de 7. La primera muestra vale
