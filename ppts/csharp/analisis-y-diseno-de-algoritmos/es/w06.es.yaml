  - divider:
      eyebrow: Bloque 01
      title: La decisión que compila
      lede: >-
        El rombo de la semana 2 salía con dos flechas. Las llaves son la flecha del SÍ, y
        todo lo que quede fuera de ellas corre de las dos maneras.
      block: 1

  - concept:
      eyebrow: Concepto clave
      title: Las llaves son la flecha del SÍ del rombo
      lead: >-
        En el diagrama de flujo el rombo tenía una salida por arriba y otra por abajo. En
        C# la de arriba son las llaves que siguen al if, y la de abajo es todo lo que
        viene después de la llave que cierra. El compilador no lee tu sangría para
        decidirlo. Lee las llaves, y solo las llaves.
      panel:
        label: La prueba del dedo
        title: Lo que queda fuera de las llaves corre siempre
        note: >-
          Es la misma traza de la semana 2, con la misma regla. Pon el dedo en la línea de
          abajo y pregúntate si el rombo puede evitarla. Si la respuesta es no, esa línea
          no pertenece a la decisión.
      steps:
        - text: Se evalúa la condición y contesta verdadero o falso
        - text: Si contestó verdadero, corre el bloque entre llaves
        - text: Si contestó falso, el bloque se salta entero
          loop: ↺ y la línea de abajo corre en los dos casos

  - code:
      eyebrow: Bloque 01 · El if
      title: El enclavamiento de refrigerante del reductor
      filename: Program.cs
      lang: csharp
      source: |
        double refrig = 31.4;

        if (refrig > 28.0)
        {
            Console.WriteLine("alarma: refrigerante caliente");
            Console.WriteLine("válvula de derivación abierta");
        }

        Console.WriteLine($"lectura {refrig} C registrada");
      annotations:
        - label: La condición
          text: >-
            Entre paréntesis va algo que solo vale verdadero o falso. Aquí, el termopar
            contra los 28 grados.
        - label: Las llaves
          text: >-
            Marcan el bloque. Las dos líneas de adentro corren únicamente cuando la
            condición se cumple.
        - label: Fuera del bloque
          text: >-
            Fuera de las llaves, la última línea se registra con alarma y sin ella. Es la
            otra salida del rombo.
        - label: Riesgo
          text: >-
            Sin llaves solo la primera línea es del if. La segunda abre la derivación
            siempre y nadie avisa.
          accent: true

