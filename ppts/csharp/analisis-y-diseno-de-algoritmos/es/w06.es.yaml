  - code_output:
      eyebrow: Bloque 02 · Caso de videojuegos
      title: La caja envolvente son cuatro comparaciones unidas por &&
      filename: Program.cs
      lang: csharp
      output_label: Salida
      source: |
        static bool Solapan(
            double ax, double ay, double aw, double ah,
            double bx, double by, double bw, double bh)
            => ax < bx + bw && ax + aw > bx
            && ay < by + bh && ay + ah > by;

        bool lejos = Solapan(0, 0, 10, 10, 20, 0, 10, 10);
        bool cruce = Solapan(0, 0, 10, 10, 5, 5, 10, 10);
        bool canto = Solapan(0, 0, 10, 10, 10, 0, 10, 10);

        Console.WriteLine($"separadas -> {lejos}");
        Console.WriteLine($"solapadas -> {cruce}");
        Console.WriteLine($"de canto  -> {canto}");
      output: |
        separadas -> False
        solapadas -> True
        de canto  -> False

  - code_output:
      eyebrow: Bloque 02 · Cadenas
      title: Sobre string el doble igual siempre compara el valor
      filename: Program.cs
      lang: csharp
      output_label: Salida
      source: |
        string a = "SENSOR-07";
        string c = "SENSOR-" + "07";
        string d = "SENSOR-" + 07.ToString("00");
        bool caso = "Sensor-07" == a;

        Console.WriteLine($"a == c    {a == c}");
        Console.WriteLine($"ref a c   {ReferenceEquals(a, c)}");
        Console.WriteLine($"a == d    {a == d}");
        Console.WriteLine($"ref a d   {ReferenceEquals(a, d)}");
        Console.WriteLine($"minúsculas {caso}");
      output: |
        a == c    True
        ref a c   True
        a == d    True
        ref a d   False
        minúsculas False

  - divider:
      eyebrow: Bloque 03
      title: La escalera
      lede: >-
        Tres o más categorías excluyentes, revisadas de arriba abajo. Gana la primera que
        se cumple y las de abajo ni se leen.
      block: 3

  - code:
      eyebrow: Bloque 03 · else if
      title: La tabla de bandas del tacómetro, como escalera
      filename: Program.cs
      lang: csharp
      source: |
        static string Banda(int rpm)
        {
            if (rpm < 0) return "inválida";
            else if (rpm < 800) return "en reposo";
            else if (rpm < 3000) return "nominal";
            else return "sobrevelocidad";
        }

        foreach (int r in new[] { -5, 500, 799, 800, 3000 })
            Console.WriteLine($"Banda({r,5}) = {Banda(r)}");
      annotations:
        - label: De arriba abajo
          text: >-
            Se revisa el primer peldaño. Si falla, el segundo. En cuanto uno se cumple, el
            resto ni se evalúa.
        - label: El peldaño imposible
          text: >-
            El primero atrapa la lectura negativa, que ningún tacómetro sano da y que
            delata un cable suelto.
        - label: El else final
          text: >-
            Recoge todo lo que no cayó en ningún peldaño. Sin él quedarían lecturas sin
            clasificar.
        - label: Riesgo
          text: >-
            El orden es parte de la lógica. Sube un peldaño de lugar y la escalera contesta
            otra cosa sin avisar.
          accent: true

  - trace:
      eyebrow: Medido
      title: Lo que contesta la escalera en cinco lecturas
      headers: [Lectura, Peldaño que gana, Lo que devuelve]
      rows:
        - ["-5", "rpm < 0", "inválida"]
        - ["500", "rpm < 800", "en reposo"]
        - ["799", "rpm < 800", "en reposo"]
        - ["800", "rpm < 3000", "nominal"]
        - ["3000", "else", "sobrevelocidad"]
      verdict: >-
        799 sigue en reposo y 800 ya es nominal. El peldaño dice estrictamente menor, así
        que el valor del límite pertenece siempre a la banda de arriba.

  - code_output:
      eyebrow: Medido · el reordenamiento
      title: Sube un peldaño y el tacómetro desconectado pasa por reposo
      filename: Program.cs
      lang: csharp
      output_label: Al compilar y al correr
      source: |
        static string Banda(int rpm)
        {
            if (rpm < 800) return "en reposo";
            else if (rpm < 0) return "inválida";
            else if (rpm < 3000) return "nominal";
            else return "sobrevelocidad";
        }

        Console.WriteLine($"Banda(-5) = {Banda(-5)}");
      output: |
        Build succeeded.
            0 Warning(s)
            0 Error(s)

        Banda(-5) = en reposo

  - pitfalls:
      eyebrow: Errores comunes
      title: Cuatro maneras de perder la decisión
      items:
        - label: Error 01
          title: Un igual en lugar de dos
          desc: >-
            Sobre un int es CS0029 y ni compila. Sobre un bool es la advertencia CS0665,
            compila, y deja la válvula abierta.
        - label: Error 02
          title: Escribir el bloque sin llaves
          desc: >-
            Sin llaves, solo la línea que sigue al if pertenece a la decisión. La siguiente
            corre siempre, aunque la sangría diga otra cosa.
        - label: Error 03
          title: Equivocar el operador del límite
          desc: >-
            Mayor que deja fuera al valor que cae justo sobre la raya. Mayor o igual lo
            mete. Sobre la muestra de 1480 eso cambia el conteo del término.
        - label: Error 04
          title: Ordenar mal la escalera
          desc: >-
            Gana el primer peldaño que se cumple. Si el más amplio quedó arriba, los de
            abajo son código muerto y nada te lo advierte.

  - quiz:
      eyebrow: Verificación rápida
      question: Con la regla exclusiva, ¿cuántas de las siete lecturas quedan fuera de banda?
      filename: Program.cs
      lang: csharp
      source: |
        int[] rpm = { 1480, 1502, 1495,
                      1533, 1471, 1509, 1488 };

        int fuera = 0;
        foreach (int r in rpm)
            if (r <= 1480 || r >= 1520) fuera++;

        Console.WriteLine(fuera);
      options:
        - "2, las mismas que con la regla del curso"
        - "3, porque la muestra de 1480 ahora cae fuera"
        - "0, porque ninguna lectura toca los límites"
        - "7, porque el operador atrapa todo el arreglo"

  - lab:
      eyebrow: Laboratorio
      title: El enclavamiento de refrigerante, de la hoja al código
      brief: >-
        Escribe la escalera que clasifica la temperatura del reductor en cuatro bandas y
        que además decide si abre la derivación. Toma la lectura por teclado y prueba las
        tres bandas más el valor exacto de cada frontera.
      blocks:
        - label: Entrega
          text: El Program.cs y las corridas que caen en cada banda, con su salida pegada
        - label: Restricción
          text: >-
            Las bandas tienen que ser excluyentes. Ninguna lectura puede clasificarse de
            dos maneras.
        - label: La prueba
          text: >-
            Corre el valor exacto de cada frontera. Ahí se descubre si querías mayor que o
            mayor o igual que.

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: Las llaves son la estructura
          desc: >-
            La sangría es para tus ojos. El compilador lee las llaves, y lo que queda fuera
            de ellas corre pase lo que pase
        - title: El límite lo decide el operador
          desc: >-
            La muestra de 1480 está dentro con menor que y fuera con menor o igual que. Por
            eso la regla se escribe completa en cada lámina donde aparece el conteo
        - title: La escalera va de lo estrecho a lo amplio
          desc: >-
            Gana el primer peldaño que se cumple, y ordenarla al revés compila sin una sola
            advertencia

  - homework:
      eyebrow: Tarea
      title: Entrega y criterios de evaluación
      brief: >-
        Dibuja el diagrama de flujo de la escalera del enclavamiento, marca en él dónde cae
        la muestra de 1480, y escribe a mano la rama que predices para cinco lecturas.
        Después corre el programa y compara renglón por renglón.
      meta:
        - [Entrega, Antes de la semana 7]
        - [Formato, Blackboard · PDF del diagrama y Program.cs]
        - [Peso, Parte del 20 % de tareas]
      rubric:
        - ["Diagrama", "40 %", "Los rombos y sus dos salidas están completos y en orden"]
        - ["Predicción", "40 %", "Las cinco ramas predichas coinciden con la corrida"]
        - ["El límite", "20 %", "La muestra de 1480 aparece marcada y justificada"]

