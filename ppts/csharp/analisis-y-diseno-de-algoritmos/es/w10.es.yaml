  - divider:
      eyebrow: Bloque 01
      title: Anatomía de un método
      lede: >-
        Declarar, llamar, y la palabra que todos los tutoriales te hacen escribir sin
        decirte nunca por qué.
      block: 1

  - concept:
      eyebrow: Concepto clave
      title: Un cálculo con nombre propio
      lead: >-
        Un método encierra un cálculo, declara qué necesita recibir y qué devuelve, y desde
        ese momento quien lo llama ya no tiene que abrir el cuerpo para confiar en el
        resultado. Es la misma descomposición de la semana 2, solo que ahora el compilador
        la entiende y te la revisa.
      panel:
        label: El argumento de fondo
        title: Una pieza con nombre se prueba sola
        note: >-
          El mismo cálculo repetido en cinco lugares no se puede probar. Solo se puede
          revisar a mano, lugar por lugar, y nadie lo hace.
      steps:
        - text: Se declara una vez, con su firma
        - text: Se llama tantas veces como haga falta
        - text: Se corrige en un solo lugar
          loop: ↺ y la corrección llega a todas las llamadas

  - code:
      eyebrow: Bloque 01 · Anatomía
      title: La media de tres termopares, empaquetada
      filename: Program.cs
      lang: csharp
      source: |
        double mean = Mean(21.0, 39.5, 22.4);
        Console.WriteLine(mean);

        static double Mean(double a, double b, double c)
        {
            double total = a + b + c;
            return total / 3.0;
        }
      annotations:
        - label: El tipo de retorno
          text: >-
            double va antes del nombre y dice qué entrega el método. Es medio contrato
            para el llamador.
        - label: Los parámetros
          text: >-
            Tres huecos con nombre y tipo. Se llenan en ese mismo orden y el compilador
            revisa los tipos.
        - label: return
          text: >-
            Entrega el valor y termina el método ahí mismo. Lo que venga después del return
            no llega a correr.
        - label: static
          text: >-
            Dice que el método trabaja solo con sus parámetros. Las tres láminas siguientes
            lo miden en lugar de afirmarlo.
          accent: true

  - code_output:
      eyebrow: Medido
      title: Declarar un método no ejecuta nada
      filename: Program.cs
      lang: csharp
      output_label: Al compilar
      source: |
        static void PrintHeader()
        {
            Console.WriteLine("LOTE 07 - TELEMETRIA");
        }
      output: |
        warning CS8321: The local
        function 'PrintHeader' is
        declared but never used

        Build succeeded.
            1 Warning(s)
            0 Error(s)

        dotnet run -> sin salida

  - code_output:
      eyebrow: Medido
      title: Llamarlo sí lo ejecuta, y el orden de declaración no importa
      filename: Program.cs
      lang: csharp
      output_label: Salida
      source: |
        PrintHeader();
        Console.WriteLine(Mean(21.0, 39.5));
        Console.WriteLine(Mean(Mean(21.0, 39.5), 22.4));

        static void PrintHeader()
        {
            Console.WriteLine("LOTE 07 - TELEMETRIA");
        }

        static double Mean(double a, double b)
        {
            return (a + b) / 2;
        }
      output: |
        LOTE 07 - TELEMETRIA
        30.25
        26.325

  - code_output:
      eyebrow: Medido
      title: Quítale static al mismo método y ahora imprime 9
      filename: Program.cs
      lang: csharp
      output_label: Al compilar
      source: |
        int limitCelsius = 30;
        Console.WriteLine(OverLimit(39));

        static int OverLimit(int reading)
        {
            return reading - limitCelsius;
        }
      output: |
        error CS8421: A static local
        function cannot contain a
        reference to 'limitCelsius'.

        Build FAILED.
            0 Warning(s)
            1 Error(s)

  - pitfalls:
      eyebrow: Bloque 01 · Colocación
      title: Cuatro errores al colocar un método
      items:
        - label: Error 01
          title: Escribir public delante
          desc: >-
            Todos los tutoriales muestran public static. Sobre un método de nivel superior
            el compilador contesta error CS0106, The modifier 'public' is not valid for
            this item, y apunta a la columna 1.
        - label: Error 02
          title: Dejar código debajo de una clase
          desc: >-
            error CS8803, Top-level statements must precede namespace and type
            declarations. Toda clase que escribas va al fondo del archivo, después de la
            última línea ejecutable.
        - label: Error 03
          title: Olvidar static dentro de una clase
          desc: >-
            Ahí sí es obligatorio. Sin él es error CS0120, An object reference is required.
            Y llamarlo por su nombre pelón es CS0103, el mismo de la semana 9.
        - label: Error 04
          title: Creerse que static la hace llamable
          desc: >-
            No es eso. Bajo instrucciones de nivel superior las dos formas compilan sin una
            sola advertencia y las dos imprimen 7. Lo que static compra es el aislamiento.

  - divider:
      eyebrow: Bloque 02
      title: Devolver, alcance y sobrecarga
      lede: >-
        Lo que nace dentro del método se queda dentro. Y un mismo nombre puede atender a
        varias firmas, si cada llamada tiene un ganador obvio.
      block: 2

  - compare:
      eyebrow: Bloque 02 · La distinción
      title: Devolver no es imprimir
      before:
        label: void
        file: imprime.cs
        code: |
          static void ShowMean(double a,
                               double b)
          {
              Console.WriteLine((a + b) / 2);
          }

          double m = ShowMean(21.0, 39.5);
      after:
        label: Con retorno
        file: devuelve.cs
        code: |
          static double Mean(double a,
                             double b)
          {
              return (a + b) / 2;
          }

          double m = Mean(21.0, 39.5);
      note: >-
        La de la izquierda muestra el número y no lo entrega, así que la última línea ni
        siquiera compila. El compilador contesta error CS0029, Cannot implicitly convert
        type 'void' to 'double'. Si el método calcula un valor, devuélvelo; si causa un
        efecto, void.

  - code_output:
      eyebrow: Medido
      title: El mismo CS0103 de la semana 9, ahora con otro nombre dentro
      filename: Program.cs
      lang: csharp
      output_label: Al compilar
      source: |
        Console.WriteLine(Mean(21.0, 39.5));
        Console.WriteLine(result);

        static double Mean(double a, double b)
        {
            double result = (a + b) / 2;
            return result;
        }
      output: |
        error CS0103: The name 'result'
        does not exist in the current
        context

        Build FAILED.
            0 Warning(s)
            1 Error(s)

  - compare:
      eyebrow: Bloque 02 · Sobrecarga
      title: Un nombre, dos métodos, la forma que compila
      before:
        label: No compila
        file: local.cs
        code: |
          int Mean(int a, int b)
          {
              return (a + b) / 2;
          }
          double Mean(double a, double b)
          {
              return (a + b) / 2;
          }
      after:
        label: Sí compila
        file: partial.cs
        code: |
          partial class Program
          {
              static int Mean(int a, int b)
                  => (a + b) / 2;
              static double Mean(double a,
                                 double b)
                  => (a + b) / 2;
          }
      note: >-
        La izquierda no son dos métodos, es un nombre usado dos veces: error CS0128, A
        local variable or function named 'Mean' is already defined in this scope. El código
        de nivel superior ya vive en una clase llamada Program; reábrela abajo y hay
        métodos de verdad.

  - code_output:
      eyebrow: Medido
      title: Tres métodos Mean, y el compilador elige por los tipos
      filename: Program.cs
      lang: csharp
      output_label: Salida
      source: |
        Console.WriteLine(Mean(1480, 1502));
        Console.WriteLine(Mean(21.0, 39.5));
        Console.WriteLine(Mean(1480, 1502, 1495));

        partial class Program
        {
            static int Mean(int a, int b) => (a + b) / 2;
            static double Mean(double a, double b) => (a + b) / 2;
            static int Mean(int a, int b, int c) => (a + b + c) / 3;
        }
      output: |
        1491
        30.25
        1492

  - code_output:
      eyebrow: Medido
      title: Un char se ensancha a int antes que a ninguna otra cosa
      filename: Program.cs
      lang: csharp
      output_label: Salida
      source: |
        Console.WriteLine(Which(5));
        Console.WriteLine(Which(5.0));
        Console.WriteLine(Which(5L));
        Console.WriteLine(Which('A'));

        partial class Program
        {
            static string Which(int v) => "sobrecarga int";
            static string Which(double v) => "sobrecarga double";
            static string Which(long v) => "sobrecarga long";
        }
      output: |
        sobrecarga int
        sobrecarga double
        sobrecarga long
        sobrecarga int

