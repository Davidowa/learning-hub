  - divider:
      eyebrow: Bloque 03
      title: Arreglos que entran y salen
      lede: >-
        Un arreglo se pasa por valor como todo lo demás, y aun así el método puede
        cambiarlo. Esa frase no es una contradicción y hoy se mide.
      block: 3

  - code_output:
      eyebrow: Medido
      title: Un parámetro arreglo nunca necesita un conteo al lado
      filename: Program.cs
      lang: csharp
      output_label: Salida
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };
        Console.WriteLine(Sum(rpm));
        Console.WriteLine(Count(rpm));

        static int Sum(int[] v)
        {
            int total = 0;
            foreach (int x in v) total += x;
            return total;
        }

        static int Count(int[] v) => v.Length;
      output: |
        10478
        7

  - code_output:
      eyebrow: Medido
      title: El elemento se queda escrito; el reemplazo no
      filename: Program.cs
      lang: csharp
      output_label: Salida
      source: |
        int[] src = { 1480, 1502, 1495 };
        ZeroFirst(src);
        Console.WriteLine(src[0]);
        Replace(src);
        Console.WriteLine(src[0]);
        ReplaceRef(ref src);
        Console.WriteLine(src[0]);

        static void ZeroFirst(int[] v) { v[0] = 0; }
        static void Replace(int[] v) { v = new int[] { -1, -1, -1 }; }
        static void ReplaceRef(ref int[] v)
        {
            v = new int[] { -1, -1, -1 };
        }
      output: |
        0
        0
        -1

  - code_output:
      eyebrow: Medido
      title: El tipo de retorno no dice si te tocó una copia o el original
      filename: Program.cs
      lang: csharp
      output_label: Salida
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };
        int[] w = Window(rpm, 2, 3);
        w[0] = 0;   Console.WriteLine(rpm[2]);
        int[] s = Same(rpm);
        s[0] = 0;   Console.WriteLine(rpm[0]);

        static int[] Window(int[] v, int start, int count)
        {
            int[] w = new int[count];
            for (int i = 0; i < count; i++) w[i] = v[start + i];
            return w;
        }
        static int[] Same(int[] v) { return v; }
      output: |
        1495
        0

  - code_output:
      eyebrow: Medido
      title: Un método para dos muestras, para siete o para ninguna
      filename: Program.cs
      lang: csharp
      output_label: Salida
      source: |
        Console.WriteLine(Mean(1480, 1502));
        int[] run = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };
        Console.WriteLine(Mean(run));
        Console.WriteLine(Mean());

        static double Mean(params int[] samples)
        {
            if (samples.Length == 0) return double.NaN;
            int total = 0;
            foreach (int s in samples) total += s;
            return (double)total / samples.Length;
        }
      output: |
        1491
        1496.857142857143
        NaN

  - quiz:
      eyebrow: Verificación rápida
      question: >-
        Las dos primeras líneas imprimen 98 y 98.6. ¿Qué imprimen las dos últimas?
      filename: Program.cs
      lang: csharp
      source: |
        Console.WriteLine(C2F(37));
        Console.WriteLine(C2F(37.0));
        Console.WriteLine(C2F(25));
        Console.WriteLine(C2F(25.0));

        partial class Program
        {
            static int C2F(int c) => c * 9 / 5 + 32;
            static double C2F(double c)
                => c * 9.0 / 5.0 + 32.0;
        }
      options:
        - '77 las dos, y por eso probar a 25 grados esconde el defecto'
        - '77 y 77.0, porque la segunda conserva el punto decimal'
        - '77 y 78.6, porque la división real sube el resultado'
        - 'Un error, C2F ya está definido con ese nombre'

  - lab:
      eyebrow: Laboratorio
      title: Parte el Main de sesenta líneas
      brief: >-
        Toma un programa tuyo de la semana 8 o de la semana 9 que ya funcione y pártelo en
        cuatro métodos con nombre. El comportamiento no puede cambiar. Córrelo antes y
        después con las mismas entradas y guarda las dos salidas.
      blocks:
        - label: Entrega
          text: >-
            El archivo Program.cs con los cuatro métodos y las dos corridas pegadas en un
            .txt, la de antes y la de después
        - label: Restricción
          text: >-
            Marca los cuatro con static. Si alguno lee una variable que no recibió como
            parámetro, el compilador te lo dirá con CS8421
        - label: La prueba
          text: >-
            Si las dos salidas no son idénticas línea por línea, el refactor cambió algo y
            todavía no está terminado

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: Declarar no ejecuta nada
          desc: El archivo compila, corre, no imprime y sale con 0, y el compilador te avisa con CS8321
        - title: static es una pared, no un adorno
          desc: Marca el método y el compilador te prohíbe leer lo de afuera. Ese es todo su trabajo
        - title: El arreglo se comparte
          desc: Escribir un elemento le llega al llamador; reemplazar el arreglo entero se queda adentro

  - homework:
      eyebrow: Tarea
      title: Entrega y criterios de evaluación
      brief: >-
        Entrega el refactor del laboratorio con las dos corridas, y agrega un método más
        que reciba el arreglo de siete lecturas rpm y devuelva la lectura máxima junto con
        su índice.
      meta:
        - [Entrega, Antes de la semana 11]
        - [Formato, Blackboard · .cs]
        - [Peso, Parte del 20 % de tareas]
      rubric:
        - ["Comportamiento", "40 %", "Las dos corridas son idénticas"]
        - ["Aislamiento", "40 %", "Los métodos compilan con static"]
        - ["Nombres", "20 %", "Cada nombre dice qué devuelve"]

