        - ["2", "True", "True", "120", "False"]
        - ["3", "True", "True", "20", "True"]
      verdict: >-
        El operador cierra la puerta entre el primero y el segundo, y el eje termina de
        frenar entre el segundo y el tercero. La corrida imprime ARMADO en 3. Con el mismo
        código y la puerta abierta los tres intentos, la última línea sería la del
        enclavamiento.

  - code_output:
      eyebrow: Bloque 02 · Medido
      title: Cuántas iteraciones termina un break, exactamente
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        int cuerpos = 0, pruebas = 0, corte = -1;
        for (int i = 0; i < 10; i++)
        {
            pruebas++;
            if (i == 4) { corte = i; break; }
            cuerpos++;
        }
        Console.WriteLine($"pruebas de condición   {pruebas}");
        Console.WriteLine($"cuerpos completados    {cuerpos}");
        Console.WriteLine($"índice del break       {corte}");
        Console.WriteLine($"nunca empezaron        {10 - pruebas}");
      output: |
        pruebas de condición   5
        cuerpos completados    4
        índice del break       4
        nunca empezaron        5

