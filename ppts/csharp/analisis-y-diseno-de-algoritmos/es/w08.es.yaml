  - code_output:
      eyebrow: Bloque 02 · Medido
      title: Cuántas se salta un continue, y qué queda en el acumulador
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };
        int contadas = 0, saltadas = 0, suma = 0;
        for (int i = 0; i < rpm.Length; i++)
        {
            bool fuera = rpm[i] < 1480 || rpm[i] > 1520;
            if (fuera) { saltadas++; continue; }
            contadas++;
            suma += rpm[i];
        }
        Console.WriteLine($"pasadas iniciadas   {rpm.Length}");
        Console.WriteLine($"saltadas por continue  {saltadas}");
        Console.WriteLine($"completadas         {contadas}");
        Console.WriteLine($"suma en banda    {suma}");
      output: |
        pasadas iniciadas   7
        saltadas por continue  2
        completadas         5
        suma en banda    7474

  - quiz:
      eyebrow: Verificación rápida
      question: ¿Cuánto vale j cuando este programa llega a la última línea?
      filename: Program.cs
      lang: csharp
      source: |
        int j = 0;
        while (j < 6)
        {
            if (j % 2 == 0) continue;
            j++;
        }
        Console.WriteLine(j);
      options:
        - Llega a 6, porque continue sólo se salta una pasada
        - Se queda en 0 y el programa nunca llega a esa línea
        - Vale 5, porque la última pasada se salta el incremento
        - No compila, porque continue exige un for y no un while

  - code_output:
      eyebrow: Respuesta · Medido
      title: En un for la ranura de cambio corre; en un while no corre nada
      filename: Program.cs
      lang: csharp
      output_label: Con tope de seguridad
      source: |
        int j = 0, vueltas = 0;
        while (j < 6)
        {
            vueltas++;
            if (vueltas > 1000) break;   // tope de seguridad
            if (j % 2 == 0) continue;    // aquí j nunca sube
            j++;
        }
        Console.WriteLine("while + continue antes de j++");
        Console.WriteLine($"j = {j} tras {vueltas} vueltas");
        Console.WriteLine("tope de seguridad en 1000");
      output: |
        while + continue antes de j++
        j = 0 tras 1001 vueltas
        tope de seguridad en 1000

  - code_output:
      eyebrow: Bloque 02 · Medido
      title: La convergencia tiene precio, y se cuenta en iteraciones
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        double[] tols = { 1e-3, 1e-6, 1e-12 };
        for (int t = 0; t < tols.Length; t++)
        {
            double lo = 1.0, hi = 2.0; int pasos = 0;
            while (hi - lo > tols[t])
            {
                double mid = (lo + hi) / 2;
                if (mid * mid > 2.0) hi = mid; else lo = mid;
                pasos++;
            }
            Console.WriteLine($"tol {tols[t],-6} -> {pasos} pasos");
        }
        Console.WriteLine($"Math.Sqrt(2) = {Math.Sqrt(2)}");
      output: |
        tol 0.001  -> 10 pasos
        tol 1E-06  -> 20 pasos
        tol 1E-12  -> 40 pasos
        Math.Sqrt(2) = 1.4142135623730951

  - pitfalls:
      eyebrow: Bloque 02 · Errores comunes
      title: Cuatro maneras de que un ciclo te salga mal
      items:
        - label: Error 01
          title: El ciclo que no termina
          desc: >-
            Nadie mueve la variable de control dentro del cuerpo. La condición sigue
            siendo cierta y la terminal se queda corriendo hasta que la interrumpes.
        - label: Error 02
          title: continue sobre tu propio incremento
          desc: >-
            En un for la ranura de cambio corre después del continue. En un while no corre
            nada, y j se queda en 0 después de mil una vueltas por el cuerpo.
        - label: Error 03
          title: break donde no hay lazo
          desc: >-
            El compilador nombra lo que falta, no la palabra que sobra. error CS0139 dice
            No enclosing loop out of which to break or continue, y un if no es un lazo.
        - label: Error 04
          title: Registrar después del break
          desc: >-
            El mensaje que pusiste debajo del break nunca se imprime. La compilación sí
            pasa, con warning CS0162 Unreachable code detected. Registra primero.

