  - divider:
      eyebrow: Bloque 01
      title: while, y los cuatro tiempos
      lede: Inicializa, revisa, cuerpo, cambia. Si no puedes señalar el cambio, no corras el programa.
      block: 1

  - concept:
      eyebrow: Concepto clave
      title: La línea que vuelve falsa la condición tiene número de renglón
      lead: >-
        Un ciclo no es una idea vaga de repetir. Son cuatro tiempos que ocurren en orden y
        que puedes señalar en el código con el dedo. El primero prepara la variable de
        control, el segundo la juzga, el tercero hace el trabajo y el cuarto mueve la
        variable hacia el final. Cuando alguien te enseñe un ciclo, pregunta por el cuarto.
      panel:
        label: La pregunta que hay que contestar antes de correr
        title: ¿Qué línea vuelve falsa la condición?
        note: >-
          Si nadie en el salón puede señalarla, el programa no se ejecuta. No es un consejo
          de estilo. Es la diferencia entre una corrida y una terminal secuestrada.
      steps:
        - text: Antes del lazo, la variable de control nace con un valor
        - text: En el encabezado, la condición se juzga entera
        - text: Dentro, el cuerpo hace el trabajo de la pasada
        - text: También dentro, algo mueve la variable de control
          loop: ↺ y el cuarto tiempo es el que casi siempre se olvida

  - code:
      eyebrow: Bloque 01 · while
      title: El acumulador del banco, con los cuatro tiempos marcados
      filename: Program.cs
      lang: csharp
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };

        int i = 0;                  // 1 · inicializa
        int suma = 0;

        while (i < rpm.Length)      // 2 · revisa
        {
            suma += rpm[i];         // 3 · cuerpo
            i++;                    // 4 · cambia
        }

        Console.WriteLine(suma);
      annotations:
        - label: La corrida rpm
          text: Siete lecturas del tacómetro del banco de bandas. Las mismas vuelven en la semana 9 y en la 14.
        - label: El acumulador
          text: suma vive fuera del lazo. Adentro se reiniciaría cada pasada y el total sería la última lectura.
        - label: rpm.Length
          text: El arreglo sabe cuántos elementos tiene, así que el lazo no depende de un 7 escrito a mano.
        - label: Riesgo
          text: Si borras i++ la condición nunca cambia y la terminal corre hasta que la cortes con Control C.
          accent: true

  - code_output:
      eyebrow: Bloque 01 · Medido
      title: El lazo que termina en papel y no termina en la máquina
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        double x = 0; int pasos = 0;
        while (x != 1.0 && pasos < 1000) { x += 0.1; pasos++; }
        Console.WriteLine($"!=  tras {pasos} pasadas");
        Console.WriteLine($"x = {x}");
        Console.WriteLine($"x == 1.0 -> {x == 1.0}");

        double y = 0; int pasos2 = 0;
        while (y < 1.0) { y += 0.1; pasos2++; }
        Console.WriteLine($"<   termina en {pasos2} pasadas");
        Console.WriteLine($"y = {y}");
      output: |
        !=  tras 1000 pasadas
        x = 99.9999999999986
        x == 1.0 -> False
        <   termina en 11 pasadas
        y = 1.0999999999999999

