  - code_output:
      eyebrow: Bloque 02 · Medido
      title: Uno corre una vez, el otro ninguna, y el compilador lo dice antes
      filename: Program.cs
      lang: csharp
      output_label: Al compilar y correr
      source: |
        int guard = 0;
        do { guard++; } while (false);

        int guard2 = 0;
        while (false) { guard2++; }

        Console.WriteLine($"do-while (false) -> guard  = {guard}");
        Console.WriteLine($"while (false)    -> guard2 = {guard2}");
      output: |
        Program.cs(5,17): warning CS0162:
        Unreachable code detected

        do-while (false) -> guard  = 1
        while (false)    -> guard2 = 0

  - code:
      eyebrow: Bloque 02 · do-while
      title: La lectura de una muestra que el operador puede equivocar
      filename: Program.cs
      lang: csharp
      source: |
        int intentos = 0;
        int rpm;
        bool ok;
        do
        {
            intentos++;
            Console.WriteLine("rpm (1400-1600):");
            string? linea = Console.ReadLine();
            bool leido = int.TryParse(linea, out rpm);
            ok = leido && rpm >= 1400 && rpm <= 1600;
            if (!ok) Console.WriteLine($"  rechazada '{linea}'");
        } while (!ok);

        Console.WriteLine($"aceptada {rpm} en {intentos} intentos");
      annotations:
        - label: Por qué do-while
          text: Hay que pedir la muestra antes de juzgarla, así que el cuerpo corre al menos una vez.
        - label: Dos guardias
          text: Primero que la cadena sea un entero, después que caiga en la banda del banco. En ese orden.
        - label: El corto circuito
          text: El segundo && no llega a evaluarse si TryParse falló. Es la semana 7 haciendo trabajo real aquí.
        - label: Riesgo
          text: Si el while no depende de ok, el lazo pide muestras para siempre aunque la primera sirva.
          accent: true

