  - code:
      eyebrow: Bloque 02 · El caso del banco
      title: La secuencia de armado del transportador, con enclavamiento
      filename: Program.cs
      lang: csharp
      source: |
        bool puerta = false, paro = true, armado = false;
        int rpm = 120, intentos = 0;
        do
        {
            intentos++;
            bool listo = puerta && paro && rpm < 50;
            Console.WriteLine($"intento {intentos}: listo={listo}");
            if (listo) { armado = true; break; }
            if (intentos == 1) puerta = true;
            if (intentos == 2) rpm = 20;
        } while (intentos < 3);
        if (armado) Console.WriteLine($"ARMADO en {intentos}");
        else Console.WriteLine("ENCLAVADO: reposición manual");
      annotations:
        - label: Tres razones físicas
          text: Puerta cerrada, paro de emergencia liberado y el eje bajo 50 rpm. Ninguna es una contraseña.
        - label: El primer break del curso
          text: Termina el do-while en cuanto las tres condiciones se cumplen, sin gastar el tercer intento.
        - label: El enclavamiento
          text: Tres intentos fallidos y queda enclavada. Reponerla exige ir al tablero, no teclear otra vez.
        - label: Riesgo
          text: Si el contador de intentos no sube en el cuerpo, la secuencia pide permiso para siempre.
          accent: true

  - trace:
      eyebrow: Bloque 02 · Traza medida
      title: Los tres intentos, con el estado de cada sensor
      headers: [Intento, puerta, paro, rpm, listo]
      rows:
