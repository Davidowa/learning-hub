  - concept:
      eyebrow: Concepto clave
      title: La cadena que atraviesa el curso entero
      lead: >-
        Un tipo es una decisión sobre qué cabe. Una condición es un valor. Un ciclo es esa
        condición repetida hasta que deja de ser cierta. Una función es un ciclo con nombre
        y contrato. Un arreglo es una corrida completa en memoria, y un struct es el renglón
        de esa corrida con los campos que tú elegiste.
      panel:
        label: Lo que significa para el examen
        title: No hay siete temas sueltos que memorizar
        note: >-
          Si sabes qué hace un acumulador dentro de un for, ya sabes qué hace el reporte
          final de este programa. Cambia la sintaxis, no la idea.
      steps:
        - text: Un tipo decide qué cabe
        - text: Una condición decide por dónde
        - text: Un ciclo repite hasta que se cumple
          loop: ↺ y la función le pone nombre

