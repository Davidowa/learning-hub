  - code:
      eyebrow: Bloque 01 · Validar
      title: La línea de captura, con una lectura mala adentro
      filename: Repaso.cs
      lang: csharp
      source: |
        string captura = "1480,1502,1495,abc,1533,1471,1509,1488";
        string[] campos = captura.Split(',');
        int[] rpm = new int[campos.Length];
        int n = 0, rechazadas = 0;
        foreach (string campo in campos)
        {
            bool ok = int.TryParse(campo, out int valor);
            if (ok) { rpm[n] = valor; n++; }
            else { rechazadas++; }
        }
        Console.WriteLine($"leidas {n}, rechazadas {rechazadas}");
      annotations:
        - label: Split
          text: La semana 13 parte una línea de texto en piezas. Aquí son ocho campos, uno de ellos basura.
        - label: TryParse
          text: Devuelve un bool y escribe la variable. El bool se revisa primero, siempre.
        - label: Dos contadores
          text: n dice cuántas entraron y rechazadas cuántas no. El arreglo tiene ocho lugares y solo siete sirven.
        - label: Riesgo
          text: Con Convert.ToInt32 en lugar de TryParse, el programa muere en el cuarto campo.
          accent: true

  - code:
      eyebrow: Bloque 01 · Clasificar
      title: La banda, el struct y el enum, en un solo ciclo
      filename: Repaso.cs
      lang: csharp
      source: |
        // struct Sample { int Channel; int Rpm; Status State; }
        Sample[] banco = new Sample[n];
        int suma = 0, fuera = 0;
        for (int i = 0; i < n; i++)
        {
            bool malo = rpm[i] < 1480 || rpm[i] > 1520;
            banco[i].Channel = i;
            banco[i].Rpm = rpm[i];
            banco[i].State = malo ? Status.Fault : Status.Ok;
            if (malo) fuera++;
            suma += rpm[i];
        }
      annotations:
        - label: La regla de banda
          text: r < 1480 || r > 1520, escrita en la lámina. Con la otra convención el conteo cambia.
        - label: banco[i].Channel
          text: El elemento del arreglo es el struct, así que escribirle un campo escribe en el banco.
        - label: El enum
          text: Status.Ok y Status.Fault son nombres, y adentro siguen siendo 0 y 2.
        - label: Un ciclo
          text: Clasifica, acumula y cuenta en el mismo recorrido. Tres acumuladores, una pasada.

