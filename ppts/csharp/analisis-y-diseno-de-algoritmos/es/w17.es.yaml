  - code_output:
      eyebrow: Error 06 · Medido
      title: El programa que imprime un número seguro y falso
      filename: seis.cs
      lang: csharp
      output_label: La corrida
      source: |
        int ciclos = int.MaxValue - 2;
        for (int k = 0; k < 5; k++)
        {
            ciclos++;
            Console.WriteLine($"+1 ciclo   {ciclos}");
        }
        long ciclosL = int.MaxValue - 2;
        for (int k = 0; k < 5; k++) ciclosL++;
        Console.WriteLine($"en long    {ciclosL}");
      output: |
        +1 ciclo   2147483646
        +1 ciclo   2147483647
        +1 ciclo   -2147483648
        +1 ciclo   -2147483647
        +1 ciclo   -2147483646
        en long    2147483650

  - compare:
      eyebrow: Bloque 02 · La otra mitad
      title: El compilador te cuida mientras puede ver el valor
      before:
        label: Escrito como literal
        file: lit.cs
        lang: csharp
        code: |
          Console.WriteLine(int.MaxValue + 1);
      after:
        label: El mismo valor por variable
        file: var.cs
        lang: csharp
        code: |
          int ciclos = int.MaxValue;
          Console.WriteLine(ciclos);
          Console.WriteLine(ciclos + 1);
      note: >-
        La izquierda ni siquiera produce ejecutable. El compilador evalúa la constante y se
        niega con error CS0220, The operation overflows at compile time in checked mode. La
        derecha compila con 0 advertencias y 0 errores, e imprime 2147483647 y −2147483648.

  - quiz:
      eyebrow: Pregunta rápida
      question: Un contador de ciclos llega al tope de int. ¿Qué hace el programa?
      filename: tope.cs
      lang: csharp
      source: |
        int ciclos = int.MaxValue;
        ciclos++;
        Console.WriteLine(ciclos);
      options:
        - 'Lanza OverflowException y ahí termina.'
        - 'Imprime -2147483648, sin error y sin advertencia.'
        - 'Se queda en 2147483647, porque ya llegó al tope.'
        - 'No compila, porque el compilador ve el desbordamiento.'

  - trace:
      eyebrow: Respuesta
      title: La misma suma, cuatro desenlaces
      headers: [La forma, Qué pasa, Dónde se ve]
      rows:
        - ["int.MaxValue + 1", "error CS0220", "al compilar"]
        - ["ciclos++", "-2147483648", "al correr"]
        - ["en long", "2147483650", "al correr"]
        - ["checked { }", "OverflowException", "al correr"]
      verdict: >-
        A 25 ciclos por segundo, ese tope llega a los 994.2 días de corrida continua. Es un
        reporte de mantenimiento que alguien habría creído.

