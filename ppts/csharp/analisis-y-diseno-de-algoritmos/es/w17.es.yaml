  - method:
      eyebrow: Examen final · Alcance
      title: Dos temas nunca han estado en un examen de este curso
      statement: >-
        El programa dice «todas las unidades del curso», y eso incluye dos temas que los
        parciales no alcanzaron a cubrir. Aquí van dichos en voz alta.
      points:
        - label: Del primer parcial
          text: >-
            El parcial 1 examinó la repetición al nivel de la semana 8, con while, do-while
            y una salida probada. El for, el anidamiento y break o continue entran aquí.
        - label: Del segundo parcial
          text: >-
            El parcial 2 cubrió la unidad 5 completa y la 6 hasta 6.1.3. Los arreglos de dos
            índices y la ordenación y búsqueda entran aquí.
        - label: Lo que no cambia
          text: >-
            Nada fuera del temario. Decirlo en voz alta es la diferencia entre un examen
            justo y una sorpresa el día del examen.

  - pitfalls:
      eyebrow: Cierre · Honestidad
      title: Lo que este curso no te enseñó, dicho aquí y no en febrero
      items:
        - label: No vimos 01
          title: Clases propias con comportamiento
          desc: Las clases aparecieron dos veces y solo como contraste medido. Escribir una es el curso que sigue.
        - label: No vimos 02
          title: try / catch como herramienta de diseño
          desc: Aquí las excepciones fueron fallas que se previenen. La regla fue guardar la entrada, no atrapar el choque.
        - label: No vimos 03
          title: Colecciones más allá del arreglo
          desc: List de T apareció una vez y fallando, con CS1612. Archivos y bases de datos tampoco entraron.
        - label: No vimos 04
          title: Genéricos, LINQ y programación asíncrona
          desc: Un solo rpm.Sum() en la lámina de paradigmas de la semana 2, y nada más. No es una disculpa, es el mapa.

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para el semestre entero
      items:
        - title: Corre el programa, luego cita
          desc: Lo que el programa imprimió es un dato. Lo que crees que imprime es una hipótesis sin probar
        - title: El compilador ve lo que puede ver
          desc: En cuanto el valor entra a una variable, la única defensa que queda es la que tú escribiste
        - title: Guarda el código de tu proyecto
          desc: Es tu primera pieza de portafolio, y es la prueba de que puedes construir algo que corre

  - closing:
