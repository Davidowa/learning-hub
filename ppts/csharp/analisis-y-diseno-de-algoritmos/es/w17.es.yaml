  - code_output:
      eyebrow: Error 01 · Medido
      title: La división entera trunca, y el cast va antes
      filename: uno.cs
      lang: csharp
      output_label: La corrida
      source: |
        Console.WriteLine($"7 / 2            = {7 / 2}");
        Console.WriteLine($"7 / 2.0          = {7 / 2.0}");
        int suma = 10478, n = 7;
        Console.WriteLine($"suma / n         = {suma / n}");
        Console.WriteLine($"(double)suma / n = {(double)suma / n}");
        Console.WriteLine($"... :F3          = {(double)suma / n:F3}");
      output: |
        7 / 2            = 3
        7 / 2.0          = 3.5
        suma / n         = 1496
        (double)suma / n = 1496.857142857143
        ... :F3          = 1496.857

  - code_output:
      eyebrow: Error 02 · Medido
      title: Dos lecturas nunca se comparan con igual
      filename: dos.cs
      lang: csharp
      output_label: La corrida
      source: |
        double lectura = 0.1 + 0.2;
        Console.WriteLine($"0.1 + 0.2    = {lectura}");
        Console.WriteLine($"== 0.3       = {lectura == 0.3}");
        double dif = Math.Abs(24.97 - 25.0);
        Console.WriteLine($"|24.97-25.0| = {dif}");
        Console.WriteLine($"<= 0.05      = {dif <= 0.05}");
      output: |
        0.1 + 0.2    = 0.30000000000000004
        == 0.3       = False
        |24.97-25.0| = 0.030000000000001137
        <= 0.05      = True

  - code_output:
      eyebrow: Error 03 · Medido
      title: Convertir sin preguntar, o preguntar antes de convertir
      filename: tres.cs
      lang: csharp
      output_label: La corrida
      source: |
        try
        {
            Console.WriteLine(Convert.ToInt32("abc"));
        }
        catch (FormatException e)
        {
            Console.WriteLine("Convert -> " + e.GetType().Name);
        }
        bool ok = int.TryParse("abc", out int v);
        Console.WriteLine($"TryParse -> {ok}, v = {v}");
        string? nada = null;
        Console.WriteLine($"Convert(null) -> {Convert.ToInt32(nada)}");
      output: |
        Convert -> FormatException
        TryParse -> False, v = 0
        Convert(null) -> 0

