  - code_output:
      eyebrow: Bloque 02 · Inmutable
      title: ToUpper devuelve otra cadena y deja la tuya quieta
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        string tag = "sensor-07";
        tag.ToUpper();
        Console.WriteLine("tag        " + tag);
        Console.WriteLine("ToUpper()  " + tag.ToUpper());

        string bruto = "  SENSOR-07  ";
        bruto.Trim();
        Console.WriteLine("bruto     [" + bruto + "]");
        Console.WriteLine("Trim()    [" + bruto.Trim() + "]");
      output: |
        tag        sensor-07
        ToUpper()  SENSOR-07
        bruto     [  SENSOR-07  ]
        Trim()    [SENSOR-07]

  - code:
      eyebrow: Bloque 02 · La línea real
      title: Una línea del registrador, de punta a punta
      filename: Program.cs
      lang: csharp
      source: |
        using System.Globalization;

        string linea = "  SENSOR-07:20.1,21.5,22.9  ";
        string[] partes = linea.Trim().Split(':');
        string tag = partes[0];
        string[] nums = partes[1].Split(',');

        double suma = 0;
        foreach (string s in nums)
        {
            suma += double.Parse(s, CultureInfo.InvariantCulture);
        }

        double media = suma / nums.Length;
        Console.WriteLine($"{tag} media {media:F3}");
      annotations:
        - label: Trim antes de Split
          text: El registrador deja espacios a los lados. Trim los quita una vez y ya no vuelven a estorbar.
        - label: Dos cortes
          text: Primero por dos puntos para separar etiqueta de lecturas, luego por comas para separar lecturas.
        - label: La cultura fijada
          text: Sin InvariantCulture el 20.1 se lee 201 en una máquina alemana, y TryParse devuelve True igual.
        - label: Lo que imprime
          text: SENSOR-07 media 21.500, con el especificador F3 haciendo el trabajo de presentación.
          accent: true

