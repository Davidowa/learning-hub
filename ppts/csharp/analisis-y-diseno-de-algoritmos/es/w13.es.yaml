  - code_output:
      eyebrow: Bloque 02 · Caso de redes
      title: La media dice 21.15 y la mediana dice 12.25
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        using System.Globalization;

        string linea = "  SEQ-0042:12.4,11.9,48.2,12.1  ";
        string[] ms = linea.Trim().Split(':')[1].Split(',');

        double[] lat = new double[ms.Length];
        for (int i = 0; i < ms.Length; i++)
            lat[i] = double.Parse(ms[i], CultureInfo.InvariantCulture);

        double s = 0;
        foreach (double x in lat) s += x;
        Array.Sort(lat);
        Console.WriteLine($"media   = {s / lat.Length}");
        Console.WriteLine($"orden   = [{string.Join(", ", lat)}]");
        Console.WriteLine($"mediana = {(lat[1] + lat[2]) / 2}");
      output: |
        media   = 21.15
        orden   = [11.9, 12.1, 12.4, 48.2]
        mediana = 12.25

