  - code_output:
      eyebrow: Bloque 01 · Alias y copia
      title: Un arreglo es una referencia y Clone no lo es
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        int[] src = { 1480, 1502, 1495 };
        int[] alias = src;
        alias[0] = 99;
        Console.WriteLine("src[0]  " + src[0]);

        int[] src2 = { 1480, 1502, 1495 };
        int[] copia = (int[])src2.Clone();
        copia[0] = 99;
        Console.WriteLine("src2[0] " + src2[0]);

        Console.WriteLine(ReferenceEquals(src, alias));
        Console.WriteLine(ReferenceEquals(src2, copia));
      output: |
        src[0]  99
        src2[0] 1480
        True
        False

