        dos líneas de distancia, un solo defecto.

  - code_output:
      eyebrow: Bloque 02 · Comparar de verdad
      title: El operador que ya conoces falla con entrada tecleada
      filename: Program.cs
      lang: csharp
      output_label: Al correr
      source: |
        string typed = "SORT";
        var ci = StringComparison.OrdinalIgnoreCase;

        bool op = typed == "sort";
        bool eq = typed.Equals("sort");
        bool eqCi = typed.Equals("sort", ci);
        bool upper = typed.ToUpper() == "SORT";
        bool trim = " sort ".Trim() == "sort";
        bool corta = "s".Equals("sort", ci);

        Console.WriteLine($"==   {op}   Equals  {eq}");
        Console.WriteLine($"+ci  {eqCi}    ToUpper {upper}");
        Console.WriteLine($"Trim {trim}    corta   {corta}");
      output: |
        ==   False   Equals  False
        +ci  True    ToUpper True
        Trim True    corta   False

