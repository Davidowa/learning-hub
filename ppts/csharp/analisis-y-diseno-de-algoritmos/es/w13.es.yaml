  - code:
      eyebrow: Bloque 02 · El validador
      title: Un identificador de parte, revisado por partes
      filename: Program.cs
      lang: csharp
      source: |
        static bool ValidPartId(string raw)
        {
            string id = raw.Trim();
            if (id.Length != 10) return false;

            var ci = StringComparison.OrdinalIgnoreCase;
            if (!id.StartsWith("SNS-", ci)) return false;
            if (!id.EndsWith("-A") && !id.EndsWith("-B"))
                return false;

            for (int i = 4; i < 8; i++)
                if (!char.IsDigit(id[i])) return false;
            return true;
        }
      annotations:
        - label: Largo primero
          text: La revisión más barata va arriba. Si el largo no es 10 no hace falta mirar nada más.
        - label: Trim del que llama
          text: El validador recorta lo que recibe, así que quien lo llama no tiene que acordarse.
        - label: Los dígitos
          text: char.IsDigit sobre las posiciones 4 a 7. Cuatro dígitos en SNS-4471-A, contados por el ciclo.
        - label: Riesgo
          text: El prefijo se comparó sin distinguir mayúsculas y el sufijo dos líneas abajo no. Ese es el defecto.
          accent: true

  - trace:
      eyebrow: Bloque 02 · Cinco entradas
