  - code:
      eyebrow: Bloque 01 · Por fin
      title: Las siete lecturas de rpm bajo un solo nombre
      filename: Program.cs
      lang: csharp
      source: |
        int[] rpm = { 1480, 1502, 1495, 1533, 1471, 1509, 1488 };

        int suma = 0;
        int fuera = 0;

        foreach (int r in rpm)
        {
            suma += r;
            if (r < 1480 || r > 1520) fuera++;
        }

        Console.WriteLine($"rpm.Length = {rpm.Length}");
        Console.WriteLine($"suma       = {suma}");
      annotations:
        - label: Un nombre
          text: Siete variables sueltas se volvieron una. El ciclo ya no cambia cuando llegue la octava muestra.
        - label: La regla de banda
          text: r menor que 1480 o mayor que 1520. Es la convención inclusiva y va escrita cada vez que aparece el conteo.
        - label: Length
          text: Lo cuenta el arreglo, no tú. Cambia el literal de arriba y el conteo se ajusta solo.
        - label: Riesgo
          text: La primera muestra vale 1480, exactamente el límite. Con la otra convención el conteo sería 3 de 7.
          accent: true

