        Console.WriteLine(rejilla.GetLength(0));
        Console.WriteLine(rejilla.GetLength(1));
        Console.WriteLine(rejilla.Length);
        Console.WriteLine(rejilla.Rank);
        Console.WriteLine(dentado.Length);
        Console.WriteLine(dentado.Rank);
        Console.WriteLine(celdas);
      output: |
        3
        4
        12
        2
        3
        1
        8

