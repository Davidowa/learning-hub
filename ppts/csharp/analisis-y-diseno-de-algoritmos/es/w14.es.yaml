      title: Una sola entrada no es una comparación
      headers: [Algoritmo, La corrida, Ya ordenada, Invertida]
      rows:
        - ["burbuja sin bandera", "21", "21", "21"]
        - ["burbuja con bandera", "20", "6", "21"]
        - ["seleccion", "21", "21", "21"]
        - ["insercion", "15", "6", "21"]
        - ["Shell 3-1", "12", "10", "13"]
      verdict: >-
        El que ganaba con 12 queda tercero en cuanto la entrada ya viene ordenada, y ahí la
        bandera de salida temprana compra 15 comparaciones de 21. Selección nunca cambia su
        cuenta, porque mira todo pase lo que pase.

  - divider:
      eyebrow: Bloque 03
      title: Encontrar uno
      lede: Dos algoritmos que contestan la misma pregunta, y una diferencia que solo se ve cuando el arreglo crece.
      block: 3

  - compare:
      eyebrow: Bloque 03 · Las dos búsquedas
      title: Recorrer todo, o partir el arreglo a la mitad
      before:
        label: Secuencial
        file: Secuencial.cs
        lang: csharp
        code: |
          int c = 0;
          for (int i = 0; i < a.Length; i++)
          {
            c++;
            if (a[i] == k) return c;
          }
      after:
        label: Binaria
        file: Binaria.cs
        lang: csharp
        code: |
          int lo = 0, hi = a.Length - 1, c = 0;
          while (lo <= hi)
          {
            c++;
            int mid = lo + (hi - lo) / 2;
            if (a[mid] == k) return c;
            if (a[mid] < k) lo = mid+1; else hi = mid-1;
          }
      note: >-
        Los dos cuerpos viven dentro de la misma firma, static int Buscar(int[] a, int k), y
        los dos devuelven cuántas comparaciones costó llegar a la clave. Una comparación es
        una prueba a[i] == k en la secuencial y una visita a a[mid] en la binaria.

  - code_output:
      eyebrow: Bloque 03 · Medido
      title: Mil identificadores de muestra, y el último de todos
      filename: Buscar.cs
      lang: csharp
      output_label: Al correr
      source: |
        int[] ids = new int[1000];
        for (int i = 0; i < 1000; i++) ids[i] = 2 * i;

        Console.WriteLine(Seq(ids, 1998));
        Console.WriteLine(Bin(ids, 1998));
      output: |
        1000
        10

