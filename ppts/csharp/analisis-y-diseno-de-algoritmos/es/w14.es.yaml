  - quiz:
      eyebrow: Pregunta rápida
      question: El arreglo no está ordenado y el 7 sí está. ¿Qué devuelve la binaria?
      filename: Busqueda.cs
      lang: csharp
      source: |
        int[] datos = { 5, 1, 9, 3, 7 };

        Console.WriteLine(
            Array.BinarySearch(datos, 7));
      options:
        - 'Devuelve 4, que es donde el 7 vive de verdad.'
        - 'Devuelve -3, un negativo que además apunta al lugar equivocado.'
        - 'Lanza una excepción por recibir un arreglo sin ordenar.'
        - 'Devuelve -1, el centinela de no encontrado de toda la vida.'

  - trace:
      eyebrow: Respuesta
      title: Sobre entrada sin ordenar la binaria no falla — miente
      headers: [Valor, Índice real, BinarySearch]
      rows:
        - ["5", "0", "0"]
        - ["1", "1", "-1"]
        - ["9", "2", "2"]
        - ["7", "4", "-3"]
      verdict: >-
        Los cinco valores están en el arreglo, y el 3 se porta como el 1. Solo dos vuelven
        bien, y por suerte. El 7 vuelve como -3, que decodifica al punto de inserción 2,
        equivocado dos veces. No se lanzó ninguna excepción para ninguno de los cinco.

  - code_output:
      eyebrow: Bloque 03 · Medido
      title: El complemento a bits, y el choque con el -1 casero
      filename: Complemento.cs
      lang: csharp
      output_label: Al correr
      source: |
        int[] log = new int[1000];
        for (int i = 0; i < 1000; i++) log[i] = 2 * i;

        Console.WriteLine(Array.BinarySearch(log, 1999));
        Console.WriteLine(Array.BinarySearch(log, 2000));
        Console.WriteLine(Array.BinarySearch(log, -1));
        Console.WriteLine(~(-1001));
        Console.WriteLine(~(-1));
      output: |
        -1001
        -1001
        -1
        1000
        0

  - code_output:
      eyebrow: Bloque 03 · Caso de redes
      title: El retorno negativo es la detección de pérdida
      filename: Latencia.cs
      lang: csharp
      output_label: Al correr
      source: |
        double[] lat = { 12.4, 11.9, 48.2, 12.1 };
        double suma = 0;
        foreach (double v in lat) suma += v;
        Array.Sort(lat);

        Console.WriteLine(suma / lat.Length);
        Console.WriteLine((lat[1] + lat[2]) / 2);

        int[] seqs = { 40, 41, 42, 44, 45 };
        Console.WriteLine(Array.BinarySearch(seqs, 43));
        Console.WriteLine(~Array.BinarySearch(seqs, 43));
      output: |
        21.15
        12.25
        -4
        3

