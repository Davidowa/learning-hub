  - divider:
      eyebrow: Bloque 01
      title: La rejilla
      lede: Un renglón por posición de la pieza, una columna por punto de medición. Un solo nombre y dos índices.
      block: 1

  - code:
      eyebrow: Bloque 01 · Las dos formas
      title: El mapa del dispositivo de inspección
      filename: Rejilla.cs
      lang: csharp
      source: |
        int[,] rejilla = new int[3, 4];
        int[][] dentado = new int[3][];

        rejilla[0, 0] = -12;
        rejilla[2, 3] = 47;

        dentado[0] = new int[2];
        dentado[1] = new int[5];
        dentado[2] = new int[1];

        int celdas = 0;
        foreach (int[] fila in dentado)
        {
            celdas += fila.Length;
        }
      annotations:
        - label: Dos índices
          text: El primero elige el renglón y el segundo la columna. La coma va dentro de los mismos corchetes.
        - label: Dentado
          text: Cada renglón es su propio arreglo y puede medir otra cosa. Los tres empiezan valiendo null.
        - label: Las celdas
          text: El rectángulo tiene 12 celdas. El dentado tiene 8, y ese número lo cuentas tú renglón por renglón.
        - label: Riesgo
          text: dentado[0][0] antes de asignar el renglón lanza NullReferenceException, no IndexOutOfRangeException.
          accent: true

  - code_output:
      eyebrow: Bloque 01 · Medido
      title: Length y Rank no dicen lo mismo en las dos formas
      filename: Rejilla.cs
      lang: csharp
      output_label: Al correr
