  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: Dos formas, dos tipos
          desc: La rectangular tiene Rank 2 y la dentada Rank 1, y el compilador no deja pasar ni una asignación entre ellas
        - title: Shell gana, y no siempre
          desc: 12 comparaciones sobre la corrida registrada, 10 sobre una ya ordenada donde inserción hace 6. La entrada decide
        - title: La binaria pide orden
          desc: Sin arreglo ordenado no falla, contesta mal y sigue corriendo. La precondición es parte del algoritmo

  - lab:
      eyebrow: Laboratorio
      title: El mapa de desviaciones del dispositivo
      brief: Carga un arreglo de tres renglones por cuatro columnas con la desviación medida de cada posición de pieza, imprime el promedio de cada renglón y el de cada columna, y reporta la posición de la peor celda con sus dos índices.
      blocks:
        - label: Entrega
          text: El .cs y la salida, con los promedios y el par de índices de la peor celda
        - label: Restricción
          text: Los límites de los ciclos salen de GetLength, no de un 3 ni de un 4 escritos a mano
        - label: La prueba
          text: Agrega una columna al arreglo. El programa tiene que seguir corriendo sin tocar ni un ciclo

