  - divider:
      eyebrow: Bloque 02
      title: Cuatro maneras de ordenar los mismos siete números
      lede: El temario nombra cuatro algoritmos. Hoy corren los cuatro sobre la misma corrida y cada uno lleva su contador.
      block: 2

  - compare:
      eyebrow: Bloque 02 · Los dos primeros
      title: Burbuja y selección, con el contador dentro
      before:
        label: Burbuja
        file: Burbuja.cs
        lang: csharp
        code: |
          for (int i = 0; i < n - 1; i++)
            for (int j = 0; j < n - 1 - i; j++)
            {
              cmp++;
              if (a[j] > a[j + 1])
              { Swap(a, j, j + 1); mov++; }
            }
      after:
        label: Selección
        file: Seleccion.cs
        lang: csharp
        code: |
          for (int i = 0; i < n - 1; i++)
          {
            int min = i;
            for (int j = i + 1; j < n; j++)
            { cmp++; if (a[j] < a[min]) min = j; }
            if (min != i) { Swap(a, i, min); mov++; }
          }
      note: >-
        Las dos hacen 21 comparaciones sobre la misma corrida. Burbuja intercambia 10 veces
        y selección 4, porque selección intercambia una sola vez por vuelta y solo cuando el
        mínimo no estaba ya en su lugar.

  - compare:
      eyebrow: Bloque 02 · Los otros dos
      title: Shell es inserción con un salto
      before:
        label: Inserción
        file: Insercion.cs
        lang: csharp
        code: |
          int gap = 1;
          for (int i = gap; i < n; i++)
          {
            int key = a[i], j = i;
            while (j >= gap && a[j - gap] > key)
            { a[j] = a[j - gap]; j -= gap; }
            a[j] = key;
          }
      after:
        label: Shell
        file: Shell.cs
        lang: csharp
        code: |
          for (int gap = n / 2; gap > 0; gap /= 2)
          for (int i = gap; i < n; i++)
          {
            int key = a[i], j = i;
            while (j >= gap && a[j - gap] > key)
            { a[j] = a[j - gap]; j -= gap; }
            a[j] = key;
          }
      note: >-
        Inserción es Shell con un solo salto de 1. La comparación que se cuenta es cada
        evaluación de a[j - gap] > key, y con esa cuenta inserción hace 15 y Shell 12 sobre
        las mismas siete lecturas.

