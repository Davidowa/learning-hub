- quiz:
    eyebrow: Comprobación
    question: Otra variable recibe el mismo registro mediante asignación. ¿Qué ocurre al modificarlo?
    options:
    - Los objetos TypeScript comparten referencias; los structs Swift copian valores
    - Los structs Swift siempre comparten referencias
    - El título no puede cambiar
    - Ambos lenguajes siempre crean copias independientes
    notes: Respuesta A. Los tipos expresan contratos. La ausencia de un valor y la copia de un objeto requieren decisiones explícitas.
