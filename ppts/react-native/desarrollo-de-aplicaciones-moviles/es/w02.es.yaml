- code:
    eyebrow: React Native
    title: Ejemplo 2
    filename: w02-sample-2.ts
    lang: ts
    source: |
      import { pending, type Report } from './report';

      test('pending keeps only unsynced reports', () => {
        const rs: Report[] = [
          { id: '1', title: 'Fuga', category: 'facility',
            status: 'pending' },
          { id: '2', title: 'Lámpara', category: 'facility',
            status: 'synced' },
        ];
        expect(pending(rs).map(r => r.id)).toEqual(['1']);
      });
    annotations:
    - label: Contexto
      text: Fragmento del archivo de ejemplo. Conserva los tipos e imports de su contexto.
    - label: Comprobación
      text: Explica entradas, estado y resultado esperado.
