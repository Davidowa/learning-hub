- quiz:
    eyebrow: Comprobación
    question: Una app desconocida tiene una falla reproducible. ¿Cuál es el primer paso útil de mantenimiento?
    options:
    - Reescribir toda la app inmediatamente
    - Reproducir la falla e identificar una comprobación que falla
    - Actualizar todas las dependencias a la vez
    - Quitar la función afectada sin evidencia
    notes: Respuesta B. La evaluación final combina mantenimiento de código, explicación y transferencia a un caso nuevo.
