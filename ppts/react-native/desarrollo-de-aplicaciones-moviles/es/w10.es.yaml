- code:
    eyebrow: React Native
    title: Ejemplo 1
    filename: w10-sample-1.tsx
    lang: tsx
    source: |
      const [permission, requestPermission] = useCameraPermissions();
      const camera = useRef<CameraView>(null);

      if (!permission) return null;          // aún cargando
      if (!permission.granted) {
        return <Button title="Permitir cámara"
                       onPress={requestPermission} />;
      }
      return <CameraView ref={camera} style={{ flex: 1 }} />;
    annotations:
    - label: Contexto
      text: Fragmento del archivo de ejemplo. Conserva los tipos e imports de su contexto.
    - label: Comprobación
      text: Explica entradas, estado y resultado esperado.
    notes: |-
      Sample source: React Native realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://reactnative.dev/docs/getting-started
- quiz:
    eyebrow: Comprobación
    question: El permiso de cámara se rechaza. ¿Qué permite una recuperación útil?
    options:
    - Explicar el límite y ofrecer una alternativa permitida
    - Pedir el permiso en un ciclo infinito
    - Simular que se tomó una foto
    - Cerrar la app con una falla
    notes: Respuesta A. El acceso a medios depende del propósito. Un selector del sistema puede reducir permisos y exposición.
