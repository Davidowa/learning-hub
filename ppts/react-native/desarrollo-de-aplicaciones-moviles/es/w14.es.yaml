- code:
    eyebrow: React Native
    title: Ejemplo 1
    filename: w14-sample-1.tsx
    lang: tsx
    source: |
      test('save is disabled until the title is valid', () => {
        render(<NewReport onSave={jest.fn()} />);
        const save = screen.getByRole('button', { name: 'Guardar' });
        expect(save).toBeDisabled();

        fireEvent.changeText(
          screen.getByPlaceholderText('¿Qué observaste?'), 'Fuga');
        expect(save).toBeEnabled();
      });
    annotations:
    - label: Contexto
      text: Fragmento del archivo de ejemplo. Conserva los tipos e imports de su contexto.
    - label: Comprobación
      text: Explica entradas, estado y resultado esperado.
    notes: |-
      Sample source: React Native realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://reactnative.dev/docs/getting-started
- code:
    eyebrow: React Native
    title: Ejemplo 2
    filename: w14-sample-2.maestro
    lang: yaml
    source: |
      appId: dev.tunombre.bitacora
      ---
      - launchApp
      - tapOn: "Nuevo reporte"
      - inputText: "Fuga en laboratorio"
      - tapOn: "Guardar"
      - assertVisible: "Fuga en laboratorio"
    annotations:
