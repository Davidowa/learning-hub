- quiz:
    eyebrow: Comprobación
    question: ¿Qué prueba demuestra que una falla se corrigió?
    options:
    - Una que falla con el defecto y pasa con el comportamiento corregido
    - Una captura sin criterio de aceptación
    - Un conteo de archivos fuente
    - Una que pasa antes y después sin comprobar la falla
    notes: Respuesta A. Las pruebas aportan evidencia en distintos niveles. Una compilación verde no garantiza una experiencia correcta.
