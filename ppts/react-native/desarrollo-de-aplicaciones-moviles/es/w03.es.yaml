- code:
    eyebrow: React Native
    title: Ejemplo 2
    filename: w03-sample-2.tsx
    lang: tsx
    source: |
      useEffect(() => {
        const sub = AppState.addEventListener('change', state => {
          log(`${new Date().toISOString()} ${state}`);
        });
        return () => sub.remove();
      }, []);
    annotations:
    - label: Contexto
      text: Fragmento del archivo de ejemplo. Conserva los tipos e imports de su contexto.
    - label: Comprobación
