      https://reactnative.dev/docs/getting-started
- quiz:
    eyebrow: Comprobación
    question: El sistema termina el proceso de la app. ¿Qué estado está en riesgo?
    options:
    - El identificador de la app
    - Todas las dependencias instaladas
    - Todos los registros del servidor
    - El estado en memoria que no se guardó
    notes: Respuesta D. El sistema operativo controla procesos, permisos y ciclo de vida. La app declara lo que necesita.
