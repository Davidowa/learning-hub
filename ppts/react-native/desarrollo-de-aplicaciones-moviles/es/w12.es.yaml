- code:
    eyebrow: React Native
    title: Ejemplo 1
    filename: w12-sample-1.ts
    lang: ts
    source: |
      const Trigger = Notifications.SchedulableTriggerInputTypes;

      await Notifications.scheduleNotificationAsync({
        content: {
          title: 'Reporte pendiente',
          body: report.title,
          data: { url: `bitacora://report/${report.id}` },
        },
        trigger: { type: Trigger.TIME_INTERVAL, seconds: 3600 },
      });
    annotations:
    - label: Contexto
      text: Fragmento del archivo de ejemplo. Conserva los tipos e imports de su contexto.
    - label: Comprobación
      text: Explica entradas, estado y resultado esperado.
    notes: |-
      Sample source: React Native realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://reactnative.dev/docs/getting-started
- quiz:
    eyebrow: Comprobación
    question: Un enlace usa un esquema inesperado y un host conocido. ¿Qué debe hacer la app?
    options:
    - Desactivar toda navegación permanentemente
    - Aceptar solo por el host
    - Validar esquema y argumentos antes de navegar
    - Ejecutar todos los argumentos
    notes: Respuesta C. La app delega tareas al sistema y a otras apps mediante contratos y límites verificables.
