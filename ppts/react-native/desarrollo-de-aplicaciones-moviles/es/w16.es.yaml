- code:
    eyebrow: React Native
    title: Ejemplo 1
    filename: w16-sample-1.swift
    lang: swift
    source: |
      import ExpoModulesCore

      public class PowerModule: Module {
        public func definition() -> ModuleDefinition {
          Name("Power")
          Function("isLowPowerMode") {
            ProcessInfo.processInfo.isLowPowerModeEnabled
          }
        }
      }
    annotations:
    - label: Contexto
      text: Fragmento del archivo de ejemplo. Conserva los tipos e imports de su contexto.
    - label: Comprobación
      text: Explica entradas, estado y resultado esperado.
    notes: |-
      Sample source: React Native realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://reactnative.dev/docs/getting-started
- code:
    eyebrow: React Native
    title: Ejemplo 2
    filename: w16-sample-2.kt
    lang: kotlin
    source: |
      class PowerModule : Module() {
        override fun definition() = ModuleDefinition {
          Name("Power")
          Function("isLowPowerMode") {
            val ctx = appContext.reactContext
              ?: return@Function false
            val pm = ctx.getSystemService(Context.POWER_SERVICE)
              as PowerManager
            pm.isPowerSaveMode
          }
        }
      }
    annotations:
    - label: Contexto
      text: Fragmento del archivo de ejemplo. Conserva los tipos e imports de su contexto.
    - label: Comprobación
      text: Explica entradas, estado y resultado esperado.
    notes: |-
      Sample source: React Native realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://reactnative.dev/docs/getting-started
- quiz:
    eyebrow: Comprobación
    question: Una herramienta reduce tiempo y supera el límite de errores acordado. ¿Qué decisión corresponde al piloto?
    options:
    - Cambiar el límite después de ver el resultado
    - Adoptarla porque es más rápida
    - Detenerse e investigar la falla de calidad
    - Ocultar la métrica de errores
    notes: Respuesta C. Una herramienta se evalúa contra un problema y evidencia de una prueba con criterios definidos.
