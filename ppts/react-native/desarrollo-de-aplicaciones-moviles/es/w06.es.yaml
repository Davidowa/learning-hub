- quiz:
    eyebrow: Comprobación
    question: Se inserta una fila al principio de una lista. ¿Qué clave conserva la identidad del registro?
    options:
    - Un identificador único y estable del registro
    - La posición actual en pantalla
    - Una clave aleatoria en cada render
    - El índice de la fila
    notes: Respuesta A. Una fila necesita identidad estable. La navegación guarda destinos y contexto.
