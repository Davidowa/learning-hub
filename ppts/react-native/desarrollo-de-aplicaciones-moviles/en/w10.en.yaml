- code:
    eyebrow: React Native
    title: Example 1
    filename: w10-sample-1.tsx
    lang: tsx
    source: |
      const [permission, requestPermission] = useCameraPermissions();
      const camera = useRef<CameraView>(null);

      if (!permission) return null;          // aún cargando
      if (!permission.granted) {
        return <Button title="Permitir cámara"
                       onPress={requestPermission} />;
      }
      return <CameraView ref={camera} style={{ flex: 1 }} />;
    annotations:
    - label: Context
      text: Fragment of the sample file. Keep the types and imports supplied by its context.
    - label: Check
      text: Explain inputs, state and the expected result.
    notes: |-
      Sample source: React Native realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://reactnative.dev/docs/getting-started
- quiz:
    eyebrow: Quick check
    question: Camera permission is denied. What is a usable recovery?
    options:
    - Explain the limitation and offer an allowed alternative
    - Request again in an endless loop
    - Pretend a photo was captured
    - Crash the app
    notes: Answer A. device capabilities are permission-gated. Ask at the moment of need, explain why, handle denial, and prefer a system picker that needs no permission over full access (least privilege).
