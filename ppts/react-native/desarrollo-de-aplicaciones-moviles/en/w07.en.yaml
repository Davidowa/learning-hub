- quiz:
    eyebrow: Quick check
    question: How can domain logic be tested without network access?
    options:
    - Delete all domain checks
    - Put every rule inside the view
    - Wait for the production server
    - Inject an in-memory repository with the same contract
    notes: Answer D. separate what changes for different reasons. Views render, a store owns app state, and a repository hides where the data lives. Boundaries make code testable and replaceable.
