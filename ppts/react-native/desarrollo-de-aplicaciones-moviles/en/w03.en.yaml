- code:
    eyebrow: React Native
    title: Example 2
    filename: w03-sample-2.tsx
    lang: tsx
    source: |
      useEffect(() => {
        const sub = AppState.addEventListener('change', state => {
          log(`${new Date().toISOString()} ${state}`);
        });
        return () => sub.remove();
      }, []);
    annotations:
    - label: Context
