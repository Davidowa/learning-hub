- quiz:
    eyebrow: Quick check
    question: The OS terminates the app process. Which state is at risk?
    options:
    - The app identifier
    - Every installed dependency
    - Every server record
    - Unsaved in-memory state
    notes: Answer D. the OS owns the process. Your app is a signed, sandboxed bundle with a declared contract (identity, permissions, entry points), and its process can be paused or killed at any time.
