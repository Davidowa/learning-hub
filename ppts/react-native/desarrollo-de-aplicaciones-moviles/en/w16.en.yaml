- code:
    eyebrow: React Native
    title: Example 1
    filename: w16-sample-1.swift
    lang: swift
    source: |
      import ExpoModulesCore

      public class PowerModule: Module {
        public func definition() -> ModuleDefinition {
          Name("Power")
          Function("isLowPowerMode") {
            ProcessInfo.processInfo.isLowPowerModeEnabled
          }
        }
      }
    annotations:
    - label: Context
      text: Fragment of the sample file. Keep the types and imports supplied by its context.
    - label: Check
      text: Explain inputs, state and the expected result.
    notes: |-
      Sample source: React Native realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://reactnative.dev/docs/getting-started
- code:
    eyebrow: React Native
    title: Example 2
    filename: w16-sample-2.kt
    lang: kotlin
    source: |
      class PowerModule : Module() {
        override fun definition() = ModuleDefinition {
          Name("Power")
          Function("isLowPowerMode") {
            val ctx = appContext.reactContext
              ?: return@Function false
            val pm = ctx.getSystemService(Context.POWER_SERVICE)
              as PowerManager
            pm.isPowerSaveMode
          }
        }
      }
    annotations:
    - label: Context
      text: Fragment of the sample file. Keep the types and imports supplied by its context.
    - label: Check
      text: Explain inputs, state and the expected result.
    notes: |-
      Sample source: React Native realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://reactnative.dev/docs/getting-started
- quiz:
    eyebrow: Quick check
    question: A tool reduces handling time but exceeds the agreed error limit. What is the justified pilot decision?
    options:
    - Change the limit after seeing the result
    - Adopt it because it is faster
    - Stop and investigate the quality failure
    - Hide the error metric
    notes: Answer C. tools are instances of concepts. You evaluate any new one with a fixed rubric, a timeboxed spike and a written decision record that carries a review date.
