- quiz:
    eyebrow: Quick check
    question: An unfamiliar app has a reproducible defect. What is the first useful maintenance step?
    options:
    - Rewrite the entire app immediately
    - Reproduce the defect and identify a failing check
    - Upgrade every dependency at once
    - Remove the affected feature without evidence
    notes: Answer B. the sixteen models reviewed as one map, from device constraints to the evaluation method.
