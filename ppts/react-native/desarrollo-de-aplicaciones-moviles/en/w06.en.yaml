- quiz:
    eyebrow: Quick check
    question: A new row is inserted at the start of a list. Which key preserves record identity?
    options:
    - A stable unique record identifier
    - The current screen position
    - A random key on every render
    - The row index
    notes: Answer A. navigation is state, a stack of destinations plus tabs and modals that the user, the app or a URL can change. Lists recycle rows, so every row needs a stable identity.
