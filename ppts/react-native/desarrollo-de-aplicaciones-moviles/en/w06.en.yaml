- code:
    eyebrow: React Native
    title: Example 1 · 1/2
    filename: w06-sample-1.tsx
    lang: tsx
    source: |
      <FlatList
        data={reports}
        keyExtractor={r => r.id}
        renderItem={({ item }) => (
          <Link href={`/report/${item.id}`} asChild>
            <Pressable>
              <ReportCard title={item.title}
                          category={item.category} />
            </Pressable>
          </Link>
        )}
      />
    annotations:
    - label: Context
      text: Fragment of the sample file. Keep the types and imports supplied by its context.
