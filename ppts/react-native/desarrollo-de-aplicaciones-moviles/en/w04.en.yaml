- code:
    eyebrow: React Native
    title: Example 1
    filename: w04-sample-1.tsx
    lang: tsx
    source: |
      type Props = { title: string; category: string };

      export function ReportCard({ title, category }: Props) {
        return (
          <View style={styles.card}>
            <Text style={styles.title}>{title}</Text>
            <Text style={styles.chip}>{category}</Text>
          </View>
        );
      }
    annotations:
    - label: Context
      text: Fragment of the sample file. Keep the types and imports supplied by its context.
    - label: Check
      text: Explain inputs, state and the expected result.
    notes: |-
      Sample source: React Native realization from the course synthesis. Continuation cards form one sample in order. This is a teaching excerpt, not a complete app. See the full source sample under labs/samples/.
      https://reactnative.dev/docs/getting-started
- quiz:
    eyebrow: Quick check
    question: What describes a declarative view?
    options:
    - A database table
    - A fixed screenshot
    - A description derived from current inputs and state
    - A sequence of manual drawing commands only
    notes: Answer C. UI = f(state). You describe the screen for the current data and the framework works out the changes. Screens are trees of small composable pieces.
