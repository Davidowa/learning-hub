  - divider:
      eyebrow: Block 01
      title: What a single line can do
      lede: Four kinds of statement, and between them they build any program of the term.
      block: 1

  - table:
      eyebrow: Block 01 · Statements
      title: The four kinds, and when each is used
      headers: [Kind, What it does, Example]
      rows:
        - ["Assignment", "Stores a value under a name", "clicks = 5074"]
        - ["Input", "Brings a value in from outside", "channel = input('Channel: ')"]
        - ["Output", "Shows a result", "print(cost_per_click)"]
        - ["Control", "Decides or repeats, and arrives next week", "if, else, while, for"]

  - concept:
      eyebrow: Key concept
      title: A program is input, process and output
      lead: >-
        The whole structure fits in three parts. First the data is obtained, whether from
        the keyboard, from a file, or written into the code itself. Then the results are
        computed. At the end they are shown. When a program misbehaves, the first useful
        question is which of the three parts broke.
      panel:
        label: Why separate them
        title: A program that mixes all three is one you cannot test
        note: >-
          If the calculation is tangled up with the prints, you cannot check a number
          without running everything again and reading the screen.
      steps:
        - text: Input, you obtain the data
        - text: Process, you compute what matters
        - text: Output, you present it readably
          loop: ↺ and each part is checked on its own

  - divider:
      eyebrow: Block 02
      title: Getting data in
      lede: Everything that arrives from outside arrives as text. No exceptions, and no warning.
      block: 2

  - code:
      eyebrow: Block 02 · input
      title: Reading three campaign values
      filename: capture.py
      source: |
        channel = input("Campaign channel: ")
        clicks = int(input("Clicks recorded: "))
        spend = float(input("Spend in pesos: "))

        cost_per_click = spend / clicks

        print(channel, cost_per_click)
      annotations:
        - label: The prompt
          text: Whatever goes inside input is shown before it waits. Without it the program looks frozen.
        - label: The conversion
          text: int and float wrap around the input. The channel is not converted because it is already text.
        - label: The order
          text: The program stops at every input until somebody types something and presses Enter.
        - label: Risk
          text: If the user types "five thousand", int raises ValueError and the program stops right there.
          accent: true

  - code_output:
      eyebrow: Block 02 · Session
      title: What it looks like when it runs
      filename: capture.py
      source: |
        channel = input("Campaign channel: ")
        clicks = int(input("Clicks recorded: "))
      output: |
        Campaign channel: Instagram
        Clicks recorded: 5074
        Spend in pesos: 38500
        Instagram 7.587702010248325

  - divider:
      eyebrow: Block 03
      title: Getting results out
      lede: The right number, badly presented, is a number nobody is going to use.
      block: 3

  - concept:
      eyebrow: Key concept
      title: f-strings
      lead: >-
        A string that starts with f lets you drop values into the text, wrapped in braces.
        Whatever sits inside the braces is evaluated and replaced by its result. It
        replaces joining with plus signs, which forces you to convert everything to text
        by hand and becomes unreadable the moment there are three values.
      panel:
        label: The format
        title: After the colon goes how the number should look
        note: >-
          It is the same kind of code as a spreadsheet's cell format, only written out
          instead of picked from a menu.
      steps:
        - text: The f goes before the quote
        - text: The value goes inside braces
        - text: After a colon, the format
          loop: ↺ and the original value is never modified

  - table:
      eyebrow: Block 03 · Formatting
      title: The five format codes you will use
      headers: [Code, What it does, Input, Comes out as]
      rows:
        - [":,", "Thousands separator", "148230", "148,230"]
        - [":.2f", "Two fixed decimals", "7.587702", "7.59"]
        - [":,.2f", "Thousands and two decimals", "38500", "38,500.00"]
        - [":.1%", "Percentage with one decimal", "0.0342", "3.4%"]
        - [":>10", "Right aligned in ten spaces", "5074", "      5074"]

  - code:
      eyebrow: Block 03 · In context
      title: The same report, presented
      filename: report.py
      source: |
        channel = "Instagram"
        impressions = 148230
        clicks = 5074
        spend = 38500.00

        conversion = clicks / impressions
        cpc = spend / clicks

        print(f"Channel: {channel}")
        print(f"Impressions: {impressions:,}")
        print(f"Conversion: {conversion:.2%}")
        print(f"Cost per click: ${cpc:,.2f}")
      annotations:
        - label: The braces
          text: Inside them you can put a variable or a whole expression, like clicks / impressions.
        - label: The format
          text: It goes after the colon and it does not change the value, only how that line displays it.
        - label: The units
          text: The peso sign is fixed text inside the string. So is the label in front of it.
        - label: The arithmetic
          text: 5074 over 148230 is 0.03423, and the percentage code already multiplies it by a hundred.

  - code_output:
      eyebrow: Block 03 · Result
      title: A report that reads without explanation
      filename: report.py
      source: |
        print(f"Impressions: {impressions:,}")
        print(f"Conversion: {conversion:.2%}")
        print(f"Cost per click: ${cpc:,.2f}")
      output: |
        Channel: Instagram
        Impressions: 148,230
        Conversion: 3.42%
        Cost per click: $7.59

  - compare:
      eyebrow: Block 03 · The difference
      title: The same number, with and without formatting
      before:
        label: Unformatted
        file: raw.py
        code: |
          print("Conversion:", conversion)
          print("Cost:", cpc)
      after:
        label: With an f-string
        file: report.py
        code: |
          print(f"Conversion: {conversion:.2%}")
          print(f"Cost per click: ${cpc:,.2f}")
      note: >-
        The first prints 0.034230587600350804 and 7.587702010248325. Both numbers are
        correct, and neither of them belongs in a report.

  - pitfalls:
      eyebrow: Block 03 · Common errors
      title: Four input and output errors
      items:
        - label: Error 01
          title: Forgetting the f
          desc: Without it the string prints the braces literally. It is not an error, it is silently useless output.
        - label: Error 02
          title: Converting after the arithmetic
          desc: int wraps the input, not the result. Converting late does not undo the wrong addition.
        - label: Error 03
          title: An input with no prompt
          desc: The program sits waiting on a blank screen and looks like it has hung.
        - label: Error 04
          title: Printing with no label or unit
          desc: A bare 7.59 does not say whether it is pesos, clicks or days. Whoever reads it will ask.

  - quiz:
      eyebrow: Quick check
      question: What does this line print?
      filename: formatting.py
      source: |
        rate = 0.0342

        print(f"Conversion: {rate:.1%}")
      options:
        - "Conversion: 0.0%"
        - "Conversion: 3.4%"
        - "Conversion: 0.034%"
        - "Conversion: 34.2%"

  - lab:
      eyebrow: Lab
      title: A report you could actually send
      brief: Write a program that asks for the campaign name, the impressions, the clicks and the spend from the keyboard, and prints a five-line report with thousands, percentage and currency symbol wherever they belong.
      blocks:
        - label: Deliverable
          text: The .py file and a screenshot of the formatted output
        - label: Constraint
          text: No joining with plus signs. f-strings only.
        - label: The test
          text: Show it to somebody who did not take the class. If they ask what a number is, a label is missing.

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: Input, process and output
          desc: Keeping the three parts apart is what later lets you find which one the program broke in
        - title: input always returns text
          desc: Converting is your responsibility, and doing it late does not fix the arithmetic already done
        - title: Formatting is part of the result
          desc: A correct 0.03423 and a correct 3.42% are not worth the same to whoever receives the report

  - homework:
      eyebrow: Homework
      title: Submission and grading criteria
      brief: Extend the lab report so it also computes the cost per thousand impressions and the daily spend assuming a thirty-day campaign, and line the four metrics up in a column.
      meta:
        - [Due, Before week 6]
        - [Format, Blackboard · .py]
        - [Weight, Part of the 20 % for assignments]
      rubric:
        - ["Formatting", "40 %", "Thousands, decimals and percentage applied where they belong"]
        - ["Calculations", "40 %", "All four metrics are correct"]
        - ["Readability", "20 %", "Labels and units let somebody read it without asking"]

