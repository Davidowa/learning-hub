        - label: Constraint
          text: The third call has to pass one argument by keyword while skipping another
        - label: The test
          text: The call without optional arguments has to give exactly the number it gave last week

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: The optional ones go last
          desc: A defaulted parameter before an undefaulted one is a syntax error, not a matter of style
        - title: Naming the argument reads better
          desc: Once a function passes three parameters, counting positions stops being workable
        - title: import is the door to everything
          desc: What brings in statistics today is exactly what will bring in pandas in week 15

