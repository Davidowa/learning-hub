  - code_output:
      eyebrow: Block 02 · Over a list
      title: Five questions, five functions
      filename: builtins.py
      source: |
        payments = [9038.10, 6344.53, 7220.66,
                    4180.25, 11902.44]

        print(len(payments), round(sum(payments), 2))
        print(max(payments), min(payments))
        print(sorted(payments)[0])
      output: |
        5 38685.98
        11902.44 4180.25
        4180.25

  - divider:
      eyebrow: Block 03
      title: Modules
      lede: Tools that exist, are not loaded, and arrive in one line. It is the same door pandas comes through.
      block: 3

  - concept:
      eyebrow: Key concept
      title: A module is a file full of functions
      lead: >-
        Python ships with hundreds of functions it does not load up front, because loading
        all of them would slow every program down. They are grouped by subject into
        modules, and import brings them in when you need them. The standard library comes
        with the installation, so importing from it downloads nothing.
      panel:
        label: What this opens
        title: pandas is imported in exactly the same way
        note: >-
          The difference is that pandas does not ship with Python and has to be installed
          once. The import, and the idea behind it, are identical.
      steps:
        - text: The module exists but is not loaded
        - text: import brings it into the program
        - text: Its functions become available
          loop: ↺ and the import always goes at the top of the file

  - table:
      eyebrow: Block 03 · The course modules
      title: The five modules you will import
      headers: [Module, What it is for, When it arrives]
      rows:
        - ["statistics", "Mean, median, mode", "Today"]
        - ["math", "Roots, powers, rounding", "Today"]
        - ["datetime", "Dates and the gaps between them", "Week 14"]
        - ["csv", "Reading and writing data files", "Week 14"]
        - ["pandas", "Whole tables, and not included", "Week 15"]

  - compare:
      eyebrow: Block 03 · The two forms
      title: Bring the module, or bring the function
      before:
        label: The whole module
        file: module.py
        code: |
          import statistics

          average = statistics.mean(payments)
          middle = statistics.median(payments)
      after:
        label: Only what you use
        file: function.py
        code: |
          from statistics import mean, median

          average = mean(payments)
          middle = median(payments)
      note: >-
        The left one makes it obvious where each function came from, which is why it is
        preferred once you import from several modules. The right one is less typing.

  - code_output:
      eyebrow: Block 03 · In context
      title: Mean and median do not say the same thing
      filename: summary.py
      source: |
        from statistics import mean, median

        print(round(mean(payments), 2))
        print(median(payments))
      output: |
        7737.2
        7220.66

  - pitfalls:
      eyebrow: Block 03 · Common errors
      title: Four argument and module errors
      items:
        - label: Error 01
          title: Putting the optional before the required
          desc: Python rejects it with SyntaxError as it reads the file. Defaulted parameters go last.
        - label: Error 02
          title: Skipping a parameter without naming it
          desc: Omit one in the middle and the next value lands in the wrong slot, with no warning at all.
        - label: Error 03
          title: Importing inside a function
          desc: It works, and it hides the dependency. The import goes at the top, where a reader finds it.
        - label: Error 04
          title: Naming your file after a module
          desc: A file called math.py makes import math bring in yours, and the resulting error makes no sense.

  - quiz:
      eyebrow: Quick check
      question: What does the second call print?
      filename: defaults.py
      source: |
        def total(base, tax=0.16, shipping=0):
            return base * (1 + tax) + shipping


        print(total(1000))
        print(total(1000, 50))
      options:
        - "1160.0 and 1210.0"
        - "1160.0 and 51000"
        - "1160.0 and an error, arguments missing"
        - "1160.0 and 1050.0"

