  - divider:
      eyebrow: Block 01
      title: How arguments get passed
      lede: Three ways, and the difference between them shows up once a function has more than three parameters.
      block: 1

  - table:
      eyebrow: Block 01 · Ways
      title: The three ways to pass an argument
      headers: [Way, How it looks, When it suits]
      rows:
        - ["By position", "f(250000, 0.18, 36)", "Two or three obvious values"]
        - ["By keyword", "f(principal=250000, months=36)", "When there are many or they are unclear"]
        - ["By default", "def f(insurance=0.0)", "What nearly always has the same value"]

  - code:
      eyebrow: Block 01 · In context
      title: A loan with optional costs
      filename: loan.py
      source: |
        def monthly_payment(principal, annual_rate, months,
                            fee=0.0, insurance=0.0):
            i = annual_rate / 12
            factor = (1 + i) ** months
            base = principal * (i * factor) / (factor - 1)

            return base + principal * fee / months + insurance


        print(monthly_payment(250000, 0.18, 36))
        print(monthly_payment(250000, 0.18, 36, insurance=350))
      annotations:
        - label: The required ones
          text: The first three have no default, so they have to be supplied every time.
        - label: The optional ones
          text: fee and insurance are zero unless you mention them. The short call still works.
        - label: By keyword
          text: The second call skips fee and names insurance. Without the name it would have to pass both.
        - label: Risk
          text: A parameter with a default before one without is a SyntaxError. Optional ones go last.
          accent: true

  - code_output:
      eyebrow: Block 01 · Result
      title: The same function, with and without the extras
      filename: loan.py
      source: |
        print(monthly_payment(250000, 0.18, 36))
        print(monthly_payment(250000, 0.18, 36, insurance=350))
      output: |
        9038.098883979254
        9388.098883979254

