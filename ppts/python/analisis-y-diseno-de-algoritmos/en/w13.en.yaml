  - quiz:
      eyebrow: Quick check
      question: What does the last line print?
      filename: keys.py
      source: |
        counts = {"North": 3, "South": 1}
        counts["North"] = 5
        counts["East"] = 2

        print(len(counts))
      options:
        - "4, because two entries were added"
        - "3, because North already existed and was overwritten"
        - "2, because a dictionary does not grow"
        - "An error, because East did not exist"

  - lab:
      eyebrow: Lab
      title: A catalogue from your own field
      brief: Build a dictionary that translates a code from your discipline into its description or its value, with at least six entries. Walk it printing the table, and use a set to count how many distinct values it holds.
      blocks:
        - label: Deliverable
          text: The .py file with the printed table and the count of distinct values
        - label: Constraint
          text: The lookup has to use get with a default, not square brackets
        - label: The test
          text: Look up a key that does not exist. The program has to keep running.

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: A dictionary is a VLOOKUP
          desc: The key, the value, and no column number three. In week 15 this is what groupby does inside
        - title: get does not crash
          desc: Square brackets raise KeyError on a missing key, and get hands back whatever you decide
        - title: A set drops duplicates on its own
          desc: One line replaces the loop with a helper list that almost everyone writes the first time

  - homework:
      eyebrow: Homework
      title: Submission and grading criteria
      brief: Using the campaign lists from the course, build a dictionary from channel to spend, compute the total from values, and print which channels appear this year and not last, using sets.
      meta:
        - [Due, Before week 14]
        - [Format, Blackboard · .py]
        - [Weight, Part of the 20 % for assignments]
      rubric:
        - ["Dictionary", "40 %", "It is built from the lists, not typed out by hand"]
        - ["Total", "30 %", "The total comes from values, not from walking the lists again"]
        - ["Sets", "30 %", "The comparison uses a set operation, not a loop with an if"]

