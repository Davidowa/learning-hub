  - divider:
      eyebrow: Block 01
      title: The dictionary
      lede: A two-column table where the first column is unique. It is what VLOOKUP looks up, without column number three.
      block: 1

  - compare:
      eyebrow: Block 01 · Translation
      title: VLOOKUP, said in Python
      before:
        label: In the sheet
        file: rates.xlsx
        lang: excel
        code: |
          =VLOOKUP(B2, Catalogue, 2, FALSE)
      after:
        label: In Python
        file: rates.py
        code: |
          rates = {"AAA": 0.12, "AA": 0.18,
                   "A": 0.24, "B": 0.32}

          rate = rates["AA"]
      note: >-
        VLOOKUP asks for the range, the column number and the exact-match flag. The
        dictionary asks for the key and nothing else. Column three does not exist.

  - code:
      eyebrow: Block 01 · In context
      title: The rate each credit grade earns
      filename: rates.py
      source: |
        rates = {"AAA": 0.12, "AA": 0.18,
                 "A": 0.24, "B": 0.32}

        print(rates["AA"])
        print(rates.get("C"))
        print(rates.get("C", 0.40))
      annotations:
        - label: Key and value
          text: The key sits left of the colon, the value right of it. Keys never repeat.
        - label: Direct access
          text: With square brackets, just like a list, except the index is the key instead of a number.
        - label: get
          text: It returns None when the key is missing instead of crashing. And it takes a default.
        - label: Risk
          text: rates["C"] with a key that does not exist raises KeyError and stops the program right there.
          accent: true

  - code_output:
      eyebrow: Block 01 · Result
      title: The three lookups
      filename: rates.py
      source: |
        print(rates["AA"])
        print(rates.get("C"))
        print(rates.get("C", 0.40))
      output: |
        0.18
        None
        0.4

  - table:
      eyebrow: Block 01 · Walking it
      title: The three ways to walk a dictionary
      headers: [Method, What it hands you, When it is used]
      rows:
        - ["keys", "Only the keys", "When knowing which exist is enough"]
        - ["values", "Only the values", "To add up or average"]
        - ["items", "The complete pairs", "To print the whole table"]

  - code_output:
      eyebrow: Block 01 · items
      title: The whole table, in three lines
      filename: walk.py
      source: |
        for key, value in rates.items():
            print(f"{key:<4} {value:.0%}")
      output: |
        AAA  12%
        AA   18%
        A    24%
        B    32%

  - divider:
      eyebrow: Block 02
      title: The set
      lede: Distinct values, no duplicates and no order. It is dropping duplicates in one line.
      block: 2

  - code_output:
      eyebrow: Block 02 · Duplicates
      title: How many regions there actually are
      filename: regions.py
      source: |
        regions = ["North", "Centre", "North",
                   "South", "Centre", "North"]

        unique = set(regions)

        print(sorted(unique))
        print(len(unique), "of", len(regions))
      output: |
        ['Centre', 'North', 'South']
        3 of 6

  - table:
      eyebrow: Block 02 · Operations
      title: The four set operations
      headers: [Operation, Symbol, What it returns]
      rows:
        - ["Union", "|", "Whatever is in either of the two"]
        - ["Intersection", "&", "Only what is in both of them"]
        - ["Difference", "-", "What the first has and the second does not"]
        - ["Symmetric difference", "^", "What is in one but not in both"]

  - code_output:
      eyebrow: Block 02 · In context
      title: This year's regions against last year's
      filename: compare.py
      source: |
        this_year = {"North", "Centre", "South"}
        last_year = {"Centre", "South", "East"}

        print(sorted(this_year & last_year))
        print(sorted(this_year - last_year))
        print(sorted(this_year ^ last_year))
      output: |
        ['Centre', 'South']
        ['North']
        ['East', 'North']

  - figure:
      eyebrow: Block 02 · All four
      title: The four collections, side by side
      image: img/en/collections.png
      caption: List, tuple, set and dictionary. What separates them is whether they keep order, allow duplicates, and can be changed.
      alt: Four hand-drawn containers, one for each kind of collection

  - divider:
      eyebrow: Block 03
      title: Which to use, and the midterm
      lede: Four collections and a single question that decides between them.
      block: 3

  - table:
      eyebrow: Block 03 · Decision
      title: The question that picks the collection
      headers: [If you need, Use, Why]
      rows:
        - ["Order and duplicates", "List", "It is the column of your table"]
        - ["Nobody to change it", "Tuple", "The terms of a contract"]
        - ["Distinct values", "Set", "It drops duplicates on its own"]
        - ["Lookup by key", "Dictionary", "It is VLOOKUP, and it is instant"]

  - table:
      eyebrow: Second midterm
      title: What it covers, and what the exam looks like
      headers: [Aspect, Detail]
      rows:
        - ["Content", "Units 4, 5 and 6: repetition, functions and collections"]
        - ["Weight", "20 % of the final grade"]
        - ["Format", "On the classroom computer, uploaded compressed to Blackboard"]
