  - method:
      eyebrow: How the project is marked
      title: The integrative project rubric
      statement: The code carries seventy per cent and the report thirty. And a project that does not run caps at thirty, however good the idea behind it is.
      points:
        - label: Code, 70 %
          text: Execution and functionality 35 %, algorithmic design and logic 25 %, good practice 10 %
        - label: Report, 30 %
          text: Narrative and clarity 15 %, analysis and justification 10 %, evidence well integrated 5 %
        - label: The floor
          text: A project that does not run cannot pass 30 %. It is in the syllabus and is not negotiable.

  - concept:
      eyebrow: Integrative project
      title: What is due in week 16
      lead: >-
        A complete analysis on data you choose, from your own field. It starts with a
        question, moves through loading and cleaning the file, continues with the analysis
        and ends with the charts that hold the conclusion up. It is presented in class.
      panel:
        label: How it is graded
        title: Seventy per cent the analysis, thirty the report
        note: >-
          If the notebook does not run, its maximum grade is 30 %. Grading is individual
          even when the work is done in teams.
      steps:
        - text: You choose the data and frame the question
        - text: You load it, clean it and analyse it
        - text: You present the conclusion with its charts
          loop: ↺ and you defend every decision you made

  - divider:
      eyebrow: Block 03
      title: How we work
      lede: The operating rules, the tools, and what does and does not count with artificial intelligence.
      block: 3

  - tiers:
      eyebrow: Tools
      title: What we will work with
      items:
        - key: '01'
          title: Python 3.12 or newer
          desc: Colab already ships it, so there is nothing to install. If you would rather have it on your own machine, we do that in class today.
        - key: '02'
          title: Google Colab
          desc: The environment of the course. It runs in the browser and installs nothing. VS Code and PyCharm work just as well if you prefer to work locally.
        - key: '03'
          title: Blackboard
          desc: The only submission channel. Anything sent by email is not graded.
        - key: '04'
          title: DataCamp
          desc: Institutional licence. Optional guided practice, not marked in this course.

  - steps:
      eyebrow: Operating rules
      title: What to know from today
      items:
        - label: '01'
          title: Attendance
          desc: Recorded in the first five minutes of the session
        - label: '02'
          title: Late arrival
          desc: From minute five to fifteen. Two late arrivals count as one absence.
        - label: '03'
          title: After minute sixteen
          desc: No entry to the room, and an absence is recorded
        - label: '04'
          title: Devices
          desc: Phone, headphones and AI glasses put away for the whole session
        - label: '05'
          title: Submissions
          desc: On the set date. Assignments and quizzes cannot be made up.

  - method:
      eyebrow: Honour Code
      title: What counts as your own work
      statement: You may use artificial intelligence to understand. You may not hand in code you cannot explain.
      points:
        - label: Allowed
          text: Asking it to explain an error, a concept, or a function you do not recognise
        - label: Not allowed
          text: Handing in a generated analysis you could not read line by line if I asked
        - label: How it is checked
          text: At review I ask you to explain a part of my choosing. If you cannot hold it up, the submission is zero.

  - pitfalls:
      eyebrow: Common errors
      title: Four ways to lose points by accident
      items:
        - label: Error 01
          title: Submitting by email
          desc: Blackboard is the only channel. A file that lands in my inbox is not graded, even if it arrives on time.
        - label: Error 02
          title: Zipping the executable in
          desc: The antivirus blocks the archive and the submission is lost. Delete executables before compressing.
        - label: Error 03
          title: Handing in screenshots only
          desc: The document has to contain text. Images support the code, they do not replace it.
        - label: Error 04
          title: Handing in a project that does not run
          desc: It caps at thirty per cent, however good the analysis and the report turn out to be

  - quiz:
      eyebrow: Diagnostic
      question: What does this formula return when D2 holds exactly 50000?
      filename: sheet.xlsx
      lang: excel
      source: |
        =IF(D2>50000, "target", "below")
      options:
        - '"target", because it reached the number'
        - '"below", because the condition asks for strictly greater'
        - "An error, because the equals sign is missing"
        - "It depends on the cell format"

  - lab:
      eyebrow: Lab
      title: Get the environment working
      brief: Open Google Colab, create a new notebook, write a single line that prints your name, and run it. Take a screenshot of the result.
      blocks:
