  - divider:
      eyebrow: Block 01
      title: Why this course exists
      lede: Not to turn you into programmers. So you stop depending on a tool that has already reached its ceiling.
      block: 1

  - stat:
      eyebrow: The ceiling of a spreadsheet
      value: 1,048,576
      text: is the largest number of rows a single Excel worksheet can hold.
      note: That sounds like plenty until you export a year of point-of-sale transactions, or the click log of a campaign. The file opens, and from then on every operation takes minutes. Python has no such limit, and that is only the first of three reasons.

  - concept:
      eyebrow: Key concept
      title: What a click does not leave behind
      lead: >-
        A spreadsheet stores the result. It does not store how you got there. When
        somebody asks in March why the January number came out that way, the honest answer
        is usually that you no longer remember. A script stores the whole procedure, and
        that is why the analysis can be reviewed, corrected and run again on new data.
      panel:
        label: The consequence
        title: An analysis you cannot repeat is one you cannot defend
        note: >-
          In an audit, in a board meeting or in front of a client, the question is not
          what the number was. It is how you got it.
      steps:
        - text: You write the procedure once
        - text: New data arrives the following month
        - text: You run the same file again
          loop: ↺ and the result updates without touching anything else

  - tiers:
      eyebrow: By the end of the term
      title: What you will be able to do
      items:
        - key: '01'
          title: Load and clean real data
          desc: A file exported from any system, with its blank cells, its duplicates and its numbers stored as text
        - key: '02'
          title: Answer business questions
          desc: Totals, averages, comparisons by region or by period, without opening the spreadsheet
        - key: '03'
          title: Communicate what you found
          desc: Readable charts, with the conclusion in the title and the source at the foot
        - key: '04'
          title: Repeat the work next month
          desc: Same file, new data, updated result in seconds

  - divider:
