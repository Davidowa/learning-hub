          text: A screenshot of the result, uploaded to Blackboard today
        - label: If it fails
          text: Raise your hand. If you would rather work locally, now is the moment to install it.
        - label: Hint
          text: The function is called print and the text goes in quotes

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
