  - divider:
      eyebrow: Bloque 03
      title: Módulos
      lede: Herramientas que existen, no vienen cargadas, y se traen con una línea. Es la misma puerta por la que entra pandas.
      block: 3

  - concept:
      eyebrow: Concepto clave
      title: Un módulo es un archivo de funciones
      lead: >-
        Python trae cientos de funciones que no carga de entrada, porque cargarlas todas
        haría lento cada programa. Están agrupadas por tema en módulos, y se traen con
        import cuando hacen falta. La biblioteca estándar viene con la instalación, así que
        importar de ahí no requiere descargar nada.
      panel:
        label: Lo que abre esto
        title: pandas se importa exactamente igual
        note: >-
          La diferencia es que pandas no viene con Python y hay que instalarlo una vez. El
          import, y la idea detrás, son idénticos.
      steps:
        - text: El módulo existe pero no está cargado
        - text: import lo trae al programa
        - text: Sus funciones quedan disponibles
          loop: ↺ y el import va siempre hasta arriba del archivo

  - table:
      eyebrow: Bloque 03 · Los del curso
      title: Los cinco módulos que vas a importar
      headers: [Módulo, Para qué sirve, Cuándo llega]
      rows:
        - ["statistics", "Promedio, mediana, moda", "Hoy"]
        - ["math", "Raíz, potencias, redondeos", "Hoy"]
        - ["datetime", "Fechas y diferencias entre ellas", "Semana 14"]
        - ["csv", "Leer y escribir archivos de datos", "Semana 14"]
        - ["pandas", "Tablas completas, y no viene incluido", "Semana 15"]

  - compare:
      eyebrow: Bloque 03 · Las dos formas
      title: Traer el módulo, o traer la función
      before:
        label: El módulo entero
        file: modulo.py
        code: |
          import statistics

          promedio = statistics.mean(pagos)
          medio = statistics.median(pagos)
      after:
        label: Solo lo que usas
        file: funcion.py
        code: |
          from statistics import mean, median

          promedio = mean(pagos)
          medio = median(pagos)
      note: >-
        La izquierda deja claro de dónde salió cada función, y por eso es la que se prefiere
        cuando importas de varios módulos. La derecha se escribe menos.

  - code_output:
      eyebrow: Bloque 03 · En contexto
      title: Promedio y mediana no dicen lo mismo
      filename: resumen.py
      source: |
        from statistics import mean, median

        print(round(mean(pagos), 2))
        print(median(pagos))
      output: |
        7737.2
        7220.66

  - pitfalls:
      eyebrow: Bloque 03 · Errores comunes
      title: Cuatro errores de argumentos y módulos
      items:
        - label: Error 01
          title: Poner lo opcional antes de lo obligatorio
          desc: Python lo rechaza con SyntaxError al leer el archivo. Los parámetros con valor por omisión van al final.
        - label: Error 02
          title: Saltarse un parámetro sin nombrarlo
          desc: Si omites uno de en medio, el siguiente valor cae en el lugar equivocado y nadie te avisa.
        - label: Error 03
          title: Importar dentro de una función
          desc: Funciona, y esconde la dependencia. El import va hasta arriba, donde quien lea el archivo lo encuentre.
        - label: Error 04
          title: Nombrar tu archivo como un módulo
          desc: Un archivo llamado math.py hace que import math traiga el tuyo, y el error resultante no tiene sentido.

  - quiz:
      eyebrow: Verificación rápida
      question: ¿Qué imprime la segunda llamada?
      filename: omision.py
      source: |
        def total(base, iva=0.16, envio=0):
            return base * (1 + iva) + envio


        print(total(1000))
        print(total(1000, 50))
      options:
        - "1160.0 y 1210.0"
        - "1160.0 y 51000"
        - "1160.0 y un error, faltan argumentos"
        - "1160.0 y 1050.0"

  - lab:
