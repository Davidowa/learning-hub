          text: El archivo .py con la función y las tres llamadas comentadas
        - label: Restricción
          text: La tercera llamada tiene que pasar un argumento por nombre saltándose otro
        - label: La prueba
          text: La llamada sin argumentos opcionales tiene que dar exactamente el mismo número que la semana pasada

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: Lo opcional va al final
          desc: Un parámetro con valor por omisión antes de uno sin él es un error de sintaxis, no una decisión de estilo
        - title: Nombrar el argumento se lee mejor
          desc: En cuanto la función pasa de tres parámetros, contar posiciones deja de ser viable
        - title: import es la puerta a todo
          desc: Lo que hoy trae statistics es exactamente lo que en la semana 15 va a traer pandas

