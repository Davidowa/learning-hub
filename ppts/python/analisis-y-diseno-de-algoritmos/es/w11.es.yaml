  - divider:
      eyebrow: Bloque 01
      title: Cómo se pasan los argumentos
      lede: Tres formas, y la diferencia entre ellas se nota cuando la función tiene más de tres parámetros.
      block: 1

  - table:
      eyebrow: Bloque 01 · Formas
      title: Las tres formas de pasar un argumento
      headers: [Forma, Cómo se ve, Cuándo conviene]
      rows:
        - ["Por posición", "f(250000, 0.18, 36)", "Dos o tres valores obvios"]
        - ["Por nombre", "f(capital=250000, meses=36)", "Cuando hay muchos o son ambiguos"]
        - ["Por omisión", "def f(seguro=0.0)", "Lo que casi siempre vale lo mismo"]

  - code:
      eyebrow: Bloque 01 · En contexto
      title: Un crédito con costos opcionales
      filename: credito.py
      source: |
        def pago_mensual(capital, tasa_anual, meses,
                         comision=0.0, seguro=0.0):
            i = tasa_anual / 12
            factor = (1 + i) ** meses
            base = capital * (i * factor) / (factor - 1)

            return base + capital * comision / meses + seguro


        print(pago_mensual(250000, 0.18, 36))
        print(pago_mensual(250000, 0.18, 36, seguro=350))
      annotations:
        - label: Los obligatorios
          text: Los tres primeros no tienen valor por omisión, así que hay que darlos siempre.
        - label: Los opcionales
          text: comision y seguro valen cero si no los mencionas. La llamada corta sigue funcionando.
        - label: Por nombre
          text: La segunda llamada salta comision y nombra seguro. Sin nombrarlo tendría que pasar los dos.
        - label: Riesgo
          text: Un parámetro con valor por omisión antes de uno sin él es SyntaxError. Los opcionales van al final.
          accent: true

  - code_output:
      eyebrow: Bloque 01 · Resultado
      title: La misma función, con y sin lo opcional
      filename: credito.py
      source: |
        print(pago_mensual(250000, 0.18, 36))
        print(pago_mensual(250000, 0.18, 36, seguro=350))
      output: |
        9038.098883979254
        9388.098883979254

