      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, COM101 · Semestre 2]
        - [Sesión, 1 de 17]

  - agenda:
      eyebrow: Agenda
      title: Tres bloques de trabajo
      cards:
        - title: Por qué esta materia
          desc: Qué deja de poder una hoja de cálculo y qué empieza a poder un script
        - title: Cómo se evalúa
          desc: Cinco componentes de veinte por ciento, y cómo se califica el proyecto
        - title: Cómo trabajamos
          desc: Herramientas, entregas, uso de inteligencia artificial y asistencia
        - title: El plan del semestre
