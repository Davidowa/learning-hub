  - objectives:
      eyebrow: Objetivos de la sesión
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Explicar qué resuelve esta materia
          sub: Los tres problemas concretos que una hoja de cálculo deja sin resolver
        - head: Ubicar cada evaluación en el semestre
          sub: Qué se evalúa, cuándo, cuánto pesa y qué hay que entregar
        - head: Reconocer las reglas de operación
          sub: Asistencia, entregas, dispositivos y el uso permitido de la IA
        - head: Dejar el entorno listo
          sub: Colab abierto y Blackboard funcionando, con la carpeta del semestre lista
        - head: Describir el proyecto integrador
          sub: Qué se entrega en la semana 16 y con qué criterios se califica

  - roadmap:
      eyebrow: Mapa del curso
      title: Cuatro bloques, diecisiete semanas
      phases:
        - label: 01 · Semanas 1–3
          title: Pensamiento computacional
          desc: Cómo se resuelve un problema antes de escribir una línea
          state: now
        - label: 02 · Semanas 4–9
          title: Datos y decisiones
          desc: Tipos, operadores, condiciones y repetición
          state: todo
        - label: 03 · Semanas 10–13
          title: Estructura y colecciones
          desc: Funciones, listas, tuplas, conjuntos y diccionarios
          state: todo
        - label: 04 · Semanas 14–17
          title: Datos reales
          desc: Archivos, pandas y visualización
          state: todo

  - divider:
      eyebrow: Bloque 01
      title: Por qué esta materia existe
      lede: No para convertirlos en programadores. Para que dejen de depender de una herramienta que ya alcanzó su techo.
      block: 1

  - stat:
      eyebrow: El techo de la hoja de cálculo
      value: 1,048,576
      text: es el número máximo de filas que una hoja de Excel puede contener.
      note: Suena a mucho hasta que exportas un año de transacciones de punto de venta, o el registro de clics de una campaña. El archivo abre, y a partir de ahí cada operación tarda minutos. Python no tiene ese límite, y esa es solo la primera de tres razones.

  - concept:
      eyebrow: Concepto clave
      title: Lo que un clic no deja
      lead: >-
        Una hoja de cálculo guarda el resultado. No guarda cómo llegaste a él. Si alguien
        pregunta en marzo por qué el número de enero salió así, la respuesta honesta suele
        ser que ya no te acuerdas. Un script guarda el procedimiento completo, y por eso
        el análisis se puede revisar, corregir y volver a correr con datos nuevos.
      panel:
        label: La consecuencia
        title: Un análisis que no se puede repetir no se puede defender
        note: >-
          En una auditoría, en un consejo o frente a un cliente, la pregunta no es cuál
          fue el número. Es cómo lo obtuviste.
      steps:
        - text: Escribes el procedimiento una vez
        - text: Llegan datos nuevos el mes siguiente
        - text: Vuelves a correr el mismo archivo
          loop: ↺ y el resultado se actualiza sin tocar nada más

  - tiers:
      eyebrow: Al terminar el semestre
      title: Lo que vas a poder hacer
      items:
        - key: '01'
          title: Cargar y limpiar datos reales
          desc: Un archivo exportado de cualquier sistema, con sus celdas vacías, sus duplicados y sus números guardados como texto
        - key: '02'
          title: Contestar preguntas de negocio
          desc: Totales, promedios, comparaciones por región o por periodo, sin abrir la hoja de cálculo
        - key: '03'
          title: Comunicar lo que encontraste
          desc: Gráficas legibles, con la conclusión en el título y la fuente al pie
        - key: '04'
          title: Repetir el trabajo el mes siguiente
          desc: El mismo archivo, datos nuevos, resultado actualizado en segundos

  - divider:
      eyebrow: Bloque 02
      title: Cómo se evalúa
      lede: Cinco componentes de veinte por ciento cada uno. Ninguno pesa más que otro, y no hay extras que compensen.
      block: 2

  - table:
      eyebrow: Evaluación del curso
      title: Cinco componentes, veinte por ciento cada uno
      headers: [Componente, Contenido, Momento, Peso]
      rows:
        - ["Parcial 1", "Unidades 1, 2, 3 y 4", "Semana 8", "20 %"]
        - ["Parcial 2", "Unidades 4, 5 y 6", "Semana 13", "20 %"]
        - ["Proyecto", "Análisis integrador con datos propios", "Semana 16", "20 %"]
        - ["Examen final", "Todas las unidades", "Semana 17", "20 %"]
        - ["Tareas", "Actividades fuera de clase", "Todo el curso", "20 %"]

  - method:
      eyebrow: Cómo se califica el proyecto
      title: La rúbrica del proyecto integrador
      statement: El código vale setenta por ciento y el reporte treinta. Y un proyecto que no ejecuta tiene treinta como calificación máxima, por buena que sea la idea.
      points:
        - label: Código, 70 %
          text: Ejecución y funcionalidad 35 %, diseño algorítmico y lógica 25 %, buenas prácticas 10 %
        - label: Reporte, 30 %
          text: Narrativa y claridad 15 %, análisis y justificación 10 %, evidencias bien integradas 5 %
        - label: El piso
          text: Un proyecto que no corre no pasa de 30 %. Está en el syllabus y no se negocia.

  - concept:
      eyebrow: Proyecto integrador
      title: Qué se entrega en la semana 16
      lead: >-
        Un análisis completo sobre datos que tú elijas, de tu área. Empieza con una
        pregunta, sigue con la carga y la limpieza del archivo, continúa con el análisis y
        termina con las gráficas que sostienen la conclusión. Se presenta en clase.
      panel:
        label: Cómo se califica
        title: Setenta por ciento el análisis, treinta el reporte
        note: >-
          Si el cuaderno no corre, su calificación máxima es 30 %. La evaluación es
          individual aunque el trabajo sea en equipo.
      steps:
        - text: Eliges los datos y planteas la pregunta
        - text: Los cargas, los limpias y los analizas
        - text: Presentas la conclusión con sus gráficas
          loop: ↺ y defiendes cada decisión que tomaste

  - divider:
      eyebrow: Bloque 03
      title: Cómo trabajamos
      lede: Las reglas de operación, las herramientas y lo que sí y lo que no se vale con la inteligencia artificial.
      block: 3

  - tiers:
      eyebrow: Herramientas
      title: Con qué vamos a trabajar
      items:
        - key: '01'
          title: Python 3.12 o superior
          desc: Colab ya lo trae, no hay nada que instalar. Si prefieres tenerlo en tu equipo, lo vemos hoy en clase.
        - key: '02'
          title: Google Colab
          desc: El entorno del curso. Corre en el navegador y no instala nada. VS Code y PyCharm sirven igual si prefieres trabajar local.
        - key: '03'
          title: Blackboard
          desc: Único canal de entrega. Lo que llegue por correo no se califica.
        - key: '04'
          title: DataCamp
          desc: Licencia institucional. Práctica guiada opcional, sin calificación en esta materia.

  - steps:
      eyebrow: Reglas de operación
      title: Lo que hay que saber desde hoy
      items:
        - label: '01'
          title: Asistencia
          desc: Se registra en los primeros cinco minutos de la sesión
        - label: '02'
          title: Retardo
          desc: Del minuto cinco al quince. Dos retardos equivalen a una falta.
        - label: '03'
          title: Después del minuto dieciséis
          desc: No hay acceso al aula y se registra falta
        - label: '04'
          title: Dispositivos
          desc: Teléfono, audífonos y lentes con IA guardados durante toda la sesión
        - label: '05'
          title: Entregas
          desc: En la fecha establecida. Las tareas y los quizzes no tienen reposición.

  - method:
      eyebrow: Código de Honor
      title: Qué cuenta como trabajo propio
      statement: Puedes usar inteligencia artificial para entender. No puedes entregar código que no sabes explicar.
      points:
        - label: Permitido
          text: Pedirle que te explique un error, un concepto o una función que no reconoces
        - label: No permitido
          text: Entregar un análisis generado que no puedas leer línea por línea si te lo pido
        - label: Cómo se revisa
          text: En la revisión te pido que expliques una parte a mi elección. Si no la sostienes, la entrega es cero.

  - pitfalls:
      eyebrow: Errores comunes
      title: Cuatro formas de perder puntos sin querer
      items:
        - label: Error 01
          title: Entregar por correo
          desc: Blackboard es el único canal. Un archivo que llega al correo no se califica, aunque llegue a tiempo.
        - label: Error 02
          title: Subir el ejecutable comprimido
          desc: El antivirus bloquea el archivo y la entrega se pierde. Borra los ejecutables antes de comprimir.
        - label: Error 03
          title: Entregar solo capturas de pantalla
          desc: El documento tiene que llevar texto. Las imágenes acompañan al código, no lo sustituyen.
        - label: Error 04
          title: Entregar un proyecto que no corre
          desc: Su calificación máxima es treinta por ciento, aunque el análisis y el reporte estén bien

  - quiz:
      eyebrow: Diagnóstico
      question: ¿Qué devuelve esta fórmula si D2 vale exactamente 50000?
      filename: hoja.xlsx
      lang: excel
      source: |
        =SI(D2>50000; "meta"; "abajo")
      options:
        - '"meta", porque alcanzó el número'
        - '"abajo", porque la condición pide estrictamente mayor'
        - "Un error, porque falta el signo igual"
        - "Depende del formato de la celda"

  - lab:
      eyebrow: Laboratorio
      title: Dejar el entorno listo
      brief: Abre Google Colab, crea un cuaderno nuevo, escribe una sola línea que imprima tu nombre y ejecútalo. Toma una captura del resultado.
      blocks:
        - label: Entrega
          text: Captura de pantalla del resultado, subida a Blackboard hoy mismo
        - label: Si falla
          text: Levanta la mano. Si prefieres trabajar local, este es el momento de instalarlo.
        - label: Pista
          text: La función se llama print y el texto va entre comillas

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: Esta materia no es para volverte programador
          desc: Es para que dejes de depender de una herramienta que ya alcanzó su techo de filas y de trazabilidad
        - title: Cinco componentes, veinte por ciento
          desc: Ninguno pesa más que otro, y el proyecto de la semana 16 es uno de los cinco
        - title: Puedes usar IA, y tienes que poder explicarla
          desc: La regla no es la herramienta, es que sostengas lo que entregas cuando te pregunte

  - homework:
      eyebrow: Tarea
      title: Entrega y criterios de evaluación
      brief: Deja tu entorno de trabajo listo y sube la captura de tu programa corriendo en Colab o en tu máquina, junto con el archivo.
      meta:
        - [Entrega, Antes de la siguiente sesión]
        - [Formato, Blackboard · imagen .png]
        - [Peso, Parte del 20 % de tareas]
      rubric:
        - ["Python", "60 %", "Se ve la versión de Python que estás usando y el programa corre"]
        - ["Editor", "40 %", "El cuaderno o el archivo se ve abierto en Colab, VS Code o PyCharm"]

  - closing:
      title: Preguntas
      subtitle: La siguiente sesión, el puente entre lo que ya sabes hacer en Excel y cómo se dice en Python.
      meta:
        - [Correo, descobarc@up.edu.mx]
        - [Mensajería, Google Chat institucional]
        - [Repositorio, github.com/davidowa/learning-hub]
