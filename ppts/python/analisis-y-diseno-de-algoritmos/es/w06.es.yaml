      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, COM101 · Semestre 2]
        - [Sesión, 6 de 17]

  - agenda:
      eyebrow: Agenda
      title: Tres bloques de trabajo
      cards:
        - title: Comparar
          desc: Los seis operadores que producen verdadero o falso
        - title: Decidir
          desc: if, else y la sangría que dice qué pertenece a qué rama
        - title: Varios caminos
          desc: elif, y por qué el orden en que se escriben cambia el resultado
