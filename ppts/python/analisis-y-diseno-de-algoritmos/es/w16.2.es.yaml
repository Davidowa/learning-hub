      title: Análisis y Diseño de Algoritmos
      subtitle: Las gráficas estadísticas en una línea, lo que un promedio esconde, y la entrega del proyecto integrador.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, COM101 · Semestre 2]
        - [Sesión, 16 · 2 de 2]

  - agenda:
      eyebrow: Agenda
      title: Tres bloques de trabajo
      cards:
        - title: seaborn
          desc: Le das el DataFrame y los nombres, y él agrupa por su cuenta
        - title: Lo que el promedio esconde
          desc: Caja y bigotes, y por qué dos áreas con el mismo promedio no se parecen
        - title: El proyecto
          desc: Qué se entrega, cómo se califica y qué se pregunta en la presentación
