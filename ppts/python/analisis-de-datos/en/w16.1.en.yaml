  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Choose the chart from the question
          sub: Bar, line, scatter or histogram, depending on what you are asking
        - head: Build a chart with matplotlib
          sub: With a figure and axes, and save it as an image
        - head: Title it with the finding
          sub: Not with the axis names, which the reader is already looking at
        - head: Format the axes
          sub: So nobody has to count digits on screen
        - head: Choose accessible colour
          sub: And never let colour be the only signal that separates things

