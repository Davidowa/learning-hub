slides:
  - cover:
      kicker: School of Business · 2026
      unit: Week 16 · 1 of 2 · Unit 8.2 · Visualisation and matplotlib
      title: Data Analysis
      subtitle: Which chart answers which question, and what it takes for somebody to understand it without you in the room.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, TIA502 · Business]
        - [Session, 16 · 1 of 2]
      notes: |
        The first of two visualisation sessions. This one sets the judgement; the next one
        gives speed with seaborn.

        The code is module A06, scripts 01 to 03. The images it produces land in its output
        folder and can be projected directly.

        The single thing that changes the quality of their submissions is titling with the
        finding. Nobody does it unprompted, and once they do it once they never go back.

  - agenda:
