          desc: Each shape answers a different question, and the wrong one lies
        - title: The two objects
          desc: Figure and Axes, and why every chart starts the same way
        - title: Making it readable
          desc: A title with the finding, readable axes, colour that survives greyscale
        - title: Your turn
