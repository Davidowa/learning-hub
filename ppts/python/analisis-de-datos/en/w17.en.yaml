      eyebrow: Block 01 · The chain
      title: What each topic rests on
      headers: [Topic, Rests on, It enables]
      rows:
        - ["Types and operators", "The algorithm on paper", "Any correct calculation"]
        - ["Selection", "Boolean comparisons", "Business rules"]
