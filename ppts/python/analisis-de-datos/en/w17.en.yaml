  - concept:
      eyebrow: Key concept
      title: The chain that runs through the whole course
      lead: >-
        A list is a column. A column with an index is a Series. Several paired Series are a
        DataFrame. A dictionary is a VLOOKUP, and grouping by key is what a PivotTable
        does. Every one of those sentences is the same idea seen with more tooling on top,
        which is why what you learned in week 12 still holds in week 15.
      panel:
        label: What this means for the exam
        title: pandas does not have to be memorised separately
        note: >-
          If you know what a loop with an accumulator does, you know what a groupby does.
          The syntax changes, the idea is the same.
      steps:
        - text: List, a column with positions
        - text: Series, a column with labels
        - text: DataFrame, paired columns
          loop: ↺ and groupby is the dictionary accumulating

  - divider:
      eyebrow: Block 02
      title: What costs the most
      lede: Six mistakes. Not the hardest ones, the ones that showed up in every submission of the term.
      block: 2

  - pitfalls:
      eyebrow: Block 02 · The first four
      title: The ones that change the result silently
      items:
        - label: Error 01
          title: Counting from one
          desc: The first item is index 0, and the last of a list of five is 4. Everything else shifts along.
        - label: Error 02
          title: Calculating without converting
          desc: What comes from input or a file is text. Adding it glues it together and the total is absurd.
        - label: Error 03
          title: Confusing changing with returning
          desc: sort sorts and returns None, sorted returns a new list. Storing what sort returns erases data.
        - label: Error 04
          title: Declaring the accumulator inside
          desc: It resets every pass and ends up holding the last record. The program runs and the number is wrong.

  - pitfalls:
      eyebrow: Block 02 · The two from pandas
      title: The ones that cost a whole afternoon
      items:
        - label: Error 05
          title: Chained assignment
          desc: Since pandas 3.0 it does nothing and raises nothing. Everything that writes goes through loc, in one step.
        - label: Error 06
          title: Grouping before cleaning
          desc: Eight regions where there are four. The totals split, and each half looks perfectly reasonable.

  - table:
      eyebrow: Final exam
      title: What it covers, and what it looks like
      headers: [Aspect, Detail]
      rows:
        - ["Content", "All eight units, weighted towards files, pandas and visualisation"]
        - ["Weight", "20 % of the final grade"]
        - ["Format", "On the classroom computer, uploaded compressed to Blackboard"]
        - ["You may bring", "Notes, assignments, books and anything generated with AI beforehand"]
        - ["You may not", "Phone, headphones, AI glasses or messaging"]

  - lab:
      eyebrow: Integrative exercise
      title: From file to finding, in one session
      brief: Load sales.csv, inspect it, clean it, group by region and by channel, and answer in one sentence which combination deserves attention first. Justify it with two figures.
      blocks:
        - label: The order
          text: Inspect, clean, group, conclude. Skipping the first is how you arrive at a wrong number
        - label: The trap
          text: Group before normalising the region and you will report eight regions, four of which do not exist
        - label: The answer
          text: One sentence with two figures. Not a table, not a chart. The conclusion, said out loud

  - takeaways:
      eyebrow: Summary
      title: Three ideas for the whole term
      items:
        - title: Programming is writing the procedure
          desc: Which is why the analysis can be repeated, reviewed and defended when somebody asks in March
        - title: Clean before you calculate
          desc: A wrong number never announces itself, and it always looks as reasonable as the right one
        - title: The finding goes in the title
          desc: What the reader cannot see alone is what you found, and that is the whole of your work

  - closing:
