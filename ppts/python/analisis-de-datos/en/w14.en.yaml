          text: The .py, the input CSV, and the output file it produces
        - label: Constraint
          text: No absolute paths. The program has to run on the classroom machine
        - label: The test
          text: Blank out one cell in the file. Your program has to keep running and say what it did with it

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: A file stores text
          desc: The types are yours to supply. Same lesson as week 4, now on a file with 324 rows in it
        - title: Read by column name
          desc: Counting positions breaks the moment somebody inserts a column, and nothing will warn you
        - title: What to do with what is missing is your call
          desc: Dropping, filling and ignoring give three different answers, and all three have to be defensible

