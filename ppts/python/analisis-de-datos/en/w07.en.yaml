  - divider:
      eyebrow: Block 01
      title: Combining conditions
      lede: Three operators, and between them they build any rule, however complicated it sounds said out loud.
      block: 1

  - table:
      eyebrow: Block 01 · Logical
      title: The three logical operators, in full
      headers: [Operator, What it demands, Example]
      rows:
        - ["and", "Both conditions have to be true", "conversion >= 0.03 and clicks > 1000"]
        - ["or", "At least one has to be true", "channel == 'Meta' or channel == 'Google'"]
        - ["not", "Flips the result of the condition", "not campaign_live"]

  - table:
      eyebrow: Block 01 · Truth table
      title: The four possible cases of and and or
      headers: [A, B, "A and B", "A or B"]
      rows:
        - ["True", "True", "True", "True"]
        - ["True", "False", "False", "True"]
        - ["False", "True", "False", "True"]
        - ["False", "False", "False", "False"]

  - code:
      eyebrow: Block 01 · In context
      title: A rule with two conditions
      filename: policy.py
      source: |
        conversion = 0.0342
        clicks = 5074
        channel = "Instagram"

        if conversion >= 0.03 and clicks > 1000:
            print("The campaign qualifies for more budget.")
        else:
            print("The campaign stays as it is.")
      annotations:
        - label: Both of them
          text: With and, if either one fails the whole rule fails. There is no middle ground.
        - label: Why the volume
          text: A high conversion over a hundred clicks means nothing. The second condition filters the noise.
        - label: Short circuit
          text: If the first is false, Python does not even read the second. It saves work and avoids errors.
        - label: Risk
          text: Swapping the and for an or approves campaigns with huge volume and terrible conversion.
          accent: true

  - divider:
      eyebrow: Block 02
      title: Membership and identity
      lede: Four more operators, and two of them will save you writing the same comparison five times over.
      block: 2

  - table:
      eyebrow: Block 02 · Membership and identity
      title: The four remaining operators
      headers: [Operator, Question, Example, Result]
      rows:
        - ["in", "Is it inside?", "channel in ['Meta', 'Google']", "False"]
        - ["not in", "Is it outside?", "channel not in ['TikTok']", "True"]
        - ["is", "Is it the same object?", "cost is None", "True"]
        - ["is not", "Is it another object?", "cost is not None", "False"]

  - compare:
      eyebrow: Block 02 · The difference
      title: Five comparisons, or one
      before:
        label: With or
        file: long.py
        code: |
          if (channel == "Meta" or
              channel == "Google" or
              channel == "Instagram" or
              channel == "TikTok"):
              print("Digital channel")
      after:
        label: With in
        file: short.py
        code: |
          digital = ["Meta", "Google",
                     "Instagram", "TikTok"]

          if channel in digital:
              print("Digital channel")
      note: >-
        The one on the right reads at a glance and, more importantly, the list can change
        without touching the condition. Adding a channel is adding an item.

  - code_output:
      eyebrow: Block 02 · is against ==
      title: Worth the same, and not the same object
      filename: identity.py
      source: |
        a = [1, 2, 3]
        b = [1, 2, 3]

        print(a == b)
        print(a is b)
      output: |
        True
        False

  - divider:
      eyebrow: Block 03
      title: Nesting a decision
      lede: A decision inside another. Sometimes that is right, and sometimes it is an and written the longest way possible.
      block: 3

  - concept:
      eyebrow: Key concept
      title: When to nest and when to combine
      lead: >-
        You nest when the second question only makes sense if the first one held, and when
        each branch does something different. If both inner branches end up doing the same
        thing, or if the second question could always be asked, then it was not a nesting:
        it was one condition joined with and.
      panel:
        label: The test
        title: If both branches do the same thing, it was an and
        note: >-
          It is the highest-return review you can run over your own code. It turns four
          levels of indentation into one readable line.
      steps:
        - text: The first condition decides whether you continue
        - text: Inside, the second decides what you do
        - text: Each branch does something different
          loop: ↺ and if not, collapse the two into an and

  - code:
      eyebrow: Block 03 · Nested
      title: A nesting that actually earns its place
      filename: nested.py
      source: |
        if campaign_live:
            if conversion >= 0.05:
                action = "Raise the budget"
            elif conversion >= 0.03:
                action = "Hold"
            else:
                action = "Pause and review"
        else:
            action = "Restart before evaluating"

        print(action)
      annotations:
        - label: The first question
          text: If the campaign is off, its conversion means nothing. Asking about it would be a mistake.
        - label: Three inner outcomes
          text: Each inner branch does something different, so the nesting earns something real.
        - label: The outer else
          text: It covers the whole off case, with no need to repeat the three bands inside it.
        - label: The indentation
          text: Eight spaces for the second level. Past three levels, the structure wants rethinking.

  - trace:
      eyebrow: Block 03 · Trace
      title: A paused campaign with excellent conversion
      headers: [Step, Condition, Result, action]
      rows:
        - ['1', "campaign_live", "False", '–']
        - ['2', "The whole inner block", "Not evaluated", '–']
        - ['3', "The outer else", "Runs", "Restart before evaluating"]
      verdict: The 6 % conversion is never looked at. The nesting protects it from a decision that would make no sense.

  - pitfalls:
      eyebrow: Block 03 · Common errors
      title: Four traps of compound conditions
      items:
        - label: Error 01
          title: Writing and when you meant or
          desc: Read it out loud. "Both" is and, "either one" is or. Half the errors get caught that way.
        - label: Error 02
          title: Comparing against two values at once
          desc: channel == "Meta" or "Google" does not do what it looks like. Repeat the variable, or use in.
        - label: Error 03
          title: Using is to compare values
          desc: is asks whether it is the same object in memory. For numbers and text, always use the double equals.
        - label: Error 04
          title: Nesting for no reason
          desc: Three levels of indentation are almost always two conditions joined with and and one spare branch.

  - quiz:
      eyebrow: Quick check
      question: What does this print when the channel is Instagram?
      filename: trap.py
      source: |
        channel = "Instagram"

        if channel == "Meta" or "Google":
            print("Match")
        else:
            print("No match")
      options:
        - "No match, because it is neither of the two"
        - "Match, because a non-empty string counts as true"
        - "An error, because a comparison is missing"
        - "Match, because Python compares against both"

  - lab:
      eyebrow: Lab
      title: A policy that needs two conditions
      brief: Write a rule from your own field that depends on at least two values, such as approving credit by income and tenure, or prioritising an order by amount and by customer. Use and, or and in at least once each.
      blocks:
        - label: Deliverable
          text: The .py file and a table with all four truth-table cases tested
        - label: Constraint
          text: At most two levels of indentation. If you need three, collapse with and.
        - label: The test
          text: Read it out loud to a classmate. If they have to ask "and or or", the condition is badly written.

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: and demands both, or settles for one
          desc: Reading the condition out loud catches half the errors before the program is even run
        - title: in replaces a row of ors
          desc: And it lets the list of valid values change without touching a single line of the condition
        - title: If both branches do the same, it was an and
          desc: The highest-return review you can run over your code, and it turns four levels into one

  - homework:
      eyebrow: Homework
      title: Submission and grading criteria
      brief: Take the lab policy and write it twice, once with nesting and once combining with logical operators, then explain in three lines which of the two you would rather read six months from now.
      meta:
        - [Due, Before week 8]
        - [Format, Blackboard · .py]
        - [Weight, Part of the 20 % for assignments]
      rubric:
        - ["Equivalence", "40 %", "Both versions give the same result on every case tested"]
        - ["Operators", "40 %", "and, or and in each appear at least once and are used correctly"]
        - ["Argument", "20 %", "The justification talks about readability, not personal taste"]

