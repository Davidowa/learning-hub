slides:
  - cover:
      kicker: School of Business · 2026
      unit: Week 09 · Unit 4.5 · Accumulators, flags and nested loops
      title: Data Analysis
      subtitle: The three patterns that solve almost everything done inside a loop, and what happens when one lives inside another.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, TIA502 · Business]
        - [Session, 9 of 17]
      notes: |
        The close of the data and decisions block. Everything covered today comes back in
        week 15 as a single line of pandas, and saying so today gives the practice a point.

        The accumulator, the counter and the flag are three patterns, not three topics.
        Once recognised, most exam exercises are solved by working out which of the three
        the wording is asking for.

        Run the nested loops fast. It is enough that they understand the inner one makes
        all of its passes for every pass of the outer one, and that this multiplies.

