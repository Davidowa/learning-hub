  - cover:
      kicker: School of Business · 2026
      unit: Week 12 · Unit 6 · Lists and tuples
      title: Data Analysis
      subtitle: The column of your spreadsheet, said in Python. Indices, slices, methods and the danger of copies.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, TIA502 · Business]
        - [Session, 12 of 17]
      notes: |
        The analogy of the session is direct: a list is a column. Say it early and hold on
        to it, because in week 15 a pandas Series is exactly this with an index on top.

        The methods go in two complete tables, the ones that modify and the ones that only
        ask. Telling modify-in-place from return-a-copy is what confuses most and what
        costs most in the exam.

        Demonstrate the alias against the copy live. It is counter-intuitive, reading about
        it does not land, and it is the source of bugs that look haunted.

