  - divider:
      eyebrow: Block 01
      title: A list is a column
      lede: Values in order, under one name. What separates it from a range is that a list grows and shrinks on its own.
      block: 1

  - concept:
      eyebrow: Key concept
      title: Ordered, indexed and variable in length
      lead: >-
        A list holds several values in an order it keeps, and each one is reached by its
        position. That order is what makes it a column: position 0 of the payments list
        belongs with position 0 of the customers list. Unlike a range of cells, it has no
        fixed size declared up front.
      panel:
        label: Where this leads
        title: A pandas Series is this with an index on top
        note: >-
          Everything you learn today about walking, slicing and sorting still holds in week
          15, with less typing.
      steps:
        - text: It is written in square brackets
        - text: Every value has a position
        - text: It grows and shrinks as needed
          loop: ↺ and the order is always kept

  - code:
      eyebrow: Block 01 · Indices
      title: The monthly payments on five loans
      filename: payments.py
      source: |
        payments = [9038.10, 6344.53, 7220.66,
                    4180.25, 11902.44]

        print(payments[0])
        print(payments[-1])
        print(payments[1:3])
      annotations:
        - label: The first is zero
          text: payments[0] is the first value. It is breaking point number one for anyone coming from row 1.
        - label: The negatives
          text: payments[-1] is the last, however many there are. It saves writing len minus one.
        - label: The slice
          text: From position 1 to 3, and 3 is not included. That is why it returns exactly two values.
        - label: Risk
          text: payments[5] on a list of five raises IndexError. The last valid index is 4.
          accent: true

  - code_output:
      eyebrow: Block 01 · Result
      title: What each access returns
      filename: payments.py
      source: |
        print(payments[0])
        print(payments[-1])
        print(payments[1:3])
      output: |
        9038.1
        11902.44
        [6344.53, 7220.66]

  - figure:
      eyebrow: Block 01 · The slicing rule
      title: The first is in, the second is out
      image: img/en/slicing.png
      caption: That is why a slice from 0 to 3 returns three items, and why the sizes always come out round.
      alt: A word laid out in tiles, with positive indices above and negative ones below

  - divider:
      eyebrow: Block 02
      title: The methods
      lede: Eleven of them. Six change the list, five only ask about it, and confusing the two is expensive.
      block: 2

  - table:
      eyebrow: Block 02 · Methods · 1 of 2
      title: The six that change the list
      headers: [Method, What it does, Example]
      rows:
        - ["append", "Adds one at the end", "payments.append(5500)"]
        - ["insert", "Adds one at a position", "payments.insert(0, 5500)"]
        - ["extend", "Adds another list's items", "payments.extend(more)"]
        - ["remove", "Drops the first match", "payments.remove(5500)"]
        - ["pop", "Takes one out and returns it", "last = payments.pop()"]
        - ["clear", "Drops all of them", "payments.clear()"]

  - table:
      eyebrow: Block 02 · Methods · 2 of 2
      title: The five that remain
      headers: [Method, What it does, Example]
      rows:
        - ["sort", "Sorts in place", "payments.sort()"]
        - ["reverse", "Reverses in place", "payments.reverse()"]
        - ["index", "What position it sits at", "payments.index(7220.66)"]
        - ["count", "How many times it appears", "payments.count(6344.53)"]
        - ["copy", "Returns a fresh copy", "other = payments.copy()"]

  - compare:
      eyebrow: Block 02 · The expensive distinction
      title: Sorting in place, or asking for a sorted copy
      before:
        label: sort changes it
        file: changes.py
        code: |
          payments.sort()
          # payments is now sorted
          # the original order is gone
      after:
        label: sorted returns
        file: returns.py
        code: |
          in_order = sorted(payments)
          # payments is untouched
          # in_order is a new list
      note: >-
        The method returns None and changes the list. The function leaves the list alone
        and returns another. Writing payments = payments.sort() erases your data silently.

  - divider:
      eyebrow: Block 03
      title: Copies, aliases and tuples
      lede: Two names can point at the same list. When that happens without your knowing, the bugs look haunted.
      block: 3

  - figure:
      eyebrow: Block 03 · Aliases
      title: A new name is not a new list
      image: img/en/reference-vs-copy.png
      caption: Assigning a list to another name creates a second label on the same list. Changing one changes the other.
      alt: Two labels pointing at the same box of values, against two separate boxes

  - code_output:
      eyebrow: Block 03 · Demonstration
      title: The same operation, two results
      filename: alias.py
      source: |
        a = [1, 2, 3]
        b = a
        b.append(4)
        print(a)

        c = [1, 2, 3]
        d = c.copy()
        d.append(4)
        print(c)
      output: |
        [1, 2, 3, 4]
        [1, 2, 3]

  - table:
      eyebrow: Block 03 · Tuples
      title: List and tuple, and when each is used
      headers: [Aspect, List, Tuple]
      rows:
        - ["Written with", "Square brackets", "Parentheses"]
        - ["Can it change", "Yes", "No, never"]
        - ["What it is for", "Data that grows", "Data that must not change"]
        - ["Course example", "The payments column", "The terms of a loan"]

  - code_output:
      eyebrow: Block 03 · Immutable
      title: What happens when you try to change a tuple
      filename: tuple.py
      source: |
        terms = (250000, 0.18, 36)

        print(terms[1])
        terms[0] = 300000
      output: |
        0.18
        TypeError: 'tuple' object does
        not support item assignment

  - pitfalls:
      eyebrow: Block 03 · Common errors
      title: Four list traps
      items:
        - label: Error 01
          title: Storing what sort returns
          desc: payments = payments.sort() leaves payments holding None. Your data is gone and the error surfaces later.
        - label: Error 02
          title: Copying with an equals sign
          desc: other = payments copies nothing. It makes a second name for the same list. Use copy.
        - label: Error 03
          title: Deleting while walking
          desc: Removing items inside a for shifts the positions, and the loop skips values.
        - label: Error 04
          title: Assuming remove drops them all
          desc: It drops only the first match. If the value appears three times, two remain.

  - quiz:
      eyebrow: Quick check
      question: What does the last line print?
      filename: methods.py
      source: |
        sales = [300, 100, 200]
        result = sales.sort()

        print(result)
      options:
        - "[100, 200, 300], the sorted list"
        - "None, because sort sorts and returns nothing"
        - "[300, 100, 200], unchanged"
        - "An error, because an argument is missing"

  - lab:
      eyebrow: Lab
      title: A column from your own field
      brief: >-
        Take twelve real values from your discipline as a list and answer four questions
        with methods and functions: the largest, the smallest, the top three, and the
        position of one value you choose.
      blocks:
        - label: Deliverable
          text: The .py file with all four answers printed and labelled
        - label: Constraint
          text: The original list has to be in its starting order when the program ends
        - label: The test
          text: Print the list at the start and at the end. If it changed, you used a method where a function belonged.

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: A list is a column
          desc: And in week 15 that same column will be called a Series, with an index placed on top of it
        - title: Changing is not returning
          desc: sort sorts and returns None, sorted leaves the list alone and returns another. Confusing them erases data
        - title: The equals sign does not copy
          desc: It makes a second name for the same list, and touching either one touches the only list there is

  - homework:
      eyebrow: Homework
      title: Submission and grading criteria
      brief: Using the campaign lists from week 8, produce a new list holding only those that beat the target, without modifying the original, and sort it from highest to lowest spend.
      meta:
        - [Due, Before week 13]
        - [Format, Blackboard · .py]
        - [Weight, Part of the 20 % for assignments]
      rubric:
        - ["Untouched", "40 %", "The original list keeps its order and its contents at the end"]
        - ["Filter", "40 %", "The new list holds exactly those that satisfy the condition"]
        - ["Order", "20 %", "The sort is descending and was done without destroying anything"]

