  - quiz:
      eyebrow: Quick check
      question: How many times does this print something?
      filename: passes.py
      source: |
        for i in range(2, 10, 3):
            print(i)
      options:
        - "Eight times, from 2 to 9"
        - "Three times: 2, 5 and 8"
        - "Four times: 2, 5, 8 and 11"
        - "Ten times, from 0 to 9"

  - lab:
      eyebrow: Lab
      title: Walk a table of your own
      brief: Take six records from your field as three parallel lists and walk them with a for loop, computing one metric per row and printing it aligned. Then write a while loop that counts how many exceed a threshold.
      blocks:
        - label: Deliverable
          text: The .py file with both versions and its aligned output
        - label: Constraint
          text: No repeated magic numbers. If the threshold appears twice, make it a variable.
        - label: The test
          text: Add a seventh record. If you had to touch the loop, the loop was badly written.

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: A for loop is dragging the formula
          desc: The same operation applied to every row, and it does not stop where your patience ran out
        - title: for when you know how many
          desc: And while when you only know when to stop. Choose by the question, not by habit
        - title: Something inside has to change
          desc: If the body of the while never touches the condition, the loop never ends

  - homework:
      eyebrow: Homework
      title: Submission and grading criteria
      brief: Write a program that walks the four campaigns from class and reports which has the best cost per click, which the worst, and the combined cost per click of all four together.
      meta:
        - [Due, Before week 9]
        - [Format, Blackboard · .py]
        - [Weight, Part of the 20 % for assignments]
      rubric:
        - ["The walk", "40 %", "The loop still works if a fifth campaign is added"]
        - ["The combined figure", "40 %", "It divides the total by the total, not the average of the four costs"]
        - ["Output", "20 %", "All three answers read with a label and with currency formatting"]

