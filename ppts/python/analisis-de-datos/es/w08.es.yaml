  - quiz:
      eyebrow: Verificación rápida
      question: ¿Cuántas veces se imprime algo?
      filename: vueltas.py
      source: |
        for i in range(2, 10, 3):
            print(i)
      options:
        - "Ocho veces, de 2 a 9"
        - "Tres veces: 2, 5 y 8"
        - "Cuatro veces: 2, 5, 8 y 11"
        - "Diez veces, de 0 a 9"

  - lab:
      eyebrow: Laboratorio
      title: Recorre tu propia tabla
      brief: Toma seis registros de tu área en tres listas paralelas y recórrelos con un for, calculando una métrica por renglón e imprimiéndola alineada. Después escribe un while que cuente cuántos superan un umbral.
      blocks:
        - label: Entrega
          text: El archivo .py con las dos versiones y su salida alineada
        - label: Restricción
          text: Ningún número mágico repetido. Si el umbral aparece dos veces, hazlo variable.
        - label: La prueba
          text: Agrega un séptimo registro. Si tuviste que tocar el ciclo, el ciclo estaba mal escrito.

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: Un for es arrastrar la fórmula
          desc: La misma operación aplicada a cada fila, y sin detenerse donde se acabó tu paciencia
        - title: for cuando sabes cuántas
          desc: Y while cuando solo sabes cuándo parar. Elegir por la pregunta, no por costumbre
        - title: Algo dentro tiene que cambiar
          desc: Si el cuerpo del while no toca la condición, el ciclo no termina nunca

  - homework:
      eyebrow: Tarea
      title: Entrega y criterios de evaluación
      brief: Escribe un programa que recorra las cuatro campañas de la clase y reporte cuál tiene el mejor costo por clic, cuál el peor, y el costo por clic global de las cuatro juntas.
      meta:
        - [Entrega, Antes de la semana 9]
        - [Formato, Blackboard · .py]
        - [Peso, Parte del 20 % de tareas]
      rubric:
        - ["Recorrido", "40 %", "El ciclo funciona igual si se agrega una quinta campaña"]
        - ["Global", "40 %", "El costo global divide la suma entre la suma, no promedia los cuatro costos"]
        - ["Salida", "20 %", "Las tres respuestas se leen con etiqueta y con formato de moneda"]

