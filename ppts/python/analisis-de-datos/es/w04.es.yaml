  - divider:
      eyebrow: Bloque 01
      title: Los cinco tipos de dato
      lede: Una celda de Excel adivina su formato. Python no adivina, y esa diferencia es la mitad de los errores del semestre.
      block: 1

  - concept:
      eyebrow: Concepto clave
      title: Una variable es una celda con nombre
      lead: >-
        Guarda un valor y se le llama de alguna forma para volver a encontrarlo. La
        diferencia con una celda es doble: el nombre lo eliges tú y dice qué guarda, y el
        valor tiene un tipo que Python respeta al pie de la letra. B7 no dice nada;
        inversion_campana sí.
      panel:
        label: Lo que hay que saber
        title: El nombre no tiene tipo, el valor sí
        note: >-
          La misma variable puede guardar hoy un número y mañana un texto. Python no se
          queja en ese momento, se queja después, cuando alguien opera con ella.
      steps:
        - text: Eliges un nombre que describa el dato
        - text: Le asignas un valor con el signo igual
        - text: Python le pone el tipo al valor
          loop: ↺ cada reasignación puede cambiar ese tipo

  - table:
      eyebrow: Bloque 01 · Tipos
      title: Los cinco tipos que vas a usar todo el semestre
      headers: [Tipo, Qué guarda, Ejemplo de campaña]
      rows:
        - ["int", "Enteros, sin límite de tamaño", "impresiones = 148230"]
        - ["float", "Decimales, con precisión limitada", "tasa_conversion = 0.0342"]
        - ["str", "Texto, siempre entre comillas", "canal = 'Instagram'"]
        - ["bool", "Verdadero o falso, nada intermedio", "campana_activa = True"]
        - ["NoneType", "La ausencia de un valor", "costo_por_clic = None"]

  - code:
      eyebrow: Bloque 01 · En contexto
      title: Una campaña, con cada dato en su tipo
      filename: campana.py
      source: |
        canal = "Instagram"
        impresiones = 148230
        clics = 5074
        inversion = 38500.00
        campana_activa = True

        print(type(canal), type(impresiones))
        print(type(inversion), type(campana_activa))
      annotations:
        - label: Los nombres
          text: Cada uno dice qué guarda. Dentro de tres semanas vas a agradecerlo al releer.
        - label: type
          text: Devuelve el tipo de un valor. Sirve para verificar lo que Python entendió, no para el programa final.
        - label: El punto decimal
          text: 38500.00 es float y 38500 es int. La diferencia importa cuando divides.
        - label: Riesgo
          text: Escribir "148230" entre comillas lo vuelve texto. Sumarlo no da error, pega los dígitos.
          accent: true

  - code_output:
      eyebrow: Bloque 01 · Resultado
      title: Lo que Python entendió de cada dato
      filename: campana.py
      source: |
        print(type(canal), type(impresiones))
        print(type(inversion), type(campana_activa))
      output: |
        <class 'str'> <class 'int'>
        <class 'float'> <class 'bool'>

