      title: Los tres que Excel no tiene así
      headers: [Operador, Qué hace, Ejemplo, Resultado]
      rows:
        - ["//", "División entera", "5074 // 4", "1268"]
        - ["%", "Residuo", "5074 % 4", "2"]
        - ["**", "Potencia", "2 ** 10", "1024"]

  - table:
      eyebrow: Bloque 02 · Asignación · 1 de 2
      title: Guardar, y las cuatro abreviaturas comunes
      headers: [Operador, Equivale a, Ejemplo]
      rows:
        - ["=", "Guardar un valor", "clics = 5074"]
        - ["+=", "x = x + y", "clics += 320"]
        - ["-=", "x = x - y", "clics -= 12"]
        - ["*=", "x = x * y", "inversion *= 1.16"]
        - ["/=", "x = x / y", "inversion /= 30"]

  - table:
      eyebrow: Bloque 02 · Asignación · 2 de 2
      title: Y las tres que faltan, por completitud
      headers: [Operador, Equivale a, Ejemplo]
      rows:
        - ["//=", "x = x // y", "impresiones //= 1000"]
        - ["%=", "x = x % y", "posicion %= 7"]
        - ["**=", "x = x ** y", "base **= 2"]

  - code:
      eyebrow: Bloque 02 · Precedencia
      title: El orden en que Python resuelve una expresión
      filename: precedencia.py
      source: |
        # 1. Paréntesis   2. Potencia   3. * / // %   4. + -
        inversion = 38500
        clics = 5074

        cpc_mal = inversion / clics + 100
        cpc_bien = inversion / (clics + 100)

        print(round(cpc_mal, 2), round(cpc_bien, 2))
      annotations:
        - label: El mismo orden
          text: Es el de las matemáticas y el de Excel. Nada nuevo que memorizar.
        - label: La diferencia
          text: En la primera línea suma 100 al costo. En la segunda suma 100 a los clics. Son dos preguntas distintas.
        - label: Los paréntesis
          text: Cuestan cero y quitan toda duda. Ponlos aunque no hagan falta.
        - label: Riesgo
          text: Las dos líneas corren y dan un número. Solo una contesta lo que querías preguntar.
          accent: true

  - trace:
      eyebrow: Bloque 02 · Traza
      title: Las dos expresiones, paso a paso
      headers: [Expresión, Primero, Después, Resultado]
      rows:
        - ["inversion / clics + 100", "38500 / 5074", "7.59 + 100", "107.59"]
        - ["inversion / (clics + 100)", "5074 + 100", "38500 / 5174", "7.44"]
      verdict: Siete pesos con cuarenta y cuatro centavos por clic, o ciento siete. La diferencia es un par de paréntesis.

  - divider:
      eyebrow: Bloque 03
      title: Conversión de tipos
      lede: Python convierte solo cuando no hay duda. En cuanto la hay, te lo deja a ti.
      block: 3

  - concept:
      eyebrow: Concepto clave
      title: Implícita y explícita
      lead: >-
        Cuando sumas un entero y un decimal, Python convierte el entero a decimal por su
        cuenta, porque no hay otra lectura posible. Cuando lo que tiene es texto, se
        detiene: convertir "5074" a número es obvio para ti y ambiguo para él, porque el
        texto podría venir con espacios, comas o un símbolo de moneda.
      panel:
        label: Dónde te va a pegar
        title: Todo lo que entra por teclado o por archivo llega como texto
        note: >-
          input devuelve texto, siempre. Un CSV guarda texto, siempre. Convertir es tu
          trabajo, y olvidarlo es el error más común de las primeras semanas.
      steps:
        - text: int() convierte a entero
        - text: float() convierte a decimal
        - text: str() convierte a texto
          loop: ↺ y cada una falla si el contenido no corresponde

  - code_output:
      eyebrow: Bloque 03 · El caso clásico
      title: Sumar dos textos no suma
      filename: conversion.py
      source: |
        clics_texto = "5074"
        nuevos_texto = "320"

        print(clics_texto + nuevos_texto)
        print(int(clics_texto) + int(nuevos_texto))
      output: |
        5074320
        5394

  - pitfalls:
      eyebrow: Bloque 03 · Errores comunes
      title: Cuatro trampas de tipos que cuestan una tarde
      items:
        - label: Error 01
          title: Tratar un código postal como número
          desc: El 01000 de la Ciudad de México se vuelve 1000 en cuanto lo conviertes. Un identificador es texto, aunque tenga dígitos.
        - label: Error 02
          title: Comparar texto con número
          desc: El "5074" del archivo nunca va a ser igual al 5074 del programa. Convierte antes de comparar.
        - label: Error 03
          title: Confiar en la igualdad de decimales
          desc: 0.1 más 0.2 no es exactamente 0.3. Para dinero, compara con una tolerancia o usa enteros de centavos.
        - label: Error 04
          title: Olvidar que None no es cero
          desc: None es ausencia de dato, y sumarlo lanza TypeError. Cero es un valor medido y vale cero.

  - quiz:
      eyebrow: Verificación rápida
      question: ¿Qué imprime este programa?
      filename: division.py
      source: |
        impresiones = 148230
        anuncios = 7

        print(impresiones // anuncios)
        print(impresiones % anuncios)
      options:
        - "21175.71 y 0.71"
        - "21175 y 5"
        - "21176 y 5"
        - "Un error, porque no divide exacto"

  - lab:
      eyebrow: Laboratorio
      title: Tipa una campaña de verdad
      brief: Toma los datos de una campaña o de un reporte que hayas visto y declara al menos ocho variables con el tipo correcto. Calcula la tasa de conversión y el costo por clic, y redondea los dos a dos decimales.
      blocks:
        - label: Entrega
          text: Un archivo .py que corre e imprime las dos métricas con su etiqueta
        - label: Restricción
          text: Ningún nombre de una sola letra. El nombre tiene que decir qué guarda.
        - label: La prueba
          text: Imprime el type de cada variable. Si algo sale str y esperabas un número, ahí está el error.

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: El nombre no tiene tipo, el valor sí
          desc: Y reasignar una variable puede cambiar ese tipo sin que nada te avise en ese momento
        - title: Un identificador es texto
          desc: Códigos postales, folios y números de cliente. Que estén hechos de dígitos no los vuelve números
        - title: Los paréntesis cuestan cero
          desc: Las dos versiones corren y dan un número. Solo una contesta la pregunta que hiciste

  - homework:
      eyebrow: Tarea
      title: Entrega y criterios de evaluación
      brief: Escribe un programa que reciba por teclado el alcance, los clics y la inversión de una campaña, y calcule la tasa de conversión, el costo por clic y el costo por mil impresiones.
      meta:
        - [Entrega, Antes de la semana 5]
        - [Formato, Blackboard · .py]
        - [Peso, Parte del 20 % de tareas]
      rubric:
        - ["Conversión", "40 %", "Lo que llega de input se convierte antes de operar con ello"]
        - ["Cálculos", "40 %", "Las tres métricas son correctas y están redondeadas"]
        - ["Nombres", "20 %", "Cada variable se llama como el dato que guarda"]

  - closing:
      title: Preguntas
      subtitle: La siguiente sesión, cómo entran los datos al programa y cómo salen los resultados.
      meta:
        - [Correo, descobarc@up.edu.mx]
        - [Mensajería, Google Chat institucional]
        - [Repositorio, github.com/davidowa/learning-hub]
