      eyebrow: Bloque 02 · Aritméticos · 1 de 2
      title: Los cuatro que ya usas todos los días
      headers: [Operador, Qué hace, Ejemplo, Resultado]
      rows:
        - ["+", "Suma", "5074 + 320", "5394"]
        - ["-", "Resta", "5074 - 320", "4754"]
        - ["*", "Producto", "5074 * 2", "10148"]
        - ["/", "División decimal", "5074 / 4", "1268.5"]

  - table:
