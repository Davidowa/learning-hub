slides:
  - cover:
      kicker: Facultad de Empresariales · 2026
      unit: Semana 01 · Puente · De Excel a Python
      title: Análisis de Datos
      subtitle: Lo que ya sabes de hojas de cálculo, dicho en Python. Y los cuatro puntos donde la analogía deja de servir.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, TIA502 · Empresariales]
        - [Sesión, Puente · Semana 1]
      notes: |
        Este grupo no viene a ser programador. Viene de finanzas, mercadotecnia, negocios
        internacionales y recursos humanos, y ya sabe hacer cosas no triviales en Excel.
        La sesión existe para nombrar lo que ya saben antes de enseñarles sintaxis nueva.

        El error de arranque más caro es tratarlos como principiantes absolutos. No lo son.
        Son expertos en un lenguaje distinto. Si el bloque 01 se siente obvio, va bien.

        Los ejemplos salen de docs/en/courses/python-course/06 - Advanced: A04 lee un CSV
        a mano, A05 hace lo mismo con pandas y A06 son las gráficas. Los datos están en
        06 - Advanced/data y se regeneran con make_datasets.py desde una semilla fija, así
        que los números que digas en clase siempre van a coincidir con el archivo.

        Las ventas de esta sesión son las de ese conjunto, recortadas a seis meses para que
        quepan en una tarjeta de código. Las cuentas están verificadas.

  - agenda:
      eyebrow: Agenda
      title: Cuatro bloques de trabajo
      cards:
        - title: El diccionario
          desc: Cada cosa que ya haces en una hoja tiene un nombre en Python
        - title: Dónde se rompe
          desc: Cuatro diferencias que cuestan horas si nadie las dice a tiempo
        - title: El primer script
          desc: Doce meses de ventas resumidos sin abrir la hoja de cálculo
        - title: Tu turno
          desc: Un caso de tu área, traducido a papel antes de traducirlo a código

  - objectives:
