      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Traducir una fórmula a una expresión
          sub: Lo que escribes después del igual es casi lo mismo en los dos lados
        - head: Nombrar los datos en lugar de señalarlos
          sub: Una variable dice qué guarda; la celda B7 no dice absolutamente nada
        - head: Reconocer los cuatro quiebres
          sub: Índice cero, recálculo, tipos y el rastro que deja el trabajo
        - head: Resumir una tabla sin abrir Excel
          sub: Sumar, promediar y encontrar el máximo con cinco líneas
        - head: Explicar por qué vale la pena
          sub: Lo que una hoja de cálculo deja de poder cuando la tabla crece

  - roadmap:
      eyebrow: Mapa del curso
      title: Dónde estamos en el semestre
      phases:
        - label: 01 · Semanas 1–3
          title: Pensamiento computacional
          desc: Cómo se resuelve un problema antes de escribir una línea
          state: now
        - label: 02 · Semanas 4–9
          title: Datos y decisiones
          desc: Tipos, operadores, condiciones y repetición
          state: todo
        - label: 03 · Semanas 10–13
