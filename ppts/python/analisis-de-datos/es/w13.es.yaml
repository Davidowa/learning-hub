  - divider:
      eyebrow: Bloque 01
      title: El diccionario
      lede: Una tabla de dos columnas donde la primera es única. Es lo que buscas con BUSCARV, sin la columna número tres.
      block: 1

  - compare:
      eyebrow: Bloque 01 · Traducción
      title: BUSCARV, dicho en Python
      before:
        label: En la hoja
        file: tasas.xlsx
        lang: excel
        code: |
          =BUSCARV(B2; Catalogo; 2; FALSO)
      after:
        label: En Python
        file: tasas.py
        code: |
          tasas = {"AAA": 0.12, "AA": 0.18,
                   "A": 0.24, "B": 0.32}

          tasa = tasas["AA"]
      note: >-
        BUSCARV pide el rango, el número de columna y el modo exacto. El diccionario pide
        la llave y ya. La columna número tres no existe porque no hace falta.

  - code:
      eyebrow: Bloque 01 · En contexto
      title: La tasa que le toca a cada calificación
      filename: tasas.py
      source: |
        tasas = {"AAA": 0.12, "AA": 0.18,
                 "A": 0.24, "B": 0.32}

        print(tasas["AA"])
        print(tasas.get("C"))
        print(tasas.get("C", 0.40))
      annotations:
        - label: Llave y valor
          text: A la izquierda de los dos puntos la llave, a la derecha el valor. Las llaves no se repiten.
        - label: El acceso directo
          text: Con corchetes, igual que una lista, solo que el índice es la llave en lugar de un número.
        - label: get
          text: Devuelve None si la llave no existe, en lugar de reventar. Y admite un valor por omisión.
        - label: Riesgo
          text: tasas["C"] con una llave que no existe lanza KeyError y detiene el programa ahí mismo.
          accent: true

  - code_output:
      eyebrow: Bloque 01 · Resultado
      title: Las tres consultas
      filename: tasas.py
      source: |
        print(tasas["AA"])
        print(tasas.get("C"))
        print(tasas.get("C", 0.40))
      output: |
        0.18
        None
        0.4

  - table:
      eyebrow: Bloque 01 · Recorridos
      title: Las tres formas de recorrer un diccionario
      headers: [Método, Qué entrega, Cuándo se usa]
      rows:
        - ["keys", "Solo las llaves", "Cuando basta con saber cuáles hay"]
        - ["values", "Solo los valores", "Para sumar o promediar"]
        - ["items", "Los pares completos", "Para imprimir la tabla entera"]

  - code_output:
      eyebrow: Bloque 01 · items
      title: La tabla completa, en tres líneas
      filename: recorrido.py
      source: |
        for clave, valor in tasas.items():
            print(f"{clave:<4} {valor:.0%}")
      output: |
        AAA  12%
        AA   18%
        A    24%
        B    32%

  - divider:
      eyebrow: Bloque 02
      title: El conjunto
      lede: Valores distintos, sin repetidos y sin orden. Es quitar duplicados en una línea.
      block: 2

  - code_output:
      eyebrow: Bloque 02 · Duplicados
      title: Cuántas regiones distintas hay de verdad
      filename: regiones.py
      source: |
        regiones = ["Norte", "Centro", "Norte",
                    "Sur", "Centro", "Norte"]

        unicas = set(regiones)

        print(sorted(unicas))
        print(len(unicas), "de", len(regiones))
      output: |
        ['Centro', 'Norte', 'Sur']
        3 de 6

  - table:
      eyebrow: Bloque 02 · Operaciones
      title: Las cuatro operaciones de conjuntos
      headers: [Operación, Símbolo, Qué devuelve]
      rows:
        - ["Unión", "|", "Lo que está en cualquiera de los dos"]
        - ["Intersección", "&", "Solo lo que está en los dos"]
        - ["Diferencia", "-", "Lo del primero que no está en el segundo"]
        - ["Diferencia simétrica", "^", "Lo que está en uno pero no en ambos"]

  - code_output:
      eyebrow: Bloque 02 · En contexto
      title: Regiones de este año contra las del anterior
      filename: comparar.py
      source: |
        este = {"Norte", "Centro", "Sur"}
        pasado = {"Centro", "Sur", "Este"}

        print(sorted(este & pasado))
        print(sorted(este - pasado))
        print(sorted(este ^ pasado))
      output: |
        ['Centro', 'Sur']
        ['Norte']
        ['Este', 'Norte']

  - figure:
      eyebrow: Bloque 02 · Las cuatro
      title: Las cuatro colecciones, lado a lado
      image: img/es/collections.png
      caption: Lista, tupla, conjunto y diccionario. Lo que cambia entre ellas es si mantienen orden, si admiten repetidos y si se pueden cambiar.
      alt: Cuatro contenedores dibujados a mano, uno por cada tipo de colección

  - divider:
