  - quiz:
      eyebrow: Verificación rápida
      question: ¿Qué imprime la última línea?
      filename: llaves.py
      source: |
        conteo = {"Norte": 3, "Sur": 1}
        conteo["Norte"] = 5
        conteo["Este"] = 2

        print(len(conteo))
      options:
        - "4, porque se agregaron dos entradas"
        - "3, porque Norte ya existía y se sobreescribió"
        - "2, porque el diccionario no crece"
        - "Un error, porque Este no existía"

  - lab:
      eyebrow: Laboratorio
      title: Un catálogo de tu área
      brief: Construye un diccionario que traduzca un código de tu carrera a su descripción o a su valor, con al menos seis entradas. Recórrelo imprimiendo la tabla, y usa un conjunto para contar cuántos valores distintos tiene.
      blocks:
        - label: Entrega
          text: El archivo .py con la tabla impresa y el conteo de valores distintos
        - label: Restricción
          text: La consulta tiene que usar get con un valor por omisión, no corchetes
        - label: La prueba
          text: Consulta una llave que no existe. El programa tiene que seguir corriendo.

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: Un diccionario es un BUSCARV
          desc: La llave, el valor, y ninguna columna número tres. En la semana 15 esto es lo que hace groupby
        - title: get no revienta
          desc: Los corchetes lanzan KeyError con una llave que falta, y get devuelve lo que tú decidas
        - title: Un conjunto quita duplicados solo
          desc: Una línea reemplaza al ciclo con lista auxiliar que casi todos escriben la primera vez

  - homework:
      eyebrow: Tarea
      title: Entrega y criterios de evaluación
      brief: Con las listas de campañas del curso, arma un diccionario de canal a inversión, calcula el total con values, e imprime cuáles canales aparecen este año y no el pasado usando conjuntos.
      meta:
        - [Entrega, Antes de la semana 14]
        - [Formato, Blackboard · .py]
        - [Peso, Parte del 20 % de tareas]
      rubric:
        - ["Diccionario", "40 %", "Se construye desde las listas y no se escribe a mano"]
        - ["Suma", "30 %", "El total sale de values, no de recorrer las listas otra vez"]
        - ["Conjuntos", "30 %", "La comparación usa una operación de conjuntos, no un ciclo con if"]

  - closing:
