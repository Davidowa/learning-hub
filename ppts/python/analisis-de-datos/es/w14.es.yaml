  - divider:
      eyebrow: Bloque 01
      title: Abrir un archivo
      lede: Un archivo abierto es un recurso prestado. Hay que devolverlo, y hay una forma de que eso pase solo.
      block: 1

  - figure:
      eyebrow: Bloque 01 · El ciclo
      title: Abrir, usar, cerrar
      image: img/es/file-lifecycle.png
      caption: Tres pasos, y el tercero es el que se olvida. El bloque with lo hace por ti aunque el programa reviente a la mitad.
      alt: El ciclo de vida de un archivo dibujado a mano, de abrir a cerrar

  - code:
      eyebrow: Bloque 01 · with
      title: Leer un archivo de texto completo
      filename: leer.py
      source: |
        from pathlib import Path

        DATOS = Path(__file__).resolve().parent / "data"

        with (DATOS / "ventas.csv").open(encoding="utf-8") as f:
            primera = f.readline()

        print(primera)
      annotations:
        - label: La ruta
          text: Se arma desde la ubicación del archivo, no desde donde abriste la terminal. Así corre en cualquier máquina.
        - label: with
          text: Al salir del bloque el archivo se cierra solo, aunque una línea de adentro lance un error.
        - label: encoding
          text: utf-8 explícito. Sin él, un archivo con acentos se lee distinto en Windows y en Mac.
        - label: Riesgo
          text: Fuera del with el archivo ya está cerrado. Leerlo ahí lanza ValueError sobre un archivo cerrado.
          accent: true

  - table:
      eyebrow: Bloque 01 · Modos
      title: Los cuatro modos de apertura
      headers: [Modo, Qué hace, Si el archivo existe]
      rows:
        - ["r", "Leer, y es el modo por omisión", "Lo abre"]
        - ["w", "Escribir desde cero", "Borra todo su contenido"]
        - ["a", "Agregar al final", "Conserva lo que había"]
        - ["x", "Crear uno nuevo", "Falla con FileExistsError"]

  - divider:
      eyebrow: Bloque 02
      title: Leer un CSV
      lede: El formato que exporta cualquier hoja de cálculo y lee cualquier herramienta. Texto plano, separado por comas.
      block: 2

  - compare:
      eyebrow: Bloque 02 · Dos formas
      title: Por posición, o por nombre de columna
      before:
        label: Por posición
        file: posicion.py
        code: |
          import csv

          lector = csv.reader(f)
          encabezado = next(lector)

          for fila in lector:
              region = fila[1]
      after:
        label: Por nombre
        file: nombre.py
        code: |
          import csv

          lector = csv.DictReader(f)

          for fila in lector:
              region = fila["region"]
      note: >-
        La de la izquierda se rompe en cuanto alguien inserta una columna. La de la derecha
        usa el encabezado, y sobrevive a un archivo reordenado.

  - code:
      eyebrow: Bloque 02 · DictReader
      title: Leer el archivo de ventas por nombre
      filename: leer_csv.py
      source: |
        import csv
        from pathlib import Path

        DATOS = Path(__file__).resolve().parent / "data"

        with (DATOS / "sales.csv").open(encoding="utf-8") as f:
            filas = list(csv.DictReader(f))

        print(len(filas))
        print(filas[0]["region"], filas[0]["units"])
      annotations:
        - label: DictReader
          text: Convierte cada renglón en un diccionario, con las llaves del encabezado. Es la semana 13 aplicada.
        - label: list
          text: Sin él solo puedes recorrer una vez. Con él quedan en memoria y se pueden revisar.
        - label: El archivo real
          text: sales.csv está en el repositorio, en 06 - Advanced/data, y trae 324 renglones.
        - label: Riesgo
          text: Los 324 renglones incluyen siete duplicados y once celdas vacías. El archivo real siempre viene sucio.
          accent: true

  - code_output:
      eyebrow: Bloque 02 · Resultado
      title: Lo que devuelve, y de qué tipo
      filename: leer_csv.py
      source: |
        print(len(filas))
        print(filas[0]["region"], filas[0]["units"])
        print(type(filas[0]["units"]))
      output: |
        324
        South 15
        <class 'str'>

  - divider:
      eyebrow: Bloque 03
      title: Convertir y guardar
      lede: El archivo entrega texto. Decidir qué era cada cosa, y qué hacer con lo que falta, es trabajo tuyo.
      block: 3

  - code:
      eyebrow: Bloque 03 · Conversión
      title: De texto a número, con las celdas vacías incluidas
      filename: convertir.py
      source: |
        def a_entero(texto):
            texto = texto.strip()
            return int(texto) if texto else 0


        def a_decimal(texto):
            limpio = texto.replace("$", "").replace(",", "")
            return float(limpio.strip())
      annotations:
        - label: La celda vacía
          text: int de una cadena vacía lanza ValueError. Aquí se decide que vacío vale cero, y se deja escrito.
        - label: El símbolo
          text: 2,082.50 con signo de pesos no es un número. La coma de miles y el símbolo son formato, no valor.
        - label: Una función
          text: Cada regla de limpieza en su propia función. Así se prueba sola y se reusa en todo el archivo.
        - label: La decisión
          text: Que vacío valga cero es una decisión de negocio. Podría ser descartar el renglón, y se justifica.

  - code_output:
      eyebrow: Bloque 03 · El resumen
      title: Lo mismo que hace una tabla dinámica, a mano
      filename: resumir.py
      source: |
        for region, monto in sorted(por_region.items()):
            print(f"{region:<10}{monto:>16,.2f}")
      output: |
        Centre      3,918,978.30
        North       4,351,976.40
        South       1,553,002.85
        West        3,030,019.45

  - pitfalls:
      eyebrow: Bloque 03 · Errores comunes
      title: Cuatro errores con archivos
      items:
        - label: Error 01
          title: Abrir en modo w para leer
          desc: El modo w borra el contenido en el instante en que abre. El archivo original se pierde sin preguntar.
        - label: Error 02
          title: Rutas escritas a mano
          desc: C:\\Users\\tu_nombre\\datos.csv no corre en ninguna otra máquina. Usa pathlib y rutas relativas.
        - label: Error 03
          title: Sumar sin convertir
          desc: Los valores llegan como texto. Sumarlos concatena y el total sale absurdo sin lanzar error.
        - label: Error 04
          title: Olvidar newline al escribir
          desc: Al escribir un CSV en Windows sin newline vacío, el archivo sale con un renglón en blanco entre cada dato.

  - quiz:
      eyebrow: Verificación rápida
      question: ¿Qué pasa con el archivo al correr esta línea?
      filename: modos.py
      source: |
        with open("ventas.csv", "w") as f:
            contenido = f.read()
      options:
        - "Lee el contenido y lo guarda en la variable"
        - "Borra el archivo al abrirlo y luego falla al leer"
        - "Falla porque el archivo ya existe"
        - "Agrega una línea vacía al final"

