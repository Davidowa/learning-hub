slides:
  - cover:
      kicker: Facultad de Empresariales · 2026
      unit: Semana 02 · Tema 1 · Diseño de algoritmos
      title: Análisis de Datos
      subtitle: Cómo se resuelve un problema antes de escribir una sola línea. Algoritmos, diagramas de flujo y pseudocódigo.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, TIA502 · Empresariales]
