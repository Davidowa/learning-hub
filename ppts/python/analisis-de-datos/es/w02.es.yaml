  - objectives:
      eyebrow: Objetivos de aprendizaje
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Definir qué es un algoritmo
          sub: Y distinguirlo de una instrucción que suena clara y no lo es
        - head: Nombrar las cinco propiedades
          sub: Finito, preciso, definido, con entrada y con salida
        - head: Leer y dibujar un diagrama de flujo
          sub: Los cuatro símbolos y lo que cada uno significa
        - head: Escribir pseudocódigo
          sub: Un plan que cualquiera puede seguir, sin sintaxis de ningún lenguaje
