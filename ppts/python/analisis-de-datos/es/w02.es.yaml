  - agenda:
      eyebrow: Agenda
      title: Tres bloques de trabajo
      cards:
        - title: Qué es un algoritmo
          desc: Y por qué una instrucción cotidiana casi nunca lo es
        - title: Cómo se escribe
          desc: Diagramas de flujo para verlo, pseudocódigo para escribirlo
        - title: Cómo se ataca
