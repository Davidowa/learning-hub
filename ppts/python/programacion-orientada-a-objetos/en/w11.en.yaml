  - objectives:
      eyebrow: Learning objectives
      title: By the end of this session you will be able to…
      items:
        - head: Read a full traceback
          sub: Bottom to top, starting at the type and ending at the line that actually failed
        - head: Catch by type
          sub: One except per error you know how to handle, and none that catches the unexpected
        - head: Decide where to validate
          sub: At the point where the value enters, so the rest of the program stops asking
        - head: Define a custom exception
          sub: A class inheriting from Exception, with a name that comes from the problem

