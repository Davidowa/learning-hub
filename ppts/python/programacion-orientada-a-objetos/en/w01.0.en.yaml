        - [Format, Blackboard · .py + PNG + PDF]
        - [Weight, Part of the 20 % homework block]
      rubric:
        - ["Setup", "60 %", "The output shows Python 3.12 or newer and the sqlite3 version"]
        - ["Paragraph", "30 %", "Says something concrete about the course, not 'learn a lot'"]
        - ["Format", "10 %", "All three files, named after you, in the right assignment"]

