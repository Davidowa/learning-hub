  - divider:
      eyebrow: Block 02
      title: Tools and rules
      lede: What you need running today, and the four rules that are not negotiable.
      block: 2

  - code:
      eyebrow: Verification
      title: If this runs, your setup is ready
      filename: verify.py
      lang: python
      source: |
        import sys
        import sqlite3

        print(sys.version)
        print("sqlite:", sqlite3.sqlite_version)
      annotations:
        - label: Line 1
          text: You need Python 3.12 or newer; below that, some course syntax will not parse
        - label: Line 2
          text: sqlite3 ships with Python and we use it in the database unit
        - label: If it fails
          text: Working locally, reinstall from python.org and tick "Add Python to PATH". In the browser it is already there.
          accent: true

  - tiers:
      eyebrow: Tooling
      title: What we work with
      items:
        - key: '01'
          title: Python 3.12+
          desc: The department's reference language. The syllabus is language independent; the grading is not.
        - key: '02'
          title: VS Code, Colab or PyCharm
          desc: Any of them works. Colab runs in the browser and JetBrains gives a free education licence with your university email.
        - key: '03'
          title: Blackboard
          desc: The only submission channel. Anything sent by email is not graded.
        - key: '04'
          title: GitHub Education
          desc: Course repository with the code from every session, plus Copilot access

  - pitfalls:
      eyebrow: Submissions
      title: Four ways to lose points without writing a single bug
      items:
        - label: Rule 01
          title: Emailing your work
          desc: Blackboard is the only valid channel. An email with the .py attached counts as not submitted.
        - label: Rule 02
          title: Uploading screenshots
          desc: Hand in the source file. An image of code cannot be run or reviewed.
        - label: Rule 03
          title: Code that does not run
          desc: A project that fails to execute caps at 30 %, however good the idea behind it is.
        - label: Rule 04
          title: Submitting late
          desc: The platform closes at the stated time. There are no individual extensions.

  - method:
      eyebrow: Honour Code
      title: What counts as your own work
      statement: You may use AI to understand a concept. You may not hand in code you cannot explain.
      points:
        - label: Allowed
          text: Reading docs, asking in class, using AI to explain an error message or a concept
        - label: Not allowed
          text: Submitting generated code you cannot read line by line when I ask at your desk
        - label: How it gets caught
          text: During review I pick a function and ask you to walk through it. If it falls apart, the submission is zero.

  - divider:
      eyebrow: Block 03
      title: Diagnostic and wrap-up
      lede: A short exercise to see where we start, and what you take home for next week.
      block: 3

  - quiz:
      eyebrow: Diagnostic
      question: How many times does this program print "hello"?
      filename: diagnostic.py
      lang: python
      source: |
        counter = 0

        while counter < 3:
            print("hello")
            counter += 1

        for i in range(2):
            print("hello")
      options:
        - Three times
        - Five times
        - Six times
        - Never, the program loops forever

  - trace:
      eyebrow: Answer
      title: Five times, and the trace shows it
      headers: ["Step", "Statement", "counter", "i", "Prints"]
      rows:
        - ["1", "counter = 0", "0", "–", "0"]
        - ["2", "while 0 < 3", "1", "–", "1"]
        - ["3", "while 1 < 3", "2", "–", "2"]
        - ["4", "while 2 < 3", "3", "–", "3"]
        - ["5", "for i in range(2)", "3", "0, 1", "5"]
      verdict: The while runs three times and the for runs twice. Five prints in total.

  - quote:
      text: Programming is the art of telling another human what one wants the computer to do.
      author: Donald Knuth
      source: Literate Programming, 1984

  - takeaways:
      eyebrow: Summary
      title: Three things to take away
      items:
        - title: The paradigm hands out responsibilities
          desc: Object-oriented design is deciding which thing in the problem owns which job
        - title: The grade is settled on five dates
          desc: Weeks 8, 13, 16 and 17, plus homework running the whole semester
        - title: If you cannot explain it, do not submit it
          desc: The oral check is part of the assessment, not a threat

  - homework:
      eyebrow: Homework
      title: Submission and grading criteria
      brief: Run verify.py in whichever tool you prefer, hand in the file together with a screenshot of its output, and add a paragraph on what you want out of this course.
      meta:
