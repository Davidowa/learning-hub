  - divider:
      eyebrow: Block 01
      title: What the course is about
      lede: Before the syllabus there is a simpler question, what problem are we learning to solve.
      block: 1

  - concept:
      eyebrow: Key concept
      title: What object-oriented programming is
      lead: >-
        Organising a program around the things in the problem (a student, a loan, a shopping
        cart) instead of around the steps the machine has to run. Each thing holds its own
        data and knows how to do its own work.
      panel:
        label: The difference in one line
        title: Structured code organises steps. OOP organises responsibilities.
        note: >-
          The paradigm does not change what the computer does. It changes where each piece
          of the logic lives, so the program stays readable once it grows.
      steps:
        - text: You name the things in the problem
        - text: You decide what each one remembers
        - text: You decide what each one can do
          loop: ↺ the loop runs again every time a new requirement shows up

  - figure:
      eyebrow: Modelling
      title: Before syntax, grouping
      image: img/en/ct-02.png
      caption: Object-oriented design starts by deciding what things exist and what tells them apart
      alt: A duck sorts a heap of mixed shapes into three groups

