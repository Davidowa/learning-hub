slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Week 04 · Topic 2 · Building blocks
      title: Object-Oriented Programming
      subtitle: 'Who gets to touch what inside an object, and the three pieces that decide how it is born: modifiers, properties and constructors.'
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, COM102 · Term 2]
        - [Session, 4 of 17]
      notes: |
        The trap in this session is believing Python has private. It does not, and saying
        so plainly at the start keeps the group from trusting a protection that is not
        there. Demonstrate the double-underscore renaming live, with hasattr.

        The examples come from docs/en/courses/python-course/02 - POO/6th Module:
        Person and the private method are from Code019.py, Product with its getter and
        setter is from Code024.py, and the class attribute with classmethod is Code022.py.

  - agenda:
      eyebrow: Agenda
      title: Four working blocks
      cards:
        - title: Access modifiers
          desc: Public, protected and private, and which of the three Python enforces
        - title: Access functions
          desc: Getters, setters and the syntax that makes them disappear
        - title: Constructors
          desc: What __init__ is responsible for and what it is not
        - title: Static members
          desc: Data that belongs to the class rather than to each object

  - objectives:
      eyebrow: Learning objectives
      title: By the end of this session you will be able to…
      items:
        - head: Pick an access level for each member
          sub: One underscore is an agreement between programmers; two rename the attribute
        - head: Write a getter and a setter
          sub: And validate inside the setter, which is the only reason they earn their keep
        - head: Turn them into a property
          sub: '@property and @name.setter keep the validation and drop the parentheses'
        - head: Separate the class from the instance
          sub: What sits in the class body is shared; what goes in __init__ is not

  - roadmap:
