slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Week 15 · Topic 6 · Graphical interfaces
      title: Object-Oriented Programming
      subtitle: Who decides where each control goes, how the window meets your domain classes, and what makes an interface usable.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, COM102 · Term 2]
        - [Session, 15 of 17]
      notes: |
        Last session before the project, so block 2 counts double. The temptation to put all
        the logic inside the slot is enormous, and it is exactly what makes a submitted
        project impossible to grade in parts.

        The examples come from docs/en/courses/python-course/05 - GUI/9th Module, in PyQt6:
        QHBoxLayout is Code039.py, QVBoxLayout is Code040.py, QGridLayout with spans is
        Code042.py, QFormLayout is Code043.py and the full form is Code044.py.

  - agenda:
      eyebrow: Agenda
      title: Four working blocks
      cards:
        - title: Containers
          desc: The widget that groups and the layout that arranges it
        - title: The four layouts
          desc: Horizontal, vertical, grid and form
        - title: Integration
          desc: Connecting the window to the classes you already wrote
        - title: Visual design
          desc: Four criteria you can check without arguing about taste

  - objectives:
      eyebrow: Learning objectives
      title: By the end of this session you will be able to…
      items:
        - head: Arrange controls with a layout
          sub: Rather than fixing coordinates, which stop working the moment the window resizes
        - head: Choose among the four layouts
          sub: By the shape of the content, nesting them when none of them is enough alone
        - head: Keep the window out of the domain
          sub: The slot reads, calls a class that knows nothing of Qt, and shows the result
        - head: Review an interface against criteria
          sub: Grouping, hierarchy, error response and the size of the click targets

  - roadmap:
      eyebrow: Course map
      title: Where we are in the semester
      phases:
        - label: 01 · Weeks 1–2
          title: Orientation and paradigms
          desc: Why OOP exists and what it was built to fix
          state: done
        - label: 02 · Weeks 3–5
