          text: The brief fits in five lines and allows exactly one reading of what is asked
        - label: Deliverable
          text: Your own brief, the other pair's solution, and a note on what turned out ambiguous
        - label: Criterion
          text: The solution runs against the test file without anyone having to edit a path

  - takeaways:
      eyebrow: Summary
      title: Three things to take away
      items:
        - title: Binary mode translates nothing
          desc: No line breaks, no accents. What sits on the disk is exactly what arrives in memory.
        - title: Random access wants equal records
          desc: If records vary in size no multiplication gives the position, and you are back to reading it all
        - title: Positions count from zero
          desc: seek(3) leaves the cursor before the fourth byte, on the same logic as a list index

