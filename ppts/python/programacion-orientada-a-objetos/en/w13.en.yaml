  - divider:
      eyebrow: Block 01
      title: Binary files
      lede: A file is a row of bytes. Text mode puts a layer on top that translates them, and sometimes that layer is in the way.
      block: 1

  - concept:
      eyebrow: Key concept
      title: The difference between reading and decoding
      lead: >-
        Every file is a row of bytes. Text mode adds a layer translating them into letters
        with an encoding and tidying the line breaks on the way past. Binary mode removes
        that layer and hands over the bytes exactly as they came off the disk.
      panel:
        label: When to remove the layer
        title: When the bytes are not letters
        note: >-
          An image, a zip or an executable has no letters inside it. Translating them into text
          breaks them, and with luck raises UnicodeDecodeError before anything gets broken.
      steps:
        - text: Text for what people read
        - text: Binary for everything else
        - text: Never mix them in one file
          loop: ↺ the mode is chosen by the contents, not by the extension

  - code:
      eyebrow: Python
      title: The first eight bytes of an image
      filename: binary.py
      lang: python
      source: |
        from pathlib import Path

        path = Path("data") / "logo.png"

        with open(path, "rb") as handle:
            header = handle.read(8)

        print(header)
        print(len(header))
      annotations:
        - label: The b in the mode
          text: rb and wb read and write raw bytes, translating neither line breaks nor accents
        - label: Line 6
          text: read(8) asks for eight bytes, not eight characters. In binary there are no characters.
        - label: Risk
          text: Opening a binary in text mode raises UnicodeDecodeError, or worse, reads rubbish quietly
          accent: true

  - table:
      eyebrow: Comparison
      title: The five differences that matter
      headers: ["Aspect", "Text mode", "Binary mode"]
      rows:
        - ["How it opens", "open(path)", "open(path, 'rb')"]
        - ["What read returns", "str", "bytes"]
        - ["Encoding", "Required in practice", "Not applicable"]
        - ["Line breaks", "Translated for you", "Left exactly as they are"]
        - ["What it is for", "Text, CSV, JSON", "Images, zips, executables"]

  - code:
      eyebrow: Archives
      title: A binary handled as though it were a folder
      filename: archiving.py
      lang: python
      source: |
        from zipfile import ZipFile
        from pathlib import Path

        folder = Path("data")

        with ZipFile("submission.zip", "w") as bundle:
            for item in folder.rglob("*.csv"):
                bundle.write(item)

        with ZipFile("submission.zip") as bundle:
            print(bundle.namelist())
      annotations:
        - label: Line 6
          text: A zip is a binary file, but zipfile treats it as a folder so you never touch the bytes
        - label: The rglob
          text: It walks the subfolders too. glob stays on the top level and goes no further.
        - label: The name
          text: Do not call the variable zip, because it covers up the zip function Python ships with

  - divider:
      eyebrow: Block 02
      title: Sequential and random access
      lede: Every open file has a cursor. Reading pushes it forward, and there is a way to put it wherever you want.
      block: 2

  - figure:
      eyebrow: Diagnosis
      title: The cursor, the read and the jump
      image: img/en/seek-tell.png
      caption: Reading moves the cursor one position at a time. seek puts it where you say, reading nothing on the way.
      alt: A file drawn as twelve numbered cells, with a jump arrow above and step arrows below

  - code:
      eyebrow: Random access
      title: Straight to the third record
      filename: records.py
      lang: python
      source: |
        SIZE = 32

        with open("records.bin", "rb") as f:
            f.seek(2 * SIZE)
            third = f.read(SIZE)
            print(f.tell())

            f.seek(0)
            first = f.read(SIZE)
      annotations:
        - label: Line 4
          text: If every record is the same size, record n starts at n times the size. That is the whole sum.
        - label: Line 6
          text: tell returns the current position of the cursor, counted in bytes from the start
        - label: Why it matters
          text: Reading record one thousand of a million costs the same as reading the first one

  - code_output:
      eyebrow: Demonstration
      title: Where the cursor lands after each operation
      filename: cursor.py
      lang: python
      output_label: Output
      source: |
        with open("records.bin", "rb") as f:
            print(f.tell())
            f.seek(64)
            print(f.tell())
            f.read(32)
            print(f.tell())
      output: |
        0
        64
        96

  - pitfalls:
      eyebrow: Diagnosis
      title: Four errors with positions and bytes
      items:
        - label: Error 01
          title: Mixing seek with text mode
          desc: In text mode seek only accepts positions that tell returned. Anything else gives odd results.
        - label: Error 02
          title: Records of varying size
          desc: If each row is a different length no sum gives the position, and access falls back to sequential
        - label: Error 03
          title: Writing a shorter record
          desc: Whatever is left of the previous record stays there. Pad it out to the fixed size.
        - label: Error 04
          title: Expecting seek to warn you
          desc: Jumping past the end and writing leaves zeros in the middle of the file, with no error at all

  - quiz:
      eyebrow: Quick question
      question: What does the last line print?
      filename: jumping.py
      lang: python
      source: |
        with open("data.bin", "wb") as f:
            f.write(b"ABCDEFGH")

        with open("data.bin", "rb") as f:
            f.seek(3)
            print(f.read(2))
      options:
        - "b'DE', because the cursor lands before the fourth letter"
        - "b'CD', because seek starts counting at one"
        - "b'ABCDEFGH', because seek does not affect read"
        - 'An error, seek does not work in binary mode'

  - trace:
      eyebrow: Answer
      title: It prints b'DE', and positions start at zero
      headers: ["Step", "Statement", "Cursor", "What it returns"]
      rows:
        - ["1", 'open("data.bin", "rb")', "0", "–"]
        - ["2", "f.seek(3)", "3", "3"]
        - ["3", "f.read(2)", "5", "b'DE'"]
        - ["4", "print(...)", "5", "b'DE'"]
      verdict: Positions count from zero, exactly like list indexes. Position 3 sits just before the fourth letter, and read(2) takes that one and the next.

