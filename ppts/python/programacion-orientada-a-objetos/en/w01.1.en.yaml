  - objectives:
      eyebrow: Learning objectives
      title: By the end of this session you will be able to…
      items:
        - head: Declare variables of the five basic types
          sub: int, float, bool, str and None, and know which one each piece of data wants
        - head: Explain what dynamic typing means
          sub: Why the name carries no type and the value does
        - head: Cut and compose text
          sub: Indexes, slices, f-strings and the methods that hand back copies
        - head: Use the seven arithmetic operators
          sub: Add, subtract, multiply, both divisions, remainder and power
        - head: Convert whatever input returns
          sub: input always hands back text, and doing arithmetic on it raises TypeError

