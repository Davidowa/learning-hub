  - pitfalls:
      eyebrow: Diagnosis
      title: The four that cost the most marks
      items:
        - label: First midterm
          title: Child constructor without super
          desc: The object is born without the parent's attributes and breaks on the first line using one
        - label: First midterm
          title: Attribute declared outside __init__
          desc: It sticks to the class and every object shares the same list or the same counter
        - label: Second midterm
          title: A file opened without with
          desc: The writes never reach disk when something fails between the open and the close
        - label: Second midterm
          title: An except with no type
          desc: It catches the unexpected, hides the real error, and leaves the submission undebuggable

  - quiz:
      eyebrow: Lightning review
      question: What does the last line print?
      filename: review.py
      lang: python
      source: |
        class Base:
            def __init__(self):
                self.items = []

        class Child(Base):
            def __init__(self):
                self.name = "x"

        c = Child()
        print(len(c.items))
      options:
        - '0, because the list was created empty'
        - 'AttributeError, items was never created'
        - 'TypeError, Child is missing arguments'
        - '1, because name was added to the list'

  - trace:
      eyebrow: Answer
      title: AttributeError, and it is the error of the semester
      headers: ["Step", "Statement", "c.name", "c.items"]
      rows:
        - ["1", "Child()", "–", "–"]
        - ["2", "Child.__init__ runs", "x", "does not exist"]
        - ["3", "Base.__init__", "never called", "does not exist"]
        - ["4", "len(c.items)", "x", "AttributeError"]
      verdict: Defining __init__ in the child replaces the parent's. The missing line is super().__init__(), and without it the Base constructor never runs at all.

  - method:
      eyebrow: How to prepare
      title: This exam is studied by typing
      statement: No question asks for a definition. Every one asks for code that runs, so the only preparation that helps is solving the labs again without looking at the solution.
      points:
        - label: What to practise
          text: One lab per unit, solved from scratch and without opening the solution file
        - label: What to review
          text: The diagnosis slides. The four errors on each one are the errors on the exam.
        - label: What not to do
          text: Rereading the concept slides. They make sense on reading and vanish on writing.

  - tiers:
      eyebrow: Rules
      title: What to know before sitting down
      items:
