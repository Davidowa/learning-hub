          title: Format
          desc: At the keyboard, one .py file per question, named as the brief specifies
        - key: '02'
          title: Materials
          desc: The course repository and the official Python documentation, open
        - key: '03'
          title: No outside help
          desc: No people and no assistants. The University Honour Code applies.
        - key: '04'
          title: Submission
          desc: Through Blackboard, within the exam window. Email submissions are not accepted.

  - takeaways:
      eyebrow: Summary
      title: Three things to take from the semester
      items:
        - title: The class describes, the object remembers
          desc: Everything else in the course leans on that distinction, the application half included
        - title: Whatever gets opened gets closed
          desc: A file, a connection and a window share one life cycle and one and the same trap
        - title: Testable code is the code that lasts
          desc: Pulling logic out of slots and loops is what lets you fix it without guessing

