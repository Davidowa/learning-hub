  - method:
      eyebrow: How to prepare
      title: The exam asks you to write classes, not describe them
      statement: If you cannot type from memory a class with a constructor, a private attribute, a property and a child that overrides a method, you do not know it yet.
      points:
        - label: What to practise
          text: The labs from weeks 4, 6 and 7, solved again without opening the solution
        - label: What to review
          text: The diagnosis slides. The four errors on each one are the errors on the exam.
        - label: What not to do
          text: Memorising definitions. No question asks for the definition of encapsulation.

  - lab:
      eyebrow: Lab
      title: A mock midterm, in pairs
      brief: Each pair writes three code questions in the style of the ones we have seen, swaps them with another pair, and grades the answers against a two-line rubric.
      blocks:
        - label: Constraints
          text: One question per unit, and none that can be answered with a definition
        - label: Deliverable
          text: The three questions, the other pair's answers and the grade with its justification
        - label: Criterion
          text: Every question has one correct answer and one trap that sounds reasonable

  - takeaways:
      eyebrow: Summary
      title: Three things to take away
      items:
        - title: Overriding changes the body, not the name
          desc: The child replaces the parent's method and the caller never learns anything changed
        - title: An abstract class declares the contract
          desc: It states which methods will exist without writing the how, and forces each child to finish it
        - title: Polymorphism deletes the type check
          desc: Adding a new class touches not one line of the code that is about to use it

  - homework:
      eyebrow: First midterm
      title: Submission and grading criteria
      brief: The exam covers units 1, 2 and 3, and is sat during this same week. It is written at the keyboard, with the course repository open and no help from anyone else.
      meta:
        - [When, Week 8]
        - [Format, Blackboard · one .py per question]
        - [Weight, 20 % of the final grade]
      rubric:
        - ["Modelling", "30 %", "The classes match the brief and respect the access levels"]
        - ["Inheritance", "30 %", "The hierarchies pass the is-a test and chain their constructors"]
        - ["Polymorphism", "25 %", "The code walks different objects without asking about their type"]
        - ["Execution", "15 %", "Every file runs and produces the output the brief asks for"]

