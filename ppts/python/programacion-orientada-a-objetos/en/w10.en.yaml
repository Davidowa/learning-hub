          desc: List, tuple, set and dictionary, and what each one answers quickly
        - title: Dynamic arrays
          desc: Why appending at the end is cheap and inserting at the front is not
        - title: Processing in memory
          desc: Filtering, transforming and grouping without writing a single file
        - title: Lab
          desc: Picking the right container for five queries

  - objectives:
      eyebrow: Learning objectives
      title: By the end of this session you will be able to…
      items:
        - head: Choose among the four collections
          sub: With three questions about order, change and how you search, in that order
        - head: Explain what a dynamic array is
          sub: Over-allocate, copy on filling up, and how that cost is spread across the calls
        - head: Filter and group in memory
          sub: List comprehensions for the simple cases and an accumulating dictionary for the rest
        - head: Tell copying from sharing
          sub: Why the equals sign leaves two names pointing at one object

  - roadmap:
