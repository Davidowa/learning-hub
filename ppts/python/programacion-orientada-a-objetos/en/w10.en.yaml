slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Week 10 · Topic 4 · Advanced functions and structures
      title: Object-Oriented Programming
      subtitle: Four ways to hold several things in one variable, how a list grows inside, and what you can do before anything touches the disk.
