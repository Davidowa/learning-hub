slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Review 4 of 5 · Module 4 · Collections
      title: Object-Oriented Programming
      subtitle: Four ways to hold several things in one variable, and when to reach for each.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, COM102 · Term 2]
        - [Session, Review 4 of 5]

  - objectives:
      eyebrow: Learning objectives
      title: By the end of this session you will be able to…
      items:
        - head: Choose between the four collections
          sub: Based on whether order matters, whether it will change, and whether duplicates are allowed
        - head: Index and walk a list
          sub: Indexes, slices and step, exactly as in strings
        - head: Use the list methods
          sub: append, insert, remove, pop, sort and reverse
        - head: Look up by key in a dictionary
          sub: And why get avoids the KeyError that stops the program
        - head: Tell copying from renaming
          sub: The equals sign does not copy a list, it gives the same list a second name

  - roadmap:
      eyebrow: Review map
      title: Five sessions, one module each
      phases:
        - label: Review 1
          title: Data and text
          desc: Variables, types, strings, numbers and input
          state: done
        - label: Review 2
          title: Decisions and loops
          desc: Comparison, logic, if, for and while
          state: done
        - label: Review 3
          title: Functions
          desc: Parameters, return values and scope
          state: done
        - label: Review 4
