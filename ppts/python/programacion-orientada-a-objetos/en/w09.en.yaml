  - agenda:
      eyebrow: Agenda
      title: Four working blocks
      cards:
        - title: Parameters
          desc: Defaults, by name, and however many arrive
        - title: Functions as values
          desc: lambda, key, and functions handed to other functions
        - title: Modularity
          desc: One function, one job, and a name that says the whole of it
        - title: Recursion
          desc: The base case, the call that closes in, and the stack that grows

  - objectives:
      eyebrow: Learning objectives
      title: By the end of this session you will be able to…
      items:
        - head: Design a function signature
          sub: What goes positional, what carries a default, and what is better demanded by name
        - head: Pass a function as an argument
          sub: Write a sort criterion with lambda and know when to give it a name of its own
        - head: Split a script into functions
          sub: Separate what computes from what prints, so the first part can be tested
        - head: Write a recursive function
          sub: With a base case that cuts and a call that closes in on it every step

  - roadmap:
      eyebrow: Course map
      title: Where we are in the semester
      phases:
        - label: 01 · Weeks 1–2
          title: Orientation and paradigms
          desc: Why OOP exists and what it was built to fix
          state: done
        - label: 02 · Weeks 3–5
          title: Building blocks
          desc: Classes, objects, attributes, methods and properties
          state: done
        - label: 03 · Weeks 6–8
          title: Core properties
          desc: Encapsulation, inheritance, polymorphism and interfaces
          state: done
        - label: 04 · Weeks 9–17
