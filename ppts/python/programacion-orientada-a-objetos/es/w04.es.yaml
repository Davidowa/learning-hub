  - objectives:
      eyebrow: Objetivos de aprendizaje
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Elegir el nivel de acceso de cada miembro
          sub: Un guion bajo es un acuerdo entre programadores; dos cambian el nombre del atributo
        - head: Escribir un getter y un setter
          sub: Y validar dentro del setter, que es la única razón por la que valen la pena
        - head: Convertirlos en una propiedad
          sub: '@property y @nombre.setter conservan la validación y quitan los paréntesis'
        - head: Separar la clase de la instancia
          sub: Lo que se declara en el cuerpo de la clase se comparte; lo que va en __init__ no

