        - ["Buscar un registro", "Lee todo el archivo", "Contesta sin leer todo"]
        - ["Filtrar y ordenar", "Lo programas tú", "Va en la consulta"]
        - ["Dos programas a la vez", "Se pisan", "El motor lo resuelve"]
        - ["Cambiar el formato", "Reescribes el archivo", "Alteras la tabla"]

  - divider:
      eyebrow: Bloque 02
      title: Acceso y consultas
      lede: Una conexión se abre, se usa y se cierra. Es el mismo ciclo de vida de un archivo, con una trampa extra que se llama commit.
      block: 2

  - code:
      eyebrow: sqlite3
      title: Crear la tabla y meter los primeros datos
      filename: crear.py
      lang: python
      source: |
        import sqlite3
        from pathlib import Path

        ruta = Path("datos") / "peliculas.db"

        with sqlite3.connect(ruta) as conexion:
            conexion.execute(
                "CREATE TABLE IF NOT EXISTS Peliculas ("
                "id INTEGER PRIMARY KEY, titulo TEXT NOT NULL)")
            conexion.execute(
                "INSERT INTO Peliculas VALUES (?, ?)", (1, "Coco"))
            conexion.commit()
      annotations:
        - label: Línea 6
          text: El with cierra la conexión al salir, igual que hace con un archivo abierto
        - label: Línea 11
          text: Los signos de interrogación son marcadores. Los valores viajan aparte, en una tupla.
        - label: Riesgo
          text: Sin commit, lo insertado se pierde al cerrar. El with no lo hace por ti.
          accent: true

  - code_output:
      eyebrow: Consultar
      title: El cursor entrega una fila a la vez
      filename: consultar.py
      lang: python
      output_label: Salida
      source: |
        with sqlite3.connect(ruta) as conexion:
            cursor = conexion.execute(
                "SELECT id, titulo FROM Peliculas ORDER BY titulo")
            for fila in cursor:
                print(fila)
      output: |
        (19, 'Coco')
        (15, 'Inside Out')
        (10, 'Up')

  - code:
      eyebrow: Parámetros
      title: Por qué nunca se pega el dato dentro de la consulta
      filename: parametros.py
      lang: python
      source: |
        buscado = input("Título: ")

        # Nunca hagas esto
        malo = f"SELECT * FROM Peliculas WHERE titulo = '{buscado}'"

        # Haz esto
        with sqlite3.connect(ruta) as conexion:
            cursor = conexion.execute(
                "SELECT * FROM Peliculas WHERE titulo = ?", (buscado,))
            print(cursor.fetchall())
      annotations:
        - label: Línea 4
          text: Si alguien teclea una comilla, la consulta cambia de forma y hace algo que no querías
        - label: Línea 9
          text: Con el marcador, el valor nunca se interpreta como SQL. Es un dato y se queda como dato.
        - label: La coma
          text: '(buscado,) con coma es una tupla de uno. Sin la coma es solo un paréntesis.'

  - pitfalls:
      eyebrow: Diagnóstico
      title: Cuatro errores con bases de datos
      items:
        - label: Error 01
          title: Olvidar el commit
          desc: Los INSERT corren, el programa no se queja, y al volver a abrir la base no hay nada
        - label: Error 02
          title: Pegar valores con f-strings
          desc: Una comilla en el dato rompe la consulta, y a propósito la convierte en otra distinta
        - label: Error 03
          title: SQL repartido por toda la ventana
          desc: Si cada slot escribe su propio SELECT, cambiar una columna obliga a revisar el proyecto entero
        - label: Error 04
          title: Guardar el cursor para después
          desc: Al cerrarse la conexión el cursor deja de servir, y el error aparece lejos de donde se causó

  - divider:
      eyebrow: Bloque 03
      title: Proyecto integrador
      lede: La entrega que junta las siete unidades. Se califica el código y el reporte, y el código pesa más del doble.
      block: 3

