      block: 1

  - concept:
      eyebrow: Concepto clave
      title: Qué resuelve una tabla que un archivo no
      lead: >-
        En un archivo, buscar significa leerlo entero. En una tabla, buscar significa
        preguntar, y el motor decide cómo llegar al dato. Esa diferencia no se nota con cien
        registros y decide el programa completo cuando son cien mil.
      panel:
        label: Las tres piezas del modelo
        title: Tabla, renglón y llave primaria
        note: >-
          Cada tabla guarda una sola clase de cosa. Cada renglón es un objeto de esa clase. Y
          la llave primaria es el atributo que distingue a un renglón de todos los demás.
      steps:
        - text: Una tabla por sustantivo
        - text: Una columna por atributo
        - text: Una llave que identifique
          loop: ↺ es el mismo modelado de la semana 5, con otra sintaxis

  - figure:
      eyebrow: Diagnóstico
      title: El camino que recorre una consulta
      image: img/es/db-access.png
      caption: El cursor no trae las filas. Apunta a ellas y las va entregando, igual que recorrer un archivo línea por línea.
      alt: Un programa que se conecta a una base, ejecuta SQL y recibe un cursor que entrega filas

