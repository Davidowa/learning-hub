  - method:
      eyebrow: Cómo repartir el trabajo
      title: Tres piezas que se prueban por separado
      statement: Empieza por las clases del dominio, sin ventana y sin base de datos. Si esas clases corren desde la terminal, el resto es conectar cables.
      points:
        - label: Primero
          text: Las clases del problema, probadas con un script de consola que imprime resultados
        - label: Después
          text: La persistencia, con las mismas clases guardando y recuperando su estado
        - label: Al final
          text: La ventana, que solo lee controles y llama a lo que ya funcionaba antes de existir

  - quiz:
      eyebrow: Pregunta rápida
      question: ¿Qué queda guardado en la base al terminar?
      filename: commit.py
      lang: python
      source: |
        with sqlite3.connect(ruta) as c:
            c.execute("INSERT INTO Peliculas VALUES (1, 'Up')")

        with sqlite3.connect(ruta) as c:
            cursor = c.execute("SELECT COUNT(*) FROM Peliculas")
            print(cursor.fetchone())
      options:
        - "(1,), porque el with hace commit al salir"
        - "(0,), porque nunca se llamó a commit"
        - 'Un error, la conexión ya estaba cerrada'
        - "(1,), porque sqlite3 guarda cada INSERT al instante"

  - trace:
      eyebrow: Respuesta
      title: Imprime (0,), y el with no es el culpable
      headers: ["Paso", "Instrucción", "En memoria", "En disco"]
      rows:
        - ["1", "connect(ruta)", "transacción abierta", "vacío"]
        - ["2", "execute(INSERT)", "1 fila pendiente", "vacío"]
        - ["3", "sale del with", "se descarta", "vacío"]
        - ["4", "SELECT COUNT(*)", "0", "vacío"]
      verdict: El with de sqlite3 cierra la transacción, no la confirma. Sin una llamada explícita a commit, lo insertado se descarta al salir del bloque.

  - lab:
      eyebrow: Laboratorio
      title: De las clases a la tabla, en parejas
      brief: Tomen dos clases de su proyecto y escriban el CREATE TABLE que les corresponde, más los métodos guardar y cargar que las convierten en filas y de vuelta.
      blocks:
        - label: Restricciones
          text: Todo el SQL vive en una sola clase de acceso a datos, y ninguna otra lo escribe
        - label: Entregable
          text: Un archivo .py con las clases y un script de prueba que guarda, cierra, abre y recupera
        - label: Criterio
          text: Que las clases del dominio sigan corriendo sin importar sqlite3 ni PyQt6

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: Una tabla contesta, un archivo solo guarda
          desc: La diferencia aparece cuando hay que buscar, filtrar u ordenar sin leerlo todo
        - title: Sin commit no hay nada en disco
          desc: El with cierra la conexión, y cerrar sin confirmar descarta todo lo que estaba pendiente
        - title: Los valores viajan como parámetros
          desc: El marcador mantiene el dato como dato, y una comilla deja de poder cambiar la consulta

