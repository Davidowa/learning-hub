          desc: Archivos o base de datos, con los datos sobreviviendo a que el programa se cierre
        - key: '03'
          title: Interfaz gráfica
          desc: Una ventana en PyQt6 que no contenga reglas de negocio dentro de sus slots
        - key: '04'
