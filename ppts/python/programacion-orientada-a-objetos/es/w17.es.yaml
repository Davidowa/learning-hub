  - pitfalls:
      eyebrow: Diagnóstico
      title: Los cuatro que más puntos costaron
      items:
        - label: Primer parcial
          title: Constructor de la hija sin super
          desc: El objeto nace sin los atributos del padre y truena en la primera línea que los usa
        - label: Primer parcial
          title: Atributo declarado fuera de __init__
          desc: Se queda pegado a la clase y todos los objetos comparten la misma lista o el mismo contador
        - label: Segundo parcial
          title: Archivo abierto sin with
          desc: Lo escrito no llega al disco cuando algo falla entre la apertura y el cierre
        - label: Segundo parcial
          title: except sin tipo
          desc: Atrapa lo que no esperabas, esconde el error real, y deja la entrega sin forma de depurar

  - quiz:
      eyebrow: Repaso relámpago
      question: ¿Qué imprime la última línea?
      filename: repaso.py
      lang: python
      source: |
        class Base:
            def __init__(self):
                self.items = []

        class Hija(Base):
            def __init__(self):
                self.nombre = "x"

        h = Hija()
        print(len(h.items))
      options:
        - '0, porque la lista se creó vacía'
        - 'AttributeError, items nunca se creó'
        - 'TypeError, faltan argumentos en Hija'
        - '1, porque nombre se agregó a la lista'

  - trace:
      eyebrow: Respuesta
      title: AttributeError, y es el error número uno del semestre
      headers: ["Paso", "Instrucción", "h.nombre", "h.items"]
      rows:
        - ["1", "Hija()", "–", "–"]
        - ["2", "corre Hija.__init__", "x", "no existe"]
        - ["3", "Base.__init__", "nunca se llamó", "no existe"]
        - ["4", "len(h.items)", "x", "AttributeError"]
      verdict: Definir __init__ en la hija reemplaza al del padre. La línea que falta es super().__init__(), y sin ella el constructor de Base no corre nunca.

  - method:
      eyebrow: Cómo prepararse
      title: El examen se estudia tecleando
      statement: Ninguna pregunta pide una definición. Todas piden escribir código que corra, así que la única preparación que sirve es volver a resolver los laboratorios sin ver la solución.
      points:
        - label: Qué practicar
          text: Un laboratorio por unidad, resuelto desde cero y sin abrir el archivo de la solución
        - label: Qué revisar
          text: Las diapositivas de diagnóstico. Los cuatro errores de cada una son los del examen.
        - label: Qué no hacer
          text: Releer las diapositivas de concepto. Se entienden al leerlas y no se retienen al escribir.

  - tiers:
      eyebrow: Reglas
      title: Lo que hay que saber antes de sentarse
      items:
