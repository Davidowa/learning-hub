          title: Formato
          desc: A máquina, un archivo .py por pregunta, con el nombre que indique el enunciado
        - key: '02'
          title: Materiales
          desc: El repositorio del curso y la documentación oficial de Python, abiertos
        - key: '03'
          title: Sin ayuda de terceros
          desc: Ni personas ni asistentes. Aplica el Código de Honor de la Universidad.
        - key: '04'
          title: Entrega
          desc: Por Blackboard, dentro del horario del examen. No se aceptan entregas por correo.

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse del semestre
      items:
