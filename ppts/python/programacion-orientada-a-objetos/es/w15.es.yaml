slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Semana 15 · Tema 6 · Interfaces gráficas
      title: Programación Orientada a Objetos
      subtitle: Quién decide dónde va cada control, cómo se conecta la ventana con las clases del dominio, y qué hace usable una interfaz.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, COM102 · Semestre 2]
        - [Sesión, 15 de 17]
      notes: |
        Última sesión antes del proyecto, así que el bloque 2 vale doble. La tentación de
        meter toda la lógica dentro del slot es enorme y es exactamente lo que hace que un
        proyecto entregado no se pueda calificar por partes.

        Los ejemplos salen de docs/en/courses/python-course/05 - GUI/9th Module, en PyQt6:
        QHBoxLayout es de Code039.py, QVBoxLayout de Code040.py, QGridLayout con span de
        Code042.py, QFormLayout de Code043.py y el formulario completo de Code044.py.

