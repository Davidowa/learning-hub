        - label: Entregable
          text: Las tres preguntas, las respuestas de la otra pareja y la calificación justificada
        - label: Criterio
          text: Que cada pregunta tenga una respuesta correcta y una trampa que suene razonable

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: Sobrescribir cambia el cuerpo, no el nombre
          desc: La hija reemplaza el método del padre y quien llama no se entera de que hubo un cambio
        - title: Una clase abstracta declara el contrato
          desc: Dice qué métodos habrá sin escribir el cómo, y obliga a cada hija a completarlo
        - title: El polimorfismo borra el if de tipos
          desc: Agregar una clase nueva no toca ni una línea del código que ya la va a usar

