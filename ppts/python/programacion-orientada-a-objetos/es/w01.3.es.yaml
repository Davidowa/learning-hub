slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Repaso 3 de 5 · Módulo 3 · Funciones
      title: Programación Orientada a Objetos
      subtitle: Darle nombre a un pedazo de trabajo. Parámetros, retorno y dónde vive cada variable.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, COM102 · Semestre 2]
        - [Sesión, Repaso 3 de 5]
      notes: |
        Cubre el módulo 3 completo, Code010 y Code011 más Exercise002.

        Es la sesión más importante de las cinco para lo que viene: en la semana 3,
        una función que vive dentro de una clase se llama método, y el alcance local
        se vuelve la diferencia entre una variable local y un atributo. Vale la pena
