  - objectives:
      eyebrow: Objetivos de aprendizaje
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Leer un traceback de abajo hacia arriba
          sub: La última línea dice qué pasó; la penúltima, dónde
        - head: Nombrar los errores más comunes
          sub: TypeError, ValueError, NameError, IndexError, KeyError y ZeroDivisionError
        - head: Envolver solo lo que puede fallar
          sub: Un try corto es un try que se entiende
        - head: Escribir un except por tipo
          sub: Y explicar por qué except a secas esconde tus propios errores de dedo
        - head: Usar else y finally
          sub: Lo que corre si todo salió bien, y lo que corre pase lo que pase

  - roadmap:
      eyebrow: Mapa del repaso
      title: Cinco sesiones, un módulo cada una
      phases:
        - label: Repaso 1
          title: Datos y texto
          desc: Variables, tipos, cadenas, números y entrada
          state: done
        - label: Repaso 2
          title: Decisiones y ciclos
          desc: Comparación, lógica, if, for y while
          state: done
        - label: Repaso 3
          title: Funciones
          desc: Parámetros, retorno y alcance
          state: done
