slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Repaso 5 de 5 · Módulo 5 · Errores
      title: Programación Orientada a Objetos
      subtitle: Leer un traceback, atrapar el error que esperabas y dejar pasar el que no.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, COM102 · Semestre 2]
