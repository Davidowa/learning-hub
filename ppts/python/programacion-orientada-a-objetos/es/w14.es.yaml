        - [Formato, Blackboard · .py + PDF]
        - [Peso, Parte del 20 % de tareas]
      rubric:
        - ["Estructura", "40 %", "La ventana es una clase y cada control se guarda sobre self"]
        - ["Señales", "30 %", "Cada botón se conecta a un slot distinto y sin paréntesis en el connect"]
        - ["Reflexión", "30 %", "El párrafo explica el congelamiento con el ciclo de eventos, no con la velocidad de la máquina"]

