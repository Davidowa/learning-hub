  - divider:
      eyebrow: Bloque 02
      title: Formas y controles
      lede: Cada control sabe mostrarse y sabe avisar. Lo que no sabe es qué hacer, y eso lo pones tú.
      block: 2

  - code:
      eyebrow: Controles
      title: Los tres que aparecen en casi cualquier ventana
      filename: controles.py
      lang: python
      source: |
        from PyQt6.QtWidgets import QLabel, QLineEdit, QPushButton

        etiqueta = QLabel("Usuario")
        caja = QLineEdit()
        caja.setPlaceholderText("Escribe tu usuario")
        boton = QPushButton("Entrar")

        print(caja.text())
      annotations:
        - label: La etiqueta
          text: QLabel solo muestra texto. No recibe nada de quien está usando el programa.
        - label: La caja
          text: QLineEdit es un renglón editable, y text() devuelve lo que haya escrito en ese instante
        - label: Riesgo
          text: Preguntar caja.text() al construir la ventana devuelve la cadena vacía, siempre
          accent: true

  - code:
      eyebrow: Señales y slots
      title: Unir el clic con la función que lo atiende
      filename: senales.py
      lang: python
      source: |
        class VentanaPrincipal(QMainWindow):
            def __init__(self) -> None:
                super().__init__()
                self.caja = QLineEdit()
                self.boton = QPushButton("Entrar")
                self.boton.clicked.connect(self.al_entrar)

            def al_entrar(self) -> None:
                print("Hola,", self.caja.text())
      annotations:
        - label: Línea 6
          text: clicked es la señal y al_entrar es el slot. connect los une y ahí termina tu trabajo.
        - label: Sin paréntesis
          text: Se conecta self.al_entrar, no self.al_entrar(). Con paréntesis se llama en ese instante.
        - label: Línea 9
          text: El slot lee la caja cuando ocurre el clic, que es el único momento en que hay algo escrito

  - code_output:
      eyebrow: Demostración
      title: Lo que aparece en consola después de dos clics
      filename: correr.py
      lang: python
      output_label: Consola
      source: |
        app = QApplication(sys.argv)

        ventana = VentanaPrincipal()
        ventana.show()

        sys.exit(app.exec())
      output: |
        Hola, Ana
        Hola, Luis

  - pitfalls:
      eyebrow: Diagnóstico
      title: Cuatro errores que se ven en la primera ventana
      items:
        - label: Error 01
          title: Conectar con paréntesis
          desc: connect(self.al_entrar()) llama a la función al construir y le conecta el resultado
        - label: Error 02
          title: Un ciclo largo dentro del slot
          desc: La ventana se congela, porque el ciclo de eventos está esperando a que tu función termine
        - label: Error 03
          title: No guardar el control sobre self
          desc: Si el widget es una variable local del constructor, Python lo recolecta y desaparece
        - label: Error 04
          title: Leer los campos al construir
          desc: En ese momento están vacíos. Se leen dentro del slot, cuando ya hay algo escrito.

  - divider:
      eyebrow: Bloque 03
      title: Práctica y cierre
      lede: Una ventana que hace algo con lo que le escriben, y el error de sintaxis que se lleva media clase.
      block: 3

  - quiz:
      eyebrow: Pregunta rápida
      question: ¿Cuándo se imprime la palabra clic?
      filename: parentesis.py
      lang: python
      source: |
        class Ventana(QMainWindow):
            def __init__(self):
                super().__init__()
                boton = QPushButton("Hola")
                boton.clicked.connect(self.saludar())

            def saludar(self):
                print("clic")
      options:
        - 'Cada vez que se oprime el botón'
        - 'Al construir la ventana, una sola vez'
        - 'Nunca, porque falta llamar a show()'
        - 'Cada vez que la ventana se redibuja'

  - trace:
      eyebrow: Respuesta
      title: Una sola vez, al construir, y después revienta
      headers: ["Paso", "Instrucción", "Qué pasa", "Salida"]
      rows:
        - ["1", "Ventana()", "corre __init__", "–"]
        - ["2", "self.saludar()", "se ejecuta en ese momento", "clic"]
        - ["3", "el método devuelve None", "connect recibe None", "–"]
        - ["4", "connect(None)", "TypeError", "–"]
      verdict: Los paréntesis llaman a la función. Sin ellos se pasa la función misma, que es justo lo que connect espera recibir para guardarla y llamarla después.

  - lab:
      eyebrow: Laboratorio
      title: Una ventana que responde, en parejas
      brief: Escriban una ventana con una caja de texto, un botón y una etiqueta, de modo que al oprimir el botón la etiqueta muestre en mayúsculas lo que se escribió.
      blocks:
        - label: Restricciones
          text: La ventana es una clase que hereda de QMainWindow y el slot es un método suyo
        - label: Entregable
          text: Un archivo .py que abre la ventana y una captura de pantalla con el resultado
        - label: Criterio
          text: Que el slot no calcule nada, solo lea el control y llame a una función aparte

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: Un QApplication y un ciclo de eventos
          desc: exec() no devuelve hasta que se cierra la ventana, y todo lo tuyo corre dentro de ese ciclo
        - title: La señal se conecta sin paréntesis
          desc: connect recibe la función para guardarla, no el resultado de haberla llamado
        - title: El slot lee los controles al ocurrir el evento
          desc: Leerlos al construir la ventana devuelve siempre lo mismo, que es exactamente nada

