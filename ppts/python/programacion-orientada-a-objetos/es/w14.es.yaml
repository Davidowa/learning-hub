      title: Interfaces gráficas
      lede: La primera sesión en la que tu programa no decide el orden de las cosas. Lo decide quien lo está usando.
      block: 1

  - concept:
      eyebrow: Concepto clave
      title: Qué cambia cuando el programa tiene ventana
      lead: >-
        Hasta ahora el programa decidía el orden. Pedía un dato, luego otro, luego imprimía.
        Con una interfaz gráfica el orden lo decide quien usa el programa, y el código deja
        de ser una receta de arriba abajo para volverse un conjunto de respuestas sueltas.
      panel:
        label: El cambio de mando
        title: Tu código deja de llamar y empieza a ser llamado
        note: >-
          El ciclo de eventos es de Qt, no tuyo. Registras qué función atiende cada cosa y
          cedes el control. De ahí en adelante Qt te llama cuando le toca a cada una.
      steps:
        - text: Construyes la ventana
        - text: Conectas cada control
        - text: Cedes el control a exec()
          loop: ↺ de ahí en adelante tu código solo responde

  - figure:
      eyebrow: Diagnóstico
      title: Qué hace exec() mientras no pasa nada
      image: img/es/event-loop.png
      caption: El ciclo no se detiene ni cuando la ventana parece quieta. Está dando vueltas, esperando el siguiente evento.
      alt: Un clic que entra a una cola de eventos, se reparte a una función y regresa a esperar

  - code:
      eyebrow: PyQt6
      title: La ventana más pequeña que ya se ve
      filename: ventana.py
      lang: python
      source: |
        import sys
        from PyQt6.QtWidgets import QApplication, QWidget

        app = QApplication(sys.argv)

        ventana = QWidget()
        ventana.setWindowTitle("Mi primera ventana")
        ventana.setGeometry(100, 100, 280, 80)
        ventana.show()

        sys.exit(app.exec())
      annotations:
        - label: Línea 4
          text: Un solo QApplication por programa. Recibe sys.argv porque lee argumentos de arranque.
        - label: Línea 9
          text: Sin show() la ventana existe en memoria y no la ve nadie, ni siquiera tú
        - label: Línea 11
          text: exec() arranca el ciclo de eventos y no devuelve hasta que se cierra la ventana

  - code:
      eyebrow: La ventana como clase
      title: Donde empieza a servir todo lo del tema 2
      filename: principal.py
      lang: python
      source: |
        from PyQt6.QtWidgets import QMainWindow, QPushButton


        class VentanaPrincipal(QMainWindow):
            def __init__(self) -> None:
                super().__init__()
                self.setWindowTitle("Mi App")
                self.setGeometry(100, 100, 280, 80)

                boton = QPushButton("Presióname")
                self.setCentralWidget(boton)
      annotations:
        - label: Línea 4
          text: Heredar de QMainWindow trae barra de menú, barra de estado y área central sin escribir nada
        - label: Línea 6
          text: super().__init__() es obligatorio. Sin él Qt no inicializa la ventana y el programa muere.
        - label: Línea 11
          text: El widget central ocupa el área principal, y solo puede haber uno. De ahí salen los layouts.

  - table:
      eyebrow: Vocabulario
      title: Las cinco clases con las que se arma todo
      headers: ["Clase", "Qué es", "Cuántas hay"]
      rows:
