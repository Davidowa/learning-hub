  - lab:
      eyebrow: Laboratorio
      title: Simulacro del segundo parcial, en parejas
      brief: Cada pareja escribe un enunciado corto que exija leer un CSV, calcular algo y escribir un archivo nuevo. Lo intercambian con otra pareja y resuelven el que les tocó.
      blocks:
        - label: Restricciones
          text: El enunciado cabe en cinco renglones y admite una sola interpretación posible
        - label: Entregable
          text: El enunciado propio, la solución del ajeno y una nota de qué quedó ambiguo
        - label: Criterio
          text: Que la solución corra con el archivo de prueba sin tener que editar ninguna ruta

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: El modo binario no traduce nada
          desc: Ni saltos de línea ni acentos. Lo que está en el disco es exactamente lo que llega a memoria.
        - title: El acceso aleatorio pide registros iguales
          desc: Si cada registro mide distinto no hay multiplicación que dé la posición, y toca leer todo
        - title: Las posiciones se cuentan desde cero
          desc: seek(3) deja el cursor antes del cuarto byte, con la misma lógica que un índice de lista

