  - divider:
      eyebrow: Bloque 01
      title: Archivos binarios
      lede: Un archivo es una fila de bytes. El modo texto le pone una capa encima que traduce, y a veces esa capa estorba.
      block: 1

  - concept:
      eyebrow: Concepto clave
      title: La diferencia entre leer y decodificar
      lead: >-
        Todo archivo es una fila de bytes. El modo texto agrega una capa que los traduce a
        letras con un encoding y de paso arregla los saltos de línea. El modo binario quita
        esa capa y entrega los bytes tal como salieron del disco, sin interpretar ninguno.
      panel:
        label: Cuándo quitar la capa
        title: Cuando los bytes no son letras
        note: >-
          Una imagen, un zip o un ejecutable no tienen letras adentro. Traducirlos a texto los
          rompe, y con suerte lanza UnicodeDecodeError antes de alcanzar a romper algo.
      steps:
        - text: Texto para lo que se lee
        - text: Binario para todo lo demás
        - text: Nunca los mezcles en un archivo
          loop: ↺ el modo se elige por el contenido, no por la extensión

  - code:
      eyebrow: Python
      title: Los primeros ocho bytes de una imagen
      filename: binario.py
      lang: python
      source: |
        from pathlib import Path

        ruta = Path("datos") / "logo.png"

        with open(ruta, "rb") as archivo:
            cabecera = archivo.read(8)

        print(cabecera)
        print(len(cabecera))
      annotations:
        - label: La b del modo
          text: rb y wb leen y escriben bytes crudos, sin traducir saltos de línea ni acentos
        - label: Línea 6
          text: read(8) pide ocho bytes, no ocho caracteres. En binario no existen los caracteres.
        - label: Riesgo
          text: Abrir un binario en modo texto lanza UnicodeDecodeError, o peor, lee basura sin quejarse
          accent: true

  - table:
      eyebrow: Tabla comparativa
      title: Las cinco diferencias que importan
      headers: ["Aspecto", "Modo texto", "Modo binario"]
      rows:
        - ["Cómo se abre", "open(ruta)", "open(ruta, 'rb')"]
        - ["Qué devuelve read", "str", "bytes"]
        - ["Encoding", "Obligatorio en la práctica", "No aplica"]
        - ["Saltos de línea", "Se traducen solos", "Quedan tal cual"]
        - ["Para qué sirve", "Texto, CSV, JSON", "Imágenes, zip, ejecutables"]

  - code:
      eyebrow: Comprimidos
      title: Un binario que se trata como si fuera una carpeta
      filename: comprimir.py
      lang: python
      source: |
        from zipfile import ZipFile
        from pathlib import Path

        carpeta = Path("datos")

        with ZipFile("entrega.zip", "w") as paquete:
            for archivo in carpeta.rglob("*.csv"):
                paquete.write(archivo)

        with ZipFile("entrega.zip") as paquete:
            print(paquete.namelist())
      annotations:
        - label: Línea 6
          text: Un zip es un archivo binario, pero zipfile lo trata como carpeta y evita tocar los bytes
        - label: El rglob
          text: Recorre también las subcarpetas. glob se queda en el nivel de arriba y nada más.
        - label: El nombre
          text: No le pongas zip a la variable, porque tapa la función zip que trae Python

  - divider:
      eyebrow: Bloque 02
      title: Acceso secuencial y aleatorio
      lede: Todo archivo abierto tiene un cursor. Leer lo empuja hacia adelante, y hay una manera de moverlo a donde quieras.
      block: 2

  - figure:
      eyebrow: Diagnóstico
      title: El cursor, la lectura y el salto
      image: img/es/seek-tell.png
      caption: Leer avanza el cursor una posición a la vez. seek lo pone donde le digas, sin leer nada en el camino.
      alt: Un archivo dibujado como doce casillas numeradas, con una flecha de salto arriba y flechas de avance abajo

  - code:
      eyebrow: Acceso aleatorio
      title: Ir directo al tercer registro
      filename: registros.py
      lang: python
      source: |
        TAM = 32

        with open("registros.bin", "rb") as f:
            f.seek(2 * TAM)
            tercero = f.read(TAM)
            print(f.tell())

            f.seek(0)
            primero = f.read(TAM)
      annotations:
        - label: Línea 4
          text: Si todos los registros miden lo mismo, el registro n empieza en n por el tamaño
        - label: Línea 6
          text: tell devuelve la posición actual del cursor, contada en bytes desde el principio
        - label: Por qué importa
          text: Leer el registro mil de un archivo de un millón cuesta lo mismo que leer el primero

  - code_output:
      eyebrow: Demostración
      title: Dónde queda el cursor después de cada operación
      filename: cursor.py
      lang: python
      output_label: Salida
      source: |
        with open("registros.bin", "rb") as f:
            print(f.tell())
            f.seek(64)
            print(f.tell())
            f.read(32)
            print(f.tell())
      output: |
        0
        64
        96

  - pitfalls:
      eyebrow: Diagnóstico
      title: Cuatro errores con posiciones y bytes
      items:
        - label: Error 01
          title: Mezclar seek con modo texto
          desc: En texto, seek solo acepta las posiciones que devolvió tell. Cualquier otra da resultados raros.
        - label: Error 02
          title: Registros de tamaño variable
          desc: Si cada renglón mide distinto no hay cuenta que dé la posición, y el acceso vuelve a ser secuencial
        - label: Error 03
          title: Escribir un registro más corto
          desc: Lo que sobra del registro anterior se queda ahí. Hay que rellenar hasta el tamaño fijo.
        - label: Error 04
          title: Creer que seek avisa
          desc: Saltar más allá del final y escribir deja ceros en medio del archivo, sin ningún error

  - quiz:
      eyebrow: Pregunta rápida
      question: ¿Qué imprime la última línea?
      filename: saltar.py
      lang: python
      source: |
        with open("datos.bin", "wb") as f:
            f.write(b"ABCDEFGH")

        with open("datos.bin", "rb") as f:
            f.seek(3)
            print(f.read(2))
      options:
        - "b'DE', porque el cursor queda antes de la cuarta letra"
        - "b'CD', porque seek empieza a contar en uno"
        - "b'ABCDEFGH', porque seek no afecta lo que lee read"
        - 'Un error, seek no funciona en modo binario'

  - trace:
      eyebrow: Respuesta
      title: Imprime b'DE', y las posiciones arrancan en cero
      headers: ["Paso", "Instrucción", "Cursor", "Qué devuelve"]
      rows:
        - ["1", 'open("datos.bin", "rb")', "0", "–"]
        - ["2", "f.seek(3)", "3", "3"]
        - ["3", "f.read(2)", "5", "b'DE'"]
        - ["4", "print(...)", "5", "b'DE'"]
      verdict: Las posiciones se cuentan desde cero, igual que los índices de una lista. La posición 3 queda justo antes de la cuarta letra, y read(2) toma esa y la siguiente.

