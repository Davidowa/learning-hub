        - head: Explicar por qué el segundo def gana
          sub: El nombre de un método es una entrada de diccionario, y una entrada solo guarda un valor
        - head: Cubrir varias formas con un método
          sub: Valores por omisión para lo opcional, *args para lo posicional, **kwargs para lo nombrado
        - head: Sobrecargar operadores
          sub: __str__, __eq__ y __add__ hacen que print, == y + funcionen sobre tus objetos
        - head: Repartir las clases en archivos
