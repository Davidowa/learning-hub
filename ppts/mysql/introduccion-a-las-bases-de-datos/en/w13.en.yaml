  - divider:
      eyebrow: Block 01
      title: The query that now has a name
      lede: >-
        Week 11's JOIN and week 10's grouping move inside the server without one line
        changing. The query does not get better: it gets a name and an argument.
      block: 1

  - code:
      eyebrow: Block 01 · The first procedure
      title: One student's credits, summed inside the server
      filename: sp_creditos.sql
      lang: sql
      source: |
        DROP PROCEDURE IF EXISTS sp_creditos;
        DELIMITER $$
        CREATE PROCEDURE sp_creditos(IN p_alumno_id INT)
        BEGIN
          SELECT a.nombre, SUM(m.creditos) AS creditos
          FROM inscripciones i
          JOIN alumnos  a ON a.alumno_id  = i.alumno_id
          JOIN materias m ON m.materia_id = i.materia_id
          WHERE i.alumno_id = p_alumno_id
          GROUP BY a.alumno_id, a.nombre;
        END$$
        DELIMITER ;

        CALL sp_creditos(1);
      annotations:
        - label: The delimiter
          text: >-
            It changes what ends a statement while the body lasts, so the semicolons
            inside do not cut it in half.
        - label: The p_ prefix
          text: >-
            Not style. It is the only thing stopping the parameter from shadowing the
            column of the same name.
        - label: Who runs it
          text: >-
            Every routine is born with SQL SECURITY DEFINER, exactly like week 12's views.
            Running it is granted separately, with GRANT EXECUTE.
        - label: Risk
          text: >-
            Without IF EXISTS the second run of the script dies with ERROR 1305 (42000),
            and students run their script twenty times in an afternoon.
          accent: true

  - code_output:
      eyebrow: Measured · the best example in the source set
      title: What does a procedure answer when its parameter is named like the column?
      filename: sp_malo.sql
      lang: sql
      output_label: On execution
      source: |
        CREATE PROCEDURE sp_malo(IN alumno_id INT)
        BEGIN
          SELECT alumno_id, materia_id
          FROM inscripciones
          WHERE alumno_id = alumno_id;
        END

        CALL sp_malo(1);
      output: |
        CALL sp_malo(1);
        all 5 rows of the table, with
        alumno_id = 1 printed on each

        the same one, with p_alumno_id:
        the 2 correct rows

        no error, no warning

  - code_output:
      eyebrow: Measured · the client against the server
      title: What happens if you send DELIMITER to the server instead of the client?
      filename: delimiter.sql
      lang: sql
      output_label: On execution
      source: |
        -- DELIMITER is understood by the mysql client.
        -- The server has never heard of it. Here we
        -- send it there on purpose, to watch it fail:

        PREPARE s FROM 'DELIMITER //';
      output: |
        ERROR 1064 (42000): You have an
        error in your SQL syntax; check
        the manual that corresponds to
        your MySQL server version for
        the right syntax to use near
        'DELIMITER //' at line 1

  - code_output:
      eyebrow: Measured · output parameters
      title: An OUT has to be a variable, and the INOUT the source never mentions
      filename: sp_cuenta.sql
      lang: sql
      output_label: On execution
      source: |
        -- p_total is OUT and p_acum is INOUT

        CALL sp_cuenta(1, 5, @acum);

        SET @acum = 100;
        CALL sp_cuenta(1, @tot, @acum);
        SELECT @tot, @acum;
      output: |
        ERROR 1414 (42000): OUT or INOUT
        argument 2 for routine
        agent_jvst.sp_cuenta is not a
        variable or NEW pseudo-variable
        in BEFORE trigger

        with session variables:
        total = 2
        acumulado = 102

