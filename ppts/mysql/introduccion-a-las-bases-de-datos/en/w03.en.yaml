      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Engine, MySQL 9.7.2]
        - [Session, 3 of 17]

  - agenda:
      eyebrow: Agenda
      title: Three working blocks
      cards:
        - title: The manager
          desc: What it is, what it does, and the two functions that hold up
        - title: The three levels
          desc: External, conceptual and internal, one query per level
        - title: The floor
          desc: The files on disc, and why they are not written for you
        - title: The components
          desc: The five you can point at on a screen in this very session

  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Define a DBMS without reciting the slide
          sub: >-
            Programs that exist to describe, retrieve and manipulate data while keeping
            its integrity and its security
        - head: Tell the three architecture levels apart
          sub: >-
            And say which of the three finds out when somebody adds a column
        - head: Point at where the bytes live
          sub: >-
            The data directory, the 16 KB page and the 128 MB pool, read off the server
            rather than off a diagram
        - head: Read an EXPLAIN on MySQL 9
          sub: >-
            The default format is TREE and the classic grid now has to be asked for
        - head: Name components you can actually open
          sub: >-
            Parser, optimizer, executor, file manager and buffer manager

  - roadmap:
      eyebrow: Course map
      title: Where we are in the term
      phases:
        - label: A · Weeks 1–3
          title: Why a database exists
          desc: Origins, types, elements and the DBMS
          state: now
        - label: B · Weeks 4–6
          title: Model before you write
          desc: Entity-relationship, normalisation and keys
