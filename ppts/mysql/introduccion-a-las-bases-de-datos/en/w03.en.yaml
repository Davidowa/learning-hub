slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Week 03 · Block A · The DBMS and its files
      title: Introduction to Databases
      subtitle: >-
        «Logical and physical independence» stops being a phrase the day you watch it in
        three queries. Then we go down to the disc, to the files last week's definition
