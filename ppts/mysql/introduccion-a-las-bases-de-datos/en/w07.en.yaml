  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Sort a command into its family
          sub: With a single question, whether it touches the whole object or the rows inside it
        - head: Defend the type of every column
          sub: Each choice stands on the error the alternative would have quietly allowed
        - head: Write dates in the only format the server accepts
          sub: And recognise error 1292 when somebody writes the date the way they say it out loud
        - head: Tell DELETE and TRUNCATE apart
          sub: They look alike in the result and alike in nothing else, not even in the error
        - head: Explain why a ROLLBACK sometimes undoes nothing
          sub: Because DDL commits on its own, and that comes back next week with rows in the way

