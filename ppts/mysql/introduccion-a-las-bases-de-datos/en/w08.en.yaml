slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Week 08 · Block C · DML and transactions · First midterm
      title: Introduction to Databases
      subtitle: >-
        Three verbs can corrupt a database. Today you write all three, watch the server
        refuse the ones that would have broken it, and learn the two words that let you
        take a verb back.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Engine, MySQL 9.7.2]
        - [Session, 8 of 17]

  - agenda:
      eyebrow: Agenda
      title: Three working blocks
      cards:
        - title: INSERT
          desc: One row, many rows, and rows that come out of another query
        - title: UPDATE and DELETE
          desc: The WHERE between a correction and a disaster, and the one that also divides by zero
        - title: The transaction
          desc: START TRANSACTION, COMMIT, ROLLBACK, SAVEPOINT, and the three times they undo nothing
        - title: First midterm
          desc: Scope, format and weight, in writing and on the slide

  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Write INSERT in its three forms
          sub: One row, several in a single statement, and the ones that come from a SELECT
        - head: Read the error a constraint raises when it fires
          sub: The same constraints from week 6, now seen from the side that crashes into them
        - head: Open and close a transaction
          sub: START TRANSACTION, then COMMIT or ROLLBACK, which are two endings and not one button
        - head: Name the three conditions under which ROLLBACK undoes nothing
          sub: Autocommit on, a DDL statement in the way, or a table that is not InnoDB
        - head: Recognise that a statement is atomic without anyone asking
          sub: Of two rows in one INSERT, a single bad one keeps both of them out

