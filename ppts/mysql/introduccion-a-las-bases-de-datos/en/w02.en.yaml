  - divider:
      eyebrow: Block 01
      title: Three pieces of software, not one
      lede: >-
        The source calls the base, the DBMS and the administrator its macro parts. They are not
        three layers of a drawing. They are three separate things, and today each one shows up
        on screen by itself.
      block: 1

  - diagram:
      eyebrow: Block 01 · The macro parts
      title: What is stored, what answers and what you connect with
      blocks:
        - label: '01'
          title: The database
          desc: The files the data lives in. Week 3 will list them on the disc itself.
        - label: '02'
          title: The DBMS
          desc: The process that serves, stores and protects. It answers your query.
        - label: '03'
          title: The administrator
          desc: The program you connect with. It is swappable, which is why it is named apart.
          dark: true
      note: >-
        Changing administrator does not change the base. The mysql client, mysqladmin and
        mysqlshow ship from one directory, ask one server the same thing and get the same rows.

  - code_output:
      eyebrow: Measured
      title: The client and the server are two separate programs
      filename: terminal
      lang: sql
      output_label: Output
      source: |
        -- from the command line, not from the SQL client
        mysqladmin -u root -h 127.0.0.1 -P 3399 version
      output: |
        mysqladmin.exe Ver 9.7.2
        Server version 9.7.2
        Protocol version 10
        Connection 127.0.0.1 via TCP/IP
        TCP port 3399
        Uptime: 1 hour 58 min 23 sec

  - code_output:
      eyebrow: Measured · predict before you run
      title: If root closes your session, which error do you get to read?
      filename: w02_sessions.sql
      lang: sql
      output_label: Output
      source: |
        -- root, with the operador session open alongside
        SELECT CONNECTION_ID();
        SELECT id, user, command
          FROM performance_schema.processlist
         ORDER BY id;
        SHOW STATUS LIKE 'Threads_connected';
        -- on a separate run, root closes session 1028
        KILL CONNECTION 1028;
      output: |
        CONNECTION_ID()   1116
        816   event_scheduler  Daemon
        1118  operador
        1119  root
        Threads_connected  2

        ERROR 2013 (HY000): Lost
        connection to MySQL server
        during query

  - code_output:
      eyebrow: Measured · where information is born
      title: Seven grades sit on disc and no 8.33 is stored anywhere
      filename: w02_information.sql
      lang: sql
      output_label: Output
      source: |
        SELECT COUNT(*) AS calificaciones_en_disco
          FROM inscripcion;
        SELECT ROUND(AVG(calificacion),2) AS promedio_general
          FROM inscripcion;
        SELECT clave, ROUND(AVG(calificacion),2) AS promedio
          FROM inscripcion GROUP BY clave;
        SELECT COUNT(*) AS filas_que_contienen_8_50
          FROM inscripcion WHERE calificacion = 8.50;
      output: |
        calificaciones_en_disco   7
        promedio_general       8.33
        clave    promedio
        BD1001       8.50
        filas_que_contienen_8_50  0

  - divider:
      eyebrow: Block 02
      title: The source's labels, ruled on
      lede: >-
        The inherited material offers eleven labels across three taxonomies. Six get a measured
        verdict and stay in the table. The other five are named once and then leave the
        syllabus.
      block: 2

  - table:
      eyebrow: Block 02 · The ruling
