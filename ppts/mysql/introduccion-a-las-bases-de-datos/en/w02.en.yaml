          desc: The inventory of your own database, against the one counted in class

  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Separate base, DBMS and administrator
          sub: And explain why changing client program changes nothing about the base
        - head: Read a server process list
          sub: Every session carries its own identifier and the server sees all of them
        - head: Tell data from information
          sub: The 8.33 average is on nobody's disc, and one query proves it
        - head: Rule on the inherited classifications
