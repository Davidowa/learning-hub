slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Week 02 · Block A · Types, elements and classifications
      title: Introduction to Databases
      subtitle: >-
        A database is three pieces of software you can point at and an inventory of objects
        you can count. Today every inherited label gets a verdict.
      meta:
        - [Instructor, David Escobar-Castillejos]
