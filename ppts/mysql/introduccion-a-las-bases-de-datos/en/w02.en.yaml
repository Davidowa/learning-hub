      headers: [Label in the source, Verdict, Where it is cashed]
      rows:
        - ["Transactional", "Refuted", "H-01-2 today · H-17-2 later"]
        - ["Network, the mix-up", "Killed out loud", "Today · TCP port 3399"]
        - ["Hierarchical", "History, with a date", "Week 4 · H-04-3"]
