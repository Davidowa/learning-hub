        - head: Place 1970 and 1974 on the timeline
          sub: The model first, the language four years later, and that is this course's order
        - head: Connect to the server and read its configuration
          sub: Version, engine, character set and the sql_mode that makes errors be errors
        - head: Explain what it means to undo an operation
