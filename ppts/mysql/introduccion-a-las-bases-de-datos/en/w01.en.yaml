      unit: Week 01 · Block A · Why a database exists
      title: Introduction to Databases
      subtitle: >-
        Data has been changing medium for four thousand years. What changed in 1970 was not
        the material but five pressures no flat file can answer.
      meta:
        - [Instructor, David Escobar-Castillejos]
