slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Week 14 · Block D · Triggers and events
      title: Introduction to Databases
      subtitle: >-
        Two ways for the database to act without you. One fires when a row changes, the
        other when the clock says so, and both of them fail without telling you.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Engine, MySQL 9.7.2]
        - [Session, 14 of 17]

  - agenda:
      eyebrow: Agenda
      title: Three working blocks
      cards:
        - title: OLD and NEW
          desc: The six moments, the validation that handles NULL, and the CHECK that sometimes wins
        - title: Auditing, and the hole
          desc: The audit log that works and the three ways it ends up seeing nothing at all
        - title: Events
          desc: The switch, the timestamp that already passed, and the failure nobody reports
        - title: Your turn
          desc: A grade audit log that survives a cascading delete without losing a row

  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Write a trigger and name it
          sub: With the trg_table_timing_event_purpose convention, which reads on its own in a SHOW TRIGGERS
        - head: Say what is in OLD and what is in NEW
          sub: It depends on the timing and the event, and asking for the one that is missing is error 1363
        - head: Validate without letting NULL through
          sub: A comparison against NULL is not false, it is unknown, and the IF simply does not run
        - head: Choose between the trigger and the CHECK
          sub: 1644 with a message of your own against a declarative 3819, and neither one always wins
        - head: Schedule an event and distrust it
          sub: The scheduler is a switch, a past timestamp vanishes, and ENABLED does not mean healthy

  - roadmap:
