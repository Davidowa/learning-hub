        - [Session, 6 of 17]

  - agenda:
      eyebrow: Agenda
      title: Three working blocks
      cards:
        - title: Mapping
          desc: The four rules that turn a line on the diagram into a table
        - title: Integrity
          desc: Four branches, four constructs, and the error number of each one
        - title: The limits
          desc: What the diagram promises and no MySQL statement can enforce
        - title: Your turn
          desc: The records script, running from an empty database

  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Turn every cardinality into DDL
          sub: 1:N is a foreign key, 1:1 is a foreign key plus UNIQUE, N:M is a third table
        - head: Write the UNIQUE that holds a 1:1 up
          sub: Without it both rows go in and the one to one silently becomes one to many
        - head: Keep the domain apart from NOT NULL
          sub: A CHECK bounds the known values and lets the unknown one through without a word
        - head: Read a foreign key's refusals
          sub: Uniqueness on the parent and the column's type, each with its own error number
        - head: Explain the index nobody asked for
          sub: Declaring the foreign key writes the child index, and SHOW INDEX puts it on screen
        - head: Name what cannot be enforced
          sub: Minimum cardinality has no construct in MySQL, and saying so is the cheap option

