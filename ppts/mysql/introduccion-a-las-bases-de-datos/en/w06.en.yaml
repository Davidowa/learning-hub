slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Week 06 · Block B · From the model to tables and keys
      title: Introduction to Databases
      subtitle: >-
        Today the diagram gets executed. Every constraint you write is a business rule you
        hand to the server, so that it stops depending on somebody remembering it.
      meta:
        - [Instructor, David Escobar-Castillejos]
