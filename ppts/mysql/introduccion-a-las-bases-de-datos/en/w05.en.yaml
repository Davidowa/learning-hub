slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Week 05 · Block B · Normalisation
      title: Introduction to Databases
      subtitle: >-
        Normalising is repairing a model. The server will let you break every rule without
        saying a word, so today's lesson is not the rule. It is what the rule costs.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Engine, MySQL 9.7.2]
        - [Session, 5 of 17]

  - agenda:
      eyebrow: Agenda
      title: Three working blocks
      cards:
        - title: The arrow
          desc: What determines what, written down before any normal form is named
        - title: The three forms
          desc: First, second and third, each with the damage that gives it away
        - title: The bill
          desc: Three attacks on the wide table and three repairs on screen
        - title: Your turn
          desc: The week 4 model, broken on purpose and repaired by hand

  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Write a functional dependency
          sub: A → B reads «A determines B», and it decides which table every column lives in
        - head: Tell 1NF apart from the primary key
          sub: Uniqueness is not part of the first normal form, and the server proves it
        - head: Measure the cost of a list inside one cell
          sub: The value goes in, the row reads fine, and the WHERE that looks for it says zero
        - head: Recognise a transitive dependency
          sub: A column that depends on another one that is not the key splits your UPDATE in two
        - head: Repair the wide table on screen
          sub: Three tables where there was one, and the same three attacks running again
        - head: Name the price of normalising
          sub: More tables means more joins, and the bill arrives in full in week 11

