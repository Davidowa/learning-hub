slides:
  - cover:
      kicker: Universidad Panamericana · 2026
      unit: Week 15 · Block E · Indexes and performance
      title: Introduction to Databases
      subtitle: >-
        Four weeks ago a JOIN was visibly slow. Today you find out why, what the repair
        costs on every write, and why the search box on the next screen is a different
        problem that the same index does not touch.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, COM112 · Term 1]
        - [Session, 15 of 17]

  - agenda:
      eyebrow: Agenda
      title: Three working blocks
      cards:
        - title: From scan to index
          desc: The slow JOIN, the plan that explains it, and the leftmost prefix rule
        - title: The taxonomy
          desc: Seven kinds of index, and the FULLTEXT no source in this course teaches
        - title: What it costs
          desc: The price on every write, and the inherited advice about LIKE, settled
        - title: Your turn
          desc: Measure, index and measure again on the large tables in the lab

  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Read the plan of a query
          sub: In 9.7.2 the default EXPLAIN answers a tree, and the classic grid has to be asked for by name
        - head: Apply the leftmost prefix rule
          sub: And recognise its exception, the skip scan, which the source written for 5.7 does not know
        - head: Choose the index the question needs
          sub: A B-tree for an anchored pattern, FULLTEXT for words inside a long text
        - head: Put a price on every index
          sub: Eight extra indexes cost 4.6 times the load and weigh 3.71 times the data
        - head: Audit an inherited piece of advice
          sub: Four claims about LIKE in twenty words, and a different verdict for each one

