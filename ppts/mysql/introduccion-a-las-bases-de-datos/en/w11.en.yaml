  - agenda:
      eyebrow: Agenda
      title: Three working blocks
      cards:
        - title: Left and right
          desc: Where each table sits, and the ON read out loud
        - title: UNION and UNION ALL
          desc: Twenty rows against seventeen, and the three that leave without a word
        - title: The one that is missing
          desc: FULL OUTER JOIN, error 1064, and the recipe that does work
