  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Read an ON out loud
          sub: And tell which table is the left one and which the right by looking at the FROM
        - head: Choose between COUNT(*) and COUNT(column)
          sub: The student with no enrolments returns 1 and 0 on the same row of the result
        - head: Put the filter in the ON or the WHERE on purpose
          sub: The same predicate gives 3 rows in one clause and 6 rows in the other
        - head: Decide between UNION and UNION ALL with a rule
          sub: On the payments table those three letters are worth 3,900 pesos and no warning
        - head: Simulate the FULL OUTER JOIN that MySQL does not have
          sub: Projecting the keys, so the recipe never merges two different people into one

