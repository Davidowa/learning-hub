slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Week 11 · Block C · JOIN, UNION and UNION ALL
      title: Introduction to Databases
      subtitle: >-
        A JOIN answers «and the ones with none?». A UNION answers «and the ones on the
        other list?». Between UNION and UNION ALL there are three letters and, on the
