  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Reproduce a lost update
          sub: Two sessions, sixteen milliseconds apart, and a thousand pesos that never arrive
        - head: Choose the lock the case needs
          sub: FOR UPDATE, FOR SHARE, NOWAIT and SKIP LOCKED answer different questions
        - head: Tell 1205 from 1213
          sub: One undoes the statement and leaves you inside, the other undoes the whole transaction
        - head: Explain how far a lock reaches
          sub: The same FOR UPDATE locks five rows with no index and two records with one
        - head: Diagnose from a third session
          sub: Who waits for whom, since when, and what the killed client receives

