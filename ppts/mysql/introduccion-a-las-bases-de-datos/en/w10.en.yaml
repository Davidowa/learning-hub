  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Choose between COUNT of star and COUNT of a column
          sub: And say how many rows the average skipped without anybody mentioning it
        - head: Write a GROUP BY the server accepts
          sub: Without padding it with every column, because grouping by the key is enough
        - head: Tell WHERE from HAVING
          sub: One filters rows before grouping and the other filters groups already formed
        - head: Classify rows with CASE
          sub: And see why the same row lands elsewhere the moment it is written with IF
        - head: Use NOT EXISTS where NOT IN breaks
          sub: One NULL inside the subquery returns the empty set with no warning at all

