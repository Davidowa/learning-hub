        - title: The five aggregates
          desc: COUNT, SUM, AVG, MIN and MAX, and what each one does with a missing value
        - title: Grouping
          desc: GROUP BY, HAVING and the ONLY_FULL_GROUP_BY mode that is already switched on
        - title: Expressions
          desc: CASE, the conditional-aggregate pivot, subqueries and the WITH clause
