  - agenda:
      eyebrow: Agenda
      title: Tres bloques de trabajo
      cards:
        - title: El procedimiento
          desc: CALL, DELIMITER, parámetros, y el prefijo que no es cuestión de estilo
        - title: El que falla a la mitad
          desc: Dos INSERT, una llave foránea rota, y media base escrita sin querer
        - title: Atrapar el error
          desc: CONDITION, HANDLER, GET DIAGNOSTICS y RESIGNAL sobre ese mismo procedimiento
        - title: El parcial
          desc: Semanas 9 a 12, veinte por ciento, y nada de lo que veas esta mañana

  - objectives:
      eyebrow: Objetivos de aprendizaje
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Escribir un procedimiento y llamarlo
          sub: Con DELIMITER, con DROP … IF EXISTS desde el primer ejemplo, y con parámetros que no chocan con las columnas
        - head: Distinguir IN, OUT e INOUT
          sub: Un argumento OUT tiene que ser una variable, y el servidor lo dice con el error 1414
        - head: Levantar su propio error
          sub: SIGNAL siempre sale con 1644; el SQLSTATE es una etiqueta y MYSQL_ERRNO es el número que sí distingue
        - head: Leer los SQLSTATE que emite el servidor
          sub: Cuatro clases 22 para los errores de dato y un solo 23000 para toda la integridad
        - head: Atrapar, diagnosticar y deshacer
          sub: DECLARE HANDLER, GET DIAGNOSTICS y RESIGNAL, aplicados al procedimiento que quedó a medias

