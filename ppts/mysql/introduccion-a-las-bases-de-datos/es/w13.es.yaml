slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Semana 13 · Bloque D · Procedimientos y errores · Segundo parcial
      title: Introducción a las Bases de Datos
      subtitle: >-
        Hoy la lógica se muda adentro de la base. Vas a escribir un procedimiento que
        falla a la mitad, y en la misma sesión vas a aprender a atraparlo.
      meta:
        - [Profesor, David Escobar-Castillejos]
