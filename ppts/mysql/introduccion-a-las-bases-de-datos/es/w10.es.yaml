slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Semana 10 · Bloque C · Agrupación y agregados
      title: Introducción a las Bases de Datos
      subtitle: >-
        Agrupar es donde SQL deja de ser un archivero y empieza a contestar preguntas cuya
        respuesta nadie guardó. También es donde un solo NULL cambia la cifra del reporte.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Motor, MySQL 9.7.2]
        - [Sesión, 10 de 17]

  - agenda:
      eyebrow: Agenda
      title: Tres bloques de trabajo
      cards:
        - title: Los cinco agregados
          desc: COUNT, SUM, AVG, MIN y MAX, y qué hace cada uno con el dato que falta
        - title: Agrupar
          desc: GROUP BY, HAVING y el modo ONLY_FULL_GROUP_BY que ya viene encendido
        - title: Expresiones
          desc: CASE, el pivote con agregado condicional, subconsultas y la cláusula WITH
        - title: Tu turno
          desc: Los números de fin de semestre que la coordinación pide todos los años

  - objectives:
      eyebrow: Objetivos de aprendizaje
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Elegir entre COUNT de asterisco y COUNT de columna
          sub: Y decir cuántas filas se saltó el promedio sin que nadie lo mencionara
        - head: Escribir un GROUP BY que el servidor acepte
          sub: Sin rellenarlo con todas las columnas, porque agrupar por la llave ya basta
        - head: Distinguir WHERE de HAVING
          sub: Uno filtra filas antes de agrupar y el otro filtra grupos ya formados
        - head: Clasificar filas con CASE
          sub: Y ver por qué la misma fila cae en otra categoría cuando se escribe con IF
        - head: Usar NOT EXISTS donde NOT IN se rompe
          sub: Un solo NULL adentro de la subconsulta devuelve el conjunto vacío sin avisar

  - roadmap:
      eyebrow: Mapa del curso
      title: Dónde estamos en el semestre
      phases:
        - label: A · Semanas 1–3
          title: Por qué existe una base
          desc: Origen, elementos y el manejador
          state: done
        - label: B · Semanas 4–6
          title: Modelar antes de escribir
          desc: Entidad-relación, normalización y llaves
          state: done
        - label: C · Semanas 7–11
          title: SQL que consulta
          desc: Tipos, DDL, DML, SELECT, agrupación y JOIN
          state: now
        - label: D · Semanas 12–14
          title: SQL que el servidor guarda
