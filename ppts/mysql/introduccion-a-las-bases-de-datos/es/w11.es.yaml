slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Semana 11 · Bloque C · JOIN, UNION y UNION ALL
      title: Introducción a las Bases de Datos
      subtitle: >-
        Un JOIN contesta «¿y los que no tienen ninguno?». Un UNION contesta «¿y los que
        están en la otra lista?». Entre UNION y UNION ALL hay tres letras y, sobre la
        tabla de pagos, 3 900 pesos.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Motor, MySQL 9.7.2]
        - [Sesión, 11 de 17]

  - agenda:
      eyebrow: Agenda
      title: Tres bloques de trabajo
      cards:
        - title: Izquierda y derecha
          desc: Dónde está cada tabla, y el ON leído en voz alta
        - title: UNION y UNION ALL
          desc: Veinte filas contra diecisiete, y las tres que desaparecen sin avisar
        - title: El que no existe
          desc: FULL OUTER JOIN, el error 1064, y la receta que sí funciona
        - title: Tu turno
          desc: Diez inscritos contra diez cuentas, y nadie sabe si son los mismos diez

  - objectives:
      eyebrow: Objetivos de aprendizaje
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Leer un ON en voz alta
          sub: Y saber cuál tabla es la izquierda y cuál la derecha con solo mirar el FROM
        - head: Elegir entre COUNT(*) y COUNT(columna)
          sub: El alumno sin inscripciones devuelve 1 y 0 en la misma fila del resultado
        - head: Poner el filtro en el ON o en el WHERE a propósito
          sub: El mismo predicado da 3 filas en una cláusula y 6 en la otra
        - head: Decidir entre UNION y UNION ALL con un criterio
          sub: Sobre la tabla de pagos las tres letras valen 3 900 pesos y ninguna advertencia
        - head: Simular el FULL OUTER JOIN que MySQL no tiene
          sub: Proyectando las llaves, para que la receta no fusione a dos personas distintas

  - roadmap:
      eyebrow: Mapa del curso
      title: Dónde estamos en el semestre
      phases:
        - label: A · Semanas 1–3
          title: Por qué existe una base
          desc: Origen, tipos y elementos, el manejador y su arquitectura
          state: done
        - label: B · Semanas 4–6
          title: Modelar antes de escribir
          desc: Entidad-relación, normalización, y el modelo hecho tablas y llaves
          state: done
        - label: C · Semanas 7–11
          title: SQL que consulta
          desc: Tipos y DDL, DML, SELECT, agrupación, JOIN y UNION
