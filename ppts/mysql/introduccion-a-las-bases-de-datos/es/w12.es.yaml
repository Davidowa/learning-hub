slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Semana 12 · Bloque D · Vistas
      title: Introducción a las Bases de Datos
      subtitle: >-
        Una tabla almacena datos. Una vista almacena lógica. El JOIN de la semana pasada
        recibe hoy un nombre, y es el primer objeto que escribes en este curso que
        sobrevive a la sesión.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Motor, MySQL 9.7.2]
        - [Sesión, 12 de 17]

  - agenda:
      eyebrow: Agenda
      title: Tres bloques de trabajo
      cards:
        - title: Qué guarda
          desc: Lógica, no filas, y un asterisco que se congela en el momento de crearla
        - title: Escribir a través
          desc: Cuándo el UPDATE llega a la tabla base y cuándo choca con un 1288
        - title: DEFINER y capas
          desc: Con qué usuario corre, cómo se apilan, y por qué no acelera nada
        - title: Tu turno
          desc: La pantalla del coordinador, y la fila que se le desaparece de enfrente

  - objectives:
      eyebrow: Objetivos de aprendizaje
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Guardar una consulta con un nombre
          sub: Y explicar por qué dentro de una vista nunca se escribe un asterisco
        - head: Predecir si una vista acepta un UPDATE
          sub: Una vista con JOIN sí acepta, y la frontera real cae en el outer join
        - head: Cerrar una vista filtrada con WITH CHECK OPTION
          sub: Sin esa cláusula el usuario inserta filas que desaparecen de su propia pantalla
        - head: Leer el DEFINER de una vista y saber qué implica
          sub: Todas las que creaste hoy salieron con root, y nadie lo pidió
        - head: Explicar por qué una vista no acelera nada
          sub: EXPLAIN sobre la vista ni siquiera la nombra, y esa es la respuesta completa

  - roadmap:
      eyebrow: Mapa del curso
      title: Dónde estamos en el semestre
      phases:
        - label: A · Semanas 1–3
          title: Por qué existe una base
          desc: Origen, tipos y elementos, el manejador y su arquitectura
          state: done
        - label: B · Semanas 4–6
          title: Modelar antes de escribir
          desc: Entidad-relación, normalización, y el modelo hecho tablas y llaves
          state: done
        - label: C · Semanas 7–11
          title: SQL que consulta
          desc: Tipos y DDL, DML, SELECT, agrupación, JOIN y UNION
          state: done
        - label: D · Semanas 12–14
          title: SQL que el servidor guarda
          desc: Vistas, procedimientos almacenados, triggers y eventos
          state: now
        - label: E · Semanas 15–17
          title: Operarlo
          desc: Índices, concurrencia, usuarios y respaldos
