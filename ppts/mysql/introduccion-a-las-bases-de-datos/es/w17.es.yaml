  - objectives:
      eyebrow: Objetivos de aprendizaje
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Leer una cuenta como par
          sub: El usuario y el host son un solo identificador, y cambiar el host es otra cuenta
        - head: Predecir el error de un permiso faltante
          sub: Decir qué número y qué texto va a recibir la cuenta restringida antes de correrlo
        - head: Leer un SHOW GRANTS
          sub: Y decir qué sentencia le va a ser negada a esa cuenta, columna por columna
        - head: Leer un comando de mysqldump
          sub: Y decir qué objetos NO van a estar en el archivo que produce
        - head: Verificar una restauración
          sub: Porque una restauración exitosa no imprime una sola línea y una fallida tampoco avisa

