slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Week 10 · Unit 8 · Arrays and strings
      title: Advanced Programming
      subtitle: Many values of one type under a single name, and the index nobody checks for you.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, COM103 · Term 2]
        - [Session, 10 of 17]
      notes: |
        This session introduces the first C++ mistake that produces no message at all.
        Running off the end of an array compiles, runs, and hands back a number. Worth
        letting the group watch it happen before telling them.

        The value that comes out of an out-of-range read changes on every run and on every
        machine. The one on the slide came from one concrete run on Visual Studio Community
        2026, and it is labelled as such.

        The second project checkpoint falls this week on the syllabus calendar.

        Reading: Malik, eighth edition, chapter 8. The course documents cite 9, which is
        right for the fifth edition.

