slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Week 14 · Unit 12 · Overloading and templates
      title: Advanced Programming
      subtitle: Making your types behave like the language's own, and writing once what serves every type.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, COM103 · Term 2]
        - [Session, 14 of 17]

  - agenda:
      eyebrow: Agenda
      title: Four blocks of work
      cards:
        - title: Operators
          desc: Making the plus sign work on an object of yours
        - title: What you may
          desc: Which ones can be overloaded and when it is better not to
        - title: Templates
          desc: One function written once that serves any type
        - title: Class templates
          desc: The same idea applied to a whole class

  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Overload an operator
          sub: As a member function, with the signature that matches the sign
        - head: Decide when not to overload
          sub: Recognising that an operator with an invented meaning is worse than a named function
        - head: Write a function template
          sub: With typename, and explain when the compiler generates the concrete version
        - head: Read a class template
          sub: And connect it to the vector and string you have used all term

  - roadmap:
