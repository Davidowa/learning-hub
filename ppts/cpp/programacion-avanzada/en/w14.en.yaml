  - divider:
      eyebrow: Block 01
      title: Making your type behave like the locals
      lede: std::string already joins with a plus sign. That does not come from the language, it comes from somebody having written it.
      block: 1

  - code_output:
      eyebrow: Overloading
      title: Adding two objects with the usual sign
      filename: vector2.cpp
      lang: cpp
      output_label: Output
      source: |
        class Vector2 {
        public:
            Vector2(double a, double b) : x(a), y(b) {}
            Vector2 operator+(Vector2 o)
            {
                return Vector2(x + o.x, y + o.y);
            }
            double x;
            double y;
        };

        Vector2 v = Vector2(1, 2) + Vector2(3, 4);
      output: |
        4 6

  - table:
      eyebrow: The limits
      title: What you may and what you may not
      headers: ["You may", "You may not", "Why"]
      rows:
        - ["+ - * /", "The dot", "It would break member access"]
        - ["== != < >", "The scope operator", "It is part of how things are named"]
        - ["[] () << >>", "The ternary", "The language reserves it"]
        - ["++ -- =", "Inventing signs", "Only the existing ones exist"]

  - divider:
      eyebrow: Block 02
      title: Writing it once
      lede: One function that serves int, double, and any type that does not exist yet.
      block: 2

  - code_output:
      eyebrow: Templates
      title: The same code for different types
      filename: larger.cpp
      lang: cpp
      output_label: Output
      source: |
        template <typename T>
        T larger(T a, T b)
        {
            if (a > b)
                return a;
            return b;
        }

        std::cout << larger(3, 9) << " ";
        std::cout << larger(2.5, 1.5) << "\n";
      output: |
        9 2.5

  - code:
      eyebrow: Class templates
      title: The same idea, over a whole class
      filename: box.cpp
      lang: cpp
      source: |
        template <typename T>
        class Box {
        public:
            Box(T v) : value(v) {}
            T get() { return value; }
        private:
            T value;
        };

        Box<int> a(5);
        Box<std::string> b("hello");
      annotations:
        - label: The angle brackets
          text: Here the type is written by hand. In a function template the compiler works it out.
        - label: Two separate classes
          text: Box of int and Box of string share nothing. They are two classes generated separately.
        - label: You already know it
          text: std::vector and std::unique_ptr are exactly this, and you have used them since week 12
        - label: Risk
          text: A class template usually lives entirely in the header. Splitting it into a .cpp gives linker errors.
          accent: true

  - divider:
      eyebrow: Block 03
      title: Back to the beginning
      lede: The week 0 slide comparing 1979 with today can now be read in full.
      block: 3

  - compare:
      eyebrow: Forty years on
      title: The same stack, with templates and without
      before:
        label: C with classes
        file: stack.cpp
        lang: cpp
        code: |
          class stack {
              int v[100];
              int top;
          public:
              void push(int);
              int pop();
          };
      after:
        label: C++20
        file: stack.cpp
        lang: cpp
        code: |
          template <typename T>
          class Stack {
              std::vector<T> v;
          public:
              void push(T x);
              T pop();
          };
      note: >-
        In week 0 this slide was a historical note. Today both sides read line by line. The
        left holds a hundred integers and nothing else; the right serves any type and grows
        by itself, because it carries another template inside.

  - quiz:
      eyebrow: Quick question
      question: How many functions does the compiler generate from these two calls?
      filename: larger.cpp
      lang: cpp
      source: |
        template <typename T>
        T larger(T a, T b) { return a > b ? a : b; }

        larger(3, 9);
        larger(2.5, 1.5);
      options:
        - 'Two, one for int and one for double'
        - 'One, which serves both types'
        - 'None, the template is resolved while running'
        - 'Three, the two above plus the template'

  - trace:
      eyebrow: Answer
      title: A template is a recipe, not a function
      headers: ["Moment", "What exists", "With which T"]
      rows:
        - ["As written", "Only the template", "None yet"]
        - ["Seeing larger(3, 9)", "One function is generated", "T is int"]
        - ["Seeing larger(2.5, 1.5)", "Another is generated", "T is double"]
        - ["In the executable", "The two generated ones", "int and double"]
      verdict: The template itself never reaches the executable. What reaches it are the concrete versions somebody asked for, which is why a template nobody uses costs nothing.

  - pitfalls:
      eyebrow: Diagnosis
      title: Four stumbles from this unit
      items:
        - label: Error 01
          title: Overloading without an obvious meaning
          desc: An operator doing something unexpected is worse than a function with a long name
        - label: Error 02
          title: Taking the operand by value
          desc: Every addition copies the whole object. The const ampersand signature copies nothing.
        - label: Error 03
          title: A template split across two files
          desc: With the definition outside the header, the linker cannot find the concrete version
        - label: Error 04
          title: Assuming what T supports
          desc: The body can ask T for something it lacks, and the error only shows at the first call

  - lab:
      eyebrow: Lab
      title: A fraction that behaves like a number, in pairs
      brief: Write a Fraction class with a numerator and a denominator, overload addition and equality, and write a function template returning the larger of two values of any type, testing it with integers and with fractions.
      blocks:
        - label: Constraint
          text: The template's comparison uses greater-than, so the fraction has to define it
        - label: Deliverable
          text: A .cpp with the class, the operators, and the template tested against both types
        - label: Criterion
          text: That the template contains not one line specific to Fraction

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: An operator is a function
          desc: operator+ has an odd name and gets found automatically, but there is nothing magic about it
        - title: A template resolves at compile time
          desc: It generates one concrete function per type called with, and none if nobody calls it
        - title: The standard library is this
          desc: vector, string and unique_ptr are class templates with overloaded operators

  - homework:
      eyebrow: For the next session
      title: The fraction finished
      brief: Finish the lab and add the output operator overload so a fraction can be printed straight through cout, in the form numerator slash denominator.
      meta:
        - [Due, Before session 15]
        - [Format, Blackboard · .zip without the x64 folder]
        - [Weight, Exercises are averaged into one point of the term grade]
      rubric:
        - ["Operators", "Required", "Addition and equality give correct results"]
        - ["Template", "Required", "It works with integers and fractions without one line changed"]
        - ["Output", "Required", "cout prints the fraction without calling any method"]

