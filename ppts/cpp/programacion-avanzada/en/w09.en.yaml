slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Week 09 · Unit 7 · Inheritance and composition
      title: Advanced Programming
      subtitle: Reusing a class without writing it again, and deciding between inheriting from it and simply using it.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, COM103 · Term 2]
        - [Session, 9 of 17]
      notes: |
        First session after the partial. Worth opening with the most frequent mistakes from
        the exam before starting the new topic, because everything that went wrong there
        comes back in the second partial.

        This session has a design decision at its centre, not a piece of syntax. Inheritance
        is taught in full and then the argument is made for why composition usually wins.
        Students arriving from other courses tend to believe the opposite.

        All outputs were measured by building the slide programs on Visual Studio Community
        2026.

        The protected access slide is the one that justifies that level existing. Without
        inheritance, protected and private look identical from outside, and that was the
        right-hand column of the week 6 figure.

        Reading: Malik, eighth edition, chapter 11. The course documents cite 13, right for
        the fifth edition.

  - agenda:
      eyebrow: Agenda
      title: Four blocks of work
      cards:
        - title: Inheriting
          desc: A class that takes on the state and behaviour of another
        - title: The protected level
          desc: What the child can see and an outsider cannot
        - title: Composing
          desc: A class that contains another instead of descending from it
        - title: Which to pick
          desc: The question that separates "is a" from "has a"

  - objectives:
      eyebrow: Learning objectives
      title: By the end of the session you will be able to…
      items:
        - head: Declare a derived class
          sub: With the colon syntax and the call to the base constructor
        - head: Use the protected level
          sub: And explain why it sits between public and private, once inheritance is involved
        - head: Reuse by composition
          sub: Declaring an object of another class as a member and delegating work to it
        - head: Choose between the two
          sub: Applying the "is a" against "has a" test before writing the class

