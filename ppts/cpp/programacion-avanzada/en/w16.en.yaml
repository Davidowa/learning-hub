  - divider:
      eyebrow: Block 01
      title: A function that calls itself
      lede: There is nothing special about the mechanism. A recursive call is an ordinary call, and the only difference is whose turn it is.
      block: 1

  - code_output:
      eyebrow: Recursion
      title: Factorial, which is the usual example for good reasons
      filename: factorial.cpp
      lang: cpp
      output_label: Output
      source: |
        int factorial(int n)
        {
            if (n <= 1)
                return 1;
            return n * factorial(n - 1);
        }

        std::cout << factorial(5) << "\n";
      output: |
        120

  - figure:
      eyebrow: Diagnosis
      title: What a recursion looks like while it runs
      image: img/en/recursion.png
      caption: The frames go down to the base case and the result is assembled coming back up, multiplying on the way.
      alt: Four stack frames for factorial of 4, going down to the base case and returning upwards

  - trace:
      eyebrow: Step by step
      title: Five calls waiting and one that answers
      headers: ["Call", "What it returns", "Waits for", "Final value"]
      rows:
        - ["factorial(5)", "5 times the one below", "factorial(4)", "120"]
        - ["factorial(4)", "4 times the one below", "factorial(3)", "24"]
        - ["factorial(3)", "3 times the one below", "factorial(2)", "6"]
        - ["factorial(2)", "2 times the one below", "factorial(1)", "2"]
        - ["factorial(1)", "1, the base case", "nobody", "1"]
      verdict: None of the first four can finish until the one below answers. They are all alive at once, taking up stack, which is why a very deep recursion runs out of room.

  - divider:
      eyebrow: Block 02
      title: What it costs
      lede: Every pending call takes memory. With five it does not show, and that is exactly the problem.
      block: 2

  - pitfalls:
      eyebrow: Diagnosis
      title: Four stumbles with recursion
      items:
        - label: Error 01
          title: No base case
          desc: The stack runs out and the program dies with no useful message, it does not hang like a loop
        - label: Error 02
          title: An unreachable base case
          desc: It exists, but the argument never moves towards it, and the effect is exactly the same
        - label: Error 03
          title: Recomputing the same thing
          desc: Naive recursive Fibonacci repeats the same calls and takes forever for large n
        - label: Error 04
          title: Recursion where a loop belonged
          desc: Walking an array recursively costs stack and reads no better than a for

  - quiz:
      eyebrow: Quick question
      question: What happens to this program?
      filename: nobase.cpp
      lang: cpp
      source: |
        int count(int n)
        {
            return n + count(n - 1);
        }

        std::cout << count(5) << "\n";
      options:
        - 'It runs out of stack and the program dies'
        - 'It returns 15, the sum from 5 down to 1'
        - 'It hangs forever, like an infinite loop'
        - 'It does not compile, the base case is missing'

  - trace:
      eyebrow: Answer
      title: It goes from five downwards, and the stack does not last
      headers: ["Call", "n", "Calls", "Stops"]
      rows:
        - ["1", "5", "count(4)", "No"]
        - ["2", "4", "count(3)", "No"]
        - ["...", "falling with no limit", "the next one", "No"]
        - ["thousands", "negative", "the next one", "The stack runs out"]
      verdict: It compiles without a single warning, because syntactically nothing is wrong. And it does not hang. The stack has a fixed size and the program dies the moment it is exceeded.

  - divider:
      eyebrow: Block 03
      title: Two things at once
      lede: An overview, not a treatise. Enough to know what exists and why it is hard.
      block: 3

  - code_output:
      eyebrow: Concurrency
      title: Two threads writing to the same place
      filename: threads.cpp
      lang: cpp
      output_label: One run, different every time
      source: |
        void noise(const char* tag)
        {
            for (int i = 0; i < 200; i++)
                std::cout << tag << " " << i << "\n";
        }

        std::jthread a(noise, "AAAA");
        std::jthread b(noise, "BBBB");
      output: |
        AAAA 149
        BBBBAAAA 0
        AAAA 150 0

  - concept:
      eyebrow: The fix
      title: A lock around what cannot be shared
      lead: >-
        A mutex is an object only one thread can hold at a time. Whoever wants it and cannot
        have it waits. Wrapping the write to the console in one stops the lines tearing.
      panel:
        label: How to use it without forgetting
        title: lock_guard releases it for you
        note: >-
          Declared at the top of the block, it releases the lock on the way out, even if the
          block ends through an exception. The same idea as unique_ptr with memory.
      steps:
        - text: One mutex per shared resource
        - text: lock_guard on entering the block
        - text: It releases itself on the way out
          loop: ↺ and the protected block is kept as short as possible

  - tiers:
      eyebrow: Third partial
      title: Tuesday 17 November, and it covers everything
      items:
        - key: '01'
          title: Cumulative, and this time it is the whole course
          desc: Unit 1 through unit 14. The first and second partials come back in full.
        - key: '02'
          title: It weighs the same as the other two
          desc: All three are averaged and that average is 80 per cent of the grade
        - key: '03'
          title: Recursion is on it, threads barely
          desc: Concurrency is asked about as a concept, not as code you have to write
        - key: '04'
          title: The project is separate
          desc: It is handed in on the final exam date and carries the remaining 20 per cent

  - lab:
      eyebrow: Lab
      title: Hanoi and one lock, in pairs
      brief: Write the recursive solution to the towers of Hanoi for five discs, printing every move. Then launch two threads printing in parallel and fix the interleaved output with a mutex.
      blocks:
        - label: Constraint
          text: The Hanoi part has to be recursive, no loops. The thread part uses jthread.
        - label: Deliverable
          text: A .cpp with both parts and a screenshot of the output before and after the lock
        - label: Criterion
          text: That you can say how many moves Hanoi makes with five discs and why

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: No base case, no recursion
          desc: What you get is a program that runs out of stack and dies, and it compiles with no warning
        - title: The calls stack up and wait
          desc: The result is assembled coming back, and every pending call holds memory at once
        - title: Shared things need a lock
          desc: Two threads on one resource tread on each other, twice in every four hundred lines

