  - divider:
      eyebrow: Block 01
      title: A variable that holds an address
      lede: Every variable lives somewhere. A pointer is a variable whose contents are that somewhere.
      block: 1

  - figure:
      eyebrow: Diagnosis
      title: The value, the address, and which one holds which
      image: img/en/pointer.png
      caption: p does not hold 42. p holds where the 42 is, and the asterisk is the instruction to go there.
      alt: A box holding the value 42 with its address, and a second box containing that address

  - code_output:
      eyebrow: The two operators
      title: Taking the address and reaching the value
      filename: pointer.cpp
      lang: cpp
      output_label: Output
      source: |
        int n = 42;
        int* p = &n;

        std::cout << n << " " << *p << "\n";

        *p = 99;
        std::cout << n << "\n";
      output: |
        42 42
        99

  - divider:
      eyebrow: Block 02
      title: Memory you ask for yourself
      lede: Until today all memory was born and destroyed on its own. From new onwards that stops being true.
      block: 2

  - figure:
      eyebrow: Diagnosis
      title: Two places a value can live
      image: img/en/stack-vs-heap.png
      caption: The left one cleans itself up when the block ends. The right one stays until somebody writes delete.
      alt: A stack of frames beside a heap, with a pointer on the stack aimed at a value on the heap

  - code_output:
      eyebrow: new and delete
      title: Asking for memory and handing it back
      filename: dynamic.cpp
      lang: cpp
      output_label: Output
      source: |
        int* d = new int(7);

        std::cout << *d << "\n";

        delete d;
        d = nullptr;
      output: |
        7

  - code_output:
      eyebrow: What is used today
      title: A pointer that releases itself
      filename: smart.cpp
      lang: cpp
      output_label: Output
      source: |
        std::unique_ptr<int> u
            = std::make_unique<int>(5);

        std::cout << *u << "\n";
      output: |
        5

  - divider:
      eyebrow: Block 03
      title: Letting the object decide
      lede: The word virtual is what turns a hierarchy of classes into something genuinely useful.
      block: 3

  - code_output:
      eyebrow: The demonstration
      title: One pointer, two calls, two answers
      filename: virtual.cpp
      lang: cpp
      output_label: Output
      source: |
        Square c(3.0);
        Shape* f = &c;

        std::cout << f->area() << "\n";
        std::cout << f->areaNonVirtual() << "\n";
      output: |
        9
        -1

  - figure:
      eyebrow: How it works
      title: Where a virtual call actually goes
      image: img/en/vtable.png
      caption: The object carries a table holding the address of the function that belongs to it. The call consults the table instead of being settled at compile time.
      alt: A call entering a three-row virtual table and leaving through the row matching the real type

  - code:
      eyebrow: Abstract
      title: A class that only declares what must be doable
      filename: shape.cpp
      lang: cpp
      source: |
        class Shape {
        public:
            virtual double area() = 0;
            virtual ~Shape() {}
        };

        class Square : public Shape {
        public:
            Square(double s) : side(s) {}
            double area() override { return side * side; }
        private:
            double side;
        };
      annotations:
        - label: The equals zero
          text: Makes the function pure virtual. Shape can no longer be instantiated.
        - label: override
          text: Asks the compiler to check that you really are replacing something from the base
        - label: The virtual destructor
          text: Without it, deleting through a base pointer never calls the child's destructor
        - label: Risk
          text: A child that does not implement area stays abstract, and the error appears when you try to make an object.
          accent: true

  - table:
      eyebrow: Summary
      title: Four words and what each one does
      headers: ["Word", "What it does", "Where it goes"]
      rows:
        - ["virtual", "The real object decides", "In the base"]
        - ["override", "Checks that you replace", "In the child"]
        - ["= 0", "Makes it pure and abstract", "In the base"]
        - ["virtual ~", "Destroys the child's part", "In the base, always"]

  - quiz:
      eyebrow: Quick question
      question: What does it print, if area is virtual and areaNonVirtual is not?
      filename: virtual.cpp
      lang: cpp
      source: |
        Square c(3.0);
        Shape* f = &c;

        std::cout << f->area() << " ";
        std::cout << f->areaNonVirtual() << "\n";
      options:
        - '9 -1, because only the first looks at the real object'
        - '9 9, because the object is a Square in both'
        - '-1 -1, because the pointer is of type Shape'
        - 'It does not compile, a Shape pointer will not take a Square'

  - trace:
      eyebrow: Answer
      title: One is decided by the compiler, the other by the object
      headers: ["Call", "Who decides", "When", "Runs"]
      rows:
        - ["f->area()", "The real object", "While running", "Square, gives 9"]
        - ["f->areaNonVirtual()", "The pointer's type", "At compile time", "Shape, gives -1"]
      verdict: The difference between the two lines is a single word written in the base class. That is the whole cost of polymorphism, and it is what lets one piece of code handle different objects.

  - pitfalls:
      eyebrow: Diagnosis
      title: Four stumbles from this unit
      items:
        - label: Error 01
          title: new without delete
          desc: The memory stays reserved until the program exits, and inside a loop it grows without stopping
        - label: Error 02
          title: A destructor without virtual
          desc: Deleting through a base pointer never destroys the child's part, and that is where it leaks
        - label: Error 03
          title: Using the pointer after delete
          desc: Not an error, undefined behaviour, which sometimes works and is worse for that reason
        - label: Error 04
          title: Mixing delete and delete brackets
          desc: What new brackets reserved is released with delete brackets, and never the other way round

  - lab:
      eyebrow: Lab
      title: Three shapes and one loop, in pairs
      brief: Write an abstract Shape class with a pure virtual area, three derived classes, and an array of pointers to Shape. Walk it with a single loop that adds up all the areas without asking what type each object is.
      blocks:
        - label: Constraint
          text: Not one if asking about the type. If one appears, a virtual is missing somewhere.
        - label: Deliverable
          text: A .cpp with the hierarchy, the array of pointers, and the delete for each object
        - label: Criterion
          text: That adding a fourth shape forces no change to the loop

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: A pointer holds the address
          desc: The asterisk is the instruction to go there, and it lets you modify without naming
        - title: new and delete go in pairs
          desc: What you ask for stays until you give it back, even after the block has ended
        - title: virtual moves the decision
          desc: From the compiler to the real object, and that is the difference between 9 and minus 1

