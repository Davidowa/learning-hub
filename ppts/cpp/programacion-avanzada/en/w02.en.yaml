      notes: |
        This session closes unit 1. What was left hanging last week, the division that came
        out at 63, is settled in block 3, and it is worth announcing at the start so the
        group is waiting for the answer.

        Every numeric result in this deck was measured by building on Visual Studio
        Community 2026, toolset 14.51. The value of the uninitialised variable changes on
        every run and on every machine; the 237 on the slide is what came out once, not a
        number anyone can promise.

        There is still no if and there are no loops. Control structures are unit 6 and
        arrive in week 7, so all of today's code runs straight down. If somebody asks how to
        check that the average is above seven, the honest answer is that a tool is missing
        and it arrives in five weeks.

        Reading: Malik, eighth edition, chapter 2.

