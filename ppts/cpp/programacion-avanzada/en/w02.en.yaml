  - divider:
      eyebrow: Block 01
      title: Names and values
      lede: A variable is a piece of memory with a name and a type. All three parts of that sentence cost something.
      block: 1

  - concept:
      eyebrow: Key concept
      title: Declaring reserves the space, initialising fills it
      lead: >-
        Declaring tells the compiler how much memory to set aside and how to read it.
        Initialising puts the first value in. They are two separate things, and C++ lets you
        do the first without the second, which is where the hardest bugs come from.
      panel:
        label: What does not happen by itself
        title: Nobody zeroes it for you
        note: >-
          In other languages a fresh variable starts at zero or at null. Here it starts with
          whatever happened to be left in that memory, which can be anything at all.
      steps:
        - text: The type decides the size
        - text: The name decides what you call it
        - text: The initialiser decides its value
          loop: ↺ skipping the third still compiles and fails differently every run

  - tiers:
      eyebrow: Identifiers
      title: Four rules for naming, and one habit
      items:
        - key: '01'
          title: Letters, digits and underscore
          desc: Nothing else. No spaces, no accented characters, no hyphen, which the compiler reads as a subtraction.
        - key: '02'
          title: Cannot start with a digit
          desc: exam2 is valid and 2exam is not. The compiler rejects it before it works out what you meant.
        - key: '03'
          title: Case matters
          desc: Student, student and STUDENT are three different variables and nothing warns you about the resemblance.
        - key: '04'
          title: Cannot be a reserved word
          desc: int, class, return and about ninety others are taken. The error that comes out does not say why.

  - code:
      eyebrow: Declaration
      title: Three variables, and one the compiler protects
      filename: marks.cpp
      lang: cpp
      source: |
        #include <iostream>

        int main()
        {
            int students = 32;
            double average = 8.75;
            const double PASS_MARK = 7.0;

            students = 33;
            std::cout << students << " " << PASS_MARK << "\n";
            return 0;
        }
      annotations:
        - label: Line 5
          text: The type goes before the name and never changes. An int stays an int until its scope ends.
        - label: Line 7
          text: const promises that value is never reassigned, and the compiler collects on the promise
        - label: Line 9
          text: Reassigning students is fine. The same line applied to PASS_MARK does not compile.
        - label: Risk
          text: Capitals are a habit, not a rule. What protects the value is const, not the name.
          accent: true

  - code_output:
      eyebrow: Demonstration
      title: What sits inside a variable nobody filled
      filename: garbage.cpp
      lang: cpp
      output_label: One run, out of many possible
      source: |
        int declared;
        int initialised = 0;

        std::cout << declared << "\n";
        std::cout << initialised << "\n";
      output: |
        237
        0

