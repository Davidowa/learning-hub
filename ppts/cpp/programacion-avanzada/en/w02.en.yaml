  - code_output:
      eyebrow: Precedence
      title: The order is not left to right
      filename: precedence.cpp
      lang: cpp
      output_label: Output
      source: |
        int p = 2 + 3 * 4;
        int q = (2 + 3) * 4;

        std::cout << p << " " << q << "\n";
      output: |
        14 20

  - code_output:
      eyebrow: Increment
      title: One operator, written on two different sides
      filename: increment.cpp
      lang: cpp
      output_label: Output
      source: |
        int a = 5;
        int b = a++;

        int c = 5;
        int d = ++c;

        std::cout << a << " " << b << "\n";
        std::cout << c << " " << d << "\n";
      output: |
        6 5
        6 6

  - quiz:
      eyebrow: Quick question
      question: What does the last line print?
      filename: counter.cpp
      lang: cpp
      source: |
        int n = 3;
        int total = n++ + 10;

        std::cout << n << " " << total << "\n";
      options:
        - '4 13, because n++ hands back the 3 and then increments'
        - '4 14, because it increments before adding'
        - '3 13, because n++ does not change n on this line'
        - '4 10, because n++ is discarded by the addition'

  - trace:
      eyebrow: Answer
      title: Postfix hands back the old value and keeps the new one
      headers: ["Step", "What happens", "n", "total"]
      rows:
        - ["1", "int n = 3", "3", "no value"]
        - ["2", "n++ hands back 3", "4", "no value"]
        - ["3", "3 + 10", "4", "13"]
        - ["4", "It prints", "4", "13"]
      verdict: n already holds 4 by the time the addition happens, but the addition received the 3. Two separate things on one line, which is why mixing them reads badly.

  - divider:
      eyebrow: Block 03
      title: Type conversion
      lede: Here is the answer to the question left open last week.
      block: 3

  - code_output:
      eyebrow: The pending answer
      title: Why last week's average came out at 84
      filename: average.cpp
      lang: cpp
      output_label: Output
      source: |
        double mean = (78 + 85 + 91) / 3;

        std::cout << mean << "\n";
      output: |
        84

  - code:
      eyebrow: The fix
      title: One of the two only has to be real
      filename: average.cpp
      lang: cpp
      source: |
        int total = 78 + 85 + 91;

        double wrong = total / 3;
        double right = static_cast<double>(total) / 3;
        double also = total / 3.0;

        std::cout << wrong << " " << right << "\n";
        std::cout << also << "\n";
      annotations:
        - label: Line 3
          text: Integer over integer gives an integer. The double on the left arrives too late.
        - label: Line 4
          text: static_cast converts before dividing, so the division is already between reals
        - label: Line 5
          text: Writing 3.0 instead of 3 does the same with less noise, and it is what you will see most often
        - label: Risk
          text: The C-style cast, (double)total, still compiles. Prefer static_cast, which does complain when a conversion makes no sense.
          accent: true

  - table:
      eyebrow: What gets lost
      title: Four conversions and what each one costs
      headers: ["From", "To", "What happens"]
      rows:
        - ["int", "double", "Always fits, nothing is lost"]
        - ["double", "int", "The fraction is dropped, not rounded"]
        - ["char", "int", "You get its code number"]
        - ["int", "char", "Lost if it does not fit in one byte"]

  - pitfalls:
      eyebrow: Diagnosis
      title: Four things that will happen this week
      items:
        - label: Error 01
          title: Dividing two integers by accident
          desc: The result comes out truncated, nothing crashes, and the bug surfaces when somebody checks the number
        - label: Error 02
          title: Reading before initialising
          desc: It compiles, it runs, and it gives a different value each time. Warning C4700 already said so.
        - label: Error 03
          title: Mixing increment into an expression
          desc: n++ + n on one line is not a hard exam question, it is code that needs rewriting
        - label: Error 04
          title: Loose numbers in the code
          desc: A 7.0 written in three places is three things to fix the day the scale changes

  - method:
      eyebrow: Style criterion
      title: The name is the one piece of documentation nobody deletes
      statement: A well chosen identifier saves the comment that used to explain it. The rule is not to write long names, it is that the name should say what the variable holds rather than what type it is.
      points:
        - label: What works
          text: finalAverage, enrolledStudents, PASS_MARK. They read on their own and need no footnote.
        - label: What does not
          text: x, data, temp, number2. Each costs a full read of the code to find out what it holds.
        - label: The constant
          text: Any number that appears twice or that carries a meaning deserves a name and a const

  - lab:
      eyebrow: Lab
      title: A report card that computes correctly, in pairs
      brief: Write a program that declares one student's three marks as integers, computes the average with its fraction intact, and prints it alongside the remainder of dividing the total by three.
      blocks:
        - label: Constraint
          text: No if and no loops, which arrive in week 7. Straight down the page.
        - label: Deliverable
          text: A .cpp file that prints the fractional average and the remainder in the same run
        - label: Criterion
          text: That the conversion is explicit and that you can explain what would happen without it

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: Declaring is not initialising
          desc: The first sets memory aside and the second fills it. Without the second, what is inside is leftovers.
        - title: Integer division truncates
          desc: 7 over 2 gives 3, and one of the two operands being real is enough to make it 3.5
        - title: Postfix hands back the old value
          desc: n++ increments n and passes the expression the number it held before incrementing

