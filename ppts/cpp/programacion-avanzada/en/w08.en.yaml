  - divider:
      eyebrow: Block 01
      title: The three loops
      lede: Three ways to write the same thing, and one real difference between two of them that shows in a single case.
      block: 1

  - code_output:
      eyebrow: while
      title: It checks before coming in
      filename: loops.cpp
      lang: cpp
      output_label: Output
      source: |
        int i = 0;

        while (i < 3)
        {
            std::cout << "w" << i;
            i++;
        }
      output: |
        w0w1w2
      notes: |
        Three things have to be present and in place: the variable initialised before the
        loop, the condition in the header, and the step inside the body.

        Leave out the third and the loop never ends. It is the most common mistake of the
        session and it shows up as a program sitting silent with the cursor blinking.

  - code_output:
      eyebrow: do-while
      title: It runs before it checks
      filename: loops.cpp
      lang: cpp
      output_label: Output with j at 3
      source: |
        int j = 3;

        do
        {
            std::cout << "d" << j;
            j++;
        } while (j < 3);
      output: |
        d3
      notes: |
        The condition was false before entering and it still printed once. That is the only
        real difference from while, and it is the reason the form exists.

        It suits anything that has to happen at least once, such as showing a menu before
        asking whether the user wants to quit. Outside that case, while reads better.

        The semicolon after the closing parenthesis is required.

  - code_output:
      eyebrow: for
      title: All three parts together in the header
      filename: loops.cpp
      lang: cpp
      output_label: Output
      source: |
        for (int k = 0; k < 3; k++)
        {
            std::cout << "f" << k;
        }
      output: |
        f0f1f2
      notes: |
        Initialisation, condition and step on one line. It does nothing while cannot do, but
        it puts the three pieces where they are seen together, which makes one of them
        harder to forget.

        The variable k is declared in the header and only exists inside the loop. It stops
        existing on the way out, which is what you want almost every time.

  - table:
      eyebrow: Which to use
      title: Three loops, and the question that decides
      headers: ["Loop", "When", "Minimum runs"]
      rows:
        - ["for", "The number of passes is known", "Zero times"]
        - ["while", "Not known, it depends", "Zero times"]
        - ["do-while", "It must happen at least once", "Once"]
      notes: |
        The right-hand column is what decides between the first two and the third. The top
        two check before coming in, so they may never run at all.

        Between for and while the choice is about readability, not capability. Either one
        does the other's job.

  - divider:
      eyebrow: Block 02
      title: Nesting and controlling
      lede: A loop inside a loop multiplies rather than adds. It is the first time in this course that the cost of a program takes off.
      block: 2

  - code_output:
      eyebrow: Nested
      title: Two loops, and how often the body runs
      filename: nested.cpp
      lang: cpp
      output_label: Output
      source: |
        int total = 0;

        for (int a = 1; a <= 3; a++)
            for (int b = 1; b <= 2; b++)
                total = total + a * b;

        std::cout << total << "\n";
      output: |
        18
      notes: |
        The body runs six times, three by two. The products are 1, 2, 2, 4, 3 and 6, adding
        up to 18. Measured on a real run.

        The number that matters is not the 18, it is the six. At three by two nobody
        notices; at a thousand by a thousand it is a million passes, and that is where a
        program stops responding.

  - table:
      eyebrow: Fine control
      title: Two statements that break the loop's flow
      headers: ["Statement", "What it does", "Watch out"]
      rows:
        - ["break", "Leaves the loop entirely", "Only the innermost one"]
        - ["continue", "Jumps to the next pass", "The step can be skipped"]
      notes: |
        The warning about continue is real and it produces infinite loops. In a while whose
        step sits at the end of the body, a continue skips it and the condition never
        changes.

        In a for that cannot happen, because the step lives in the header and always runs.
        One more reason to prefer for whenever there is a counter.

  - pitfalls:
      eyebrow: Diagnosis
      title: Four ways to write an infinite loop
      items:
        - label: Error 01
          title: Forgetting the step
          desc: The condition never changes and the program sits still, with no error and no output
        - label: Error 02
          title: A semicolon after the for
          desc: The body becomes the empty statement and the block below runs exactly once
        - label: Error 03
          title: continue before the step
          desc: In a while, it skips the line that advanced the variable and the loop jams
        - label: Error 04
          title: Comparing with exact equality
          desc: If the variable steps over the target value the condition never holds and it never ends

  - quiz:
      eyebrow: Quick question
      question: How many times does it print, with j starting at 3?
      filename: dowhile.cpp
      lang: cpp
      source: |
        int j = 3;

        do
        {
            std::cout << "d" << j;
            j++;
        } while (j < 3);
      options:
        - 'Once, because it checks after running'
        - 'Never, because 3 is not less than 3'
        - 'Three times, because j starts at 3'
        - 'Forever, because j grows and is never less than 3'

  - trace:
      eyebrow: Answer
      title: The body runs before the first check exists
      headers: ["Step", "What happens", "j", "Prints"]
      rows:
        - ["1", "Enters the body unchecked", "3", "d3"]
        - ["2", "j++", "4", "–"]
        - ["3", "Checks 4 < 3", "4", "–"]
        - ["4", "False, it leaves", "4", "–"]
      verdict: A while with that same condition would have printed nothing. The difference between the two loops is exactly this run.

