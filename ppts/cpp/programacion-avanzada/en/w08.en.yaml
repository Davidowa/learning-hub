        - label: What to review
          text: The compiler errors you have already met. C2065, C2143, C2248 and LNK2019 come back.
        - label: What not to do
          text: Reading other people's code without writing it. It makes sense on the page and will not come out on the keyboard.

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
