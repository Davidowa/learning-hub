slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Week 06 · Unit 5 · Classes and data abstraction
      title: Advanced Programming
      subtitle: Putting the data next to the functions that look after it, and deciding what shows from outside the class.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, COM103 · Term 2]
        - [Session, 6 of 17]
      notes: |
        This closes the functions and classes block. It is the last session before control
        structures, so all of today's code is still straight-line: constructors that assign,
        accessors that return, member functions with no branches.

        That constraint bites harder here than in the previous weeks, because the natural
        example of a mutator is one that validates its argument, and validating needs an if.
        Worth saying out loud when somebody asks, and noting it as what week 7 adds.

        The numeric results were measured by building the slide's program on Visual Studio
        Community 2026. The area comes out at 12 and, after the mutator, at 20.

        The first project checkpoint falls this week on the syllabus calendar. The project
        itself is not assigned yet, that happens after the first partial, so the checkpoint
        refers to the review calendar rather than to a project deliverable.

        Reading: Malik, eighth edition, chapter 10. The course documents cite 12, which is
        right for the fifth edition.

