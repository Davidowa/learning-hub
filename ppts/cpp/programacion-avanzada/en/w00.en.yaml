slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Opening session · Course introduction
      title: Advanced Programming
      subtitle: Where C++ came from, where it still rules forty years later, and how we are going to work this term.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, COM103 · Term 2]
        - [Session, Opening]
      notes: |
        This session replaces the image-only deck used before. The original infographics
        are still in ppts/cpp/Introducción al curso.pptx and hold up on a close screen,
        but they are far too dense for a large room. What follows is the same material
        spread across slides that read from the back row, plus the history, which was the
        one thing none of the eight covered.

        The sector percentages and the language comparison come from those infographics,
        which label themselves as the author's own editorial assessment. They are nobody's
        official figures, and that is worth saying out loud when presenting them.

  - agenda:
      eyebrow: Agenda
      title: Four working blocks
      cards:
        - title: Where it came from
          desc: Forty years, from C to the version this course uses
        - title: What makes it different
          desc: Compiled, high level, and with nobody collecting the garbage
        - title: Where it is used
          desc: The sectors where it is still the first choice
        - title: How we work
          desc: Grading, submissions, the AI policy and the toolchain

  - objectives:
      eyebrow: Session objectives
      title: By the end of this session you will be able to…
      items:
        - head: Place C++ in time
          sub: What came before it, what it was built to fix, and why it still changes
        - head: Explain what a compiler does
          sub: And why a syntax error turns up before the program ever runs
        - head: Say where C++ is worth it
          sub: And where another language solves the same thing with less work
        - head: Work with the toolchain ready
          sub: Visual Studio 2026, a console project, and the standard set to C++20

  - roadmap:
