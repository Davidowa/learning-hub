slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Week 13 · Unit 11 · Input and output
      title: Advanced Programming
      subtitle: Data that outlives the program closing, and the logistics of the second partial exam.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, COM103 · Term 2]
        - [Session, 13 of 17]
      notes: |
        Another double session. Unit 11 closes with files and the second partial logistics go
        at the end.

        The topic is short on syntax and carries one large trap: a file that could not be
        opened raises nothing at all. The program carries on and reads nothing. That is the
        slide to make stick.

        The outputs were measured on Visual Studio Community 2026. The file was written and
        read back in the same run, and the attempt to open a file that does not exist gave
        zero from is_open.

        The third project checkpoint falls this week on the syllabus calendar.

        Reading: Malik, eighth edition, chapter 3.

