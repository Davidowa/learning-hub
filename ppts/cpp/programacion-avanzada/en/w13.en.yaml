  - divider:
      eyebrow: Block 01
      title: Writing and reading
      lede: A file behaves like cout and like cin. The operators are the same, and that is deliberate.
      block: 1

  - code_output:
      eyebrow: There and back
      title: Writing a file and reading it again
      filename: file.cpp
      lang: cpp
      output_label: Output
      source: |
        std::ofstream out("data.txt");
        out << "Ana 95\n";
        out.close();

        std::ifstream in("data.txt");
        std::string name;
        int mark;
        in >> name >> mark;
        in.close();

        std::cout << name << " " << mark << "\n";
      output: |
        Ana 95
      notes: |
        This needs the fstream header. ofstream is for output and ifstream for input, and
        both use the operators you have known since week 1.

        The input operator splits on whitespace, so name received Ana and mark received 95,
        each converted to its own type. To read a whole line, spaces included, there is
        std::getline.

        Opening an existing file with ofstream empties it. Adding to the end has to be asked
        for explicitly through the open mode.

  - figure:
      eyebrow: Access
      title: Reading in order or jumping to a position
      image: img/en/seek-tell.png
      caption: Sequential reading moves one step at a time. seek moves the cursor in one go and tell reports where it stopped.
      alt: A cursor over a file drawn as numbered positions, with a sequential read and a jump

  - divider:
      eyebrow: Block 02
      title: When the file is not there
      lede: The quietest mistake in the unit. The program does not fail, it simply reads nothing.
      block: 2

  - code_output:
      eyebrow: Demonstration
      title: Opening a file that does not exist
      filename: missing.cpp
      lang: cpp
      output_label: Output
      source: |
        std::ifstream in("no_such_file.txt");

        std::cout << in.is_open() << "\n";
      output: |
        0
      notes: |
        No exception, no message, no crash. The object was constructed, the file was not
        opened, and the program carried on as though nothing had happened.

        If a read is attempted after that line, the variables keep whatever they held before.
        If they were never initialised, they keep garbage, which is the week 2 problem
        arriving through another door.

        Which is why the check is not optional. Every file open is checked before reading,
        every time, and it is the line most often left out of the final project.

  - code:
      eyebrow: The right shape
      title: Check first, read after
      filename: safe.cpp
      lang: cpp
      source: |
        std::ifstream in("data.txt");

        if (!in.is_open())
        {
            std::cout << "could not open\n";
            return 1;
        }
        std::string name;
        int mark;
        while (in >> name >> mark)
        {
            std::cout << name << "\n";
        }
        in.close();
      annotations:
        - label: The check
          text: It goes immediately after opening, before any read at all
        - label: The loop
          text: The condition is the read itself. It comes back false once there is nothing left.
        - label: Why this way
          text: Asking about end of file before reading gives one extra pass, with the last line repeated
        - label: Risk
          text: A return inside the if leaves the file open. With large files it is worth closing before leaving.
          accent: true

  - table:
      eyebrow: The states
      title: Four ways to ask a stream how it is doing
      headers: ["Query", "True when", "Used"]
      rows:
        - ["is_open()", "The file opened", "Right after opening"]
        - ["eof()", "The end was reached", "Almost never, see the note"]
        - ["fail()", "The last read failed", "When a type does not match"]
        - ["good()", "Everything is fine", "As a general condition"]
      notes: |
        eof is the one that gets misused. Writing a loop conditioned on not having reached
        the end produces one extra pass, because the flag is only raised after a read has
        been attempted and failed.

        The correct shape is to put the read itself in the loop condition, which is what the
        previous slide does. There the read is attempted and its result decides whether to
        carry on.

