  - quiz:
      eyebrow: Quick question
      question: The file does not exist. What does the program print?
      filename: missing.cpp
      lang: cpp
      source: |
        std::ifstream in("no_such_file.txt");
        int n = 7;

        in >> n;
        std::cout << n << "\n";
      options:
        - '7, because the read was never even attempted'
        - '0, because a failed read sets the variable to zero'
        - 'Garbage, because the file does not exist'
        - 'The program ends with an exception'
      notes: |
        Measured on Visual Studio Community 2026 with C++20: it prints 7, is_open gives 0
        and fail gives 1.

        The distinction is fine and worth making. Since C++11, an extraction that is
        attempted and fails does write zero into the variable. But here the stream was
        already in a failed state from not opening the file, so the operator returns
        immediately without attempting anything, and the variable keeps what it had.

        The practical result is the worse of the two: the program carries on working with an
        old value that looks perfectly legitimate.

  - trace:
      eyebrow: Answer
      title: The read failed, and it never touched the variable
      headers: ["Step", "What happens", "The stream", "n"]
      rows:
        - ["1", "int n = 7", "did not open, already failed", "7"]
        - ["2", "in >> n returns at once", "in failed state", "7"]
        - ["3", "It prints", "in failed state", "7"]
      verdict: What matters is not the number, it is that the program never noticed. Without the is_open check, a read that never happened looks exactly like a successful one.

  - pitfalls:
      eyebrow: Diagnosis
      title: Four stumbles from this unit
      items:
        - label: Error 01
          title: Not checking is_open
          desc: The file is missing, the program carries on, and it works with data that never arrived
        - label: Error 02
          title: A loop conditioned on eof
          desc: The flag is raised after the failure, so the body runs one time too many
        - label: Error 03
          title: Forgetting to close
          desc: What was written can sit in the buffer and never reach disk if the program ends badly
        - label: Error 04
          title: Opening to write by accident
          desc: ofstream empties the file on opening, and the previous contents are gone

  - lab:
      eyebrow: Lab
      title: The group, saved and recovered, in pairs
      brief: Take the array of records from week 11 and write it to a text file, one student per line. Then write a second program that reads the whole thing back and computes the group average.
      blocks:
        - label: Constraint
          text: The second program cannot know how many students there are. It has to find out by reading.
        - label: Deliverable
          text: Two .cpp files and the text file the first one produced
        - label: Criterion
          text: That the second checks is_open and reports a missing file instead of printing zero

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: A file is used like the console
          desc: The same operators, with a different object and one more header
        - title: Failing to open is not an error
          desc: is_open is the line separating a correct program from one reading nothing
        - title: The read is the condition
          desc: The loop is driven by the result of reading, not by asking about end of file

