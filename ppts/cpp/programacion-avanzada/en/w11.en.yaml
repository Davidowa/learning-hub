slides:
  - cover:
      kicker: School of Engineering · 2026
      unit: Week 11 · Unit 9 · Records
      title: Advanced Programming
      subtitle: Putting values of different types together under one name, and how close that is to a class.
      meta:
        - [Instructor, David Escobar-Castillejos]
        - [Code, COM103 · Term 2]
        - [Session, 11 of 17]
      notes: |
        Short on syntax and long on judgement. struct is almost identical to class and the
        interesting question is when to use which.

        In C++ the only technical difference between struct and class is the default access
        level. Everything else is convention, and it is worth saying so rather than inventing
        a distinction the language does not make.

        The sizes and outputs were measured on Visual Studio Community 2026. sizeof on a
        record of two doubles gives 16, the sum of its parts, and it is worth warning that
        this does not always happen because of alignment padding.

        Reading: Malik, eighth edition, chapter 9. The course documents cite 11, which is
        right for the fifth edition.

