  - divider:
      eyebrow: Block 01
      title: Breaking it down
      lede: A three-hundred-line program inside main is not badly written because it is long. It is badly written because no part of it can be tested without running all of it.
      block: 1

  - figure:
      eyebrow: Decomposition
      title: Separating a problem into pieces that solve themselves
      image: img/en/ct-01.png
      caption: Each piece can be tested, corrected and explained on its own. That is what the extra line it costs to declare it buys you.
      alt: A tangle of thread pulled apart into several tidy coils

  - concept:
      eyebrow: Key concept
      title: A function is a promise with three parts
      lead: >-
        A function promises that if you hand it certain values, of certain types, it gives
        back a result of a known type. Whoever calls it does not need to know how. That is
        the whole idea, and it is the same one that holds up the rest of the course.
      panel:
        label: The test of a good function
        title: It explains in a single sentence
        note: >-
          If saying what it does needs an "and also", it is probably two functions that got
          stuck together, and separating them now is cheaper than later.
      steps:
        - text: It takes typed values
        - text: It does one thing
        - text: It gives back a result
          loop: ↺ whoever uses it needs only those three lines

  - divider:
      eyebrow: Block 02
      title: Prototype, definition and call
      lede: Three different things written in three different places, and the compiler insists they appear in a certain order.
      block: 2

  - code:
      eyebrow: Anatomy
      title: A complete function, and its name three times
      filename: average.cpp
      lang: cpp
      source: |
        double average(int a, int b, int c);

        int main()
        {
            double p = average(78, 85, 91);
            std::cout << p << "\n";
            return 0;
        }

        double average(int a, int b, int c)
        {
            double total = a + b + c;
            return total / 3;
        }
      annotations:
        - label: Line 1
          text: The prototype announces the function. It ends in a semicolon and has no body.
        - label: Line 5
          text: The call. 78, 85 and 91 are the arguments, this time's concrete values.
        - label: Line 10
          text: The definition. Here a, b and c are the parameters, the names the body uses.
        - label: Line 12
          text: total is a double, so the division on the next line is already between reals

  - code_output:
      eyebrow: Running it
      title: And what it hands back
      filename: average.cpp
      lang: cpp
      output_label: Output
      source: |
        double p = average(78, 85, 91);

        std::cout << p << "\n";
      output: |
        84.6667

  - table:
      eyebrow: The parts
      title: Seven pieces, and where each one shows up
      headers: ["Piece", "What it is", "In the example"]
      rows:
        - ["Return type", "The type of what it hands back", "double"]
        - ["Name", "What you call it by", "average"]
        - ["Parameters", "What it declares it takes", "int a, int b, int c"]
        - ["Arguments", "This call's actual values", "78, 85, 91"]
        - ["Body", "What it does, inside braces", "total / 3"]
        - ["return", "Hands back and ends the function", "return total / 3;"]
        - ["Prototype", "The announcement, above main", "double average(int, int, int);"]

  - code_output:
      eyebrow: When the announcement is missing
      title: An identifier the compiler does not know yet
      filename: noproto.cpp
      lang: cpp
      output_label: Error list, trimmed
      source: |
        int main()
        {
            std::cout << twice(4);
            return 0;
        }

        int twice(int n)
        {
            return n * 2;
        }
      output: |
        error C3861: 'twice':
        identifier not found
        error C2593: 'operator <<'
        is ambiguous
        ... 29 more lines of notes

  - method:
      eyebrow: Criterion
      title: The cause is at the top, the consequences are below
      statement: A compile error in C++ rarely arrives alone. The discipline that saves the most time in this course is fixing only the first one and rebuilding before reading the second.
      points:
        - label: Why it happens
          text: The compiler carries on with incomplete information, and every bad assumption generates new errors
        - label: What to do
          text: Double click the first line of the list, fix that, rebuild. Nothing else.
        - label: When to doubt it
          text: If the first error points into a standard library file, the problem is almost always in your call

  - pitfalls:
      eyebrow: Diagnosis
      title: Four stumbles from this unit
      items:
        - label: Error 01
          title: Defining the function after main
          desc: With no prototype above, one unknown name produces thirty lines of errors
        - label: Error 02
          title: Prototype without a semicolon
          desc: The compiler reads it as the start of a definition and complains about the next line
        - label: Error 03
          title: Using a local outside its function
          desc: You get C2065, undeclared identifier, even with the variable written three lines up
        - label: Error 04
          title: Expecting the original to change
          desc: The parameter is a copy. Modifying it inside does not touch the caller's variable.

  - divider:
      eyebrow: Block 03
      title: What is local stays inside
      lede: A variable declared inside a function is born when the function starts and disappears when it ends.
      block: 3

  - code:
      eyebrow: Copies
      title: The parameter receives a copy of the value
      filename: copy.cpp
      lang: cpp
      source: |
        int doubled(int n)
        {
            n = n * 2;
            return n;
        }

        int main()
        {
            int original = 10;
            int result = doubled(original);
            std::cout << original << " " << result << "\n";
            return 0;
        }
      annotations:
        - label: No prototype
          text: The definition sits above main, which is the other valid fix for the previous slide
        - label: Line 3
          text: n changes to 20 inside the function, and n only exists inside the function
        - label: Line 10
          text: It is handed the value of original, not original. The function receives a loose 10.
        - label: Risk
          text: This looks like a limitation and for now it is. Changing it is called passing by reference, and it is next session.
          accent: true

  - quiz:
      eyebrow: Quick question
      question: What does the program on the previous slide print?
      filename: copy.cpp
      lang: cpp
      source: |
        int original = 10;
        int result = doubled(original);

        std::cout << original << " " << result << "\n";
      options:
        - '10 20, because the function worked on a copy'
        - '20 20, because n and original are the same variable'
        - '10 10, because the return was never stored anywhere'
        - '20 10, because the change applies on leaving the function'

  - trace:
      eyebrow: Answer
      title: Two separate variables that hold the same value for an instant
      headers: ["Step", "What happens", "original", "n"]
      rows:
        - ["1", "int original = 10", "10", "does not exist"]
        - ["2", "doubled(original) is called", "10", "10, freshly copied"]
        - ["3", "n = n * 2", "10", "20"]
        - ["4", "return n, result receives 20", "10", "stops existing"]
      verdict: original never changed because the function never had it. It received a copy, in a different place, destroyed when the call ends.

  - lab:
      eyebrow: Lab
      title: A report card split into functions, in pairs
      brief: Take the report card program from week 2, which today sits entirely inside main, and separate it into three functions with prototypes, one that computes the average, one that turns it into a percentage, and one that assembles the final line of text.
      blocks:
        - label: Constraint
          text: No if and no loops, which arrive in week 7. One route through each function.
        - label: Deliverable
          text: A .cpp with the three prototypes above, main in the middle and the three definitions below
        - label: Criterion
          text: That main reads straight through and no function needs an "and also" to explain itself

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: The prototype comes before the use
          desc: The compiler reads top to bottom, and a name it does not know generates errors in a chain
        - title: The parameter is a copy
          desc: Modifying it inside the function does not touch the variable the call was made with
        - title: Fix only the first error
          desc: The ones below are usually consequences, and they disappear on the next build

