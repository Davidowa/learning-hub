        - [Weight, Exercises are averaged into one point of the term grade]
      rubric:
        - ["References", "Required", "Both results come out through reference parameters"]
        - ["Overloading", "Required", "The two versions coexist and the compiler picks correctly"]
        - ["Naming", "Required", "Each function name says whether it modifies what it receives"]

