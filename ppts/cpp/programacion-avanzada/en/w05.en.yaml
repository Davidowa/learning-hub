  - divider:
      eyebrow: Block 01
      title: Changing the caller's variable
      lede: Last week the parameter was a copy and there was no way to touch the original. Today the difference is four characters.
      block: 1

  - figure:
      eyebrow: Diagnosis
      title: The same call, with the ampersand and without
      image: img/en/value-vs-reference.png
      caption: On the left there are two boxes and one was copied into the other. On the right there is one box with two names.
      alt: Two boxes joined by a copy arrow, beside a single box pointed at by two names

  - code:
      eyebrow: The difference
      title: Four characters separate one from the other
      filename: twice.cpp
      lang: cpp
      source: |
        void twice(int n)
        {
            n = n * 2;
        }

        void twiceRef(int& n)
        {
            n = n * 2;
        }
      annotations:
        - label: void
          text: Neither returns anything. Which means the first one does nothing useful at all.
        - label: Line 6
          text: The ampersand goes on the type. n stops being a copy and becomes another name for the argument.
        - label: The body
          text: Both functions have an identical body. The only thing that changes is the signature.
        - label: Risk
          text: Whoever reads the call twiceRef(b) does not see the ampersand. You have to open the signature to know b will change.
          accent: true

  - code_output:
      eyebrow: Demonstration
      title: Two calls that look the same, two different results
      filename: twice.cpp
      lang: cpp
      output_label: Output
      source: |
        int a = 10;
        twice(a);

        int b = 10;
        twiceRef(b);

        std::cout << a << " " << b << "\n";
      output: |
        10 20

  - concept:
      eyebrow: Criterion
      title: Three ways to receive, and when each one applies
      lead: >-
        By value when the function only needs to read something small. By reference when it
        genuinely has to modify the original. And by constant reference when it only reads
        something large and copying it would be expensive.
      panel:
        label: The third is the forgotten one
        title: const ampersand reads without copying
        note: >-
          Taking a std::string by value copies the whole string on every call. Taking it as
          const std::string& copies nothing and the compiler stops you modifying it.
      steps:
        - text: int by value, it is cheap
        - text: int& when it must be modified
        - text: const string& to only read
          loop: ↺ the real question is between the first and the third

  - divider:
      eyebrow: Block 02
      title: Where each name lives
      lede: One identifier can exist three times in the same file and refer to three different things.
      block: 2

  - figure:
      eyebrow: Scope
      title: What is local dies when the function ends
      image: img/en/scope-cpp.png
      caption: Using the name outside its box does not fail at run time, it never gets that far. It fails at compile time, with C2065.
      alt: Three nested boxes, global, function and local, with the way out to the local name crossed

  - code_output:
      eyebrow: Shadowing
      title: When the local is named the same as the global
      filename: shadow.cpp
      lang: cpp
      output_label: Output
      source: |
        int counter = 0;

        void shadow()
        {
            int counter = 99;
            std::cout << counter << "\n";
        }

        int main()
        {
            shadow();
            std::cout << counter << "\n";
            return 0;
        }
      output: |
        99
        0

  - code_output:
      eyebrow: static
      title: A local variable that refuses to die
      filename: counter.cpp
      lang: cpp
      output_label: Three calls in a row
      source: |
        void record()
        {
            static int calls = 0;
            int normal = 0;

            calls = calls + 1;
            normal = normal + 1;
            std::cout << calls << " " << normal << "\n";
        }
      output: |
        1 1
        2 1
        3 1

  - pitfalls:
      eyebrow: Diagnosis
      title: Four stumbles from this unit
      items:
        - label: Error 01
          title: Forgetting the ampersand
          desc: The function compiles, runs, modifies nothing, and the mistake only shows in the final answer
        - label: Error 02
          title: Reusing a global's name
          desc: The local covers it with no warning, and the program does something other than what it reads
        - label: Error 03
          title: Returning a reference to a local
          desc: The variable dies when the function ends, leaving a reference to memory that is no longer its own
        - label: Error 04
          title: Default value on both sides
          desc: It goes in the prototype or in the definition, never in both, or the compiler rejects it

  - divider:
      eyebrow: Block 03
      title: One name, several functions
      lede: Two functions can share a name as long as the compiler has some way to tell which one you meant.
      block: 3

  - code:
      eyebrow: Overloading
      title: The same name for the same concept
      filename: area.cpp
      lang: cpp
      source: |
        double area(double side)
        {
            return side * side;
        }

        double area(double base, double height)
        {
            return base * height;
        }
      annotations:
        - label: The two signatures
          text: They differ in the number of parameters, so the compiler chooses with no ambiguity
        - label: area(3.0)
          text: Runs the first and gives 9, measured. One argument, one side.
        - label: area(3.0, 4.0)
          text: Runs the second and gives 12. The compiler makes that choice, not the program.

  - table:
      eyebrow: The rule
      title: Which differences actually tell two functions apart
      headers: ["What changes", "Example", "Compiles"]
      rows:
        - ["How many parameters", "area(double) vs area(double, double)", "Yes"]
        - ["What type they are", "print(int) vs print(double)", "Yes"]
        - ["Only the name", "f(int a) vs f(int b)", "No"]
        - ["Only the return", "int f(int) vs double f(int)", "No"]
        - ["Value or reference", "f(int) vs f(int&)", "No, C2668"]

  - code:
      eyebrow: Default values
      title: A parameter you are allowed not to write
      filename: greeting.cpp
      lang: cpp
      source: |
        std::string greeting(std::string name,
                             std::string title = "Eng.")
        {
            return title + " " + name;
        }

        int main()
        {
            std::cout << greeting("Ana") << "\n";
            std::cout << greeting("Ana", "Dr.") << "\n";
            return 0;
        }
      annotations:
        - label: The output
          text: Prints Eng. Ana and then Dr. Ana, measured on a real run
        - label: The order
          text: Parameters with default values go last. You cannot skip one in the middle.
        - label: Risk
          text: The default value is written once, in the prototype if there is one. Repeating it in the definition does not compile.
          accent: true

  - quiz:
      eyebrow: Quick question
      question: The function is called three times in a row. What does it print?
      filename: counter.cpp
      lang: cpp
      source: |
        static int calls = 0;
        int normal = 0;

        calls = calls + 1;
        normal = normal + 1;
        std::cout << calls << " " << normal << "\n";
      options:
        - '1 1, then 2 1, then 3 1'
        - '1 1, then 2 2, then 3 3'
        - '1 1 all three times, both reset'
        - '3 3 at the end, because static accumulates both'

  - trace:
      eyebrow: Answer
      title: The static line runs exactly once in the whole program
      headers: ["Call", "calls", "normal", "Prints"]
      rows:
        - ["1", "0 to 1", "born at 0, up to 1", "1 1"]
        - ["2", "1 to 2", "born at 0, up to 1", "2 1"]
        - ["3", "2 to 3", "born at 0, up to 1", "3 1"]
      verdict: static changes how long the variable lives, not who can see it. It is still local, nobody outside the function can name it, and it survives between calls.

  - lab:
      eyebrow: Lab
      title: A function that reports two things, in pairs
      brief: Write a void function that takes three marks and hands back, by reference, both the average and the total in two separate parameters. Add a second overloaded version that takes four marks.
      blocks:
        - label: Constraint
          text: No if and no loops, which arrive in week 7. One route through each function.
        - label: Deliverable
          text: A .cpp with both overloaded versions and a main that calls each of them
        - label: Criterion
          text: That the function name announces it is going to modify its parameters

  - takeaways:
      eyebrow: Summary
      title: Three ideas to take away
      items:
        - title: The ampersand removes the copy
          desc: With int& the function receives another name for the original variable, not a duplicate
        - title: The local covers the global
          desc: It compiles with no warning and makes the program read differently from how it runs
        - title: static outlives the call
          desc: It is initialised once and keeps its value, while still being local

