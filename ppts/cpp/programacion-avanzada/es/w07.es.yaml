slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Semana 07 · Unidad 6 · Estructuras de control I
      title: Programación Avanzada
      subtitle: El programa deja de ser una línea recta. Comparar, combinar condiciones y elegir qué se ejecuta.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, COM103 · Semestre 2]
        - [Sesión, 7 de 17]
      notes: |
        Se levanta la limitación que arrastraron las seis sesiones anteriores. Vale la pena
        decirlo de entrada: el mutador de la semana pasada, que solo asignaba, hoy ya puede
        revisar lo que recibe.

        Todos los resultados de este deck se midieron compilando cada programa tal como
        aparece en su lámina, en Visual Studio Community 2026. El caso del switch sin break y
        el de la comparación de reales salieron de corridas reales, no de memoria.

        La lámina de los reales es la más importante de la sesión y la que más se olvida.
        0.1 más 0.2 no es igual a 0.3, y aun así cout imprime 0.3. Conviene correrlo en vivo.

        Lectura: Malik, octava edición, capítulo 4.

  - agenda:
      eyebrow: Agenda
      title: Cuatro bloques de trabajo
      cards:
        - title: Comparar
          desc: Los seis operadores relacionales completos, y qué devuelven
        - title: Combinar
          desc: Los tres lógicos, y el atajo que evita evaluar de más
        - title: Elegir
          desc: if, if-else y el anidamiento, con el problema que trae
        - title: Muchos casos
          desc: switch, y el break que casi nadie olvida dos veces

  - objectives:
      eyebrow: Objetivos de aprendizaje
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Escribir una condición correcta
          sub: Usando el operador de comparación y no el de asignación, que compila igual
        - head: Combinar condiciones
          sub: Con los tres operadores lógicos, y aprovechar la evaluación en corto circuito
        - head: Elegir entre varios caminos
          sub: Con if, if-else y switch, sabiendo cuál conviene en cada caso
        - head: Comparar números reales
          sub: Sin usar la igualdad exacta, que da falso cuando el resultado se ve correcto

  - roadmap:
      eyebrow: Mapa del curso
      title: Dónde estamos en el semestre
      phases:
        - label: 01 · Semanas 1–3
          title: Fundamentos
          desc: Entorno, depuración, tipos, operadores y cadenas
          state: done
        - label: 02 · Semanas 4–6
