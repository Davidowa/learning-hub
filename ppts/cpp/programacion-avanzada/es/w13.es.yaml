  - divider:
      eyebrow: Bloque 01
      title: Escribir y leer
      lede: Un archivo se comporta como cout y como cin. Los operadores son los mismos y eso es a propósito.
      block: 1

  - code_output:
      eyebrow: Ida y vuelta
      title: Escribir un archivo y volver a leerlo
      filename: archivo.cpp
      lang: cpp
      output_label: Salida
      source: |
        std::ofstream out("datos.txt");
        out << "Ana 95\n";
        out.close();

        std::ifstream in("datos.txt");
        std::string nombre;
        int calificacion;
        in >> nombre >> calificacion;
        in.close();

        std::cout << nombre << " " << calificacion << "\n";
      output: |
        Ana 95

  - figure:
      eyebrow: Acceso
      title: Leer en orden o saltar a una posición
      image: img/es/seek-tell.png
      caption: La lectura secuencial avanza un paso a la vez. seek mueve el cursor de golpe y tell dice dónde quedó.
      alt: Un cursor sobre un archivo dibujado como posiciones numeradas, con una lectura secuencial y un salto

  - divider:
      eyebrow: Bloque 02
      title: Cuando el archivo no está
      lede: El error más silencioso de la unidad. El programa no falla, simplemente no lee nada.
      block: 2

  - code_output:
      eyebrow: Demostración
      title: Abrir un archivo que no existe
      filename: falta.cpp
      lang: cpp
      output_label: Salida
      source: |
        std::ifstream in("no_existe.txt");

        std::cout << in.is_open() << "\n";
      output: |
        0

  - code:
      eyebrow: La forma correcta
      title: Revisar primero, leer después
      filename: seguro.cpp
      lang: cpp
      source: |
        std::ifstream in("datos.txt");

        if (!in.is_open())
        {
            std::cout << "no se pudo abrir\n";
            return 1;
        }
        std::string nombre;
        int calificacion;
        while (in >> nombre >> calificacion)
        {
            std::cout << nombre << "\n";
        }
        in.close();
      annotations:
        - label: La comprobación
          text: Va inmediatamente después de abrir, antes de cualquier lectura
        - label: El ciclo
          text: La condición es la lectura misma. Devuelve falso cuando ya no hay nada que leer.
        - label: Por qué así
          text: Preguntar por el fin de archivo antes de leer da una vuelta de más, con la última línea repetida
        - label: Riesgo
          text: Un return dentro del if deja el archivo abierto. Con archivos grandes conviene cerrar antes de salir.
          accent: true

  - table:
      eyebrow: Los estados
      title: Cuatro maneras de preguntarle a un flujo cómo va
      headers: ["Consulta", "Es cierta cuando", "Se usa"]
      rows:
        - ["is_open()", "El archivo se abrió", "Justo después de abrir"]
        - ["eof()", "Se llegó al final", "Casi nunca, ver la nota"]
        - ["fail()", "La última lectura falló", "Al leer un tipo que no cuadra"]
        - ["good()", "Todo va bien", "Como condición general"]

  - divider:
      eyebrow: Bloque 03
      title: Segundo parcial
      lede: Martes 20 de octubre. Acumulativo, como los tres.
      block: 3

  - tiers:
      eyebrow: El examen
      title: Cuatro cosas que conviene saber antes
      items:
        - key: '01'
          title: Cubre de la unidad 1 a la 11
          desc: Todo lo del primer parcial otra vez, más funciones, clases, herencia, arreglos, registros y punteros
        - key: '02'
          title: Lo del primer parcial vuelve a entrar
          desc: Acumulativo quiere decir eso. Lo que quedó mal en septiembre sigue contando en octubre.
        - key: '03'
          title: Entra la memoria dinámica
          desc: new y delete emparejados, y una fuga que haya que encontrar
        - key: '04'
          title: Entra el polimorfismo
          desc: El par de la semana pasada, 9 y menos 1, con otra jerarquía

  - quiz:
      eyebrow: Pregunta rápida
      question: El archivo no existe. ¿Qué imprime el programa?
      filename: falta.cpp
      lang: cpp
      source: |
        std::ifstream in("no_existe.txt");
        int n = 7;

        in >> n;
        std::cout << n << "\n";
      options:
        - '7, porque la lectura ni siquiera se intentó'
        - '0, porque una lectura fallida pone la variable en cero'
        - 'Basura, porque el archivo no existe'
        - 'El programa termina con una excepción'

  - trace:
      eyebrow: Respuesta
      title: La lectura falló, y aun así tocó la variable
      headers: ["Paso", "Qué ocurre", "El flujo", "n"]
      rows:
        - ["1", "int n = 7", "no abrió, ya falló", "7"]
        - ["2", "in >> n se sale de inmediato", "en estado de fallo", "7"]
        - ["3", "Se imprime", "en estado de fallo", "7"]
      verdict: Lo importante no es el número, es que el programa no se enteró. Sin la comprobación de is_open, una lectura que nunca ocurrió se ve exactamente igual que una exitosa.

  - pitfalls:
      eyebrow: Diagnóstico
      title: Cuatro tropiezos de esta unidad
      items:
        - label: Error 01
          title: No revisar is_open
          desc: El archivo no existe, el programa sigue y trabaja con datos que nunca llegaron
        - label: Error 02
          title: Un ciclo con eof
          desc: La bandera se enciende después de fallar, así que el cuerpo corre una vez de más
        - label: Error 03
          title: Olvidar cerrar
          desc: Lo escrito puede quedarse en el buffer y no llegar al disco si el programa termina mal
        - label: Error 04
          title: Abrir para escribir sin querer
          desc: ofstream vacía el archivo al abrirlo, y el contenido anterior ya no está

  - lab:
      eyebrow: Laboratorio
      title: El grupo, guardado y recuperado, en parejas
      brief: Tomen el arreglo de registros de la semana 11 y escríbanlo a un archivo de texto, un alumno por línea. Después escriban un segundo programa que lo lea completo y calcule el promedio del grupo.
      blocks:
        - label: Restricción
          text: El segundo programa no puede saber cuántos alumnos hay. Lo tiene que descubrir leyendo.
        - label: Entregable
          text: Dos .cpp y el archivo de texto que produjo el primero
        - label: Criterio
          text: Que el segundo revise is_open y avise si el archivo no está, en lugar de imprimir cero

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: Un archivo se usa como la consola
          desc: Los mismos operadores, con un objeto distinto y una cabecera más
        - title: Que no abra no es un error
          desc: is_open es la línea que separa un programa correcto de uno que lee la nada
        - title: La lectura es la condición
          desc: El ciclo se controla con el resultado de leer, no preguntando por el fin de archivo

  - homework:
      eyebrow: Para la próxima sesión
      title: La persistencia terminada y el parcial preparado
      brief: Terminen el laboratorio y agreguen al segundo programa el manejo del caso en que el archivo tenga una línea mal formada, avisando cuál fue sin detener la lectura del resto.
      meta:
        - [Entrega, Antes de la sesión 14]
        - [Formato, Blackboard · .zip sin la carpeta x64]
        - [Peso, Los ejercicios promediados suman un punto al periodo]
      rubric:
        - ["Escritura", "Requisito", "El archivo queda con un alumno por línea y se cierra"]
        - ["Lectura", "Requisito", "El segundo programa descubre cuántos hay y revisa is_open"]
        - ["Robustez", "Requisito", "Una línea mal formada se reporta y no detiene el programa"]

  - closing:
