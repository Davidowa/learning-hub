slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Semana 09 · Unidad 7 · Herencia y composición
      title: Programación Avanzada
      subtitle: Reutilizar una clase sin volver a escribirla, y decidir entre heredar de ella o simplemente usarla.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, COM103 · Semestre 2]
        - [Sesión, 9 de 17]
      notes: |
        Primera sesión después del parcial. Conviene abrir con los errores más frecuentes del
        examen antes de empezar el tema nuevo, porque todo lo que salió mal ahí vuelve a
        entrar en el segundo parcial.

        La sesión tiene una decisión de diseño en el centro, no una sintaxis. La herencia se
        enseña completa y después se argumenta por qué la composición suele ser mejor. Los
        alumnos que vienen de otros cursos llegan convencidos de lo contrario.

        Todas las salidas se midieron compilando los programas de las láminas en Visual
        Studio Community 2026.

        La lámina del acceso protegido es la que justifica que exista ese nivel. Sin
        herencia, protegido y privado se ven idénticos desde fuera, y esa fue la columna
        derecha de la figura de la semana 6.

        Lectura: Malik, octava edición, capítulo 11. Los documentos del curso citan el 13,
        correcto en la quinta edición.

  - agenda:
      eyebrow: Agenda
      title: Cuatro bloques de trabajo
      cards:
        - title: Heredar
          desc: Una clase que toma el estado y el comportamiento de otra
        - title: El nivel protegido
          desc: Lo que la hija sí puede ver y quien está fuera no
        - title: Componer
          desc: Una clase que contiene otra en lugar de descender de ella
        - title: Cuál elegir
          desc: La pregunta que separa "es un" de "tiene un"

  - objectives:
      eyebrow: Objetivos de aprendizaje
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Declarar una clase derivada
          sub: Con la sintaxis de dos puntos y la llamada al constructor de la base
        - head: Usar el nivel protegido
          sub: Y explicar por qué existe entre público y privado, con la herencia de por medio
        - head: Reutilizar por composición
          sub: Declarando un objeto de otra clase como miembro y delegándole trabajo
        - head: Elegir entre las dos
          sub: Aplicando la prueba de "es un" contra "tiene un" antes de escribir la clase

