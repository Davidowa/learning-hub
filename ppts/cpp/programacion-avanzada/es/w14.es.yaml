slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Semana 14 · Unidad 12 · Sobrecarga y plantillas
      title: Programación Avanzada
      subtitle: Que tus tipos se usen como los del lenguaje, y escribir una sola vez lo que sirve para todos.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, COM103 · Semestre 2]
        - [Sesión, 14 de 17]
      notes: |
        Empieza el último bloque del curso. Los dos temas de hoy son los que explican por qué
        la biblioteca estándar se ve como se ve: vector, string y todo lo demás están
        construidos con plantillas y con operadores sobrecargados.

        La comparación con la semana 0 vale la pena. La lámina de la pila de 1979 contra la
        de C++20 mostraba exactamente esta diferencia, y hoy el grupo ya puede leer las dos.

        Las salidas se midieron en Visual Studio Community 2026.

        Lectura: Malik, octava edición, capítulo 13. Los documentos del curso citan el 15,
        correcto en la quinta edición.

