  - agenda:
      eyebrow: Agenda
      title: Cuatro bloques de trabajo
      cards:
        - title: Sin devolver nada
          desc: Funciones void, y para qué sirve una que no entrega resultado
        - title: Por referencia
          desc: El ampersand que convierte la copia en otro nombre del original
        - title: Alcance
          desc: Global, local y de bloque, más la variable que sobrevive a la llamada
        - title: Un nombre, varias
          desc: Sobrecarga y parámetros con valor por omisión

  - objectives:
      eyebrow: Objetivos de aprendizaje
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Escribir funciones void
          sub: Y decidir cuándo un resultado se devuelve y cuándo se escribe en un parámetro
        - head: Pasar un argumento por referencia
          sub: Sabiendo que la función va a poder modificar la variable de quien la llamó
        - head: Predecir qué variable gana
          sub: Cuando una local tiene el mismo nombre que una global, y por qué eso se evita
        - head: Sobrecargar una función
          sub: Y decir qué diferencias entre dos firmas sí bastan para distinguirlas

