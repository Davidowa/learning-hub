slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Semana 11 · Unidad 9 · Registros
      title: Programación Avanzada
      subtitle: Juntar datos de tipos distintos bajo un mismo nombre, y en qué se parece eso a una clase.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, COM103 · Semestre 2]
        - [Sesión, 11 de 17]

  - agenda:
      eyebrow: Agenda
      title: Cuatro bloques de trabajo
      cards:
        - title: El registro
          desc: Declararlo, llenarlo y leer sus campos
        - title: Copias
          desc: Qué pasa al asignar un registro completo a otro
        - title: Registros y arreglos
          desc: Un arreglo de registros, que es la tabla del proyecto
        - title: struct o class
          desc: La única diferencia real, y todo lo demás que es costumbre

  - objectives:
      eyebrow: Objetivos de aprendizaje
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Declarar y usar un registro
          sub: Con campos de tipos distintos, y el punto para llegar a cada uno
        - head: Predecir el efecto de una asignación
          sub: Sabiendo que copiar un registro copia todos sus campos, no una referencia
        - head: Combinar registro y arreglo
          sub: Para representar una tabla de filas con columnas de tipos distintos
        - head: Elegir entre struct y class
          sub: Por lo que la convención comunica, ya que el lenguaje casi no los distingue

