  - divider:
      eyebrow: Bloque 01
      title: Campos de tipos distintos
      lede: Un arreglo guarda muchos valores del mismo tipo. Un registro guarda pocos valores de tipos distintos, que van juntos por significado.
      block: 1

  - code_output:
      eyebrow: Declaración
      title: Un punto con dos campos
      filename: punto.cpp
      lang: cpp
      output_label: Salida
      source: |
        struct Punto {
            double x;
            double y;
        };

        int main()
        {
            Punto q;
            q.x = 3.0;
            q.y = 4.0;

            std::cout << q.x << " " << q.y << "\n";
            return 0;
        }
      output: |
        3 4
      notes: |
        El punto entre el nombre del objeto y el del campo es el mismo operador que se usa
        para llamar a una función miembro. No es casualidad: un struct es una clase.

        El punto y coma después de la llave final es obligatorio, igual que en class, y es
        el mismo olvido de la semana 6.

        q se declaró sin inicializar sus campos. Hasta las dos asignaciones, x e y contienen
        basura, exactamente como una variable suelta.

  - code_output:
      eyebrow: Copias
      title: Asignar un registro copia todo lo que tiene
      filename: copia.cpp
      lang: cpp
      output_label: Salida
      source: |
        Punto q;
        q.x = 3.0;

        Punto r = q;
        r.x = 99.0;

        std::cout << q.x << " " << r.x << "\n";
      output: |
        3 99
      notes: |
        La asignación copió el registro completo, campo por campo. Cambiar r no tocó a q,
        que es lo que uno espera y no siempre es lo que ocurre en otros lenguajes.

        Esto es la semántica de valor, la misma que tenían los parámetros de la semana 4.
        Vale la pena decir que con registros grandes esa copia cuesta, y que por eso se
        pasan como const referencia a las funciones.

        Cuando el registro contenga un puntero, en la semana 12, esta copia va a dejar de
        ser suficiente. Conviene anunciarlo hoy.

  - divider:
      eyebrow: Bloque 02
      title: Registros dentro de arreglos
      lede: Aquí es donde el curso empieza a parecerse a un programa de verdad. Una fila con columnas de tipos distintos, repetida n veces.
      block: 2

  - code:
      eyebrow: La tabla
      title: Un arreglo de registros es una tabla
      filename: grupo.cpp
      lang: cpp
      source: |
        struct Alumno {
            std::string nombre;
            int calificacion;
        };

        int main()
        {
            Alumno grupo[3];
            grupo[0].nombre = "Ana";
            grupo[0].calificacion = 95;

            std::cout << grupo[0].nombre << "\n";
            return 0;
        }
      annotations:
        - label: Línea 8
          text: Tres registros, cada uno con sus dos campos. El arreglo reserva los tres completos.
        - label: Línea 9
          text: Primero el corchete para elegir la fila, después el punto para elegir la columna
        - label: La combinación
          text: Es el arreglo de la semana pasada con el registro de hoy, y ya se parece a una tabla
        - label: Riesgo
          text: El índice sigue sin revisarse. grupo[3] compila igual y lee un registro que no existe.
          accent: true

  - table:
      eyebrow: Comparación
      title: Tres formas de guardar datos, y para qué sirve cada una
      headers: ["Forma", "Qué agrupa", "Cuándo"]
      rows:
        - ["Arreglo", "Muchos del mismo tipo", "Diez calificaciones"]
        - ["Registro", "Pocos de tipos distintos", "Un alumno"]
