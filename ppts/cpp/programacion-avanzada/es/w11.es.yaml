slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Semana 11 · Unidad 9 · Registros
      title: Programación Avanzada
      subtitle: Juntar datos de tipos distintos bajo un mismo nombre, y en qué se parece eso a una clase.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, COM103 · Semestre 2]
        - [Sesión, 11 de 17]
      notes: |
        La sesión es corta de sintaxis y larga de criterio. struct es casi idéntico a class y
        la pregunta interesante es cuándo se usa cada uno.

        En C++ la única diferencia técnica entre struct y class es el nivel de acceso por
        omisión. Todo lo demás es convención, y conviene decirlo así en vez de inventar una
        distinción que el lenguaje no hace.

        Los tamaños y las salidas se midieron en Visual Studio Community 2026. El sizeof del
        registro de dos doubles da 16, que es la suma de sus partes, y conviene advertir que
        eso no siempre ocurre por el relleno de alineación.

        Lectura: Malik, octava edición, capítulo 9. Los documentos del curso citan el 11, que
        es correcto en la quinta edición.

