          desc: Se entrega en la fecha del examen final y vale el 20 por ciento restante

  - lab:
      eyebrow: Laboratorio
      title: Hanoi y un candado, en parejas
      brief: Escriban la solución recursiva de las torres de Hanoi para cinco discos, imprimiendo cada movimiento. Después lancen dos hilos que impriman en paralelo y arreglen la salida entreverada con un mutex.
      blocks:
        - label: Restricción
          text: La parte de Hanoi tiene que ser recursiva, sin ciclos. La de hilos usa jthread.
        - label: Entregable
          text: Un .cpp con las dos partes y una captura de la salida antes y después del candado
        - label: Criterio
          text: Que sepan decir cuántos movimientos hace Hanoi con cinco discos y por qué

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: Sin caso base no hay recursión
          desc: Hay un programa que se queda sin pila y muere, y compila sin una sola advertencia
        - title: Las llamadas se apilan y esperan
          desc: El resultado se arma de regreso, y todas las pendientes ocupan memoria al mismo tiempo
        - title: Lo compartido necesita candado
          desc: Dos hilos sobre el mismo recurso se pisan, y el error aparece dos veces de cada cuatrocientas

