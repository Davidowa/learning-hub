slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Semana 16 · Unidad 14 · Recursión y concurrencia
      title: Programación Avanzada
      subtitle: Una función que se llama a sí misma, dos cosas ocurriendo a la vez, y la logística del tercer parcial.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, COM103 · Semestre 2]
        - [Sesión, 16 de 17]
      notes: |
        Última sesión de contenido. La unidad pide recursión con detalle y multihilos como
        panorama, y el reparto de la sesión respeta esa proporción: dos bloques de recursión
        y uno corto de hilos.

        Todo lo de hilos se comprobó en esta máquina antes de escribirlo. jthread existe en
        el juego de herramientas que trae Visual Studio 2026, las cabeceras compilan con
        /std:c++20 y no hace falta ninguna opción de enlace adicional.

        Una advertencia sobre la demostración de la salida entreverada: sí ocurre, y es
        menos escandalosa de lo que uno espera. En una corrida de cuatrocientas líneas
        salieron dos rotas. Si la van a proyectar, súbanle a cientos de vueltas y adviertan
        que el resultado cambia en cada corrida.

        Malik no tiene capítulo de hilos en ninguna edición. El material de esta parte sale
        de cppreference y de Microsoft Learn.

        Lectura: Malik, octava edición, capítulo 15, para la parte de recursión.

