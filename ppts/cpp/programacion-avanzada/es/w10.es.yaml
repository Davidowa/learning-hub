slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Semana 10 · Unidad 8 · Arreglos y cadenas
      title: Programación Avanzada
      subtitle: Muchos valores del mismo tipo bajo un solo nombre, y el índice que nadie revisa por ti.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, COM103 · Semestre 2]
        - [Sesión, 10 de 17]
      notes: |
        Esta sesión introduce el primer error de C++ que no da ningún mensaje. Salirse de un
        arreglo compila, corre y devuelve un número. Conviene que el grupo lo vea pasar en
        vivo antes de que se los digan.

        El valor que sale al leer fuera de rango cambia en cada corrida y en cada máquina. El
        de la lámina salió de una corrida concreta en Visual Studio Community 2026, y viene
        etiquetado como tal.

        Esta semana cae el segundo avance del proyecto según el calendario del syllabus.

        Lectura: Malik, octava edición, capítulo 8. Los documentos del curso citan el 9, que
        es correcto en la quinta edición.

