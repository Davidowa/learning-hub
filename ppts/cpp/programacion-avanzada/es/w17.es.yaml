meta:
  course: Programación Avanzada
  code: COM103
  lang: es
  language: cpp
  week: 17
  footer: PROGRAMACIÓN AVANZADA · COM103 · C++
  blocks: 2

slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Semana 17 · Cierre · Proyecto integrador
      title: Programación Avanzada
      subtitle: Qué se entrega, cómo se evalúa y qué se espera de la presentación final.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, COM103 · Semestre 2]
        - [Sesión, 17 de 17]

  - agenda:
      eyebrow: Agenda
      title: Tres bloques y las preguntas
      cards:
        - title: Qué se entrega
          desc: Código, documento y presentación, en la fecha del examen final
        - title: Cómo se evalúa
          desc: Los cuatro criterios de la rúbrica y qué mira cada uno
        - title: Errores caros
          desc: Las maneras más comunes de perder puntos sin que el programa falle
        - title: Preguntas
          desc: El resto de la sesión, con el proyecto de ustedes abierto

  - objectives:
      eyebrow: Objetivos de la sesión
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Enumerar los tres entregables
          sub: Y saber cuál de ellos se sube a Blackboard y cuál se presenta en vivo
        - head: Aplicar la rúbrica a su propio proyecto
          sub: Estimando dónde está parado antes de que lo califiquen
        - head: Preparar la presentación
          sub: Sabiendo qué se pregunta y por qué se califica de manera individual
        - head: Cerrar los pendientes técnicos
          sub: Fugas de memoria, archivos sin revisar y validaciones que faltan

  - roadmap:
      eyebrow: Mapa del curso
      title: Dónde estamos en el semestre
      phases:
        - label: 01 · Semanas 1–3
          title: Fundamentos
          desc: Entorno, depuración, tipos, operadores y cadenas
          state: done
        - label: 02 · Semanas 4–6
          title: Funciones y clases
          desc: Modularidad, paso por referencia y abstracción de datos
          state: done
        - label: 03 · Semanas 7–13
          title: Control, datos y memoria
          desc: Ciclos, herencia, arreglos, registros, punteros y archivos
          state: done
        - label: 04 · Semanas 14–17
          title: Genéricos y cierre
          desc: Plantillas, excepciones, recursión, concurrencia y proyecto
          state: now

  - divider:
      eyebrow: Bloque 01
      title: Qué se entrega
      lede: Tres cosas, una fecha, y una de las tres no se sube a ningún lado.
      block: 1

  - tiers:
      eyebrow: Entregables
      title: Tres, y ninguno sustituye a los otros
      items:
        - key: '01'
          title: El código
          desc: Comprimido, sin la carpeta x64 ni ejecutables. Lo sube un integrante por equipo.
        - key: '02'
          title: El documento
          desc: En PDF o DOCX. Explica el problema, el diseño y las decisiones que tomaron.
        - key: '03'
          title: La presentación oral
          desc: En vivo, en la fecha del examen final. No se sube, se defiende.

  - table:
      eyebrow: Evaluación
      title: La rúbrica, tal como está en el syllabus
      headers: ["Criterio", "Peso", "Qué mira"]
      rows:
        - ["Correctitud", "40 %", "Que haga lo que promete, y que aguante entradas malas"]
        - ["Diseño", "25 %", "Clases con una responsabilidad, funciones cortas"]
        - ["Eficiencia", "20 %", "Uso de memoria, y ninguna fuga"]
        - ["Documentación", "15 %", "El documento y la presentación"]

  - method:
      eyebrow: Criterio
      title: Cómo revisar su propio proyecto antes de entregarlo
      statement: La manera más barata de subir la calificación es correr la rúbrica ustedes mismos, con el proyecto abierto, una semana antes de la fecha.
      points:
        - label: Para la correctitud
          text: Denle entradas vacías, negativas, y del tipo equivocado. Si truena, ahí falta un if.
        - label: Para el diseño
          text: Busquen la función más larga. Si no cabe en una pantalla, casi siempre son dos funciones.
        - label: Para la memoria
          text: Cuenten los new y los delete. Si no dan el mismo número, hay una fuga que encontrar.

  - divider:
      eyebrow: Bloque 02
      title: La presentación
      lede: Se califica de manera individual aunque el trabajo haya sido en equipo. Eso no es una amenaza, es cómo se reparte el crédito con justicia.
      block: 2

  - concept:
      eyebrow: Concepto clave
      title: El trabajo es en equipo y la calificación es de cada quien
      lead: >-
        Todos los integrantes tienen que poder explicar cualquier parte del proyecto, no
        solo la que escribieron. Si alguien no puede sostener una decisión de diseño de su
        propio programa, eso se refleja en su calificación y no en la de los demás.
      panel:
        label: Lo mismo que se dijo en la semana 0
        title: Leer el código en voz alta no es explicarlo
        note: >-
          La pregunta no va a ser qué hace esta línea. Va a ser por qué está escrita así y
          qué habría pasado de la otra manera.
      steps:
        - text: Todos conocen todo el proyecto
        - text: Cada quien defiende lo que entrega
        - text: La nota es individual
          loop: ↺ repartan la explicación, no solo el trabajo

  - steps:
      eyebrow: La sesión final
      title: Cómo va a ser la presentación, en cinco pasos
      items:
        - label: Paso 01
          title: El problema
          desc: Qué resuelve el programa, en una frase, sin hablar todavía de código
        - label: Paso 02
          title: El diseño
          desc: Qué clases hay y por qué esas. Aquí va el diagrama del documento.
        - label: Paso 03
          title: La demostración
          desc: El programa corriendo, incluida una entrada mala a propósito
        - label: Paso 04
          title: Una decisión
          desc: Algo que estuvo entre dos opciones, y por qué eligieron la que eligieron
        - label: Paso 05
          title: Preguntas
          desc: Dirigidas a cualquier integrante, sobre cualquier parte del proyecto

  - pitfalls:
      eyebrow: Diagnóstico
      title: Cuatro maneras de perder puntos con el programa funcionando
      items:
        - label: Error 01
          title: Entregar con la carpeta x64
          desc: El antivirus bloquea el comprimido, la entrega no se puede abrir y la fecha ya pasó
        - label: Error 02
          title: Todo el código en main
          desc: El programa puede funcionar perfecto y aun así perder la cuarta parte de la nota
        - label: Error 03
          title: Fugas de memoria
          desc: No se ven al correr, se ven al revisar el código, y ahí está el veinte por ciento
        - label: Error 04
          title: Un integrante que solo conoce su parte
          desc: La calificación es individual, así que eso le baja a esa persona y no al equipo

  - table:
      eyebrow: Fechas
      title: Lo que queda del semestre
      headers: ["Qué", "Cuándo", "Dónde"]
      rows:
        - ["Tercer parcial", "Martes 17 de noviembre", "En clase"]
        - ["Código y documento", "Fecha del examen final", "Blackboard"]
        - ["Presentación oral", "Fecha del examen final", "En clase"]

  - takeaways:
      eyebrow: Resumen
      title: Tres ideas para llevarse
      items:
        - title: La correctitud pesa casi la mitad
          desc: Y no es solo que funcione, es que aguante una entrada que nadie esperaba
        - title: La memoria vale el veinte por ciento
          desc: Cuenten los new contra los delete antes de entregar, es lo más barato de arreglar
        - title: La nota es individual
          desc: Todos tienen que poder explicar cualquier parte, no nada más la que escribieron

  - closing:
      title: Gracias
      subtitle: Diecisiete semanas, catorce unidades y un lenguaje que tiene cuarenta años y sigue cambiando.
      meta:
        - [Correo, descobarc@up.edu.mx]
        - [Mensajería, Google Chat institucional]
        - [Entregas, Blackboard]
