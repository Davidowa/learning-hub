slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Semana 06 · Unidad 5 · Clases y abstracción de datos
      title: Programación Avanzada
      subtitle: Juntar los datos con las funciones que los cuidan, y decidir qué se ve desde fuera de la clase.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, COM103 · Semestre 2]
        - [Sesión, 6 de 17]
      notes: |
        Cierra el bloque de funciones y clases. Es la última sesión antes de las estructuras
        de control, así que todo el código de hoy sigue siendo de flujo recto: constructores
        que asignan, accesores que devuelven, funciones miembro sin ramas.

        Esa limitación se nota más aquí que en las semanas anteriores, porque el ejemplo
        natural de un mutador es uno que valida su argumento, y validar necesita un if. Vale
        la pena decirlo en voz alta cuando alguien lo pregunte, y anotarlo como lo que se
        agrega en la semana 7.

        Los resultados numéricos se midieron compilando el programa de la lámina en Visual
        Studio Community 2026. El área da 12 y, después del mutador, 20.

        En esta semana cae el primer avance del proyecto según el calendario del syllabus.
        El proyecto todavía no se asigna, eso ocurre después del primer parcial, así que el
        avance se refiere al calendario de revisiones y no a una entrega del proyecto.

        Lectura: Malik, octava edición, capítulo 10. Los documentos del curso citan el 12,
        que es correcto en la quinta edición.

  - agenda:
      eyebrow: Agenda
      title: Cuatro bloques de trabajo
      cards:
        - title: Por qué una clase
          desc: Qué problema resuelve juntar los datos con su comportamiento
        - title: Anatomía
          desc: Miembros de datos, funciones miembro y el constructor
        - title: Qué se ve
          desc: Los tres niveles de acceso, y quién puede llegar a cada uno
        - title: La interfaz
          desc: Accesores y mutadores, y qué promete una clase a quien la usa

  - objectives:
      eyebrow: Objetivos de aprendizaje
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Declarar una clase con estado
          sub: Con sus miembros de datos privados y sus funciones miembro públicas
        - head: Escribir un constructor
          sub: Y explicar por qué corre solo, sin que nadie lo llame por su nombre
        - head: Elegir el nivel de acceso
          sub: Y decir quién puede llegar a un público, a un protegido y a un privado
        - head: Diseñar una interfaz mínima
          sub: Exponiendo lo que la clase promete sostener y escondiendo lo que puede cambiar

  - roadmap:
      eyebrow: Mapa del curso
      title: Dónde estamos en el semestre
      phases:
        - label: 01 · Semanas 1–3
          title: Fundamentos
          desc: Entorno, depuración, tipos, operadores y cadenas
          state: done
        - label: 02 · Semanas 4–6
          title: Funciones y clases
          desc: Modularidad, paso por referencia y abstracción de datos
          state: now
        - label: 03 · Semanas 7–13
          title: Control, datos y memoria
          desc: Ciclos, herencia, arreglos, registros, punteros y archivos
