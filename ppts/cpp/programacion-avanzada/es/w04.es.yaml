slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Semana 04 · Unidad 3 · Funciones definidas por el usuario I
      title: Programación Avanzada
      subtitle: Partir un programa en piezas con nombre, que se prueban por separado y se corrigen sin tocar el resto.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, COM103 · Semestre 2]
        - [Sesión, 4 de 17]
      notes: |
        Primera sesión del bloque de funciones y clases. Hasta hoy todo cabía en main, y a
        partir de aquí eso deja de ser una opción razonable.

        Sigue sin haber estructuras de control. Son la unidad 6 y llegan en la semana 7, así
        que todas las funciones de hoy tienen una sola ruta de arriba abajo, sin ramas. Es
        una limitación real al escribir los ejemplos, y también la razón por la que las
        funciones de hoy se entienden completas de una lectura.

        El bloque de errores del compilador que aparece en la diapositiva del prototipo
        faltante es real y está recortado. La corrida completa en Visual Studio Community
        2026 entregó treinta y tres líneas por un solo identificador mal puesto.

        Lectura: Malik, octava edición, capítulo 6.

  - agenda:
      eyebrow: Agenda
      title: Cuatro bloques de trabajo
      cards:
        - title: Por qué partir
          desc: Qué gana un programa cuando deja de ser una sola pieza
        - title: Anatomía
          desc: Prototipo, definición y llamada, y para qué sirve cada uno
        - title: El primer error
          desc: Qué pasa cuando el compilador encuentra un nombre que no conoce
        - title: Lo local
          desc: Dónde vive una variable declarada dentro de una función, y hasta cuándo

  - objectives:
      eyebrow: Objetivos de aprendizaje
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Descomponer un problema en funciones
          sub: Con una responsabilidad clara cada una, y un nombre que la anuncie
        - head: Escribir prototipo y definición
          sub: Y explicar por qué el compilador necesita el primero antes de ver el segundo
        - head: Distinguir parámetro de argumento
          sub: Lo que la función declara recibir frente al valor concreto con el que se llama
        - head: Reconocer el alcance de una variable local
          sub: Y predecir el error que sale al usarla fuera de la función donde se declaró

