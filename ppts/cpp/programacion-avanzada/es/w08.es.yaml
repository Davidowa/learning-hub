  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Semana 08 · Unidad 6 · Estructuras de control II
      title: Programación Avanzada
      subtitle: Los tres ciclos, cuándo conviene cada uno, y la logística del primer parcial.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, COM103 · Semestre 2]
        - [Sesión, 8 de 17]
      notes: |
        Sesión doble. Se cierra la unidad 6 con repetición y se cierra el bloque del primer
        parcial. No es una sesión de repaso: el tema nuevo se enseña completo y la logística
        va al final.

        El parcial es acumulativo. Cubre desde la unidad 1 hasta la 6, que es todo lo visto
        hasta hoy, y conviene decirlo con esas palabras. La tabla de calificaciones del
        syllabus dice "acumulativo" para los tres parciales, no lista unidades por parcial.

        Todas las salidas de los ciclos se midieron compilando cada fragmento tal como
        aparece, en Visual Studio Community 2026. El do-while con la condición falsa desde
        el principio imprime una vez, y esa corrida está en la lámina.

        Lectura: Malik, octava edición, capítulo 5.

