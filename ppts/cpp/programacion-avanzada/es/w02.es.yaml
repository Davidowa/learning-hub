slides:
  - cover:
      kicker: Facultad de Ingeniería · 2026
      unit: Semana 02 · Unidad 1 · Elementos básicos de C++
      title: Programación Avanzada
      subtitle: Cómo se declara un valor, qué hacen los operadores con él, y por qué la máquina contestó 63 cuando esperabas 63.5.
      meta:
        - [Profesor, David Escobar-Castillejos]
        - [Clave, COM103 · Semestre 2]
        - [Sesión, 2 de 17]
      notes: |
        La sesión cierra la unidad 1. Lo que quedó abierto la semana pasada, la división que
        dio 63, se resuelve en el bloque 3 y conviene anunciarlo desde el principio para que
        el grupo espere la respuesta.

        Todos los resultados numéricos de este deck se midieron compilando en Visual Studio
        Community 2026, juego de herramientas 14.51. El valor de la variable sin inicializar
        cambia en cada corrida y en cada máquina; el 237 de la diapositiva es lo que salió
        una vez, no un número que se pueda prometer.

        Todavía no existen if ni ciclos. Las estructuras de control son la unidad 6 y llegan
        hasta la semana 7, así que todo el código de hoy es de flujo recto. Si alguien
        pregunta cómo se valida que el promedio sea mayor que siete, la respuesta honesta es
        que falta una herramienta y llega en cinco semanas.

        Lectura: Malik, octava edición, capítulo 2.

  - agenda:
      eyebrow: Agenda
      title: Cuatro bloques de trabajo
      cards:
        - title: Nombres y valores
          desc: Declarar, inicializar, y la diferencia entre las dos cosas
        - title: Operadores
          desc: Los cinco aritméticos completos, la precedencia y los compuestos
        - title: Incremento
          desc: Por qué el mismo operador da dos resultados según dónde se escribe
        - title: Conversión
          desc: Qué pasa cuando dos tipos distintos se encuentran en la misma línea

  - objectives:
      eyebrow: Objetivos de aprendizaje
      title: Al terminar la sesión el alumno podrá…
      items:
        - head: Declarar e inicializar correctamente
          sub: Y explicar por qué leer una variable sin inicializar no da cero sino cualquier cosa
        - head: Predecir el resultado de una expresión
          sub: Aplicando la precedencia en el orden que usa el lenguaje, no en el orden de lectura
        - head: Distinguir el incremento prefijo del sufijo
          sub: Y decir qué valor entrega cada uno a la expresión que lo rodea
        - head: Controlar la conversión de tipos
          sub: Reconocer la implícita cuando ocurre sola y forzar la explícita con static_cast

  - roadmap:
      eyebrow: Mapa del curso
      title: Dónde estamos en el semestre
      phases:
        - label: 01 · Semanas 1–3
          title: Fundamentos
          desc: Entorno, depuración, tipos, operadores y cadenas
          state: now
        - label: 02 · Semanas 4–6
