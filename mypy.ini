# Type checking for this repository.
#
# Without this file mypy runs with its defaults, and its default is to treat a
# third-party package that ships no type stubs as an error. That is what paints
# ppts/kit/preflight.py red for `import yaml`, and every script under
# docs/en/courses/python-course/06 - Advanced red for pandas, matplotlib and
# seaborn. Nothing is wrong with those files: they run, and the checks in
# ppts/kit pass on all of them.
#
# The packages below are either teaching dependencies or build tooling. None of
# them is worth stubbing, so the missing stubs stop being errors. Real mistakes
# in our own code are still reported.
#
# If you do want proper type information for pandas and PyYAML, both have stub
# packages and installing them costs nothing:
#     pip install pandas-stubs types-PyYAML

[mypy]
python_version = 3.14
ignore_missing_imports = False
exclude = (?x)(
    ^\.mypy_cache/
  | ^docs/en/courses/python-course/07 - Activities/
  )

# Build tooling for the slide decks.
[mypy-yaml.*]
ignore_missing_imports = True

[mypy-pptx.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-fontTools.*]
ignore_missing_imports = True

# Course dependencies: the data modules and the GUI module.
[mypy-pandas.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-seaborn.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-PyQt6.*]
ignore_missing_imports = True

# Local modules the lessons import from a sibling file, which only resolve when
# the script is run from its own folder.
[mypy-ecommerce.*]
ignore_missing_imports = True

[mypy-sales]
ignore_missing_imports = True
