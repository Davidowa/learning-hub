  caption: The name takes no spaces; Store macro in decides which workbook keeps the
    code.
  guards:
    dark_max: 0.99
    edge: false
- name: scenario-manager
  win:
    open:
      ribbon:
      - Data
      - What-If Analysis
      - Scenario Manager...
  mac:
    open:
      menu:
      - Tools
      - Scenarios...
    title: Scenario Manager
    verify: on a Mac
  expect:
    title: Scenario Manager
  alt: The Excel Scenario Manager dialog on a sheet with no scenarios, with Add available
    and the other buttons greyed out.
  caption: Show, Delete, Edit and Summary stay greyed until the first scenario exists.
  guards:
    dark_max: 0.99
    edge: false
- name: sort-dialog
  win:
    setup:
    - cells:
        at: A1
        rows: *id001
    - select: A1:C4
    open:
      ribbon:
      - Data
      - Sort...
  mac:
    setup:
    - cells:
        at: A1
        rows: *id001
    - select: A1:C4
    open:
      menu:
      - Data
      - Sort...
