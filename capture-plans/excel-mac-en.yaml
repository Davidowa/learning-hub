    setup:
    - cells:
        at: A1
        rows:
        - - Region
        - - North
        - - South
        - - East
    - select: A1:A4
    open:
      ribbon:
      - Data
      - Text to Columns...
  mac:
    setup:
    - cells:
        at: A1
        rows:
        - - Region
        - - North
        - - South
        - - East
    - select: A1:A4
    open:
      menu:
      - Data
      - Text to Columns...
