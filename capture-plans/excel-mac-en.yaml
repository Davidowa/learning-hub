        rows: &id004
        - - Region
          - Rep
          - Units
          - Revenue
        - - East
          - Carla
          - 250
          - 10000
        - - East
          - Dana
          - 300
          - 12000
        - - East
          - Eli
          - 210
          - 8400
        - - North
          - Ana
          - 320
          - 12800
        - - North
          - Bruno
          - 240
          - 9600
        - - South
          - Beto
          - 410
          - 16400
        - - South
