  expect:
    title: Convert Text to Columns Wizard - Step 1 of 3
  alt: Step 1 of 3 of the Convert Text to Columns Wizard, with Delimited selected,
    Fixed width as the other choice, and a preview of the selected data.
  caption: Step 1 picks how the fields are separated; steps 2 and 3 set the delimiter
