    dark_max: 0.99
    edge: false
- name: vbe-editor
  kind: vbe
  win:
    setup:
    - vba_module:
        name: Module1
        code: ''
    open:
      vbe: true
    paste_code: &id005
      module: Module1
      code: 'Sub FormatHeader()

        Range("A1:B1").Select

        Selection.Font.Bold = True

        Selection.Interior.Color = 15773696

        End Sub

        '
    notes: needs doctor --enable-vbom (the module is added through VBProject); the
      code goes in through the clipboard, never SendKeys (failure mode 3)
  mac:
    open:
      vbe: true
    verify: on a Mac; the VBE on a Mac opens separate windows, and this captures the
      code window
    setup:
    - save_as: xlsx
    paste_code: *id005
  expect:
    title_contains: Book1
  alt: The Visual Basic editor in Excel for Mac, with FormatHeader in a standard module.
  caption: Project Explorer, Properties and a code window are visible in the Visual
    Basic editor for Mac.
  guards:
    dark_max: 0.99
    edge: false
